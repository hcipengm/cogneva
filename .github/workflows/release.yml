name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with RUST_TOOLCHAIN in the root Dockerfile — the
          # committed Cargo.lock contains crates requiring rustc >= 1.91.
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        # prost-build (etcd-client) shells out to protoc during the build.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        # --locked: resolve from the committed Cargo.lock; fresh resolution
        # pulls crate releases that may require a newer rustc than pinned.
        run: cargo build --workspace --release --locked

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/cogneva
            target/release/*.so
            target/release/*.dll
            target/release/*.dylib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/cogneva
            target/release/*.so
            target/release/*.dll
            target/release/*.dylib
          generate_release_notes: true

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  gitee-release:
    name: Mirror Release to Gitee
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('body') or '')" || true)
          [ -z "$BODY" ] && BODY="版本 $TAG 已发布，亮点说明见 GitHub Release。"
          PAYLOAD=$(TAG="$TAG" BODY="$BODY" GITEE_TOKEN="$GITEE_TOKEN" python3 -c "import json,os; print(json.dumps({'access_token': os.environ['GITEE_TOKEN'], 'tag_name': os.environ['TAG'], 'name': os.environ['TAG'], 'body': os.environ['BODY']}))")
          HTTP=$(curl -s -o /tmp/gitee_release.json -w "%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/hcipengm/cogneva/releases" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          if [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ]; then
            echo "Gitee release created for $TAG"
          else
            echo "POST returned $HTTP, trying update (release may already exist)"
            cat /tmp/gitee_release.json
            RID=$(python3 -c "import json; print(json.load(open('/tmp/gitee_release.json')).get('id',''))" 2>/dev/null || true)
            if [ -n "$RID" ]; then
              curl -sf -X PATCH "https://gitee.com/api/v5/repos/hcipengm/cogneva/releases/$RID" \
                -H "Content-Type: application/json" -d "$PAYLOAD" && echo "Gitee release updated"
            fi
          fi
