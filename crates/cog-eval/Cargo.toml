[package]
name = "cog-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# 检查点的独占权：flock 由内核在进程退出时放开，正是续跑要接上的场合，而
# `std` 里那个同义 API 的 MSRV 比本工作区声明的高。
libc = "0.2"

# Statistical testing
statrs = "0.17"

# Report generation
comfy-table = "7"

# Text similarity for semantic metrics
strsim = "0.11"

# LLM-as-a-Judge structured output
schemars = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
