[package]
name = "cog-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
base64 = "0.22"
schemars = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
# `start_paused` on background-loop tests: a loop whose interval is clamped to
# 30s cannot be driven through two ticks in real time. Feature unification does
# not reach here from another crate's dev-dependencies, so it is named here.
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"
tempfile = "3"
cog-test-support = { path = "../cog-test-support" }
