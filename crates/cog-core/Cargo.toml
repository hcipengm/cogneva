[package]
name = "cog-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
bytes = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
blake3 = { workspace = true }
# 平台机器人签名（`contract::platform_sign`）：两个进程要用同一条规则，规则在契约
# 层；密钥各自持有。三者都只是算法原语，与 blake3 同一类。
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
regex = "1.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `start_paused` 只在这个 crate 自己的测试里用。工作区里别的 crate 打开了它，
# 所以整树 `cargo test` 一直是绿的，而 `cargo test -p cog-core` 单跑编译不过——
# 一个 crate 的测试必须是能单独跑的测试。
tokio = { workspace = true, features = ["test-util"] }
