[package]
name = "cog-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }
cog-protocol = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-native-tls"] }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
zstd = { workspace = true }
redis = { workspace = true, optional = true }
etcd-client = "0.14"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"

# Optional dependencies
qdrant-client = { version = "1.10", optional = true }
meilisearch-sdk = { version = "0.24", optional = true }
livekit-api = { version = "0.3", optional = true }
aws-sdk-s3 = { version = "1.0", optional = true }
async-nats = { version = "0.35", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["postgres", "redis", "qdrant", "s3", "mem"]

# Relational storage
postgres = ["sqlx/postgres"]
tidb = ["sqlx/mysql"]
neon = ["sqlx/postgres"]

# Vector storage
qdrant = ["dep:qdrant-client"]

# Cache / state / hot trace tier
redis = ["dep:redis"]

# Object storage / cold trace tier
s3 = ["dep:aws-sdk-s3"]
minio = ["s3"]

# Full-text search
meilisearch = ["dep:meilisearch-sdk"]

# Event streaming
jetstream = ["dep:async-nats"]

# Media / WebRTC
livekit = []

# In-memory implementations for testing
mem = []

[[bin]]
name = "cog-migrate"
path = "src/migrate/main.rs"
