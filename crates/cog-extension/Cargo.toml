[package]
name = "cog-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wasm", "rhai"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
rhai = ["dep:rhai"]

[dependencies]
cog-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
urlencoding = "2.1"

# Signature verification (ed25519)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# File walking for local discovery
walkdir = "2"

# YAML parsing for manifests
serde_yaml = "0.9"

# Hex encoding for signature verification
hex = "0.4"

# WASM runtime (feature-gated)
wasmtime = { version = "29.0", optional = true }
wasmtime-wasi = { version = "29.0", optional = true }

# Rhai embedded scripting (feature-gated)
rhai = { version = "1.21", optional = true, features = ["sync", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
