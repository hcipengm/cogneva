[package]
name = "cog-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }
# 厂商兼容画像（`detect_compat`）单源：调用方连的是网关，base URL 里没有
# 厂商身份，只有网关知道真实上游。这里复用 cog-llm 的同一张表，而不是在网关
# 另写一份按域名的映射——两份定义必然漂移，且两边都看不出来。
cog-llm = { workspace = true }
cog-redis = { workspace = true }
cog-storage = { workspace = true }
# 横切关注点：网关是上游池健康的唯一掌握者，指标/日志/时序/告警四类
# 落盘复用 cog-observability 既有设施（无环：observability 只依赖 core）。
cog-observability = { workspace = true }
# 观测导出（Loki/ClickHouse）需要 cog_core::HttpClient，复用既有 reqwest 实现。
cog-net = { workspace = true }

axum = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }
base64 = "0.22"
argon2 = { workspace = true }
async-trait = "0.1"
reqwest = { workspace = true }
regex = "1.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# RS256 JWT minting for the GitHub App identity (installation token exchange).
jsonwebtoken = { workspace = true }
# Ed25519 SSH keypair for the contribution channel (pubkey auto-upload).
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = "0.6"
# 私钥只以权限受限的临时文件交给 git 使用（git 身份自举的自证握手）。
tempfile = "3"
# SIGKILL 到进程组：git 兜底传输是一条 `git → sh → ssh → 远端` 的链，超时只杀
# 直接子进程会留下仍在写镜像的孙进程（见 git_mirror 的传输看门狗）。
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio-test = "0.4"
redis = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
