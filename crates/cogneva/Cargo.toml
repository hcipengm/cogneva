[package]
name = "cogneva"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Every test file is a module of `tests/suite.rs` rather than a binary of its
# own: one link of the assembly instead of two hundred. The files that cannot
# share a process -- one writes a process-global variable, four carry
# `#[ignore]`d cases CI runs against a live database -- are declared below and
# the reason is read back off the file by `the_suite_and_the_directory_agree`.
autotests = false

[lib]
name = "cogneva"
path = "src/lib.rs"

[[bin]]
name = "cogneva"
path = "src/main.rs"

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "backup_pg"
path = "tests/backup_pg.rs"

[[test]]
name = "ignored_test_corpus_contract_test"
path = "tests/ignored_test_corpus_contract_test.rs"

[[test]]
name = "memory_decay_plugin_test"
path = "tests/memory_decay_plugin_test.rs"

[[test]]
name = "store_derived_reading"
path = "tests/store_derived_reading.rs"

[[test]]
name = "swe_pro_container"
path = "tests/swe_pro_container.rs"

[dependencies]
cog-core = { workspace = true }
cog-llm = { workspace = true }
cog-agent = { workspace = true }
cog-collaboration = { workspace = true }
cog-orchestrator = { workspace = true }
cog-auth = { workspace = true }
cog-quota = { workspace = true }
cog-wiki = { workspace = true }
cog-storage = { workspace = true, features = ["livekit", "meilisearch"] }
cog-stream = { workspace = true }
cog-memory = { workspace = true }
cog-observability = { workspace = true }
cog-notification = { workspace = true }
cog-net = { workspace = true }
cog-prompt = { workspace = true }
cog-extension = { workspace = true }
cog-skill = { workspace = true }
cog-guardrail = { workspace = true }
cog-eval = { workspace = true }
cog-reflection = { workspace = true }
cog-protocol = { workspace = true }
cog-gateway = { workspace = true }
cog-supervisor = { workspace = true }
cog-github = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
# The eval-table subcommand: its own error type, and the hash it re-measures under the pins
# it was handed (a pin that is not checked against the bytes on disk is just a label).
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
redis = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = "5"
sd-notify = "0.4"
notify = "6"
futures = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tonic = { workspace = true }
base64 = "0.22"
rustls = { workspace = true }
# 备份恢复子命令：包格式 tar.zst、Qdrant 快照走 REST multipart。
reqwest = { workspace = true, features = ["multipart"] }
tar = "0.4"
zstd = { workspace = true }
# 包级加密：ChaCha20-Poly1305 与 HKDF 都用 ring 的现成实现，不自己拼密码学。
# 版本跟着 rustls 已经拉进 Cargo.lock 的那一份走，不额外引入新的加密后端。
ring = "0.17"
# 评测那一列要读上游那份 `configs/mcp_servers/*.yaml`，而读它的是**发布**路径
# （起容器里的 MCP server），不是测试——放在 dev-dependencies 里只有测试 profile 编译得过，
# `cargo build` 会红。
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
cog-test-support = { path = "../cog-test-support" }
tempfile = "3"
filetime = "0.2"
async-trait = "0.1"
# The delivery-manifest contract test reads workloads, containers and volume
# mounts out of the manifests as objects, not as text.
# (`serde_yaml` itself lives in [dependencies]: the eval path needs it too.)
