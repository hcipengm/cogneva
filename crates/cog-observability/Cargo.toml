[package]
name = "cog-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }
# 只为 `schema_ddl::apply`：建表与建索引的语句要在启动时跑，而等待锁必须有界，
# 否则这个进程启动时会把还在服务的旧副本排在自己后面。存储层不反向依赖本 crate，
# 而依赖本 crate 的三个 crate 本来就都依赖存储层，所以这条边不加编译量、不成环。
cog-storage = { workspace = true }

prometheus = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
base64 = "0.22"
libc = "0.2"

# Email (SMTP) for AlertManager — alerts.rs Email channel
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

[dev-dependencies]
cog-test-support = { path = "../cog-test-support" }
tokio-test = "0.4"
