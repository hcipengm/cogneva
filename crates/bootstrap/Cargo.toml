[package]
name = "cogneva-bootstrap"
description = "Meta-bootstrap installer: probes hardware, installs K3s/K8s dependencies, deploys Cogneva manifests, then self-destructs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
cog-core = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# 单测里的字面量读法只有 `cog-test-support` 那一份；产物不链接它
# （`crate_dependency_contract_test` 判「正常依赖指向它」为 linked into the artifact）。
cog-test-support = { path = "../cog-test-support" }
