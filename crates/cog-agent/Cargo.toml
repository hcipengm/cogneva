[package]
name = "cog-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }

async-trait = "0.1"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Raw-source payloads are arbitrary bytes; a non-text one reaches a tool caller
# base64-encoded so no byte is lost in the JSON result.
base64 = "0.22"
uuid = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# The inbox reply tests read their answer back through a real message backend;
# a hand-written double would only prove the double agrees with itself.
cog-stream = { path = "../cog-stream" }
tempfile = "3"
# 断言「这一行读数到了采集面」要按**字段值**读它，不是断言「打过日志」——
# 与 cog-memory 的落库读数同一条纪律，所以这里也直接装一层捕获。
tracing-subscriber = { workspace = true }

