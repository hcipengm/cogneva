[package]
name = "cog-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cog-core = { workspace = true }

async-trait = "0.1"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Raw-source payloads are arbitrary bytes; a non-text one reaches a tool caller
# base64-encoded so no byte is lost in the JSON result.
base64 = "0.22"
uuid = { workspace = true }
futures = { workspace = true }
# 数字员工的名字由机器指纹哈希得出，需要确定性哈希。
sha2 = { workspace = true }
hex = { workspace = true }
# 网页抓取：地址解析（scheme/host 的公共性判断）用成熟的 URL 解析器，正文抽取
# 用 readability 算法的实现；两件都是纯函数，无网络、无 IO，测试可离线跑。
url = "2"
dom_smoothie = { version = "0.18", default-features = false }

[dev-dependencies]
# The inbox reply tests read their answer back through a message backend that
# implements the core contract. The fixture layer owns that implementation: the
# answer is judged against the contract, not against one crate's backend.
cog-test-support = { path = "../cog-test-support" }
tempfile = "3"
# 断言「这一行读数到了采集面」要按**字段值**读它，不是断言「打过日志」——
# 与 cog-memory 的落库读数同一条纪律，所以这里也直接装一层捕获。
tracing-subscriber = { workspace = true }

