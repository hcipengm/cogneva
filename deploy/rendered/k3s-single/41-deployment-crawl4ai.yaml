# 网页抓取的渲染后端：集群内自建的 Crawl4AI。
#
# 为什么需要一个真浏览器：`web_fetch` 在本进程里读 HTML 只能拿到服务器发的字节。
# 客户端渲染的页面（SPA、无限滚动、前端拼出来的文章）那些字节里没有正文——脚本
# 跑完才有。于是本进程读回来的是「页头 + 空容器」，而它和「这一页本来就没写什么」
# 在返回的结构里同形，调用方无从分辨。渲染后端把这一层补上：它开浏览器、等网络
# 空闲、把 DOM 折成 Markdown 再交回来。
#
# 为什么自建而不是买：抓取是 agent 每回合都可能调的动作，按次计费的服务端抓取
# 工具会把「读一下这一页」变成账单上的行。Crawl4AI 是 Apache-2.0，一个 Deployment
# 一个进程；不上 Firecrawl 自建版那一套（api + playwright + redis 三个容器、AGPL）。
#
# 它只被集群内的工具调用：没有 Ingress，Service 只在命名空间内可达。它**有**公网
# 出站（真浏览器要打开被访问的页面），所以出站面用 ipBlock 的 except 把集群网段、
# 回环、链路本地与 CGNAT 全排除——见本文件末尾的策略。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
  namespace: cogneva
  labels:
    app.kubernetes.io/name: crawl4ai
    app.kubernetes.io/component: fetch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crawl4ai
      app.kubernetes.io/component: fetch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawl4ai
        app.kubernetes.io/component: fetch
    spec:
      # 不挂 token：本 Pod 不持有任何凭证（它要访问的页面都是公开地址）。
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crawl4ai
          image: docker.io/unclecode/crawl4ai:0.7.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11235
              protocol: TCP
          volumeMounts:
            # Chromium 把共享内存当工作区用。默认的 64MiB 在中等页面上就会让渲染
            # 进程崩掉，而崩掉从外面看是「抓取超时」——读起来像对面站点慢。给
            # 一块 tmpfs（大小取 values 的 shmSize，默认 1Gi），随 Pod 走，不需要
            # 活过重启。
            - name: shm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            # Chromium 在容器里以 `--no-sandbox` 跑（镜像自己加的），不需要任何
            # capability；剥掉全部能力不影响它起浏览器。
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 2000m
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
