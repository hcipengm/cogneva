# Source: helm chart deploy/helm/cogneva + profiles/k3s-single.yaml
# Change chart templates / values / profile, then re-run render-deploy.sh.
# Source: cogneva/templates/db-role-bootstrap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-db-role-bootstrap
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/instance: cogneva
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.5.10"
    app.kubernetes.io/component: database-bootstrap
data:
  db-role-bootstrap.sh: |
    #!/bin/sh
    # 业务连库的角色不是实例的超级用户。
    #
    # 这一步把三个受限角色做实：
    #   cog_app    —— 业务 Pod 连库用的那个。建角色、设口令、把 cogneva 库里现有对象的
    #                 所有权从超级用户挪到它名下、给它 public 上的 CREATE。
    #   cog_backup —— 备份演练连源库用的那个。它要在同一台服务器上建一个一次性库，
    #                 所以带 CREATEDB；要逐表比对行数，所以要能读全部表；要回写自己
    #                 那一行结果，所以要对 backup_drills 有写权。
    #   cog_test   —— 树的变更验证连测试库用的那个（见文件末尾的 cogneva_test）。它要
    #                 CREATEDB 与 CREATEROLE，因为 `backup_pg` 那几条用例的题目就是
    #                 「没有超权位的角色能不能把包恢复回一台新库」：它们自己建库、自己
    #                 建一个受限角色再删掉。CI 里这些用例连的是一次性容器里的超级用户，
    #                 沙箱里没有那个位置，所以给它的是这两项而不是超权位——它能动的
    #                 只有自己建的库与角色，读不到 cogneva 里任何一行。
    #
    # 超权位收不掉，这一条要写明白：`cog_user` 是 initdb 建出来的那个角色
    # （`POSTGRES_USER`），PostgreSQL 16 起**不许任何人**把它降成 NOSUPERUSER——
    # 2026-11-01 实测，用另一个超级用户去降也一样，报
    # `permission denied to alter role / The bootstrap user must have the SUPERUSER
    # attribute`。原因是它同时是 `postgres --single` 唯一能进的那个人，抬不回来的
    # 代价比留着它更大。所以这里的目标不是「零超权角色」，而是**没有任何工作负载连它**：
    # 业务与备份导出在 cog_app，备份演练在 cog_backup（后者原先连的是 cog_user），
    # cog_user 的口令不再注入任何 Pod，它只剩单用户恢复那一条路。
    #
    # 为什么所有权必须挪而不能只 GRANT：分区维护要 DETACH/ATTACH 默认分区，那是
    # 表属主才有的权限，GRANT 给不出来；而把 cog_app 授成超级用户那个角色的成员
    # 更不行——成员可以 SET ROLE 过去，超权原样递过去，等于没做。
    #
    # 幂等：角色存在就不再建，对象已经不在 cog_user 名下就不会被这个循环读到。
    # 每一步失败即停（ON_ERROR_STOP），因为半途停下的结果要么是口令没设、要么是
    # 一半对象还挂在超级用户名下，两者都不该被当成「做完了」。
    
    set -eu
    
    : "${APP_PASSWORD:?app-password must be injected}"
    : "${BACKUP_PASSWORD:?backup-password must be injected}"
    : "${TEST_PASSWORD:?test-password must be injected}"
    : "${PGHOST:?}"
    
    attempt=0
    until pg_isready -q -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 120 ]; then
        echo "postgres never became ready; the role cannot be bootstrapped" >&2
        exit 1
      fi
      sleep 2
    done
    
    # 第二件要等的事：`public.backup_drills` 出现。新装机上这个 Job 与业务 Pod 同时起步，
    # 而 GRANT 只能授已经存在的表——那句授早了会在第一次演练的凌晨变成一行
    # `permission denied for table backup_drills`，演练记不下自己那一行就证明不了任何事。
    # 等的是「迁移跑完了」，不是「库起来了」：上面那个 pg_isready 只回答后者。
    attempt=0
    until [ "$(psql -tAqc "select to_regclass('public.backup_drills') is not null")" = t ]; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 120 ]; then
        echo "public.backup_drills never appeared; the backup role cannot be granted on it" >&2
        exit 1
      fi
      sleep 2
    done
    
    psql -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" -v backup_password="$BACKUP_PASSWORD" \
      -v test_password="$TEST_PASSWORD" \
      -f /dev/stdin <<'SQL'
    -- 改属主要拿每张表的 ACCESS EXCLUSIVE 锁。业务进程此刻还在写这些表，等一把
    -- 长事务就等于整个 Job 无声地挂着；宁可超时失败让 Job 重试——它幂等，重跑会接着
    -- 挪剩下的那些。
    SET lock_timeout = '15s';
    
    DO $do$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cog_app') THEN
        CREATE ROLE cog_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
      END IF;
    END
    $do$;
    
    ALTER ROLE cog_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'app_password';
    
    -- 库名从会话里取，不写死：这个脚本也会被测试拿到一个临时库上跑，写死一个库名
    -- 就等于把「跑在哪」钉在树里，换一个部署就授错库。
    DO $do$ BEGIN
      EXECUTE format('GRANT CONNECT ON DATABASE %I TO cog_app', current_database());
    END $do$;
    GRANT USAGE, CREATE ON SCHEMA public TO cog_app;
    
    -- 备份演练连源库的那个角色。它要的三样，一样都不能少：
    --   CREATEDB      —— 在同一台服务器上建一个一次性库，把包装回去；
    --   读全部表      —— 逐表比对行数（恢复路径不要求超权位：没有它时按外键依赖顺序
    --                    装载、检查开着，2026-11-01 在现网用这样一个角色跑通过一趟）；
    --   写 backup_drills 一行 —— 它给出的结论就写在那儿，写不进去这一趟等于没跑。
    -- 它没有 CREATEROLE、没有超权位，也不属于 cog_app：成员可以 SET ROLE 过去，那等于
    -- 把 cog_app 的权限整包递过去。
    DO $do$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cog_backup') THEN
        CREATE ROLE cog_backup LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION;
      END IF;
    END
    $do$;
    
    ALTER ROLE cog_backup WITH LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'backup_password';
    
    DO $do$ BEGIN
      EXECUTE format('GRANT CONNECT ON DATABASE %I TO cog_backup', current_database());
    END $do$;
    
    -- 读全部表用预定义角色，不逐表 GRANT：逐表授的是一份快照，新建的表不在里面，
    -- 而演练的比对恰好会读每一张表——漏一张，那一张的行数就不在比对里，读起来像一致。
    GRANT pg_read_all_data TO cog_backup;
    
    GRANT INSERT ON public.backup_drills TO cog_backup;
    
    -- 测试库的那个角色。两项特权都是被用例的题目逼出来的，不是顺手给的：
    --   CREATEDB    —— `backup_pg` 把包恢复进一台现建的库；
    --   CREATEROLE  —— 同一条用例要先造一个**没有超权位**的角色、恢复完再删掉；删角色
    --                  要 CREATEROLE 加上对目标的 ADMIN，而它建的角色的 ADMIN 天然在它
    --                  手里。给不了这两项，这一条用例在沙箱里就只能红——那是环境缺东西，
    --                  不是这棵树判出了什么，而一条永远红的门禁很快就没人看了。
    -- 它读不到业务库：cogneva 不归它，也没人给它 GRANT。
    DO $do$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cog_test') THEN
        CREATE ROLE cog_test LOGIN NOSUPERUSER CREATEDB CREATEROLE NOREPLICATION;
      END IF;
    END
    $do$;
    
    ALTER ROLE cog_test WITH LOGIN NOSUPERUSER CREATEDB CREATEROLE NOREPLICATION
      PASSWORD :'test_password';
    
    -- 迁移第一条就 `CREATE EXTENSION IF NOT EXISTS "uuid-ossp"`，而迁移是**业务角色**
    -- 在启动时跑的。装扩展要的是「当前库的 CREATE」——不是 schema 上的 CREATE，也不是
    -- 库属主：2026-11-01 实测，在一个只拿到 CONNECT 的库上，cog_app 跑那一句拿到的是
    -- `permission denied to create extension "uuid-ossp" / Must have CREATE privilege on
    -- current database`。所以扩展必须在这一步、在这个还拿得动它的角色手里先装好，否则
    -- 新装机第一次启动的迁移会停在第一条上，而那时业务角色已经在跑。
    --
    -- 这一行的名字来自 crates/cog-storage/migrations 里的 CREATE EXTENSION；新装一个
    -- 扩展就要在下面补一行，`deploy/scripts/tests/db-role-bootstrap-ownership.test.sh`
    -- 拿两边比，少一行就红。
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    
    DO $do$
    DECLARE
      obj record;
    BEGIN
      -- 表、分区、视图、物化视图、序列：索引与外键随表走，不必单列。
      -- 扩展成员（deptype = 'e'）跳过：它们的属主要跟着扩展走，改了会让
      -- ALTER EXTENSION 在需要升级时找不到属主。
      FOR obj IN
        SELECT c.oid::regclass AS name, c.relkind AS kind
        FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = 'public'
          AND c.relowner = (SELECT oid FROM pg_roles WHERE rolname = 'cog_user')
          AND c.relkind IN ('r', 'p', 'v', 'm', 'S')
          AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = c.oid AND d.deptype = 'e')
          -- 附属于某张表的序列（默认分区/自增列的序列）不能单独换属主：Postgres
          -- 直接拒绝（linked to table），而它本来就跟着宿主表走——上面那句改表属主
          -- 会把它一起带过去。漏了这个条件，整个循环在第一个自增序列上就断了，
          -- 而断点之前的对象已经挪走，Job 只在日志里留一行 ERROR。
          AND NOT (c.relkind = 'S' AND EXISTS (
            SELECT 1 FROM pg_depend d
            WHERE d.objid = c.oid
              AND d.classid = 'pg_class'::regclass
              AND d.refclassid = 'pg_class'::regclass
              AND d.deptype IN ('a', 'i')))
      LOOP
        -- 换属主的关键字随对象种类变：视图与序列不接受 ALTER TABLE 那种写法。
        EXECUTE format('ALTER %s %s OWNER TO cog_app',
          CASE obj.kind
            WHEN 'S' THEN 'SEQUENCE'
            WHEN 'v' THEN 'VIEW'
            WHEN 'm' THEN 'MATERIALIZED VIEW'
            ELSE 'TABLE'
          END, obj.name);
      END LOOP;
    
      FOR obj IN
        SELECT p.oid::regprocedure AS name
        FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname = 'public'
          AND p.proowner = (SELECT oid FROM pg_roles WHERE rolname = 'cog_user')
          AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = p.oid AND d.deptype = 'e')
      LOOP
        EXECUTE format('ALTER FUNCTION %s OWNER TO cog_app', obj.name);
      END LOOP;
    
      -- 枚举与域是显式造的类型；组合类型（'c'）跟着表自动走，单列出来反而会报
      -- 「它是某张表的类型」。
      FOR obj IN
        SELECT t.oid::regtype AS name
        FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public'
          AND t.typowner = (SELECT oid FROM pg_roles WHERE rolname = 'cog_user')
          AND t.typtype IN ('d', 'e')
          AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = t.oid AND d.deptype = 'e')
      LOOP
        EXECUTE format('ALTER TYPE %s OWNER TO cog_app', obj.name);
      END LOOP;
    END
    $do$;
    SQL
    
    # 测试专用库：需要真服务的检查（`deploy/scripts/check-live-services.sh`，变更验证
    # 会跑它）连这一个，不连业务库。分开是硬要求——清单里有几条一上来就清空整张任务表，
    # 指向业务库就是拿线上数据当 playground。属主给 cog_test：那些用例自己建表自己拆，
    # 有几条还要建库建角色（见上面那个 DO 块）。
    #
    # 幂等：只有不存在时才建，然后无条件把属主对齐——第一版建出来时属主是 cog_app，
    # 而 `ALTER DATABASE ... OWNER` 在属主已经对的时候是空操作，所以这一句既收拾旧库，
    # 也不给新装带来第二件事。
    #
    # `CREATE DATABASE` 不能在事务块里跑，所以是独立的两条 psql，不塞进上面那个 DO 块。
    echo "db role bootstrap: creating the test database if it is missing"
    psql -tAq -c "select 'present' from pg_database where datname = 'cogneva_test'" \
      | grep -q present \
      || psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cogneva_test OWNER cog_test'
    psql -v ON_ERROR_STOP=1 -c 'ALTER DATABASE cogneva_test OWNER TO cog_test'
    
    echo "db role bootstrap: cog_app is ready and owns the cogneva schema objects"
    echo "db role bootstrap: cog_backup can create the drill database, read every table, and record its verdict"
    
