    # 匹配不到），用 0.0.0.0/0 兜底、端口钉死 443/6443 保持最小授权。
    - to:
        - ipBlock:
            cidr: "10.43.0.0/16"
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
