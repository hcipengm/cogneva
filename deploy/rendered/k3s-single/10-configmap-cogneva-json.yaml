      "multi_backend_consumer": {
        "_comment": "events_on_bus=true: AgentEnd is published only to the persistent event plane (dedicated NATS JetStream at nats_urls, decoupled from the task-queue backend); the supervisor re-injects it into the broadcast exactly once and memory-ingestor consumes from the bus with ack-after-processing. Publish-side knobs bound the in-memory buffer that covers NATS outage windows.",
