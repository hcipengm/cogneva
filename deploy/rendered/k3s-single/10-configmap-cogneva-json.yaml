      "metrics": {
        "enabled": true,
        "endpoint": "/metrics",
        "_comment_sample_max_rows": "cog_metrics_samples 是只追加的观测样本日志，这条是它的容量上限（行数），0=不清理。清理的判据是容量不是时间：时间窗两个问题都答不了——流量可以在任何窗内塞进任意多行，而清理仍然会删掉正在读的行、留着没人要的行。清理按最早的先删，直到回到上限为止，但每个 gauge series 的最新一行永不删——gauge 的值就是这张表里它最新那条，删掉等于这个 series 从 /metrics 上消失，读起来是「从来没存在过」而不是「被裁掉了」；计数器与直方图不受这条地板保护，它们的值存在各自的累计表里，日志里的行只是喂给它的历史，整段可删——否则按对象取键的计数器（序列只增不复用）会让地板无限长大，容量旋钮永远咬不住，每轮都自报超容量却一行都删不掉。若光是这些最新行就超过上限，清理停在最新行上并通过 metrics_samples_over_capacity=1 说出来。默认值按开发集群实测的观测速率（约每天 2.2 万行）取约十天，比稳态高一个数量级，正常运转够不着，而失控的探测循环会在几小时内撞上而不是先把卷写满。属主由租约选举，不由部署标志钉死：清理是这张表上的单写者动作，属主写在共用库的一行租约里，两个副本同时开着也只有一个真删——没拿到租约的那个只量大小、照常上报，不参与清理，也不对外产生副作用；属主被杀后，另一个在租约到期后的下一轮接管。这个数于是从「谁是属主」退回成「哪些副本有资格当属主」（租约只在开着清理的进程之间争）：进化 Pod 的部署环境里置 COGNEVA_METRICS_SAMPLE_MAX_ROWS=0，是不让自进化 Pod 去持这张表的角色。已退场的名字（没有任何产者再写它）不看容量，也不靠这条清理放行，而是由独立的释放 pass 挂在这个循环上每轮清一遍四处存储（样本日志加三张累计表），删掉多少行按表分组报在 metrics_retired_rows_removed 上。",
        "sample_max_rows": 200000,
        "_comment_scrape_dimensions": "抓取的可选收窄项，空数组=不收窄。不收窄的含义是：向每个 observable 询取它自己声明的、序列基数有界的全部维度。有界性由产者声明，不由这份清单判定——同一维度名在不同 observable 上可以不同（D1 在 orchestrator 是进程级累计计数器，有界；在 agent 是逐 step 按 task_id 取键的记录，无界），所以写死一份全局清单必然对其中一家是错的：旧清单把 D1 整条排除，orchestrator 那份有界的 D1 就永远读不到；而清单里列了 D4/D5/D6/D8/D9 时，agent 的 collect_metrics 会在五次询问里各回一份它那组不随维度变的累计计数器，同一批样本在同一个抓取体里出现五遍。要收窄时在这里写具体的维度名，它只会比产者声明的更少，不会多——写了没人声明的名字或声明为无界的名字，结果是采不到而不是报错。",
        "scrape_dimensions": []
      },
      "raw_logger": {
        "_comment": "这里写的已是部署的生效值，不再由 cogneva-config 的同名 env 覆盖：同一个设置在两个地方各写一份，读配置文件的人就推不出 runtime 用的是哪份，而 base_dir 还兼着 trace 存储的根（<base_dir>/traces），改错了不报错，只把 trace 写到另一个目录去。env 映射仍留在本文件的 env 段，要按环境改动时走那里。",
        "_comment_format": "proto：记录按长度分隔的 protobuf 落地（<stream>/<YYYY-MM-DD>.proto.bin），比 jsonl 省去字段名开销，也是分层迁移压缩的输入。读取侧同时认 jsonl 与 proto，所以存量 .jsonl 文件不用搬。",
        "_comment_flush_interval_secs": "落盘由两个条件触发：缓冲满 max_buffer_size 条，或距上次落盘满 flush_interval_secs 秒。低流量 stream 可以长时间够不到条数阈值，那期间写下的记录全在进程内存里，进程一挂即失——所以时间上界不能省。置 0 只留条数阈值。",
        "enabled": true,
        "base_dir": "/var/lib/cogneva-data/raw-logs",
        "max_buffer_size": 1000,
        "format": "proto",
        "zstd_level": null,
        "flush_interval_secs": 1
      },
      "memory": {
        "_comment": "Memory backend — composite puts Raw on the shared ObjectBackend, Schema and the Summary entry store on PostgreSQL, and the summary vectors on the shared VectorBackend, so the dataset survives a restart. This applies to the processes that enable it: the evolution worker overrides COGNEVA_MEMORY_ENABLED to false, so it holds no memory dataset at all and any state it must keep across a restart lives in its own app.data_dir instead.",
        "_comment_models": "load_*_model gates the ONNX weights loaded at startup. Both are false on the shipped profile: the single node has ~1.8GiB free against ~2.2GiB of resident weights per session (dense and sparse each open their own session over the same BGE-M3 weights, plus the reranker), so loading either one evicts the rest of the workload. Weights are deliberately kept out of the image and out of the release archive (4.6GiB total, and gzip cannot shrink fp32 weights); they are to arrive as one authoritative copy in the object store, seeded into each node's local cache. Until a host has the RAM, the vector layer stays absent and search falls back to the schema/text path.",
        "enabled": true,
        "backend_type": "composite",
        "embedding_dimension": 1024,
        "auto_ingest": true,
        "load_embedding_model": false,
        "load_reranker_model": false,
        "ingest": {
          "_comment": "Auto-ingest pipeline knobs. Retries and the dead-letter queue apply to content-level failures (a message that cannot be extracted, however often it is retried); an unreachable upstream defers the message back to the event plane instead, so a capacity outage never decides which events enter memory.",
          "_comment_pull_gate": "The pull gate has two inputs sharing one verdict: the security gateway's published pool snapshot (cross-process, known before an attempt is spent) and this process's own consecutive environment failures (a local fact that still holds when Redis has no key or the gateway restarted). Either one pauses pulling and the wait is the larger of the two. Pausing means not pulling, so messages keep their place in the event plane without spending a delivery attempt.",
          "_comment_reconcile": "Startup reconcile only covers the window between a crash and the restart, so it also re-runs on an interval: an outage longer than the lookback would otherwise push early-archived, never-extracted raws out of the window for good. 0 keeps it startup-only.",
          "_comment_bus": "Bus-mode consumer knobs (active when multi_backend_consumer.events_on_bus=true). bus_claim_min_idle_ms must exceed the worst-case single-event processing time so a live worker's job is never claimed away; JetStream redelivery is governed by ack_wait, the claim sweeper covers Redis-class backends.",
          "max_retries": 3,
          "retry_base_delay_ms": 1000,
          "enable_dlq": true,
          "dlq_namespace": "dlq",
          "extraction_concurrency": 4,
          "startup_reconcile": true,
          "reconcile_lookback_hours": 24,
          "reconcile_interval_secs": 600,
          "pull_pause_after_failures": 3,
          "pull_pause_initial_secs": 60,
          "pull_pause_max_secs": 1800,
          "pool_check_secs": 30,
          "pull_resume_observation_secs": 300,
          "backlog_warn_at": 64,
          "bus_group": "memory-ingestor",
          "bus_claim_interval_secs": 30,
          "bus_claim_min_idle_ms": 900000,
          "bus_claim_batch": 32
        }
      },
      "tier_migrator": {
        "_comment": "hot→warm 就地 zstd 压缩并删除源文件，warm→cold 上传对象存储再删本地，两步都不可逆——热层保留 hot_duration_secs，warm 保留 warm_duration_secs。",
        "_comment_owner": "迁移必须只有一个属主：raw_log_index 按 (stream, log_date, format) 唯一，冷层对象键又不带进程身份，两个部署同时扫就会互相覆盖索引行与对象（谁后写谁赢，先写的那份不可找回且不报错）。属主由租约选举，不由部署标志钉死：参与迁移的副本各自周期性地问共用库上那行租约，只有拿到的那份真扫，属主被杀后另一个在租约到期后的下一次问询接管。所以 COGNEVA_TIER_MIGRATOR_ENABLED 是「这个 Pod 参不参与迁移」的选择，正确性不靠它。",
        "enabled": true,
        "hot_duration_secs": 86400,
        "warm_duration_secs": 604800,
        "warm_compression_level": 3,
        "cold_compression_level": 9,
        "scan_interval_secs": 3600,
        "cold_key_prefix": "raw",
        "trace_scan_batch": 5000
      },
      "supervisor": {
        "health_interval_secs": 10,
        "quota_interval_secs": 60,
        "rebalance_interval_secs": 300,
        "event_window_secs": 30,
        "broadcast_capacity": 256,
        "quota_threshold": 1000,
        "behavior_history_max": 20,
        "heartbeat_history_max": 1000,
        "alert_history_max": 10000,
        "control_plane_interval_secs": 30,
        "control_plane_url": null,
        "health_checker": {
          "suspect_after_secs": 15,
          "dead_after_secs": 60,
          "stuck_after_secs": 600
        },
        "task_rebalancer": {
          "max_tasks_per_agent": 4,
          "max_assignments_per_pass": 32
        }
      },
      "hook_engine": {
        "dedup_window_secs": 1,
        "hook_timeout_secs": 30,
        "default_rate_limit": {
          "burst": 100,
          "per_second": 100
        }
      },
      "boundary": {
        "rules": [
          {
            "name": "TokenBudget",
            "rule_type": "hard",
            "threshold": 100000,
            "description": "单个任务的 estimated_tokens 不得超过阈值",
            "enabled": true
          },
          {
            "name": "OutputQuality",
            "rule_type": "soft",
            "threshold": null,
            "description": "生成输出必须满足以下质量标准：1) 代码必须包含单元测试 2) 文档必须完整 3) 无已知安全漏洞",
            "enabled": true
          }
        ]
      },
      "agent_loop": {
        "agent_id": "agent-001",
        "role": "planner",
        "max_iterations": 10,
        "eval_max_iterations": 5,
        "context_window_size": 64000,
        "skill_cache_ttl_secs": 30
      },
      "observability": {
        "config_declaration": {
          "_comment": "本进程读到的配置文档，与本 rev 声明的那份是否同一份。规则住在文档里，所以没有任何一条规则能报出文档自己没到；这一判在代码里跑，拿进程启动时读的那份，比对本二进制编译进来的那份。两次读取间隔 settle_secs：中间那次是为了把「正在换版」和「文档确实落后」分开——文件在此期间已经前进，说明进程只是被替换的路上，不是卡住。",
          "settle_secs": 60
        },
        "infra_watch": {
          "_comment": "基础设施告警→持久化→自发现。规则即部署策略：阈值改这里不用重建镜像。series 消失或条件不再成立会自动 resolve；规则查询失败不会误 resolve。",
          "enabled": true,
          "prometheus_url": "http://cog-observability-prometheus.monitoring:9090",
          "poll_interval_secs": 60,
          "eval_failure_alert_after": 3,
          "rules": [
            {
              "name": "node_disk_usage_high",
              "promql": "max without (pod, container) (100 - 100 * node_filesystem_avail_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"})",
              "condition": {
                "greater_than": 75.0
              },
              "severity": "warning",
              "summary": "node root filesystem usage above 75% (current {value}%) The publishing pod is a scrape detail, not the subject: it is deleted and recreated with every monitoring rollout, so it is aggregated out while the label naming the subject is left untouched."
            },
            {
              "name": "node_disk_usage_critical",
              "promql": "max without (pod, container) (100 - 100 * node_filesystem_avail_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"})",
              "condition": {
                "greater_than": 85.0
              },
              "severity": "critical",
              "summary": "node root filesystem usage above 85% (current {value}%); kubelet eviction starts soon The publishing pod is a scrape detail, not the subject: it is deleted and recreated with every monitoring rollout, so it is aggregated out while the label naming the subject is left untouched."
            },
            {
              "name": "node_disk_pressure",
              "promql": "max without (pod, container, instance) (kube_node_status_condition{condition=\"DiskPressure\", status=\"true\"})",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "critical",
              "summary": "kubelet reports DiskPressure; pods are being evicted The publishing pod is a scrape detail, not the subject: it is deleted and recreated with every monitoring rollout, so it is aggregated out while the label naming the subject is left untouched."
            },
            {
              "name": "node_memory_pressure",
              "promql": "max without (pod, container, instance) (kube_node_status_condition{condition=\"MemoryPressure\", status=\"true\"})",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "kubelet reports MemoryPressure The publishing pod is a scrape detail, not the subject: it is deleted and recreated with every monitoring rollout, so it is aggregated out while the label naming the subject is left untouched."
            },
            {
              "name": "pod_restarting_fast",
              "promql": "increase(kube_pod_container_status_restarts_total[15m])",
              "condition": {
                "greater_than": 5.0
              },
              "severity": "warning",
              "summary": "A container restarted more than 5 times in 15m ({value}). Not scoped to one namespace: a crash loop is the same defect wherever it runs, and a namespace matcher is a hand-written list -- the observability backends sat outside the one we had and their loop reached no rule at all"
            },
            {
              "name": "pod_restarting_repeatedly",
              "promql": "changes(kube_pod_container_status_restarts_total[6h])",
              "condition": {
                "greater_than": 2.0
              },
              "severity": "warning",
              "summary": "A container restarted more than twice in 6h ({value}). The fast rule needs five inside 15m, so a container that comes back and dies again every hour or two trips nothing -- clickhouse did exactly that for an hour. A planned spec change restarts a container once, so a third return means something is killing it; kube_pod_container_status_last_terminated_reason names what. Counted with changes() rather than increase(): that one extrapolates a short series across the whole window, so a container that had restarted once was reported as two, and the rule could only cross its threshold in the last seconds before the samples aged out -- it fired six hours after the burst, on a pod that no longer existed. changes() reads the increments that were actually observed, and understates the count only when two restarts land inside one scrape interval, which is the fast rule's business"
            },
            {
              "name": "pod_oom_killed",
              "promql": "kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"}",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "critical",
              "summary": "A container's last exit was OOMKilled ({value}); its footprint exceeded the limit it was given. Not scoped to one namespace, and a state rather than a rate: a container killed at its cap holds this state until a clean stop, and one that dies every couple of hours never trips a restart-rate rule. The clickhouse instance in monitoring was killed five times in one hour while this rule could not see it"
            },
            {
              "name": "container_memory_near_limit",
              "promql": "container_memory_working_set_bytes{container!=\"\", container!=\"POD\"} / on(namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\"} > 0)",
              "condition": {
                "greater_than": 0.75
              },
              "severity": "warning",
              "summary": "A container is running at {value} of the memory limit it was given. Working set against the limit kube-state-metrics reports, and only for containers that have a limit -- an unbounded container is not near anything. The threshold is the floor of the band the killed observability backend lived in: it sat between 0.74 and 0.93 of its cap for hours and its own burst amplitude crossed the rest, so anything at or above this is one burst away from being killed at its limit. Nothing else in the cluster comes near it, the next largest being 0.56"
            },
            {
              "name": "redis_restarted",
              "promql": "increase(kube_pod_container_status_restarts_total{namespace=\"cogneva\", container=\"redis\"}[1h])",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "the message queue restarted ({value} times in 1h). A restart is either a planned spec change or an unclean stop of its host; after an unclean stop Redis had a torn AOF tail that the aof-repair init container drops at startup, and the number of bytes given up is published by that container as cogneva_aof_repair_dropped_bytes. pod_restarting_fast only counts fast loops and pod_restarting_repeatedly needs three in 6h, so a single restart shows up nowhere else"
            },
            {
              "name": "aof_repair_gave_up_bytes",
              "promql": "max without (pod, container, instance) (cogneva_aof_repair_dropped_bytes) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "the message queue gave up {value} byte(s) off the tail of its append-only file when it last started. An incomplete record at the end of an AOF is read by Redis as corruption rather than as end-of-file, so without the repair the instance refuses to start at all; the repair drops the torn tail so that it can. Those bytes are gone — everything written after the last intact record is lost, and redis_restarted fires for the same event but counts planned spec changes too, so this is the reading that says data was actually given up. It describes that startup, not the moment it is read: it stands until the pod is recreated, and carries its own date in cogneva_aof_repair_pass_timestamp_seconds"
            },
            {
              "name": "aof_repair_untouched_torn_tail",
              "promql": "max without (pod, container, instance) (cogneva_aof_repair_untouched_torn_tail_bytes) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "the aof-repair init container found {value} byte(s) of unwritten data at the tail of a file it does not own and left it alone: base and manifest files are rewritten whole by Redis, so truncating one is as likely to destroy the dataset as to recover it. Nothing is broken yet — this is the same unclean stop that tears an increment, seen on a file where the repair has no safe move. If Redis then refuses to start, that trailing run is what to look at, and its length says how far back the damage reaches"
            },
            {
              "name": "aof_repair_suspected_interior_holes",
              "promql": "max without (pod, container, instance) (cogneva_aof_repair_suspected_interior_holes) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "{value} zero run(s) inside an append-only file were followed by real data at the last start. A torn tail never does that; a hole punched into an already-written region does, which is what a page cache losing writes to an unclean stop leaves behind. The repair reports it and changes nothing, because a legitimate binary payload can hold a long zero run and only a person can tell the two apart. Expect the instance to load and then fail on those records, or to be quietly missing them: cogneva_aof_repair_pass_timestamp_seconds says which start this was, and the volume underneath is where the hole came from"
            },
            {
              "name": "aof_repair_unhandled_layout",
              "promql": "max without (pod, container, instance) (cogneva_aof_repair_unhandled_layout) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "the AOF directory holds a layout the repair does not handle, so at the last start it inspected nothing at all — and a pass that inspected nothing is not a clean pass, it is an unknown one. Every other aof_repair_* reading is zero or absent because of this, not because the dataset was found intact. The layout changed under the repair (a Redis that writes a different file set, or a different --dir), and until the repair is taught the new one a torn tail will hold the instance in a failed start with nothing attempted"
            },
            {
              "name": "aof_repair_verdict_absent",
              "promql": "max without (pod, container, instance) (cogneva_aof_repair_verdict_published) < 1",
              "condition": {
                "less_than": 1.0
              },
              "severity": "warning",
              "summary": "the message queue started without publishing an AOF repair verdict: the image predates the repair command, the run died before it could publish, or the operand it was given was not honoured. Every aof_repair_* series is then absent rather than zero, and an absent reading cannot be read as a clean start — check the pod's aof-repair init container log and the image tag it resolved to. This rule exists so that a blind observation face fails loudly instead of passing for a healthy one"
            },
            {
              "name": "aof_repair_reading_absent",
              "promql": "count(kube_pod_init_container_info{namespace=\"cogneva\", container=\"aof-repair\"} and on(pod) kube_pod_status_phase{namespace=\"cogneva\", phase=\"Running\"} == 1) - (count(cogneva_aof_repair_pass_timestamp_seconds) or vector(0))",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "{value} pod(s) that run the AOF repair are up while no repair reading reached Prometheus — the two sides are counted, not assumed, so a scaled-down redis is silent and a broken scrape path is not. Every aof_repair_* rule is silent in this state, and silence here is indistinguishable from a clean start, which is what makes it worth a rule of its own. Usual causes: the redis PodMonitor was never applied (the observability manifests have no automatic delivery path), its port selector no longer matches the port name the sidecar declares, or the exporter cannot read the textfile directory"
            },
            {
              "name": "sandbox_command_oom_killed",
              "promql": "sum by (namespace) (increase(sandbox_oom_kills_total[30m]))",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The sandbox container's memory limit killed {value} command(s) in the last 30m. A child process dying here leaves the container itself running, so nothing reaches the container-level OOMKilled signal, and the build that died reads downstream as an ordinary failure with empty output; a command that keeps dying at the limit needs a bigger limit, not a different change The count is summed across the processes that publish it rather than read per process: each process counts only its own, so the sum is what the deployment did, and the row stays keyed on the subject above instead of on a pod the next rollout deletes."
            },
            {
              "name": "ralph_loop_terminations_high",
              "promql": "sum without (pod, container, instance) (increase(ralph_terminations_total[30m]))",
              "condition": {
                "greater_than": 20.0
              },
              "severity": "warning",
              "summary": "Ralph loops stopped {value} times in the last 30m without passing their goal. This rule sums over every reason a loop can stop for -- any stop is worth seeing -- but the reasons are not interchangeable, so this text does not name one: the reason that moved it is {reason}, and the alert's identity carries it, so two different reasons are two different alerts. A loop killed from outside has not answered the budget question at all; only a reason that says the chain gave up on its own has."
            },
            {
              "name": "declared_failure_class_unrecorded",
              "promql": "max without (pod, container, instance) (collab_classification_unreachable)",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "A declared failure class is being announced while its series stays at zero, so the classification is being lost between the producer and the termination record; the class label names which one"
            },
            {
              "name": "goal_class_not_carried",
              "promql": "sum by (source) (increase(collab_goal_class_source_total{source=\"host_type\"}[6h]))",
              "condition": {
                "greater_than": 0.0
              },
