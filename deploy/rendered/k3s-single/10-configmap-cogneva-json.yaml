      "github_integration": {
        "_comment": "GitHub integration for self-evolution. Tokens are resolved from environment variables and never enter the sandbox. discovery_mode=both: polling is the periodic fallback, webhook events (via the security gateway, gateway_verified) give second-level response.",
        "enabled": true,
        "_comment_discovery_enabled": "Whether THIS process takes part in discovery at all. One binary serves several deployments (main app, evolution pod, security gateway, sandbox executor) and each of the first two builds its own plugin table, so a process that takes part contends for the discovery role over the shared database: each participating replica asks the lease on its own cadence, only the holder scans and follows up, and the role moves to another replica on the next ask after a holder that was killed stops renewing its term. Without that arbitration two processes scan the same upstream items and ask the same clarification twice: intent guards are per-pod files, so neither can see the other already acted. The webhook event entry is deliberately not part of the lease — which process receives issue/comment events is a routing decision made where the events are delivered, and the periodic poll is the fallback for what the events do not reach. Deployment sets this false on the evolution pod, which therefore neither polls nor receives events.",
        "discovery_enabled": true,
        "discovery_mode": "both",
        "repo": "hcipengm/cogneva",
        "base_branch": "main",
        "accounts": [
          {
            "kind": "bot",
            "username": "cogneva-bot",
            "name": "Cogneva Bot",
