        "backup_dir": "/opt/cogneva/bin/backups",
        "switch_mode": "self_exec",
        "health_check_grace_period_secs": 10,
        "health_check_interval_secs": 5,
        "health_check_max_retries": 6,
        "test_timeout_secs": 3600,
        "build_timeout_secs": 3600,
        "poll_interval_secs": 60,
        "schema_repair_interval_secs": 600,
        "build_gate": {
          "_comment": "宿主级构建闸门：同一宿主同时进行的编译/打镜像条数上限。构建与集群同宿主，多路叠加足以把整机拖进换页，此后连应该把这件事报出来的事件循环也一起退化。闸门只装在跑构建的进程里，锁定的是 lock_dir 这一个目录：两个进程指向同一个目录（同一 dev:ino）才互相设界，指向不同目录则各自设界——读数 cogneva_build_gate_slots 的 dir 标签就是用来分辨这件事的，role 标签分辨「跑构建的进程（builder）」与「不跑构建的进程（control-plane，只发零值）」。",
          "enabled": true,
          "max_concurrent": 1,
          "wait_secs": 1800,
          "lock_dir": "/opt/cogneva/sandbox/build-gate"
