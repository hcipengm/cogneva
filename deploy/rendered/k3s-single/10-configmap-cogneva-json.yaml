              "summary": "Worktree {worktree} has {value} tracked files its git index does not remember. Every one of them is rewritten by that worktree's next reset, so this is a tree about to be rebuilt rather than refreshed, and the size of the number is itself the reading: a value at the whole-tree size is the index having lost the tree, while a handful is a normal partial state. Nothing else reports it. Read it with the index-present series, because the two failure faces are different -- 'the index remembers no files' and 'the index is not there' both make the next reset look free, and only that pair tells them apart. The half hour is long enough that a reset in progress does not raise this, and the reading is per worktree so the subject is named rather than summed."
            },
            {
              "name": "buildah_store_live_refs_empty",
              "promql": "min without (pod, container, instance) (max_over_time(cogneva_buildah_store_live_images[30m])) < 1",
              "condition": {
                "less_than": 1.0
              },
              "severity": "warning",
              "summary": "A build store reclaim pass computed its keep set from a cluster read that found no live revision at all ({value} was the highest any pass read across the window). The keep set is the whole of what stops this pass deleting a base image something is running, so an empty one is the one way this pass removes a base image that is in use, and the read that produced it exits successfully -- which is why nothing else reports it. The gauge is published only by a completed round, so an absent series means no round completed rather than a zero, and a series carrying a zero is the danger itself rather than a missing reading. The half hour is sixty consecutive beats, so one quiet scrape is not this reading. Read the rounds counter and the last-round timestamp beside it to tell a pass that read nothing from a pass that never ran, and the pruned image count for whether anything was in fact removed from under a running workload."
            },
            {
              "name": "metrics_retired_rows_still_arriving",
              "promql": "(max by (table) (min_over_time(metrics_retired_rows_removed[1h])) > 0) and (max by (table) (count_over_time(metrics_retired_rows_removed[2h])) > max by (table) (count_over_time(metrics_retired_rows_removed[1h])))",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "Every release pass in the last hour found rows of retired metric names to delete, and the smallest number any of those passes removed is {value}. The release is idempotent, retires a fixed list of names, and clears a table in one pass however large its backlog, so a store that has once been drained reports zero on every pass after the first -- a reading that stays non-zero is one the release is not draining, which is the help's own criterion and the only one this gauge carries. The number is what the last pass removed and not a backlog, so read the row count beside it for how much is there. The hour is far above the sweep's own two-minute ceiling: the pass rides the sweep, and the sweep's period is derived from how fast the log fills rather than configured, which is why the window is a multiple of a bound and not the period itself. The two-hour count is the coverage term and not a second reading: a series younger than the window is judged on the samples it happens to have, so the rule also requires samples older than the hour, which is what makes the 'at every pass' claim true rather than an artifact of a process that just started. An absent series means no pass has run at all, a different fault that the background loop's liveness reading covers. The read is taken per table and not per exposing process: the row is kept once and read back by every process that shares the store, so a rule keyed on the process would cast one alert per reader, each on a pod the next rollout deletes, and would re-state the same table under a subject that no longer exists."
            },
            {
              "name": "mainline_ci_verdict_failed",
              "promql": "max by (verdict) (increase(cogneva_mainline_ci_verdict_total{verdict=\"fail\"}[1h])) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The CI gate read a red verdict for a revision the deployer was about to promote ({value} such reads in the last hour, the largest any workload reported -- this counter is exposed by two workloads that run in step, so a sum over them would state twice the events). This is the gate working -- the rollout is held instead of dispatched -- and the count is read because the hold is otherwise invisible: the state file keeps the hold and nothing else, and the log line that records it dies with the pod that wrote it, so a promotion that has stopped for a week looks the same as one nobody attempted. It is the fail cell of the verdict counter; read the other two beside it, because no_evidence is not this verdict but the gate being unable to judge at all, and the per-reason counter says which platform was silent and how. The hour is the latency this family uses for an event, and one round adds at most two: the question is asked once before the build and again before the dispatch."
            },
            {
              "name": "mainline_ci_verdict_unreadable",
              "promql": "max by (reason) (increase(cogneva_mainline_ci_no_verdict_reason_total{reason!=\"pending\",reason!=\"no_runs\"}[1h])) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The deployer asked the code platforms for a CI verdict and one of them came back with something other than a verdict, for a reason that is not a wait ({value} such answers in the last hour under reason {reason}, the largest any workload reported -- this counter is exposed by two workloads that run in step, so a sum over them would state twice the events). The gate fails open by design, so this is the state in which a revision can be dispatched unverified, and the label names whose silence it was: status_unreadable and unusable_body are an answer this side could not parse, bad_api_base and connect_failed are the route or the gateway, and the http_ cells are the platform refusing. It filters out the two reasons that are a normal state rather than a fault -- pending is the platform not having finished, and no_runs is a platform with nothing to judge, both of which climb steadily on a healthy deployment -- and names no others on purpose, so a reason added later lands on the alarm side instead of going silent. Read it with the verdict counter's no_evidence cell, which is the same events counted without their cause."
            },
            {
              "name": "mainline_supersession_question_stopped",
              "promql": "max(increase(cogneva_mainline_rollout_attempts_total[6h]) - increase(cogneva_mainline_supersession_checks_total[6h])) > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The deployer rolled a revision out without asking whether the upstream had already overtaken it. The reading behind this alarm is {value} over the last six hours, and it is a count of rounds wherever the series behind it covers the window; where one stopped being scraped the size is inflated by the increase() extrapolation described below. This is the guard being gone rather than the guard answering yes: while it is wired the two counters are written by two statements that sit next to each other -- one when the round reaches the decision, one when it puts the question -- so their difference is exactly the rounds that decided without asking, and a deleted question call site is invisible in every other reading, including the answer counter beside them, whose zero on an unasked round does not move. Two statements rather than one call is on purpose: a single call would hold the difference at zero every round and lose the signal. The difference is taken inside a process and maximised after, never between two separately maximised counters: every process publishes both halves under the same label set, so pairing them cancels the scrape arithmetic exactly, while subtracting two maxima leaves a residue whenever the two maxima are attained by different pods -- and that residue is a fraction of a round, a value this criterion's own unit says cannot exist, so the alarm would rest on arithmetic rather than on the deployer. The size has the same kind of problem from a different direction: increase() fills a window the samples do not cover, so a series that stopped being scraped -- a pod that died -- has its residue multiplied up as the window eats its samples and reads higher than the count until that series leaves the window entirely. It is still read with increase() rather than with a window's own maximum minus its own minimum, which would report the count exactly: that form needs the series to be older than the window to be honest, and this deployer rolls the workload it runs in on every landing, so the requirement would silence the guard in exactly the case it exists for -- a freshly deployed build whose question call site is gone. The criterion is the sign of the difference, which no extrapolation invents; the size is only as good as the coverage behind it. The window only has to hold a round: attempts are the promotion cadence itself, and no other series publishes it -- the poll interval bounds the loop that looks for work, not the rounds that find any. Nothing is broken while it fires: the rollouts still happen, just without the check that would have skipped the ones the upstream had already replaced."
            }
          ]
        },
        "trace_collector": {
          "_comment": "trace 事件按 agent 在内存缓冲直到 AgentEnd 落盘；长任务无界累积会 OOM。超过预算即分块落盘（part 后缀），预算按部署内存定。",
          "buffer_max_bytes": 16777216
        },
        "data_volume_watch": {
          "_comment": "应用数据目录的占用量由写它的进程自己量成 gauge cogneva_data_volume_used_bytes 并带上卷名，规则拿它除以 kube-state-metrics 报的 requests.storage。同一份 cogneva.json 挂给多个 Pod，各自挂的卷不是同一张，所以卷名由各部署用自己的 env 指名（COGNEVA_DATA_VOLUME_CLAIM），不写在这里；claim 为空即整个观测关闭。没有应用数据目录、只有挂载表的进程（独立子命令与边车）用 COGNEVA_DATA_VOLUME_MOUNTS 的 claim=路径 列表声明，卷名就在那一行里；这条序列只能由挂载着该卷的进程走查产出——问得出来的那份是另一个量（引用字节），不是盘上占用。",
          "interval_secs": 300
        }
      },
      "self_review": {
        "_comment": "PGE actor self-review quality gate. enabled=true 时 Planner/Generator/Evaluator/Moderator/Merger 的输出会经过 SelfReviewLoop 审查并用修订结果替换原始输出。",
        "enabled": true,
        "max_iterations": 2,
        "quality_threshold": 0.8,
        "spec": null,
        "best_practices": []
      },
      "pge": {
        "_comment": "PGE actor 输出契约。schemas 按 actor 名（planner/generator/evaluator/moderator/merger）配置 JSON Schema；配置后 schema 会注入 prompt 上下文并对 LLM 原始输出做校验，校验失败仅告警并回退宽松解析，不会中断流水线。默认为空 = 使用内置契约。",
        "_comment_local_repair_max": "局部修复预算：Evaluator 判失败后保持当前 Plan 不变、把 feedback 回传给 Generator 再生成的次数，耗尽才做全局重置（重跑 Planner）。0 = 关闭这条路径，于是每次失败都从新 Plan 重来。写在这里是因为 schemas 一旦配置就很难注意到这条键缺了，而缺了的读法是 0。",
        "schemas": {},
        "local_repair_max": 2
      },
      "ralph": {
        "_comment": "Ralph Loop 的预算与停滞窗口。这两条界决定一条不收敛的链在什么位置停下：max_iterations 是单次执行的迭代硬上限，stagnation_window 是最近多少轮没有进展即终止。两条都按次计、不跨执行累计。",
        "max_iterations": 50,
        "stagnation_window": 5
      },
      "agent": {
        "_comment": "Agent 注册与心跳。registration_ttl_secs 是注册表里一条 agent 记录的存活秒数（cog-storage 写注册时取它），heartbeat_interval_secs 是 worker 向注册表续约的间隔（cog-agent 建 worker 时取它）。两处都在进程启动时读，改一个值要重启工作负载才生效。",
        "registration_ttl_secs": 30,
        "heartbeat_interval_secs": 10
      },
      "tuning": {
        "stream_capacity": 256,
        "high_watermark": 1000,
        "low_watermark": 100,
        "max_summaries": 10
