apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cogneva
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "cog_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: POSTGRES_DB
              value: "cogneva"
          # timeoutSeconds 必须显式给：Kubernetes 默认 1 秒，而 pg_isready 在
          # checkpoint 或复制压力下会超过 1 秒——默认值下探针连续失败会判活失败
          # 并重启数据库，重启期间全部写入方（进化、triage、告警落盘）一起断。
          # 首次启动要 initdb，预算按数据目录最慢的合法启动给。
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "cog_user", "-d", "cogneva"]
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cog_user", "-d", "cogneva"]
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cog_user", "-d", "cogneva"]
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        # 数据库是这台机器上唯一独占盘、又能把所有面一起拖慢的组件，而在此之
        # 前它一条读数都没有：连接耗尽、最老事务越长越大、锁等待、盘写满，
        # 全都只表现为「平台到处都慢」，没有一处能指回它。
        #
        # 做成边车而不是独立进程，是因为读数要库口令：独立进程就得再存一份口
        # 令（多一份凭证副本、多一个要轮换的地方），而边车读的是这个 Pod 本
        # 来就有的那份。边车与数据库同生同死也是对的——数据库不在时读数一起
        # 消失，不会留下一个对着空库报错的孤儿。
        #
        # 只抓这几族判词用得上的读数：连接数对上限、最老事务年龄、锁等待数、
        # 事务提交/回滚、库与盘的大小。抓默认全量会在每次抓取时多跑几十条只有
        # 偶尔才有用的查询，把「观测」变成数据库自己的负载。
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/cogneva?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "cog_user"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "false"
            - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
              value: "false"
            # 采集范围收窄写在 values 里：换一个版本猜不到默认值变了没有，
            # 而「多抓了一族」只会让抓取变慢，不会有任何报错。
            - name: PG_EXPORTER_INCLUDE_DATABASES
              value: "cogneva"
          # `pg_stat_activity` 是 opt-in 的一族：最老事务年龄那条读数与 Grafana 上
          # 同一块面板都读 `pg_stat_activity_max_tx_duration`，不点名打开它，那条
          # 读数会永远显示"没有序列"——而"没有序列"和"事务都很短"在面板上是同一个
          # 样子。只开这一族，不放开默认之外的其他 opt-in（每一族都是每次抓取多跑
          # 一遍的查询）。
          # 旗标名随 exporter 版本走：v0.15 把这一族叫 `stat_activity_autovacuum`
          # （`--collector.stat_activity` 在这个版本里不存在，传了会在启动时以
          # "unknown long flag" 退出，而它退出会让整个 Pod 不 Ready——库本身还活着，
          # Service 却因此没有端点）。换版本时要按镜像的 `--help` 重核这个名字，
          # 不按这里的字面照抄。
          args:
            - "--collector.stat_activity_autovacuum"
          ports:
            - name: pg-metrics
              containerPort: 9187
              protocol: TCP
          # 探针的数值只从 .Values.healthProbes 来：写死在这里，改配置面与改
          # 部署就成了两件事，两侧必然漂移（probe-budget 门禁查这一条）。
          readinessProbe:
            httpGet:
              path: /metrics
              port: pg-metrics
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: pg-metrics
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
