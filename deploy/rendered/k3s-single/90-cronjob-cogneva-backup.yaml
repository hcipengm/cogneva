                  mountPath: /secrets
                  readOnly: true
                # 带外那一份同挂：平台 token、git 身份私钥都只在这里，不导就等于
                # 换机后要回平台后台重新签发一遍。两片分开导出、分开恢复——它们
                # 是两个对象，权限面也是按对象划的。
                - name: secrets-oob
                  mountPath: /secrets-oob
                  readOnly: true
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cogneva-data-pvc
            - name: evolution-data
              persistentVolumeClaim:
                claimName: cogneva-evolution-data-pvc
            - name: secrets
              secret:
                secretName: cogneva-secrets
            - name: secrets-oob
              secret:
                secretName: cogneva-secrets-oob
                # 全新安装、向导还没跑过时这个对象可能没有键，但对象本身由
                # init-secrets.sh 建了出来；optional 让"还没配"不等于"备份跑不起来"。
                optional: true
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            # 宿主机上的一条路径，与备份卷不在同一个卷对象里：删 PVC、卷被回收
            # 都不动它。（同一个故障域，见 values.yaml 里的说明。）
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
