            # 问题互不蕴含。控制面自己驱动平台的任务池，所以是 gateway_pool；
            # WebUI 聊天那两条路径上有人在等，由代码就地改判成 interactive。
            # 值的闭集在代码里，判据 deploy/scripts/check-llm-origin-wiring.sh。
            - name: COGNEVA_LLM_ORIGIN
              value: gateway_pool
            # 告警邮件出口的 SMTP 口令：凭证不进清单也不进 values，只认这个
            # Secret 键，缺省即不做鉴权。键由集群侧写入（与可观测栈安装脚本写
            # clickhouse-password 同形）。
            - name: COGNEVA_ALERTMANAGER_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: smtp-password
                  optional: true
            # GitHub/Gitee API 与 git 传输走安全网关透传（凭证网关注入，本 Pod 零 token）。
            # 缺这三个 env 时 Provider 直连公网平台——集群仅网关在 egress 白名单内，直连必败。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            # 通知机器人签名借用面：机器人报文要签名时向安全网关借一对
            # (timestamp, sign)，平台密钥不出网关。未配置＝这个部署不签名。
            - name: COGNEVA_NOTIFICATION_SIGN_BASE
              value: "http://cogneva-security-gateway:8081"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # 要按文档持续排产的那些面：值是一个 face 列表（id/repo/sop_path/
            # cadence_secs），它逐个说清去哪里读哪份文档。只认这个 Secret 键，值
            # 带外写入清单——面名与仓名是部署自己的事，公开树里一个都不出现。
            # 缺省即没有面要排产：loop 不启动、零出网，这段能力休眠。值解析不出来
            # 也按缺省处理，并被记为「配了但读不懂」而不是静默当作没配。
            - name: COGNEVA_TASK_FACE_SOURCES
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: task-face-sources
                  optional: true
            # 内存 Raw 层的面：工具的返回点把装不进上下文窗口的输出归档到这里，
            # 取引用也从这里读回（零凭证、落默认命名空间）。本进程自己那一份走
            # **回环**进内部端口，不是主 API 的 8080——8080 上那几条 memory 路由按
            # 角色判，零凭证的调用方恒吃 401。不经安全网关：那一面只代持外网凭证，
            # 与本调用无关。缺这个值＝归档未配置，截断的尾巴无处可存，读数里带
            # unconfigured 的原因。
            - name: COGNEVA_MEMORY_API_BASE
              value: "http://127.0.0.1:8085"
            # 免费网页检索的后端（集群内 SearXNG）：本进程里的 agent 循环用它，
            # 与进化 Pod 同源同名，少一条就有一面的 `web_search` 用不了。
            - name: COGNEVA_WEB_SEARCH_BASE
              value: "http://searxng:8080"
            # 检索的后备端点（安全网关的 /search-fallback 透传）：只在自建 SearXNG 一个
            # 引擎都没应答时才问。空值＝查询永不外发，这个部署选择的是「没有
            # 答案」而不是用别处冒充。
            - name: COGNEVA_WEB_SEARCH_FALLBACK_BASE
              value: "http://cogneva-security-gateway:8081/search-fallback"
            # 网页抓取的渲染后端（集群内 Crawl4AI）：本进程里的 agent 循环用它。
            # 空值＝本进程读 HTML，客户端渲染的页面只能拿回空壳。
            - name: COGNEVA_WEB_FETCH_BASE
              value: "http://crawl4ai:11235"
            # git 身份自举的基线仓库（owner/name）。自举循环跑在**本进程**：
            # cogneva-secrets 的属主就是这里（WebUI 向导与贡献通道写同一份），
            # 而自举要的正是属主手里的三样东西——Secret 读写、到 GitHub 的
            # egress、以及滚安全网关的权限。少了这个值自举只剩"生成公钥挂到
            # WebUI"那一半，自动登记这一支永远不触发（值本身是共享的，见
            # values.yaml 的 gitIdentity）。业务调用仍零持有，经网关代理。
            - name: COGNEVA_GATEWAY_GIT_IDENTITY_REPO
              value: "hcipengm/cogneva"
            # webhook 验签在安全网关完成，本进程只验网关转发的内部 HMAC；
            # 未配置时事件入口不启动（fail-closed）。
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # JWT 签名密钥：安装时随机生成（init-secrets.sh / chart lookup）。
            # 缺失时进程生成一次性随机密钥，重启即全员登出，不会被已知弱密钥伪造。
            - name: COGNEVA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: jwt-secret
                  optional: true
            # 实例身份指纹：身份的规范来源，安装期生成。缺省时进程回退到状态
            # 文件 / 机器指纹推导（单机场景行为不变）。
            - name: COGNEVA_INSTANCE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: instance-fingerprint
                  optional: true
            # 数字员工的分组名：它进员工名字的哈希材料。主应用与进化两个进程
            # 在同一台机器上各跑一个 worker 池、槽位号相同，少了分组两个池会
            # 算出同名；它是清单里的字面量，所以滚动不会换名。与 evolution 那份
            # 必须不同源同值。
            - name: COGNEVA_AGENT_GROUP
              value: "main"
            # wiki 检索后端（Meilisearch）主密钥：cogneva.json 的
            # providers.wiki.options.api_key 经 ${MEILI_MASTER_KEY} 插值。必填——
            # /health 不鉴权，密钥错误只会在真正读写索引时才暴露，留空会把问题
            # 推迟到运行期，不如让 Pod 起不来。
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: meili-master-key
            # 对象存储凭证：cogneva.json 的 providers.storage.options 经
            # ${S3_ACCESS_KEY} / ${S3_SECRET_KEY} 插值。必填——留空则后端拿空
            # 密钥签名，所有对象读写都是 403，且要到第一次写记忆才暴露。
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-secret-key
            # 贡献通道：GitHub 设备流只用公开的 client_id（本流程无 client_secret）。
            # Gitee 授权码流程的应用凭证由安全网关代持，本进程经
            # COGNEVA_SECURITY_GATEWAY_BASE 借用（授权 URL 与授权码兑换都在网关侧），
            # 本 Pod 零持有 client_secret。那个端点与 Secret 写入的转发共用一条声明，
            # 都在共用的 cogneva-config 里（一份 env、一个来源），所以这里不再单独给。
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: "Ov23liz35yGbAC5vO0OP"
            - name: COGNEVA_GITEE_OAUTH_REDIRECT_URI
              value: "https://hcipengm.github.io/cogneva/oauth-callback.html"
            # GitOps 拉取端：poll 中央 bare 仓库（挂入 /host-git）的 evolution-release
            # 分支，L0 配置热更 / L1 金丝雀在本集群闭环。kubectl 不可用时关闭，避免空转报错。
            - name: COGNEVA_GITOPS_ENABLED
              value: "true"
            - name: COGNEVA_GITOPS_REPO_URL
              value: "/host-git"
            - name: COGNEVA_CLUSTER_NAME
              value: "main"
            - name: COGNEVA_GITOPS_METRICS_URL
              value: "http://localhost:8080/metrics"
            # 数据卷占用只由写它的进程量得出来：目录型卷的"容量"是整个节点文件系统，
            # 声明量与实际占用之间没有任何东西对账。进程知道自己写哪个目录、不知道
            # 目录背后是哪张 PVC，所以由部署侧指名（与上面挂载的 claimName 同一个）。
            - name: COGNEVA_DATA_VOLUME_CLAIM
              value: "cogneva-data-pvc"
            # 主应用是控制面，不是变更执行器：基础 cogneva.json 对全部 Pod 打开
            # self_evolution.enabled，若不在这里关掉执行器，本 Pod 会每轮跑进化
            # 循环 / 基线移植，与专用进化 worker 抢同一实例指纹、裸仓库与工作树
            # 根目录（"missing but already registered worktree" 永久失败）。置
            # false 后本 Pod 仍发布 admin 服务、仍跑上面这条集群侧 GitOps 拉取端。
            - name: COGNEVA_SELF_EVOLUTION_EXECUTOR_ENABLED
              value: "false"
            # 本地模型权重：目录本身就是下面挂进来的那个只读卷，值取自同一个
            # values 键，所以不会出现"挂了卷却还在别处找"或"要找却没有卷"。
            # 两个开关一起开：卷里放的正是这两份权重，而它们的加载都要走同一个
            # 离线目录。嵌入开启后 dense 与 sparse 两个 session 都建起来（混合
            # 检索的两半）；重排是查询侧精排那一步，它的消费者在 cog-wiki。
            # 这个 Pod **不能设 HF_HOME**：fastembed 的 hub 客户端优先它，设了就把
            # 权重目录带偏到别处，而失败读起来像"权重目录坏"，真因在环境里。
            - name: FASTEMBED_CACHE_DIR
              value: "/srv/cogneva/models/fastembed"
            - name: COGNEVA_MEMORY_LOAD_EMBEDDING_MODEL
              value: "true"
            - name: COGNEVA_MEMORY_LOAD_RERANKER_MODEL
              value: "true"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 4000m
              memory: 12Gi
            requests:
              cpu: 500m
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            # 应用数据落持久卷：identity.json 决定实例名，丢了就会随机器指纹重算，
            # 按实例命名的资源逐次遗留；数仓 / 策略 / 记忆 / 原始日志同在此目录。
            - name: app-data
              mountPath: /var/lib/cogneva-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            # GitOps 中央 bare 仓库（与进化部署同一 git-remote 卷）。主 Pod 只读
            # 克隆/fetch，沙盒推送端读写。
            - name: git-remote
              mountPath: /host-git
              readOnly: true
            # 拉取端的 kubectl：K3s 是多调用二进制，argv[0]=kubectl 时就是 kubectl，
            # 版本与集群天然一致，零下载。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
            # 权重只读：写出缓存目录的活由 deploy/scripts/fetch-model-weights.sh 在
            # 宿主上做，Pod 里没有任何东西需要写它。
            - name: model-weights
              mountPath: /srv/cogneva/models/fastembed
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: app-data
          persistentVolumeClaim:
            claimName: cogneva-data-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: prompts
          configMap:
            name: cogneva-prompts
            # 空白机首启时 GitOps 拉取端尚未建过该 configmap，置可选避免卡 FailedMount
            optional: true
        - name: git-remote
          hostPath:
            path: /var/lib/cogneva-data/git-remote
            type: Directory
        - name: kubectl-bin
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        # type: Directory（不是 DirectoryOrCreate）：权重没落下时这里要**挂不上**，
        # 而不是给它一个空目录。空目录的后果是加载器静默退回网络、在连不上 hub 的
        # 集群里把 init 挂死——一个 Pod 起不来的 FailedMount 比那个好读得多。
        - name: model-weights
          hostPath:
            path: /srv/cogneva/models/fastembed
            type: Directory
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
