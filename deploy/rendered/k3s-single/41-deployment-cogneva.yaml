              value: cogneva
            # 观测事件日志的容量与读窗口。这条表只追加、且从没有过删除者，于是它的
            # 大小就是平台在线时长乘以事件速率——运维每天备份、演练每趟恢复的都是
            # 它。两个数是一对：容量是清理目标，读窗口是清理不许越过的线（历史事件
            # 读的就是最近这段，删进来等于让一个能答的查询静默缺一段）。属主由租约
            # 选举，不由这个标志钉死；置 0 = 本 Pod 不参与清理，只量大小。
