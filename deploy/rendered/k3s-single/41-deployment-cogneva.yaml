              value: "1000000"
            - name: COGNEVA_OBSERVABILITY_EVENT_READ_WINDOW_SECS
              value: "86400"
            # 续跑点存储的容量与读窗口。每轮巡检写一份新快照、把任务板指过去，然后
            # 才删被替下的那份——所以任务板是指针的唯一权威，其余都是残物。任务结束
            # 后最后那份没人删（任务板从不退役），于是这张表的大小是「活着的续跑点
            # 加上每个跑完过的任务的最后一份」。两个数是一对：容量是清理目标，读窗口
            # 与任务板指针是清理不许越过的两条线——删掉指针指着的那份等于让这个任务
            # 再也续不上，而指针还在。属主由租约选举；置 0 = 本 Pod 不参与清理。
            - name: COGNEVA_CHECKPOINT_MAX_ROWS
              value: "40000"
            - name: COGNEVA_CHECKPOINT_READ_WINDOW_SECS
              value: "86400"
            # 提示词留底（gateway_llm_exchange）的保留期。保底的是「一次调用到底发了
            # 什么、回来什么」这件事后能答而不必再买一次；成本由单次正文大小决定，
            # 所以只按时间封顶。清理循环跑在主应用里而不是网关里——网关每次滚动都重启，
