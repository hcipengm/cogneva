# 外部 prompt 模板（hot_reload 捕捉 ConfigMap 交换，L0 配置晋级热更新通道）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-prompts
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/instance: cogneva
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.5.8"
    app.kubernetes.io/component: config
data:
  default.yaml: |-
    # 启动兜底的 prompt 集：只放「进程起来时就必须有」的那几条。
    # 与 system_prompts.yaml 一起被 cogneva-prompts 挂进 /etc/cogneva/prompts。
    # 两个文件的 key 不许重名：registry 是覆盖写（`PromptRegistry::register`），
    # 重名等于其中一份声明被静默顶掉——门禁 `deploy/scripts/tests/prompt-declaration-wiring.test.sh` 判重。
    prompts:
      agent:default:
        content: "You are a helpful assistant."
        version: "1.0.0"
    
  system_prompts.yaml: |-
    # Cogneva System Prompts
    # 所有 system prompt 集中管理，支持运行时热加载。
    #
    # 本文件的每一条声明都必须有读者。`deploy/scripts/tests/prompt-declaration-wiring.test.sh`
    # 双向核对「代码里被请求的 key」与「这里声明的 key」：多一条、少一条都判红。
    # 一条没人读的声明会让读者以为改这里就等于改行为——那比没有这条声明更坏。
    # 启动兜底的那一条（agent:default）在 default.yaml，两个文件不许重名：
    # registry 是覆盖写，重名就是其中一份声明被静默顶掉。
    #
    # 无 prompt 管理器时（进程里没装配 prompt 插件）调用方会退回代码里的兜底文本，
    # 兜底写在 `crates/cog-reflection/src/{evolution,extractor}.rs`。同一个 key 的
    # 两处正文必须说同一件事：只改一侧就是被读到的那一侧说了算、另一侧悄悄变旧。
    
    prompts:
      # ==========================================================================
      # cog-reflection
      # ==========================================================================
      reflection:skill_extractor:
        content: |
          You are a skill extraction assistant. Respond with valid JSON only.
        version: "1.0.0"
        description: "SkillExtractor system prompt"
        tags: ["reflection", "extraction"]
        active: true
    
      reflection:evolution_refinement:
        content: |
          You are evolving an existing agent skill based on production feedback.
    
          Current skill:
          {{ skill_json }}
    
          Generate an improved version as valid JSON with the same schema:
          - skill_id (keep identical: '{{ skill_id }}')
          - name (improved if needed)
          - tools (add/remove based on learnings)
          - max_iterations (tune if needed)
          - role_type (keep or refine)
          - system_prompt (the actual prompt text that guides the agent)
        version: "1.0.0"
        description: "EvolutionEngine skill refinement prompt"
        tags: ["reflection", "evolution"]
        active: true
    
      reflection:evolution_refinement_system:
        content: |
          Respond with valid JSON SkillConfig only.
        version: "1.0.0"
        description: "EvolutionEngine skill refinement system instruction"
        tags: ["reflection", "evolution"]
        active: true
    
      # 答案的形状必须抄读者的解析器：生成的正文由 `EvolutionEngine::extract_unified_diff`
      # 读，它只认 `diff --git ` / `--- a/` 起始的行，读不到就把整段作答当「概念性回答」丢掉
      # （`.diff` 不落盘、流水线不消费）。要求 Markdown 代码块会让这条链自己踩自己的读者。
      reflection:evolution_change:
        content: |
          You are an expert Rust engineer improving an AI agent system.
    
          Context:
          {{ learning_context }}
    
          Requirement:
          {{ module_description }}{% if compile_errors is defined %}
    
          Previous attempt failed validation. Errors:
          {{ compile_errors }}
    
          Please fix these errors and regenerate the change.{% endif %}
    
          Generate a change that addresses the requirement. Output ONLY a unified diff (starting with 'diff --git a/... b/...'), with no markdown fences and no prose. This is a Rust workspace; modify only source files under crates/**/*.rs.
        version: "1.0.0"
        description: "EvolutionEngine code change generation prompt"
        tags: ["reflection", "evolution"]
        active: true
    
      reflection:evolution_change_system:
        content: |
          Respond with a single unified diff change and nothing else.
        version: "1.0.0"
        description: "EvolutionEngine change system instruction"
        tags: ["reflection", "evolution"]
        active: true
    
      reflection:evolution_tool:
        content: |
          You are a tool design expert for an AI agent system.
    
          Existing tool: {{ tool_name }}
    
          Observed error patterns:
          - {{ error_patterns }}
    
          Generate an improved tool variant as JSON with these fields:
          - name: tool name (suggest a new name like {{ tool_name }}_v2 or {{ tool_name }}_improved)
          - description: concise description of what the tool does
          - parameters: valid JSON Schema object describing input parameters
          - implementation_hint: string describing implementation approach (e.g., "native", "wasm", "rhai")
    
          Respond with ONLY the JSON object.
        version: "1.0.0"
        description: "EvolutionEngine tool variant prompt"
        tags: ["reflection", "evolution"]
        active: true
    
      reflection:evolution_tool_system:
        content: |
          Respond with valid JSON tool definition only.
        version: "1.0.0"
        description: "EvolutionEngine tool variant system instruction"
        tags: ["reflection", "evolution"]
        active: true
    
