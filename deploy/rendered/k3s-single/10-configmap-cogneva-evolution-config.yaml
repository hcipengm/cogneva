data:
  COGNEVA_SELF_EVOLUTION_ENABLED: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_APPLY: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_DEPLOY: "true"
  COGNEVA_SELF_EVOLUTION_SANDBOX_MODE: "true"
  COGNEVA_SELF_EVOLUTION_SWITCH_MODE: "self_exec"
  COGNEVA_SELF_EVOLUTION_CHANGE_DIR: "/opt/cogneva/sandbox/changes"
  COGNEVA_SELF_EVOLUTION_BINARY_DIR: "/opt/cogneva/sandbox/bin"
  COGNEVA_SELF_EVOLUTION_BACKUP_DIR: "/opt/cogneva/sandbox/backups"
  COGNEVA_SELF_EVOLUTION_POLL_INTERVAL_SECS: "300"
  COGNEVA_SELF_EVOLUTION_TEST_TIMEOUT_SECS: "600"
  COGNEVA_SELF_EVOLUTION_BUILD_TIMEOUT_SECS: "1800"
  # 工作树动态分配：部署器独占一棵稳定路径的检出，进化任务各取临时检出，
  # 互不影响；共享 CARGO_TARGET_DIR 在工作树之外，重建工作树不丢增量缓存。
  COGNEVA_SELF_EVOLUTION_WORKSPACES_ROOT: "/opt/cogneva/sandbox/workspaces"
  COGNEVA_SELF_EVOLUTION_WORKSPACES_TARGET_DIR: "/opt/cogneva/sandbox/src/target"
  COGNEVA_SELF_EVOLUTION_WORKSPACES_EPHEMERAL_TTL_SECS: "21600"
  # 晋级门（推送端）：沙盒验证全过的变更（change）经分级策略判定后，L0/L1 自动晋级
  # 走 GitOps 发布（annotated tag + evolution-release 分支推中央 bare 仓库），
  # L2 留审批台。推送只写挂载的 bare 仓库 /host-git，不持任何集群凭证。
  COGNEVA_SELF_EVOLUTION_PROMOTION_ENABLED: "true"
  COGNEVA_GITOPS_ENABLED: "true"
  COGNEVA_GITOPS_REPO_URL: "/host-git"
  # 沙盒只推不拉：拉取端（poll/金丝雀/回滚）跑在主部署 Pod，那里有 kubectl
  # 与 RBAC；本 Pod 起拉取端只会每轮报错。
  COGNEVA_GITOPS_PULLER_ENABLED: "false"
  COGNEVA_MEMORY_ENABLED: "false"
  COGNEVA_VECTOR_BACKEND_REQUIRED: "false"
  COGNEVA_STRICT_PERSISTENCE: "false"
  # 主线跟踪自动部署器：检测 bare 仓库公版 main 前进后，沙盒构建 → buildah 推
  # 集群内 registry（Pod 内走 Service DNS:5000）→ 派独立 Job 经节点 NodePort
  # localhost:30500 滚动四部署。回滚目标由 Job 启动时快照，不在此配置。
  COGNEVA_MAINLINE_DEPLOYER_ENABLED: "true"
  COGNEVA_MAINLINE_DEPLOYER_POLL_INTERVAL_SECS: "600"
  COGNEVA_MAINLINE_DEPLOYER_REGISTRY: "cogneva-registry.cogneva.svc.cluster.local:5000"
  COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY: "localhost:30500"
  COGNEVA_MAINLINE_DEPLOYER_NAMESPACE: "cogneva"
  COGNEVA_MAINLINE_DEPLOYER_SOAK_SECS: "120"
  COGNEVA_MAINLINE_DEPLOYER_FAILURE_COOLDOWN_SECS: "3600"
  COGNEVA_MAINLINE_DEPLOYER_CARGO_BUILD_JOBS: "2"
  # 滚动 Job Pod 挂载宿主 k3s 二进制作为 kubectl（镜像不内置 kubectl）。
  COGNEVA_MAINLINE_DEPLOYER_KUBECTL_HOST_PATH: "/usr/local/bin/k3s"
