# 恢复演练：把最新一个包装进一个**空库**，读它装成了什么，然后删库。
#
# 为什么是一个独立的 CronJob 而不是备份那一跑的一部分：演练要连源库、要建库、
# 要灌一整个库，任何一步出错都不该让当晚的备份算失败。两件事共用同一个包，但
# 一件的失败不能变成另一件的结果。
#
# 为什么是空库而不是空白命名空间：`CREATE DATABASE` 给的是一个没有表、没有行的
# 目标，这正是「恢复到一个干净的地方」要的东西；而空白命名空间要再拉一套
# Postgres/Qdrant/Secret，演练还没开始就先考验了一遍安装。演练跑在自己的 Pod、
# 自己的库名里，源 schema 一个字节都不碰——账表是同一批人要看的那张表，拿它当
# 演练场就是把要证明的东西押上去。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup-drill
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup-drill
spec:
  schedule: "47 3 * * *"
  timeZone: "Etc/UTC"
  # 同备份：两次演练同时在跑只会在同一个库名上互相删库。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 演练失败不重试成串：答案已经落进 backup_drills 了，下一晚自然再来。
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup-drill
        spec:
          restartPolicy: Never
          containers:
            - name: drill
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              args: ["backup-drill"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                # 演练连的是**源库**：它要在同一个服务器上建演练库，并把装回来的
                # 账行与源库那几行逐格比。这不违反「不在源库上做演练」——遍历的
                # 是另一个数据库名，源 schema 只被读。
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 只读：演练遍历卷外那一份，看它是不是刚装回去的这个包。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                # 只读：演练打开包，绝不写卷。保留的一份都不动。
                - name: backup
                  mountPath: /backups
                  readOnly: true
                - name: offsite
                  mountPath: /offsite
                  readOnly: true
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
