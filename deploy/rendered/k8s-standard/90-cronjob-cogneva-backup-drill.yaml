# Source: cogneva/templates/backup.yaml
# 恢复演练：把最新一个包装进一个**空库**，读它装成了什么，然后删库。
#
# 为什么是一个独立的 CronJob 而不是备份那一跑的一部分：演练要连源库、要建库、
# 要灌一整个库，任何一步出错都不该让当晚的备份算失败。两件事共用同一个包，但
# 一件的失败不能变成另一件的结果。
#
# 为什么是空库而不是空白命名空间：`CREATE DATABASE` 给的是一个没有表、没有行的
# 目标，这正是「恢复到一个干净的地方」要的东西；而空白命名空间要再拉一套
# Postgres/Qdrant/Secret，演练还没开始就先考验了一遍安装。演练跑在自己的 Pod、
# 自己的库名里，源 schema 一个字节都不碰——账表是同一批人要看的那张表，拿它当
# 演练场就是把要证明的东西押上去。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup-drill
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup-drill
spec:
  schedule: "47 3 * * *"
  timeZone: "Etc/UTC"
  # 同备份：两次演练同时在跑只会在同一个库名上互相删库。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 演练失败不重试成串：答案已经落进 backup_drills 了，下一晚自然再来。
      backoffLimit: 0
      # 同备份：这里曾经是 `activeDeadlineSeconds`——它杀的是「这一趟跑了多久」，
      # 而两趟演练在某些夜晚的总时长本来就会超过任何一个固定的钟。判停改由存活
      # 探针读进度文件：一步都不推进超过窗口才判死（见容器上那一格）。
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup-drill
            cogneva.io/logs: self
        spec:
          restartPolicy: Never
          # 同备份：演练必须与备份跑在同一个专用非 root uid 上。它读的正是备份
          # 写下的包，两个 uid 不一致时「谁能读包」就取决于属主漂到哪一边。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          # 同备份：演练是唯一同时看得到三处凭证目录的进程，它把「不是 0700 的
          # 目录」量成违例。主容器为了不写卷是只读挂载，收紧权限放在 init 里、
          # 用可写挂载做——只读挂载上 chmod 会直接失败。收紧之前先把属主交给
          # 主容器的 uid：0700 的目录对非属主连遍历都不给。
          initContainers:
            - name: tighten-credential-surface
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              command:
                - sh
                - -c
                - >-
                  chown -R 1001:1001 /backups /offsite /offsite-state &&
                  chmod 0700 /backups /offsite /offsite-state
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
                - name: offsite-state
                  mountPath: /offsite-state
          containers:
            - name: drill
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              # 最新那份 ＋ 窗口里最久没被成功打开过的一份：只开最新证明不了保留
              # 窗口的其余成员，而旧包与读端不同步的问题只在旧包上出现。
              args: ["backup-drill", "--also-unproven"]
              # 同备份：探针读的是这一跑写下的进度文件，判的是「还在不在推进」。
              # 窗内一步都不推进才判死；两趟一共跑多久不参与判断。
              livenessProbe:
                exec:
                  command:
                    - sh
                    - -c
                    - >-
                      f="$COGNEVA_PROGRESS_FILE"; if [ -z "$f" ] || [ ! -f "$f" ]; then
                      echo "no progress file (COGNEVA_PROGRESS_FILE='$f')"; exit 1; fi;
                      age=$(( $(date +%s) - $(date -r "$f" +%s) )); win=$(cat "$f");
                      echo "quiet ${age}s, window ${win}s"; [ "$age" -le "$win" ]
                
                periodSeconds: 30
                
                failureThreshold: 3
                
                initialDelaySeconds: 120
              env:
                - name: TZ
                  value: "Asia/Shanghai"
                - name: COGNEVA_LOKI_ENABLED
                  value: "true"
                - name: COGNEVA_LOKI_ENDPOINT
                  value: "http://loki.monitoring.svc.cluster.local:3100"
                - name: COGNEVA_PROGRESS_FILE
                  value: /var/run/cogneva-progress/beat
                # 一步的静默界：解包、核清单、建空库、恢复、对数……任何一步静默
                # 超过它，由这一跑自己收尾并落一行 `failed`，判词点名停在哪一步。
                # 整趟不受这条界约束——每一步都在推进时跑多久都行。
                - name: COGNEVA_BACKUP_DRILL_STEP_SILENCE_SECS
                  value: "3600"
                # 这一处连的是**cog_backup**，一个只带 CREATEDB 的受限角色：演练要在
                # 同一台服务器上 `CREATE DATABASE` 一个一次性库，所以不能是 `cog_app`
                # （没有 CREATEDB）；而它也不需要超级用户位——恢复没有它时按外键依赖
                # 顺序装、检查照样开着（见 `restore_postgres`），2026-11-01 在现网用
                # 这样一个角色跑通过一整趟。它是**最后一个还连着 cog_user** 的工作
                # 负载：换过来之后，那个超级用户角色没有任何 Pod 连着它。
                - name: BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: backup-password
                # 演练连的是**源库**：它要在同一个服务器上建演练库，并把装回来的
                # 账行与源库那几行逐格比。这不违反「不在源库上做演练」——遍历的
                # 是另一个数据库名，源 schema 只被读。
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_backup:$(BACKUP_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 只读：演练遍历卷外那一份，看它是不是刚装回去的这个包。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                # 宿主定时器的观察文件：仓库里最新一份的时刻、最新一把钥匙的
                # 创建时刻。由那一跑自己读仓库写下，演练只读；文件不在 = 这一
                # 面没量过，账本留空列，规则读作「从来没人观察过」。
                - name: COGNEVA_BACKUP_OFFSITE_STATE_DIR
                  value: "/offsite-state"
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                # 只读：演练打开包，绝不写卷。保留的一份都不动。
                - name: backup
                  mountPath: /backups
                  readOnly: true
                - name: offsite
                  mountPath: /offsite
                  readOnly: true
                # 只读：观察文件是宿主定时器写的，演练只读不写。
                - name: offsite-state
                  mountPath: /offsite-state
                  readOnly: true
                - name: progress
                  mountPath: /var/run/cogneva-progress
          volumes:
            - name: progress
              emptyDir: {}
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
            - name: offsite-state
              hostPath:
                path: "/var/lib/cogneva-backup-offsite"
                type: DirectoryOrCreate
