          volumeMounts:
            - name: host-cgroup
              mountPath: "/host/cgroup"
              # 只读：读数不需要写权，挂成只读让"量一下"这件事不可能改到宿主。
              readOnly: true
      volumes:
        - name: host-cgroup
          hostPath:
            path: "/sys/fs/cgroup"
            type: Directory
      tolerations:
        - operator: Exists
