              # bare 保持一个指向上游的 upstream remote，启动时拉最新 main 与 release tag。
              # 失败不阻塞：离线时用 seed 已带的 tag（当前部署版本的 tag 在 seed 时就存在）。
              git --git-dir=/host-git remote remove upstream 2>/dev/null || true
              git --git-dir=/host-git remote add upstream https://github.com/hcipengm/cogneva.git
              if ! git --git-dir=/host-git fetch upstream --tags --force; then
                echo "WARN: fetch upstream tags failed (offline?); using tags present at seed"
              fi
              # 工作树由分配器按需从裸仓库切出（零克隆、共享对象库），这里只清掉
              # 崩溃留下的孤儿登记，并备好工作树根目录（app 容器的 workingDir）。
              git --git-dir=/host-git worktree prune
              mkdir -p /opt/cogneva/sandbox/workspaces
