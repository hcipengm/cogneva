              mountPath: /host-git
              readOnly: false
            - name: cogneva-json
              # 必须挂目录：挂成 /etc/cogneva/cogneva.json 且无 subPath 会把
              # ConfigMap 挂成同名目录，进程读文件失败静默回退默认配置
              mountPath: /etc/cogneva
              readOnly: true
          resources:
            limits:
              cpu: 4000m
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-pvc
        - name: source
          persistentVolumeClaim:
            claimName: cogneva-evolution-source-pvc
        - name: git-remote
          # 多节点/生产：hostPath 只存在于单个节点，必须走集群卷
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
