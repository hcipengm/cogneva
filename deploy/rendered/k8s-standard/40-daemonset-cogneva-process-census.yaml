# 进程采集器：每节点一个，把宿主上**每一个**容器实例里跑着什么报给网关。
#
# 为什么不能靠容器自报：那一条只有跑本平台镜像的容器会做（进程里有我们自己的
# 上报循环），postgres、nats、registry、评测环境这些第三方镜像一个都不报，而屏上
# 那一格写「没有自报的进程表」——读起来像「里面没有进程」。进程属于容器这件事对
# 谁家的镜像都成立，所以读数不能建立在「镜像里愿意配合」上。
#
# 也不 exec 进容器跑 ps：那要一项对业务容器执行命令的权限，而且是每看一次敲一次。
# 这个 Pod 走的是宿主自己的账，容器里跑的是什么与它无关：
#
#   - hostPID：`/proc` 是宿主的那一份，`/proc/<pid>/comm` 读得到任何进程；
#   - 宿主 cgroup 根只读挂进来：每个 `cri-containerd-<id>.scope` 叶子就是一个容器
#     实例，叶子名里的 id 与 Pod 状态里的 `containerID` 是同一个；
#   - 叶子的 `cgroup.procs` 给出这个容器的全部 PID，再逐个读 `/proc/<pid>`。
#
# 权限面就是「看得到宿主进程」：不需要特权、不需要 root、不需要 SA token，挂载是
# 只读的，读的两个文件（`cgroup.procs`、`/proc/<pid>/comm`）本来对谁都可读。
# 与 host-ledger 一样，它读不到内存内容、改不了任何状态。
#
# 与 host-ledger 分成两个 Pod 而不是合成一个：hostPID 是这一面唯一需要的额外能力，
# 合进去等于让读 cgroup 内存的那一半也拿到它。能力边界落在 Pod 上，谁越多谁单独写。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cogneva-process-census
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/instance: cogneva
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.5.10"
    app.kubernetes.io/component: process-census
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: process-census
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: process-census
    spec:
      # 宿主 PID 命名空间：没有它，`/proc` 里只有本容器自己，第三方容器一个都读不到。
      hostPID: true
      # 这台 Pod 里的程序不跟 API server 说话：它读宿主文件系统、发一个 HTTP POST。
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: process-census
          image: localhost:30500/cogneva:local
          imagePullPolicy: Always
          # 子命令必须写在命令行上：不带它，镜像入口跑的是完整应用，而这一格里
          # 没有 Redis 也没有配置面，进程在装配阶段就退。
          command: ["/opt/cogneva/cogneva"]
          args: ["process-census"]
          env:
            - name: COGNEVA_PROCESS_CENSUS_ROOT
              value: "/hostcgroup"
            # 节点名从 fieldRef 取，不由上报方自己推断：这个标签是「哪台节点有人在采」
            # 的唯一来源，猜错一次就是一台真节点读作没有采集器。
            - name: COGNEVA_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: host-cgroup
              mountPath: "/hostcgroup"
              # 只读：这一面只读 cgroup.procs，挂成只读让「看一眼」不可能改到宿主。
              readOnly: true
      volumes:
        - name: host-cgroup
          hostPath:
            path: "/sys/fs/cgroup"
            # Directory 而不是 DirectoryOrCreate：挂载点不存在说明这台宿主的布局
            # 不是我们认识的，造一个空目录只会把「配置错了」变成「干净的空账」。
            type: Directory
      tolerations:
        - operator: Exists
