apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cogneva
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: message-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: message-queue
    spec:
      # Runs before redis-server so a torn AOF tail — the artefact an unclean host
      # stop leaves behind, which redis reads as a malformed record rather than as
      # end-of-file — is dropped instead of making the instance refuse to start.
      # The probe before the subcommand exists because the deployment pins the
      # floating :local tag: an image seeded from a release predating this command
      # would otherwise hold the pod in Init forever. Standing aside with a
      # warning is the honest outcome there; redis still refuses to load and its
      # own error is then the one that says why.
      initContainers:
        - name: aof-repair
          image: localhost:30500/cogneva:local
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              if ! /opt/cogneva/cogneva --help 2>&1 | grep -q 'repair-aof'; then
                echo "aof-repair: level=warn this image predates the repair-aof command; nothing was inspected"
                exit 0
              fi
              exec /opt/cogneva/cogneva repair-aof /data/appendonlydir
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          # 启动预算单独给：加载 40Mi 级 AOF 的耗时由数据量决定，与"运行中还
          # 能不能应答"是两件事；混用会让数据一多就把健康的实例判死。
          startupProbe:
            tcpSocket:
              port: redis
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
