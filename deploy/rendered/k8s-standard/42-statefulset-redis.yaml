# Source: helm chart deploy/helm/cogneva + profiles/k8s-standard.yaml
# Change chart templates / values / profile, then re-run render-deploy.sh.
# Source: cogneva/templates/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cogneva
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: message-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: message-queue
    spec:
      # Runs before redis-server so a torn AOF tail — the artefact an unclean host
      # stop leaves behind, which redis reads as a malformed record rather than as
      # end-of-file — is dropped instead of making the instance refuse to start.
      # The probe before the subcommand exists because the deployment pins the
      # floating :local tag: an image seeded from a release predating this command
      # would otherwise hold the pod in Init forever. Standing aside with a
      # warning is the honest outcome there; redis still refuses to load and its
      # own error is then the one that says why.
      #
      # The verdict is published as well as printed: container logs are shipped
      # nowhere, so "this startup gave up 208 bytes" had no reader at all. The
      # second guard is not a capability probe but the reading itself — a
      # path-named file that is still empty after the repair means the operand was
      # not honoured, and that absence has to be stated rather than left to look
      # like a clean pass.
      initContainers:
        - name: aof-repair
          image: localhost:30500/cogneva:local
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              report=/report/aof-repair.prom
              if ! /opt/cogneva/cogneva --help 2>&1 | grep -q 'repair-aof'; then
                printf '%s 0\n' cogneva_aof_repair_verdict_published > "$report"
                echo "aof-repair: level=warn this image predates the repair-aof command; nothing was inspected"
                exit 0
              fi
              /opt/cogneva/cogneva repair-aof /data/appendonlydir --metrics-file "$report"
              rc=$?
              if [ ! -s "$report" ]; then
                printf '%s 0\n' cogneva_aof_repair_verdict_published > "$report"
                echo "aof-repair: level=warn no verdict was published (rc=$rc); the AOF findings are unobservable"
              fi
              exit $rc
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: aof-report
              mountPath: /report
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          # 启动预算单独给：加载 40Mi 级 AOF 的耗时由数据量决定，与"运行中还
          # 能不能应答"是两件事；混用会让数据一多就把健康的实例判死。
          startupProbe:
            tcpSocket:
              port: redis
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
        # Publishes what redis knows about itself and Prometheus otherwise cannot
        # see: memory in use against the container's own limit, connected
        # clients, and the keyspace size. redis-server has no metrics endpoint,
        # so the same textfile directory the AOF verdict already uses is the
        # only path a reading from inside this Pod can take to a scraper.
        #
        # Why not the exporter's own memory series: cAdvisor's working set counts
        # reclaimable page cache, which on a store holding a multi-gigabyte AOF
        # sits near the limit on a healthy instance, so it cannot say whether the
        # cgroup is about to be OOM-killed. `used_memory` is the number redis
        # enforces `maxmemory` against, and `maxmemory=0` is why the limit has to
        # be read from the workload's own resources rather than from the store.
        #
        # Written atomically and republished every interval: a reader that finds
        # the file stale knows the writer died, which a file rewritten in place
        # could not say. The update timestamp travels with the values so the
        # staleness itself is a reading rather than an assumption.
        - name: redis-info-exporter
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          # Lives as long as the Pod. redis-cli is in this image already, so the
          # poller needs no second image and no client library.
          command:
            - sh
            - -c
            - |
              report=/report/redis-info.prom
              props=/report/.redis-info.props
              walprops=/report/.redis-wal.props
              interval=30
              wal_interval=300
              # How many keys start with `wal:` and how long the longest one is.
              # The log list of each agent is never deleted, so this is the pair
              # that says whether the per-session cap is holding and how much of
              # the dataset the logs are. One EVAL walks the keyspace server side
              # and LLENs each match, because the shell would otherwise fork a
              # client per key; that walk is why it runs on its own slower clock
              # rather than with every INFO. It reads keys, never writes them.
              wal_census='local c=0 local n=0 local cur="0" repeat local r=redis.call("SCAN",cur,"MATCH","wal:*","COUNT",1000) cur=r[1] for i=1,#r[2] do local l=redis.call("LLEN",r[2][i]) if l>n then n=l end c=c+1 end until cur=="0" return {c,n}'
              value() { sed -n "s/^$1://p" "$props" | head -n 1 | tr -d '\r'; }
              line() { sed -n "$2p" "$1" 2>/dev/null | head -n 1; }
              scanned=0
              while true; do
                if redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" --no-auth-warning INFO \
                    > "$props" 2>/dev/null && grep -q '^used_memory:' "$props"; then
                  now=$(date +%s)
                  # The census writes its own file and is read back from it, so a
                  # failed scan leaves the last pair and an ageing timestamp
                  # rather than dropping the series out of the exposition.
                  if [ $((now - scanned)) -ge "$wal_interval" ]; then
                    census=$(redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" --no-auth-warning \
                      EVAL "$wal_census" 0 2>/dev/null)
                    wal_keys=$(printf '%s\n' "$census" | sed -n '1p')
                    wal_max=$(printf '%s\n' "$census" | sed -n '2p')
                    case "$wal_keys$wal_max" in
                      ''|*[!0-9]*) : ;;
                      *) printf '%s\n%s\n%s\n' "$wal_keys" "$wal_max" "$now" \
                           > "$walprops.tmp" && mv "$walprops.tmp" "$walprops"
                         scanned=$now ;;
                    esac
                  fi
                  db0=$(value db0)
                  keys=${db0#*keys=}
                  keys=${keys%%,*}
                  {
                    printf '%s %s\n' "cogneva_redis_memory_used_bytes" "$(value used_memory)"
                    printf '%s %s\n' "cogneva_redis_memory_peak_bytes" "$(value used_memory_peak)"
                    printf '%s %s\n' "cogneva_redis_memory_max_bytes" "$(value maxmemory)"
                    printf '%s %s\n' "cogneva_redis_connected_clients" "$(value connected_clients)"
                    printf '%s %s\n' "cogneva_redis_maxclients" "$(value maxclients)"
                    printf '%s{db="db0"} %s\n' "cogneva_redis_db_keys" "${keys:-0}"
                    printf '%s %s\n' "cogneva_redis_info_interval_seconds" "$interval"
                    printf '%s %s\n' "cogneva_redis_info_updated_timestamp_seconds" "$now"
                    printf '%s %s\n' "cogneva_redis_wal_scan_interval_seconds" "$wal_interval"
                    wal_keys=$(line "$walprops" 1)
                    wal_max=$(line "$walprops" 2)
                    wal_at=$(line "$walprops" 3)
                    [ -n "$wal_keys" ] && printf '%s %s\n' "cogneva_redis_wal_keys" "$wal_keys"
                    [ -n "$wal_max" ] && printf '%s %s\n' "cogneva_redis_wal_max_length" "$wal_max"
                    [ -n "$wal_at" ] && printf '%s %s\n' "cogneva_redis_wal_scan_timestamp_seconds" "$wal_at"
                  } > "$report.tmp" && mv "$report.tmp" "$report"
                fi
                sleep "$interval"
              done
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: aof-report
              mountPath: /report
        # Serves the verdict the init container wrote. redis-server exposes no
        # metrics endpoint, so a textfile collector beside it is the only way a
        # one-shot container's reading can reach a scraper; the file lives on an
        # emptyDir shared with that one-shot container, so the reading dies with
        # the pod it describes — which is right, it is a statement about this
        # startup, not about the instance over time.
        - name: aof-report-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1-distroless
          imagePullPolicy: IfNotPresent
          args:
            - --collector.disable-defaults
            - --collector.textfile
            - --collector.textfile.directory=/report
          ports:
            - name: aof-metrics
              containerPort: 9100
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: aof-report
              mountPath: /report
              readOnly: true
      volumes:
        - name: aof-report
          emptyDir:
            # The whole payload is a gauge per finding class plus one INFO
            # snapshot, a few hundred bytes. The bound is here so a broken
            # writer cannot grow it.
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
