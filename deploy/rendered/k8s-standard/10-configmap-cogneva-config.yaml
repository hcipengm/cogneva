# GENERATED by deploy/scripts/render-deploy.sh — DO NOT EDIT.
# Source: helm chart deploy/helm/cogneva + profiles/k8s-standard.yaml
# Change chart templates / values / profile, then re-run render-deploy.sh.
# Source: cogneva/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-config
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/instance: cogneva
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.5.10"
    app.kubernetes.io/component: config
data:
  COGNEVA_APP_NAME: "cogneva"
  COGNEVA_APP_VERSION: "0.5.10"
  COGNEVA_LOG_LEVEL: "info"
  COGNEVA_DATA_DIR: "/var/lib/cogneva-data"
  COGNEVA_CONFIG_DIR: "/etc/cogneva"
  COGNEVA_APP_DIR: "/opt/cogneva"
  # WebUI 静态资源目录（镜像内 web 构建产物位置），不设会回退到构建机源码路径
  COGNEVA_WEB_DIR: "/opt/cogneva/web"

  COGNEVA_DB_PROVIDER: "mysql"
  COGNEVA_PG_PROVIDER: "postgres"
  # 同一台 Postgres 上有几个进程各开一套连接池：主应用、进化、安全网关，再加一个
  # 滚动更新时同时活着的新 Pod。每个进程把服务器的连接上限按这个数分摊到自己的池
  # 上，数少了就是把别人的份也算成自己的——实测 2026-10-30 滚动时新 Pod 报
  # `pool timed out while waiting for an open connection`：每进程五个池各九条，
  # 三个进程九十条，服务器只剩九十七条，第四个进程一上来就超。
  #
  # 值从各工作负载的副本数算出来，不是这里另写一个数：改了副本数而这里不动，
  # 分摊就会按过期的进程数做。`+1` 是滚动影子——同一次滚动里新 Pod 已经连上、
  # 旧 Pod 还没退出，两者都要算。
  COGNEVA_PG_SHARING_PROCESSES: "4"
  COGNEVA_VECTOR_PROVIDER: "qdrant"
  QDRANT_URL: "http://qdrant.cogneva.svc.cluster.local:6334"
  COGNEVA_MEDIA_PROVIDER: "local-sfu"
  COGNEVA_STORAGE_PROVIDER: "local-fs"

  COGNEVA_WORKSPACE_ID: "default"
  # 每个用户工作区的字节上限（0 = 不限）。拒绝写入时把这条错误信息里点名的
  # 就是这一个键，所以它必须真的能从 values 走到这里——否则报错指的是一条
  # 运维按正常路径改不动的开关。
  COGNEVA_WORKSPACE_MAX_BYTES: "1073741824"
  COGNEVA_CONSUMER_GROUP: "cogneva"
  # 看板列的在制品上限。空串＝没配＝不限，渲染成空串而不是省略：省略会让「清单里
  # 没有这个键」与「运维没配」变成同一件事。发布侧与看板读面都经 envFrom 取这一份，
  # 写在这里的数就是真正拦住派发的那个——两处各配一份，看板会报一个没人拦的数。
  #
  # 发布是 `pending`→`scheduled` 这一步，所以可配的列只有 scheduled 与
  # running：pending 的限额会拦住唯一能腾空它的那一步，终态列只增不减。
  COGNEVA_BOARD_WIP_LIMITS: ""

  # 进程被告知的三个端口，与容器实际监听的那三个同源（values 的 gateway.*Port，
  # 也与 files/cogneva.json 里的 gateway.*_port 同源）：env 层覆盖 JSON，两处
  # 各写一个数时，覆盖生效的那次会悄悄把进程挪到另一个端口，而 Service 没动。
  COGNEVA_HTTP_PORT: "8080"
  COGNEVA_WS_PORT: "8081"
  COGNEVA_METRICS_PORT: "9090"

  # 安全网关的内部端点：Secret 写入的转发与 Gitee OAuth 的借用都走它。端口与
  # securityGateway.llmProxyPort 同源——容器的 containerPort、Service 的端口、
  # files/cogneva.json 里那几处 `cogneva-security-gateway:8081` 的改写读的都是这
  # 一个数，代码里再留一个默认值就成了第二个数，改 values 挪不动它。
  COGNEVA_SECURITY_GATEWAY_BASE: "http://cogneva-security-gateway:8081"
  # Prometheus：读数面查询的那一台。与 observability.infraWatch.prometheusUrl
  # 同源——规则求值读的是 cogneva.json 的 infra_watch.prometheus_url，两者问的
  # 是同一台机器，各写一个地址就等于允许它们分开。
  COGNEVA_PROMETHEUS_URL: "http://cog-observability-prometheus.monitoring:9090"
  # 集群内 registry 的两条访问端点：Pod 内 buildah 用 Service DNS，节点上 kubelet
  # 用 localhost:NodePort。两者都是 `clusterRegistry.port` / `nodePort` 的投影，
  # 放在共用 env 里而不是只给进化 Pod：晋级镜像的引用由主应用的拉取端产出，它同样
  # 要读这两条。代码那侧没有默认值可退（缺了报错），所以这里必须两份形态都给。
  COGNEVA_MAINLINE_DEPLOYER_REGISTRY: "cogneva-registry.cogneva.svc.cluster.local:5000"
  COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY: "localhost:30500"

  # 告警通知出口地址。出口机制四类 dispatcher 都在代码里，缺的只是地址；空值
  # 不建出口（与 cogneva.json 的 null 等价）。地址只由集群侧 values / --set 给，
  # 所以这里渲染成空串而不是省略——省略会让"这份清单里没有这个键"与"运维没配"
  # 变成同一件事。主应用与进化 Pod 都经 envFrom 取这一份。
  COGNEVA_NOTIFICATION_WEBHOOK_URL: ""

  # 平台机器人地址。四个出口在代码里都能挂上，但在此之前只有通用 webhook 有一条
  # 配置路径——另外三个「永远挂不上」的那种坏法没有任何读数：插件只会报「没有出口」，
  # 而这是运维没配地址的合法状态。地址一律渲染成空串而不是省略，理由同上。
  COGNEVA_NOTIFICATION_DINGTALK_URL: ""
  COGNEVA_NOTIFICATION_FEISHU_URL: ""
  COGNEVA_NOTIFICATION_WECHAT_WORK_URL: ""

  # 告警出口地址（Alertmanager 接收端 / 邮件 / Slack）。三类 dispatcher 都在
  # cog-observability 里，缺的一直只是地址——地址就是开关，空串 = 不建出口。
  # 中继口令不在这份清单里：它是凭证，由 Pod 侧那条 secretKeyRef 注入（见
  # gateway.yaml / evolution.yaml），清单只送非凭证的那些键。
  COGNEVA_ALERTMANAGER_WEBHOOK_URL: ""
  COGNEVA_ALERTMANAGER_EMAIL_RECIPIENTS: ""
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_HOST: ""
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_PORT: "587"
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_USERNAME: ""
  COGNEVA_ALERTMANAGER_EMAIL_FROM: "alerts@cogneva.local"
  COGNEVA_ALERTMANAGER_EMAIL_USE_TLS: "true"
  COGNEVA_ALERTMANAGER_EMAIL_SUBJECT_TEMPLATE: ""
  COGNEVA_ALERTMANAGER_SLACK_WEBHOOK_URL: ""
  COGNEVA_ALERTMANAGER_SLACK_CHANNEL: ""

  # raw_logger 段不在这里覆盖：与下面的 memory 段同理，同一件事在文件里写一份、
  # 在 env 里再写一份，读文件的人推不出 runtime 用的是哪份——文件里曾写着
  # enabled=false 与一个打不开的目录，实跑却是 true 与 raw-logs。要改改文件。

  # memory 段不在这里覆盖：cog-memory 自读 cogneva.json 的 memory 段，
  # 这里再写一份就会与文件打架（曾经写死 enabled=false 把文件里的 true 顶掉，
  # 记忆不发布，反射插件的严格门随即拒绝启动）。要改记忆配置改文件。
