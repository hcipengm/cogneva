                "summary": "Every round the memory bus claim loop ran in the last 5m failed to claim ({value} being the most any single deployment reported). Each round records exactly one cell on memory_operations_total among bus_claim (a round that took work off the bus), bus_claim_held (a round the idle gate folded) and bus_claim_failed (a round whose claim errored), and the loop's only other reading is its own beat -- so a claim path that errored every round and a bus with nothing to hand out used to be the same picture, with the failure living only in a warn that dies with the pod. The shape is all-failed rather than some-failed: one round that did claim work anywhere in the window clears the rule, so an error that healed does not alert; and a dry bus (every round held, no failure) never arms the left side. Window 5m is ten rounds of the loop's own 30s cadence."
            },
            {
              "name": "memory_backend_operation_never_succeeds",
              "promql": "(max by (operation) (increase(memory_operation_errors_total[6h])) > 0) unless (max by (operation) (increase(memory_operations_total[6h]) - increase(memory_operation_errors_total[6h])) > 0)",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "One memory backend operation failed on every call it got in the last 6h: {value} failures under {operation} and not one success in the same window. Nothing else on the observation face says this. A backend that has stopped serving reaches the caller as a failed task, and the counter that would name memory as the cause is written only when a call returns an error -- so read on its own it says how much work failed and nothing about whether any of it worked, which is why both halves of the family are read together. The shape is all-failed rather than a failure rate: the two counters are incremented from the same call, so subtracting one from the other states \"this operation is not being served\" without a bound on how much error rate is a fault, and no such bound is declared anywhere. The subtraction is taken inside the process that recorded the pair and the rule groups both sides by the operation label, so the reading is per operation rather than per family: the archive and decay loops write the same pair on their own schedule, and a threshold over the family as a whole would track whatever volume those loops happen to produce instead of whether demand is served. Six hours is wide on purpose -- long enough that an operation called rarely has had a fair chance to succeed, and the condition does not clear itself while the backend is broken. It is also the window the other all-failed rules on this face use. A mix of failures and successes under one operation is not this rule's business: it is the ordinary case where some calls fail, and reporting it would need the very rate bound nobody has declared. Both counts are taken once for the fleet rather than summed over the processes that expose them: this counter is held in the shared store, so every pod of every deployment serves the same total"
            }
          ]
        },
