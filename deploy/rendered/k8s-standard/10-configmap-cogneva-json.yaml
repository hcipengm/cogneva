            "provider": "gateway",
            "_comment": "主应用与沙盒一致零凭证零上游知识：api_key 是写死的非敏感占位串（后端构建要求非空），流量经安全网关 8081 透传，真 key 只在网关 Pod。api_style 钉 openai 匹配透传面；model 同样是占位，网关透传时改写为向导配置的真实模型。多 LLM 故障转移（429/402 切上游）由安全网关的上游池承担，主应用这里只保留网关一个后端。LLM 平等：业务侧配置不出现任何厂商名。",
            "api_key": "via-security-gateway",
            "base_url": "http://cogneva-security-gateway:8081/v1",
            "model": "via-security-gateway",
            "api_style": "openai",
            "weight": 1,
