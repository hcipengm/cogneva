mpanion is rendered by the scrape and a change count answers how long the reading pod has been serving the pair rather than how long ago the scan wrote. Inside the reduction and not beside it, because the value clause collapses the writers, and a guard taken after that collapse is satisfied by a live writer while the value it keeps comes from a stopped one. The re-drive clause is matched on the same labels that reduction leaves, because the two halves live on different metrics and the counter carries one dimension the gauge does not: matching them without dropping it would leave the pair unable to meet, and this rule silent for a reason nothing on either face shows. A zero from the counter is a real zero only because the cells are seeded at zero on startup -- an absent counter would leave the re-drive clause with nothing to compare against, and the rule would go quiet exactly when the pass stopped writing. Read the scan's own outcome reading for whether the pass is answering at all, and nothing else answers whether extraction itself is failing: that path has no outcome reading of its own, which is why the scan's own result is the only thing here that says so."
