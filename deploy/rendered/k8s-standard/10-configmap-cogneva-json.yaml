w younger than two minutes, while the unlabelled series the store still serves has a newest row 61 hours old. Dropping the filter matters most when a series froze above the threshold: it fires this rule forever, with no writer left to move the reading and nothing the log does able to clear it. The stranded series here froze the other way -- 200064 against a threshold of 210000 -- so today the exposure is a declared knob rather than a firing: the budget is what sets that threshold, and lowering it to 190537 or below would put a dead writer's value on the firing side of a rule no repair can resolve. It also refuses to read a window it has not seen: a second count over an hour has to exceed the count over that same half hour, so a process younger than the window cannot satisfy a half-hour claim with its first scrape. The 1.05 is measured against that same hour rather than chosen: it sits 10000 rows above the budget, and the widest gap a clean hour ever put between the log and its budget was 62 rows, so this bound is 160 times the largest healthy gap this log has shown. Read metrics_samples_over_capacity beside this one before repairing -- a 1 there is the floor, and this rule firing while that one stays 0 is the shape where the log is still being measured and is not being held down, so the reading to go to is the loop's owner on each pod rather than the budget. A window minimum that goes empty rather than high is the other shape, the measure loop itself having stopped, and it is the loop-liveness rule that reads that one. It cannot fire when no budget is declared: the divisor is absent then, which is a deployment that never asked for a cap rather than a fault."
