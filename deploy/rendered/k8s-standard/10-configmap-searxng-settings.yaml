# 网页检索后端：集群内自建的 SearXNG。
#
# 为什么自建而不是买：`web_search` 是 agent 每个回合都可能调用的东西，按请求计费的
# 服务端检索工具会把「想一想、查一下」变成账单上的行；SearXNG 在同一处聚合多家引擎，
# 无账号、无计费、查询不出本部署。它只被集群内的工具调用，不对外暴露：没有 Ingress，
# Service 只在命名空间内可达，NetworkPolicy 只放行进化 Pod 与主应用。
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "cogneva"
    server:
      # 限流与图片代理都不开：本实例只服务集群内一个零凭证的工具调用方，没有对外
      # 的匿名入口要限；图片代理会把外部图片拉过本 Pod，这里没有 UI 需要它。
      limiter: false
      image_proxy: false
      # SearXNG 拒绝在没有这个值时启动。它签的是限流与图片代理两件事的令牌，而这两件
      # 都已关闭，所以它不是凭证：没有任何外部方认它，换掉它只影响本 Pod 自己的内存。
      secret_key: "cogneva-cluster-internal-searxng"
      # JSON 默认不开。`web_search` 读的就是这一面——少了这行，工具每次拿回 403，
      # 错误里会点名这一项。
    search:
      safe_search: 0
      formats:
        - html
        - json
