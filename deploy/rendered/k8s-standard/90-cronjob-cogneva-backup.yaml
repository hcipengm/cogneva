apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 备份失败不重试成串：下一个周期自然再来，连续失败由 history 留证。
      backoffLimit: 1
      # 卡死的运行必须有人来杀。concurrencyPolicy 是 Forbid，一次挂住的运行会
      # 让它之后每一次都不再开始——备份停掉，连「谁来给挂住那笔收尾」也一起停。
      # 这个界杀的是容器，同一个值经 env 进运行自己写的账本行，判超期用的是那一
      # 行上的数（见 backup.rs 的 run_deadline_seconds）。
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              args: ["backup"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 快照 API 只在 Qdrant REST 端口（6333），gRPC（6334）没有。
                - name: COGNEVA_QDRANT_HTTP_URL
                  value: "http://qdrant.cogneva.svc.cluster.local:6333"
                - name: COGNEVA_BACKUP_KEEP
                  value: "7"
                # 与 jobTemplate 的 activeDeadlineSeconds 是同一个值的两个载体：
                # 一个让 kubelet 到点杀容器，一个让运行把「这次我被给了多久」写
                # 进账本那一行。分开写两个数会漂，超期判断就跟着漂。
                - name: COGNEVA_BACKUP_RUN_DEADLINE_SECONDS
                  value: "3600"
                - name: COGNEVA_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # 卷外那一份的落点。写者只负责复制，判「有没有、是不是今晚的」
                # 由演练那一跑自己遍历目录——写者说自己复制了不算读数。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                # 对象 raw 层来源（只读：备份绝不写数据卷）。
                - name: data
                  mountPath: /var/lib/cogneva-data
                  readOnly: true
                # 身份导出：Secret 以只读卷进 Pod，打成 apply-able manifest，
                # 不为备份单独扩 RBAC。
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                # 带外那一份同挂：平台 token、git 身份私钥都只在这里，不导就等于
                # 换机后要回平台后台重新签发一遍。两片分开导出、分开恢复——它们
                # 是两个对象，权限面也是按对象划的。
                - name: secrets-oob
                  mountPath: /secrets-oob
                  readOnly: true
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
