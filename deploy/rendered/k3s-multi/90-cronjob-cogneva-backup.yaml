apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 备份失败不重试成串：下一个周期自然再来，连续失败由 history 留证。
      backoffLimit: 1
      # 这里曾经是 `activeDeadlineSeconds`：一个到点直接杀掉容器的钟，它不知道这个
      # 容器是不是还在往外写、还在导出。判停改由容器自己的存活探针做（读进度文件）：
      # 一步都不推进超过窗口才判死。`concurrencyPolicy: Forbid` 让一次挂住的运行
      # 挡住之后每一次，所以这一条必须存在——但它判的是「还在不在动」。
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup
            cogneva.io/logs: self
        spec:
          restartPolicy: Never
          # 备份以专用非 root uid 运行：它以 root 跑的时候「包只有属主可读」不成立，
          # 谁能起一个挂得上卷的 Pod 谁就能读走全部包里的明文 Secret 清单。
          # 不用 fsGroup：local-path 的 PVC 与 /offsite 那条 hostPath 都不过 fsGroup。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          # 进化卷是 RWO：同一块卷能被读的前提是备份 Pod 与进化 Pod 落在同一
          # 个节点。让调度器按「进化 Pod 所在节点」钉住这一跑；卷自己有节点
          # 亲和时两者一致，没有时这条就是唯一的约束。钉不上就等，等到 Job
          # 超时失败——失败可见，不会静默漏掉一个数据根。
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: cogneva-evolution
                      app.kubernetes.io/component: evolution
                  topologyKey: kubernetes.io/hostname
          # 凭证面的根目录由 kubelet 在卷第一次挂上时创建，模式跟宿主的 umask 走
          # （DirectoryOrCreate 常见是 0755）。演练会把「不是 0700 的目录」量成一条
          # 违例并让整条规则亮红，所以这里每次开工前把它收紧。只修一次不够：目录
          # 被删掉重建后又会回到默认模式，修在每一次运行里才跟得上。
          initContainers:
            - name: tighten-credential-surface
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              # 这个 init 是 Pod 里唯一以 root 跑的一步：把两处目录交给主容器的
              # uid 再收紧模式。chown 是递归的——卷上已有的包是早先 root 写下的，
              # 只改目录属主的话非 root 的备份与演练读不到它们。
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              command:
                - sh
                - -c
                - >-
                  chown -R 1001:1001 /backups /offsite &&
                  chmod 0700 /backups /offsite
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
          containers:
            - name: backup
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              args: ["backup"]
              # 判停读的是这个文件：进程每推进一段就写一次，窗口写在文件内容里，
              # 探针拿「现在 - mtime」与它比。命令与窗口的出处是
              # `cog_core::progress::PROGRESS_PROBE_COMMAND`——探针里不写任何界，
              # 写死的那个数会在下次窗口变了之后照样自称是窗口。
              livenessProbe:
                exec:
                  command:
                    - sh
                    - -c
                    - >-
                      f="$COGNEVA_PROGRESS_FILE"; if [ -z "$f" ] || [ ! -f "$f" ]; then
                      echo "no progress file (COGNEVA_PROGRESS_FILE='$f')"; exit 1; fi;
                      age=$(( $(date +%s) - $(date -r "$f" +%s) )); win=$(cat "$f");
                      echo "quiet ${age}s, window ${win}s"; [ "$age" -le "$win" ]
                
                periodSeconds: 30
                
                failureThreshold: 3
                
                initialDelaySeconds: 120
              env:
                - name: TZ
                  value: "Asia/Shanghai"
                - name: COGNEVA_LOKI_ENABLED
                  value: "true"
                - name: COGNEVA_LOKI_ENDPOINT
                  value: "http://loki.monitoring.svc.cluster.local:3100"
                - name: COGNEVA_PROGRESS_FILE
                  value: /var/run/cogneva-progress/beat
                # 导出用 cog_app：它是这些表的属主，pg_dump 读得到全部内容。
                - name: APP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: app-password
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_app:$(APP_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 快照 API 只在 Qdrant REST 端口（6333），gRPC（6334）没有。
                - name: COGNEVA_QDRANT_HTTP_URL
                  value: "http://qdrant.cogneva.svc.cluster.local:6333"
                - name: COGNEVA_BACKUP_KEEP
                  value: "7"
                # 这个数**不杀任何东西**：容器的死活由上面的存活探针按进度文件判。
                # 它只被写进账本那一行，让「这一行开着、但没人收尾」有一个可判的
                # 时刻——一行开着的记录如果有人被杀，只有它自己被开出来时的那个数
                # 判得了，用今天的旋钮去判昨天那一次是两回事。
                - name: COGNEVA_BACKUP_RUN_DEADLINE_SECONDS
                  value: "3600"
                # 实例身份：包里记的「这份字节出自哪个实例」就靠它。只取这一个键，
                # 不挂整片——这一片里其余键都是凭证，而这个 Pod 不需要它们。少了
                # 它，manifest 那一格会写成 unknown，换机后两份包分不出谁是谁。
                - name: COGNEVA_INSTANCE_FINGERPRINT
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: instance-fingerprint
                      optional: true
                - name: COGNEVA_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # 出包进程跑的是哪份镜像。容器读不到自己的镜像引用（downward API
                # 没有这个字段），只能由渲染时注入；不注入的话 manifest 里这一格
                # 是空的，换机排障时就没有「这份字节是谁产出的」可对照。
                - name: COGNEVA_IMAGE_REF
                  value: "localhost:30500/cogneva:local"
                # 第二个数据根：进化 Pod 的 data_dir。名字是清单里的身份，
                # 恢复端按「根名 + 库名」定位，不按路径合并两套同名策略库。
                - name: COGNEVA_BACKUP_EXTRA_DATA_ROOTS
                  value: "evolution=/var/lib/cogneva-evolution-data"
                # 进化 bare 仓不在数据根里，是独立的一卷：已推的 rev 能从公开
                # 远端重取，未推的不能，所以整仓打成 git bundle 进包。卷上还
                # 没 seed 时这一格空着，manifest 的 lossy_surfaces 会点名。
                - name: COGNEVA_BACKUP_GIT_REMOTE_DIR
                  value: "/git-remote"
                # 卷外那一份的落点。写者只负责复制，判「有没有、是不是今晚的」
                # 由演练那一跑自己遍历目录——写者说自己复制了不算读数。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                # 对象 raw 层来源（只读：备份绝不写数据卷）。
                - name: data
                  mountPath: /var/lib/cogneva-data
                  readOnly: true
                # 进化 Pod 的 data_dir：备份只读共挂。只取 policies/ 与
                # meta_learning/decision_stats.json，工作树、数仓、日志不在这里
                # 读——它们体积以百 GiB 计且不属于换机后必须逐字节相同的面。
                - name: evolution-data
                  mountPath: /var/lib/cogneva-evolution-data
                  readOnly: true
                # 只读：备份只从 bare 仓读对象，绝不写它。
                - name: git-remote
                  mountPath: /git-remote
                  readOnly: true
                # 身份导出：Secret 以只读卷进 Pod，打成 apply-able manifest，
                # 不为备份单独扩 RBAC。
                #
                # **只在包是密文时才挂**：包里那份清单只是 base64，卷上与卷外各躺
                # 一份就是两处新的凭证载体，能读文件的人拿走全部 token。没有包级
                # 口令时导出端本来就不导这两片（它会点名成有损面），那么这里的挂载
                # 就只剩一个作用：让备份 Pod 读得到它根本不会用到的凭证。凭证只在
                # 安全网关里，是从「挂不挂」这一层就开始算的。
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
                - name: progress
                  mountPath: /var/run/cogneva-progress
          volumes:
            - name: progress
              emptyDir: {}
            - name: data
              persistentVolumeClaim:
                claimName: cogneva-data-pvc
            - name: evolution-data
              persistentVolumeClaim:
                claimName: cogneva-evolution-data-pvc
            # 与进化 Pod 的 volume 声明同形：pvc 模式走 claim，hostPath 模式走
            # 宿主目录（备份 Pod 已被下面的亲和钉在进化 Pod 所在节点上）。
            - name: git-remote
              persistentVolumeClaim:
                claimName: cogneva-git-remote-pvc
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            # 宿主机上的一条路径，与备份卷不在同一个卷对象里：删 PVC、卷被回收
            # 都不动它。（同一个故障域，见 values.yaml 里的说明。）
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
