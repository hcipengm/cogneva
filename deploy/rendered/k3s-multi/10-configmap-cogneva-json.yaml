      "metrics": {
        "enabled": true,
        "endpoint": "/metrics",
        "_comment_sample_max_rows": "cog_metrics_samples 是只追加的观测样本日志，这条是它的容量上限（行数），0=不清理。清理的判据是容量不是时间：时间窗两个问题都答不了——流量可以在任何窗内塞进任意多行，而清理仍然会删掉正在读的行、留着没人要的行。清理按最早的先删，直到回到上限为止，但每个 gauge series 的最新一行永不删——gauge 的值就是这张表里它最新那条，删掉等于这个 series 从 /metrics 上消失，读起来是「从来没存在过」而不是「被裁掉了」；计数器与直方图不受这条地板保护，它们的值存在各自的累计表里，日志里的行只是喂给它的历史，整段可删——否则按对象取键的计数器（序列只增不复用）会让地板无限长大，容量旋钮永远咬不住，每轮都自报超容量却一行都删不掉。若光是这些最新行就超过上限，清理停在最新行上并通过 metrics_samples_over_capacity=1 说出来。默认值按开发集群实测的观测速率（约每天 2.2 万行）取约十天，比稳态高一个数量级，正常运转够不着，而失控的探测循环会在几小时内撞上而不是先把卷写满。属主是主应用：两个 Pod 共用同一个库，进化 Pod 的部署环境里置 COGNEVA_METRICS_SAMPLE_MAX_ROWS=0，本进程就不参与清理。已退场的名字（没有任何产者再写它）不看容量，也不靠这条清理放行，而是由独立的释放 pass 挂在这个循环上每轮清一遍四处存储（样本日志加三张累计表），删掉多少行按表分组报在 metrics_retired_rows_removed 上。",
        "sample_max_rows": 200000,
        "_comment_scrape_dimensions": "抓取的可选收窄项，空数组=不收窄。不收窄的含义是：向每个 observable 询取它自己声明的、序列基数有界的全部维度。有界性由产者声明，不由这份清单判定——同一维度名在不同 observable 上可以不同（D1 在 orchestrator 是进程级累计计数器，有界；在 agent 是逐 step 按 task_id 取键的记录，无界），所以写死一份全局清单必然对其中一家是错的：旧清单把 D1 整条排除，orchestrator 那份有界的 D1 就永远读不到；而清单里列了 D4/D5/D6/D8/D9 时，agent 的 collect_metrics 会在五次询问里各回一份它那组不随维度变的累计计数器，同一批样本在同一个抓取体里出现五遍。要收窄时在这里写具体的维度名，它只会比产者声明的更少，不会多——写了没人声明的名字或声明为无界的名字，结果是采不到而不是报错。",
        "scrape_dimensions": []
      },
      "raw_logger": {
        "_comment": "这里写的已是部署的生效值，不再由 cogneva-config 的同名 env 覆盖：同一个设置在两个地方各写一份，读配置文件的人就推不出 runtime 用的是哪份，而 base_dir 还兼着 trace 存储的根（<base_dir>/traces），改错了不报错，只把 trace 写到另一个目录去。env 映射仍留在本文件的 env 段，要按环境改动时走那里。",
        "_comment_format": "proto：记录按长度分隔的 protobuf 落地（<stream>/<YYYY-MM-DD>.proto.bin），比 jsonl 省去字段名开销，也是分层迁移压缩的输入。读取侧同时认 jsonl 与 proto，所以存量 .jsonl 文件不用搬。",
        "_comment_flush_interval_secs": "落盘由两个条件触发：缓冲满 max_buffer_size 条，或距上次落盘满 flush_interval_secs 秒。低流量 stream 可以长时间够不到条数阈值，那期间写下的记录全在进程内存里，进程一挂即失——所以时间上界不能省。置 0 只留条数阈值。",
        "enabled": true,
        "base_dir": "/var/lib/cogneva-data/raw-logs",
        "max_buffer_size": 1000,
        "format": "proto",
        "zstd_level": null,
        "flush_interval_secs": 1
      },
      "memory": {
        "_comment": "Memory backend — composite puts Raw on the shared ObjectBackend, Schema and the Summary entry store on PostgreSQL, and the summary vectors on the shared VectorBackend, so the dataset survives a restart. This applies to the processes that enable it: the evolution worker overrides COGNEVA_MEMORY_ENABLED to false, so it holds no memory dataset at all and any state it must keep across a restart lives in its own app.data_dir instead.",
        "_comment_models": "load_*_model gates the ONNX weights loaded at startup. Both are false on the shipped profile: the single node has ~1.8GiB free against ~2.2GiB of resident weights per session (dense and sparse each open their own session over the same BGE-M3 weights, plus the reranker), so loading either one evicts the rest of the workload. Weights are deliberately kept out of the image and out of the release archive (4.6GiB total, and gzip cannot shrink fp32 weights); they are to arrive as one authoritative copy in the object store, seeded into each node's local cache. Until a host has the RAM, the vector layer stays absent and search falls back to the schema/text path.",
        "enabled": true,
        "backend_type": "composite",
        "embedding_dimension": 1024,
        "auto_ingest": true,
        "load_embedding_model": false,
        "load_reranker_model": false,
        "ingest": {
          "_comment": "Auto-ingest pipeline knobs. Retries and the dead-letter queue apply to content-level failures (a message that cannot be extracted, however often it is retried); an unreachable upstream defers the message back to the event plane instead, so a capacity outage never decides which events enter memory.",
          "_comment_pull_gate": "The pull gate has two inputs sharing one verdict: the security gateway's published pool snapshot (cross-process, known before an attempt is spent) and this process's own consecutive environment failures (a local fact that still holds when Redis has no key or the gateway restarted). Either one pauses pulling and the wait is the larger of the two. Pausing means not pulling, so messages keep their place in the event plane without spending a delivery attempt.",
          "_comment_reconcile": "Startup reconcile only covers the window between a crash and the restart, so it also re-runs on an interval: an outage longer than the lookback would otherwise push early-archived, never-extracted raws out of the window for good. 0 keeps it startup-only.",
          "_comment_bus": "Bus-mode consumer knobs (active when multi_backend_consumer.events_on_bus=true). bus_claim_min_idle_ms must exceed the worst-case single-event processing time so a live worker's job is never claimed away; JetStream redelivery is governed by ack_wait, the claim sweeper covers Redis-class backends.",
          "max_retries": 3,
          "retry_base_delay_ms": 1000,
          "enable_dlq": true,
          "dlq_namespace": "dlq",
          "extraction_concurrency": 4,
          "startup_reconcile": true,
          "reconcile_lookback_hours": 24,
          "reconcile_interval_secs": 600,
          "pull_pause_after_failures": 3,
          "pull_pause_initial_secs": 60,
          "pull_pause_max_secs": 1800,
          "pool_check_secs": 30,
          "backlog_warn_at": 64,
          "bus_group": "memory-ingestor",
          "bus_claim_interval_secs": 30,
          "bus_claim_min_idle_ms": 900000,
          "bus_claim_batch": 32
        }
      },
      "tier_migrator": {
        "_comment": "hot→warm 就地 zstd 压缩并删除源文件，warm→cold 上传对象存储再删本地，两步都不可逆——热层保留 hot_duration_secs，warm 保留 warm_duration_secs。",
        "_comment_owner": "迁移必须只有一个属主：raw_log_index 按 (stream, log_date, format) 唯一，冷层对象键又不带进程身份，两个部署同时扫就会互相覆盖索引行与对象（谁后写谁赢，先写的那份不可找回且不报错）。属主是主应用 Pod；进化 Pod 在 app-config 里置 COGNEVA_TIER_MIGRATOR_ENABLED=false。",
        "enabled": true,
        "hot_duration_secs": 86400,
        "warm_duration_secs": 604800,
        "warm_compression_level": 3,
        "cold_compression_level": 9,
        "scan_interval_secs": 3600,
        "cold_key_prefix": "raw",
        "trace_scan_batch": 5000
      },
      "supervisor": {
        "health_interval_secs": 10,
        "quota_interval_secs": 60,
        "rebalance_interval_secs": 300,
        "event_window_secs": 30,
        "broadcast_capacity": 256,
        "quota_threshold": 1000,
        "behavior_history_max": 20,
        "heartbeat_history_max": 1000,
        "alert_history_max": 10000,
        "control_plane_interval_secs": 30,
        "control_plane_url": null,
        "health_checker": {
          "suspect_after_secs": 15,
          "dead_after_secs": 60,
          "stuck_after_secs": 600
        },
        "task_rebalancer": {
          "max_tasks_per_agent": 4,
          "max_assignments_per_pass": 32
        }
      },
      "hook_engine": {
        "dedup_window_secs": 1,
        "hook_timeout_secs": 30,
        "default_rate_limit": {
          "burst": 100,
          "per_second": 100
        }
      },
      "boundary": {
        "rules": [
          {
            "name": "TokenBudget",
            "rule_type": "hard",
            "threshold": 100000,
            "description": "单个任务的 estimated_tokens 不得超过阈值",
            "enabled": true
          },
          {
            "name": "OutputQuality",
            "rule_type": "soft",
            "threshold": null,
            "description": "生成输出必须满足以下质量标准：1) 代码必须包含单元测试 2) 文档必须完整 3) 无已知安全漏洞",
            "enabled": true
          }
        ]
      },
      "agent_loop": {
        "agent_id": "agent-001",
        "role": "planner",
        "max_iterations": 10,
        "eval_max_iterations": 5,
        "context_window_size": 64000,
        "skill_cache_ttl_secs": 30
      },
      "observability": {
        "infra_watch": {
          "_comment": "基础设施告警→持久化→自发现。规则即部署策略：阈值改这里不用重建镜像。series 消失或条件不再成立会自动 resolve；规则查询失败不会误 resolve。",
          "enabled": true,
          "prometheus_url": "http://cog-observability-prometheus.monitoring:9090",
          "poll_interval_secs": 60,
          "eval_failure_alert_after": 3,
          "rules": [
            {
              "name": "node_disk_usage_high",
              "promql": "100 - 100 * node_filesystem_avail_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"}",
              "condition": {
                "greater_than": 75.0
              },
              "severity": "warning",
              "summary": "node root filesystem usage above 75% (current {value}%)"
            },
            {
              "name": "node_disk_usage_critical",
              "promql": "100 - 100 * node_filesystem_avail_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype=~\"ext4|xfs|overlay\"}",
              "condition": {
                "greater_than": 85.0
              },
              "severity": "critical",
              "summary": "node root filesystem usage above 85% (current {value}%); kubelet eviction starts soon"
            },
            {
              "name": "node_disk_pressure",
              "promql": "kube_node_status_condition{condition=\"DiskPressure\", status=\"true\"}",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "critical",
              "summary": "kubelet reports DiskPressure; pods are being evicted"
            },
            {
              "name": "node_memory_pressure",
              "promql": "kube_node_status_condition{condition=\"MemoryPressure\", status=\"true\"}",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "kubelet reports MemoryPressure"
            },
            {
              "name": "pod_restarting_fast",
              "promql": "increase(kube_pod_container_status_restarts_total{namespace=\"cogneva\"}[15m])",
              "condition": {
                "greater_than": 5.0
              },
              "severity": "warning",
              "summary": "cogneva pod restarting more than 5 times in 15m ({value})"
            },
            {
              "name": "pod_oom_killed",
              "promql": "kube_pod_container_status_last_terminated_reason{namespace=\"cogneva\", reason=\"OOMKilled\"}",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "critical",
              "summary": "cogneva workload container last exit was OOMKilled; memory footprint exceeds its limit"
            },
            {
              "name": "redis_restarted",
              "promql": "increase(kube_pod_container_status_restarts_total{namespace=\"cogneva\", container=\"redis\"}[1h])",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "the message queue restarted ({value} times in 1h). A restart is either a planned spec change or an unclean stop of its host; after an unclean stop Redis had a torn AOF tail that the aof-repair init container drops at startup, and the number of bytes given up is in that container's log. pod_restarting_fast only counts fast loops, so a single restart shows up nowhere else"
            },
            {
              "name": "sandbox_command_oom_killed",
              "promql": "increase(sandbox_oom_kills_total[30m])",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The sandbox container's memory limit killed {value} command(s) in the last 30m. A child process dying here leaves the container itself running, so nothing reaches the container-level OOMKilled signal, and the build that died reads downstream as an ordinary failure with empty output; a command that keeps dying at the limit needs a bigger limit, not a different change"
            },
            {
              "name": "ralph_loop_terminations_high",
              "promql": "increase(ralph_terminations_total[30m])",
              "condition": {
                "greater_than": 20.0
              },
              "severity": "warning",
              "summary": "Ralph loops stopped {value} times in the last 30m without passing their goal; the evolution chain is burning budget instead of converging (the reason label distinguishes budget_exhausted from stagnated)"
            },
            {
              "name": "declared_failure_class_unrecorded",
              "promql": "collab_classification_unreachable",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "A declared failure class is being announced while its series stays at zero, so the classification is being lost between the producer and the termination record; the class label names which one"
            },
            {
              "name": "self_evolution_yields_no_change",
              "promql": "increase(self_evolution_change_yield_total{outcome=~\"no_artifacts|submit_failed\"}[6h])",
              "condition": {
                "greater_than": 2.0
              },
              "severity": "warning",
              "summary": "Self-evolution chains reported success {value} time(s) in the last 6h while producing no change to land (no_artifacts: the pipeline yielded no valid diff; submit_failed: every sink rejected it); the landing channel stays empty and the loop silently stops evolving"
            },
            {
              "name": "cogneva_workload_metrics_unscraped",
              "promql": "avg_over_time((count(kube_pod_container_info{namespace=\"cogneva\", image=~\".*cogneva.*\"} and on(pod) kube_pod_status_phase{namespace=\"cogneva\", phase=\"Running\"} == 1 unless on(pod) kube_pod_owner{namespace=\"cogneva\", owner_kind=\"Job\"}) - count(up{namespace=\"cogneva\"}))[15m:1m])",
              "condition": {
                "greater_than": 0.5
              },
              "severity": "warning",
              "summary": "On average {value} running cogneva workload(s) had no Prometheus scrape target over the last 15m: their /metrics is produced but never collected, so every alert they would raise is invisible (usual causes: the workload has no Service, its Service port is not named http or metrics, or a NetworkPolicy blocks the monitoring namespace)"
            },
            {
              "name": "data_volume_over_declared_size",
              "promql": "max by (namespace, persistentvolumeclaim) (cogneva_data_volume_used_bytes) / on(namespace, persistentvolumeclaim) kube_persistentvolumeclaim_resource_requests_storage_bytes",
              "condition": {
                "greater_than": 1.0
              },
              "severity": "warning",
              "summary": "Volume holds {value}x its declared size: the workload writes past the PVC's requests.storage, and nothing enforces that request, so the declared size is not a ceiling. For a directory-backed volume the excess lands on the node filesystem and the per-volume capacity the kubelet reports is the node's, not this volume's. Either the declaration is wrong for what this deployment writes, or the growth belongs somewhere else"
            },
            {
              "name": "orphans_unreaped",
              "promql": "(cogneva_process_zombies > 0) and (cogneva_process_zombies == (cogneva_process_zombies offset 30m))",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "PID 1 has held {value} uncollected child process(es) for 30m: the container entrypoint is the only process the kernel reparents orphans to, so a process that outlives its parent stays a zombie for the life of the container unless the entrypoint collects it. Sweeps leave a fresh orphan in place for one interval, so a reading that persists this long means collection stopped, not that a sweep is between ticks"
            },
            {
              "name": "trace_tier_demotion_stalled",
              "promql": "(cogneva_trace_tier_overdue > 0) and (cogneva_trace_tier_overdue == (cogneva_trace_tier_overdue offset 3h))",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "Traces past their tier's age number {value} on tier {tier}, exactly as they did 3h ago: the demotion chain is not moving them, so the hot tier keeps growing. Any non-zero count that does not come down over three scans is a move that fails every pass, not a backlog being worked through. Nothing deletes traces, so this chain is the only thing standing between a permanent trace store and the node filesystem"
            },
            {
              "name": "trace_tier_migration_stale",
              "promql": "time() - max(cogneva_trace_tier_last_pass_seconds) > 6 * max(cogneva_trace_tier_scan_interval_seconds)",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "No trace tier migration pass has run for {value} seconds past six times the configured scan interval: the background loop has stopped, so tier demotion is not happening at all. The threshold scales with the deployment's own cadence rather than a fixed number"
            },
            {
              "name": "trace_tier_migration_failing",
              "promql": "increase(cogneva_trace_tier_pass_failures_total[1h])",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "Trace tier migration failed to complete {value} time(s) in the last hour: the trace store could not be listed, so a pass has nothing to look at and no tier can be demoted. A pass that runs but cannot move individual entries is reported as an overdue count instead"
            },
            {
              "name": "stream_pending_unreclaimed",
              "promql": "cogneva_stream_pending_unreclaimed_oldest_idle_seconds > 2 * cogneva_stream_pending_claim_idle_seconds",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "A message on {stream} has been pending for {value}s, past twice the idle threshold the reclaim pass takes messages back at. That pass runs every configured interval, so surviving one means the message is stranded: the task it belongs to is stuck and nothing else will move it. The threshold is a multiple of the deployment's own reclaim idle, so changing the reclaim policy changes this with it"
            },
            {
              "name": "stream_pending_measure_stale",
              "promql": "time() - max by (stream, pod) (cogneva_stream_pending_measure_last_seconds) > 6 * max by (stream, pod) (cogneva_stream_pending_measure_interval_seconds)",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "Pending state for {stream} has not been measured for {value}s, more than six of the configured measurement intervals. The reclaim loop that publishes it is not running, so a stranded message on this stream would be invisible again — the state this measurement exists to expose"
            },
            {
              "name": "stream_pending_measure_failing",
              "promql": "increase(cogneva_stream_pending_measure_failures_total[1h])",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "Pending state for {stream} failed to be measured {value} time(s) in the last hour. The reclaim loop is running but cannot read the queue, so its last published figures are not evidence about the present"
            },
            {
              "name": "runtime_asset_not_refreshed",
              "promql": "cogneva_runtime_asset_state{state=\"not_refreshed\"} > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The overlay that built this image never recorded refreshing {asset}, so what is live there is the base image's copy, not this revision's. The overlay is built by the deployer binary that was running at the time, which is one revision behind the one it deploys: a revision that adds an asset to deploy/overlay-assets.json is copied by the next rollout and silently left out by every rollout before it. Reading this per asset rather than as a bare count is the point — which asset is stale is what says whether the revision now arriving is the one carrying the fix"
            },
            {
              "name": "runtime_asset_content_drift",
              "promql": "cogneva_runtime_asset_state{state=\"content_drift\"} > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The live copy of {asset} is not the copy the overlay recorded writing into this image. The overlay digests the checkout tree it copies and the application digests the same path at startup; the two differ, so either the copy did not land, or the destination still carries files the source no longer ships — a copy onto a pre-existing directory merges, and does not delete what it no longer contains"
            },
            {
              "name": "runtime_asset_manifest_absent",
              "promql": "cogneva_runtime_asset_manifest_absent > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "This process's image carries no runtime asset record, so every declared asset is unjudged — and the two per-asset rules are silent for exactly that reason: the record they compare against is the thing that is missing, so their silence is not a clean bill of health. The record is written by the deployer's overlay when it copies a revision's assets into the image, so an image that never went through that overlay cannot tell a refreshed asset from the base image's own copy"
            },
            {
              "name": "stream_consumer_stalled",
              "promql": "cogneva_stream_read_silent_seconds > 12 * max(cogneva_stream_read_block_seconds)",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "critical",
              "summary": "Consumer group {consumer_group} of stream {stream} has had no answer from the message bus for {value}s — more than twelve read periods. A consumer with nothing to deliver is still answered every block, so this one is failing rather than idle: it is retrying with backoff and everything fed by that stream has stopped moving, while the process stays up and its health checks stay green. The count of refused reads is in cogneva_stream_read_failures_total, and the period this was measured against in cogneva_stream_read_block_seconds"
            },
            {
              "name": "runtime_asset_manifest_unusable",
              "promql": "cogneva_runtime_asset_manifest_unusable > 0",
              "condition": {
                "greater_than": 0.0
              },
              "severity": "warning",
              "summary": "The runtime asset record this image carries cannot be read, so every declared asset is unjudged — the per-asset rules are silent because the comparison never happened, not because the assets matched. The path and the parse error are in this process's own log line for the check"
            }
          ]
        },
        "trace_collector": {
          "_comment": "trace 事件按 agent 在内存缓冲直到 AgentEnd 落盘；长任务无界累积会 OOM。超过预算即分块落盘（part 后缀），预算按部署内存定。",
          "buffer_max_bytes": 16777216
        },
        "data_volume_watch": {
          "_comment": "应用数据目录的占用量由写它的进程自己量成 gauge cogneva_data_volume_used_bytes 并带上卷名，规则拿它除以 kube-state-metrics 报的 requests.storage。同一份 cogneva.json 挂给多个 Pod，各自挂的卷不是同一张，所以卷名由各部署用自己的 env 指名（COGNEVA_DATA_VOLUME_CLAIM），不写在这里；claim 为空即整个观测关闭。",
          "interval_secs": 300
        }
      },
      "self_review": {
        "_comment": "PGE actor self-review quality gate. enabled=true 时 Planner/Generator/Evaluator/Moderator/Merger 的输出会经过 SelfReviewLoop 审查并用修订结果替换原始输出。",
        "enabled": true,
        "max_iterations": 2,
        "quality_threshold": 0.8,
        "spec": null,
        "best_practices": []
      },
      "pge": {
        "_comment": "PGE actor 输出契约。schemas 按 actor 名（planner/generator/evaluator/moderator/merger）配置 JSON Schema；配置后 schema 会注入 prompt 上下文并对 LLM 原始输出做校验，校验失败仅告警并回退宽松解析，不会中断流水线。默认为空 = 使用内置契约。",
        "_comment_local_repair_max": "局部修复预算：Evaluator 判失败后保持当前 Plan 不变、把 feedback 回传给 Generator 再生成的次数，耗尽才做全局重置（重跑 Planner）。0 = 关闭这条路径，于是每次失败都从新 Plan 重来。写在这里是因为 schemas 一旦配置就很难注意到这条键缺了，而缺了的读法是 0。",
        "schemas": {},
        "local_repair_max": 2
      },
      "lifecycle": {
        "heartbeat_interval_secs": 5,
        "suspect_threshold": 2,
        "dead_threshold": 5,
        "registration_ttl_secs": 60,
        "cleanup_interval_secs": 300
      },
      "tuning": {
        "stream_capacity": 256,
        "high_watermark": 1000,
        "low_watermark": 100,
        "max_summaries": 10
      },
      "prompts": {
        "_comment": "外部 prompt 模板目录，由 cogneva-prompts configmap 挂载；hot_reload 捕捉 configmap 交换（L0 配置晋级热更新通道）。",
        "dir": "/etc/cogneva/prompts",
        "hot_reload": true
      },
      "agent_pool": {
        "enabled": true,
        "worker_count": 3,
        "worker_role": "planner"
      },
      "self_evolution": {
        "_comment": "Self-evolution auto-deploy pipeline. enabled/auto_apply/auto_deploy all true means fully autonomous: LLM generates code changes, tests, commits, builds, and switches binary without human intervention. Sandbox boundary check: real apply/deploy requires a detected isolated environment (K8s Pod/container/COGNEVA_SANDBOX), sandbox_mode=true, or force_autonomous=true; otherwise the pipeline downgrades to dry-run.",
        "enabled": true,
        "auto_apply": true,
        "auto_deploy": true,
        "sandbox_mode": true,
        "force_autonomous": false,
        "manual_approve": false,
        "change_dir": "./evolution-changes",
        "binary_dir": "/opt/cogneva/bin",
        "backup_dir": "/opt/cogneva/bin/backups",
        "switch_mode": "self_exec",
        "health_check_grace_period_secs": 10,
        "health_check_interval_secs": 5,
        "health_check_max_retries": 6,
        "test_timeout_secs": 3600,
        "build_timeout_secs": 3600,
        "poll_interval_secs": 60,
        "schema_repair_interval_secs": 600,
        "notify_on_success": true,
        "notify_on_failure": true,
        "artifact_evolution": {
          "_comment": "Autonomous search over the meta-learning policy's tuning parameters (min_samples, margin). Each round replays the recorded decision outcomes under every candidate parameter set and adopts one only when a two-proportion z-test says it beats what the recommendation path is currently using; the winner is saved as a new version and hot-swapped. The input is this process's own recorded results, so it runs without LLM or network access. min_trials is the floor — below it the test cannot be significant and the round writes nothing. Ownership: the policy artifact lives under this process's own data dir, so this loop needs no per-deployment owner switch.",
          "enabled": true,
          "interval_secs": 3600,
          "policy_name": "meta_learning.mode",
          "min_trials": 40,
          "min_samples_grid": [2, 3, 5, 8],
          "margin_grid": [0.0, 0.05, 0.1, 0.15, 0.2, 0.3]
        }
      },
      "multi_backend_consumer": {
        "_comment": "events_on_bus=true: AgentEnd is published only to the persistent event plane (dedicated NATS JetStream at nats_urls, decoupled from the task-queue backend); the supervisor re-injects it into the broadcast exactly once and memory-ingestor consumes from the bus with ack-after-processing. Publish-side knobs bound the in-memory buffer that covers NATS outage windows.",
        "enabled": true,
        "channel": "cogneva-events",
        "group": "cogneva-consumer",
        "retry_interval_secs": 5,
        "events_on_bus": true,
        "nats_urls": [
          "nats-service:4222"
        ],
        "publish_buffer_capacity": 256,
        "publish_retry_base_delay_ms": 1000,
        "events_stream_retention": "limits"
      },
      "github_integration": {
        "_comment": "GitHub integration for self-evolution. Tokens are resolved from environment variables and never enter the sandbox. discovery_mode=both: polling is the periodic fallback, webhook events (via the security gateway, gateway_verified) give second-level response.",
        "enabled": true,
        "_comment_discovery_enabled": "Whether THIS process runs the discovery loops. One binary serves several deployments (main app, evolution pod, security gateway, sandbox executor) and each of the first two builds its own plugin table, so without this switch both scan the same upstream items and ask the same clarification twice: intent guards are per-pod files, so neither can see the other already acted. The owner is the main app — webhook events structurally reach only it, and polling is its periodic fallback. Deployment sets this false on the evolution pod.",
        "discovery_enabled": true,
        "discovery_mode": "both",
        "repo": "hcipengm/cogneva",
        "base_branch": "main",
        "accounts": [
          {
            "kind": "bot",
            "username": "cogneva-bot",
