# The audited LLM channel gets a Service of its own, not merged into gateway-service.yaml.
#
# Any pod in the cluster can resolve a ClusterIP, so "small reachable set" is not
# achieved by hiding behind DNS -- it comes from the gateway's own NetworkPolicy,
# which judges this port by **source pod**, and only the sandbox executor gets
# through. Keeping it separate means nothing else picks it up in passing: a shared
# Service's port list travels whole into Ingresses, ServiceMonitors and other
# references, and once this port is carried off that way, its reason to exist (the
# only credentialed, per-request-audited egress) is gone.
apiVersion: v1
kind: Service
metadata:
  name: cogneva-security-gateway-audited
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
  ports:
    - name: audited-llm
      port: 8083
      targetPort: audited-llm
      protocol: TCP
