apiVersion: v1
kind: Service
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # 网关验签 webhook 转发入口（gateway_verified 模式）：安全网关 8082
    # 验平台签名后附内部 HMAC 转发到本端口。
    - name: webhook
      port: 9091
      targetPort: 9091
      protocol: TCP
