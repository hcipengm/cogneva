# 资源配额与默认限额（元启动设计文档第三步：限制 Agent/沙盒资源耗尽节点）。
# ResourceQuota 约束 cogneva 命名空间总量；LimitRange 为未声明资源的容器提供
# 默认值并夹紧单容器上下限。数值按单节点 K3s（≥4C8G 空白机）设定，已计入
# 常设镜像分发器开销（image-server 100m/64Mi + 每节点 importer 200m/1Gi）；
# 多节点每增一个节点多 200m/1Gi，生产 K8s 分支请按集群规模上调。
# 存储额度是命名空间内全部 PVC 声明之和的上限（目录型卷不强制 requests.storage，
# 它唯一的作用是拒绝声明总量越界的清单），必须 ≥ 本套清单自己声明的和（当前
# 390Gi），取 480Gi 留 90Gi 头寸。单卷上限 200Gi 必须 ≥ 最大的那份声明（进化源码
# 卷 192Gi）。渲染期门禁 check-governance-consistency.sh 按渲染产物重算并打印头寸。
#
# 本文件是 **parity 基线兼 GitOps 消费物**，不是数值的权威源：数值定义在
# chart 的 resourceGovernance values，chart 渲染出的 spec 与这里逐字段相等
# （check-deploy-parity.sh 会比），改一处不改另一处当场红。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cogneva-quota
  namespace: cogneva
  # 运行期自建 Pod（评测台、验收演练）的额度预算，与 chart 的
  # resourceGovernance.runtimePods 逐字段相等。渲染期门禁读这两个注解，
  # 核「声明和 + 判据 Job + 预算 ≤ 额度」；缺注解报错，不当作 0。
  annotations:
    cogneva.io/runtime-pods-limits-cpu: "3"
    cogneva.io/runtime-pods-limits-memory: 3.75Gi
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: resource-governance
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "31"
    # 52Gi：稳态 43.7Gi（渲染期门禁自报）+ 判据 Job 512Mi + 运行期自建临时 Pod
    # 3.75Gi（eval 表 3Gi + 验收演练 768Mi）+ 替换重叠 3.4Gi = 51.35Gi。
    # 运行期自建 Pod 不是渲染集里的工作负载，但它们的预算写在上面的注解里，
    # 渲染期门禁把预算加进同一条不等式；留不够就在渲染期红，而不是等到准入被拒、
    # 部署器每轮空转。完整算式见 chart values 的 resourceGovernance 段。
    limits.memory: "52Gi"
    pods: "40"
    requests.storage: 480Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cogneva-limits
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: resource-governance
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: PersistentVolumeClaim
      max:
        storage: 200Gi
      min:
        storage: 1Gi
