apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
rules:
  # Mainline deployer / image rollout: named read+patch on the four cogneva
  # Deployments (kubectl set image = PATCH on a named Deployment).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "cogneva"
      - "cogneva-security-gateway"
      - "cogneva-sandbox-executor"
      - "cogneva-evolution"
    verbs: ["get", "patch", "update"]
  # list/watch are collection-level verbs that RBAC cannot scope by
  # resourceNames; keep them in a separate rule.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  # Pod health checks (name+component dual-label selector, collection list).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Mainline rollout Jobs: build side applies (create), queries status, and
  # deletes a finished job before redispatch when deployments were reverted by
  # an apply; the in-Job rollout reuses the same ServiceAccount.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Allow reading the cogneva ConfigMap if needed for configuration.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
subjects:
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-evolution
  apiGroup: rbac.authorization.k8s.io
