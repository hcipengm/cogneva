apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
rules:
  # Mainline deployer delivers a manifest bundle with the image: the rollout
  # Job applies the release set's support resources and deployment manifests
  # (so topology changes reach the cluster with each version). apply can create
  # new resources, so resourceNames cannot scope it; the grants are
  # collection-level but the Role itself is namespace-bounded. The permission
  # plane (Role/RoleBinding) and Secrets never travel through the deploy path:
  # the bundle builder filters them out and no verbs are granted here, so the
  # autonomous system cannot escalate its own privileges.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # Stale manifest-bundle ConfigMap cleanup (label-selected delete; names carry
  # a rev and cannot be enumerated by resourceNames).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # Pod health checks (name+component dual-label selector, collection list).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Governance drift reading: the deployer compares the ceilings the repository
  # declares against the ones the cluster enforces, and the cluster side of that
  # comparison is `get resourcequota -o json`. Read-only -- the ceiling itself is
  # not delivered by this path (the install face applies it), so nothing here
  # lets the loop write one.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
  # Rollback of a change deploy: `kubectl rollout undo` resolves the previous
  # pod template through the deployment's ReplicaSets before it patches
  # anything, so the apps rule above (which covers deployments) is not enough.
  # Live reading without it: "failed to retrieve replica sets from deployment
  # cogneva: replicasets.apps is forbidden". Read-only, and the same grant the
  # app pod's gitops-puller Role carries for the same command.
  #
  # The deployer's own failure diagnosis reads the same resource (a label
  # selector over the failing ReplicaSets), and that read is not only a report:
  # `admission_rejection` decides from its rows whether a rollout was rejected
  # by the API server. With no grant the sampling answers "empty", so the
  # verdict reads "no admission rejection" for every rollout — a machine
  # criterion answering from a permission error.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # Failure diagnosis: the Warning events of the rollout window. Read-only;
  # without it the diagnosis silently loses its one description of why a pod
  # never became ready.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Mainline rollout Jobs: build side applies (create), queries status, and
  # deletes a finished job before redispatch when deployments were reverted by
  # an apply; the in-Job rollout reuses the same ServiceAccount.
  # cronjobs ride the same rule: the rollout pod kubectl-applies the rendered
  # manifests (which include the backup CronJob) and apply needs to get it.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
subjects:
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-evolution
  apiGroup: rbac.authorization.k8s.io
