apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
rules:
  # Allow the evolution worker to patch the main cogneva Deployment image
  # when an image-based rollout is implemented.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "patch"]
  # Allow reading the cogneva ConfigMap if needed for configuration.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
subjects:
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-evolution
  apiGroup: rbac.authorization.k8s.io
