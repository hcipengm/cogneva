apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cogneva
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
    app.kubernetes.io/version: "7-alpine"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: message-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: message-queue
        app.kubernetes.io/version: "7-alpine"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            # 认证密码：secret cogneva-secrets/redis-password，由运维带外写入。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
