apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
    app.kubernetes.io/version: "0.1.20"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva-evolution
      app.kubernetes.io/component: evolution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva-evolution
        app.kubernetes.io/component: evolution
        app.kubernetes.io/version: "0.1.20"
    spec:
      serviceAccountName: cogneva-evolution
      # The evolution worker runs as root inside a privileged container so it
      # can chmod, apt install, git init, self_exec, and build release binaries.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        # Populate the source PVC from the local bare git repository on first boot only.
        # This gives the Pod an isolated working tree while still allowing bidirectional
        # sync through the bare repo (host <-> bare repo <-> Pod).
        - name: seed-source
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              git config --global --add safe.directory /host-git
              # git-remote 为 PVC（多节点）时首次挂载是空卷，从公开仓库 seed；
              # hostPath（单节点）时 bootstrap 已预 seed，本步自动跳过。
              # __GIT_SEED_URL__ 由 bootstrap 按网络模式替换（CN 走 Gitee）
              if [ ! -f /host-git/HEAD ]; then
                echo "git-remote is empty; seeding bare repo from __GIT_SEED_URL__ ..."
                git clone --bare __GIT_SEED_URL__ /tmp/seed.git
                cp -a /tmp/seed.git/. /host-git/
                rm -rf /tmp/seed.git
              fi
              if [ ! -d /opt/cogneva/sandbox/src/.git ] || [ ! -f /opt/cogneva/sandbox/src/Cargo.toml ]; then
                echo "Source PVC is empty or incomplete; cloning from local bare repo..."
                find /opt/cogneva/sandbox/src -mindepth 1 -delete 2>/dev/null || true
                git clone /host-git /opt/cogneva/sandbox/src
              else
                echo "Source PVC already populated; ensuring local remote points to bare repo..."
              fi
              cd /opt/cogneva/sandbox/src
              git config user.email "evolution@cogneva.local"
              git config user.name "Cogneva Evolution"
              git remote remove local 2>/dev/null || true
              git remote add local /host-git
              git fetch local
          volumeMounts:
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: git-remote
              mountPath: /host-git
      containers:
        - name: cogneva
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          workingDir: /opt/cogneva/sandbox/src
          # Privileged container = filesystem sandbox boundary. All writes go
          # into the mounted PVCs; the node itself is only exposed through the
          # privileged boundary. For a stricter setup use a dedicated build
          # Pod + image push instead of privileged self_exec.
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: cogneva-config
            - configMapRef:
                name: cogneva-evolution-config
          env:
            - name: COGNEVA_CONFIG_PATH
              value: "/etc/cogneva/cogneva.json"
            # 沙盒零凭证（设计 §2.6.1）：LLM 调用经安全网关 8081 OpenAI 兼容
            # 透传端点，真实 key 只存在于安全网关 Pod。此处 KIMI_API_KEY 是
            # 非敏感占位——cogneva.json 的 ${KIMI_API_KEY} 插值与后端构建需要
            # 非空值，网关收到请求后会丢弃入站 Authorization 换成真凭证。
            - name: KIMI_API_KEY
              value: "via-security-gateway"
            # 经 configmap env 映射覆写 llm_routing.backends.0.base_url，
            # 指向安全网关 LLM 通道（仅限集群内网，network-policy 已放行）
            - name: COGNEVA_LLM_ROUTING_BASE_URL
              value: "http://cogneva-security-gateway:8081/v1"
            # 透传端点是 OpenAI 兼容面——主配置 backends[0] 已切 anthropic，
            # 沙盒必须显式钉回 openai，否则会向网关 POST /v1/messages（404）
            - name: COGNEVA_LLM_ROUTING_API_STYLE
              value: "openai"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    git config --global --add safe.directory /host-git
                    git config --global --add safe.directory /opt/cogneva/sandbox/src
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: git-remote
              mountPath: /host-git
              readOnly: false
            - name: cogneva-json
              # 必须挂目录：挂成 /etc/cogneva/cogneva.json 且无 subPath 会把
              # ConfigMap 挂成同名目录，进程读文件失败静默回退默认配置，
              # 报"No LLM backends configured"（2026-08-04 实测定位）
              mountPath: /etc/cogneva
              readOnly: true
            # Mount the Docker socket only if you plan to build container images
            # from inside the evolution Pod. Remove for pure self_exec mode.
            # - name: docker-sock
            #   mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-pvc
        - name: source
          persistentVolumeClaim:
            claimName: cogneva-evolution-source-pvc
        # __GIT_REMOTE_HOSTPATH_BEGIN__
        - name: git-remote
          # 单节点：引导器部署前在宿主 git clone --bare 源码仓库
          #（宿主 <-> bare <-> Pod 双向同步通道）
          hostPath:
            path: /var/lib/cogneva-data/git-remote
            type: Directory
        # __GIT_REMOTE_HOSTPATH_END__
        # __GIT_REMOTE_PVC_BEGIN__
        - name: git-remote
          # 多节点：hostPath 只存在于 bootstrap 所在节点，evolution 调度到
          # 其他节点即 FailedMount/空仓库，必须改集群卷；空卷由 initContainer
          # 从公开仓库 seed
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
        # __GIT_REMOTE_PVC_END__
        - name: cogneva-json
          # 与主部署一致走 ConfigMap；hostPath 指开发机路径在空白机上必挂失败
          configMap:
            name: cogneva-json
        # - name: docker-sock
        #   hostPath:
        #     path: /var/run/docker.sock
        #     type: Socket
# __GIT_REMOTE_PVC_BEGIN__
---
# git-remote 集群卷（多节点变体；单节点 hostPath 变体渲染时本文档被剔除）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-git-remote-pvc
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: evolution
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: cogneva-local-retain
  resources:
    requests:
      storage: 5Gi
# __GIT_REMOTE_PVC_END__
