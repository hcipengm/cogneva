apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-evolution
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
    app.kubernetes.io/version: "0.5.8"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva-evolution
      app.kubernetes.io/component: evolution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva-evolution
        app.kubernetes.io/component: evolution
        app.kubernetes.io/version: "0.5.8"
    spec:
      serviceAccountName: cogneva-evolution
      # The evolution worker runs as root inside a privileged container so it
      # can chmod, apt install, git init, self_exec, and build release binaries.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        # Seed the git-remote volume from the local bare git repository on first boot.
        # Worktrees are cut lazily from the bare repo by the workspace allocator, so
        # this init step only prepares the shared object store and layout.
        - name: seed-source
          image: localhost:30500/cogneva:local
          # 必须 Always：静态清单把部署指回浮动签 :local，内容可被 bootstrap/
          # swap-image 重新播种；IfNotPresent 会无限期复用节点缓存里的旧内容。
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -e
              git config --global --add safe.directory /host-git
              git config --global --add safe.directory /opt/cogneva/sandbox/workspaces
              # 镜像按序尝试，第一个可达的胜出：可达性按主机不对称（实测本集群
              # github 间歇黑洞、gitee 秒级应答），只配一个地址时该主机不可达期间
              # 既 seed 不出空卷、也刷不到新 release tag。
              # http.connectTimeout/lowSpeed 给网络操作兜底，否则离线时 git 会
              # 长时间挂在连接上拖慢 Init 与整 Pod 就绪。
              # 但连接超时与低速阈值管不住"带宽很低但在动"的传输：实测一次
              # fetch 跑了 14 分钟没完，把整段启动预算吃光、Pod 被判启动超时
              # （一次网络慢被记成版本缺陷）。所以每个走公网的 git 调用再加一层
              # 挂钟上界：单次尝试最多 240 秒（实测正常读数秒级到几十秒，取数倍
              # 余量）。超了就当这个镜像不可用、走下面已有的失败分支，语义不变。
              # 代价：真的很大的传输可能一次传不完而被放弃，下一轮从零再来（被杀
              # 掉的 fetch 不落 refs），极端网络下裸仓会停在旧 main——启动可用性
              # 优先于基线新鲜度，与"全部镜像失败不阻塞启动"同向。
              mirrors="https://github.com/hcipengm/cogneva.git,https://gitee.com/hcipengm/cogneva.git"
              # git-remote 为 PVC（多节点）时首次挂载是空卷，从公开仓库 seed；
              # hostPath（单节点）时 bootstrap 已预 seed，本步自动跳过。
              # 全部镜像失败不阻塞启动：离线集群用本地已有状态，下次重启 init 再试。
              if [ ! -f /host-git/HEAD ]; then
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  echo "git-remote is empty; seeding bare repo from $m ..."
                  rc=0
                  /usr/bin/timeout 240 git -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 clone --bare "$m" /tmp/seed.git || rc=$?
                  if [ "$rc" = 0 ]; then
                    cp -a /tmp/seed.git/. /host-git/
                    rm -rf /tmp/seed.git
                    break
                  fi
                  if [ "$rc" = 124 ]; then
                    echo "WARN: git-remote seed from $m gave up after the 240s bound (transfer slower than the bound, or the mirror never answered)"
                  else
                    echo "WARN: git-remote seed from $m failed (rc=$rc)"
                  fi
                  rm -rf /tmp/seed.git
                done
                [ -f /host-git/HEAD ] || echo "WARN: git-remote seed failed on every mirror (no mirror answered within the bound); starting without a seeded baseline"
              fi
              if [ -f /host-git/HEAD ]; then
                # bare 保持一个指向上游的 upstream remote，启动时拉最新 main 与
                # release tag；首选不可达就换下一个，全部失败只告警——离线时用
                # seed 已带的 tag（当前部署版本的 tag 在 seed 时就存在）。
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  git --git-dir=/host-git remote remove upstream 2>/dev/null || true
                  git --git-dir=/host-git remote add upstream "$m"
                  rc=0
                  /usr/bin/timeout 240 git --git-dir=/host-git -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch upstream --tags --force || rc=$?
                  if [ "$rc" = 0 ]; then
                    break
                  fi
                  if [ "$rc" = 124 ]; then
                    echo "WARN: fetch upstream tags from $m gave up after the 240s bound (transfer slower than the bound, or the mirror never answered); trying the next mirror"
                  else
                    echo "WARN: fetch upstream tags from $m failed (rc=$rc); trying the next mirror"
                  fi
                done
              fi
              # 工作树由分配器按需从裸仓库切出（零克隆、共享对象库），这里只清掉
              # 崩溃留下的孤儿登记，并备好工作树根目录（app 容器的 workingDir）。
              git --git-dir=/host-git worktree prune
              mkdir -p /opt/cogneva/sandbox/workspaces
          volumeMounts:
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: git-remote
              mountPath: /host-git
      containers:
        - name: cogneva
          image: localhost:30500/cogneva:local
          # 必须 Always：静态清单把部署指回浮动签 :local，内容可被 bootstrap/
          # swap-image 重新播种；IfNotPresent 会无限期复用节点缓存里的旧内容。
          imagePullPolicy: Always
          workingDir: /opt/cogneva/sandbox/workspaces
          # Privileged container = filesystem sandbox boundary. All writes go
          # into the mounted PVCs; the node itself is only exposed through the
          # privileged boundary. For a stricter setup use a dedicated build
          # Pod + image push instead of privileged self_exec.
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: cogneva-config
            - configMapRef:
                name: cogneva-evolution-config
          env:
            - name: COGNEVA_CONFIG_PATH
              value: "/etc/cogneva/cogneva.json"
            # 本 Pod 的名字：按变更派出的执行 Job 要跑**同一份代码**，而"同一份"
            # 只能从本 Pod 的 `status.containerStatuses[].imageID`（带摘要）读出来；
            # 读自己那份状态得先叫得出自己的名字。读不到名字时不派 Job，不回退成
            # 用浮动 tag 派——子进程可能因此跑在另一份代码上。
            - name: COGNEVA_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 本部署的名字，与主应用同源同形。样本日志的容量声明落在共用表
            # 里、series 键就是标签集：不署名时「本部署不清理」在读数面上与「隔壁
            # 那家的 200000」同形。取部署名而不是 Pod 名——地板是按 series 计的，
            # 随滚动变化的名字会每次滚动多一行永不回收的地板。也不能取 Pod 标签
            # `app.kubernetes.io/name`（那是应用名，七个工作负载共用主应用那一个值，
            # 拿它当部署名时「别家不许顶这一家的声明」那道闸对它们全失效）；这里的
            # 字面量必须等于本文件的 metadata.name
            # （判据 deploy/scripts/check-deployment-name-wiring.sh）。
            - name: COGNEVA_DEPLOYMENT_NAME
              value: cogneva-evolution
            # 告警邮件出口的 SMTP 口令：凭证不进清单也不进 values，只认这个
            # Secret 键，缺省即不做鉴权。主应用 Pod 也跑同一条告警桥，两处同源。
            - name: COGNEVA_ALERTMANAGER_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: smtp-password
                  optional: true
            # 进化链 fail-closed：Shell 工具必须携带真实 DAG task 身份。
            - name: COGNEVA_REQUIRE_TOOL_IDENTITY
              value: "true"
            # 孤儿巡检单一持有者：进化 Pod 关闭，避免与主应用双跑压短告警停留窗口。
            - name: COGNEVA_DECOMPOSITION_ORPHAN_WATCH_ENABLED
              value: "false"
            # 本 Pod 挂在 /var/lib/cogneva-data 上的声明与主应用不是同一张，占用
            # 要分开量：两个进程写同一个路径，但各自的卷互不相干。
            - name: COGNEVA_DATA_VOLUME_CLAIM
              value: "cogneva-evolution-data-pvc"
            # 本 Pod 在数据目录之外还挂了两张卷，占用都远大于上面那张：沙箱工作树
            # 与构建缓存。不列出来它们就没有观测面——唯一能发现"声明 10Gi、实际
            # 101G"的规则看不见它们，只会在节点盘整体告急时才被间接发现。
            # 子挂载由进程读自己的挂载表排除，不在这里重复声明，免得挂载一变就
            # 静默量错。
            - name: COGNEVA_DATA_VOLUME_MOUNTS
              value: |
                cogneva-evolution-pvc=/opt/cogneva/sandbox
                cogneva-evolution-source-pvc=/opt/cogneva/sandbox/src
            # 集群内 registry 的卷不归本 Pod 写，走查也不在它的挂载表里：本 Pod 的
            # 部署器是它唯一的写者（buildah push），从这里能问到的只有 registry
            # API 报的"活 tag 引用的层"，那是另一个量（cogneva_registry_referenced_
            # bytes：孤儿层它看不见），留给保留策略读。那张卷的盘上占用由 registry
            # Pod 里只读走查该卷的边车产出，声明量比的必须是那一份，所以这里不再
            # 往卷族序列上挂——一个序列名只能有一个含义。
            - name: COGNEVA_REGISTRY_CLAIM
              value: "cogneva-registry-pvc"
            # 本 Pod 自己的 JWT 签名密钥，与主应用那份**不同源**：本 Pod 持有
            # 主线部署器（推 registry、滚四部署），并入用户会话的鉴权域等于让
            # 一枚 WebUI token 够到部署器。取不到时进程退化为一次性随机密钥，
            # 而本 Pod 每推进一个 rev 就被重建一次——那等于鉴权域每轮换签。
            - name: COGNEVA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: evolution-jwt-secret
                  optional: true
            # 沙盒零凭证（设计 §2.6.1）：LLM 调用经安全网关 8081 OpenAI 兼容
            # 透传端点，真实 key 只存在于安全网关 Pod；cogneva.json 的
            # llm_routing 只有网关透传一个后端，api_key 为写死的非敏感占位，
            # 网关收到请求后丢弃入站 Authorization 换成真凭证。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            # GitHub/Gitee API 走安全网关透传（凭证网关注入，本 Pod 零 token）。
            # 缺这三个 env 时 GiteeProvider 直连 gitee.com——集群仅网关在
            # egress 白名单内，直连必败，轮询发现循环每轮空转。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            # git 传输（PR 发布 clone/push）走网关 HTTPS 代理。
            # 通知机器人签名借用面：机器人报文要签名时向安全网关借一对
            # (timestamp, sign)，平台密钥不出网关。本 Pod 跑的是同一个二进制、
            # 装的是同一套插件，所以这条与主应用那份必须同源——少一条，这个
            # 进程发出的通知就退回未签名，而平台会以「签名校验失败」拒收。
            - name: COGNEVA_NOTIFICATION_SIGN_BASE
              value: "http://cogneva-security-gateway:8081"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # 实例身份指纹：身份的规范来源，安装期生成、升级复用。身份决定
            # `evol/<id>` 分支名与按实例命名的常驻工作树，必须跨重启与重装稳定。
            - name: COGNEVA_INSTANCE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: instance-fingerprint
                  optional: true
            # wiki 检索后端（Meilisearch）主密钥：cogneva.json 的
            # providers.wiki.options.api_key 经 ${MEILI_MASTER_KEY} 插值。
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: meili-master-key
            # 对象存储凭证：cogneva.json 的 providers.storage.options 经
            # ${S3_ACCESS_KEY} / ${S3_SECRET_KEY} 插值。两个 Pod 共用同一对
            # 密钥，也就共用同一个对象命名空间——这正是记忆共享的前提。
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-secret-key
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    git config --global --add safe.directory /host-git
                    git config --global --add safe.directory /opt/cogneva/sandbox/workspaces
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            # 应用数据落持久卷：identity.json 决定实例名，丢了就会随机器指纹重算，
            # 按实例命名的资源逐次遗留；数仓 / 策略 / 记忆 / 原始日志同在此目录。
            - name: app-data
              mountPath: /var/lib/cogneva-data
            - name: git-remote
              mountPath: /host-git
              readOnly: false
            - name: cogneva-json
              # 必须挂目录：挂成 /etc/cogneva/cogneva.json 且无 subPath 会把
              # ConfigMap 挂成同名目录，进程读文件失败静默回退默认配置，
              # 报"No LLM backends configured"（2026-08-04 实测定位）
              mountPath: /etc/cogneva
              readOnly: true
            # prompt 模板与主应用同源。缺这个挂载时本进程的 prompt 注册表是空的：
            # 目录读不到只 warn、热重载 watcher 直接 ERROR，之后每次渲染都静默
            # 回退到代码里的兜底字符串——热更新与版本化在这个 Pod 上整体失效，
            # 而它恰恰是跑 EvolutionEngine 的那一半。
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            # 主线部署器构建侧在本 Pod 内调 kubectl（查四部署镜像、apply 滚动
            # Job）。k3s 多调用二进制 argv[0]=kubectl 即 kubectl，版本与集群一致。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
            # Mount the Docker socket only if you plan to build container images
            # from inside the evolution Pod. Remove for pure self_exec mode.
            # - name: docker-sock
            #   mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-pvc
        - name: source
          persistentVolumeClaim:
            claimName: cogneva-evolution-source-pvc
        - name: app-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-data-pvc
        # __GIT_REMOTE_HOSTPATH_BEGIN__
        - name: git-remote
          # 单节点（默认，本文件可直接 kubectl apply）：引导器部署前在宿主
          # git clone --bare 源码仓库（宿主 <-> bare <-> Pod 双向同步通道）
          hostPath:
            path: /var/lib/cogneva-data/git-remote
            type: Directory
        # __GIT_REMOTE_HOSTPATH_END__
        # __GIT_REMOTE_PVC_BEGIN__
        ## 多节点变体（bootstrap 渲染时取消注释本块并剔除上面的 hostPath 块）：
        ## hostPath 只存在于 bootstrap 所在节点，evolution 调度到其他节点即
        ## FailedMount/空仓库，必须改集群卷；空卷由 initContainer 从公开仓库 seed
        # - name: git-remote
        #   persistentVolumeClaim:
        #     claimName: cogneva-git-remote-pvc
        # __GIT_REMOTE_PVC_END__
        - name: cogneva-json
          # 与主部署一致走 ConfigMap；hostPath 指开发机路径在空白机上必挂失败
          configMap:
            name: cogneva-json
        - name: prompts
          configMap:
            name: cogneva-prompts
        - name: kubectl-bin
          # 宿主 k3s 二进制挂载为 Pod 内 kubectl（argv[0]=kubectl 的多调用二进制，
          # 版本与集群天然一致）；bootstrap 先装 k3s 再部署，文件必然存在。
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        # - name: docker-sock
        #   hostPath:
        #     path: /var/run/docker.sock
        #     type: Socket
# __GIT_REMOTE_PVC_BEGIN__
# ---
## git-remote 集群卷（多节点变体；单节点 hostPath 变体渲染时本块被剔除）
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
