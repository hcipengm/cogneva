apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cogneva
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
