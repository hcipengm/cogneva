# 两个 Secret 的参考结构（请勿直接 apply）。
#
# 凭证分两片，依据是谁读它：只被安全网关读的住 cogneva-secrets-oob，被业务
# Pod 读的（两者也可能读同一份非凭证状态）住 cogneva-secrets。分家的理由是可核的
# ——内部那片是**整对象** get 与整对象挂载，把一个只该网关读的键放进去，等于把它
# 铺给持那一份的每一个工作负载；反过来把业务要读的键放去带外片，那些 Pod 会缺键
# 起不来。所以下面两份的键名不是随口分的，别把键从一份挪到另一份。
#
# Secret 不由 kubectl apply 管理：内部实例密钥由 deploy/scripts/init-secrets.sh
# 在安装时随机生成（bootstrap 自动调用），带外凭证由 WebUI 向导 /
# kubectl edit secret 写入。这样仓库不携带任何可用密码，apply 也不会用空占位
# 覆盖带外真值。
#
# 正确安装顺序：
#   bash deploy/scripts/init-secrets.sh    # 生成内部密钥、创建两个 Secret
#   kubectl apply -f deploy/rendered/k3s-single/   # 部署工作负载（引用 Secret）
#   # 平台 token / LLM 上游：经 WebUI 配置向导写入（写进带外那一份）
#
# 如需手工创建，可参考下列键结构（值一律留空，按需带外填入）：
---
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # —— 内部实例密钥：init-secrets.sh 自动随机生成，勿手工填弱密码 ——
  # pg-password：PostgreSQL 账号密码（postgres-deployment 与主应用/进化连接串共用）
  pg-password: ""
  # redis-password：redis-server --requirepass 与 cogneva.json redis_url 插值共用
  redis-password: ""
  # webhook-internal：网关→主应用 webhook 内部转发 HMAC 签名密钥
  webhook-internal: ""
  # jwt-secret / evolution-jwt-secret：主应用与进化的会话签名密钥（刻意不同源）
  jwt-secret: ""
  evolution-jwt-secret: ""
  # instance-fingerprint：实例身份指纹，重装/换机带同一份才是同一个实例
  instance-fingerprint: ""
  # meili-master-key / s3-access-key / s3-secret-key：检索与对象存储的实例密钥
  meili-master-key: ""
  s3-access-key: ""
  s3-secret-key: ""
  # smtp-password：邮件出口口令。它被主应用与进化两个 Pod 读，所以住内部片——
  # 放进带外片等于给它们一个读不到的键。
  smtp-password: ""
  # —— 非凭证状态：由本程序写入，恢复靠备份里的那一份 ——
  # contribution-config：贡献通道的 provider/account/策略文档
  contribution-config: ""
  # git-identity-state / git-identity-note / git-ssh-public-key：网关 git 身份
  # 的自举状态（私钥那半在带外片）。
  git-identity-state: ""
  git-identity-note: ""
  git-ssh-public-key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets-oob
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # —— 带外凭证：留空，由 WebUI 向导或 kubectl edit secret 写入，仅注入安全网关 ——
  # llm-upstreams：LLM 上游池 JSON 数组（网关唯一 LLM 凭证来源）
  llm-upstreams: ""
  # github-token / gitee-token：代码平台 API 与 git 透传出口凭证
  github-token: ""
  gitee-token: ""
  # gitee-refresh-token：OAuth 授权码模式下的刷新令牌（30 天有效，循环续期）
  gitee-refresh-token: ""
  # github-webhook-secret：GitHub webhook HMAC-SHA256 验签
  github-webhook-secret: ""
  # gitee-webhook-token：Gitee webhook 口令验签
  gitee-webhook-token: ""
  # github-oauth-client-secret / gitee-oauth-client-secret：两个平台的 OAuth
  # App 客户端密钥，只能去平台后台签发与轮换
  github-oauth-client-secret: ""
  gitee-oauth-client-secret: ""
  # github-app-id / github-app-installation-id / github-app-private-key：
  # GitHub App 三件套（以 App bot 身份发出时的凭证）
  github-app-id: ""
  github-app-installation-id: ""
  github-app-private-key: ""
  # git-ssh-private-key / -pending：网关自举的 git 身份私钥（生效与待确认）
  git-ssh-private-key: ""
  git-ssh-private-key-pending: ""
  # notification-dingtalk-secret / notification-feishu-secret：钉钉、飞书机器人
  # 报文的签名密钥，由平台后台发给该机器人；出口要签名时向安全网关借，密钥
  # 只在网关进程里。
  notification-dingtalk-secret: ""
  notification-feishu-secret: ""
  # clickhouse-password：观测栈时序明细后端的口令（由观测栈安装脚本镜像过来）
  clickhouse-password: ""
