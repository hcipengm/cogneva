# cogneva-secrets 参考结构（请勿直接 apply）。
#
# Secret 不由 kubectl apply 管理：内部实例密钥由 deploy/scripts/init-secrets.sh
# 在安装时随机生成（bootstrap 自动调用），带外凭证由 WebUI 向导 /
# kubectl edit secret 写入。这样仓库不携带任何可用密码，apply 也不会用空占位
# 覆盖带外真值。
#
# 正确安装顺序：
#   bash deploy/scripts/init-secrets.sh    # 生成内部密钥、创建 Secret
#   kubectl apply -f deploy/rendered/k3s-single/   # 部署工作负载（引用 Secret）
#   # 平台 token / LLM 上游：经 WebUI 配置向导写入
#
# 如需手工创建，可参考下列键结构（值一律留空，按需带外填入）：
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # —— 内部实例密钥：init-secrets.sh 自动随机生成，勿手工填弱密码 ——
  # pg-password：PostgreSQL 账号密码（postgres-deployment 与主应用/进化连接串共用）
  pg-password: ""
  # redis-password：redis-server --requirepass 与 cogneva.json redis_url 插值共用
  redis-password: ""
  # webhook-internal：网关→主应用 webhook 内部转发 HMAC 签名密钥
  webhook-internal: ""
  # —— 带外凭证：留空，由 WebUI 向导或 kubectl edit secret 写入，仅注入安全网关 ——
  # llm-upstreams：LLM 上游池 JSON 数组（网关唯一 LLM 凭证来源）
  llm-upstreams: ""
  llm-api-key: ""
  # github-token / gitee-token：代码平台 API 与 git 透传出口凭证
  github-token: ""
  gitee-token: ""
  # github-webhook-secret：GitHub webhook HMAC-SHA256 验签
  github-webhook-secret: ""
  # gitee-webhook-token：Gitee webhook 口令验签
  gitee-webhook-token: ""
