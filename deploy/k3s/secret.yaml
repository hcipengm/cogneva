apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  pg-password: "changeme"
  # redis 认证密码：redis-server --requirepass 与 cogneva.json redis_url 插值共用。
  # 真实值带外写入（kubectl create secret 或 kubectl edit），不入库。
  redis-password: ""
  llm-api-key: ""
  # 代码平台 token：只注入安全网关（COGNEVA_GITHUB_TOKEN / COGNEVA_GITEE_TOKEN），
  # 主应用零持有。真实值带外写入（kubectl create secret 或 kubectl edit），不入库。
  gitee-token: ""
  # webhook 验签（只注入安全网关 8082 通道）：github-webhook-secret 验
  # X-Hub-Signature-256；gitee-webhook-token 对 X-Gitee-Token 头或
  # ?password= query。未配置时对应端点一律 503（fail-closed），真实值带外写入。
  gitee-webhook-token: ""
  # 网关→主应用 webhook 内部转发 HMAC（两端都注入：网关注入签名，主应用
  # 注入验签）。平台 secret 不出网关，主应用只认这个内部签名。
  webhook-internal: ""
