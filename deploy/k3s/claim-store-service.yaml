# 抓取面：无头 Service（clusterIP: None），每个节点的 Pod 各自成为一个抓取目标。
# 端点名 `http` 就是发现规则：抓取配置按端口名挑端点，换个名字等于这条抓取配置
# 不存在，而「没有告警」与「没人在抓」在这里长得一样。
apiVersion: v1
kind: Service
metadata:
  name: cogneva-claim-store
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/managed-by: k3s
    app.kubernetes.io/component: claim-store
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: claim-store
  ports:
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP