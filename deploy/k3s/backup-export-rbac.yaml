# 导出备份包（WebUI 设置页的「导出」）所需的最小权限。
#
# 模板不在这里独立声明：页面按一次导出就起一个 Job，而这个 Job 是从每日备份那个
# CronJob 克隆出来的（镜像、env、卷、亲和性只有一处正本），所以这里只需**按名字**
# 读那一个 CronJob。名字写死是 RBAC 的硬约束——resourceNames 不接受通配；
# 改名要连这行一起改，否则表现是「读不到备份 CronJob」，而备份本身一切正常。
#
# jobs 只给 get/list/create：删由 Job 自己的 ttlSecondsAfterFinished 做，
# 导出端没有任何理由去删一个正在跑或已经跑完的 Job。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-backup-export
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/managed-by: k3s
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["cogneva-backup"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-backup-export
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/managed-by: k3s
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-backup-export
  apiGroup: rbac.authorization.k8s.io
