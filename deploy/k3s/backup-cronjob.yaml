# 数据面备份 CronJob：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象
# raw 层 + 实例身份 Secret）每日打成 tar.zst 落 cogneva-backup-pvc。
# 重启档由 PVC keep 策略覆盖，本备份覆盖重装/换机档
# （deploy/scripts/restore-from-package.sh 消费）。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
spec:
  # 每日 03:17（按下面的 timeZone 解释）：错峰，避开整点/半点的集群任务共振。
  schedule: "17 3 * * *"
  # 显式钉住时区，与 chart 的 backup.timeZone 同值：留空则由节点 local 解释，
  # 宿主时区一变备份时点就静默漂移。
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 备份失败不重试成串：下一个周期自然再来，连续失败由 history 留证。
      backoffLimit: 1
      # 卡死的运行必须有人来杀。concurrencyPolicy 是 Forbid，一次挂住的运行会
      # 让它之后每一次都不再开始——备份停掉，连「谁来给挂住那笔收尾」也一起停。
      # 这个界杀的是容器，同一个值经 env 进运行自己写的账本行，判超期用的是那一
      # 行上的数（与 chart 的 backup.runDeadlineSeconds 同值）。
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # 备份以专用非 root uid 运行；与 chart 逐字段对齐（parity 门）。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          # 进化卷是 RWO：读它要求备份 Pod 与进化 Pod 同节点。单节点 K3s 上这条
          # 恒成立，写在这里是为了与 chart 的 k3s-single 渲染逐字段对齐——两边
          # 漂一个字段，parity 门就会红。
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: cogneva-evolution
                      app.kubernetes.io/component: evolution
                  topologyKey: kubernetes.io/hostname
          # 凭证面的根目录由 kubelet 按宿主 umask 建（DirectoryOrCreate → 0755），
          # 演练会把它量成一条违例。只修一次不够，目录重建后又回到默认模式，
          # 所以每次开工前收紧。
          initContainers:
            - name: tighten-credential-surface
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              # Pod 里唯一以 root 跑的一步：先把属主交给主容器的 uid，再收紧模式。
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              command:
                - sh
                - -c
                - >-
                  chown -R 1001:1001 /backups /offsite &&
                  chmod 0700 /backups /offsite
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
          containers:
            - name: backup
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              args: ["backup"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 快照 API 只在 Qdrant REST 端口（6333），gRPC（6334）没有。
                - name: COGNEVA_QDRANT_HTTP_URL
                  value: "http://qdrant.cogneva.svc.cluster.local:6333"
                - name: COGNEVA_BACKUP_KEEP
                  value: "7"
                # 与上面的 activeDeadlineSeconds 是同一个值的两个载体：一个让
                # kubelet 到点杀容器，一个让运行把「这次我被给了多久」写进账本
                # 那一行。分开写两个数会漂，超期判断就跟着漂。
                - name: COGNEVA_BACKUP_RUN_DEADLINE_SECONDS
                  value: "3600"
                - name: COGNEVA_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # 出包进程跑的是哪份镜像。容器读不到自己的镜像引用，只能由清单
                # 注入；这里与同一份清单里的 image 字段逐字一致。
                - name: COGNEVA_IMAGE_REF
                  value: "localhost:30500/cogneva:local"
                # 进化 Pod 的 data_dir。名字是清单里的身份；恢复端按「根名 + 库名」
                # 定位，不把主应用与进化 Pod 的同名策略库合成一份。
                - name: COGNEVA_BACKUP_EXTRA_DATA_ROOTS
                  value: "evolution=/var/lib/cogneva-evolution-data"
                # 进化 bare 仓不在数据根里，是独立的一卷：已推的 rev 能从公开
                # 远端重取，未推的不能，所以整仓打成 git bundle 进包。
                - name: COGNEVA_BACKUP_GIT_REMOTE_DIR
                  value: "/git-remote"
                # 卷外那一份的落点。写者只负责复制；「有没有、是不是今晚的」
                # 由演练那一跑自己遍历目录来判。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
              resources:
                # 请求按流式作业实耗定（COPY→文件、tar.zst 流式压缩，常驻内存
                # 极小）；定高了在资源紧张的小节点上会调度不出来。
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              volumeMounts:
                # 对象 raw 层来源（只读：备份绝不写数据卷）。
                - name: data
                  mountPath: /var/lib/cogneva-data
                  readOnly: true
                # 进化 Pod 的 data_dir：只读共挂，只取 policies/ 与
                # meta_learning/decision_stats.json。
                - name: evolution-data
                  mountPath: /var/lib/cogneva-evolution-data
                  readOnly: true
                # 只读：备份只从 bare 仓读对象，绝不写它。
                - name: git-remote
                  mountPath: /git-remote
                  readOnly: true
                # 身份导出：Secret 以只读卷进 Pod，打成 apply-able manifest，
                # 不为备份单独扩 RBAC。
                #
                # **只在包是密文时才挂**：包里那份清单只是 base64，卷上与卷外各躺
                # 一份就是两处新的凭证载体，能读文件的人拿走全部 token。没有包级
                # 口令时导出端本来就不导这两片（它会点名成有损面），那么这里的挂载
                # 就只剩一个作用：让备份 Pod 读得到它根本不会用到的凭证。凭证只在
                # 安全网关里，是从「挂不挂」这一层就开始算的。
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cogneva-data-pvc
            - name: evolution-data
              persistentVolumeClaim:
                claimName: cogneva-evolution-data-pvc
            # k3s-single 的 gitRemote 是宿主目录：备份 Pod 已被上面的亲和钉在
            # 进化 Pod 所在节点上，所以看到的是同一份 bare 仓。
            - name: git-remote
              hostPath:
                path: "/var/lib/cogneva-data/git-remote"
                type: Directory
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            # 宿主机上的一条路径，与备份卷不在同一个卷对象里：删 PVC、卷被回收
            # 都不动它。与备份卷同一个故障域——跨路径不等于跨机器。
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
