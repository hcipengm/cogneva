# LLM 设置界面（WebUI 系统设置）所需的最小权限：**只碰工作负载，不碰 Secret 对象**。
#
# 写入不经过这个主体。主应用把要写的字段转发给安全网关的内部端点
# （`secret_write::forward`），由网关用自己的 SA 落盘。
#
# 读取也不经过它了。迁移窗里的三个读点——LLM 状态、贡献配置、gitee 续期循环——
# 已全部搬进网关进程：主应用按 `/internal/*` 拿派生读数（家数、布尔位、策略名），
# 拿不到任何一把 key。带 out-of-band 凭证的那两片，这个身份不再有 get。
#
# 删掉这条规则之后，主应用那一侧任何一处 Secret 读都会 403，而它不该有读点——
# `deploy/credential-holders.tsv` 里只留网关那两行，凭证持有面门禁按渲染产物
# 反查，多一个能读的主体就报。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json"]
    verbs: ["get", "patch"]
  # 集群组件健康端点（/api/v1/cluster/components）读取三组件副本状态；
  # 晋级门端点（/api/v1/admin/promotion-gate）改配置后滚动主应用。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-evolution", "cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-llm-admin
  apiGroup: rbac.authorization.k8s.io
