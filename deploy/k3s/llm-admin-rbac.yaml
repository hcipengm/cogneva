# LLM 设置界面（WebUI 系统设置）所需的最小权限：**只读**两个 Secret 对象。
#
# 写入不经过这个主体。主应用把要写的字段转发给安全网关的内部端点
# （`secret_write::forward`），由网关用自己的 SA 落盘。因此这里只有 get——
# patch 在代码里已经没有调用点，留着等于把「代持带外凭证」复制一份到零凭证的
# 进程里，而清单上看不出它没人在用。
#
# 仍需要 get，是因为三个读点今天还跑在主应用进程里：LLM 状态
# （`llm_admin::llm_status_handler`）、贡献配置（`contribution_admin::read_contrib_config`）、
# gitee 续期循环（`contribution_admin::spawn_gitee_token_refresher`，起在 `plugin.rs`）。
#
# 关闭条件（门要能判）：这三个读点搬进网关进程后——plugin 不再给主应用挂网关路由、
# 不再起续期循环——本条 secrets 规则整条删掉。登记表
# （deploy/credential-holders.tsv）把这一点写成 closes-when 指针；凭证持有面门禁在
# 指针指向的符号消失时报红。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cogneva-secrets", "cogneva-secrets-oob"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json"]
    verbs: ["get", "patch"]
  # 集群组件健康端点（/api/v1/cluster/components）读取三组件副本状态；
  # 晋级门端点（/api/v1/admin/promotion-gate）改配置后滚动主应用。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-evolution", "cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-llm-admin
  apiGroup: rbac.authorization.k8s.io
