# LLM 设置界面（WebUI 系统设置）所需的最小权限：
# 主应用通过 in-cluster ServiceAccount 把用户在设置页填写的 key 写入
# Secret，并把 provider/base_url/model 写进安全网关 Deployment 的 env
# （模板变更自动滚网关）。真 key 只在安全网关 Pod。
#
# 两个 Secret 对象都在这条规则里：凭证分成两片之后，向导与贡献通道的写点仍然落
# 在同一批键上，只是目标对象不同。逐个键看，授权集合与切分前完全一样，没有变宽
# 也没有变窄——写者搬进网关、这条授权随之收窄到只指带外那一片，是后面一批的事。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cogneva-secrets", "cogneva-secrets-oob"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json"]
    verbs: ["get", "patch"]
  # 集群组件健康端点（/api/v1/cluster/components）读取三组件副本状态；
  # 晋级门端点（/api/v1/admin/promotion-gate）改配置后滚动主应用。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-evolution", "cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-llm-admin
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-llm-admin
  apiGroup: rbac.authorization.k8s.io
