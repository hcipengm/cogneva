# 集群内镜像仓库：GitOps L1 金丝雀镜像秒级分发通道。
# publisher（进化 Pod）buildah push overlay 镜像到 Service:5000（集群 DNS，http）；
# 节点 kubelet/containerd 经 NodePort 以 localhost:30500 pull——containerd 对
# localhost 默认 http 免 TLS，每个节点的 NodePort 都由 kube-proxy 转发到本 Pod，
# 单/多节点通吃，无需节点 registry 信任配置。四部署清单 pin 本仓库的
# localhost:30500/cogneva:local 浮动签，bootstrap 首次播种、swap-image 换版与
# mainline 收敛后负责前移；金丝雀/mainline overlay 的 FROM 也取这里的镜像。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-registry-pvc
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
  # 卷与密钥一样带卸载保护：重装要接着用同一份状态（已分发的镜像层）。
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-registry
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: cluster-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: cluster-registry
    spec:
      initContainers:
        # 回收。`garbage-collect -m` 删的是"没有任何 tag 指向的 manifest 及其独占层"，
        # 而这种东西正随每次收敛累积：浮动 `:local` 每次前移都留下一个孤儿 manifest，
        # 被中断的构建也会。2026-09-27 实测（dry-run）：416 个 blob 里 150 个、50 个
        # manifest 可删，合计 3.7 GiB —— 占这张卷的一半；不带 -m 时是 0，孤儿全挂在
        # 无 tag 的 manifest 上。
        #
        # 放在 initContainer 而不是定时任务，是因为它**天生无竞态**：唯一接受上传的
        # 进程就是同 Pod 的 registry，init 阶段它还没起来，标记-清扫不可能删到一个正在
        # 上传、尚未被任何 manifest 引用的 blob（定时任务在 registry 运行时跑就有这个
        # 窗口）。代价是它只在 Pod 启动时跑一次，所以它回收的是"上次启动以来"的孤儿；
        # 定时触发是另一件事（见任务树 C31），不该用定时任务直接跑 GC 换来这个窗口。
        - name: registry-gc
          image: registry:2
          imagePullPolicy: IfNotPresent
          command:
            - registry
            - garbage-collect
            - -m
            - /etc/docker/registry/config.yml
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            # 与 registry 容器同一份挂载（GC 要删），根目录一处声明。
            - name: data
              mountPath: /var/lib/registry
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # 删除通道。registry 默认拒绝 DELETE manifest（回 405），而主线部署器的
            # 容量回收正是靠删掉保留窗之外的老 tag 才放得出空间——删不动时它唯一的
            # 表现是一个被拒的删除读数，卷继续满下去。让谁删、留多少个由部署器按
            # 保留策略决定，这里只把门打开。
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
        # 只读走查这张卷的边车：第三方 registry 进程不发布任何指标，而占满这张卷
        # 的是盘上全部字节（它 API 报的"活 tag 引用的层"看不见孤儿层）。盘上那份
        # 是声明量要比的量，只能由挂载着这张卷的进程走查出来。
        - name: volume-walker
          image: localhost:30500/cogneva:local
          # 子命令是这里的全部内容：不带它，镜像入口跑的是完整应用，而这个 Pod 里
          # 没有 Redis 也没有配置面，进程在装配阶段就退——边车 CrashLoop，卷占用这条
          # 序列永远不会出现。清单和二进制是两份可以分开到达的东西，所以"跑的是走查
          # 模式"只能由命令行说出来，不能靠镜像默认。
          command: ["/opt/cogneva/cogneva"]
          args: ["volume-walker"]
          # 不用 Always（浮动签的默认策略）：本 Pod 的另一个容器就是那个 registry，
          # Always 等于让这个 Pod 起来之前先向自己拉镜像——Recreate 时旧 Pod 已删，
          # 拉取必然失败，Pod 永远起不来，整条镜像分发通道跟着断。节点缓存由分发面
          # 保证（元启动播种 + 每节点 importer），而这份清单只会由正在运行新 rev 的
          # 进化 Pod 应用，那一刻节点已持有该镜像。
          imagePullPolicy: IfNotPresent
          env:
            # 声明照卷族既有格式写（`claim=路径`），量出来的数挂在同名卷上，
            # 与其它工作负载自量挂载产出的是同一条序列。
            - name: COGNEVA_DATA_VOLUME_MOUNTS
              value: "cogneva-registry-pvc=/var/lib/registry"
            - name: COGNEVA_VOLUME_WALKER_PORT
              value: "9100"
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            # 只读：走查不需要写权，挂成只读让"量一下"这件事不可能改到 store。
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cogneva-registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-registry
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
spec:
  type: NodePort
  # 端点不看就绪：这个 Service 分发的是节点要拉取的镜像，而 Pod 的就绪还取决于
  # 走查边车那个容器。边车要跑的是"带 volume-walker 子命令的二进制"，而清单可能
  # 先于节点缓存到达（部署器先推进裸仓、再滚四部署，GitOps 拉取端在这中间就会
  # apply 本文件），此刻它只能拿到旧二进制、起来就退，Pod 因此 NotReady——没有
  # 端点，节点拉不到新层，而新层正是让边车能起来的那份，分发通道被自己的边缘
  # 卡死。放开这一个字段，边车起不来只是"读数暂时没有"：registry 照常服务，
  # 节点缓存被 importer 推进后，边车下一次重试就拿到新二进制。就绪与否仍照常
  # 记在 Deployment 上，容器在 CrashLoop，问题没有被藏起来。
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
      protocol: TCP
    # 监控抓取面。端点名 `http` 就是发现规则：ServiceMonitor 按端口名选端点，
    # 换个名字等于这条抓取配置不存在，而"没有告警"和"没人在抓"在这里长得一样。
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP
