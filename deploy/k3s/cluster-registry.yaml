# 集群内镜像仓库：GitOps L1 金丝雀镜像秒级分发通道。
# publisher（进化 Pod）buildah push overlay 镜像到 Service:5000（集群 DNS，http）；
# 节点 kubelet/containerd 经 NodePort 以 localhost:30500 pull——containerd 对
# localhost 默认 http 免 TLS，每个节点的 NodePort 都由 kube-proxy 转发到本 Pod，
# 单/多节点通吃，无需节点 registry 信任配置。bootstrap/swap-image 负责把
# localhost/cogneva:local 基镜像播种进来（overlay 的 FROM）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-registry-pvc
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-registry
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: cluster-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: cluster-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cogneva-registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-registry
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
      protocol: TCP
