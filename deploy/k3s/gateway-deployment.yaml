# 独立安全网关：代持全部敏感凭证（LLM API Key、代码平台 token、webhook secret），
# 沙盒 Pod 零凭证。三个通道：8080 外网代理（脱敏审查后出站）、8081 LLM 与
# 代码平台/git 透传（凭证出口注入）、8082 webhook 入口（验平台签名后附内部
# HMAC 转发主应用）。
# 依赖：主程序需以 security-gateway 模式运行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
    app.kubernetes.io/version: "0.5.7"
spec:
  replicas: 1
  # No surge: every profile runs a single replica on a single node, so a surging
  # pod has nowhere to be scheduled and the rollout times out. Terminating the
  # old pod first frees its request, at the cost of a brief restart window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: "0.5.7"
    spec:
      containers:
        - name: security-gateway
          image: localhost:30500/cogneva:local
          # 必须 Always：静态清单把部署指回浮动签 :local，内容可被 bootstrap/
          # swap-image 重新播种；IfNotPresent 会无限期复用节点缓存里的旧内容。
          imagePullPolicy: Always
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # LLM 上游池（LLM 通道唯一配置来源）：Secret llm-upstreams 条目，
            # JSON 数组，每元素 {api_style, base_url, model, api_key}。
            # 单 LLM 即单元素数组；多上游时按声明顺序在 429/402/连接失败时
            # 故障转移。凭证仅注入网关，沙盒 Pod 不挂载任何 Secret。
            # WebUI 向导 / llm-config API 写 Secret 后用 restartedAt 注解
            # 滚动本 Deployment 生效。
            - name: COGNEVA_LLM_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-upstreams
                  optional: true
            # 代码平台透传凭证：/github/* 出口注入 Bearer token，
            # /gitee/* 出口注入 access_token query 参数；/git/github|gitee/*
            # 出口注入 Basic auth。业务 Pod 只见占位符。
            - name: COGNEVA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            # GitHub App 凭证（可选，运营者配置）：齐备时 /github/* 出口以 App
            # bot 身份（installation token，自动轮换）发出；未配置或换取失败
            # 回退上面的静态 token。私钥仅注入网关，业务 Pod 零持有。
            - name: COGNEVA_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-id
                  optional: true
            - name: COGNEVA_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-installation-id
                  optional: true
            - name: COGNEVA_GITHUB_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-private-key
                  optional: true
            - name: COGNEVA_GITEE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-token
                  optional: true
            # git 传输的 SSH 兜底镜像（见 cog-gateway 的 git_mirror 模块）。
            # 私钥只注入本进程，是"业务 Pod 零凭证"在兜底通道上的延续：Pod 依然
            # 只会说 smart HTTP，SSH 只发生在网关到 GitHub 之间。
            # 路径写死在这里而不是配置项：它同时是卷的挂载点，两处分开配就会漂移。
            # 缺私钥时网关自己检测到文件不存在、兜底保持关闭（HTTPS 单通道），
            # 所以可以先部署、后补凭证。
            - name: COGNEVA_GATEWAY_GIT_MIRROR_ROOT
              value: /var/lib/cogneva-git-mirror
            - name: COGNEVA_GATEWAY_GIT_MIRROR_ENABLED
              value: "true"
            - name: COGNEVA_GATEWAY_GIT_SSH_KEY
              value: /etc/cogneva/git-ssh/id_ed25519
            # 贡献通道 Gitee OAuth 应用凭证：授权码兑换与 token 续期的唯一起点，
            # 只注入本进程，业务 Pod 零持有；缺失即授权码通道 fail-closed
            # （手动令牌/PAT 通道不受影响）。client_id 是 OAuth App 的公开标识，
            # 随清单原样恢复，重装/换机不受影响；client_secret 相反——它是外面
            # 发的、只能由 Gitee 后台轮换的凭证，写进清单就等于写进仓库（含历史），
            # 因此只从 cogneva-secrets 注入（init-secrets.sh 建空占位，真值带外写）。
            - name: COGNEVA_GITEE_OAUTH_CLIENT_ID
              value: "52f5294997d7a9f7046ca0bc7bf7f05da7a293a01800b5df6565be88539e2ea6"
            - name: COGNEVA_GITEE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-oauth-client-secret
                  optional: true
            # webhook 入口（8082）：验平台签名后附内部 HMAC 转发主应用
            # （默认 http://cogneva:9091，可用 COGNEVA_WEBHOOK_FORWARD_URL
            # 覆盖）。任一 secret 未配置时对应端点一律 503（fail-closed），
            # 真实值带外写入（kubectl edit secret cogneva-secrets）。
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            - name: COGNEVA_GITEE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-webhook-token
                  optional: true
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # ── 上游池可观测与自愈落盘 ──
            # 告警状态机落 PG（重启可查历史），池状态跨进程信号走 Redis。
            # 复用集群内既有实例，凭证来自 cogneva-secrets（安装时随机生成）。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            - name: COGNEVA_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-0.redis.cogneva.svc.cluster.local:6379"
            # 日志→Loki、时序明细→ClickHouse、告警→Alertmanager；端点随观测栈，
            # 未启用时对应导出静默降级（池自愈主链不受影响）。
            - name: COGNEVA_LOKI_ENABLED
              value: "true"
            - name: COGNEVA_LOKI_ENDPOINT
              value: "http://loki.monitoring.svc.cluster.local:3100"
            - name: COGNEVA_CLICKHOUSE_ENABLED
              value: "true"
            - name: COGNEVA_CLICKHOUSE_BASE_URL
              value: "http://clickhouse.monitoring.svc.cluster.local:8123"
            - name: COGNEVA_CLICKHOUSE_DATABASE
              value: "cogneva"
            - name: COGNEVA_CLICKHOUSE_TABLE
              value: "llm_events"
            - name: COGNEVA_CLICKHOUSE_USERNAME
              value: "cogneva"
            # 密码由可观测栈安装时镜像写入（monitoring/clickhouse-credentials →
            # cogneva-secrets/clickhouse-password）；未部署时 optional 缺省即降级。
            - name: COGNEVA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: clickhouse-password
                  optional: true
            # 观测通道监听端口；与容器端口同源，避免两处漂移。
            - name: COGNEVA_SG_METRICS_PORT
              value: "9090"
          livenessProbe:
            httpGet:
              path: /health/live
              port: egress-proxy
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: egress-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: git-mirror
              mountPath: /var/lib/cogneva-git-mirror
            # 私钥挂成固定文件名：git 读的是路径，不是 Secret 的键名。
            - name: git-ssh-key
              mountPath: /etc/cogneva/git-ssh
              readOnly: true
      volumes:
        - name: git-mirror
          persistentVolumeClaim:
            claimName: cogneva-git-mirror-pvc
        # 整个卷 optional：没有私钥时 Pod 照常起来，网关自己检测到文件不存在
        # 就保持兜底关闭。若这里不 optional，一次"先部署后补凭证"会让网关卡在
        # ContainerCreating——而网关是全部出站调用的唯一出口。
        - name: git-ssh-key
          secret:
            secretName: cogneva-secrets
            optional: true
            # 0400：OpenSSH 只在**属主是自己**时才检查权限位。容器以 1001 运行、
            # 而 Secret 卷文件属主是 root（fsGroup 只加组读），所以这条检查会被
            # 跳过；但把权限收窄到最小仍然是对的——这个文件是账号级的写权限。
            #
            # Written as decimal 256, not as 0400. The rollout path parses every
            # manifest with a YAML 1.2 reader before re-emitting it, and 1.2
            # rejects the leading-zero octal form: "0400" comes back as the
            # string '0400', which the API server then refuses with
            # "unrecognized type: int32" — so the whole rollout dies on the
            # first target. Decimal is the only spelling both readers agree on
            # (here 256 == 0o400). Do not "tidy" this back to 0400.
            defaultMode: 256
            items:
              - key: git-ssh-private-key
                path: id_ed25519
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
