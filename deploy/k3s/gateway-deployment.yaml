# 独立安全网关：代持全部敏感凭证（LLM API Key、代码平台 token、webhook secret），
# 沙盒 Pod 零凭证。三个通道：8080 外网代理（脱敏审查后出站）、8081 LLM 与
# 代码平台/git 透传（凭证出口注入）、8082 webhook 入口（验平台签名后附内部
# HMAC 转发主应用）。
# 依赖：主程序需以 security-gateway 模式运行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
    app.kubernetes.io/version: "0.5.7"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: "0.5.7"
    spec:
      containers:
        - name: security-gateway
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # LLM 上游池（LLM 通道唯一配置来源）：Secret llm-upstreams 条目，
            # JSON 数组，每元素 {api_style, base_url, model, api_key}。
            # 单 LLM 即单元素数组；多上游时按声明顺序在 429/402/连接失败时
            # 故障转移。凭证仅注入网关，沙盒 Pod 不挂载任何 Secret。
            # WebUI 向导 / llm-config API 写 Secret 后用 restartedAt 注解
            # 滚动本 Deployment 生效。
            - name: COGNEVA_LLM_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-upstreams
                  optional: true
            # 代码平台透传凭证：/github/* 出口注入 Bearer token，
            # /gitee/* 出口注入 access_token query 参数；/git/github|gitee/*
            # 出口注入 Basic auth。业务 Pod 只见占位符。
            - name: COGNEVA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            - name: COGNEVA_GITEE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-token
                  optional: true
            # webhook 入口（8082）：验平台签名后附内部 HMAC 转发主应用
            # （默认 http://cogneva:9091，可用 COGNEVA_WEBHOOK_FORWARD_URL
            # 覆盖）。任一 secret 未配置时对应端点一律 503（fail-closed），
            # 真实值带外写入（kubectl edit secret cogneva-secrets）。
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            - name: COGNEVA_GITEE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-webhook-token
                  optional: true
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # 贡献通道 OAuth 应用标识（随 chart 公开的客户端身份，非用户凭证）；
            # Gitee secret 泄露处置见网关轮换流程，用户 token 不受影响。
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: "Ov23liz35yGbAC5vO0OP"
            - name: COGNEVA_GITEE_OAUTH_CLIENT_ID
              value: "52f5294997d7a9f7046ca0bc7bf7f05da7a293a01800b5df6565be88539e2ea6"
            - name: COGNEVA_GITEE_OAUTH_CLIENT_SECRET
              value: "99237107ca76415c65608c49612fc7fd59e9975e02829c7787c0a42b480998f9"
            # Gitee 严格校验 redirect_uri，code 只回跳注册载体地址；
            # 向导引导用户粘贴跳转后的地址栏网址完成授权。
            - name: COGNEVA_GITEE_OAUTH_REDIRECT_URI
              value: "https://github.com/hcipengm/cogneva"
          livenessProbe:
            httpGet:
              path: /health/live
              port: egress-proxy
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: egress-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
