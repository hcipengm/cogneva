# 独立安全网关：代持全部敏感凭证（LLM API Key 等），沙盒 Pod 零凭证。
# 两个通道：8080 外网代理（脱敏审查后出站）、8081 LLM 代理（意图封装后代调）。
# 依赖：主程序需以 security-gateway 模式运行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
    app.kubernetes.io/version: "0.1.22"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: "0.1.22"
    spec:
      containers:
        - name: security-gateway
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # LLM 上游池（LLM 通道唯一配置来源）：Secret llm-upstreams 条目，
            # JSON 数组，每元素 {api_style, base_url, model, api_key}。
            # 单 LLM 即单元素数组；多上游时按声明顺序在 429/402/连接失败时
            # 故障转移。凭证仅注入网关，沙盒 Pod 不挂载任何 Secret。
            # WebUI 向导 / llm-config API 写 Secret 后用 restartedAt 注解
            # 滚动本 Deployment 生效。
            - name: COGNEVA_LLM_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-upstreams
                  optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: egress-proxy
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: egress-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
