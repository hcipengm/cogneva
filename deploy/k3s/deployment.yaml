apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.5.7"
spec:
  # 单副本：当前集群为单节点，双副本共享同一故障域没有可用性收益，
  # 只放大内存占用与凭证副本数。扩到多节点后再调回 2。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.5.7"
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: localhost:30500/cogneva:local
          # 必须 Always：静态清单把部署指回浮动签 :local，内容可被 bootstrap/
          # swap-image 重新播种；IfNotPresent 会无限期复用节点缓存里的旧内容。
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # 网关验签 webhook 转发入口（cogneva.json github_integration.webhook.port）。
            - name: webhook
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # Secret overrides — must use env names that apply_env_overrides() recognises.
            # LLM 与代码平台凭证只注入安全网关，主应用零持有、经网关代理访问，
            # 因此这里不再挂 OPENAI/ANTHROPIC/GitHub/Gitee 任何凭证。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            # Redis 认证：cogneva.json 的 dag_executor.redis_url 经 ${REDIS_PASSWORD} 插值
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            # LLM 零凭证零上游知识：cogneva.json 的 llm_routing 只有网关透传
            # 一个后端（api_key/model 是写死的非敏感占位），真 key 只在安全
            # 网关 Pod，LLM 流量经网关 8081 透传。
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            # GitHub/Gitee API 走安全网关透传（凭证网关注入，本 Pod 零 token）。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            # git 传输（PR 发布 clone/push）走网关 HTTPS 代理，网关注入
            # 凭证；本 Pod 不再持有 deploy key 或平台 token。
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # webhook 验签已在安全网关完成（gateway_verified=true，见
            # cogneva.json github_integration.webhook），本进程只验网关
            # 转发的内部 HMAC；未配置时事件入口不启动（fail-closed）。
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # JWT 签名密钥：安装时随机生成（init-secrets.sh）。缺失时进程生成
            # 一次性随机密钥，重启即全员登出，不会被已知弱密钥伪造。
            - name: COGNEVA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: jwt-secret
                  optional: true
            # 实例身份指纹：身份的规范来源，安装期生成。缺省时进程回退到状态
            # 文件 / 机器指纹推导（单机场景行为不变）。
            - name: COGNEVA_INSTANCE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: instance-fingerprint
                  optional: true
            # wiki 检索后端（Meilisearch）主密钥：cogneva.json 的
            # providers.wiki.options.api_key 经 ${MEILI_MASTER_KEY} 插值。必填——
            # /health 不鉴权，密钥错误只会在真正读写索引时才暴露，留空会把问题
            # 推迟到运行期，不如让 Pod 起不来。
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: meili-master-key
            # 贡献通道：GitHub 设备流只用公开的 client_id（本流程无 client_secret）。
            # Gitee 授权码流程的应用凭证由安全网关代持，本进程经
            # COGNEVA_OAUTH_GATEWAY_URL 借用（授权 URL 与授权码兑换都在网关侧），
            # 本 Pod 零持有 client_secret。
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: "Ov23liz35yGbAC5vO0OP"
            - name: COGNEVA_OAUTH_GATEWAY_URL
              value: "http://cogneva-security-gateway:8081"
            # Gitee 严格校验 redirect_uri；默认落地页（静态回调页）用 postMessage
            # 把 code 自动递回向导。
            - name: COGNEVA_GITEE_OAUTH_REDIRECT_URI
              value: "https://hcipengm.github.io/cogneva/oauth-callback.html"
            # GitOps 拉取端：poll 中央 bare 仓库（宿主 /var/lib/cogneva-data/
            # git-remote 挂入 /host-git）的 evolution-release 分支，L0 配置
            # 热更 / L1 金丝雀各自在本集群闭环。沙盒推送端只写该仓库。
            - name: COGNEVA_GITOPS_ENABLED
              value: "true"
            - name: COGNEVA_GITOPS_REPO_URL
              value: "/host-git"
            - name: COGNEVA_CLUSTER_NAME
              value: "main"
            - name: COGNEVA_GITOPS_METRICS_URL
              value: "http://localhost:8080/metrics"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            # 应用数据落持久卷：identity.json 决定实例名，丢了就会随机器指纹重算，
            # 按实例命名的资源逐次遗留；数仓 / 策略 / 记忆 / 原始日志同在此目录。
            - name: app-data
              mountPath: /var/lib/cogneva-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            - name: git-remote
              mountPath: /host-git
              readOnly: true
            # GitOps 拉取端的 kubectl：k3s 是多调用二进制，argv[0]=kubectl
            # 时就是 kubectl，版本与集群天然一致，零下载（CN 网络 dl.k8s.io
            # 限速到不可用，2026-08-06 实测 1.4KB/s）。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: app-data
          persistentVolumeClaim:
            claimName: cogneva-data-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: prompts
          configMap:
            name: cogneva-prompts
            # 空白机首启时 GitOps 拉取端尚未建过该 configmap，置可选
            # 避免主 Pod 卡 FailedMount；建好后挂载自动生效
            optional: true
        - name: git-remote
          # GitOps 中央 bare 仓库（与进化部署的 git-remote 同一 hostPath，
          # bootstrap 部署前已 seed）。主 Pod 只读克隆/fetch，沙盒推送端读写。
          hostPath:
            path: /var/lib/cogneva-data/git-remote
            type: Directory
        - name: kubectl-bin
          # 宿主 k3s 二进制文件挂载为 Pod 内 kubectl（见 volumeMount 注释）。
          # bootstrap 流程先装 k3s 再部署，文件必然存在。
          hostPath:
            path: /usr/local/bin/k3s
            type: File
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
