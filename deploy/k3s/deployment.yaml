apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.22"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.1.22"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # Secret overrides — must use env names that apply_env_overrides() recognises
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: anthropic-api-key
                  optional: true
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: db-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            # GitHub integration: tokens + webhook HMAC secret
            - name: COGNEVA_GITHUB_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            # Patch-to-PR publishing clones/pushes over SSH on port 22
            # (github.com HTTPS is unreachable from this network).
            - name: COGNEVA_GITHUB_USE_SSH
              value: "1"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/cogneva-keys/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/var/lib/sf-data/.ssh_known_hosts"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: deploy-key
              mountPath: /etc/cogneva-keys
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: deploy-key
          secret:
            secretName: cogneva-deploy-key
            defaultMode: 256
            # 空白机一键部署时该 secret 尚未创建，置为可选避免主 Pod 永远
            # 卡在 FailedMount；GitHub/Gitee 推送是部署后另行配置的能力
            optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
