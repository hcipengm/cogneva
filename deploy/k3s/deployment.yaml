apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.22"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.1.22"
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # Secret overrides — must use env names that apply_env_overrides() recognises
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: anthropic-api-key
                  optional: true
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            # Redis 认证：cogneva.json 的 dag_executor.redis_url 经 ${REDIS_PASSWORD} 插值
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            # 沙盒零凭证同款：主应用不再挂载真 key。cogneva.json 的
            # llm_routing backend api_key 占位 ${KIMI_API_KEY} 需要非空值，
            # 填非敏感占位串；真 key 只在安全网关 Pod，LLM 流量经网关 8081 透传。
            - name: KIMI_API_KEY
              value: "via-security-gateway"
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            # GitHub integration: tokens + webhook HMAC secret
            - name: COGNEVA_GITHUB_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            # Patch-to-PR publishing clones/pushes over SSH on port 22
            # (github.com HTTPS is unreachable from this network).
            - name: COGNEVA_GITHUB_USE_SSH
              value: "1"
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/cogneva-keys/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/var/lib/sf-data/.ssh_known_hosts"
            # GitOps 拉取端：poll 中央 bare 仓库（宿主 /var/lib/cogneva-data/
            # git-remote 挂入 /host-git）的 evolution-release 分支，L0 配置
            # 热更 / L1 金丝雀各自在本集群闭环。沙盒推送端只写该仓库。
            - name: COGNEVA_GITOPS_ENABLED
              value: "true"
            - name: COGNEVA_GITOPS_REPO_URL
              value: "/host-git"
            - name: COGNEVA_CLUSTER_NAME
              value: "main"
            - name: COGNEVA_GITOPS_METRICS_URL
              value: "http://localhost:8080/metrics"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            - name: deploy-key
              mountPath: /etc/cogneva-keys
              readOnly: true
            - name: git-remote
              mountPath: /host-git
              readOnly: true
            # GitOps 拉取端的 kubectl：k3s 是多调用二进制，argv[0]=kubectl
            # 时就是 kubectl，版本与集群天然一致，零下载（CN 网络 dl.k8s.io
            # 限速到不可用，2026-08-06 实测 1.4KB/s）。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: prompts
          configMap:
            name: cogneva-prompts
            # 空白机首启时 GitOps 拉取端尚未建过该 configmap，置可选
            # 避免主 Pod 卡 FailedMount；建好后挂载自动生效
            optional: true
        - name: deploy-key
          secret:
            secretName: cogneva-deploy-key
            defaultMode: 256
            # 空白机一键部署时该 secret 尚未创建，置为可选避免主 Pod 永远
            # 卡在 FailedMount；GitHub/Gitee 推送是部署后另行配置的能力
            optional: true
        - name: git-remote
          # GitOps 中央 bare 仓库（与进化部署的 git-remote 同一 hostPath，
          # bootstrap 部署前已 seed）。主 Pod 只读克隆/fetch，沙盒推送端读写。
          hostPath:
            path: /var/lib/cogneva-data/git-remote
            type: Directory
        - name: kubectl-bin
          # 宿主 k3s 二进制文件挂载为 Pod 内 kubectl（见 volumeMount 注释）。
          # bootstrap 流程先装 k3s 再部署，文件必然存在。
          hostPath:
            path: /usr/local/bin/k3s
            type: File
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
