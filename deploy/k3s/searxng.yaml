# 网页检索后端（SearXNG）：`web_search` 工具问的就是这个 Service。
#
# 与 chart 的 templates/searxng.yaml 同源，字段级对齐由
# deploy/scripts/check-deploy-parity.sh 校验。这里只有集群内的面：没有 Ingress，
# Service 是 ClusterIP，NetworkPolicy 只放行进化 Pod。
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
data:
  settings.yml: |
    # 只留这台主机连得上的引擎：镜像默认开着的 brave / duckduckgo / google cse /
    # startpage / wikidata / wikipedia 在境内都不可达，每次查询各自等满超时后返回
    # 零条，HTTP 也是 200——那看起来像「网上没有」，其实一条都没问出去。
    #
    # 留下的两家是实测读数：bing 每次 9~10 条、sogou 8~11 条，三条不同查询各约
    # 1 秒。sogou 能出结果依赖这一版镜像的网络层（curl_cffi，默认 Chrome TLS
    # 指纹）；换回 httpx 的旧版会重新出现适配层崩溃。baidu 每次都被判 CAPTCHA
    # （TLS 这一层已解决，卡住它的是出口 IP 信誉），360search 返回零条且不报错，
    # 两家都不留在表里。
    use_default_settings:
      engines:
        keep_only:
          - bing
          - sogou
    engines:
      - name: bing
        disabled: false
        # `www.bing.com` 在境内 302 到 `cn.bing.com`，而这一层不跟这一步，只拿回
        # 302 的空壳（零结果且不报错）；直接问 cn 就绕开了这次跳转。
        base_url: https://cn.bing.com
        # 同一地址走 HTTP/3 拿不回可用响应，切回 HTTP/2。
        enable_http3: false
      - name: sogou
        disabled: false
    general:
      instance_name: "cogneva"
    server:
      limiter: false
      image_proxy: false
      secret_key: "cogneva-cluster-internal-searxng"
    search:
      safe_search: 0
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/component: search
    spec:
      automountServiceAccountToken: false
      securityContext:
        # 镜像默认以 root 起步；977 是镜像里 searxng 那个用户的 uid，写出来
        # runAsNonRoot 才有落点。
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
