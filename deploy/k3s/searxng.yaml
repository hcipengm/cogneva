# 网页检索后端（SearXNG）：`web_search` 工具问的就是这个 Service。
#
# 与 chart 的 templates/searxng.yaml 同源，字段级对齐由
# deploy/scripts/check-deploy-parity.sh 校验。这里只有集群内的面：没有 Ingress，
# Service 是 ClusterIP，NetworkPolicy 只放行进化 Pod。
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
data:
  settings.yml: |
    # 引擎表是按实测选的，不是按镜像默认值。三条读数（2026-11-07 在本部署的
    # 出口上量）：
    #
    # 1. bing 对多词查询只答第一个词。整句查询确实送到了——返回页的标题和搜索
    #    框里是整句——结果却是首词的：`黑神话悟空 混铁棍 怎么获得` 返回「黑
    #    （汉语文字）_百度百科」，`black myth wukong mixed iron staff` 返回
    #    BLACK 的英文词典；更坏的是它偶尔回一批完全无关的页面（同一分钟里拿到
    #    过汇率和一部电影的条目）。单词查询它是好的，但「大部分查询会拿到错误
    #    答案」这件事比「少一个快引擎」贵得多，所以它不在这张表里。
    #
    #    把它放回来的前提是包装层先有判据：`crates/cog-agent/src/web.rs` 里的
    #    `DEGRADED_ENGINES` 会在「命中全部来自它、且查询不止一个词」时改问后备
    #    出口。那条判据随镜像生效，不随这份清单生效——清单先加引擎，就会先有
    #    一天的错误答案。
    # 2. 360search 与 sogou 从这台主机出去是被按 IP 限流的：so.com 直接回「访问
    #    异常页面」，sogou 302 到 antispider 后崩在 `sogou.py` 的
    #    `resp.next_request`（本镜像的响应对象没有这个属性），故障记进
    #    `unresponsive_engines`、零条结果。它们留在表里，是因为没被限流时出的是
    #    整批正确的命中；限流时它们只是沉默，沉默会走「自建沉默 → 后备」那条路。
    # 3. 镜像默认开着的那一群（brave、duckduckgo、google cse、startpage、baidu）
    #    在境内一律不可达：各自超时或「Network is unreachable」，HTTP 仍是 200，
    #    读起来像「网上没有」。
    #
    # 判据：表里每个引擎的沉默都必须是**可归因**的——要么限流、要么不可达，写在
    # 上面；一旦某家每次都崩且不再偶尔答对，就从表里删掉，而不是留着当噪音。
    use_default_settings:
      engines:
        keep_only:
          - 360search
          - sogou
    engines:
      # keep_only 只是留下条目，它们默认仍是关的，必须逐个打开。
      - name: 360search
        disabled: false
        weight: 2
      # sogou 每次 302 都崩在 `sogou.py` 的 `resp.next_request`，故障进
      # `unresponsive_engines`、零条结果。它仍然开着：没被限流时它出的是整批
      # 正确的命中，而那一条假警报的代价小于它答对一次。
      - name: sogou
        disabled: false
        weight: 2
    general:
      instance_name: "cogneva"
    server:
      # 限流与图片代理都不开：本实例只服务集群内一个零凭证的工具调用方，没有对外
      # 的匿名入口要限；图片代理会把外部图片拉过本 Pod，这里没有 UI 需要它。
      limiter: false
      image_proxy: false
      # SearXNG 拒绝在没有这个值时启动。它签的是限流与图片代理两件事的令牌，而这两件
      # 都已关闭，所以它不是凭证：没有任何外部方认它，换掉它只影响本 Pod 自己的内存。
      secret_key: "cogneva-cluster-internal-searxng"
      # JSON 默认不开。`web_search` 读的就是这一面——少了这行，工具每次拿回 403，
      # 错误里会点名这一项。
    search:
      safe_search: 0
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/component: search
  template:
    metadata:
      annotations:
        # searxng-settings 的指纹：只改配置的那次升级也必须换 Pod，否则进程仍按
        # 启动时读到的 settings.yml 跑（文件由 kubelet 就地更新，进程不会重读）。
        checksum/config: a26ca9158029de8c89c51030c174e1041ebfca17f327606f0fa264f94f7f9a8b
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/component: search
    spec:
      automountServiceAccountToken: false
      securityContext:
        # 镜像默认以 root 起步；977 是镜像里 searxng 那个用户的 uid，写出来
        # runAsNonRoot 才有落点。
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: cogneva
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
