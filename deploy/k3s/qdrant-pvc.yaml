apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: cogneva
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-db
  # 卷与密钥一样带卸载保护：重装要接着用同一份状态。
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
