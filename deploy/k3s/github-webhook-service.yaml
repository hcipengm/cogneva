apiVersion: v1
kind: Service
metadata:
  name: cogneva-github-webhook
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cogneva
  ports:
    - name: github-webhook
      port: 9091
      targetPort: 9091
      nodePort: 30991
