# kube-prometheus-stack Helm Values
# 用于 K3s 生产环境部署 16 项 DevOps 可观测性组件
#
# 安装方式:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f kube-prometheus-stack-values.yaml
#
# 商用级别配置：持久化、资源限制、Ingress TLS、多副本、网络隔离

nameOverride: "cog-observability"
fullnameOverride: "cog-observability"

# ─── 全局 ──────────────────────────────────────────────────────────
global:
  rbac:
    create: true
  imagePullSecrets: []

# ─── Namespace ─────────────────────────────────────────────────────
namespaceOverride: "monitoring"

# ─── Prometheus ────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 2
    retention: 30d
    retentionSize: "50GB"
    enableAdminAPI: false
    walCompression: true

    # 资源限制
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # 持久化
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"   # K3s 默认 StorageClass
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # 节点亲和性：尽量分散到不同节点
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - prometheus
              topologyKey: kubernetes.io/hostname

    # 告警规则选择器
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # ServiceMonitor 选择器：监控所有 namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # PodMonitor 选择器
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # 这里**不再**写 `additionalScrapeConfigs`。
    #
    # 两处曾经写在这里、现在各有正经载体，留着第二份只会悄悄指错地方：
    #   - `cogneva` 那份按 `namespaces: [default]` + `app=cogneva` 挑 Pod，而本平台
    #     的网关与进化 Pod 在 `cogneva` 命名空间，指标由 `manifests/04-servicemonitor-cogneva.yaml`
    #     与 `08-servicemonitor-gateway.yaml` 抓。照这份作业装出来的集群，一条
    #     `cogneva_*` 序列都不会有。
    #   - `blackbox-http` 那份把探测地址写成 `cog-observability-blackbox-exporter:9115`，
    #     而清单里那个 Service 叫 `blackbox-exporter`（`manifests/19-blackbox-exporter.yaml`）。
    #     它只在安装面认不出入口形态时才生效——也就是最没人盯着的那台机器上——
    #     届时每一次探测都抓成 DNS 失败：`probe_success` 一条都不产生，而「没有
    #     序列」与「没有断线」在面板上同形。
    #
    # 可达性探针的目标由 `kube-prometheus-stack-values-reachability-<ingress>.yaml`
    # 提供，安装脚本按入口形态二选一，认不出来就不加并明说。那份文件里的探测
    # 地址与模块名有判据盯着（`crates/cogneva/tests/observability_reachability_probe_wiring_test.rs`）。

    # Alertmanager 配置
    alerting:
      alertmanagers:
        - namespace: monitoring
          name: cog-observability-alertmanager
          port: http-web

  # Service
  service:
    type: ClusterIP
    port: 9090

  # Ingress（商用：必须启用 TLS）
  ingress:
    enabled: true
    ingressClassName: traefik   # K3s 默认 IngressClass
    hosts:
      - prometheus.cogneva.local
    paths:
      - /
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.cogneva.local

# ─── Alertmanager ────────────────────────────────────────────────
alertmanager:
  enabled: true

  config:
    global:
      smtp_smarthost: 'mail.example.com:587'
      smtp_from: 'alerts@cogneva.local'
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity', 'team']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-all'
          group_wait: 0s
          repeat_interval: 5m
          continue: true
        - match:
            team: ai
          receiver: 'ai-team'
          continue: true
        - match:
            team: platform
          receiver: 'platform-team'
          continue: true
    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'https://cogneva.local/webhooks/alerts'
            send_resolved: true
      - name: 'critical-all'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#sf-alerts-critical'
            send_resolved: true
        webhook_configs:
          - url: 'https://cogneva.local/webhooks/alerts-critical'
            send_resolved: true
      - name: 'ai-team'
        webhook_configs:
          - url: 'https://cogneva.local/webhooks/alerts-ai'
            send_resolved: true
      - name: 'platform-team'
        webhook_configs:
          - url: 'https://cogneva.local/webhooks/alerts-platform'
            send_resolved: true
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['instance']

  alertmanagerSpec:
    replicas: 2
    retention: 120h

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - alertmanager
              topologyKey: kubernetes.io/hostname

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.cogneva.local
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.cogneva.local

# ─── Grafana ───────────────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: "local-path"
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.cogneva.local
    paths:
      - /
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.cogneva.local

  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  # 数据源配置（与 Helm Chart 集成）
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://cog-observability-prometheus:9090
          isDefault: true
          editable: false
          jsonData:
            manageAlerts: true
            alertmanagerUid: alertmanager
        - name: Loki
          type: loki
          url: http://cog-observability-loki:3100
          editable: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"([^"]+)"'
                url: 'https://jaeger.cogneva.local/trace/${__value.raw}'
        - name: Jaeger
          type: jaeger
          url: http://cog-observability-jaeger-query:16686
          editable: false
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              tags: ['task_id', 'agent_id']

  # Dashboard 自动加载
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        # dashboardsConfigMaps 会把 configmap 挂到 /var/lib/grafana/dashboards/<provider 名>，
        # provider type 必须是 file（Grafana 不识别 configmap 类型）
        - name: 'cogneva'
          orgId: 1
          folder: 'Cogneva'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cogneva
  dashboardsConfigMaps:
    cogneva: "cogneva-dashboards"

  # 默认启用的插件
  plugins:
    - grafana-clock-panel
    - grafana-piechart-panel

# ─── Node Exporter ───────────────────────────────────────────────
# 注意：`resources` 在这个键下**不生效**。chart 91 的 node-exporter 是子 chart，
# 容器资源只读下面那一段 `prometheus-node-exporter.resources`。2026-10-22 实测：
# 把这里的 requests/limits 换成哨兵值（111m）重新 `helm template`，渲染出的
# DaemonSet 里一个都没有，仍是 50m——写法在这里是历史痕迹，真正生效的数值在
# `prometheus-node-exporter:` 段（两处目前数值相同，所以改了也看不出来）。
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─── kube-state-metrics ──────────────────────────────────────────
# 同上：`resources` 在这个键下不生效，子 chart 只读下面的
# `kube-state-metrics.resources`（同一次实测：哨兵值渲染不出来）。
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# KSM 自身的指标（list/watch 错误、分片数）在 8081 的 `metrics` 端口，资源指标在 8080。
# chart 默认只抓 8080，导致 kube-state-metrics 组里 KubeStateMetricsListErrors /
# WatchErrors / ShardingMismatch / ShardsMissing 四条规则引用的序列现网不存在。
# 打开 selfMonitor：Service 暴露 metrics 端口、ServiceMonitor 加同名端点，与 8080
# 共用 job 标签，规则无需改写。
kube-state-metrics:
  selfMonitor:
    enabled: true
  # 与缩配档同一条白名单、同一个理由（那一档写着实测为什么需要它）：默认一个标签都不导出，
  # 「工作负载怎么交付读数」在读数面上不可读；只放交付方式与组件名两把。
  extraArgs:
    - --metric-labels-allowlist=pods=[app.kubernetes.io/component,cogneva.io/readings-delivery]

# ─── prometheus-node-exporter ────────────────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # 200m → 500m：理由与缩配档同一份（那一档写着实测 0.399 的 CFS 周期被限流、
      # 而瓶颈是每 15 秒一次的采集突发而不是平均算力）。两档同一个数，免得换了档
      # 才在监控栈上重新遇见同一个限流。
      cpu: 500m
      memory: 256Mi
  prometheus:
    monitor:
      # 节点身份必须由这一面带出来。2026-10-22 实测：node-exporter 的
      # node_filesystem_* 序列上只有 device / fstype / instance / job / mountpoint
      # 加抓取侧那几枚标签，**没有 node**。于是凡是按节点写的规则都静默走形：
      # `max by (node)` 把标签集收敛成空、摘要里的 {node} 原样落进行里（一行不点名的
      # 告警），而 `unless on(node)` 左边没有 node 可匹配，永远压不住右边——磁盘过线时
      # 照样报「kubelet 一小时没回收」。这不是规则写错，是这一面没把身份带出来。
      # K8s 自己就有这个身份：endpoints 角色默认不挂 pod 的 nodeName，要
      # attachMetadata.node=true 才给，再抄成 node 标签。
      attachMetadata:
        node: true
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

# ─── prometheusOperator ──────────────────────────────────────────
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  admissionWebhooks:
    patch:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ─── defaultRules ────────────────────────────────────────────────
defaultRules:
  create: true
  disabled:
    # Prometheus 3 删掉了聚合计数器 prometheus_sd_refresh_failures_total，上游模板
    # 仍引用它（91.5.2 与 main 都未修），这条规则因此永远不触发。关掉 chart 里那条，
    # 由下面的 additionalPrometheusRulesMap 按现网真有的
    # prometheus_sd_kubernetes_failures_total 重写同名规则。
    PrometheusSDRefreshFailure: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ─── 补回被关掉的规则 ─────────────────────────────────────────────
# 只放需要重写的规则；其余默认规则保持 chart 原样。与缩配档同一条规则、同一个理由。
additionalPrometheusRulesMap:
  cogneva-prometheus-self:
    groups:
      - name: cogneva-prometheus-self
        rules:
          - alert: PrometheusSDRefreshFailure
            expr: |-
              increase(prometheus_sd_kubernetes_failures_total{job="cog-observability-prometheus",namespace="monitoring"}[10m]) > 0
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: Failed Prometheus SD refresh.
              description: Prometheus {{$labels.namespace}}/{{$labels.pod}} has failed to refresh Kubernetes service discovery.
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheussdrefreshfailure
