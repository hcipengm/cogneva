# kube-prometheus-stack 缩配 Values —— 单节点 4C/7.5Gi、兼跑构建的本机可落地版本
#
# 与商用全量版（kube-prometheus-stack-values.yaml）的差异：
#   - Prometheus 单副本、保留 7 天 / 8Gi、内存上限 1.5Gi（全量版是双副本 30 天 / 50GB / 4Gi）
#   - alertmanager 关闭：本机没有告警出口（无 SMTP/Slack），装了也是空转；
#     上生产有告警渠道后按全量版打开
#   - 不配 loki / jaeger 数据源（日志与链路追踪本轮不部署）
#   - 不挂 grafana 插件（启动时要去 grafana.com 下载，国内网络不稳定）
#   - ingress 对象一律不在 values 里开，统一由 deploy/k3s/ingress.yaml 与
#     manifests/07-ingress-monitoring.yaml 管理（ingress-nginx 作为 ingressClass）
#   - k3s 不暴露 etcd/controller-manager/scheduler/proxy 指标，关掉对应服务发现
#     避免 Targets 页面出现成片 DOWN；coredns 同理（k3s 未开 prometheus 插件）
#
# 安装方式见 scripts/install.sh（--profile small）。

nameOverride: "cog-observability"
fullnameOverride: "cog-observability"

namespaceOverride: "monitoring"

# ─── Prometheus ────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: "8GiB"   # CRD 正则要求带 B 后缀
    walCompression: true

    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # 拾取任意命名空间的 ServiceMonitor / PodMonitor / PrometheusRule
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}

    # 可达性探针的抓取配置不在这里，而在 `kube-prometheus-stack-values-reachability-*.yaml`
    # 两份二选一的文件里：探针目标有一半由入口形态决定（traefik 还是 ingress-nginx），
    # 而静态目标不会判断"这个地址在我这台机器上该不该存在"——选错就是一条 probe_success=0，
    # 与真断线同形。选哪一份由安装面按 IngressClass 决定（install.sh 的
    # resolve_reachability_values）；认不出来时不加，并明说入口可达性没有目标。
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false

# ─── Alertmanager（本机关闭）──────────────────────────────────────
alertmanager:
  enabled: false

# ─── Grafana ───────────────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1

  # 384Mi 是 chart 的 small 档默认值，而 grafana 的稳态工作集已经爬到 300MiB 上下：
  # 24 小时内工作集对上限的比值在 0.52–0.80 之间，正是那条告警判据的带内。它自己被杀
  # 只是丢面板，但同一条规则同时看着 clickhouse——把一半的余量留给「还没发生的突发」
  # 比省下 384Mi 的额度值。full 档的 512Mi 不动：同一份工作集在那里只占 0.59。
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 768Mi

  persistence:
    enabled: true
    storageClassName: "local-path"
    accessModes: ["ReadWriteOnce"]
    size: 2Gi

  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  # 匿名只读：WebUI 的每张读数卡都要能"点开看这一段是怎么来的"，而点过去撞登录
  # 墙等于这条链接不存在——读者要么放弃，要么被引导去记一个管理员口令，后者更糟。
  #
  # 只给 Viewer：匿名看得见图，改不了任何东西。登录表单保留，编辑仍要账号。这是
  # 一份取舍，不是默认值：匿名可读意味着任何能到达入口的人都能读集群指标，所以
  # 入口本身按内网对待；如果将来这个入口对外，这一条要连同入口一起重新决定，
  # 而不是只把这里关掉。
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: 'Main Org.'
      org_role: 'Viewer'
    auth:
      disable_login_form: false

  ingress:
    enabled: false

  # sidecar 自动注入本 chart 的 Prometheus 数据源，无需手写
  sidecar:
    dashboards:
      enabled: false

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        # dashboardsConfigMaps 会把 configmap 挂到 /var/lib/grafana/dashboards/<provider 名>，
        # 因此这里 type 必须是 file（Grafana 不认识 configmap 类型）
        - name: 'cogneva'
          orgId: 1
          folder: 'Cogneva'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cogneva
  dashboardsConfigMaps:
    cogneva: "cogneva-dashboards"

# ─── node-exporter / kube-state-metrics ───────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      # 200m → 500m：这一格 2026-10-23 实测 **0.399 的 CFS 周期被限流**，而平均用量
      # 只有几十毫核——它的工作是每 15 秒一次把整台宿主的采集器全跑一遍，是一段短突发，
      # 而配额是按 100ms 周期发的，突发形状而不是算力才是瓶颈。被削掉的是**读数本身**：
      # 这台主机的 node_filesystem_* / node_pressure_* 都从这里来，限流一多，宿主读数
      # 就慢半拍甚至缺样本，而宿主读数正是资源面与持久化面的输入。抬到 500m 是同族
      # （redis-info-exporter、claim-store、registry）同一条处置：按一个周期内的突发定，
      # 不按均值定。它不在 cogneva 命名空间，不受该命名空间的 limits.cpu 配额约束。
      cpu: 500m
      memory: 128Mi
  prometheus:
    monitor:
      # 节点身份必须由这一面带出来。2026-10-22 实测：node-exporter 的
      # node_filesystem_* 序列上只有 device / fstype / instance / job / mountpoint
      # 加抓取侧那几枚标签，**没有 node**。于是凡是按节点写的规则都静默走形：
      # `max by (node)` 把标签集收敛成空、摘要里的 {node} 原样落进行里（一行不点名的
      # 告警），而 `unless on(node)` 左边没有 node 可匹配，永远压不住右边——磁盘过线时
      # 照样报「kubelet 一小时没回收」。这不是规则写错，是这一面没把身份带出来。
      # K8s 自己就有这个身份：endpoints 角色默认不挂 pod 的 nodeName，要
      # attachMetadata.node=true 才给，再抄成 node 标签。instance 不能用：它是
      # 「IP:端口」的抓取地址，不是节点（本仓 node_disk_usage_* 那族暂时靠它区分节点，
      # 但一换端口或改抓取方式就断，node 才是 K8s 认的那个名字）。
      attachMetadata:
        node: true
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

kube-state-metrics:
  # KSM 把「自己」的指标（list/watch 错误、分片数）放在 8081 的 `metrics` 端口，
  # 资源指标才在 8080。chart 默认只抓 8080，于是 kube-state-metrics 规则组里
  # KubeStateMetricsListErrors / WatchErrors / ShardingMismatch / ShardsMissing
  # 四条引用的序列在现网一个都没有——不是规则写错，是那一面没被采集。
  # selfMonitor 打开后 Service 暴露 `metrics` 端口、ServiceMonitor 多一个同名端点，
  # 与 8080 共用同一个 job 标签，四条规则无需改写。
  selfMonitor:
    enabled: true
  # kube-state-metrics 默认**一个标签都不导出**：`kube_pod_labels` 这一族按
  # `--metric-labels-allowlist` 白名单产出，名单为空时整个度量族不存在（实测这台集群
  # `count(kube_pod_labels)` 是空集）。于是「某个工作负载声明自己的读数怎么交付」这件事
  # 在读数面上根本不可读。
  # 只放两把：交付方式（`cogneva.io/readings-delivery`，进程采集器声明 push，因为它
  # 没有 /metrics），与组件名（`app.kubernetes.io/component`）。组件名是稳定的主体维——
  # Pod 名随每次滚动换新，按它归并会把一个持续状况报成每次滚动一条新告警。
  # 不放开 `*`：那会把每个 Pod 的全部标签展开成基数。
  extraArgs:
    - --metric-labels-allowlist=pods=[app.kubernetes.io/component,cogneva.io/readings-delivery]
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ─── prometheusOperator ──────────────────────────────────────────
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  admissionWebhooks:
    patch:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ─── k3s 组件服务发现 ────────────────────────────────────────────
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ─── 告警/记录规则 ────────────────────────────────────────────────
# 全量保留：规则只是 ConfigMap，被停用的组件（etcd 等）对应规则自然无数据
defaultRules:
  create: true
  rules:
    # 本档不装 Alertmanager，而 chart 的 alertmanager 规则组整组看的是 `alertmanager_*`
    # 指标：留着它们，等于给一个按设计不存在的组件装一套守卫，读数上永远落成
    # 「组件不在」的缺陷（9 条里 6 条）。平台的告警投递面是进程内规则求值＋`alerts`
    # 表＋WebUI（见下面 PrometheusNotConnectedToAlertmanagers 的注释），不靠
    # Alertmanager；所以退役这组规则，而不是为它补一个第二个投递链。
    # 上全量档（PROFILE=full，真的有 Alertmanager）时这张表不生效，规则照常出现。
    alertmanager: false
  disabled:
    # Prometheus 3 删掉了聚合计数器 prometheus_sd_refresh_failures_total，上游模板
    # 仍引用它（91.5.2 与 main 都未修），这条规则因此永远不触发。关掉 chart 里那条，
    # 由下面的 additionalPrometheusRulesMap 按现网真有的
    # prometheus_sd_kubernetes_failures_total 重写同名规则。
    PrometheusSDRefreshFailure: true
    # 这一档不装 Alertmanager，于是 chart 里「没接到 Alertmanager」那条规则
    # 从安装第一秒起就为真、永远在响——它报的不是故障，是本档的设计。真正该问的
    # 是「Prometheus 求值出来的告警有没有到人手上」：本仓的 PrometheusRule 规则
    # 都带 `cogneva_io_managed="true"`，平台进程每拍把它们抄进 `alerts` 表
    # （`observability.infra_watch.mirror_alerts`），WebUI 的告警面读的正是这张表。
    # chart 自带的其余告警不抄（没这个标签），所以「第三方规则没有投递」这件事
    # 在这一档仍然是事实——只是不该由一条恒红的规则来说。上全量档（有真的
    # Alertmanager 与接收端）时删掉这一行。
    PrometheusNotConnectedToAlertmanagers: true
    # 同一件事的另外三条：Prometheus 侧「把告警发给 Alertmanager」的计数器与队列
    # 在没有投递目标时根本不注册，规则引用不到任何序列——它们报的是本档的设计，
    # 不是故障。退役规则，不在台账里把它们记成缺陷。
    PrometheusErrorSendingAlertsToAnyAlertmanager: true
    PrometheusErrorSendingAlertsToSomeAlertmanagers: true
    PrometheusNotificationQueueRunningFull: true

# ─── 休眠理由：装得上、却不可能触发的上游规则 ─────────────────────
#
# 一条规则加载成功不等于它能触发：它引用的序列在本档里一条都不存在，表达式
# 永远求不出 true。睡觉本身不是缺陷——守着一个本档没有的对象的规则，正确地
# 睡着——但这个判断得写下来，否则「这条规则没响是因为没事」与「因为它根本
# 不可能响」在读数上逐字同形。
#
# 为什么写在这里、而不是另立一张登记表：这些规则是上游 chart 的默认规则组，
# 我们只通过本文件决定它们的去留（上面 defaultRules）。理由写在它们去留的
# 同一个文件里，改规则的人本来就要碰这里；而一条规则若被上游改名或删掉，
# 这张 map 的键还在——那种漂移由读到它的那扇门点名，不靠人记。
#
# reason 取闭集：object_absent / component_absent / feature_off / collector_off /
# exporter_version / series_renamed / known_defect / lazy_counter / error_only_state /
# code_not_deployed。why 一句话说清「凭什么此刻不可能触发、什么时候会醒」。
# 缺席的**名字**不写在这里：它是每一拍从规则选择子减去现网名字面算出来的，
# 抄一遍就是把机器算好的值手打一次，打错了不会有任何一排红。
cognevaDormancy:
  # --- collector_off（2 条）
  NodeSystemdServiceCrashlooping:
    reason: collector_off
    why: "The systemd collector is the one opt-in collector among the three: node_scrape_collector_success has no series for it at all, and enabling it needs --collector.systemd plus the host dbus socket mounted into the pod. Turning it on can make node-exporter fail to start, so it is a deployment decision, not a flip."
  NodeSystemdServiceFailed:
    reason: collector_off
    why: "Same opt-in collector as NodeSystemdServiceCrashlooping; absent from node_scrape_collector_success means it was never asked to run."
  # --- error_only_state（2 条）
  KubeNodeUnreachable:
    reason: error_only_state
    why: "kube-state-metrics exports one series per taint, so this family is empty while no node carries one -- and the exporter is demonstrably up, because kube_node_spec_unschedulable from the same node spec collector reads 1 here. Absent is the state, not the collector: the taint that makes a node unreachable is what creates the series, and the rule reads it from that moment."
  KubePodNotReady:
    reason: error_only_state
    why: "kube_pod_status_reason is exported per reason only while a pod carries one (SchedulingGated et al.); no series means no pod is gated, and the unless clause then excludes nothing while the rule still fires on its phase/ready side."
  # --- exporter_version（3 条）
  KubeJobNotCompleted:
    reason: exporter_version
    why: "kube-state-metrics v2 dropped the kube_*_labels families; kube_job_info carries only allowlisted labels, which are off. The name appears only inside an unless clause, so its absence does not stop the rule from firing: it only makes the label_excluded_from_alerts opt-out inert. Restore by widening the allowlist and rewriting the clause to kube_job_info."
  KubePersistentVolumeFillingUp:
    reason: exporter_version
    why: "Same removed family as KubeJobNotCompleted, and again only inside an unless clause, so filling-volume alerts still fire; the opt-out is inert until the allowlist carries the label and the clause reads kube_persistentvolumeclaim_info."
  KubePersistentVolumeInodesFillingUp:
    reason: exporter_version
    why: "Same removed family and same unless-only position as KubePersistentVolumeFillingUp; the inode rule fires, its opt-out does not."
  # --- feature_off（7 条）
  KubeletClientCertificateExpiration:
    reason: feature_off
    why: "The certificate-manager family exists only while kubelet runs with --rotate-certificates; k3s leaves it off, so this is a config gap, not an upstream removal. Enabling rotation would expose it."
  KubeletClientCertificateRenewalErrors:
    reason: feature_off
    why: "Same certificate-manager gate: emitted only with --rotate-certificates enabled."
  KubeletServerCertificateExpiration:
    reason: feature_off
    why: "Same certificate-manager gate: emitted only with server certificate rotation enabled."
  KubeletServerCertificateRenewalErrors:
    reason: feature_off
    why: "Same certificate-manager gate: emitted only with server certificate rotation enabled."
  PrometheusRemoteStorageFailures:
    reason: feature_off
    why: "No remote_write is configured, so the remote-storage queue never registers its counters."
  PrometheusRemoteWriteBehind:
    reason: feature_off
    why: "No remote_write target exists; there is no queue head to fall behind the tip."
  PrometheusRemoteWriteDesiredShards:
    reason: feature_off
    why: "No remote_write target exists; shard sizing only runs once remote write is configured."
  # --- lazy_counter（1 条）
  KubeNodeEviction:
    reason: lazy_counter
    why: "kubelet_evictions is an ALPHA counter labelled by eviction_signal, created on the first increment; no series means no eviction happened, and the rule fires as soon as one does. Not removed upstream."
  # --- object_absent（6 条）
  KubeHpaMaxedOut:
    reason: object_absent
    why: "No HorizontalPodAutoscaler exists in the cluster; correct dormancy, the rule wakes when one is created."
  KubeHpaReplicasMismatch:
    reason: object_absent
    why: "No HorizontalPodAutoscaler exists; the replica mismatch this rule guards cannot occur."
  KubePdbNotEnoughHealthyPods:
    reason: object_absent
    why: "No PodDisruptionBudget exists; correct dormancy, the rule wakes when one is created."
  NodeBondingDegraded:
    reason: object_absent
    why: "The bonding collector is enabled by default in node-exporter and this host runs it -- node_scrape_collector_success{collector=\"bonding\"} reads 0 because the host has no /proc/net/bonding at all, not because the collector is off. No bond device exists, so the family is empty; it is exported as soon as a bond is created and the rule then reads it."
  NodeRAIDDegraded:
    reason: object_absent
    why: "The mdadm collector is enabled by default and reads success=1 on this host; /proc/mdstat lists the personalities but no arrays, so the family is legitimately empty. Create an array and the series appear."
  NodeRAIDDiskFailure:
    reason: object_absent
    why: "Same collector and same reason as NodeRAIDDegraded: mdadm runs (success=1) and exports per-disk state once an array exists; this host has none."

# ─── 补回被关掉的规则 ─────────────────────────────────────────────
# 只放需要重写的规则；其余默认规则保持 chart 原样。
additionalPrometheusRulesMap:
  cogneva-prometheus-self:
    groups:
      - name: cogneva-prometheus-self
        rules:
          - alert: PrometheusSDRefreshFailure
            # 本集群的服务发现只有 Kubernetes 一种机制（ServiceMonitor/PodMonitor），
            # 所以聚合计数器换成它的按机制对应物即可；window/for 沿用 chart 原值。
            # 注意同组已有一条 PrometheusKubernetesListWatchFailures 读同一个计数器
            # （5m/15m）：两条都留是有意的——一条是列表/监听失败，一条是刷新失败，
            # 都落在同一次 SD 坏掉上；若要只留一条，删本条。
            expr: |-
              increase(prometheus_sd_kubernetes_failures_total{job="cog-observability-prometheus",namespace="monitoring"}[10m]) > 0
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: Failed Prometheus SD refresh.
              description: Prometheus {{$labels.namespace}}/{{$labels.pod}} has failed to refresh Kubernetes service discovery.
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheussdrefreshfailure
