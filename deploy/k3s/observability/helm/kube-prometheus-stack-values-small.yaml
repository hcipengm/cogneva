# kube-prometheus-stack 缩配 Values —— 单节点 4C/7.5Gi、兼跑构建的本机可落地版本
#
# 与商用全量版（kube-prometheus-stack-values.yaml）的差异：
#   - Prometheus 单副本、保留 7 天 / 8Gi、内存上限 1.5Gi（全量版是双副本 30 天 / 50GB / 4Gi）
#   - alertmanager 关闭：本机没有告警出口（无 SMTP/Slack），装了也是空转；
#     上生产有告警渠道后按全量版打开
#   - 不配 loki / jaeger 数据源（日志与链路追踪本轮不部署）
#   - 不挂 grafana 插件（启动时要去 grafana.com 下载，国内网络不稳定）
#   - ingress 对象一律不在 values 里开，统一由 deploy/k3s/ingress.yaml 与
#     manifests/07-ingress-monitoring.yaml 管理（ingress-nginx 作为 ingressClass）
#   - k3s 不暴露 etcd/controller-manager/scheduler/proxy 指标，关掉对应服务发现
#     避免 Targets 页面出现成片 DOWN；coredns 同理（k3s 未开 prometheus 插件）
#
# 安装方式见 scripts/install.sh（--profile small）。

nameOverride: "cog-observability"
fullnameOverride: "cog-observability"

namespaceOverride: "monitoring"

# ─── Prometheus ────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: "8GiB"   # CRD 正则要求带 B 后缀
    walCompression: true

    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # 拾取任意命名空间的 ServiceMonitor / PodMonitor / PrometheusRule
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false

# ─── Alertmanager（本机关闭）──────────────────────────────────────
alertmanager:
  enabled: false

# ─── Grafana ───────────────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1

  # 384Mi 是 chart 的 small 档默认值，而 grafana 的稳态工作集已经爬到 300MiB 上下：
  # 24 小时内工作集对上限的比值在 0.52–0.80 之间，正是那条告警判据的带内。它自己被杀
  # 只是丢面板，但同一条规则同时看着 clickhouse——把一半的余量留给「还没发生的突发」
  # 比省下 384Mi 的额度值。full 档的 512Mi 不动：同一份工作集在那里只占 0.59。
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 768Mi

  persistence:
    enabled: true
    storageClassName: "local-path"
    accessModes: ["ReadWriteOnce"]
    size: 2Gi

  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: false

  # sidecar 自动注入本 chart 的 Prometheus 数据源，无需手写
  sidecar:
    dashboards:
      enabled: false

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        # dashboardsConfigMaps 会把 configmap 挂到 /var/lib/grafana/dashboards/<provider 名>，
        # 因此这里 type 必须是 file（Grafana 不认识 configmap 类型）
        - name: 'cogneva'
          orgId: 1
          folder: 'Cogneva'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cogneva
  dashboardsConfigMaps:
    cogneva: "cogneva-dashboards"

# ─── node-exporter / kube-state-metrics ───────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      # 200m → 500m：这一格 2026-10-23 实测 **0.399 的 CFS 周期被限流**，而平均用量
      # 只有几十毫核——它的工作是每 15 秒一次把整台宿主的采集器全跑一遍，是一段短突发，
      # 而配额是按 100ms 周期发的，突发形状而不是算力才是瓶颈。被削掉的是**读数本身**：
      # 这台主机的 node_filesystem_* / node_pressure_* 都从这里来，限流一多，宿主读数
      # 就慢半拍甚至缺样本，而宿主读数正是资源面与持久化面的输入。抬到 500m 是同族
      # （redis-info-exporter、claim-store、registry）同一条处置：按一个周期内的突发定，
      # 不按均值定。它不在 cogneva 命名空间，不受该命名空间的 limits.cpu 配额约束。
      cpu: 500m
      memory: 128Mi
  prometheus:
    monitor:
      # 节点身份必须由这一面带出来。2026-10-22 实测：node-exporter 的
      # node_filesystem_* 序列上只有 device / fstype / instance / job / mountpoint
      # 加抓取侧那几枚标签，**没有 node**。于是凡是按节点写的规则都静默走形：
      # `max by (node)` 把标签集收敛成空、摘要里的 {node} 原样落进行里（一行不点名的
      # 告警），而 `unless on(node)` 左边没有 node 可匹配，永远压不住右边——磁盘过线时
      # 照样报「kubelet 一小时没回收」。这不是规则写错，是这一面没把身份带出来。
      # K8s 自己就有这个身份：endpoints 角色默认不挂 pod 的 nodeName，要
      # attachMetadata.node=true 才给，再抄成 node 标签。instance 不能用：它是
      # 「IP:端口」的抓取地址，不是节点（本仓 node_disk_usage_* 那族暂时靠它区分节点，
      # 但一换端口或改抓取方式就断，node 才是 K8s 认的那个名字）。
      attachMetadata:
        node: true
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

kube-state-metrics:
  # KSM 把「自己」的指标（list/watch 错误、分片数）放在 8081 的 `metrics` 端口，
  # 资源指标才在 8080。chart 默认只抓 8080，于是 kube-state-metrics 规则组里
  # KubeStateMetricsListErrors / WatchErrors / ShardingMismatch / ShardsMissing
  # 四条引用的序列在现网一个都没有——不是规则写错，是那一面没被采集。
  # selfMonitor 打开后 Service 暴露 `metrics` 端口、ServiceMonitor 多一个同名端点，
  # 与 8080 共用同一个 job 标签，四条规则无需改写。
  selfMonitor:
    enabled: true
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ─── prometheusOperator ──────────────────────────────────────────
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  admissionWebhooks:
    patch:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ─── k3s 组件服务发现 ────────────────────────────────────────────
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ─── 告警/记录规则 ────────────────────────────────────────────────
# 全量保留：规则只是 ConfigMap，被停用的组件（etcd 等）对应规则自然无数据
defaultRules:
  create: true
  disabled:
    # Prometheus 3 删掉了聚合计数器 prometheus_sd_refresh_failures_total，上游模板
    # 仍引用它（91.5.2 与 main 都未修），这条规则因此永远不触发。关掉 chart 里那条，
    # 由下面的 additionalPrometheusRulesMap 按现网真有的
    # prometheus_sd_kubernetes_failures_total 重写同名规则。
    PrometheusSDRefreshFailure: true
    # 这一档不装 Alertmanager，于是 chart 里「没接到 Alertmanager」那条规则
    # 从安装第一秒起就为真、永远在响——它报的不是故障，是本档的设计。真正该问的
    # 是「Prometheus 求值出来的告警有没有到人手上」：本仓的 PrometheusRule 规则
    # 都带 `cogneva_io_managed="true"`，平台进程每拍把它们抄进 `alerts` 表
    # （`observability.infra_watch.mirror_alerts`），WebUI 的告警面读的正是这张表。
    # chart 自带的其余告警不抄（没这个标签），所以「第三方规则没有投递」这件事
    # 在这一档仍然是事实——只是不该由一条恒红的规则来说。上全量档（有真的
    # Alertmanager 与接收端）时删掉这一行。
    PrometheusNotConnectedToAlertmanagers: true

# ─── 补回被关掉的规则 ─────────────────────────────────────────────
# 只放需要重写的规则；其余默认规则保持 chart 原样。
additionalPrometheusRulesMap:
  cogneva-prometheus-self:
    groups:
      - name: cogneva-prometheus-self
        rules:
          - alert: PrometheusSDRefreshFailure
            # 本集群的服务发现只有 Kubernetes 一种机制（ServiceMonitor/PodMonitor），
            # 所以聚合计数器换成它的按机制对应物即可；window/for 沿用 chart 原值。
            # 注意同组已有一条 PrometheusKubernetesListWatchFailures 读同一个计数器
            # （5m/15m）：两条都留是有意的——一条是列表/监听失败，一条是刷新失败，
            # 都落在同一次 SD 坏掉上；若要只留一条，删本条。
            expr: |-
              increase(prometheus_sd_kubernetes_failures_total{job="cog-observability-prometheus",namespace="monitoring"}[10m]) > 0
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: Failed Prometheus SD refresh.
              description: Prometheus {{$labels.namespace}}/{{$labels.pod}} has failed to refresh Kubernetes service discovery.
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheussdrefreshfailure
