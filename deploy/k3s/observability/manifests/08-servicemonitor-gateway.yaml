# ServiceMonitor — 让 Prometheus 抓安全网关的上游池指标。
# 网关是上游池健康的唯一掌握者：llm_upstream_healthy / llm_pool_available /
# llm_pool_evidenced_recovery_unix / llm_pool_next_attempt_unix 只在这里产生，
# 主应用 Service 抓不到。后两条分开：前者是上游报告的配额恢复时刻（证据），
# 后者是我们自己的退避重试节拍，合起来看会分不出被画出来的是哪种。
# 抓的是专用观测通道（9090）：该通道只挂 /health/* 与 /metrics，不含代理路由，
# NetworkPolicy 只为它放行 monitoring 命名空间；8080/8081 会注入真上游凭证，
# 不能对监控侧开放。与主应用共用的 04-servicemonitor 分开一份，避免给不含
# 该端口的 Service 挂错端点。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cogneva-gateway-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - cogneva
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
