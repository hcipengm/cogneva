# Grafana 管理员密码 Secret 不在这里声明。
#
# 它必须是安装时随机生成、且重装/升级不覆盖的：写成清单里的字面量会把密码
# 提交进仓库（历史清不掉，等于长期公开），写成空值则每次 apply 都会把已生效
# 的密码清掉。两条路都不行，所以这个 Secret 由 install.sh 的
# ensure_grafana_admin_credentials 创建（已存在则保留），密码落一份 600 权限
# 的本地文件而不是日志；轮换用 scripts/rotate-grafana-password.sh。
---
# Alertmanager Slack Webhook Secret
# 部署前替换 ${SLACK_WEBHOOK_URL} 为实际值
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
type: Opaque
stringData:
  url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
