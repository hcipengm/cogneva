# Grafana 管理员密码 Secret
# 生成方式: kubectl create secret generic grafana-admin-credentials \
#   --from-literal=admin-user=admin \
#   --from-literal=admin-password=$(openssl rand -base64 20) \
#   -n monitoring
#
# 已换为随机强密码；再次上生产或对外暴露前请轮换。

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "D3alinLE1KG3Y53Vm0VmADf9"
---
# Alertmanager Slack Webhook Secret
# 部署前替换 ${SLACK_WEBHOOK_URL} 为实际值
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
type: Opaque
stringData:
  url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
