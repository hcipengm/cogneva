# 宿主读数通道自己的三条告警。
#
# 为什么需要：把各面的生产者并到一个端点之后，`up` 只答聚合器还在不在，某一面的生产者
# 死掉时它的序列会停在最后一次的值上，看上去仍然新鲜——这正是「落地≠生效」自己的病。
# 生产者每拍自报的两条判活（`host_reading_producer_up`、`host_reading_producer_unreadable`）
# 因此需要有人读，而且**必须分成两条告警**：一条是「生产者坏了」，一条是「它跑得成但输入
# 读不到」。合成一条的话，脚本崩了与账本文件没生成会被当成同一件事，而修法完全不同。
#
# 第三条盯通道本身：整个单元死了，上面两条都无从触发——没有样本就没有告警，
# 这正是「缺席不会告警」的经典形状，所以通道要单独判 `up`。
#
# 每条规则都带 `cogneva_io_managed: "true"`：这份文件里的告警由 Prometheus 自己
# 求值，而这一档没有 Alertmanager，求值出来只有 `ALERTS` 那一面看得见。平台进程每拍
# 把带这个标签的 firing 告警抄进 `alerts` 表（`observability.infra_watch.mirror_alerts`），
# 告警面读的正是那张表。**摘掉这个标签等于把这条规则从投递名单里摘掉**——它照样会亮，
# 但没有人会被告诉。门在 `observability_alert_rule_contract_test`：
# `every_manifest_alert_is_marked_for_the_mirror`。
#
# 每条规则还带 `cogneva_io_face`：这条规则判的是**哪个面**的事，值取面主表里的面名原样。
# 标签随告警行整份流进 `alerts.labels`，所以「这一行响了该谁动」在行上就答得出来，不需要
# 第二张「规则 → 面」的连接表——那玩意儿加规则的人永远不记得去补，缺的形态还是「新规则
# 永远没有面」，而且在表上看不出来。面主换了不用改任何一条规则：这一跳是「规则 → 面」，
# 而「面 → 人」由读取方在面主表上 join。
#
# 为什么把这一格当成投递的一部分而不是文档里的说明：告警链的五环里，前四环（读数、产出者、
# 消费者、判据）都有机器可读的答案，只有第五环「归谁」没有。2026-10-23 实测：表里正 firing
# 十一行、`acknowledged_at` 全空、最老一行开了 5550 分钟，而 `last_seen_at` 都在半分钟内——
# 写者还在看，是人没看。缺的不是一个提醒，是「该谁看」这个问题在系统里根本没有答案。
#
# 门在 `deploy/scripts/check-alert-rule-faces.sh`：带 `cogneva_io_managed` 的规则缺面即红。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cogneva-host-readings
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cogneva-host-readings
      rules:
        # 生产者死了：它在窗口内每一拍都没跑成（超时、崩溃、脚本不在）。
        # 10 分钟＝十拍，够长到不会被一次重装或一次换机器误报。
        - alert: CognevaHostReadingProducerDown
          expr: host_reading_producer_up == 0
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主读数生产者 {{ $labels.producer }} 没跑成"
            description: "它每拍都超时/崩溃；这一面的序列停在最后一次的值上，不能当当前读数用。"

        # 生产者活着但读不到输入：它这一拍一条序列都没发。这不是生产者坏了，是上游
        # （账本、集群、仓库）读不到——修的位置完全不同。
        - alert: CognevaHostReadingProducerUnreadable
          expr: host_reading_producer_unreadable == 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主读数生产者 {{ $labels.producer }} 读不到输入"
            description: "它跑得成，但没有发出任何序列：上游读不到，别去改生产者的代码。"

        # 读数有了判据、抓取面上却一条序列都没有。这一格与上面两条不同：那两条
        # 判的是「宿主脚本跑没跑成」，这一条判的是「读数点名的指标，抓取面上一
        # 条样本都没有」——对象在、配置也在，就是没人发。面板上它是一条空白，
        # 空白与「一切正常」同形，所以必须由规则替它喊。
        - alert: CognevaReadingProducerAbsent
          expr: reading_producer_absent > 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条读数在抓取面上没有生产者"
            description: "`reading_producer_missing` 按读数 id 与指标名点名是哪几条。修法是给它接一条抓取（或把读数指到一条真有生产者的指标上），不是改这条规则。"

        # 整条通道死了：上面两条都没有样本可判，所以这里必单独判 `up`。
        - alert: CognevaHostReadingsEndpointDown
          expr: up{job="cogneva-host-readings"} == 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主读数端点抓不到"
            description: "所有宿主侧面读数同时停更；十环与落地≠生效会各自退化成 absent，而不是变绿。"

    # 上面三条判的是「生产者这一拍跑没跑成」。有一类生产者能在上游停更之后
    # 继续每一拍都跑成：它读的是一份「每拍追加一行」的归档，最后一行永远停在
    # 生前那次判词上。beat 停了以后没有谁写「我停了」，于是 `producer_up` 仍是 1、
    # 判词仍是 `aligned`、输入也读得到——三条规则一条都不会亮，只有最后一行的时间
    # 在往后退。这类「停产」只能按年龄判。
    #
    # 阈值按各自节拍推，而且节拍由生产者发布、不写在这里：两个来源一个 30 分钟一拍、
    # 一个 6 小时一拍，写一个常数要么把慢的那个判成永远在响，要么让快的那个消失一天也
    # 不喊。周期序列缺席时这条规则对那个来源**恒哑**，所以它旁边单立了一条报缺席的规则
    # ——与「从来没有发生过」同一种病：不许用一个默认值把两种状态压成一个。
    - name: cogneva-credential-surface
      rules:
        - alert: CognevaHostCredentialSurfaceStale
          expr: |
            cogneva_host_credential_surface_age_seconds
              > 6 * cogneva_host_credential_surface_period_seconds
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "安全与凭证"
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对停了，最后一条判词是 {{ $value | humanizeDuration }} 以前"
            description: "归档最后一行仍是生前那次判词，所以判词序列看上去一直是 aligned。界是周期序列的 6 倍（现网约 3 小时／36 小时），周期由驱动这一拍的 timer 自己声明。查 `systemctl --user list-timers 'cogneva-*-credential-surface*'`。"

        # 上一条的分母缺席时它自己不响：`aging > 6 * 周期` 在周期那条序列不存在时判不出来。
        # 这正是「恒哑」的形状——一条规则看过去一切正常，而它根本没在判。周期读不出来的原因
        # 通常是 timer 没装（手工跑的机器）或单元名变了，修法在上一条的界之外。
        #
        # 左半边是「这一面在这一拍确实有数据」（`measured == 1`），不是裸 `absent(周期)`：
        # 这台机器上根本没有宿主读数通道时，两条序列都不存在，裸 absent 会每台这样的机器从
        # 装上那天起恒响——而那不叫「读不出节拍」，叫「这一面不在这台机器上」。同组另外几条
        # 对「没有这个目标」都是沉默的（`up{job=…} == 0` 在没有目标时同样为空），这一条跟它们
        # 保持同一种沉默，只在「有判词、却算不出它多久以前」时说话。
        - alert: CognevaHostCredentialSurfaceCadenceUnknown
          expr: |
            cogneva_host_credential_surface_measured == 1
              unless on(source) cogneva_host_credential_surface_period_seconds
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "安全与凭证"
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧读不出节拍，「停了多久」这一条对它判不了"
            description: "判停摆的界是「6 × 周期」，周期来自 timer 的声明。单位不存在、单元名变了、或 systemd-analyze 不可用时这一格缺席。查 `systemctl --user cat cogneva-*-credential-surface*.timer`。"

        # 上一条要「有年龄序列」才判得了：从没跑成过时生产者只发 measured=0、不发年龄，
        # 缺席不会告警。它和「停掉」修法不同——这里是归档不在或只有表头（查单元里的
        # 路径与登记表），那边是定时器停了（查 timer）。两种成因在读数面上都表现为
        # 「没有新判词」，坍成同一个 0 就分不出该去修哪边。
        - alert: CognevaHostCredentialSurfaceNeverRan
          expr: cogneva_host_credential_surface_measured == 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "安全与凭证"
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对从没跑过"
            description: "归档不存在或只有表头：先查单元里的路径与登记表，不要先怀疑定时器。"

        # 上面四条判的都是「这一拍跑了没有、跑成没有」。这一条判的是跑成的那些拍**说了什么**：
        # 生产者把判词拆成三个互不重叠的状态（aligned / drift / unreadable），而 drift 这一格
        # 此前在读数面上有值、没有任何人读——判词序列是给告警用的，不是给 `tail` 用的。
        # 宿主上哪个单元伸手碰了没登记的凭证，只有这一条会喊；它的退出码进了 `--failed`，
        # 而这里没有 systemd 收集器，`--failed` 本身到不了这一面。
        - alert: CognevaHostCredentialSurfaceDrift
          expr: |
            cogneva_host_credential_surface_aligned == 0
              and on(source) cogneva_host_credential_surface_measured == 1
              and on(source) cogneva_host_credential_surface_unreadable == 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "安全与凭证"
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面与登记表不一致"
            description: "门判了、判成不一致：单元里有未登记的凭证指令、登记表点名了不存在的单元、或文件权限与登记表不符。跑 `bash deploy/scripts/check-host-credential-surface.sh . --live` 看逐条点名。"

        # 「没判成」与「判成了不一致」修法完全相反：读不到是快照／门／依赖的问题，不一致是
        # 登记表与单元的问题。合成一条的话，有人会去改登记表，把一个根本没跑起来的检查改绿。
        - alert: CognevaHostCredentialSurfaceUnreadable
          expr: cogneva_host_credential_surface_unreadable == 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "安全与凭证"
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对没读成，这一面当前没有判词"
            description: "门自己出错、快照建不出来、或 systemctl 探针失败。这一面判的是「宿主上哪些进程碰得到凭证」，没读成不等于没事。"

    # 持久化存储面：最近一份**已完成**的备份包是谁写的。
    #
    # 为什么单独成组：备份面此前所有的判据都只读「跑成没跑成」与「演练多旧」，没有一条读
    # 属主。2026-10-20 实测现网：卷根 `drwx------ root root`、最新包 `0:0`/`0600`——包在
    # 那儿，但以应用用户（1001）的身份恢复时连 `ls` 都读不到。这不是备份失败，是恢复那天
    # 才会暴露的失败，所以它必须有一条自己的规则。
    - name: cogneva-backup-package
      rules:
        # 属主不对：包是恢复唯一能读的东西，属主决定「谁能读」。属主 0 一律算错——
        # 平台按 1001 跑，写成 root 的包在恢复时要么读不到，要么得提权和它一起跑。
        - alert: CognevaBackupPackageOwnerWrong
          expr: cogneva_backup_package_owner_uid != 1001
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "持久化存储"
            severity: warning
          annotations:
            summary: "最新一份已完成的备份包属主是 {{ $value }}，不是 1001"
            description: "跑 `bash scripts/host/cogneva-backup-package-owner-reading.sh` 看包名与大小；修法是让备份写端以 1001 落盘（或写完 chown），不是在恢复端提权绕过去。"

        # 读不到：账本或卷问不出来。它与「没有包」修法相反——这一格去修读取路径。
        - alert: CognevaBackupPackageUnreadable
          expr: cogneva_backup_package_reading_state{state="unreadable"} == 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "持久化存储"
            severity: warning
          annotations:
            summary: "备份包属主这一读数读不到（账本或卷问不出来）"
            description: "这一跑什么都没量。先看 postgres-0 能不能 `psql -c 'select 1'`，再看 PVC 的宿主路径在不在。"

        # 没有包：账本里没有一份 outcome=ok 且带包名的备份，或账本点名的包在卷上不存在。
        # 两种情况都意味着「现在没有能恢复的东西」，不是「还没轮到」。
        - alert: CognevaBackupPackageMissing
          expr: cogneva_backup_package_reading_state{state="empty"} == 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "持久化存储"
            severity: warning
          annotations:
            summary: "没有一份已完成的备份包可以恢复"
            description: "账本与卷对不上，或备份从没成功过。两条都先看 `bash scripts/host/cogneva-backup-package-owner-reading.sh` 印的 package= 与原因行。"

        # 包太旧：界沿用持久化面既有的 26 小时（`face-reading-criteria.tsv` 里演练那条同值），
        # 不为这条规则另拍一个数——同一个问题用同一个界，改的时候一起改。
        - alert: CognevaBackupPackageStale
          expr: cogneva_backup_package_age_seconds > 93600
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "持久化存储"
            severity: warning
          annotations:
            summary: "最新一份已完成的备份包已经 {{ $value }} 秒（超过 26 小时）"
            description: "备份定时器没跑、跑失败、或写完了没记账。先看 `cogneva-backup` CronJob 最近的 Job 与 `backup_runs` 最后一行。"

    # 根盘到刹车触发线还有多久。这条线**只能**由宿主自己算：刹车（`host-target-gc`，每 30
    # 分钟一拍）判定用的是 `df` 的 Use%，分母是 used+avail、不含 root 保留块；而
    # node-exporter 的 `1 - avail/size` 分母含保留块。两把尺子的差就是保留块在 size 里的
    # 份额（ext4/xfs 默认 5%，随文件系统类型与 `tune2fs -m` 的设定而变）——它不是常数，
    # 所以按 size 解出来的触发线离刹车真正动手的位置有多远，随每台机器的保留比例变化，
    # 「还有几天」被读短的幅度也随之变化。在 Prometheus 里再算一遍就要么挑一把尺子去逼近
    # 另一把、要么把触发线落错位置。所以规则只读宿主已经算好的天数，不在这里重算。
    - name: cogneva-host-disk-runway
      rules:
        - alert: CognevaHostDiskRunwayShort
          expr: min by (mountpoint) (disk_trend_days_to_trigger_margin) < 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "{{ $labels.mountpoint }} 到构建缓存刹车触发线的余量已经是 {{ $value }} 天（负数＝不够提前期）"
            description: "余量＝宿主算出的「到触发线还剩几天」减去宿主公布的提前期（`disk_trend_trigger_lead_days`），小于 0 就是不够提前量了。提前期是策略输入、不是这里该写死的数：它随「腾地方要多久」变，所以由宿主公布、这条规则只跟 0 比。刹车的触发线在 df 那把尺子上（见宿主读数里的 `used_pct_brake`），触发之后它会开始删构建缓存，所以这条告警给出的是「准备为人腾地方」的提前量，不是「盘要满了」。要看是谁在吃：`bash scripts/host/cogneva-host-footprint-trend-reading.sh`。"

        # 上一条的分母缺席时它自己不响：触发线读不出来（free 序列缺席）就没有
        # `disk_trend_days_to_trigger`，于是「读不出来」与「还有很久」同形。
        # 这一条单独报那一态。整条生产者死掉不在射程内——那由
        # CognevaHostReadingProducerDown 按 producer 名报。
        - alert: CognevaHostDiskTriggerLineUnreadable
          expr: min(disk_trend_trigger_line_readable) == 0
          for: 2h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "根盘的刹车触发线读不出来（缺 free 序列）"
            description: "free 与 avail 差的是 root 保留块；缺了它触发线落不到刹车那把尺子上。查 node-exporter 的 filesystem collector 是否还在发 node_filesystem_free_bytes。"

    # 刹车本身（`host-target-gc`，每 30 分钟一拍的那个回收器）的读数。
    #
    # 为什么单独成组：上面 `cogneva-host-disk-runway` 判的是**盘**往哪走，它答不了
    # 「刹车还在不在踩」。回收器每拍把判词写进 `~/.local/state/cogneva/target-gc.json`，
    # 而那份文件曾经只进 journal、不进读数面——于是三种坏法在 Prometheus 里逐字同形，
    # 都是一条序列也没有：
    #   · timer 停了：脚本不再跑，盘照涨，runway 报的是盘（它说得对，但说不出刹车停了）；
    #   · 跑了但拒绝动手：脚本身份立不住（被改过／不在仓库里）或有进程读不到，两条都
    #     fail-closed 地不删——安全方向对，代价是「什么都没回收」；
    #   · 跑了、每一档都走完，盘仍在地板之上：缓存不是原因。
    # 三条的修法完全不同，所以三条分开，不合并成一个布尔。
    #
    # 阈值一律从生产者发布的周期推（界是「几倍周期」）；周期量不出来时 Stale 那条对它
    # 恒哑，所以旁边单立一条报缺席——与凭证面那组同一个理由。
    - name: cogneva-host-target-gc
      rules:
        - alert: CognevaHostTargetGcStale
          expr: |
            cogneva_host_target_gc_age_seconds
              > 6 * cogneva_host_target_gc_period_seconds
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "宿主构建缓存回收器停了，最后一次运行是 {{ $value | humanizeDuration }} 以前"
            description: "状态文件停在生前那一拍的判词上，所以 outcome 看上去仍然正常。界是周期序列的 6 倍（现网约 3 小时）。查 `systemctl --user list-timers cogneva-host-target-gc.timer` 与 `systemctl --user status cogneva-host-target-gc.service`；盘照涨而刹车没跑，最后一段只能靠 runway 那条提前量兜。"

        # 上一条的分母缺席时它自己不响（`age > 6 * 周期` 在没有周期序列时判不出来）。
        # 左半边仍是「这一拍确实有数据」：这台机器上根本没装宿主读数通道时两条序列都不在，
        # 裸 absent 会从装上那天起恒响——那不叫读不出节拍，叫这一面不在这台机器上。
        # `on()` 空集是刻意的：两侧都不带标签，连接键就是「没有键」；将来谁给其中一侧
        # 加了标签，这一行就必须跟着改，写成裸 `unless` 会把那种错藏起来。
        - alert: CognevaHostTargetGcCadenceUnknown
          expr: |
            cogneva_host_target_gc_measured == 1
              unless on() cogneva_host_target_gc_period_seconds
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "读不出回收器的节拍，「它停了多久」这一条判不了"
            description: "界是「6 × 周期」，周期来自 timer 自己的声明（`systemd-analyze calendar`）。单元名变了、timer 没装、或 systemd-analyze 不可用时这一格缺席。查 `systemctl --user cat cogneva-host-target-gc.timer`。"

        # 从没跑成过：生产者只发 measured=0、不发年龄，缺席不会告警。与「停掉」修法不同——
        # 这里是状态文件不在（查单元里的路径与有没有装过），那边是定时器停了（查 timer）。
        - alert: CognevaHostTargetGcNeverRan
          expr: cogneva_host_target_gc_measured == 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "宿主构建缓存回收器从没跑成过一拍照"
            description: "状态文件不在：先看 `systemctl --user status cogneva-host-target-gc.timer` 与 `deploy/scripts/install-host-target-gc.sh` 有没有在这台机器上跑过，不要先怀疑盘。"

        # 身份立不住：脚本被改过、不在仓库里、或 git 读不出来，它一律不释放（删除不可撤销，
        # 而磁盘等一次提交只要几分钟）。这种运行写出的 outcome 可能是 below_trigger，只看
        # 结局的话与健康逐字同形——所以按身份这一格单独判。
        - alert: CognevaHostTargetGcScriptUnverified
          expr: cogneva_host_target_gc_script_committed == 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "回收器跑的那份脚本不是 HEAD 里的那一份，它拒绝释放任何缓存"
            description: "检出的工作树上有未提交的改动，或有文件被换掉了。回收器比的是 blob 逐字节相等；提交或还原 `deploy/scripts/host-target-gc.sh` 之后下一拍恢复。读数里的 `rev` / `rev_state` 就是它给自己算的身份。"

        # 有进程是「我们的」但读不到属主或工作目录：整轮一个字节都不删（fail-closed）。
        # 与上一条不同——那边是脚本的身份，这边是**进程**的身份，修法在权限上。
        - alert: CognevaHostTargetGcProbeFailed
          expr: cogneva_host_target_gc_outcome{outcome="probe_failed"} == 1
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "有进程读不到属主／工作目录，回收器整轮不释放"
            description: "它判断某棵树是不是被占着时必须认得占着它的进程；认不出就不动（删除不可撤销）。journal 里那一行会点名是哪个 pid、读不到的是什么。"

        # 便宜的三档都走完、盘仍在地板之上：缓存不是这颗盘被填满的原因。这条红的意思是
        # 「去看是谁在吃盘」，不是「缓存没删干净」——所以它与上两条分开。
        - alert: CognevaHostTargetGcFloorUnreachable
          expr: cogneva_host_target_gc_outcome{outcome="floor_unreachable"} == 1
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源泄漏与长稳"
            severity: warning
          annotations:
            summary: "构建缓存已经放到地板之上仍回不去"
            description: "它把它能判的树都放过了，盘依然在地板之上。运行 journal 那一行会说是「缓存不是原因」还是「破坏性的一档被推迟到了 85%」。看谁在吃：`bash scripts/host/cogneva-host-footprint-trend-reading.sh`。"

    # NVMe 磨损与硬件健康（`nvme_wear`，宿主侧每拍读一次 SMART log）。
    #
    # 资源账其余每一格问「用掉多少」，只有这一格问「还能用多久」：盘磨到 100% 之前会先变
    # 只读、再 I/O 错误、然后挂在上面的所有卷一起不可用，而磨损没有任何补救动作——清缓存、
    # 删卷、抬配额都退不回这个数，只能提前换盘。node-exporter 的 nvme collector 只发容量
    # 与设备状态，不导出磨损百分比（SMART log 要 ioctl 到控制器字符设备），所以这一格在
    # 别处没有第二份读数。
    #
    # 两条分开：磨到界是**排期换盘**；SMART 自己举手（介质错误 / critical warning）是
    # **立刻换盘**——后者与磨到多少无关，一块用了 12% 的盘也可能已经在掉块。
    #
    # 界不是这里写死的数，而是读数自己导出的余量 `cogneva_host_nvme_wear_headroom_pct`：
    # 界（100 − 提前期天数 × 这块盘的日磨损速率，夹在 [1,99]）减去已用，负数即越界。
    # 写死一个百分比的毛病是它把「还剩多少寿命」与「还要多久到」混成一个数——一块
    # 0.05 %/天的盘在 80% 上还剩 400 天，一块 0.8 %/天的盘在 80% 上只剩 25 天，同一个 80
    # 对后者已经太晚。发余量而不是界本身，是因为余量一个比较就能判：界与已用两条序列做
    # `on(device)` 连接的话，标签集一旦对不上就是静默的空结果，而清单里的连接形状没有门在读。
    - name: cogneva-host-nvme-wear
      rules:
        - alert: CognevaHostNvmeWearHigh
          expr: cogneva_host_nvme_wear_headroom_pct < 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} 的磨损余量是 {{ $value }}%：按它自己的速率，剩余寿命已不足一个换盘提前期"
            description: "余量 = 界 − 已用，界是 100 减去提前期天数乘这块盘的日磨损速率。2026-10-22 实测这块盘 8%、通电 779 小时 ⇒ 约 0.246 %/天，90 天提前期下界在 77.85%，余量 69.85。来源标签 source 说清界是导出的（derived）、刚上机的退路（default，固定 80）还是人钉的（override），退路不许装作导出的。这个数只会往下走，没有补救动作，只能排期换盘。要知道按当前速率还剩多少天，用余量除以 `cogneva_host_nvme_wear_rate_pct_per_day`。"

        # 「突然变得更快」是另一件事：界回答「还够不够一个提前期」，这一条回答
        # 「这块盘是不是刚换了一种用法」。近 6 小时的写入速率压过它自己一生的平均写入速率
        # 两倍才算，且折成磨损要过 0.1 %/天——否则 8% 的盘多写 1% 就是两倍，天天响。
        # 两条都读**字节**，不读磨损百分比：`percentage_used` 是 1% 的整数颗粒度，6 小时
        # 窗口里进一格 `deriv` 就报约 4 %/天，比任何阈值都高一个数量级 ⇒ 一次进位（不是
        # 载荷变化）就够点着它。2026-10-23 现网正是这么响的：窗口读数 4.40 %/天，同一时刻
        # 按字节计数器只有一生平均的 1.45 倍（实测 2026-10-23：6 小时 1.82 TB/天 vs 一生 1.27 TB/天）。
        # 处置是查谁在猛写（构建缓存 / 镜像库 / 备份），不是换盘：速率回去了就不该换。
        - alert: CognevaHostNvmeWearAccelerating
          expr: |
            (deriv(cogneva_host_nvme_written_bytes_total[6h]) * 86400)
              > (cogneva_host_nvme_written_bytes_per_day * 2)
            and
            (deriv(cogneva_host_nvme_written_bytes_total[6h]) * 86400
              / cogneva_host_nvme_written_bytes_per_day
              * cogneva_host_nvme_wear_rate_pct_per_day) > 0.1
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} 近 6 小时的写入速率是 {{ $value | humanize }}B/天，超过它一生平均的两倍"
            description: "左边是近 6 小时的写入速率（字节/天，来自控制器自己的写入计数器），右边是这块盘一生的平均写入速率 `cogneva_host_nvme_written_bytes_per_day` 的两倍；第二句把窗口速率折成磨损，要求它本身也过 0.1 %/天，否则一块几乎不写的盘多写一兆就是「两倍」。不用 `percentage_used` 判这一格：它只有 1% 的颗粒度，6 小时里进一格就等于 4 %/天，一次进位就能点着这条规则——那不是变快，是计数器的分辨率。突然变快通常是新加了一种写载荷：构建缓存、镜像层、备份落盘。查 `bash scripts/host/cogneva-host-footprint-trend-reading.sh` 与宿主上的写入者；这一格的修法是挪走写载荷，不是换盘——速率降回去就不该换。"

        # 「磨到多少」与「有没有已经坏了」是两件事：介质错误计数只会涨，critical warning
        # 是控制器自己举手。这一格的处置是立刻换，不是排期。
        - alert: CognevaHostNvmeHealthWarning
          expr: |
            cogneva_host_nvme_media_errors_total > 0
              or cogneva_host_nvme_critical_warning > 0
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} 在报硬件问题（介质错误或 critical warning）"
            description: "`cogneva_host_nvme_media_errors_total` 是 SMART 记到的介质错误数，`cogneva_host_nvme_critical_warning` 是控制器的告警位图——两者都是盘自己说的，与它磨到多少无关。修法是换盘并把卷迁走，不是调参数。读数由宿主侧 `nvme smart-log` 给出：`sudo nvme smart-log /dev/nvme0` 看原文。"

        # 只有「部分盘读不到」落在这里：**全部**读不到时生产者退 3、一条序列都不印，
        # 那一档由 `CognevaHostReadingProducerUnreadable`（producer="nvme_wear"）接住。
        # 少了这一条，一块盘从清单里消失与一块盘健康在别处同形。
        - alert: CognevaHostNvmeUnreadable
          expr: cogneva_host_nvme_devices - cogneva_host_nvme_readable > 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 块 NVMe 的 SMART 读不出来，那块盘的磨损没人知道"
            description: "通常是 `sudo -n` 不再免密（宿主读数以普通用户跑，`nvme smart-log` 要 root），或这块盘的控制器节点换了名字。查 `bash scripts/host/cogneva-nvme-wear-reading.sh` 的 stderr，它会点名是哪一块。"

        # 换盘是个**事件**，不是磨损读数上能看出来的一件事：换完之后 percentage_used 从
        # 80 掉回 2，与「这块盘自己好了」逐字同形。所以读数带一个按序列号数的计数，只在
        # 序列号变化时 +1，这一条把那个跳变转成一行可 ack 的告警——换盘的记录面就落在
        # `alerts` 表里（fired → acknowledged → resolved），而不是只活在被换掉的那块盘上。
        # severity 是 info：它记录的是「有人做对了」，不需要谁被叫醒。
        - alert: CognevaHostNvmeReplacementDetected
          expr: increase(cogneva_host_nvme_replacements_total[6h]) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: info
          annotations:
            summary: "NVMe {{ $labels.device }} 位次上换过一块盘"
            description: "`cogneva_host_nvme_replacements_total` 是这块位次上累计换过的盘数（读数按序列号数，第一次见不计）。降下去是换盘，不是盘变好了——磨损只增不减，同一块盘的 percentage_used 不会回落。要记录换的哪块、旧的磨到多少，看这一行告警的起止时间与换盘前的 `cogneva_host_nvme_percentage_used`。"

        # 换盘计数是本族唯一一个**基线在宿主侧的序列**（状态文件按序列号记着每一位次换过几块）。
        # 那个文件被删、被清理脚本扫掉、或换了个用户跑，计数就从 0 重来——而这件事在宿主侧
        # 看不出来：生产者只知道自己手里没有基线，分不清「第一次跑」与「基线没了」。
        # 能看见它的只有比基线活得久的东西，也就是 Prometheus 的时序：计数只增不减，
        # 回落一次就说明基线被重置过。不接这一条，下一次换盘会被静默吞掉（新基线把它当
        # 第一次见），而读数面上一切正常。计数本来是 0 时这条不会响——没有东西可丢。
        - alert: CognevaHostNvmeBaselineLost
          expr: resets(cogneva_host_nvme_replacements_total[1h]) > 0
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "NVMe 换盘计数回落：{{ $labels.device }} 的宿主侧基线被重置了"
            description: "`cogneva_host_nvme_replacements_total` 只增不减——同一位次上序列号变了才 +1。它回落只有一个原因：宿主侧状态文件被删、读不懂或换了个用户跑，计数从 0 重来。这不影响磨损与界，但会让下一次换盘被静默吞掉（新基线把它当第一次见）。修法：确认这个位次实际换过几块，把旧计数写回 `COGNEVA_HOST_NVME_STATE` 指向的文件（默认 `~/.local/state/cogneva/nvme-wear.json`）再让下一次抓取覆盖它。"

        # 提前期是导出界那个公式里唯一的政策输入，钉得太短等于「等它响了再买」：
        # 采购与上门要时间，界就是为这段时间留的。低于 30 天时导出的界贴到寿命尽头，
        # 规则响了也已经来不及。这是政策读数自己的守卫，与任何一块盘的现状无关。
        - alert: CognevaHostNvmeLeadTimeTooShort
          expr: cogneva_host_nvme_lead_days < 30
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "NVMe 换盘提前期只有 {{ $value }} 天：导出的磨损界会贴到寿命尽头"
            description: "界 = 100 − 提前期 × 日磨损速率，提前期太短就没给采购与上门留出时间。默认 90 天，由 `COGNEVA_HOST_NVME_LEAD_DAYS` 调；调短要同时改换盘流程的时长，否则这一格只是把告警推迟到无可挽回之后。"

    # 文件大小普查（`crates/` 下每个越过普查线的 `.rs` 各判过没有）落后于活树多少。
    # 普查线是判据脚本 `scripts/gates/check-file-size-census.py` 自己的常量，这里不抄那个数：
    # 抄一遍就有两份会各自漂移的规格，而其中一份没有任何东西会读它。
    #
    # 为什么这条判据不在提交门上：普查表在私有仓，判的却是公开仓那棵树。挂在私有仓的
    # 提交门上时，队友在公开仓把一个 `.rs` 顶过线、没补普查行，红会落在下一个在私有仓提交
    # 的人身上——而那个文件的作者从构造上跑不到这道门。2026-10-22 两小时内实测两次。
    # 于是判据分成两半：私有仓的测试判**钉的那一版**（钉文件 `file-size-census.pin`，
    # 判树快照按它建，结果可复现、不随别人的提交变色）；活树与钉版之间的差在这里判。
    #
    # 两个方向分开，因为它们要修的是相反的：
    #   · 越线却没有行：有人刚把文件顶过普查线，没人判过它该单轴还是多轴——要补一行；
    #   · 有行却没有文件：文件被删了或缩到线下——要撤一行，而且这一族从来不是急事。
    # 合起来会变成「普查和树不一致」一句，读的人得先自己查是哪个方向。
    - name: cogneva-file-size-census
      rules:
        # 越线没判：这一族里唯一要当天动手的一格——它意味着下一个写 size 规则的人会
        # 第一次撞上一个没人数过的文件。
        - alert: CognevaFileSizeCensusUnjudged
          expr: cogneva_file_size_census_unjudged > 0
          for: 2h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 个越过普查线的 .rs 没有任何一行普查判它"
            description: "公开树 `crates/` 下越了线的文件数比普查表的行数多。跑 `python3 scripts/gates/check-file-size-census.py --repo ../cogneva` 看逐条点名，补 `scripts/data/file-size-census.tsv` 一行——判据是这个文件该单轴还是多轴，不是把它拆小。补完把 `scripts/data/file-size-census.pin` 的 rev 换成含这次改动的那一版。"

        # 反方向：行还在、文件已经不在了。不急着当天修（撤一行而已），但不清掉的话
        # 每一拍都在喊，喊久了就没人看了——所以它自己一格，窗口比上面长得多。
        - alert: CognevaFileSizeCensusStale
          expr: cogneva_file_size_census_stale > 0
          for: 24h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: info
          annotations:
            summary: "普查里有 {{ $value }} 行描述的文件已经不在那条线上了"
            description: "文件被删、或缩到了普查线以下。撤掉那几行（同一条命令会点名），再把钉文件的 rev 换到撤行之后的那一版。"

        # 落后几个提交本身**不是**错：树在动、钉不必每提交都追。所以它没有告警，
        # 只有这条读数——真正要人管的是上面两格。把 `pin_lag_commits` 也做成告警，
        # 等于每次正常提交都喊一次，喊到没人看为止。

    # 每日六列红绿表里**没有别人读**的那两格判词。
    #
    # 为什么只给两列立规则：那张表的六格里有四格的界本来就在别处有人读——`rss` 只报不判
    # （瞬时 0.81 那条 `container_memory_near_limit` 拥有它），`redis_mem` 的 0.90 与
    # `redis_memory_near_limit` 同值，`oomkill` / `restarts` 由 `pod_oom_killed`、
    # `pod_restarting_fast` 各自持有。在那四格上再加规则就是同一条界两个信使，喊的次数
    # 加倍而处置不变。剩下两格的界只有这张表自己在判，此前没有任何规则读它——它们在
    # Prometheus 里只是一行没人按它做决定的字。
    #
    # 两格都不比瞬时值：表读的是窗口极值（默认 24 小时），所以这两条说的是「这个窗口里
    # 发生过」，不是「此刻正红」。`for` 只是躲开一次抓取抖动，窗口由生产者自己声明，
    # 不在这里另写一个数。
    - name: cogneva-resource-six-column
      rules:
        # 连接数撞上 maxclients 就是新连接被拒：这是这一列界的定义本身，不是挑出来的比例。
        - alert: CognevaResourceSixColumnConnExhausted
          expr: resource_six_column_state{column="conn",state="red"} == 1
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "Redis 的 connected_clients 在最近一个窗口里撞到过 maxclients，新连接会被拒"
            description: "窗口极值不是瞬时值（窗口多长读 `resource_six_column_window_seconds`，由生产者声明，不在这条规则里写死）：要确认是「此刻仍满」还是「某一刻满过」，跑 `bash scripts/host/cogneva-resource-six-column-reading.sh` 看 connected_clients 与 maxclients 两行的时刻。修法是查谁开了没关（连接池上限、租约 loop 的泄漏），不是直接抬 maxclients——抬界只是把同一条泄漏推迟到下一个更大的数。"

        # 占用超过「这个窗口里提供过的最高界」＝某一次准入放过了界，是结构违规而不是水位高。
        - alert: CognevaResourceSixColumnSlotOverAdmitted
          expr: resource_six_column_state{column="slot",state="red"} == 1
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "构建槽的占用峰值超过了同一窗口里提供过的最高界"
            description: "这是准入放过了一个越界的请求，不是「槽很忙」：忙碌的代理是 holder_seconds 那一列，它只报不判。两侧都是窗口极值（窗口多长读 `resource_six_column_window_seconds`）——拿整窗的占用峰值比此刻的界会因为「界忙时降、闲时爬」而假红，所以这一格只在占用确实越过了那一天提供过的最高界时才红。查构建闸的准入判据与它读的界是不是同一份（`RESERVE_FRESH` 不是持有上限）。"

    # 这条链最前面那本账的两个方向。
    #
    # 账本是 `scripts/data/host-readings.tsv`（只此一本，不在本仓）：一行一个生产者，
    # 第四列列出它发的每一条序列，判词后缀 `=verdict`。下面两条读的是这本账自己有没有
    # 漏人——一条管「端点上的序列在不在账上」，一条管「账上标了判词的有没有读者」。
    #
    # 为什么它们必须在规则里而不是只在脚本里：没有读者这件事本身与「这一面压根没写生产者」
    # 在读数面上逐字同形（都是一条决定也不产生）。把「还剩几条判词没人读」做成序列，再让
    # 一条规则读它，这个缺口才有闭合的可能。
    - name: cogneva-host-readings-ledger
      rules:
        # 印了却没在账上登记：有人悄悄加了一条序列，或者账本漏了一行。两条都得有人补，
        # 所以它没有「承认的欠账」一说——补一行是零成本的，不像补一条读者那样要设计。
        - alert: CognevaHostReadingSeriesUndeclared
          expr: host_reading_series_undeclared > 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主端点上有 {{ $value }} 条序列不在账本里"
            description: "这些序列每一拍都在被采集，但 `scripts/data/host-readings.tsv` 那一行没有登记它们——所以没人说得清端点上一共有多少条、新加的有没有人读。跑 `bash scripts/host/cogneva-host-readings.sh`（key=value 模式）会逐条点名 `undeclared producer=… series=…`：把它们补进那个生产者所在行的第四列。别用加一行新生产者的办法绕过——那会让同一批序列有两个名字。"

        # 账上承诺每一拍都印、生产者跑成了却没印的。与上一条分开：上一条是「有人加了没登记的」，
        # 这一条是「登记过的少了一条」。混在一个数里就只能当值看——账上本来就有一批只在坏事件
        # 才印的序列（标 `=error`），它们缺席是设计。判词亮说明生产者的分支漏了、改名了，
        # 或者换了输出模式而账本没跟上：两种都要有人改，且改哪边很清楚（`# vanished producer=…`）。
        - alert: CognevaHostReadingSeriesVanished
          expr: host_reading_series_vanished > 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主端点上有 {{ $value }} 条账本承诺的序列这一拍没印"
            description: "生产者退 0/1（它跑成了、也判出来了），但账本那一行声明它每一拍都会印的序列少了一条。跑 `bash scripts/host/cogneva-host-readings.sh` 逐条点名 `vanished producer=… series=…`：要么生产者的分支/改名把它弄丢了，要么它只在某些模式下印而账本没写这一层——改生产者，或者把那一行改成实情。只在坏事件才印的序列标 `=error`，标了就不进这个数；生产者退 3 的拍也不进（那是「读不到」，有 `host_reading_producer_unreadable` 那一条）。"

        # 涨过承认的欠账才是新闻。写成 `> 0` 会在第一天就常红（今天就有十几条判词没有读者，
        # 它们分属不同面、要逐个设计规则），而常红等于没有：整条告警会被静音掉，包括它本该
        # 报的那一次增长。上限写在账本表头里（`unread_ceiling=N`），只许变小。
        - alert: CognevaVerdictSeriesUnread
          expr: cogneva_verdict_series_unread > cogneva_verdict_series_ceiling
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "宿主端点上标了判词、却没有规则读的序列涨到了 {{ $value }} 条（超过了已承认的欠账）"
            description: "账本里标 `=verdict` 的序列，在 `deploy/` 下任何一个规则文件里都找不到名字。判词没有读者＝这封信没人收：它红的时候什么都不会发生，与「这一面没在判」完全同形。跑 `bash scripts/host/cogneva-verdict-readers-reading.sh` 逐条点名（`unread_member name=… producer=…`），然后要么给那条判词立一条规则（真有人按它动手），要么把它从 `=verdict` 拿掉（它是值，被人看就够了）——两种修法都要顺手把账本表头的 `unread_ceiling` 调回实测值，只许变小。"

    # 账本上标了判词、也确实有决定可做的几格。判词的定义是「它红的时候有人要动手」，
    # 所以这一组每条都要能说出往哪修；说不出修法的格不在这里立规则，而是从账本上把
    # `=verdict` 拿掉（它是值，不是判词）。
    - name: cogneva-host-readings-verdicts
      rules:
        # 面表里某一面声明要读的读数，按它写的名字取不到值。这不是「那一面坏了」——
        # 那一面坏了有它自己的判词；这是**面表与生产者对不上**：名字写错了，或者那面
        # 压根没写生产者。两种修法都要改面表，不是改读数。
        - alert: CognevaReadingWitnessUnresolved
          expr: reading_witness_unresolved > 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 面声明要读的读数按名字取不到"
            description: "面表（`scripts/host/cogneva-reading-witness-reading.sh` 读的那份名册）里逐面写了这一面欠哪个读数，而那个读数名在宿主端点上取不到值。逐面点名读 `reading_witness_face_resolved{face=…} == 0`。修的是面表那一行的名字或那一面的生产者，不是读数本身——同一条链上「读数没有」与「面表写错了」是两件事，这一条只管后者。"

        # 每一面的**第一条读数**有没有读者。读数长出来、每拍都在印、却没有任何规则、面板或
        # 代码读它——这样的读数在读数面上与「这一面压根没写生产者」逐字同形：都是一条决定
        # 也不产生。这一环此前没有任何机器可读的答案，2026-10-28 实测 13 面里 2 面无读者
        # （共用评测臂那两条序列），而已判数在 0/198 上停了八天，读数面一个字都没报。
        #
        # 为什么界是 `> 0` 而不是「涨到几以上」：分母只有 13，欠账从 0 变 1 就是一个整面
        # 没人服务；给它留一个容差，就是把最该抓的那一次留成静默。今天实测 0/13，所以它
        # 现在不红，只在「新面带着一条没人读的读数上线」时响——那一天正是要有人的那一天。
        #
        # 为什么不在这一条里判「读数没了」：这条读数登记在账本里，序列整体消失由
        # `CognevaHostReadingSeriesVanished` 管；读不到时不印序列（不是印 0），所以这里
        # 表达式为空集、不响，那是对的——「这一跑没量」不是「没有缺口」。
        - alert: CognevaFaceFirstReadingUnread
          expr: max(face_first_reading_consumers_unread) > 0
          for: 2h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "读数正确性"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 面的第一条读数没有任何读者"
            description: "面表（`scripts/data/faces.tsv`）第 10 列点名的那条序列，在公开仓 `deploy/`、`crates/`、`scripts/`、`.github/` 与宿主 `scripts/` 里一处都没有被点名——没有规则读它，没有面板画它，没有代码按它取值。逐面点名读 `face_first_reading_consumer{face=…} == 0`，跑 `bash scripts/host/cogneva-face-first-reading-consumers-reading.sh` 会连同它属于哪个生产者一起印出来。修法只有两种：给这条序列立一个会做决定的读者（一条规则、一块面板、或按它取值的代码），或者把这一面的第一读数换成一条真有读者的读数——换哪一种都要改面表那一格。**不许**用「在注释里提一句」「在登记表里写一遍」充数：那两种都不算读者，普查已经把它们排掉了。"

        # 构建闸管的是**发数**与**每发多宽**，但只管得住走 `cogneva-build.sh` 的那些。
        # 会话里直接起的一发不取槽、不受宽度约束，却和闸里的构建抢同一批核；闸的水位只
        # 数得到闸里的，于是「这台机器被谁压着」在任何读数上都没有答案。2026-10-28 实测
        # 就是这么过的：闸自报 2 发在跑，宿主上另有直接起在会话里的 `cargo test`，load1 到
        # 37（24 核）。
        #
        # 为什么判据是两半同时成立：只有「存在闸外的构建」几乎常亮——人工跑一次 cargo 就是，
        # 那不是事故。它成为事件的时刻是宿主**已经开始不够用**（load1 超过核数的一半，界在
        # 生产者里，不在这条规则里写死），而闸外那一发还在跑。那时修法是确定的：把它挪进闸，
        # 或者等它跑完再起别的。
        #
        # 为什么留 30 分钟：短命的一发（几分钟的 `cargo check`）撞上忙碌时段是常态，喊它只是
        # 把常亮换成一个更长的常亮。半小时还在跑的闸外构建，已经和闸里的构建抢了半小时的核，
        # 而它自己不会因此停下来。
        - alert: CognevaBuildOutsideTheGate
          expr: max(build_containment_saturated_uncontained) == 1
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "宿主已被压着，而构建闸外还有构建在跑（几发看 `build_containment_builds{containment=\"outside\"}`）"
            description: "宿主上跑那条 containment 读数（脚本名 `cogneva-host-build-containment-reading.sh`，不在本仓，在值守用的另一棵树里，以 cogneva 用户跑）看两件事：`build_containment_builds{containment=\"outside\"}` 是闸外几发，`build_containment_outside_names` 把每一发往上走到底的那条父链点出来——`systemd<tmux: server<claude<bash<timeout<cargo` 这样的链就是「某个会话里直接敲的」。修法二选一：那一发改用同一棵树里的构建闸包装 `cogneva-build.sh cargo …` 起（取槽、按界分宽度），或者等它跑完再起闸里的活。**不要**抬闸的界——闸外的构建根本不看那个界。"

        # 构建在 slice 里，而那个 slice 没有配额。这一条比「没人在 slice 里」更该响：
        # slice 存在、构建在里面、`systemd-cgls` 也指着它，读起来像「有界」，而
        # `cpu.max` 是 max —— 一个自称有界、实际不设界的属性，比不设界更难发现，
        # 因为查的人会停在「它在那儿」这一步。实测过一个真实形状：配额一度设在每个
        # scope 上而不是 slice 上，一发一个上限，两发同时跑就是两份，总量仍然没有，
        # 而当时所有读数都显示「有配额」。
        #
        # 不等：这不是一个会自己恢复的状态，它要么被改回来，要么一直是假的。
        - alert: CognevaBuildSliceUnbounded
          expr: max(build_containment_slice_unbounded) == 1
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "资源管理"
            severity: warning
          annotations:
            summary: "构建在一个没有配额的 cgroup slice 里（自称有界，实际 cpu.max 是 max）"
            description: "宿主上那条 containment 读数（脚本名 `cogneva-host-build-containment-reading.sh`，不在本仓，在值守用的另一棵树里）印 `build_containment_slice_builds`（里头几发）与 `build_containment_quota_percent`（从那个 slice 的 `cpu.max` 读出来的百分比）。修法：给 slice 本身设总量，不是给每发设一份——`systemctl --user set-property --runtime cogneva-build.slice CPUQuota=<核数×75>%`（走构建闸包装 `cogneva-build.sh` 的构建每次自己会设）；或者把 `COGNEVA_BUILD_SLICE` 改回那一发真正有界的 slice。**不要**把这一条静音：静音之后剩下的读数仍然会说「在 slice 里」，而那正是它要防的谎。"

        # 任务面的两个发布者对不上：同一批任务，两条路径报出来的状态不同。判据是它们
        # 应当一致（同一份正本的两个投影），所以不一致本身就是缺陷，不需要等某个阈值。
        - alert: CognevaTasksPublishersDisagree
          expr: tasks_publishers_agree == 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "任务管理"
            severity: warning
          annotations:
            summary: "任务面的发布者对不上"
            description: "同一批任务经两条路径发布（正本与投影），两边报出来的状态不一致。先跑 `bash scripts/host/cogneva-tasks-face-reading.sh`（不带参数）——它逐个发布者印一行，指出是谁跟谁对不上。修的是让两边读同一份正本，不是把差异抹平。"

        # 拒绝在挡，但没有任何免费重投：规则拦下了动作，却没有把它交回请求方。这是
        # 这一族里最贵的断点——拒绝本身是对的行为，缺的是拒绝之后那一步。
        - alert: CognevaRefusalRedispatchBroken
          expr: cogneva_refusal_redispatch_state{state=~"refused_no_redispatch|below_bar|turn_off"} == 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "任务管理"
            severity: warning
          annotations:
            summary: "拒绝之后的交回断了（{{ $labels.state }}）"
            description: "`refused_no_redispatch`：有拒绝、免费重投为 0——规则在挡，被挡的请求没有交回，等于白挡一次；`below_bar`：有完成但不到 1/3，重投通道在跑却交不回大多数；`turn_off`：免费重投 ≥ 10 条任务而完成 0 条，按预登记判据该关掉这条路。三种修法不同，都在 `scripts/host/cogneva-refusal-redispatch-reading.sh` 表头那一格里写着，先看它再动手。"

        # 声明了落地的原则载体，账上没有对应的落地行。判据是「载体在树上说了它已落，
        # 账上能查到那一行」，两者不符就是有一边在说谎；条数不多，每条都能指出是哪一份。
        - alert: CognevaPrincipleSlugNoLanding
          expr: principle_carriers_slug_no_landing > 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "原则管理"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条原则载体声明已落，账上查不到落地行"
            description: "原则载体（`memory/` 里带 `# principle:` 行的那一份）声明了这个 slug 已落地，而账本里没有它落地的行。两种修法：载体说错了就改载体，账漏了就把落地行补上——不要为了消红去改账上的状态。逐条点名跑 `bash scripts/host/cogneva-principle-census-reading.sh`。"

    # 评测臂：`eval_judged_cases` 与 `eval_bench_cases` 一直是两条**没有消费者**的读数
    # ——每拍都在发、面表拿它当首读数，而没有任何规则、面板或代码读它们（2026-10-28
    # 逐面量过：13 个面里没读者的就是这两个）。后果不是抽象的：`judged=0/198` 从 2026-10-19
    # 起停了八天，读数面一切正常，没有任何人被告知。这两条规则就是那两条读数的消费者。
    #
    # 分两条而不是一条，因为修法完全不同：一条问「池子开着、题还剩着，为什么一行都不涨」
    # （泵坏了），另一条问「判出来的用例有多少归不到任何一个基准上」（尺子坏了——归不上的
    # 那些行不是某个基准的 0 分，是这一面看不见的行）。
    - name: cogneva-eval-arm
      rules:
        # 池子开着、还差着题、24 小时内已判数一个都没涨。三个条件缺一不可：
        #   * 池子关着时「不涨」是已知原因，报它等于把已知状况当新故障（2026-10-22 起到
        #     11-04 实测：池 `available=0` 连续八天，`verdict=blocked-on-pool` 自己说出了原因）；
        #   * 题判完了（`remaining=0`）时不涨是对的；
        #   * 24 小时是「一次滚动 + 一轮评测」的量级，短了会把正常的慢轮报成卡死。
        # `changes()` 读的是这一格自己有没有变过，而不是它跟谁比——判据只有一条：涨了没有。
        # 三个叶子各自 `max()` 包一层：告警身份是「规则名 + 返回序列的标签」，不加就会把
        # 报信那条序列的 pod/container 带进身份，同一个状况每滚一次重建就是一条新告警。
        - alert: CognevaEvalJudgedStalled
          expr: |
            max(eval_pool_available) == 1
              and max(eval_judged_remaining) > 0
              and max(changes(eval_judged_cases[24h])) == 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "商用交付"
            severity: warning
          annotations:
            summary: "评测池开着、还差 {{ $value }} 题，24 小时里已判数一题没涨"
            description: "`eval_judged_cases` 是这一面的首读数，24 小时内没有变化，而池子报 `eval_pool_available=1`、还差着题。先看 `eval_last_progress_age_seconds` 与 `eval_runs_by_outcome`：`flat-stalled` 涨说明轮次起得来但中途停住，`flat-fast` 涨说明起不来（网关 503、镜像拉不到），`flat-incomplete` 说明有基准接不上。逐轮看 `eval_verdict` 的成因，再动手。读数：`bash scripts/host/eval-evidence-reading.sh`。"

        # 归不到基准上的用例超过一成。守的是「得分」这一格的诚实边界：`eval_bench_score`
        # 的分母是已判数，归不到基准的那些行两边都不在——它们不会让任何基准变红，只会让
        # 这一面在读数上显得比实际干净。`eval_bench_cases > 0` 是它的在场证明：0 个用例时
        # 这个比值是 0/0，不是「一个都没丢」。
        - alert: CognevaEvalBenchCasesUnattributed
          expr: |
            max(eval_bench_cases) > 0
              and max(eval_bench_unattributed) / max(eval_bench_cases) > 0.1
          for: 2h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可评估"
            severity: warning
          annotations:
            summary: "{{ $value }} 的用例归不到任何一个基准上"
            description: "`eval_bench_unattributed / eval_bench_cases` 超过一成：这些行不进任何基准的得分，也不进任何基准的失败，两个方向都看不见。查：评测轮那一侧的基准名与检查点里的 `scaffold`/`benchmark` 字段是不是同一套写法（改名、大小写、前缀都会让归并落空）。读数：`bash scripts/host/eval-evidence-reading.sh` 的 `bench_unattributed=`。"

    # 端到端十环：一笔变更从被提出到用户真的用上它。这一族此前一条规则都没有，
    # 而它恰恰是最不能靠肉眼的一族——2026-10-20 与 2026-10-22 两次实测都是「每一环
    # 各自的尺子都合格，整条链却断了」：主线上没有对应镜像（第 3 环），部署器最后
    # 一次落地停在旧 rev（第 4 环），现网工作负载跑的是第三个数（第 6 环）——
    # 滚动 Job 全 Complete、Pod 全就绪、镜像版本各自一致，逐环绿而整链死。
    # 三条分开立，因为三种红的修法不同：有环不 ok 要修那一段链，有环读不到要修那一环
    # 的输入，有环没有判据要补判据；合成一条的话读告警的人只知道「链有问题」。
    - name: cogneva-e2e-rings
      rules:
        # 有判据的环里，有环不是 ok，且不是「构建/部署还在路上」。读的是扣掉第 3、4、6 环
        # 的那一格，不是 `e2e_ten_rings_failed`：第 3、4 环在每次落地后的几分钟内必然红
        # （新版本还没构建出镜像、部署器还没滚到主线），给它们立 `> 0` 会从第一天常红，
        # 而「六小时什么都没落地」这条界已经由 CognevaMainlineImageTooOld 持有。
        # 扣掉之后剩下的红，才是链上真断了一段、不会自己好的那种。
        - alert: CognevaE2eRingFailed
          expr: e2e_ten_rings_failed_settled > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "端到端演练"
            severity: warning
          annotations:
            summary: "端到端链有 {{ $value }} 环不是 ok，且不是还在等构建/部署"
            description: "跑 `bash scripts/host/cogneva-e2e-rings-reading.sh`（不带参数）逐环印一行 `ring_N ok|fail|unread|no_check 原因`，断在第几环就修那一段。第 3、4、6 环在落地途中本来就会红（镜像还没构建、部署器还在滚、滚动到一半），那几环不计入这条告警，也说明它们此刻不是这条的成因。别只看整链的 `e2e_ten_rings_yes`：它只说「不是全通」，说不出断在哪；也别按单环的 `e2e_ten_rings{ring=…}` 判——那一格的 0 把「判了没过」与「读不到」写在同一个值里。"

        # 环的输入这一拍读不到。与上一条分开：上一条是「量到了、不合格」，这一条是
        # 「没量到」，前者去修链，后者去修那一环读的东西（镜像清单、集群、计数器）。
        - alert: CognevaE2eRingUnread
          expr: e2e_ten_rings_unread > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "端到端演练"
            severity: warning
          annotations:
            summary: "端到端链有 {{ $value }} 环这一拍读不到输入"
            description: "这一环有判据，但判据要读的东西（主线 tag、集群状态、计数器文件）这一拍取不到——所以它既不算过也不算不过。`... --prometheus` 里单环值为 -1 才是「没有判据」，读不到在文本报告里印成 `unread`。先看那一环要读的是哪条路径：多数是外部输入没生成（构建还没出 tag），少数是权限或路径写错。"

        # 有环压根没有判据。它不是 0、不是缺席，是这一环本身没被量——十环里少一环
        # 有判据，就等于整链的结论少一段依据，而报告会照常印「其余环 ok」。
        - alert: CognevaE2eRingNoCheck
          expr: e2e_ten_rings_unchecked > 0
          for: 24h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "端到端演练"
            severity: warning
          annotations:
            summary: "端到端链有 {{ $value }} 环没有判据"
            description: "这一环在名册里，但没有任何可执行的判据：它每一拍都被跳过，跳过在报告里长得像 ok。补判据，或者在 `scripts/host/cogneva-e2e-rings-reading.sh` 的环表里写明它为什么不该有判据。给一天的时间窗：新增一环、判据后补是正常节奏，缺判据挂一天才是欠账。"

    # 告警的**回写**：Prometheus 自己求值出来的告警（规则带 `cogneva_io_managed="true"`）每拍被
    # 抄进 `alerts` 表，WebUI 的告警面读的正是这张表。这条链断在哪一段，每种红各自一格——
    # 它们的修法完全不同，合并成一条「镜像坏了」只会让人从第一段开始猜。最后两格不是「抄漏」，
    # 而是「从来不抄」：账本的选择器之外还有正在响的规则，那份账就不是全集。
    - name: cogneva-alert-mirror
      rules:
        # 树上给规则打了标记、集群里的 PrometheusRule 对象一条都没有：清单没 apply。这一档
        # 与下一档的区别是链路断在「清单 → 集群」，不是「配置 → 进程」。
        - alert: CognevaAlertMirrorUnapplied
          expr: max(cogneva_alert_mirror_unapplied) > 0
          for: 2h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "规则库里声明了镜像标记，而集群里的规则对象少了其中几条（见 cogneva_alert_mirror_unapplied_rule）"
            description: "`deploy/k3s/observability/manifests/` 里带 `cogneva_io_managed=\"true\"` 的告警，有几条在集群的 `kubectl -n monitoring get prometheusrule` 对象里找不到——按**名字**比，少哪几条由 `cogneva_alert_mirror_unapplied_rule{rule=…}` 点名。修法：重跑观测面的 apply（`scripts/install.sh` 的观测段，或直接 `kubectl apply -f deploy/k3s/observability/manifests/`）。给两小时：观测面的 apply 与一次滚动同量级，而收敛循环自己也会在下一拍补上。"

        # 规则上了集群、进程却不知道要抄（活配置里没有 `mirror_alerts`）。这是「落地≠生效」：
        # 清单换了，跑着的那份配置还是旧的，重启一次才对得上。
        - alert: CognevaAlertMirrorUnconfigured
          expr: max(cogneva_alert_mirror_unconfigured) > 0
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "规则带镜像标记，但跑着的配置里没有 mirror_alerts"
            description: "集群里已经有带标记的规则，而 ConfigMap `cogneva-json` 里 `observability.infra_watch.mirror_alerts` 缺席：这些标记只是注释，规则响它的、表里什么都没有。修法是让配置生效——滚动一次部署（配置在启动时读），不是改规则。判据是 `cogneva_alert_mirror_configured` 变成 1。给半小时：一次滚动的时间。"

        # 配置对、进程在抄，但这一条没进表。缺口按规则名点名，修法从名单开始查。
        - alert: CognevaAlertMirrorMissing
          expr: max(cogneva_alert_mirror_missing) > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条带标记的告警正在 Prometheus 里响，表里却没有开着的行"
            description: "`cogneva_alert_mirror_missing_rule{rule=…}` 点名是哪几条。先看那一拍的进程日志有没有 `alert mirror read failed`（读失败不会 resolve、也不会写新行，只累积自警）；再看规则是不是与进程内 `rules` 重名（重名的会被跳过，那条由进程内求值记账）。给十五分钟：进程每 60 秒一拍，缺口挂十五拍才不是擦肩而过。"

        # 两把尺子量同一件事：写者（镜像）按 `/api/v1/alerts` 判断「还在不在响」，这一面按
        # PromQL `ALERTS{alertstate="firing"}` 判缺口。两个视图不是同一份数据（前者是规则
        # 管理器当前持有的活动告警，后者是求值写下的样本，带 5 分钟陈旧窗），不一致时写者
        # 关掉的行在这一面读起来就是「已恢复」，而 `ALERTS` 里那条继续响——2026-10-26 实测
        # `CognevaAlertAccountNoisy` 就这样在表里 21:48 关掉、在 Prometheus 里烧到 01:51，
        # 而 `CognevaAlertMirrorMissing` 整段没有响。分歧不为 0 时 `missing == 0` 不是证据。
        - alert: CognevaAlertMirrorViewsDisagree
          expr: max(cogneva_alert_mirror_views) > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条告警在镜像与读数眼里不在同一个状态上"
            description: "`cogneva_alert_mirror_views_disagree_rule{rule=…,only=…}` 点名是哪几条、只出现在哪一面（`only=\"promql\"`＝读数说有、写者说没有；`only=\"alerts_api\"`＝写者看得见、读数看不见）。修法先查 Prometheus 那两个接口：`/api/v1/alerts` 与 `/api/v1/query?query=ALERTS{alertstate=\"firing\"}` 各自返回什么，再查那一刻有没有规则重载（重载期间规则管理器换组，`/api/v1/alerts` 会短暂少条目）。给十五分钟：5 分钟陈旧窗加上一次重载的时间，正常的关行不该在十五分钟里还看不齐。"

        # 写者那一面读不回来：此时 `views` 印 0，但那个 0 是「没量过」而不是「一致」。
        # 与上一格的 `unmirrored_measured` 同一处置——未知必须自成一态，不能是绿的形状。
        - alert: CognevaAlertMirrorViewsUnreadable
          expr: max(cogneva_alert_mirror_configured) == 1 and max(cogneva_alert_mirror_views_measured) == 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "镜像配置着，但读数读不到写者自己的那个视图"
            description: "读数每拍会额外问一次 `/api/v1/alerts`（写者判断「还在不在响」用的就是它）。这一问失败了：`cogneva_alert_mirror_views_measured=0`，此时 `views` 印 0 但那不是「两个视图一致」，是没比过。另外几格照常有效——读数故意不整体退化成读不到。修法：查宿主能不能经 apiserver service proxy 读到 `/api/v1/alerts`，再查 Prometheus 是否在重启。`configured` 为 0 时这一条不响：没有写者就没有可比的那一面，那一档由 `CognevaAlertMirrorUnconfigured` 说。给十五分钟：进程每 60 秒一拍。"

        # 行还在、`last_seen_at` 不再走动：看的人以为它新鲜，实际没有任何东西在看它。与上一档
        # 的区别是「曾经通过、后来停了」——上一档是「从来没进去」。
        - alert: CognevaAlertMirrorRowsStale
          expr: max(cogneva_alert_mirror_stale_rows) > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 行镜像告警开着，但已经有十分钟没人看过它"
            description: "开着的行靠 `last_seen_at` 每拍前进来证明「条件仍然成立」。它停住意味着镜像那一段不再跑（进程活着、只是这一支停了）或者 Prometheus 那边读不回来了。`cogneva_alert_mirror_stale_rule{rule=…}` 点名是哪几条；`cogneva_alert_mirror_oldest_open_age_seconds` 给最老的那一条。先看 `infra_watch_eval_failure` 有没有在同一条原因上响——读失败时镜像故意不 resolve，那时停住是设计，不是故障。"

        # 前四格一直在绿而账本不是全集：Prometheus 里在响、规则不带镜像标记，选择器从来看
        # 不见它们。这一格问的不是「抄漏了」而是「有没有位置抄」。上游规则（kube-prometheus
        # 带的）正是这一档：`KubeJobFailed`、`CPUThrottlingHigh` 都在报真实事件，而平台的
        # 告警面、告警账、`signal_watcher` 开任务的那条链，全都只知道带标记的那 49 条。
        - alert: CognevaAlertMirrorUnmirrored
          expr: max(cogneva_alert_mirror_unmirrored_firing) > 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条告警正在 Prometheus 里响，账本该收下它们，表里却没有行"
            description: "`cogneva_alert_mirror_unmirrored_rule{rule=…}` 点名是哪几条。判据跟着配置走：`mirror_alerts.include_unmarked` 打开时，账本承诺是全集，选择器没盖到的每一条都算在这里；关着时（默认）不带标记的那一批是写下来的决定，落在 `cogneva_alert_mirror_unmirrored_unselected_firing` 里，只印不判。这样分是因为反过来的实测：默认配置下这条判词对着两个已过期的构建失败亮了十几个小时，而它的修法是「要不要放宽选择器」这个设计决定，没人能执行——永远亮的判词与没有判词同价。两种情形都点名，所以「按设计不进账本」与「没有告警」在读数上不同形；升面时读 `unselected` 那一格，不要把它当成绿。"

        # 全集这一面**读不到**：与上一格不同的坏法，修法也不同（一个是设计缺口，一个是探针
        # 自身读不回来）。它必须自成一格，否则读不到会被下一格印成「没有未镜像的告警」。
        - alert: CognevaAlertMirrorUnmirroredUnreadable
          expr: max(cogneva_alert_mirror_unmirrored_measured) == 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "告警镜像读数读不到「全部 firing」那一面，账本完整与否未知"
            description: "读数每拍会额外问一次 `ALERTS{alertstate=\"firing\"}`（不带标记过滤），用来判账本是不是全集。这一问失败了：`cogneva_alert_mirror_unmirrored_measured=0`，此时 `unmirrored_firing` 印 0 但那个 0 是**没读到**、不是**没有**。另外四格照常有效——读数故意不整体退化成读不到，因为丢掉四格有效读数换一个未知更亏。修法：查 Prometheus 能不能回答这条查询（`/api/v1/query?query=ALERTS{alertstate=\"firing\"}`），再查宿主到它的网络代理。给十五分钟：进程每 60 秒一拍。"

    # 表里的告警有没有人看：这一组是这条链的**读者**那一端。前面几组判「该进表的进没进、
    # 进了的还活不活」，都只说明到表为止；表之后原本没有读者，2026-10-22 主线停摆七十分钟，
    # 红与停都进了表、都没人接，而系统里没有任何一个数说「这件事还没人接管」。
    - name: cogneva-alert-attention
      rules:
        # 响了超过窗口（读数自己带 1800 秒）、而**人和机器都没接**。「接了」有两个写者：
        # 人确认（WebUI 告警浮层写 `acknowledged_at`），或 `signal_watcher` 按这条告警的
        # `dedup_key` 开出了任务——后者永远不会写 `acknowledged_at`，所以只看人那一格，
        # 系统恢复自愈之后这条规则会在健康态上永远亮着。
        # 两条修法对应两个断点：人没接 ⇒ 看那条告警并确认；机器没接 ⇒ 查信号接收闸
        # （`cogneva_signal_watcher_held_total` 在涨：LLM 池被暂停时整条自发现都被搁置，
        # 告警也就没人被开成任务）。
        # 这一条自己也会进表、也会被同一个读数数到——那是诚实的：一条「没人看告警」的告警
        # 本身没人看时，它说的仍然是事实，而确认那条原告警之后两者一起 resolve。
        - alert: CognevaAlertUnattended
          expr: max(cogneva_alert_attention_unattended) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有告警响了半小时以上，人和机器都没接（见 cogneva_alert_attention_unattended_rule）"
            description: "`cogneva_alert_attention_unattended_rule{rule=…}` 点名是哪几条，`cogneva_alert_attention_oldest_unattended_age_seconds` 给最老的那一条响了多久。`cogneva_alert_attention_acknowledged` 与 `_filed` 分别数「人确认过」与「机器已开出任务」——两个数是分开的，因为断点不同：前者由 WebUI 告警浮层的确认按钮写（告警重新点火时清空，所以它记的是**这一轮**有没有人接），后者是 `signal_watcher` 按告警的 `dedup_key` 开的那个任务。先看 `_filed` 是不是 0 而 `cogneva_signal_watcher_held_total` 在涨：那是「信号接收闸被 LLM 池暂停」挡住了整条自发现，修法在池，不在告警；否则才逐条处置（能修的修、不能修的确认并写下原因）。两者都做到之后这一条自己会 resolve。"

        # 行还开着，但**没有写者还在看它**：条件早已不成立，只是打开它的那个人再也没回来关。
        # 这是另外两条读数都看不见的坏法——`alert_mirror` 问「该进表的进没进」、
        # `CognevaAlertUnattended` 问「进了有没有人接」，两条都以「这一行说的是真的」为前提，
        # 而孤儿行在它们眼里是一个完全正常的、进行中的告警：计入 firing、计入未接、甚至成为
        # 最老的那一条。唯一的机器可读特征是 `last_seen_at`：写者每次看见条件仍然成立都会推进
        # 它，所以「开着 + 很久没动 = 没人看了」。窗口 900 秒长过任何一次正常滚动（实测部署器
        # 滚动最长 185 秒没有可用 Pod），短到一行孤儿半小时内出现。
        # 修法不是关掉它，是查那个写者：2026-10-23 两行孤儿正是「关行写失败、键照删」留下的，
        # 写者侧修好之后新长出来的孤儿会消失；已经冻住的行得由写者重启后重新 sight 才能关。
        - alert: CognevaAlertUnsighted
          expr: max(cogneva_alert_sighting_unsighted) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有告警行开着，但已经超过十五分钟没有任何写者报告过它的条件仍然成立"
            description: "`cogneva_alert_sighting_unsighted_rule{rule=…}` 点名是哪几条，`cogneva_alert_sighting_oldest_unsighted_age_seconds` 给最老的那一行多久没被报告（负数表示这一行压根没有 `last_seen_at`——从来没被看见过的那一档）。它与 `CognevaAlertUnattended` 是两件事：那一条说「有人看但没人接」，这一条说「连看的人都不在了」，而后者会让前者一直亮着，因为没人接的判断本身依赖这条行还在被写者维持。先查写者：这一组的时间戳由告警写者每拍推进，写者停摆（进程活着、这一支停了）与这一行被孤儿化在读数面上同形，看同一时刻有没有 `infra_watch_eval_failure` 或 Pod 重启；再看这一行的条件是不是早就不成立（Pod 已删、任务已结束），那是它该被关闭却关不掉。给五分钟：最老的那一档已经冻了至少十五分钟，再挂五拍才不是擦肩而过。"

    # 这条链的**第五环**：前面四环（读数、产出者、消费者、判据）各有机器可读的答案，
    # 「这一行归谁」没有。前一组的 `CognevaAlertUnattended` 说的是「有人看但没人接」，
    # 而它自己也答不出该叫谁来接——读的人只能靠记性，读者恰恰是缺的那一环。
    #
    # 判据读两跳，缺一不可：这一行带没带面（规则自己的 `cogneva_io_face`，随行抄进
    # `alerts.labels`），以及那个面在面主表里有没有人。三种无主分开数，因为修法完全不同：
    # 规则没申报面 ⇒ 给规则补标签；面名不在名册 ⇒ 改拼错的名字；面在名册但面主一格是空
    # ⇒ 那是缺位，走缺位那套（具名、限期、派活）。合成一个数会让两边都以为对方在处理。
    #
    # 这一条**今天会亮**，而那是它该说的实话：chart 里那两百多条由进程自己求值的规则还没有
    # 面可申报（配置结构里没有这一格），它们写进表里的行因此全是无主的。补法在另一笔里，
    # 与这条规则无关——判词不因为「还没补完」就该闭嘴，那正是它存在的理由。它不会自己把
    # 自己算进无主（它自己的面有人管），所以补完之后它会真的回绿，而不是永远亮着。
    - name: cogneva-alert-ownership
      rules:
        # 等十五分钟：面标签是规则上的静态性质，一条行的无主不会「自己长好」；十五分钟
        # 只是让一次滚动期间的重建（行关掉又开）不在读数里翻一次面。
        - alert: CognevaAlertFiringUnowned
          expr: max(cogneva_alert_ownership_unowned) > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有 {{ $value }} 条告警正响着，而没有任何面的读法答得出该谁动"
            description: "`cogneva_alert_ownership_unowned_rule{rule=…,reason=…}` 逐条点名并给出理由：`no_face` 是那条规则没申报面（给规则加 `cogneva_io_face`，值是它判的那个面）；`face_unknown` 是它申报了一个面主表上没有的名字（改标签）；`owner_vacant` 是那个面在名册上但面主一格是空的（这是缺位，得派人，改标签没用）。分母是 `cogneva_alert_ownership_firing`——正 firing 的行数。三种理由分开，是因为把「补标签」和「派人」合成一件事之后，两边都会以为对方在处理。"

    # 这张表本身以什么速度长：前面两组判「进没进表」「进了有没有人看」，都是逐行的读数，
    # 没有一条在看流量。于是「一条规则一小时写几十行」只能靠人去数表才发现——2026-10-22
    # 两笔都是这么发现的：`stream_consumer_stalled` 六小时 82 行（每行一分钟内 resolve，
    # 一个 Pod 一生的抖动），`governance_face_not_on_target` 一拍 17 行（一次注册表读不到
    # 按面报了 17 次）。读表的人先学会「又来了」，真正的停摆就埋在同一张表里。
    - name: cogneva-alert-traffic
      rules:
        # 读数自己带窗口（1 小时）与两个界（12 行、8 条短命行），这里只读它的判词，不另立
        # 阈值：界与被判的对象是同一份字节，才不会出现两处数字各说各话。等十分钟是为了
        # 让「这一小时里出现过一次爆发」与「这一小时一直是这副样子」分开——前者是一次事故，
        # 后者是这条规则该改形状了。
        - alert: CognevaAlertAccountNoisy
          expr: max(cogneva_alert_traffic_noisy) > 0
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "有规则在一小时里往告警账里写了太多行（见 cogneva_alert_traffic_noisy_rule）"
            description: "`cogneva_alert_traffic_noisy_rule{rule=…}` 点名是哪几条，`cogneva_alert_traffic_rows{rule=…}` 给一小时写了几行，`cogneva_alert_traffic_short_lived{rule=…}` 给其中活不过一分钟的有几条，`cogneva_alert_traffic_busiest_episode_rows{rule=…}` 给同一个 dedup_key 上反复写了几行。三种形状三种修法：短命行多 ⇒ 这条判据是「缺席即成立」或每 Pod 一生的那种，给它 `for_seconds`；同一个键反复写 ⇒ 条件在抖，先看被它读的那条读数是不是在两张值之间弹；每个键各一行、键里带 pod 或 replicas ⇒ 按对象报的规则报的是生命周期，不是事故。行数本身不是故障，是这张表还能不能被人读的预算。"

    # A2A 对端面：对端照着错误码和版本协商写自己的重试逻辑，所以这一面「还是不是协议
    # 说的那个样子」得每拍量一次，而且要在对端踩到之前知道。这一族此前没有任何规则读，
    # 读数本身也不在账上——对端面因此是全树唯一一块「改了没有任何人会发现」的地方：
    # 我方的测试跟着我方实现一起改，而对端只会照着旧语义重试，然后在对端那边超时。
    #
    # 只立一条：分母（`a2a_conformance_cells`）与漂移数（`a2a_conformance_drift_cells`）
    # 一起由 `scripts/host/cogneva-a2a-conformance-reading.sh` 每拍送上来，漂移数就是
    # 判词。不另立「读不到」那一条：这一面读不到时一条序列都不印，那是生产者契约里
    # `CognevaHostReadingProducerUnreadable` 管的事，在这里再写一条会是同一个状况两个名字。
    - name: cogneva-a2a-conformance
      rules:
        # 等十五分钟：这一面每拍打十五个请求，2026-10-23 实测网关偶尔一次请求拖到二十秒
        # （同一枚请求连打三次是 0.71 / 1.59 / 0.44 秒，并发打时偶有一格拿到 000 也就是
        # 连不上）。那种抖动是一格的、自己会回来的；能连着十五拍都漂的，才是有人真的改了
        # 对外语义。判据取「持续」而不是「出现过一次」，否则这条规则会教人忽略它。
        - alert: CognevaA2aConformanceDrifted
          expr: a2a_conformance_drift_cells > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "通信"
            severity: warning
          annotations:
            summary: "A2A 对端面有 {{ $value }} 格答得不是协议说的那样"
            description: "对端的重试逻辑建立在这些格子的答复上（错误码、版本协商、名片形状），改了它们等于改了对外契约，而对端不会来问。跑 `bash scripts/host/cogneva-a2a-conformance-reading.sh`（不带 `--prometheus`）逐个印出是哪几格、实得什么、期望什么；`a2a_conformance_cells` 是这一拍比了几格，没有分母的 0 说明不了什么。三种常见来源：网关路由改动带掉了某个方法、版本协商的优先级被调换、名片里的字段按某一版协议改了却漏了另一版。"

    # A2A 发现面：平台外部的对端第一步是拿名片。这一面此前有一份「想要的时候跑一下」
    # 的读数，判据写得再准，在读数面上也与「这一面没人看」同形——网关路由或鉴权层一动，
    # 名片被挪回业务鉴权组这件事就没有任何一个数会变色，而对端连第一步都走不到。
    #
    # 只立一条，读 `a2a_reach_defect`：它是 0/1 判词，1 覆盖三种坏法（名片要凭证、
    # 名片声明 jwt 而 RPC 收匿名调用方、服务不健康、或名片答了别的码）。三种坏法分得开
    # 是在 key=value 档里点名的，不在这里各立一条：序列名一样、只是标签不同的话，
    # 「哪一条在响」会变成读的人自己拼。三条探针的状态码与名片可缓存窗口是值不是判词，
    # 读不读它们不改变这一条。
    #
    # 不另立「读不到」：读不到时这一面一条序列都不印，归 `CognevaHostReadingProducerUnreadable`。
    - name: cogneva-a2a-discovery
      rules:
        # 十五分钟：这一面每拍打三条地址，2026-10-23 实测整趟不到 1 秒。抖动不会是
        # 三次同向的；能连着十五分钟都判「外部对端走不通」的，才是路由或鉴权真的动了。
        - alert: CognevaA2aDiscoveryClosed
          expr: max(a2a_reach_defect) > 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "通信"
            severity: warning
          annotations:
            summary: "外部对端走不通 A2A 的发现这一步（名片拿不到，或名片说的与业务面做的不一致）"
            description: "跑 `bash scripts/host/cogneva-a2a-discovery-reach-reading.sh`（不带 `--prometheus`）点名是哪一种：`discovery-closed`＝名片要凭证（对端得先有凭证才知道该用什么凭证，闭环，修法是把名片挪回公开组）；`both-open`＝名片声明 jwt 而 RPC 收匿名调用方（声明与实现不符，不是更开放）；`broken-service`＝服务不健康（修服务，不是修路由）；`unexpected`＝名片答了 404/5xx 一类既非 2xx 也非 401/403 的码（路由没挂上或上游坏了）。`a2a_reach_http_status{probe=…}` 是三条探针各拿到的码，`a2a_reach_card_cacheable` 是另一件事（名片有没有给 max-age 窗口），它退化不会点燃这一条。"

    # A2A 对端面·第三方尺子：上面那些 A2A 判据都是「我们照规范写出来的」，写判据的
    # 人与写实现的人是同一拨，判据错在同一个方向上时两边一起错。这一条读的是上游官方
    # 套件（a2aproject/a2a-tck）的名片用例结果——它红的地方没法用「我们的理解就是
    # 这样」解释过去。量的是名片那一层：套件不带凭证，而本平台 RPC 按名片声明的方案要
    # bearer，跑下去只会得到一片 401，那不是「不合规」而是「量法不适用」。
    #
    # 判词取 `a2a_tck_conformant`（1＝全过，0＝名片非 200 或有失败/错误）。`passed`
    # 是分母：没有分母的 0 失败说明不了「比过」，所以读 `failed`/`errors` 的规则应当
    # 连着 `passed > 0` 一起判，而这里判的是同一次跑出来的那个 0/1。
    #
    # 不另立「读不到」：这一面退 3 时一条序列都不印（尺子没装、转发没人答话），
    # 归 `CognevaHostReadingProducerUnreadable{producer="a2a_tck"}`——「套件没跑起来」
    # 与「套件全绿」在读数上必须分开，否则坏掉的是尺子而读数说平台合规。
    - name: cogneva-a2a-tck
      rules:
        # 十五分钟：套件量的是公开名片，名片只在部署或路由改动时才会变；一次滚动
        # 期间的抖动不该点着它，而连着十五分钟不合规就是有东西真的动了对外形状。
        - alert: CognevaA2aTckDrifted
          expr: min(a2a_tck_conformant) < 1
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "通信"
            severity: warning
          annotations:
            summary: "上游 A2A 一致性套件判名片不合规（这套判据不是我们自己写的）"
            description: "跑 `bash scripts/host/cogneva-a2a-tck-reading.sh`（不带 `--prometheus`）看判词与第一条失败用例：`a2a_tck_card_status` 不是 200 说明名片这一条规范要求就没满足（401/403 是名片不公开，404/405 是没这条路由），否则看 `a2a_tck_first` 点名的用例。`a2a_tck_passed` 是同一次跑通过的条数——它掉了又没失败，说明套件本身缩小了覆盖面，而不是平台变好了。套件读的是 `COGNEVA_A2A_TCK_DIR` 指向的那份检出；升级套件等于换尺子，换完要么全绿，要么新红的就是真缺口。"

    # 宿主读数里那三条**判词**此前没有任何规则读它们：生产者每拍都在发，而
    # `CognevaVerdictSeriesUnread` 数的正是这个（2026-10-23 实测 unread=3、ceiling=0）。
    # 一条判词没人读，与「这一面压根没写生产者」在读数面上逐字同形——都是一条决定也不
    # 产生。补读者的方向是给每条判词一条规则，不是把界线调松。
    #
    # 三条的界都照抄生产者自己那一行（`scripts/data/host-readings.tsv` 与脚本开头），
    # 不在这里另立一套数：读数说绿、告警说红的两套界，读的人只会去改自己看得见的那份。
    #
    # `for:` 取的是「多慢才算数」：快车道判的是中位数，一次尖峰不该点着它；产品面占比
    # 是周尺度的量，一小时内的抖动不是「这周没做产品」；记忆预算是事前读数，积起来才
    # 说明这一周的记忆产出压过了产品产出。
    - name: cogneva-host-verdict-readers
      rules:
        - alert: CognevaCommitFastLaneSlow
          expr: max(commit_fast_lane_seconds) > 60
          for: 30m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: warning
          annotations:
            summary: "提交快车道端到端中位数 {{ $value }} 秒，界是 60 秒"
            description: "跑 `bash scripts/host/cogneva-commit-lane-reading.sh` 看两格：`commit_fast_lane_seconds` 与 `commit_fast_lane_hold_seconds`。只端到端超界、持槽没超，是它在排队（槽数与并发）；两格一起超，是快车道里的门本身慢了。分母看 `commit_fast_lane_samples`——样本个位数时中位数没什么可判的。"

        - alert: CognevaProductCommitShareLow
          expr: min(product_commit_share) < 0.5
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: warning
          annotations:
            summary: "近 7 天产品面提交占比 {{ $value }}，界是 0.50"
            description: "跑 `bash scripts/host/cogneva-product-commit-share-reading.sh`：分母 `product_commit_total` 是窗口内非 merge 提交数，分子 `product_commit_count` 是其中推进了 `crates/`（`crates/cog-observability/` 以外）的。分子为零而分母不小，说明这一周的提交都在刻度与门禁上；分母也小，说明这一周本来就没提交几笔，先看那一格再谈占比。"

        - alert: CognevaMemoryBudgetOver
          expr: min(brain_budget_remaining) < 0
          for: 15m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "原则管理"
            severity: warning
          annotations:
            summary: "本周记忆产出超过产品产出 {{ $value }} 篇"
            description: "跑 `bash scripts/host/cogneva-brain-budget-reading.sh` 看三格：`brain_memory_new_7d`、`brain_budget_product_commits`、`brain_budget_product_share`。这条是唯一**事前**判的一格——`UserPromptSubmit` 钩子把缓存卡印在回合开头，余量为负时这一轮不新建记忆文件，要记的教训写进当天流水或写成门测试。判的是「多开文件」，改既有篇不收费。"

        # 「门红了」是回归还是噪声：must-green 里自己会红的成员，每响一次让当时排队的每个
        # 提交者各付一整轮门（15～25 分钟）。判词读的是**同一个**驱动者在窗口里重复出现，
        # 不是「有过一次」——一次是抖动。界与窗口只写在生产者里（`flaky_suite_budget`、
        # `flaky_window_days` 逐拍一起印），这条规则读判词，不另立一套数。
        - alert: CognevaMustGreenFlakeRepeat
          expr: max(must_green_flake_repeat_verdict) > 0
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "原则管理"
            severity: warning
          annotations:
            summary: "同一个 must-green 驱动者在窗口内重复假红"
            description: "跑 `bash scripts/principles/must-green-flake-reading.sh` 看 `flaky_by_suite_window`：哪个套件堆得高、几次。界是 `flaky_suite_budget`（默认 3 次／窗口，窗口 7 天），改界改生产者的 `COGNEVA_FLAKE_SUITE_BUDGET`，这条规则读的是判词。记录里只有驱动套件、没有成员名（`host-tests.test.sh` 一份驱动整层 `scripts/host/*.test.sh`），所以下一步是去那一层里找哪一份不稳，不是重试那一笔提交。假红与真红分开数：真红落在 `red/`、不复跑、不进这一堆。"

        # 面名这一环：正本（另一棵树里的 `scripts/data/faces.tsv`）与树内载体申报的面集合。
        # 这三格此前只有「规则真响之后」才看得见——载体挂着一个正本不认的面，读数面报
        # `face_unknown`，而那要等某条规则真的越界。三条都在没有任何规则响的时候就能红。
        - alert: CognevaFaceNameUnknownToTheTable
          expr: max(face_symmetry_unknown) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "载体申报了 {{ $value }} 个正本不认的面名"
            description: "跑 `bash scripts/host/cogneva-face-symmetry-reading.sh`，看 `unknown_member` 逐行点出的名字：载体里有、`scripts/data/faces.tsv` 里没有。两种成因——改名时正本没跟，或规则里手写了一个正本没有的名字。两条修法不同但都只有一个正确方向：名字以正本为准；确实是新面就先写进正本，再改载体。这个数没有欠账，永远是 0 才对。"

        - alert: CognevaFaceWithoutAnyRule
          expr: max(face_symmetry_uncovered_excess) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "没有告警规则的面超出已承认的欠账 {{ $value }} 个"
            description: "跑 `bash scripts/host/cogneva-face-symmetry-reading.sh`，对比 `uncovered` 与 `ceiling`：`uncovered_member` 是正本里有、`deploy/` 下没有任何规则挂那个名字的面。`ceiling` 抄自 faces.tsv 表头的 `# uncovered_ceiling=N`，只许变小——给一个面写下第一条规则就把它减一。涨过它意味着这一面的告警从「还没人写」变成了「没人在看」。"

        - alert: CognevaFaceTableUnreadable
          expr: max(face_symmetry_invalid) > 0
          for: 5m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "可观测与告警"
            severity: warning
          annotations:
            summary: "面名正本有 {{ $value }} 行读不出来，对账那一拍没有结论"
            description: "跑 `bash scripts/host/cogneva-face-symmetry-reading.sh`，看 `invalid_row` 逐行的原因（列数不够、kind 写成 face/cross 以外、同名声明两次）。正本有坏行时上面两格会停印：残缺的分母会让「少了一个面」和「少了一行」看起来是同一件事，而修法相反。先修表，再看对账结论。"
