# 宿主读数通道自己的三条告警。
#
# 为什么需要：把各面的生产者并到一个端点之后，`up` 只答聚合器还在不在，某一面的生产者
# 死掉时它的序列会停在最后一次的值上，看上去仍然新鲜——这正是「落地≠生效」自己的病。
# 生产者每拍自报的两条判活（`host_reading_producer_up`、`host_reading_producer_unreadable`）
# 因此需要有人读，而且**必须分成两条告警**：一条是「生产者坏了」，一条是「它跑得成但输入
# 读不到」。合成一条的话，脚本崩了与账本文件没生成会被当成同一件事，而修法完全不同。
#
# 第三条盯通道本身：整个单元死了，上面两条都无从触发——没有样本就没有告警，
# 这正是「缺席不会告警」的经典形状，所以通道要单独判 `up`。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cogneva-host-readings
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cogneva-host-readings
      rules:
        # 生产者死了：它在窗口内每一拍都没跑成（超时、崩溃、脚本不在）。
        # 10 分钟＝十拍，够长到不会被一次重装或一次换机器误报。
        - alert: CognevaHostReadingProducerDown
          expr: host_reading_producer_up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "宿主读数生产者 {{ $labels.producer }} 没跑成"
            description: "它每拍都超时/崩溃；这一面的序列停在最后一次的值上，不能当当前读数用。"

        # 生产者活着但读不到输入：它这一拍一条序列都没发。这不是生产者坏了，是上游
        # （账本、集群、仓库）读不到——修的位置完全不同。
        - alert: CognevaHostReadingProducerUnreadable
          expr: host_reading_producer_unreadable == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "宿主读数生产者 {{ $labels.producer }} 读不到输入"
            description: "它跑得成，但没有发出任何序列：上游读不到，别去改生产者的代码。"

        # 整条通道死了：上面两条都没有样本可判，所以这里必单独判 `up`。
        - alert: CognevaHostReadingsEndpointDown
          expr: up{job="cogneva-host-readings"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "宿主读数端点抓不到"
            description: "所有宿主侧面读数同时停更；十环与落地≠生效会各自退化成 absent，而不是变绿。"

    # 上面三条判的是「生产者这一拍跑没跑成」。有一类生产者能在上游停更之后
    # 继续每一拍都跑成：它读的是一份「每拍追加一行」的归档，最后一行永远停在
    # 生前那次判词上。beat 停了以后没有谁写「我停了」，于是 `producer_up` 仍是 1、
    # 判词仍是 `aligned`、输入也读得到——三条规则一条都不会亮，只有最后一行的时间
    # 在往后退。这类「停产」只能按年龄判。
    #
    # 阈值按各自节拍推，而且节拍由生产者发布、不写在这里：两个来源一个 30 分钟一拍、
    # 一个 6 小时一拍，写一个常数要么把慢的那个判成永远在响，要么让快的那个消失一天也
    # 不喊。周期序列缺席时这条规则对那个来源**恒哑**，所以它旁边单立了一条报缺席的规则
    # ——与「从来没有发生过」同一种病：不许用一个默认值把两种状态压成一个。
    - name: cogneva-credential-surface
      rules:
        - alert: CognevaHostCredentialSurfaceStale
          expr: |
            cogneva_host_credential_surface_age_seconds
              > 6 * cogneva_host_credential_surface_period_seconds
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对停了，最后一条判词是 {{ $value | humanizeDuration }} 以前"
            description: "归档最后一行仍是生前那次判词，所以判词序列看上去一直是 aligned。界是周期序列的 6 倍（现网约 3 小时／36 小时），周期由驱动这一拍的 timer 自己声明。查 `systemctl --user list-timers 'cogneva-*-credential-surface*'`。"

        # 上一条的分母缺席时它自己不响：`aging > 6 * 周期` 在周期那条序列不存在时判不出来。
        # 这正是「恒哑」的形状——一条规则看过去一切正常，而它根本没在判。周期读不出来的原因
        # 通常是 timer 没装（手工跑的机器）或单元名变了，修法在上一条的界之外。
        #
        # 左半边是「这一面在这一拍确实有数据」（`measured == 1`），不是裸 `absent(周期)`：
        # 这台机器上根本没有宿主读数通道时，两条序列都不存在，裸 absent 会每台这样的机器从
        # 装上那天起恒响——而那不叫「读不出节拍」，叫「这一面不在这台机器上」。同组另外几条
        # 对「没有这个目标」都是沉默的（`up{job=…} == 0` 在没有目标时同样为空），这一条跟它们
        # 保持同一种沉默，只在「有判词、却算不出它多久以前」时说话。
        - alert: CognevaHostCredentialSurfaceCadenceUnknown
          expr: |
            cogneva_host_credential_surface_measured == 1
              unless on(source) cogneva_host_credential_surface_period_seconds
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧读不出节拍，「停了多久」这一条对它判不了"
            description: "判停摆的界是「6 × 周期」，周期来自 timer 的声明。单位不存在、单元名变了、或 systemd-analyze 不可用时这一格缺席。查 `systemctl --user cat cogneva-*-credential-surface*.timer`。"

        # 上一条要「有年龄序列」才判得了：从没跑成过时生产者只发 measured=0、不发年龄，
        # 缺席不会告警。它和「停掉」修法不同——这里是归档不在或只有表头（查单元里的
        # 路径与登记表），那边是定时器停了（查 timer）。两种成因在读数面上都表现为
        # 「没有新判词」，坍成同一个 0 就分不出该去修哪边。
        - alert: CognevaHostCredentialSurfaceNeverRan
          expr: cogneva_host_credential_surface_measured == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对从没跑过"
            description: "归档不存在或只有表头：先查单元里的路径与登记表，不要先怀疑定时器。"

        # 上面四条判的都是「这一拍跑了没有、跑成没有」。这一条判的是跑成的那些拍**说了什么**：
        # 生产者把判词拆成三个互不重叠的状态（aligned / drift / unreadable），而 drift 这一格
        # 此前在读数面上有值、没有任何人读——判词序列是给告警用的，不是给 `tail` 用的。
        # 宿主上哪个单元伸手碰了没登记的凭证，只有这一条会喊；它的退出码进了 `--failed`，
        # 而这里没有 systemd 收集器，`--failed` 本身到不了这一面。
        - alert: CognevaHostCredentialSurfaceDrift
          expr: |
            cogneva_host_credential_surface_aligned == 0
              and on(source) cogneva_host_credential_surface_measured == 1
              and on(source) cogneva_host_credential_surface_unreadable == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面与登记表不一致"
            description: "门判了、判成不一致：单元里有未登记的凭证指令、登记表点名了不存在的单元、或文件权限与登记表不符。跑 `bash deploy/scripts/check-host-credential-surface.sh . --live` 看逐条点名。"

        # 「没判成」与「判成了不一致」修法完全相反：读不到是快照／门／依赖的问题，不一致是
        # 登记表与单元的问题。合成一条的话，有人会去改登记表，把一个根本没跑起来的检查改绿。
        - alert: CognevaHostCredentialSurfaceUnreadable
          expr: cogneva_host_credential_surface_unreadable == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.source }} 侧的凭证面核对没读成，这一面当前没有判词"
            description: "门自己出错、快照建不出来、或 systemctl 探针失败。这一面判的是「宿主上哪些进程碰得到凭证」，没读成不等于没事。"

    # 持久化存储面：最近一份**已完成**的备份包是谁写的。
    #
    # 为什么单独成组：备份面此前所有的判据都只读「跑成没跑成」与「演练多旧」，没有一条读
    # 属主。2026-10-20 实测现网：卷根 `drwx------ root root`、最新包 `0:0`/`0600`——包在
    # 那儿，但以应用用户（1001）的身份恢复时连 `ls` 都读不到。这不是备份失败，是恢复那天
    # 才会暴露的失败，所以它必须有一条自己的规则。
    - name: cogneva-backup-package
      rules:
        # 属主不对：包是恢复唯一能读的东西，属主决定「谁能读」。属主 0 一律算错——
        # 平台按 1001 跑，写成 root 的包在恢复时要么读不到，要么得提权和它一起跑。
        - alert: CognevaBackupPackageOwnerWrong
          expr: cogneva_backup_package_owner_uid != 1001
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "最新一份已完成的备份包属主是 {{ $value }}，不是 1001"
            description: "跑 `bash scripts/host/cogneva-backup-package-owner-reading.sh` 看包名与大小；修法是让备份写端以 1001 落盘（或写完 chown），不是在恢复端提权绕过去。"

        # 读不到：账本或卷问不出来。它与「没有包」修法相反——这一格去修读取路径。
        - alert: CognevaBackupPackageUnreadable
          expr: cogneva_backup_package_reading_state{state="unreadable"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "备份包属主这一读数读不到（账本或卷问不出来）"
            description: "这一跑什么都没量。先看 postgres-0 能不能 `psql -c 'select 1'`，再看 PVC 的宿主路径在不在。"

        # 没有包：账本里没有一份 outcome=ok 且带包名的备份，或账本点名的包在卷上不存在。
        # 两种情况都意味着「现在没有能恢复的东西」，不是「还没轮到」。
        - alert: CognevaBackupPackageMissing
          expr: cogneva_backup_package_reading_state{state="empty"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "没有一份已完成的备份包可以恢复"
            description: "账本与卷对不上，或备份从没成功过。两条都先看 `bash scripts/host/cogneva-backup-package-owner-reading.sh` 印的 package= 与原因行。"

        # 包太旧：界沿用持久化面既有的 26 小时（`face-reading-criteria.tsv` 里演练那条同值），
        # 不为这条规则另拍一个数——同一个问题用同一个界，改的时候一起改。
        - alert: CognevaBackupPackageStale
          expr: cogneva_backup_package_age_seconds > 93600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "最新一份已完成的备份包已经 {{ $value }} 秒（超过 26 小时）"
            description: "备份定时器没跑、跑失败、或写完了没记账。先看 `cogneva-backup` CronJob 最近的 Job 与 `backup_runs` 最后一行。"

    # 根盘到刹车触发线还有多久。这条线**只能**由宿主自己算：刹车（`host-target-gc`，每 30
    # 分钟一拍）判定用的是 `df` 的 Use%，分母是 used+avail、不含 root 保留块；而
    # node-exporter 的 `1 - avail/size` 分母含保留块。两把尺子的差就是保留块在 size 里的
    # 份额（ext4/xfs 默认 5%，随文件系统类型与 `tune2fs -m` 的设定而变）——它不是常数，
    # 所以按 size 解出来的触发线离刹车真正动手的位置有多远，随每台机器的保留比例变化，
    # 「还有几天」被读短的幅度也随之变化。在 Prometheus 里再算一遍就要么挑一把尺子去逼近
    # 另一把、要么把触发线落错位置。所以规则只读宿主已经算好的天数，不在这里重算。
    - name: cogneva-host-disk-runway
      rules:
        - alert: CognevaHostDiskRunwayShort
          expr: min by (mountpoint) (disk_trend_days_to_trigger) < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mountpoint }} 到构建缓存刹车的触发线不到一天（约 {{ $value }} 天）"
            description: "整窗拟合的斜率把当前可用空间带到触发线只需不到一天。刹车的触发线在 df 那把尺子上（见宿主读数里的 `used_pct_brake`），触发之后它会开始删构建缓存，所以这条告警给出的是「准备为人腾地方」的提前量，不是「盘要满了」。要看是谁在吃：`bash scripts/host/cogneva-host-footprint-trend-reading.sh`。"

        # 上一条的分母缺席时它自己不响：触发线读不出来（free 序列缺席）就没有
        # `disk_trend_days_to_trigger`，于是「读不出来」与「还有很久」同形。
        # 这一条单独报那一态。整条生产者死掉不在射程内——那由
        # CognevaHostReadingProducerDown 按 producer 名报。
        - alert: CognevaHostDiskTriggerLineUnreadable
          expr: min(disk_trend_trigger_line_readable) == 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "根盘的刹车触发线读不出来（缺 free 序列）"
            description: "free 与 avail 差的是 root 保留块；缺了它触发线落不到刹车那把尺子上。查 node-exporter 的 filesystem collector 是否还在发 node_filesystem_free_bytes。"

    # 刹车本身（`host-target-gc`，每 30 分钟一拍的那个回收器）的读数。
    #
    # 为什么单独成组：上面 `cogneva-host-disk-runway` 判的是**盘**往哪走，它答不了
    # 「刹车还在不在踩」。回收器每拍把判词写进 `~/.local/state/cogneva/target-gc.json`，
    # 而那份文件曾经只进 journal、不进读数面——于是三种坏法在 Prometheus 里逐字同形，
    # 都是一条序列也没有：
    #   · timer 停了：脚本不再跑，盘照涨，runway 报的是盘（它说得对，但说不出刹车停了）；
    #   · 跑了但拒绝动手：脚本身份立不住（被改过／不在仓库里）或有进程读不到，两条都
    #     fail-closed 地不删——安全方向对，代价是「什么都没回收」；
    #   · 跑了、每一档都走完，盘仍在地板之上：缓存不是原因。
    # 三条的修法完全不同，所以三条分开，不合并成一个布尔。
    #
    # 阈值一律从生产者发布的周期推（界是「几倍周期」）；周期量不出来时 Stale 那条对它
    # 恒哑，所以旁边单立一条报缺席——与凭证面那组同一个理由。
    - name: cogneva-host-target-gc
      rules:
        - alert: CognevaHostTargetGcStale
          expr: |
            cogneva_host_target_gc_age_seconds
              > 6 * cogneva_host_target_gc_period_seconds
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "宿主构建缓存回收器停了，最后一次运行是 {{ $value | humanizeDuration }} 以前"
            description: "状态文件停在生前那一拍的判词上，所以 outcome 看上去仍然正常。界是周期序列的 6 倍（现网约 3 小时）。查 `systemctl --user list-timers cogneva-host-target-gc.timer` 与 `systemctl --user status cogneva-host-target-gc.service`；盘照涨而刹车没跑，最后一段只能靠 runway 那条提前量兜。"

        # 上一条的分母缺席时它自己不响（`age > 6 * 周期` 在没有周期序列时判不出来）。
        # 左半边仍是「这一拍确实有数据」：这台机器上根本没装宿主读数通道时两条序列都不在，
        # 裸 absent 会从装上那天起恒响——那不叫读不出节拍，叫这一面不在这台机器上。
        # `on()` 空集是刻意的：两侧都不带标签，连接键就是「没有键」；将来谁给其中一侧
        # 加了标签，这一行就必须跟着改，写成裸 `unless` 会把那种错藏起来。
        - alert: CognevaHostTargetGcCadenceUnknown
          expr: |
            cogneva_host_target_gc_measured == 1
              unless on() cogneva_host_target_gc_period_seconds
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "读不出回收器的节拍，「它停了多久」这一条判不了"
            description: "界是「6 × 周期」，周期来自 timer 自己的声明（`systemd-analyze calendar`）。单元名变了、timer 没装、或 systemd-analyze 不可用时这一格缺席。查 `systemctl --user cat cogneva-host-target-gc.timer`。"

        # 从没跑成过：生产者只发 measured=0、不发年龄，缺席不会告警。与「停掉」修法不同——
        # 这里是状态文件不在（查单元里的路径与有没有装过），那边是定时器停了（查 timer）。
        - alert: CognevaHostTargetGcNeverRan
          expr: cogneva_host_target_gc_measured == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "宿主构建缓存回收器从没跑成过一拍照"
            description: "状态文件不在：先看 `systemctl --user status cogneva-host-target-gc.timer` 与 `deploy/scripts/install-host-target-gc.sh` 有没有在这台机器上跑过，不要先怀疑盘。"

        # 身份立不住：脚本被改过、不在仓库里、或 git 读不出来，它一律不释放（删除不可撤销，
        # 而磁盘等一次提交只要几分钟）。这种运行写出的 outcome 可能是 below_trigger，只看
        # 结局的话与健康逐字同形——所以按身份这一格单独判。
        - alert: CognevaHostTargetGcScriptUnverified
          expr: cogneva_host_target_gc_script_committed == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "回收器跑的那份脚本不是 HEAD 里的那一份，它拒绝释放任何缓存"
            description: "检出的工作树上有未提交的改动，或有文件被换掉了。回收器比的是 blob 逐字节相等；提交或还原 `deploy/scripts/host-target-gc.sh` 之后下一拍恢复。读数里的 `rev` / `rev_state` 就是它给自己算的身份。"

        # 有进程是「我们的」但读不到属主或工作目录：整轮一个字节都不删（fail-closed）。
        # 与上一条不同——那边是脚本的身份，这边是**进程**的身份，修法在权限上。
        - alert: CognevaHostTargetGcProbeFailed
          expr: cogneva_host_target_gc_outcome{outcome="probe_failed"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "有进程读不到属主／工作目录，回收器整轮不释放"
            description: "它判断某棵树是不是被占着时必须认得占着它的进程；认不出就不动（删除不可撤销）。journal 里那一行会点名是哪个 pid、读不到的是什么。"

        # 便宜的三档都走完、盘仍在地板之上：缓存不是这颗盘被填满的原因。这条红的意思是
        # 「去看是谁在吃盘」，不是「缓存没删干净」——所以它与上两条分开。
        - alert: CognevaHostTargetGcFloorUnreachable
          expr: cogneva_host_target_gc_outcome{outcome="floor_unreachable"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "构建缓存已经放到地板之上仍回不去"
            description: "它把它能判的树都放过了，盘依然在地板之上。运行 journal 那一行会说是「缓存不是原因」还是「破坏性的一档被推迟到了 85%」。看谁在吃：`bash scripts/host/cogneva-host-footprint-trend-reading.sh`。"
