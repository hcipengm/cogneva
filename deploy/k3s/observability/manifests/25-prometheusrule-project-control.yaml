# 覆盖率量不出来时的判据。
#
# 为什么需要：`cogneva_project_control_unmeasured_total` 早在 `/metrics` 上，但它此前
# 一条规则也没有——读数存在、消费者不存在，于是「这一轮量不了」与「一切正常」在告警面上
# 同形。面板不是消费者：没有人会因为一块面板变色去修东西。
#
# 只剩一格 `no_baseline`：计划基线表整张读不出来，这一轮五格覆盖率里有三格的分母都算
# 不了。修的是 `task_plan` 那条读路。这条回路原来的另外两格（`no_ledger`、
# `cost_unreadable`）随成本指数一起去掉了——token 账读不到只影响成本绩效，而成本绩效
# 不再有任何读者。
#
# 界取 6 小时窗的 `increase`，不是「计数器非零」：这条回路的间隔是 600 秒，一次失败在
# 6 小时窗里留一条，窗口滚过去自己灭掉；一直失败就一直亮——那正是要的。反过来按
# 「非零」判，进程启动以来第一次失败会让规则**永久**点亮（计数器只增不减），那条红
# 再没人能熄。
#
# 不用伴生钟：这是进程自己的计数器，进程停下时序列消失、`increase()` 变空，规则自己
# 静下来；那种情形该响的是进程本身（`background_loop_stalled`），不是这条后果。
#
# **覆盖那几格这里故意没有判据**，理由写在同一份读数的定义处（`project_control.rs` 里
# `COVERABLE_ROWS` 那一段）。一句话：已经开工却没有基线的行，在现网是**冷启动人口**，
# 不是缺陷——它的修法是给那个种类定一份计划，或等它攒够样本，两件事都不是「把行补齐」
# 就能清的。按电平判它，得到的就是一条永远红、谁也灭不掉的告警，而那正是这份文件开头
# 反对的东西。它的判据要等到估算器把自己每一次「因为没样本而跳过」按种类记成计数器，
# 落在那一侧，不在这一侧。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cogneva-project-control
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cogneva-project-control
      rules:
        - alert: CognevaProjectCoverageUnmeasurable
          expr: |
            sum(increase(cogneva_project_control_unmeasured_total{reading="no_baseline"}[6h])) > 0
          for: 10m
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "任务管理"
            severity: warning
          annotations:
            summary: "覆盖率这一轮没能量：6 小时里有 {{ $value }} 轮计划基线读不出来"
            description: "`cogneva_project_control_unmeasured_total{reading=\"no_baseline\"}` 在动，意思是计划基线表整张读不出来，这一轮五格覆盖率里有三格的分母一个都算不了。它不是「覆盖率是零」——那一轮根本没有读数。修的是 `task_plan` 那条读路。判据是这一格不再增长，不是这条红消失。"
