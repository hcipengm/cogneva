# 授权面：让集群内的收敛循环（部署器 Pod，SA cogneva-evolution）能把本目录
# 已交付的清单 apply 回 monitoring。这个文件**只能由安装期交付**——收敛循环
# 按构造不应用 Role/RoleBinding（一份清单能给自己长权限，就等于权限可以自我
# 扩张），所以它出现在这里、由 install.sh 应用，而循环读它只读到一条「授权面，
# 不交付」的日志。
#
# 授权范围刻意等于「本目录交付面 union」：monitors（抓取目标）、configmaps
# （Grafana 面板、Loki 配置与探针模块）、services / statefulsets（两个日志与
# 明细后端）、deployments（可达性探针本体——它没有需要保留下来的状态，用
# Deployment 而不是 StatefulSet 才是诚实的形状）、ingresses（对外入口）、
# scrapeconfigs（宿主读数生产者的抓取目标）、resourcequotas / limitranges
# （01-namespace.yaml 一起交付的命名空间配额与默认限制）。
# 没有 delete：收敛面没有删除路径，缺了它等于把
# 「删掉一个对象」这件事从循环的能力面里拿掉。Role 自身命名空间有界，管不到
# cogneva 命名空间里的任何东西。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-stack-convergence
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
    app.kubernetes.io/component: stack-convergence
rules:
  - apiGroups: [""]
    # resourcequotas / limitranges 是本目录里 01-namespace.yaml 一起交付的两件：
    # 命名空间的对象数上限与默认资源限制。它们属于 core 组，忘了给就等于每轮
    # 报一次「权限被拒」，而配额那一半在面板上看起来一直没被收敛过。
    resources: ["configmaps", "services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "scrapeconfigs", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-stack-convergence
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
    app.kubernetes.io/component: stack-convergence
subjects:
  # 跨命名空间引用：主体是 cogneva 里的 SA，授权面留在这个 Role 自己的
  # 命名空间里。
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-stack-convergence
  apiGroup: rbac.authorization.k8s.io
