# PodMonitor — 作为 ServiceMonitor 的替代方案（二选一，勿与 04 同时应用，
# 否则同一批指标被抓两份）
# 直接按 Pod 标签监控，无需经过 Service

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cogneva-pods
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - cogneva
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
