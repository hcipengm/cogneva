# 变更账本停止向前走的告警。
#
# 为什么需要：池子那几条规则（`llm_upstream_pool_down` 等）说的是**原因**，不是后果。
# 后果这一端只有一格读数在答——`cogneva_change_dispatch_verdict{decision,pool_reading}`，
# 每一次派发 pass 把两种决定 × 三种池读数共六格全写一遍，当前那一格为 1——而它此前只被
# 一块面板读（`06-grafana-dashboard-configmap.yaml`），没有任何规则读。面板与「有人看」
# 之间没有关系：2026-10-27 20:41 UTC 起这一格一直是
# `decision="paused_llm_pool_unavailable", pool_reading="unavailable"`，2110 条待派发的变更
# 一条都没动，而在告警面上只看得见池子自己在响。
#
# 它不能靠池子那条规则代替，因为两者判的不是同一件事：
#
#   - 池子响说的是「现在没有可用上游」；这一条说的是「账本已经六个小时没动」。
#   - 池子恢复之后，这一格仍可能停在 paused：`LlmPoolStatus` 的判词是**跨重启闩住**的
#     （`contract/supervisor.rs` 里写着这条：闩住的判词配上已经不在的输入，会让池子读成
#     不可用而每个上游读成健康）。那种情形下池子那条规则是 resolved，只有这一条会亮，
#     它亮的时候第一步就是去比这两格。
#
# 界取 6 小时：派发 pass 自己的退避是分钟级的（实测 2026-10-27 一整段里两次 pass 之间
# 隔 2 到 14 分钟），一次真实的池子中断从没有把两次 pass 隔开一小时过。所以「连续六小时
# 都判 paused」不再是「等下一次探测」，而是「今天这笔账不会动了」。
#
# 与待派发条数取合取，是为了让这一条只说「有活被卡住」：账本空着的时候池子不可用不欠
# 谁的账，那种状态下报警只会训练人忽略它。左式是条数，所以 `{{ $value }}` 就是被卡住的
# 那笔账有多少行——读者不用再查一次。
#
# 为什么不一起读 `cogneva_change_dispatch_readouts{readout="held_back"}`：那是这一趟自己
# 让出去的行数，随 pass 的切片大小变，与「账本动不动」不是一个问题。
#
# 为什么两半都带写者的年龄界：这两族都由共享表服务，写者停下时序列不会缺席，只会把最后
# 一笔值永久送出去。一个死在点火那一侧的 pass 会让这条规则永远亮着——账本里那 2110 行还是
# 2110 行、判词还是 paused，谁也没法把它灭掉，因为它读的已经不是账本了。所以每一处取值都要
# 与自己的伴生钟 `_observed_timestamp_seconds` 取交：`time() - 钟 < 3600`。界取一小时是写者
# 节律的两倍以上（实测两次 pass 相隔 2 到 14 分钟），健康写者在两次自己写入之间不会被读成
# 停下。写者真停下时这一条自己静下来，那一格该响的是写者本身
# （`background_loop_stalled` / `cogneva_loop_tick_age_seconds`），不是这条后果规则。
#
# 判词那半也要这一界，哪怕 `== 1` 看着像阈值：比对的另一边是个常量，所以左边的 gauge 就是
# 被判的那个量；写者停下时那一格永远停在 1，这条规则跟着永远亮。阈值位指的是「拿 gauge 当
# 界去判别的东西」，例如 `max(x) > <gauge>`——这一条里一个也没有。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cogneva-change-dispatch
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cogneva-change-dispatch
      rules:
        - alert: CognevaChangeLedgerStoppedMoving
          expr: |
            max (cogneva_change_dispatch_readouts{readout="change_ledger_pending"} and ((time() - cogneva_change_dispatch_readouts_observed_timestamp_seconds) < 3600)) > 0
              and on()
            max (cogneva_change_dispatch_verdict{decision="paused_llm_pool_unavailable"} and ((time() - cogneva_change_dispatch_verdict_observed_timestamp_seconds) < 3600)) == 1
          for: 6h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: warning
          annotations:
            summary: "变更账本已经 6 小时没有派发任何一条，还有 {{ $value }} 条在等"
            description: "派发 pass 连续判 `paused_llm_pool_unavailable`。先比两格：`llm_pool_available` 为 0 是真的没有可用上游（看 `llm_upstream_healthy`、`llm_upstream_refusal_kind`：`quota_cycle` 等上游自己声明的重置时刻 `llm_upstream_quota_reset_unix`，`entitlement` 要换凭证），为 1 则是闩住的判词与已恢复的池子分家了，那条路要清 latch 而不是等。两种情况都别逐条去动账本里的行：行上的 `blocked_reason` 是这一层写上去的，池子恢复后的下一趟 pass 会自己清。"

        # 「池子不可用」有两种，修法相反，而上面那一条对两种说同一句话：等。
        #
        #   - 有一种**等得到**：某个被拒的上游是 `quota_cycle`，而且它自己声明了窗口结束的
        #     时刻（`llm_upstream_quota_reset_unix` 在未来）。2026-10-29 现网就是这样：
        #     池里两个上游都判 `quota_cycle`，其中一个声明 2026-11-04 15:59 UTC 恢复，
        #     账本 2126 条停在那里，六天后自己会走。这种情形不该多一条红——红六天等于
        #     没有红。
        #   - 有一种**等不到**：没有任何一个被拒的上游声明未来的重置时刻。要么 `entitlement`
        #     （凭证不对，换凭证才行），要么 `quota_cycle` 而重置时刻是 0 或已经过去
        #     （窗口早该结束却还在拒，说明上游那侧的账不是按时辰结的）。这种情形下
        #     「等下一次探测」永远等不到，能结束它的只有换凭证、抬额度、或者把那个上游
        #     摘掉——三件事都是**人**做的，所以它必须单独亮。
        #
        # 判据就是这两者之差：池子不可用 ∧ 没有任何一个不可用的上游声明了未来的重置时刻。
        # 后半个条件的取法要小心「零个」：PromQL 里 `count(<空向量>)` 不产生序列，
        # 所以不能写成 `count(...) == 0`——那样在真的零个时反而是空、规则永不响，而它恰
        # 恰是唯一该响的格子。这里用 `unless`：左式（有不可用的上游）减去右式（其中声明了
        # 未来重置时刻的），还剩东西才响。
        #
        # 为什么按 `upstream` 先聚合：`llm_upstream_*` 有三处导出者（网关、主应用、进化），
        # 同一个 upstream 会被三个 Pod 各报一次，不先 `by (upstream)` 聚合的话，`and on(upstream)`
        # 会在三份副本之间做笛卡尔配对，判据变成「三个 Pod 里有一个这么说」。
        #
        # 为什么三条读数各要一个伴生钟（`_observed_timestamp_seconds`）：这一族登记在
        # `DURABLE_POOL_GAUGES` 里，网关的 `record_gauge` 写进程内的同时也写耐久面，
        # 而耐久面每次刮取都把手里最后那一笔照印一遍。导出者停下时序列不会消失、只会
        # 原地冻住：冻着的 0 让这条永久点亮而没人能熄灭它，冻着的重置时刻让「等不到」
        # 变成一句关于几天前的判词。三条都取交 `(time() - <伴生钟>) < 3600`——界宽过
        # 1800s 的写者心跳，健康的写者不会在两次自己的发布之间被读成「停了」。伴生钟
        # 取 `max` 而不是逐 `upstream`：写者是网关这一层，只要还有一处写着，这几条读数
        # 就是现时的；全都停了是 `gateway_durable_writes_failing` 那一面的红，
        # 不是池子的后果。
        #
        # `for: 1h`：一次探测周期是分钟级，而「声明了未来重置时刻」只可能因为又探了一次
        # 而变化。给一小时，是让一次刚恢复的窗口（那一刻约满、马上就能用）在 `for` 走完
        # 之前自己消失，而不是把一分钟的可恢复报成「等不到」。
        #
        # 值取的是「不可用的上游有几个」：左式是那个计数，`and`/`unless` 都保留左式的值，
        # 所以 `{{ $value }}` 是数得出来的那个数，读者不用再查一次。
        - alert: CognevaLlmPoolNoDeclaredReturn
          expr: |
            count(min by (upstream) (llm_upstream_healthy) == 0)
              and on() (min(llm_pool_available) == 0)
              and on() ((time() - max(llm_pool_available_observed_timestamp_seconds)) < 3600)
              and on() ((time() - max(llm_upstream_healthy_observed_timestamp_seconds)) < 3600)
              and on() ((time() - max(llm_upstream_quota_reset_unix_observed_timestamp_seconds)) < 3600)
                unless on()
              count(
                  (max by (upstream) (llm_upstream_quota_reset_unix) > time())
                and on(upstream)
                  (min by (upstream) (llm_upstream_healthy) == 0)
              )
          for: 1h
          labels:
            cogneva_io_managed: "true"
            cogneva_io_face: "变更管理"
            severity: warning
          annotations:
            summary: "LLM 池不可用，而且 {{ $value }} 个不可用的上游没有一个说得出什么时候恢复"
            description: "`llm_pool_available` 为 0，且每一个不可用的上游都没有声明未来的重置时刻——等下一次探测不会改变任何事，能结束它的只有三件事之一：换凭证（`llm_upstream_refusal_kind{kind=\"entitlement\"}=1` 的上游）、抬额度（`quota_cycle` 而上游那侧的账单没按时辰结）、或者把那个上游从网关的 `llm-upstreams` 里摘掉。逐条看 `llm_upstream_healthy{upstream=...}` 与 `llm_upstream_refusal_kind{upstream=...}` 定是哪一个、哪一种：两个数合起来只有一格为 1，那 `upstream` 标签就是该动的那一条。修好后这条自己会灭——判据是 `llm_pool_available` 回到 1，不是这条红消失。别去动账本里的行：行上的 `blocked_reason` 由派发那一层写，池子恢复后的下一趟 pass 会自己清。"
