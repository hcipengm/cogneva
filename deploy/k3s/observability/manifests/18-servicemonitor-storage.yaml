# 向量库的读数：qdrant 自己暴露 /metrics。
#
# 通用清单里这一项叫 LanceDB exporter，本平台不适用：向量库是 qdrant。为读一个
# 已经存在的端点再装一个进程，等于多养一个会独自坏掉的组件。
#
# 这个读数回答一个决策点：检索延迟变慢会被读成"模型变笨"——在同一个回答里它只
# 表现为答得更差，而没有任何一处指着向量库。
#
# 端口名 `http` 与 chart 里 Service 声明的端口名同一个字面量；改一侧而漏另一侧，
# 抓取目标会指向一个没人提供的端口——抓不到与"没有请求"同形。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cogneva-qdrant
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - cogneva
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
