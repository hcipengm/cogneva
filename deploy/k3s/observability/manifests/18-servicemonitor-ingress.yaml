# 入口代理的读数：谁在集群里当入口，就抓谁。
#
# 同一个平台可以装在两种入口形态上——k3s 自带 traefik，标准 k8s 通常是
# ingress-nginx——而「入口 5xx 率」这件事两边问的是同一个问题。所以这里不选一个、
# 不把平台写死，而是**两份选择器都交付**：
#
#   - 选择器匹配不到任何 Service 时，Prometheus Operator 不产生目标，也不产生
#     "target down" —— 什么都没发生。所以在一台只有 traefik 的机器上，ingress-nginx
#     那一份是安静的；反过来也一样。
#   - 反过来，如果只交付一份并把目标写死，另一台机器上就是「抓一个不存在的端口」，
#     而抓不到在面板上与"没有请求"同形：入口 5xx 率会画成一条零线，看着像一切正常。
#
# 这条规则的前提是"选择器匹配不到就安静"：如果哪天写成一个写死的地址（static
# target / 直接写 Service DNS），失败就变成 probe_success=0 那种假红。
#
# 端口名都按各自 chart 的默认值写：traefik 的 `metrics`（k3s 自带的安装里默认
# 不暴露，由 ../traefik-metrics-helmchartconfig.yaml 打开）、ingress-nginx 的
# `metrics`（chart 默认开）。
#
# traefik 这份是 **PodMonitor**，不是 ServiceMonitor：k3s 自带 chart 的
# `svc/traefik` 只暴露 `web`（80）与 `websecure`（443），9100 的 `metrics`
# **只在 Pod 上**（chart 把 `--entryPoints.metrics.address=:9100/tcp` 落在容器
# 端口表里，Service 不转它）。ServiceMonitor 的 `endpoints[].port` 必须对上
# Service 的端口名，对不上时 Prometheus Operator 不产生目标、也不报错——面板上
# 就是一条零线，与「入口没有请求」同形。PodMonitor 按 Pod 端口抓，才抓得到。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cogneva-ingress-traefik
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
---
# ingress-nginx：标准 k8s 形态的入口。命名空间按 chart 的默认值写；
# 装在别的命名空间时，这份选择器匹配不到就安静地不产生目标，而不是抓错地址。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cogneva-ingress-nginx
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
