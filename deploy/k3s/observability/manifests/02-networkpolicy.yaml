# NetworkPolicy — 商用网络隔离
# 限制 monitoring namespace 内外的网络访问
#
# 注意：首条策略对 monitoring 全体 Pod 做 ingress 默认拒绝，放行来源按标签匹配
# ingress controller。若 ingress controller 以 hostNetwork 模式运行（如本机
# ingress-nginx 的部署方式），其流量源地址是节点 IP，无法被
# namespaceSelector+podSelector 匹配，会把反代流量全部拦下。
# 因此：hostNetwork 形态暂不应用本文件（见 scripts/install.sh），
# 生产形态（controller 以 Pod 网络运行）再启用。

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许 Ingress Controller 访问 Grafana/Prometheus/Jaeger/Alertmanager
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000    # Grafana
        - protocol: TCP
          port: 9090    # Prometheus
        - protocol: TCP
          port: 9093    # Alertmanager
        - protocol: TCP
          port: 16686   # Jaeger Query
    # 允许同一 namespace 内通信
    - from:
        - podSelector: {}
  egress:
    # 允许所有出站（Prometheus 需要抓取各 namespace 指标）
    - {}
---
# 允许 cogneva 所在 namespace 的 Pod 访问 monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cogneva-to-monitoring
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cogneva
      ports:
        - protocol: TCP
          port: 9090
