# NetworkPolicy — 商用网络隔离
# 限制 monitoring namespace 内外的网络访问

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许 Ingress Controller (Traefik) 访问 Grafana/Prometheus/Jaeger/Alertmanager
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000    # Grafana
        - protocol: TCP
          port: 9090    # Prometheus
        - protocol: TCP
          port: 9093    # Alertmanager
        - protocol: TCP
          port: 16686   # Jaeger Query
    # 允许同一 namespace 内通信
    - from:
        - podSelector: {}
  egress:
    # 允许所有出站（Prometheus 需要抓取各 namespace 指标）
    - {}
---
# 允许 cogneva 所在 namespace 的 Pod 访问 monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cogneva-to-monitoring
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: default
      ports:
        - protocol: TCP
          port: 9090
