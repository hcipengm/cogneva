# 进程采集器自己的活体。
#
# 采集器是每节点一个的 DaemonSet（`process-census`），它停了以后**屏上没有任何一格
# 会变红**：拓扑面照旧画出 Pod 与容器，只是每一格里写着「采集器 N 秒前刚报过这台
# 节点，但这一拍没有它」。那句话诚实地说明了这一格为什么空，而它同时也是一个
# 「面板」——按 2026-10-23 那条实测，面板上的字与「有人看」之间没有关系：表里正
# firing 十一行、最老一行开了 5550 分钟，写者还在看，人没看。
#
# 所以这一条要能自己喊出来。读数是网关那一侧的上报计数（`process_report_ingest_total`
# 的 `node` 标签）：采集器每一拍报一批，网关按**它自报的节点名**记一格；一台停了，
# 那一格的增长就停在原地，而其它节点的流量照旧——按节点的 `increase` 是 0，按整族
# 的 `max` 却不是。两者分得开，才谈得上「哪一台停了」。
#
# 为什么不用「采集器自己把 /metrics 挂出来让 Prometheus 抓」：那要在子命令里再起一个
# HTTP 端点、再配一个 PodMonitor，而这条通道本来就已经有一跳——它每分钟往网关报一次，
# 到达时刻就是它的心跳。多一个端点只是多一个会坏的地方。
#
# 每条规则都带 `cogneva_io_managed` 与 `cogneva_io_face`：前者进告警镜像的投递名单，
# 后者回答「这一行响了该谁动」。门在 `check-alert-rule-faces.sh`。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cogneva-process-census
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cogneva-process-census
      rules:
        # 一台节点上的采集器停了：那一格在这个窗口里一次都没长过。
        #
        # 窗口取 15 分钟、`for` 再等 5 分钟：一拍是 60 秒，网关滚动时那一格会断
        # 一分钟上下，把界压到两拍以内等于把每一次正常的滚动报成故障。
        - alert: CognevaProcessCensusSilent
          expr: |
            max by (node) (
              increase(cogneva_process_report_ingest_total{outcome="accepted",node!=""}[15m])
            ) == 0
          for: 5m
          labels:
            severity: warning
            cogneva_io_managed: "true"
            cogneva_io_face: 可观测与告警
          annotations:
            summary: 节点 {{ $labels.node }} 上的进程采集器已经 15 分钟没有报到
            description: >-
              这条路读的是宿主 cgroup 树，它停了以后拓扑面上这台节点的每一个容器都会
              写着「这一拍没有它」。DaemonSet `cogneva-process-census` 在不在、在跑
              却报不上去（网络策略、网关地址变更、`COGNEVA_NODE_NAME` 空着），两种都会
              落成这一条——先看 Pod 日志里有没有连不上的回报，再看它是不是根本没起。

        # 一条采集器的上报都没有：上面那条要「有序列」才判得动，整条通道从没通、
        # 或者网关起来之后一台也没报过时，那一族里根本没有 `node` 非空的序列。
        # 缺席不会告警，所以这一条单独判它。
        - alert: CognevaProcessCensusAbsent
          expr: |
            absent(cogneva_process_report_ingest_total{outcome="accepted",node!=""})
          for: 15m
          labels:
            severity: warning
            cogneva_io_managed: "true"
            cogneva_io_face: 可观测与告警
          annotations:
            summary: 没有任何一台节点报到过进程采集器的回报
            description: >-
              网关这一侧一条带节点名的上报都没有。可能是 DaemonSet 没装（采集器这一面
              整个不在）、网关刚重启且采集器连不回来、或者采集器与网关之间的地址不对。
              这一条与上面那条的区别是：那条说「某台停了」，这条说「一台都没通过」。
