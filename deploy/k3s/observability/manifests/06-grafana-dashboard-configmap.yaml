# Grafana 面板 ConfigMap
#
# data 里每个键的值必须是**面板模型本身**（顶层就是 title/panels/...）。
# 不要写成 Grafana HTTP API `POST /api/dashboards/db` 的请求体形状
# （`{"dashboard": {...}, "overwrite": true}`）：chart 的 dashboardsConfigMaps 走的是
# file provisioning，供给器把整个文件当面板模型读，包装会让它读到空 title 并**整张丢弃**，
# 只在启动那一拍留一行 error 日志。门禁见
# crates/cogneva/tests/observability_dashboard_contract_test.rs。

apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
    grafana_dashboard: "1"
data:
  cogneva-overview.json: |
    {
      "id": null,
      "uid": "cogneva-overview",
      "title": "Cogneva Overview",
      "tags": [
        "cogneva",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 36,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(http_requests_total[5m])",
              "legendFormat": "{{method}} {{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP P99 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_bucket[5m])))",
              "legendFormat": "P99",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 3,
          "title": "LLM Call Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(llm_calls_total[5m])",
              "legendFormat": "{{model}} - {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 4,
          "title": "LLM P95 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(llm_call_latency_ms_bucket[5m]))",
              "legendFormat": "{{model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Active Alerts",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(ALERTS{alertstate=\"firing\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "yellow"
                  },
                  {
                    "value": 5,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 6,
            "y": 16
          },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"cogneva-.*\"}[5m])",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 7,
          "title": "Pod Memory Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{pod=~\"cogneva-.*\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 9,
          "title": "Agent Run Outcomes (since process start)",
          "description": "Every agent run either delivers an answer or ends with its iteration budget spent. A run that spent the budget and was then salvaged by the forced final ask counts on both series: it delivered, and it cost the most. The exhausted series is the budget table, not a failure count -- a run on it may still have produced something, and one that rose without a matching delivery is the one that bought nothing. Both series reset when the pod restarts.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "agent_success_count",
              "legendFormat": "delivered",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "agent_budget_exhausted_count",
              "legendFormat": "budget exhausted",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 10,
          "title": "Iteration Budget Cut-offs by Role",
          "description": "Runs of a role that were cut off at its iteration ceiling, split by role. Counted where the ceiling is judged spent, so a run the forced final ask then salvaged is on this series too. The ceiling itself is derived only from runs that finished on their own: a run cut off at the ceiling stopped where the ceiling said, so it measures the ceiling and is left out of that derivation. A rising series therefore says the work handed to this role is growing, not that the ceiling is too low. The second series is the subset that ended with no answer at all; a gap between the two lines is the runs the forced ask salvaged. Reset when the pod restarts.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "targets": [
            {
              "expr": "agent_iteration_budget_exhausted",
              "legendFormat": "{{role}} cut off",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "agent_iteration_budget_exhausted_no_deliverable",
              "legendFormat": "{{role}} no deliverable",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Recent Logs",
          "type": "logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "expr": "{job=\"cogneva\"} |= \"$trace_id\"",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki_datasource}"
              }
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 11,
          "title": "LLM Pool Recovery Horizon",
          "description": "How long until the pool is tried again, and on whose word. The first two series are time-to-that-instant; the third is not a countdown at all but the length of the quota window an upstream stated about itself, so a weekly window stays visible as ~604800 even while the pool keeps probing every few minutes. A horizon that keeps re-reading the same small number is our probe cadence, not an upstream promise to be back.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "clamp_min(llm_pool_evidenced_recovery_unix - time(), 0)",
              "legendFormat": "reset an upstream reported",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "clamp_min(llm_pool_next_attempt_unix - time(), 0)",
              "legendFormat": "when we probe again",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "llm_pool_quota_window_secs",
              "legendFormat": "window an upstream stated",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 12,
          "title": "Upstream Stated Quota State",
          "description": "Per upstream, what it said about its own quota, in seconds. A series pinned near 604800 is a weekly allowance that has run out, and no amount of retrying will bring it back sooner; a series at 0 on the window means that upstream has not refused with a window, not that its window is short. The reset series is the same word as time-to-that-instant, so it shows which upstream is holding the pool horizon up.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "expr": "llm_upstream_quota_window_secs",
              "legendFormat": "window stated: {{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "clamp_min(llm_upstream_quota_reset_unix - time(), 0)",
              "legendFormat": "reset stated: {{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 13,
          "title": "Upstream Failure Streaks",
          "description": "Consecutive failures per upstream, the only input to how long that upstream is backed off for. A streak that keeps climbing while the pool horizon stays small is an upstream failing for a reason it is not telling us about.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "expr": "llm_upstream_consecutive_failures",
              "legendFormat": "{{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 14,
          "title": "Verification Budget vs Last Run",
          "description": "How much room the verification and deployment budgets have left, per kind. The budget is the wall the run is killed at; the last run is how long the work actually took. Read them together: a last-run line walking up towards its budget is the warning, and it arrives while changes are still landing — the counter on the next panel only starts moving once they are not. No threshold is drawn on purpose: what counts as 'close' depends on how much the host's load varies, and a ratio picked here would be a guess that fires wrong. Both kinds are on one axis because they share a unit, not because they share a cause.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "targets": [
            {
              "expr": "cogneva_verification_budget_seconds",
              "legendFormat": "{{kind}} budget",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_verification_last_run_seconds",
              "legendFormat": "{{kind}} last run",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 15,
          "title": "Runs Killed by Their Budget",
          "description": "Runs the budget killed, per kind, since this process started. Each one is a change that was retired or rolled back without ever being judged, so the code was neither cleared nor blamed. A non-zero flat line here is history rather than a current fault; what matters is whether it is still climbing.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 56
          },
          "targets": [
            {
              "expr": "cogneva_verification_timeouts_total",
              "legendFormat": "{{kind}} killed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 32,
          "title": "LLM Upstream Pool Order",
          "description": "Where each upstream sits in the order a call tries the pool, 0 first, one line per upstream. This is the running process's order, not the one in the Secret: an upstream that has failed sinks behind everything that has not, so these lines converge on the declared order only once the last healthy upstream is gone. That convergence is the point -- it is the one state in which the declared order can be read off the process itself, which is how a reorder is confirmed instead of inferred from the Secret plus a pod-start time. Lines that move together between rollouts are a reorder that took effect; a Secret edit with these unchanged is one that did not. Every process holding the pool publisher reports this series, so the query takes the maximum by upstream the way the rest of the pool family is read; a bare selector would draw one line per reporter under the same legend.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 56
          },
          "targets": [
            {
              "expr": "max by (upstream) (llm_upstream_position)",
              "legendFormat": "{{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 16,
          "title": "Host Build Slots",
          "description": "Builds running on the host against the bound, and builds queued behind them. The bound is per host, but each process publishes its own reading of it, which is why both roles are drawn: a builder line is a process that takes slots, and a control-plane line flat at zero is a process that runs no builds and deliberately bounds nothing. Two builders whose slot directories differ bound only themselves and would both look normal here, so the dir label is on the series for whoever is comparing them by hand; the rule build_gate_not_in_force is what notices. The ceiling is what the machine could take rather than what is being admitted, and it carries the dimension that is setting it: a bound sitting below its ceiling with the dimension reading io is the control law holding back on a busy disk, and one that is at its ceiling all the way up is the machine's own size - reading cgroup_memory means the container's memory limit, not the host, is what is limiting it. Two cells of the same reading are drawn beside them. occupied is the slot files locked right now in the shared directory, so it counts every builder on this host rather than this process alone: a process admitting up to its own bound while another builds beside it reads exactly like one admitting up to its bound, and occupied beside the bound is what tells the two apart. excluded is 1 while a holder that is not a build is holding every slot to keep builds out -- a cache sweep or an image-registry restart -- and it exists because every other reading in this family answers the question a refusal raises wrongly, counting that holder as a build. Neither is alerted on, and neither is late by omission: exclusion is the mechanism this gate exists for, so a rule on it would fire on the gate working, and how long a sweep should take has no derivable answer here.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 64
          },
          "targets": [
            {
              "expr": "cogneva_build_gate_slots",
              "legendFormat": "{{role}} bound",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_ceiling",
              "legendFormat": "{{role}} ceiling ({{dimension}})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_in_flight",
              "legendFormat": "{{role}} running",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_waiting",
              "legendFormat": "{{role}} queued",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_occupied",
              "legendFormat": "{{role}} occupied",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_excluded",
              "legendFormat": "{{role}} excluded (not a build)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 17,
          "title": "Build Gate Queue and Hold",
          "description": "The two durations the bound costs, in milliseconds, against the budget a build is allowed to wait. A queue time that walks up towards the budget is the warning, and it arrives while builds are still being admitted: the refusal counter only starts moving once they are not. Hold is what a build occupies the host for, so a hold above everyone's budget starves the others whatever the slot count says. The means are per build that took a slot over the window, and they are blank when no build ran in it - that is an empty window, not a broken panel. Waits that ended in a refusal are in neither the means nor the worst wait: a refusal waited either the whole budget or no time at all, which the refusal counter already says, and folding those into the mean would let a caller that is turned away every tick drag it towards zero.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 64
          },
          "targets": [
            {
              "expr": "cogneva_build_gate_wait_budget_ms",
              "legendFormat": "{{role}} wait budget",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_wait_ms_max",
              "legendFormat": "{{role}} worst queue wait",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "rate(cogneva_build_gate_wait_ms_total[10m]) / rate(cogneva_build_gate_acquired_total[10m])",
              "legendFormat": "{{role}} mean queue wait",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_held_ms_max",
              "legendFormat": "{{role}} longest slot hold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "rate(cogneva_build_gate_held_ms_total[10m]) / rate(cogneva_build_gate_acquired_total[10m])",
              "legendFormat": "{{role}} mean slot hold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 18,
          "title": "Evolution Build Cost by Change Kind",
          "description": "What one release build costs, split by which entry point the change came from. The mean and the last build are over the builds that ended on their own: a build the budget killed has no duration of its own, so its seconds are the budget it was cut off at and are drawn separately -- a kind whose killed-build line is walking up is losing changes to its budget while still paying for them. The mean is per build over the window and is blank when no build of that kind ran in it, which is an empty window rather than a broken panel. Nothing here is summed across the kinds: a total would say builds cost time, and the decision is which kind to spend the next one on. The change kind is the same one the landing funnel counts, so build cost can be read against what those changes ended up doing; a build whose entry point was not carried to the deployer reads as unattributed.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 72
          },
          "targets": [
            {
              "expr": "sum by (intent) (rate(cogneva_evolution_build_seconds_total{outcome=~\"built|failed\"}[30m])) / sum by (intent) (rate(cogneva_evolution_build_outcomes_total{outcome=~\"built|failed\"}[30m]))",
              "legendFormat": "{{intent}} mean build",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (intent) (cogneva_evolution_build_last_seconds)",
              "legendFormat": "{{intent}} last build",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (intent) (increase(cogneva_evolution_build_seconds_total{outcome=\"timed_out\"}[1h]))",
              "legendFormat": "{{intent}} killed by budget (1h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 19,
          "title": "Evolution Build Outcomes by Change Kind",
          "description": "How the build attempts of each change kind ended, over 6h. Four classes, because they call for four different responses: built means the binary was staged; failed means cargo ran and produced nothing, so the change's own code is the thing to look at (the rule evolution_build_failed fires on this class); timed_out means the deployment budget killed it, a knob rather than a defect and already counted by deployment_killed_by_budget; unstarted means the build never reached cargo -- the host had no slot or the binary could not be spawned -- so nothing was judged and the change is still waiting. unstarted is the one class with no duration anywhere: a build that never ran has no time to report, and reporting zero seconds for it would read as a build that cost nothing.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
