        {
          "id": 38,
          "title": "Change Ledger Debt and Where It Went",
          "description": "What the change ledger's dispatch pass did with the set of changes still owed, one tick per pass. The panel is the reading the account's own record was missing: the ledger writes a row per pass to its table, and a row in a table is not a curve -- nothing served it to the metric store, so 'the debt is not coming down' had no reader and neither did the reason. The owed line is the whole pending set; the lines under it are where this pass's share of that set went: handed over, already held by a task the goal path had, refused by the goal path, killed by the environment (a task held it, every handover the budget allowed was refused, and no further one is filed), or held back (owed, no task holds it, and the pass did not hand it over: either no configured upstream could serve a request, so the pass handed nothing over at all, or the pass had already handed over its own slice of the set and left the rest for a later one). Held back and killed are the two the record could not name before: the first because a pass that handed nothing over wrote zeros in every other column, the second because the count was computed and dropped. The last line is the arithmetic as a reading -- owed minus everything accounted for -- and it has to sit at zero: a pass whose counts do not add up to the set it read is a pass that lost track of rows, which is exactly how the environment-killed ones went unrecorded. Why a tick looks the way it does is the pass's own verdict, read from cogneva_change_dispatch_verdict -- one cell per combination of decision and pool reading, the one the pass reached at 1 and the other five at 0, all six written on every pass, so the reason a debt is not moving is a reading and not an inference. The two are separate families rather than one, and that is a correction: the reason used to sit in two labels on the counts, and a label whose value moves with the tick is not part of a series' identity -- the store serves the newest row of every label set it has ever held, so each combination a pass ever reached stayed behind at its last value, and on a count that falls to zero the frozen cell was the larger one. The movement belongs in the cells, where every value of the set is rewritten each pass and none is left standing. Three lines below the arithmetic answer a different question about the same set: what the handovers left behind. Handovers on record is how many of the owed changes still have their events in the stream, and handovers with their product is how many of those left a diff. The two are read together and never as one number, because a change whose run recorded no deliverable and a change nothing was ever handed to are the same zero in either line alone, and they are opposite answers: the first is the generation segment not having produced, the second is the ledger not having dispatched. The third line is a read that did not happen -- a row whose handovers could not be read at all -- and it exists so that a failed read cannot be subtracted from the first line and reported as changes that produced nothing. Every series is a count for the whole account and is republished by whichever process holds the pass, so a reading is taken as a maximum across label sets rather than a sum: two processes publishing the same whole-account number would be counted twice by a sum, which is what the maximum is for.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 144
          },
          "targets": [
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"pending\"})",
              "legendFormat": "owed (pending)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"held_back\"})",
              "legendFormat": "held back by the pass",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"submitted\"})",
              "legendFormat": "handed over this pass",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"dead_environment\"})",
              "legendFormat": "killed by the environment",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"failed\"})",
              "legendFormat": "handover refused",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"handover_events\"})",
              "legendFormat": "handovers on record",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"handover_products\"})",
              "legendFormat": "handovers with their product",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"handover_unreadable\"})",
              "legendFormat": "handover read failed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max(cogneva_change_dispatch_readouts{readout=\"pending\"}) - max(cogneva_change_dispatch_readouts{readout=\"submitted\"}) - max(cogneva_change_dispatch_readouts{readout=\"already\"}) - max(cogneva_change_dispatch_readouts{readout=\"failed\"}) - max(cogneva_change_dispatch_readouts{readout=\"dead_environment\"}) - max(cogneva_change_dispatch_readouts{readout=\"held_back\"})",
              "legendFormat": "unaccounted for (should be zero)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_change_dispatch_verdict",
              "legendFormat": "reason: {{decision}} / pool {{pool_reading}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 39,
          "title": "Learning Recurrence: Is the Corpus Accumulating?",
          "description": "Every consultation of a recurrence threshold, bucketed by the count it was consulted on, over 6h, split by which threshold asked. `recurrence_count` is what the store holds for a learning, and it is the one column that says whether the same pattern is being seen again: a distribution sitting entirely in bucket 1 over a whole window says the pipeline detects learnings and never meets one twice, which is what the store said for three weeks while every other reading stayed green -- the increment was computed and then dropped, because the write ran after the only writer of the column. The two gates act at different counts (the hook threshold on every detected learning, the change threshold on the code-defect half), so they are drawn separately rather than summed into one distribution. Buckets stop at 4+ because the question is whether the count is climbing, not how large it gets. This is the reading a recurring-pattern claim has to cite: work that decides what to try next from what has repeated (bandit balance, benchmark freshness) reads the count, and this panel is where the count's own accumulation is visible. Ceiling: the counter belongs to one process and starts at zero again when the pod does, so read the shape over the window rather than a lifetime total, and treat a gate line pinned at zero as nothing having been counted yet rather than as a corpus that is empty.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 152
          },
          "targets": [
            {
              "expr": "sum by (gate, recurrence) (increase(cogneva_evolution_learning_recurrence_at_threshold_total[6h]))",
              "legendFormat": "{{gate}} {{recurrence}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 40,
          "title": "Orphan Reaping",
          "description": "Orphans each process has collected since it started, summed over the processes publishing it, against the ones still waiting. The gauge is what the rule orphans_unreaped watches, and it can only say a reaper has stopped: a process that reaps everything and one that reaps nothing have the same zero waiting. That reaping is happening at all is the other half of the claim and the half the gauge cannot carry, which is what this counter is for. It is summed rather than drawn per pod because the counter belongs to one process and starts again when the pod does, so what the sum answers is what this deployment has collected. There is no bound to alert on and none is wanted: collections follow the git fetches and sandbox commands that leave children behind, so a rate is a property of the workload's shape rather than of the reaper, and the number that would be needed to alert is exactly the number nobody has declared. A line that keeps climbing is the reaper working; a line that is flat while the waiting gauge is above zero is the reading that pairs with the rule.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 160
          },
          "targets": [
            {
              "expr": "increase(cogneva_orphans_reaped_total[6h])",
              "legendFormat": "collected in 6h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_process_zombies",
              "legendFormat": "waiting now",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 41,
          "title": "Consumed Streams: Pending Against Unreclaimed",
          "description": "Entries waiting on each consumed stream, split into the ones a reclaim pass would already have taken back and the rest. The two are drawn together because a queue that is busy and a queue that is stuck look alike in one number: pending counts everything on the stream, unreclaimed counts only what has been pending longer than the stream's own claim threshold. A pending line that stays up while the unreclaimed one sits near zero is churn -- work arriving and being taken -- which is a stream under load doing its job, not a defect. What makes this a panel rather than a rule is that a backlog is a property of how much arrived against how fast it is consumed, both of the workload's, and the one reading in this family a threshold can be built on is the age of the oldest unreclaimed entry, whose bound is a multiple of the reclaim policy the deployment configured -- that is the rule stream_pending_unreclaimed, and it is where a stuck consumer is alerted on. This panel is the size the rule deliberately does not judge; read it to tell a backlog that is moving from one whose age is climbing. These cells are measured on the stream's own cadence rather than the loop's, so a sweep that blocks freezes them rather than hanging the loop that writes them, and the family's last-measurement cell is the series that says the measurement itself is still running.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 160
          },
          "targets": [
            {
              "expr": "cogneva_stream_pending_count",
              "legendFormat": "{{stream}} pending",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_stream_pending_unreclaimed_count",
              "legendFormat": "{{stream}} unreclaimed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 42,
          "title": "Host Slices: Page Cache Against Anonymous",
          "description": "Page cache and other file-backed memory held under each host slice, beside the anonymous memory sharing the same cell. They are published separately on purpose, and drawing them together is what the separation is for: a slice's total is anonymous plus file-backed plus a kernel remainder, so a slice under pressure from page cache and one under pressure from a process's own heap read the same on any total. The rule in this family reads the anonymous cell only -- host_slice_anon_floor_unmeasured, a floor held flat over fifteen minutes -- because anonymous memory does not fall on its own while page cache does, which is what makes a floor on it mean something a floor on the total would not. So read this panel as the second half of that rule rather than as a second threshold: a file line rising under a slice the rule has flagged says the pressure is cache, and a file line flat while the anonymous line climbs says it is the process. Neither line has a bound to alert on: how much page cache a host should be carrying follows what it reads, and these slices are the host's own rather than a workload's.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 168
          },
          "targets": [
            {
              "expr": "cogneva_host_slice_file_bytes",
              "legendFormat": "{{slice}} file-backed ({{node}})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_host_slice_anon_bytes",
              "legendFormat": "{{slice}} anonymous ({{node}})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 43,
          "title": "Background Loop Roles: Holders Against the Books",
          "description": "Who holds each single-writer role, and whether the books that record the handovers add up. A loop declared once per deployment takes a lease on the role it guards, so the holders line is 1 for the process holding it and 0 for one that asked and was refused, summed over the processes publishing it: a loop whose work nobody holds and one whose every replica is standing down both read as a flat zero here, and the declaration -- which no line on this panel shows -- is what separates them. That is why a rule rather than a threshold reads it (background_loop_role_unowned). The books line is the arithmetic the alert asserts, drawn signed on purpose: terms taken, minus terms lost, minus the holder reading, which is zero while the three agree. A positive value is a term counted as taken that the holder reading does not show; a negative one is a term whose ending was counted and whose taking never was. The rule reads the absolute value only, because a comparison operator in PromQL hands back the left operand's value and a negative mismatch would fall out of its condition -- the sign lives here and nowhere else, which is why this panel is not optional. Read either sign beside the third line: asks that came back unanswered in the last hour are what makes the holder reading absent rather than zero, and while that is so the arithmetic has nothing to compare and the rules over it are quiet by design, so an unanswered ask with the books line flat is the cause and the silence together. The counts belong to one process and start again when the pod does, so a mismatch does not outlive the pod it happened in: a line that returns to zero after a restart is a defect that went with its process, and one that comes back on the next pod is a defect that keeps happening.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 176
          },
          "targets": [
            {
              "expr": "sum by (loop) (cogneva_loop_owner_held)",
              "legendFormat": "{{loop}} holders",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (loop) (cogneva_loop_owner_acquisitions_total) - sum by (loop) (cogneva_loop_owner_losses_total) - sum by (loop) (cogneva_loop_owner_held)",
              "legendFormat": "{{loop}} books, signed (should be zero)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (loop) (increase(cogneva_loop_owner_probe_failures_total[1h]))",
              "legendFormat": "{{loop}} asks unanswered in 1h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 44,
          "title": "Stream Consumers: Loops, Silence and Refused Reads",
          "description": "Read health of every stream consumer, one line per stream and consumer group. Three readings are drawn together because none of them decides anything alone. Silence is how long the worst read loop under that name has gone without an answer from the bus -- a consumer with nothing to deliver is still answered every block, so a line drifting past a multiple of cogneva_stream_read_block_seconds is failing rather than idle, and this line is what the rule stream_consumer_stalled reads. Refused reads is what keeping up cost, split by the cause the bus itself reported: a nogroup refusal is either a group that does not exist yet, which the next attempt wins, or one that is gone for good, which the loop retries against until the pod is replaced, and the server answers the same code for both. The pooled count is the sum over the cause label and is not something a threshold can be written on: on a live series it steps from zero to a handful inside the first seconds of a new pod and then holds there for the rest of that pod's life, so greater than zero stays true until the carrier is replaced and a rate over the window reads that replacement as the noise going away. What is decidable is the pair -- a name whose refusal line keeps climbing while its silence line stays flat is a consumer retrying its way through, and one whose silence line climbs while the refusals stay put is a loop nothing is answering any more. Loops is how many read loops are behind the name, and it is the reading the other two cannot state: one loop failing slowly and eighteen failing the same way publish the same silence and the same rate, and an experiment watched on this name is watched against whichever loops happened to report. The three aggregate differently on purpose and the difference is the point: cost is what every loop under the name paid, so both the refusals and the population are summed over the pods reporting them, while silence is a state and is taken as the worst value, because a sum of silences would rise with the population and an average would let a broken loop hide behind healthy ones. Every process publishes these for its own loops, so all three queries aggregate by stream and consumer group rather than selecting bare.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 184
          },
          "targets": [
            {
              "expr": "max by (stream, consumer_group) (cogneva_stream_read_silent_seconds)",
              "legendFormat": "{{stream}}/{{consumer_group}} silent",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (stream, consumer_group, reason) (increase(cogneva_stream_read_failures_total[1h]))",
              "legendFormat": "{{stream}}/{{consumer_group}} refused in 1h ({{reason}})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (stream, consumer_group) (cogneva_stream_read_loops)",
              "legendFormat": "{{stream}}/{{consumer_group}} loops",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 45,
          "title": "Promotion Outcomes by Week",
          "description": "Where the promotion channel's own weekly tally lands. The report behind it aggregates the promotion ledger by ISO week and counts how each entry of that week ended -- promoted, rolled back, failed, pending, awaiting review -- and before this series none of those numbers reached a face a monitor could read: the report itself is a file under reports/ that someone has to open, the decline alert writes only the audit stream and only while the trend is falling, and the stall alert carries the same five counts but only ever while stalled and only into the persisted-alert table, which is the table the in-process watcher writes its own rows to. Read the five cells of a week together, because a promoted count of zero means one thing when the other four are zero as well -- nothing was generated -- and another when they are not, changes having been generated and left sitting in review or in flight; those want opposite repairs, and the promoted line alone cannot tell them apart. A week stops moving when it ends rather than when the channel goes quiet: the reporter rewrites every week of its window on every cycle, and the store keeps serving the last value written for a label set, so an ended week's cells stand at the counts it finished with and their _observed_timestamp_seconds companions are what say whether a cell is being rewritten or has settled. The window is the report's own, eight weeks, and its period is the same week, which is the order of the retention this Prometheus is configured with -- the oldest weeks fall out of the query window while newer ones arrive, so the left edge of this panel moves on its own. Each week is one account-wide number written by whichever process holds the pass: the lines are reduced by week rather than summed, so two replicas reporting the same count are not added together.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 192
          },
          "targets": [
            {
              "expr": "max by (week) (cogneva_promotion_week_changes{outcome=\"promoted\"})",
              "legendFormat": "{{week}} promoted",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (week) (cogneva_promotion_week_changes{outcome=\"rolled_back\"})",
              "legendFormat": "{{week}} rolled back",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (week) (cogneva_promotion_week_changes{outcome=\"failed\"})",
              "legendFormat": "{{week}} failed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (week) (cogneva_promotion_week_changes{outcome=\"pending\"})",
              "legendFormat": "{{week}} pending (decided, still in flight)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (week) (cogneva_promotion_week_changes{outcome=\"awaiting_review\"})",
              "legendFormat": "{{week}} awaiting review",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        }
      ],
