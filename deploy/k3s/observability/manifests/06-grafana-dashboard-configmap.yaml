# Grafana 面板 ConfigMap
#
# data 里每个键的值必须是**面板模型本身**（顶层就是 title/panels/...）。
# 不要写成 Grafana HTTP API `POST /api/dashboards/db` 的请求体形状
# （`{"dashboard": {...}, "overwrite": true}`）：chart 的 dashboardsConfigMaps 走的是
# file provisioning，供给器把整个文件当面板模型读，包装会让它读到空 title 并**整张丢弃**，
# 只在启动那一拍留一行 error 日志。门禁见
# crates/cogneva/tests/observability_dashboard_contract_test.rs。

apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
    grafana_dashboard: "1"
data:
  cogneva-overview.json: |
    {
      "id": null,
      "uid": "cogneva-overview",
      "title": "Cogneva Overview",
      "tags": [
        "cogneva",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 36,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(http_requests_total[5m])",
              "legendFormat": "{{method}} {{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP P99 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_bucket[5m])))",
              "legendFormat": "P99",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 3,
          "title": "LLM Call Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(llm_calls_total[5m])",
              "legendFormat": "{{model}} - {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 4,
          "title": "LLM P95 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(llm_call_latency_ms_bucket[5m]))",
              "legendFormat": "{{model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Active Alerts",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(ALERTS{alertstate=\"firing\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "yellow"
                  },
                  {
                    "value": 5,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 6,
            "y": 16
          },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"cogneva-.*\"}[5m])",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 7,
          "title": "Pod Memory Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{pod=~\"cogneva-.*\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 9,
          "title": "Agent Run Outcomes (since process start)",
          "description": "Every agent run ends either by delivering an answer or by spending its whole iteration budget without writing one. A rising exhausted count means tokens are being paid for runs that produce nothing. Both series reset when the pod restarts.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "agent_success_count",
              "legendFormat": "delivered",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "agent_budget_exhausted_count",
              "legendFormat": "budget exhausted",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 10,
          "title": "Iteration Budget Cut-offs by Role",
          "description": "Runs of a role that were cut off at its iteration ceiling, split by role. The ceiling is derived from that role's own delivered runs, so a series that keeps rising says the derivation is not keeping up with the work this role is being handed. A cut-off run is total: nothing delivered, everything spent. Reset when the pod restarts.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "targets": [
            {
              "expr": "agent_iteration_budget_exhausted",
              "legendFormat": "{{role}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Recent Logs",
          "type": "logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "expr": "{job=\"cogneva\"} |= \"$trace_id\"",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki_datasource}"
              }
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 11,
          "title": "LLM Pool Recovery Horizon",
          "description": "How long until the pool is tried again, and on whose word. The first two series are time-to-that-instant; the third is not a countdown at all but the length of the quota window an upstream stated about itself, so a weekly window stays visible as ~604800 even while the pool keeps probing every few minutes. A horizon that keeps re-reading the same small number is our probe cadence, not an upstream promise to be back.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "clamp_min(llm_pool_evidenced_recovery_unix - time(), 0)",
              "legendFormat": "reset an upstream reported",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "clamp_min(llm_pool_next_attempt_unix - time(), 0)",
              "legendFormat": "when we probe again",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "llm_pool_quota_window_secs",
              "legendFormat": "window an upstream stated",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 12,
          "title": "Upstream Stated Quota State",
          "description": "Per upstream, what it said about its own quota, in seconds. A series pinned near 604800 is a weekly allowance that has run out, and no amount of retrying will bring it back sooner; a series at 0 on the window means that upstream has not refused with a window, not that its window is short. The reset series is the same word as time-to-that-instant, so it shows which upstream is holding the pool horizon up.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "expr": "llm_upstream_quota_window_secs",
              "legendFormat": "window stated: {{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "clamp_min(llm_upstream_quota_reset_unix - time(), 0)",
              "legendFormat": "reset stated: {{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 13,
          "title": "Upstream Failure Streaks",
          "description": "Consecutive failures per upstream, the only input to how long that upstream is backed off for. A streak that keeps climbing while the pool horizon stays small is an upstream failing for a reason it is not telling us about.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "expr": "llm_upstream_consecutive_failures",
              "legendFormat": "{{upstream}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 14,
          "title": "Verification Budget vs Last Run",
          "description": "How much room the verification and deployment budgets have left, per kind. The budget is the wall the run is killed at; the last run is how long the work actually took. Read them together: a last-run line walking up towards its budget is the warning, and it arrives while changes are still landing — the counter on the next panel only starts moving once they are not. No threshold is drawn on purpose: what counts as 'close' depends on how much the host's load varies, and a ratio picked here would be a guess that fires wrong. Both kinds are on one axis because they share a unit, not because they share a cause.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "targets": [
            {
              "expr": "cogneva_verification_budget_seconds",
              "legendFormat": "{{kind}} budget",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_verification_last_run_seconds",
              "legendFormat": "{{kind}} last run",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 15,
          "title": "Runs Killed by Their Budget",
          "description": "Runs the budget killed, per kind, since this process started. Each one is a change that was retired or rolled back without ever being judged, so the code was neither cleared nor blamed. A non-zero flat line here is history rather than a current fault; what matters is whether it is still climbing.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 56
          },
          "targets": [
            {
              "expr": "cogneva_verification_timeouts_total",
              "legendFormat": "{{kind}} killed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 16,
          "title": "Host Build Slots",
          "description": "Builds running on the host against the bound, and builds queued behind them. The bound is per host, but each process publishes its own reading of it, which is why both roles are drawn: a builder line is a process that takes slots, and a control-plane line flat at zero is a process that runs no builds and deliberately bounds nothing. Two builders whose slot directories differ bound only themselves and would both look normal here, so the dir label is on the series for whoever is comparing them by hand; the rule build_gate_not_in_force is what notices.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 64
          },
          "targets": [
            {
              "expr": "cogneva_build_gate_slots",
              "legendFormat": "{{role}} bound",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_in_flight",
              "legendFormat": "{{role}} running",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_waiting",
              "legendFormat": "{{role}} queued",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 17,
          "title": "Build Gate Queue and Hold",
          "description": "The two durations the bound costs, in milliseconds, against the budget a build is allowed to wait. A queue time that walks up towards the budget is the warning, and it arrives while builds are still being admitted: the refusal counter only starts moving once they are not. Hold is what a build occupies the host for, so a hold above everyone's budget starves the others whatever the slot count says. The means are per build that took a slot over the window, and they are blank when no build ran in it - that is an empty window, not a broken panel. Waits that ended in a refusal are in neither the means nor the worst wait: a refusal waited either the whole budget or no time at all, which the refusal counter already says, and folding those into the mean would let a caller that is turned away every tick drag it towards zero.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 64
          },
          "targets": [
            {
              "expr": "cogneva_build_gate_wait_budget_ms",
              "legendFormat": "{{role}} wait budget",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_wait_ms_max",
              "legendFormat": "{{role}} worst queue wait",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "rate(cogneva_build_gate_wait_ms_total[10m]) / rate(cogneva_build_gate_acquired_total[10m])",
              "legendFormat": "{{role}} mean queue wait",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_gate_held_ms_max",
              "legendFormat": "{{role}} longest slot hold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "rate(cogneva_build_gate_held_ms_total[10m]) / rate(cogneva_build_gate_acquired_total[10m])",
              "legendFormat": "{{role}} mean slot hold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 18,
          "title": "Evolution Build Cost by Change Kind",
          "description": "What one release build costs, split by which entry point the change came from. The mean and the last build are over the builds that ended on their own: a build the budget killed has no duration of its own, so its seconds are the budget it was cut off at and are drawn separately -- a kind whose killed-build line is walking up is losing changes to its budget while still paying for them. The mean is per build over the window and is blank when no build of that kind ran in it, which is an empty window rather than a broken panel. Nothing here is summed across the kinds: a total would say builds cost time, and the decision is which kind to spend the next one on. The change kind is the same one the landing funnel counts, so build cost can be read against what those changes ended up doing; a build whose entry point was not carried to the deployer reads as unattributed.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 72
          },
          "targets": [
            {
              "expr": "sum by (intent) (rate(cogneva_evolution_build_seconds_total{outcome=~\"built|failed\"}[30m])) / sum by (intent) (rate(cogneva_evolution_build_outcomes_total{outcome=~\"built|failed\"}[30m]))",
              "legendFormat": "{{intent}} mean build",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (intent) (cogneva_evolution_build_last_seconds)",
              "legendFormat": "{{intent}} last build",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum by (intent) (increase(cogneva_evolution_build_seconds_total{outcome=\"timed_out\"}[1h]))",
              "legendFormat": "{{intent}} killed by budget (1h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 19,
          "title": "Evolution Build Outcomes by Change Kind",
          "description": "How the build attempts of each change kind ended, over 6h. Four classes, because they call for four different responses: built means the binary was staged; failed means cargo ran and produced nothing, so the change's own code is the thing to look at (the rule evolution_build_failed fires on this class); timed_out means the deployment budget killed it, a knob rather than a defect and already counted by deployment_killed_by_budget; unstarted means the build never reached cargo -- the host had no slot or the binary could not be spawned -- so nothing was judged and the change is still waiting. unstarted is the one class with no duration anywhere: a build that never ran has no time to report, and reporting zero seconds for it would read as a build that cost nothing.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 72
          },
          "targets": [
            {
              "expr": "sum by (intent, outcome) (increase(cogneva_evolution_build_outcomes_total[6h]))",
              "legendFormat": "{{intent}} {{outcome}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 20,
          "title": "Container OOM Kills by Pod",
          "description": "Which containers the kernel killed at their memory cap, and how much they restarted, over 6h. kube-state-metrics carries the reason of a container's last termination as a state, not as a counter: a container killed at its cap holds OOMKilled until it stops cleanly, so one that dies every couple of hours never moves the state and is invisible to any rate over it -- the clickhouse instance in monitoring was killed five times inside one hour that way. The kill line is the restart count of containers whose last exit was an OOM kill; the second line is every restart, and the gap between them says how much of the churn was the cap rather than the code. Nothing is scoped to a namespace, because the same kill is the same defect wherever it runs. pod_oom_killed fires on the state; this panel is where the state and the count can be read together, and the memory-against-limit panel is where the containers about to be counted show up first.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 80
          },
          "targets": [
            {
              "expr": "sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[6h]) and on(namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"} > 0))",
              "legendFormat": "{{pod}}/{{container}} OOM kills (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "topk(10, sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[6h])))",
              "legendFormat": "{{pod}}/{{container}} restarts (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 21,
          "title": "Container Memory Against Its Limit",
          "description": "How much of the memory limit each container is using, over 6h. Only containers that have a limit: an unbounded container is not near anything, and the division drops the ones given none. This is the reading container_memory_near_limit's floor was derived from -- the killed observability backend sat between 0.74 and 0.93 of its cap for hours, its own burst amplitude crossing the rest, while nothing else in the cluster came near -- so a container holding above three quarters here is one burst away from being killed at its limit, which is what the OOM panel counts. No threshold is drawn on purpose: what counts as close is the alert's decision, and a second copy of it here would be a constant to keep in step with the first.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 80
          },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{container!=\"\", container!=\"POD\"} / on(namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\"} > 0)",
              "legendFormat": "{{pod}}/{{container}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 22,
          "title": "Build Cache Bytes by Layer",
          "description": "What the shared build cache holds, divided by layer, over 6h. This is the reading a cache cap has to be checked against: every change built adds to this directory and nothing removed anything from it, so the first sign of it filling its volume was a build failing on a full disk, whose only remedy is dropping the whole cache and paying a cold rebuild of every workspace. A layer is a directory two levels inside the cache: the deps and .fingerprint halves are compiled results, where dropping them is the cold rebuild, while incremental and build are speed and scratch space whose loss costs a slower next build -- which is why the division is by layer rather than one total. other is published on every scrape, so a zero there is the normal reading (cargo's own layout stays under the published cap) and a rising one is a cache that grew a shape nothing planned for. Kept per directory, not summed into one number: the same path is mounted from different volumes in the builder and the executor, the cap is a volume's property, and the dir label is what tells those two apart.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 88
          },
          "targets": [
            {
              "expr": "sum by (dir, layer) (cogneva_build_target_bytes)",
              "legendFormat": "{{dir}} {{layer}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 23,
          "title": "Build Cache Measurement Age",
          "description": "How long ago the build cache was measured, and how long ago a pass last removed anything from it, both over 6h. A walk that fails keeps the last reading instead of publishing a smaller one, because a smaller number would read as a cache that shrank -- so the sizes alone cannot tell a cache nothing is writing to from a scan loop that stopped walking it. The first series is what separates them: a flat size with a rising age is an unmeasured cache, and the same flat size with the age staying near the scan interval is a cache that is idle but watched. The second is the same question one step further on, about the pass rather than the walk: a cache that is over its cap and whose last paying pass is hours old is a cap that stopped being enforced -- which looks exactly like a cap that was never needed if you only read the size. It carries no value until a pass has run, so an absent line means no pass has ever paid down this directory. No threshold is drawn, as elsewhere: what counts as stale is the interval the deployment configured, which a panel cannot read.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 88
          },
          "targets": [
            {
              "expr": "cogneva_build_target_bytes_scan_age_seconds",
              "legendFormat": "{{dir}} since last walk",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "time() - cogneva_build_target_last_reclaim_seconds",
              "legendFormat": "{{dir}} since last pass that paid",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 24,
          "title": "Build Cache Against Its Cap",
          "description": "What the shared build cache holds, what it is allowed to hold, and what a pass did about the difference, over 6h. The cap is a volume's budget, so it is published per directory and never summed across them; the same path is mounted from different volumes in the builder and the executor. An unset cap reads as a flat zero rather than as a missing line, which is what makes 'measured but not capped' distinguishable from 'nobody measured it' -- the measurement age panel is the second half of that pair. over by is the part of what is held that the cap says should not be there; unmet is the part of it that a pass could not reach, because one file per layer is kept so that a layer that emptied is not indistinguishable from one the walk could not see. A rising unmet that never comes down is the one reading that means the cap cannot be met at its current value, and it is the reading a smaller cap makes larger. reclaimed (6h) is what passes actually freed, so a cap being enforced and a cap holding because nothing grew look different here.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 96
          },
          "targets": [
            {
              "expr": "sum by (dir) (cogneva_build_target_bytes)",
              "legendFormat": "{{dir}} held",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_bytes_cap",
              "legendFormat": "{{dir}} cap",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_over_limit_bytes",
              "legendFormat": "{{dir}} over by",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_unmet_bytes",
              "legendFormat": "{{dir}} unmet",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "increase(cogneva_build_target_reclaimed_bytes_total[6h])",
              "legendFormat": "{{dir}} reclaimed (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 25,
          "title": "Build Cache Over-Cap Outcomes (6h)",
          "description": "How each over-cap pass ended, counted over 6h and split by outcome. The four are the four different things a reader can do about it, which is why they are not folded into one number: reclaimed means the cap was reached and nothing is owed, unmet means the cache could not be brought down to the cap at its current value, busy means a build held the slot and the pass deferred rather than deleting under a running build, and ungated means no build gate was in force so no pass ran at all. Only the first is a cache at its cap; the other three are each a different reason no bytes moved, and a single 'over cap' count would read them as one.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 96
          },
          "targets": [
            {
              "expr": "sum by (outcome) (increase(cogneva_build_target_over_cap_total[6h]))",
              "legendFormat": "{{outcome}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 26,
          "title": "Background Loop Liveness",
          "description": "How long since each background loop last reached the top of its cycle, against the period that loop declared for itself, over 6h. A loop has no parent task: when it panics or returns early it is simply gone, and every series it published stops being written -- which from Prometheus reads exactly like a subsystem with nothing to report. So liveness is read here, from a stamp the loop leaves behind, with the age computed when the scrape arrives; a loop that died stops stamping and its age keeps climbing on its own. The declared period is on the panel for the same reason it is not a constant in the alert rule: what counts as stalled is a loop's own cadence, and a loop with no cadence publishes zero and is not judged this way -- a consumer waiting on an empty queue and one stuck inside a handler look the same from here, and the queue's own readings are what separate them. A rising age whose deaths line stays at zero is a loop stuck inside one iteration; both rising is a loop that is gone. Every process that runs the loop draws its own line, and the same loop name in two pods is two lines: one pod's loop dying is not the other's.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 104
          },
          "targets": [
            {
              "expr": "cogneva_loop_tick_age_seconds",
              "legendFormat": "{{loop}} since last cycle",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_loop_period_seconds",
              "legendFormat": "{{loop}} declared period (0 = no cadence)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 27,
          "title": "Background Loop Deaths and Census",
          "description": "Background loops that ended while their process was still running, and the census of loops each process started, over 6h. registered is 1 for every loop a process started and 0 for none, so the lines are the loop population of each process: a loop missing from a process that should run it is a plugin or a role that changed, and a count that drops between two deploys is a loop that left the code. deaths counts loops that returned early or panicked, classified against the shutdown their process was asked for -- a clean stop is not counted. Zero is published for every loop that never died, which is why a deaths line at zero is drawn at all: 'never happened' and 'not being counted' are otherwise the same silence. Nothing restarts a dead loop in place, so a deaths line that rises stays up until that process restarts, and the loop's other readings disappear at the same moment -- this panel is where that disappearance gets an explanation.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 104
          },
          "targets": [
            {
              "expr": "cogneva_loop_registered",
              "legendFormat": "{{loop}} registered (1 = this process runs it)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_loop_deaths_total",
              "legendFormat": "{{loop}} deaths",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        }
