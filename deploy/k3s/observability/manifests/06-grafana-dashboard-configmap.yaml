        },
        {
          "id": 20,
          "title": "Container OOM Kills by Pod",
          "description": "Which containers the kernel killed at their memory cap, and how much they restarted, over 6h. kube-state-metrics carries the reason of a container's last termination as a state, not as a counter: a container killed at its cap holds OOMKilled until it stops cleanly, so one that dies every couple of hours never moves the state and is invisible to any rate over it -- the clickhouse instance in monitoring was killed five times inside one hour that way. The kill line is the restart count of containers whose last exit was an OOM kill; the second line is every restart, and the gap between them says how much of the churn was the cap rather than the code. Nothing is scoped to a namespace, because the same kill is the same defect wherever it runs. pod_oom_killed fires on the state; this panel is where the state and the count can be read together, and the memory-against-limit panel is where the containers about to be counted show up first.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 80
          },
          "targets": [
            {
              "expr": "sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[6h]) and on(namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"} > 0))",
              "legendFormat": "{{pod}}/{{container}} OOM kills (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "topk(10, sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[6h])))",
              "legendFormat": "{{pod}}/{{container}} restarts (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 21,
          "title": "Container Memory Against Its Limit",
          "description": "How much of the memory limit each container is holding that the kernel cannot take back, over 6h -- anonymous pages against the limit kube-state-metrics reports. Only containers that have a limit: an unbounded container is not near anything, and the division drops the ones given none. This is the same reading container_memory_near_limit judges, on the same numerator, so the panel and the alert cannot drift apart. Divide the working set instead and the panel is flat against the ceiling and says nothing: each of the three large containers on this platform reaches 0.9998 to 1.0000 of its cap on usage, because a working set counts reclaimable page cache, while the shares drawn here are 0.78 (the app), 0.59 (the sandbox executor) and 0.24 to 0.39 (the evolution container). A container holding above three quarters here is one burst away from being killed at its limit, which is what the OOM panel counts. No threshold is drawn on purpose: what counts as close is the alert's decision, and a second copy of it here would be a constant to keep in step with the first. The alert's own threshold is not re-derived either -- it is carried over from a band measured on the working set (the killed observability backend sat between 0.74 and 0.93 of its cap for hours), so treat it as a carried-over number until someone measures one here.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 80
          },
          "targets": [
            {
              "expr": "container_memory_rss{container!=\"\", container!=\"POD\"} / on(namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\"} > 0)",
              "legendFormat": "{{pod}}/{{container}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 22,
          "title": "Build Cache Bytes by Layer",
          "description": "What the shared build cache holds, divided by layer, over 6h. This is the reading a cache cap has to be checked against: every change built adds to this directory and nothing removed anything from it, so the first sign of it filling its volume was a build failing on a full disk, whose only remedy is dropping the whole cache and paying a cold rebuild of every workspace. A layer is a directory two levels inside the cache: the deps and .fingerprint halves are compiled results, where dropping them is the cold rebuild, while incremental and build are speed and scratch space whose loss costs a slower next build -- which is why the division is by layer rather than one total. other is published on every scrape, so a zero there is the normal reading (cargo's own layout stays under the published cap) and a rising one is a cache that grew a shape nothing planned for. Kept per directory, not summed into one number: the same path is mounted from different volumes in the builder and the executor, the cap is a volume's property, and the dir label is what tells those two apart.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 88
          },
          "targets": [
            {
              "expr": "sum by (dir, layer) (cogneva_build_target_bytes)",
              "legendFormat": "{{dir}} {{layer}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 23,
          "title": "Build Cache Measurement Age",
          "description": "How long ago the build cache was measured, how long ago a pass last removed anything from it, and how long it has been over its cap, all over 6h. A walk that fails keeps the last reading instead of publishing a smaller one, because a smaller number would read as a cache that shrank -- so the sizes alone cannot tell a cache nothing is writing to from a scan loop that stopped walking it. The first series is what separates them: a flat size with a rising age is an unmeasured cache, and the same flat size with the age staying near the scan interval is a cache that is idle but watched. The second is the same question one step further on, about the pass rather than the walk, and it is the one pair on this panel whose two lines are read together: a cache that is over its cap and whose last paying pass is hours old is a cap that stopped being enforced -- which looks exactly like a cap that was never needed if you only read the size. It carries no value until a pass has run, so an absent line means no pass has ever paid down this directory. The third is what makes the second's reading honest, because it is the same question asked of the cache rather than of the pass: the age of the last pass grows while the cache sits under its cap, since a cache that needs no pass earns a long age by being fine, where this line stays at zero and only leaves it once a walk has found the cache over and no later walk has found it under. A long second line with a zero third is a cap that is not being exercised; a long second line with the third following it up is a cap that is not holding. No threshold is drawn, as elsewhere: what counts as stale is the interval the deployment configured, which a panel cannot read.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 88
          },
          "targets": [
            {
              "expr": "cogneva_build_target_bytes_scan_age_seconds",
              "legendFormat": "{{dir}} since last walk",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "time() - cogneva_build_target_last_reclaim_seconds",
              "legendFormat": "{{dir}} since last pass that paid",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_over_cap_seconds",
              "legendFormat": "{{dir}} over its cap for",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 24,
          "title": "Build Cache Against Its Cap",
          "description": "What the shared build cache holds, what it is allowed to hold, and what a pass did about the difference, over 6h. The cap is a volume's budget, so it is published per directory and never summed across them; the same path is mounted from different volumes in the builder and the executor. An unset cap reads as a flat zero rather than as a missing line, which is what makes 'measured but not capped' distinguishable from 'nobody measured it' -- the measurement age panel is the second half of that pair. over by is the part of what is held that the cap says should not be there; unmet is the part of it that a pass could not reach, because one file per layer is kept so that a layer that emptied is not indistinguishable from one the walk could not see. A rising unmet that never comes down is the one reading that means the cap cannot be met at its current value, and it is the reading a smaller cap makes larger. reclaimed (6h) is what passes actually freed, so a cap being enforced and a cap holding because nothing grew look different here.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 96
          },
          "targets": [
            {
              "expr": "sum by (dir) (cogneva_build_target_bytes)",
              "legendFormat": "{{dir}} held",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_bytes_cap",
              "legendFormat": "{{dir}} cap",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_over_limit_bytes",
              "legendFormat": "{{dir}} over by",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_build_target_unmet_bytes",
              "legendFormat": "{{dir}} unmet",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "increase(cogneva_build_target_reclaimed_bytes_total[6h])",
              "legendFormat": "{{dir}} reclaimed (6h)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 25,
          "title": "Build Cache Over-Cap Outcomes (6h)",
          "description": "How each over-cap pass ended, counted over 6h and split by outcome. The four are the four different things a reader can do about it, which is why they are not folded into one number: reclaimed means the cap was reached and nothing is owed, unmet means the cache could not be brought down to the cap at its current value, busy means a build held the slot and the pass deferred rather than deleting under a running build, and ungated means no build gate was in force so no pass ran at all. Only the first is a cache at its cap; the other three are each a different reason no bytes moved, and a single 'over cap' count would read them as one.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 96
          },
          "targets": [
            {
              "expr": "sum by (outcome) (increase(cogneva_build_target_over_cap_total[6h]))",
              "legendFormat": "{{outcome}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 26,
          "title": "Background Loop Liveness",
          "description": "How long since each background loop last reached the top of its cycle, against the period that loop declared for itself, over 6h. A loop has no parent task: when it panics or returns early it is simply gone, and every series it published stops being written -- which from Prometheus reads exactly like a subsystem with nothing to report. So liveness is read here, from a stamp the loop leaves behind, with the age computed when the scrape arrives; a loop that died stops stamping and its age keeps climbing on its own. The declared period is on the panel for the same reason it is not a constant in the alert rule: what counts as stalled is a loop's own cadence, and a loop with no cadence publishes zero and is not judged this way -- a consumer waiting on an empty queue and one stuck inside a handler look the same from here, and the queue's own readings are what separate them. A rising age whose deaths line stays at zero is a loop stuck inside one iteration; both rising is a loop that is gone. Every process that runs the loop draws its own line, and the same loop name in two pods is two lines: one pod's loop dying is not the other's.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 104
          },
          "targets": [
            {
              "expr": "cogneva_loop_tick_age_seconds",
              "legendFormat": "{{loop}} since last cycle",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_loop_period_seconds",
              "legendFormat": "{{loop}} declared period (0 = no cadence)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 27,
          "title": "Background Loop Deaths, Restarts and Census",
          "description": "Background loops that ended while their process was still running, the ones that were run again after a panic, and the census of loops each process started, over 6h. registered is 1 for every loop a process started and 0 for none, so the lines are the loop population of each process: a loop missing from a process that should run it is a plugin or a role that changed, and a count that drops between two deploys is a loop that left the code. deaths counts loops that returned early or panicked with their restart budget spent, classified against the shutdown their process was asked for -- a clean stop is not counted. restarts counts panics that were run again in place; the loop is alive at the moment it is counted, and it is drawn here because a repaired loop publishes every series it had, so on every other panel it looks like a loop that never stopped. The two lines are read together: restarts alone is a panic the supervisor absorbed, deaths alone is a loop that chose to end, both is a loop that kept panicking until the budget ran out and is now gone. Zero is published for every loop that never died or never restarted, which is why a line at zero is drawn at all: 'never happened' and 'not being counted' are otherwise the same silence. Once the budget is spent nothing runs the loop again, so a deaths line that rises stays up until that process restarts, and the loop's other readings disappear at the same moment -- this panel is where that disappearance gets an explanation.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 104
          },
          "targets": [
            {
              "expr": "cogneva_loop_registered",
              "legendFormat": "{{loop}} registered (1 = this process runs it)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_loop_deaths_total",
              "legendFormat": "{{loop}} deaths",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "cogneva_loop_restarts_total",
              "legendFormat": "{{loop}} restarts (panicked, run again)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 28,
          "title": "Registry Store Against Its Declaration",
          "description": "Bytes the cluster's image registry store holds, against the size its claim declares, over 6h. This reading comes from the store's own API rather than from a walk: the store is written by the registry image, so no process of ours can walk it, and the only writer here is the deployer pod, which asks the registry which blobs its tags reference and dedupes them by digest. What is measured is therefore tag-referenced blob bytes -- store metadata and blobs no tag points at are not in the number, so a store whose tags were pruned reads smaller here before the bytes are actually freed. The declaration is drawn beside it because it is not a ceiling: nothing enforces a PVC's requests.storage, and when this line crosses that one the alert fires. The growth is one layer set per revision, because each image is built from the previous revision's image, so every earlier tag keeps the whole chain alive -- which is why dropping old tags alone reclaims almost nothing until a build stops chaining off the last revision. Delete is disabled on the store, so nothing reclaims by itself.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 112
          },
          "targets": [
            {
              "expr": "max by (persistentvolumeclaim) (cogneva_data_volume_used_bytes{persistentvolumeclaim=~\"cogneva-.*\"})",
              "legendFormat": "{{persistentvolumeclaim}} measured by its owner",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "max by (persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=~\"cogneva-.*\"})",
              "legendFormat": "{{persistentvolumeclaim}} declared",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 29,
          "title": "Registry Store Tag Accumulation",
          "description": "How many tags the cluster's image registry store holds, over 6h. Every promotion leaves a main-* tag behind and the floating local tag is rewritten in place, so this line rises once per revision deployed and is the driver of the panel beside it: the store holds a layer set per tag while the images keep chaining off one another. A tag count that keeps rising with the bytes flat is the shape a re-base would make -- new tags whose layers are mostly shared with the seed rather than with the previous revision -- and a tag count that stops rising while the bytes keep rising is the reverse, tags being reused with new content under them. Nothing prunes this store today, so neither shape has been observed yet and this line is what would tell them apart.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 112
          },
          "targets": [
            {
              "expr": "cogneva_registry_tag_count",
              "legendFormat": "tags in the store (one per promoted revision plus the floating tag)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 30,
          "title": "Registry Store Measurement Age",
          "description": "How long ago the registry store was measured, over 6h. A walk that fails -- the registry restarting, a manifest the API refuses to serve -- keeps the last reading rather than publishing a smaller one, because a smaller number would read as a store that shrank; so the size alone cannot tell a store nothing writes to from a probe that stopped asking. This series is what separates them: a flat size with a rising age is an unmeasured store, and the same flat size with the age staying near the scan interval is a store that is idle but watched. No threshold is drawn, as elsewhere: what counts as stale is the interval the deployment configured, which a panel cannot read.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 120
          },
          "targets": [
            {
              "expr": "cogneva_registry_scan_age_seconds",
              "legendFormat": "seconds since the store was last measured",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 31,
          "title": "LLM Tokens by Actor (input / output / cached)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 120
          },
          "targets": [
            {
              "expr": "sum by (actor, kind) (increase(llm_tokens_total[1h]))",
              "legendFormat": "{{actor}} {{kind}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 33,
          "title": "Tool Output Characters Dropped by Truncation",
          "description": "How much of a tool's output the conversation never carried, by tool, over 1h: the sum of what each cut left out, deduplicated across the fleet the way every store-backed counter here is (the store serves one row to every reader, so a sum over the scrapes would multiply by the number of pods). This is the half the cut count cannot answer -- one result cut by ten characters and one cut by a hundred thousand are one increment each on the count -- and it is what says whether oversized tool results are eating the context budget or are a rare shape. Read it over the count rather than instead of it: a tool whose count is flat and whose characters climb is one whose outputs got bigger, and one where both climb together is a tool being asked for more than it used to be. A cut is expected traffic, not a fault -- a task that asks for a whole file crosses the window share on purpose -- so no threshold is drawn. What is a fault is a cut whose tail could not be stored, and that is the panel beside this one.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 128
          },
          "targets": [
            {
              "expr": "max by (tool) (increase(cogneva_tool_output_truncated_chars_total[1h]))",
              "legendFormat": "{{tool}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 34,
          "title": "Tool Output Landed in Raw",
          "description": "The share of a tool's truncated outputs whose tail actually reached the Raw layer, by tool, over 1h -- one reading of the mechanism, not two series a reader has to combine. Every cut ends in exactly one of two ways: the full text was stored and the truncation marker carries an artifact:// reference, or it was not and the failure is counted under a cause. So the share that landed is the truncation count minus the failure count over the truncation count, and a line below 1 is cuts whose tail exists nowhere -- the model saw the marker and the part it did not see is gone for good, since nothing retries it. A flat 1 is every cut recoverable, and a series that is absent is a tool nothing was cut from (increase over an empty window publishes no series at all, so absence here means no cut rather than a lost reading). The failure counter beside it, and the alert on it, carry the cause that names the repair: unconfigured (no memory API base), unreachable (the API did not answer), refused (it answered and rejected the write), unkeyed (the run carried no task id, so no source name existed to file the tail under and no attempt was made). The last one is why the share is read here rather than derived: without it in the count, those cuts would read as landed. The arithmetic is exact only while both series carry the same tool labels, so the panel and the alert read the same pair.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 128
          },
          "targets": [
            {
              "expr": "1 - (max by (tool) (increase(cogneva_tool_output_archive_failed_total[1h])) / max by (tool) (increase(cogneva_tool_output_truncated_total[1h])))",
              "legendFormat": "{{tool}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 35,
          "title": "Memory Entries Dropped from the Searchable Layer",
          "description": "How many entries the memory decay loop took out of the searchable layer, by namespace, over 24h. Entries, not passes: the pass counter beside this on the alert face counts rounds, and a round that dropped ten entries and one that dropped one are the same increment there -- this is the only reading that answers how much memory is actually being given up, which is the quantity a decay policy is chosen for. The cause is repeated decay: an entry's importance halves per pass and it leaves once it falls through the floor, so a rising line here is the loop working rather than failing, and no threshold is drawn -- whether the rate is too high is a question about the policy, not about this series. An entry that is merely demoted is not here, since it is still searchable; an explicit delete is not here either, because a delete call reports success whatever it found and no caller in this build runs one, so a count taken there would count requests rather than entries. The series is store-served, so the maximum by namespace is taken rather than a sum: every memory-owning deployment writes the same series and a sum would multiply by the number of readers. Absence means nothing was dropped in the window, and a line that goes flat while the loop's own pass counter keeps moving is a namespace with nothing left to give up.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 136
          },
          "targets": [
            {
              "expr": "max by (namespace) (increase(cogneva_memory_dropped_entries_total[24h]))",
              "legendFormat": "{{namespace}}",
              "datasource": {
