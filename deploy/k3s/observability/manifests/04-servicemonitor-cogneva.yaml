# ServiceMonitor — 让 Prometheus 自动发现 cogneva 指标端点
# 匹配 cogneva 命名空间内标签为 app.kubernetes.io/name=cogneva 的 Service
# （主应用 Service 的 8080 端口名为 http，/metrics 已验证可用）。

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cogneva-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cog-observability
spec:
  namespaceSelector:
    matchNames:
      - cogneva
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
