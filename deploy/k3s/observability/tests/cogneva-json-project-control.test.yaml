# 项目控制回路那条规则的实例测试夹具：一条只发读数、不往图里放活的回路，
# 量不出来的时候有没有人知道。
#
# 规则读的是这条回路自己的系列 `cogneva_project_control_unmeasured_total`（每一轮量不出来的
# 原因），它和五个覆盖格子一起发。这条规则要守的形状是「坏掉时一切安静」：基线读不到，
# 五个覆盖格全发零，面板上和「图上一行计划都没有」一模一样。
#
# 规则在部署配置的进程内 watcher 那一库，不在 PrometheusRule 清单里，所以这里点名规则名，
# 由跑者从 `deploy/helm/cogneva/files/cogneva.json` 按名字取正文（连同它自己的 `condition`）：
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-project-control.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: project_control_has_no_baseline

evaluation_interval: 1m

tests:
  # 回路在跑、量得着：必须安静。这是「不会白红」的那一半——对着一片零也要响的规则，
  # 响的时候就没有人再看了。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_baseline",pod="cogneva-0"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: project_control_has_no_baseline
        exp_alerts: []

  # 基线读不到：按存在判，`reading` 留着把读者送去 `task_plan` 那张表。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_baseline",pod="cogneva-0"}'
        values: '0x5 1x65'
    alert_rule_test:
      - eval_time: 30m
        alertname: project_control_has_no_baseline
        exp_alerts:
          - exp_labels:
              severity: warning
              reading: no_baseline
