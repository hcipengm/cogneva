# promtool 规则单测：进程采集器那两条告警**真的会 firing**。
#
# 为什么要有这一层：两条结构门只看表达式形状，一条把 `for:` 写成 `15y`、把窗口写成
# `[0m]` 的规则在它们眼里完全合法，而它永远不会亮。这里让 Prometheus 自己的规则引擎
# 跑一遍：先造序列，断言「界之前不许响、界之后必须响」，每条都带一格反向证据。
#
# 跑法：bash deploy/scripts/test-acceptance-census-alert-rules.sh \
#         deploy/k3s/observability/manifests/20-prometheusrule-process-census.yaml \
#         deploy/k3s/observability/tests/20-prometheusrule-process-census.test.yaml
#
# `rule_files` 由跑者重写：promtool 只认裸的 `groups:`，不认 PrometheusRule 这个 CRD。
rule_files:
  - ../manifests/20-prometheusrule-process-census.yaml

evaluation_interval: 1m

tests:
  # 一、采集器 Pod 起来了、也在报：两条都不许响。
  # 这是整份夹具的负对照——没有它，「永远响」与「判对了」在读数上一样。
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_ready{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'cogneva_process_report_ingest_total{outcome="accepted",node="node-a"}'
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaProcessCensusDown
        exp_alerts: []
      - eval_time: 30m
        alertname: CognevaProcessCensusSilent
        exp_alerts: []

  # 二、采集器一个都没起来：`for: 10m` 之前不许响，之后必须响。
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_ready{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '0x200'
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 5m
        alertname: CognevaProcessCensusDown
        exp_alerts: []
      - eval_time: 15m
        alertname: CognevaProcessCensusDown
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 可观测与告警
              # 两边都 `max by (namespace, daemonset)`：KSM 自己的 Pod 名不在结果里。
              namespace: cogneva
              daemonset: cogneva-process-census
            # 这里不断言注释：promtool 不展开模板，`{{ $value }}` 一律渲染成空串，
            # 断言注释只会断言到「模板没跑」，而不是「模板写对了」。注释的正确性由
            # 部署后的第一次真 firing 验。
      # 一条上报序列都没有时，按节点的 `increase` 判不动——那条规则不许用「0」冒充
      # 「没有」。
      - eval_time: 15m
        alertname: CognevaProcessCensusSilent
        exp_alerts: []

  # 三、两台节点，一台还在报、一台停了：只有停了的那台该响。
  # 这一格同时是负对照——活着的 node-a 计数一直在长，`increase == 0` 对它不成立。
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_ready{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'cogneva_process_report_ingest_total{outcome="accepted",node="node-a"}'
        values: '0+60x200'
      - series: 'cogneva_process_report_ingest_total{outcome="accepted",node="node-b"}'
        values: '40x200'
    alert_rule_test:
      # 停下来的头几分钟还不该响：一次网关滚动也会让这一格断一分钟上下。
      - eval_time: 5m
        alertname: CognevaProcessCensusSilent
        exp_alerts: []
      - eval_time: 40m
        alertname: CognevaProcessCensusSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 可观测与告警
              # `max by (node)` 只留聚合键：告警行上不会有 `outcome`。
              node: node-b
      # Pod 是好的，就不许报「没在跑」。
      - eval_time: 40m
        alertname: CognevaProcessCensusDown
        exp_alerts: []

  # 四、旧形状的网关：上报计数根本没有 `node` 这一维。
  # 采集器的 Pod 好好地在跑，这条规则必须**不响**——它在这时判不动，判不动就不许喊。
  # 假警的代价见清单文件头：2026-10-27 那次 `absent(node!="")` 就是这么响的。
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_ready{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="cogneva",daemonset="cogneva-process-census"}'
        values: '1x200'
      - series: 'cogneva_process_report_ingest_total{outcome="accepted"}'
        values: '0+60x200'
      - series: 'cogneva_process_report_ingest_total{outcome="refused"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 40m
        alertname: CognevaProcessCensusSilent
        exp_alerts: []
      - eval_time: 40m
        alertname: CognevaProcessCensusDown
        exp_alerts: []
