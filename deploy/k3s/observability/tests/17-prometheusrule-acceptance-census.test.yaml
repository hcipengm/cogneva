# promtool 规则单测：验收普查那四条告警**真的会 firing**，不是「表达式算出来非零」。
#
# 为什么必须有这一层：两条结构门（subjects / join-shape）只看表达式的形状，一条把
# `for:` 写成 `for: 15y` 或者把窗口写成 `[0m]` 的规则在它们眼里完全合法，而它永远不会
# 亮。这里用 Prometheus 自己的规则引擎跑一遍：先造序列，再断言告警从「空」走到
# 「pending」再走到「firing」，并且每个方向都有一格反向证据（该不亮的时候确实没亮）。
#
# 跑法：bash deploy/scripts/test-acceptance-census-alert-rules.sh
#       （本地没有 promtool 时它会从 apt 取一份到临时目录，取不到就退 3——看不了不是一致）
#
# `rule_files` 这一行由跑的人重写：promtool 只认裸的 `groups:` 文件，不认 PrometheusRule
# 这个 CRD（`apiVersion`/`spec` 都会判成未知字段）。所以 `deploy/scripts/test-acceptance-
# census-alert-rules.sh` 从**清单本身**把 `spec.groups` 抽到临时文件再改指过去——规则
# 只有一份，测试读的就是它。
rule_files:
  - ../manifests/17-prometheusrule-acceptance-census.yaml

evaluation_interval: 1m

tests:
  # 一、规格在说谎：stale 从 0 跳到 2，`for: 15m` 之前必须是空，之后必须 firing。
  # 反向证据在同一格里：20m 时还要是空（这条规则不是「一有数就响」）。
  # 两条红都在自己那片干净路径上（`own_scope_clean`），所以压制条件不成立。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x15 2x40'
      - series: 'cogneva_acceptance_items{verdict="ok"}'
        values: '80x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_clean"}'
        values: '0x15 2x45'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_dirty"}'
        values: '0x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_unknown"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts: []
      - eval_time: 20m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts: []
      - eval_time: 40m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"
              verdict: stale
      # 同一份输入下另外两条不许响：一份 stale 读数不代表读数不见了、也不代表它停了。
      - eval_time: 40m
        alertname: CognevaAcceptanceCensusAbsent
        exp_alerts: []
      - eval_time: 40m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts: []

  # 二、负对照：stale 一直是 0（其余判词再多也不红），这条规则全程不许响。
  # 没有这一格，把表达式写成 `>= 0` 也能过上面那一格。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x60'
      - series: 'cogneva_acceptance_items{verdict="pending"}'
        values: '11x60'
      - series: 'cogneva_acceptance_items{verdict="unjudged"}'
        values: '24x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts: []

  # 三、读数整条不见了：序列先有（前十拍，0 条 stale），然后**停了**。
  # 最后一拍在 10m，窗口 35m ＋ for 5m ⇒ 50m 才该亮；30m 时不许亮。
  # 这一格必须「先有后无」：一条从头到尾都没有的序列在合成世界里一开始就满足
  # `absent_over_time`，那样测不到「停了多久才算停」。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x10 _x50'
      - series: 'cogneva_acceptance_present'
        values: '1x10 _x50'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaAcceptanceCensusAbsent
        exp_alerts: []
      - eval_time: 55m
        alertname: CognevaAcceptanceCensusAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"

  # 四、读数还在但不更新：年龄越过 1800 秒，`for: 10m` 之后亮；越过之前不亮。
  # 这一格是「停产的 beat 一直发最后一行」的唯一证据——另外两条对它都是哑的。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '300x25 2000x35'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts: []
      - eval_time: 45m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"

  # 五、规格说它已落、判据却说不出话：`landed_unjudgeable` 从 0 跳到 3，`for: 30m` 之前
  # 必须是空，之后必须 firing。反向证据在这一格里有两条：20m 时还空（不是一有数就响），
  # 以及同一份输入下 `stale` 不许跟着响（判据说不出话不是判据说不过）。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_landed_unjudgeable'
        values: '0x10 3x40'
      - series: 'cogneva_acceptance_items{verdict="ok"}'
        values: '80x50'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaAcceptanceLandedUnjudgeable
        exp_alerts: []
      - eval_time: 45m
        alertname: CognevaAcceptanceLandedUnjudgeable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"
      - eval_time: 45m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts: []

  # 六、负对照：`landed_unjudgeable` 一直是 0，这条规则全程不许响。
  # 没有这一格，把表达式写成 `>= 0` 也能过上面那一格。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_landed_unjudgeable'
        values: '0x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: CognevaAcceptanceLandedUnjudgeable
        exp_alerts: []

  # 七、`CognevaAcceptanceCensusOld` 要分得清「正在跑」与「没跑成」。一趟普查现在可以
  # 合法地跑一个多小时（2026-10-27 实测 3623 秒，历史最长 2593），年龄越过 1800 秒时
  # 刷新**正在跑**不许响——不修这一格，每一趟合法的普查都会自己叫一次（00:08 真响过）。
  # 反向证据在同一格里：年龄一样、`running` 为 0 的那一刻必须仍然 firing。
  # 第四条用例（上面那格）没有 `running` 这条序列，它同样必须 firing——生产者漏发新格时
  # 的代价只能是多响一次，不是永久静音。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '2000x60'
      - series: 'cogneva_acceptance_refresh_running_seconds'
        values: '0x20 2400x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"
      - eval_time: 45m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts: []

  # 八、豁免必须有上界：一把卡死的锁会一直「正在跑」，没有上界时这套豁免会顺便把这条
  # 规则永久关掉。超过 5400 秒（90 分钟）就不再豁免。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '0x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '2000x60'
      - series: 'cogneva_acceptance_refresh_running_seconds'
        values: '6000x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaAcceptanceCensusOld
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"

  # 九、每一条红都落在**它自己读的那片路径**的未提交改动上 ⇒ 不响。
  # 这是这条规则唯一的静音条件，也是它存在的理由：三条会话同写一棵树，别人正在飞的改动
  # 会被普查读成「规格与代码对不上」，等他们提交完那几条自己就消失了。没有这一格，把
  # 压制条件整段删掉、或者把 `cause=~` 写成永远为真的正则，两种改法都能过上面所有格。
  # 反向证据是同一条序列在第十格里换成 `clean` 就必须响。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '2x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_clean"}'
        values: '0x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_dirty"}'
        values: '2x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_unknown"}'
        values: '0x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts: []

  # 十、成因是 `unknown`（取不出这条判据读的路径）⇒ 照响。判不了成因不是清白：2026-10-29
  # 那两条真实的红（deploy-admission A8、resource-ledger-service A1）scope 就是取不出来的，
  # 把它们压下去等于把真矛盾一起压掉。这一格和第九格只差一个 `cause` 的取值，所以它同时
  # 是「压制只对 dirty 生效」的反向证据。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '2x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_clean"}'
        values: '0x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_dirty"}'
        values: '0x60'
      - series: 'cogneva_acceptance_stale_causes{cause="own_scope_unknown"}'
        values: '2x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"
              verdict: stale

  # 十一、成因那一族整条缺席 ⇒ 照响。旧快照、生产者换版、或者哪天普查把这格停了，这几种
  # 情况下「没有成因序列」与「没有红落在干净路径上」长得一模一样；把缺席读成干净就是这套
  # 系统反复栽过的那个形状。宁可多响一次，不可永久静音。
  - interval: 1m
    input_series:
      - series: 'cogneva_acceptance_items{verdict="stale"}'
        values: '2x60'
      - series: 'cogneva_acceptance_age_seconds'
        values: '30x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: CognevaAcceptanceSpecStale
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "落地≠生效"
              verdict: stale
