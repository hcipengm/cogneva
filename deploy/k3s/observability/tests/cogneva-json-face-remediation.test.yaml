# 面漂移里「修复目标交不出去」那条规则的夹具。
#
# 为什么需要：面红着的时候，漂移读数只印一个红。「修复已经进了队列、有人在做了」与
# 「连一个修的人都没被叫到」在这个红上完全同形——2026-10-31 读代码实测，派发那一支
# 只有一条 `warn!`，日志之外没有任何一格。漂移循环每 120 秒重试一次，交出去的那一次
# 不进计数，所以这条计数只在**拒收**时动。
#
# 格子：
#   一格「计数从未出现」：规划器一直收单子，懒计数器没被创建——规则必须静。这一格判的是
#     「缺席不等于出事」，与「拒收」分开；
#   一格「计数平着」：有这条序列但一直没涨，规则也静（判的是增量，不是存在）；
#   一格「一分钟一次、连续一小时」：规划器一直没收单子，规则响，且只带 severity 一个标签。
#
# 跑法：
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-face-remediation.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: face_remediation_could_not_be_submitted

evaluation_interval: 1m

tests:
  # 一、没人拒收过：序列根本不存在。规则必须静——「没被拒」与「没创建」在计数器上同形，
  # 把缺席读成红就是让每一次干净的部署都报一次警。
  - interval: 1m
    input_series:
      - series: 'cogneva_governance_face_state{face="任务管理",state="on_target",namespace="cogneva"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: face_remediation_could_not_be_submitted
        exp_alerts: []

  # 二、序列在、值是平的：有进程写了 0 或写着同一个值，增量是 0。规则静。
  - interval: 1m
    input_series:
      - series: 'cogneva_face_drift_dispatch_failures_total{namespace="cogneva",pod="cogneva-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: face_remediation_could_not_be_submitted
        exp_alerts: []

  # 三、每分钟被拒一次，连续一小时：一刻钟那条界早就越过了。规则响。
  - interval: 1m
    input_series:
      - series: 'cogneva_face_drift_dispatch_failures_total{namespace="cogneva",pod="cogneva-1"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: face_remediation_could_not_be_submitted
        exp_alerts:
          - exp_labels:
              severity: warning
