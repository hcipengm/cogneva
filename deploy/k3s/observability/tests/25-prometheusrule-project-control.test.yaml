# promtool 规则单测：项目面（任务管理）覆盖率量不出来时的判据**真的会 firing**，
# 而且只在它该响的时候响。
#
# 为什么要有这一层：这条的结构是 `sum(increase(...[6h])) > 0`。结构门只判得出
# 「这条读了那序列」，判不出它在什么时候出现。
#   * `> 0` 写成 `>= 0`：没有序列时它不响，但有序列且恒为 0 时**永远响**；
#   * 把 `{reading="no_baseline"}` 写成不带过滤的选择器：任意一格量不出来都点亮它；
#   * 把 `[6h]` 换成无穷或去掉 `increase()` 直接读计数器：响一次之后永不安静。
# 所以每一格都配了反向证据：红的落点是「该响没响」与「该安静没安静」两种。
#
# 这条回路原来还有两条规则（派发失败、成本读不到），随重规划回路一起去掉了：回路不再
# 往图里放活，token 账也不再是它读的东西。夹具只证明清单里存在的规则。
#
# 覆盖那几格（`coverable_rows` / `covered_rows` / `coverage_measured_unix`）在这份夹具里
# 一格都没有，因为清单里没有读它们的规则：它们的判据落在估算器那一侧，理由写在那份
# 清单的头注释里。
#
# 跑法：bash deploy/scripts/test-acceptance-census-alert-rules.sh \
#         deploy/k3s/observability/manifests/25-prometheusrule-project-control.yaml \
#         deploy/k3s/observability/tests/25-prometheusrule-project-control.test.yaml
rule_files:
  - ../manifests/25-prometheusrule-project-control.yaml

evaluation_interval: 1m

tests:
  # 一、一次读不出基线：在 30 分钟那一刻长出 1。
  # 前半格是反向证据——刚长上去就响，等于把一次瞬时抖动报成事故（`for: 10m` 就是这一档）。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_baseline"}'
        values: '0x30 1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []
      - eval_time: 35m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []
      - eval_time: 45m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "任务管理"

  # 二、窗口滚过去之后自己安静：这才是「一直失败一直亮、失败过一阵子就灭掉」。
  # 没有这一格，`[6h]` 写成无穷（或直接读计数器）也照样绿，而那条红再没人能熄。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_baseline"}'
        values: '0x30 1x400'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "任务管理"
      - eval_time: 400m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []

  # 三、干净的负对照：回路每轮都在跑、量得着，全程不许响。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_baseline"}'
        values: '0x420'
      - series: 'cogneva_project_control_coverable_rows{kind="task_baseline"}'
        values: '0x200 3917x220'
      - series: 'cogneva_project_control_covered_rows{kind="task_baseline"}'
        values: '0x200 2385x220'
    alert_rule_test:
      - eval_time: 60m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []
      - eval_time: 400m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []

  # 四、别的 `reading` 格不许把它点亮：这一条守的是 `reading=` 选择器。
  # 去掉选择器，任意一格量不出来都会让这条亮，而修的地方完全不同。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_control_unmeasured_total{reading="no_ledger"}'
        values: '0x420'
    alert_rule_test:
      - eval_time: 60m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []
      - eval_time: 400m
        alertname: CognevaProjectCoverageUnmeasurable
        exp_alerts: []
