# 凭证面、备份面与盘余量那十一格告警的证明，用 promtool 的真引擎跑真表达式。
#
# 输入取自现网真实读数（2026-10-29 20:2x 读 Prometheus）：凭证面 source=host 周期
# 21600 s／年龄 5332 s、source=live 周期 1800 s／年龄 865 s，两路 aligned=1、
# unreadable=0、measured=1；备份包 owner_uid=1001、age 30904 s、reading_state{ok}=1；
# 根盘 margin 207.7 天、trigger_line_readable=1。会响的格只把该动的那个数推过界。
#
# 三条「不响」的格不只是凑数：`Stale` 与 `Drift` 都做除法／多路 `on(source)` 连接，
# 写坏的典型是在健康数据上恒响（连接键打错、`and` 写成 `or`）；`OwnerWrong` 判的是
# `!= 1001`，而「序列不在」与「等于 1001」在它上面同为静默——静格把这一条钉在
# 「序列在且正确」上，缺席那一面由别的门管。
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: 凭证面年龄超过周期六倍会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '130000x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '21600x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceStale
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              source: host
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 安全与凭证

  - name: 凭证面两路都在周期内不会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '5332x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '21600x40'
      - series: 'cogneva_host_credential_surface_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '865x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1800x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceStale
        exp_alerts: []

  - name: 有判词但某一源读不出周期会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '21600x40'
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceCadenceUnknown
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              source: live
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 安全与凭证

  - name: 两源周期都读得出来时不会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '21600x40'
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1800x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceCadenceUnknown
        exp_alerts: []

  - name: 凭证面从没跑成过会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceNeverRan
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              source: host
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 安全与凭证

  - name: 凭证面跑成过就不会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceNeverRan
        exp_alerts: []

  - name: 判成不一致（aligned=0 而读得到）会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_aligned{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '0x40'
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceDrift
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              source: host
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 安全与凭证

  - name: 现网那一拍（两源都对齐）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_aligned{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '0x40'
      - series: 'cogneva_host_credential_surface_aligned{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_measured{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '1x40'
      - series: 'cogneva_host_credential_surface_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="live"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceDrift
        exp_alerts: []

  - name: 判不出来（unreadable=1）会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceUnreadable
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              source: host
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 安全与凭证

  - name: 读得到时不会响
    interval: 1m
    input_series:
      - series: 'cogneva_host_credential_surface_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",source="host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostCredentialSurfaceUnreadable
        exp_alerts: []

  - name: 备份包属主不是 1001 会响（恢复那天才暴露）
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_owner_uid{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageOwnerWrong
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 持久化存储

  - name: 现网那一拍（owner 1001）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_owner_uid{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1001x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageOwnerWrong
        exp_alerts: []

  - name: 备份包读不到会响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_reading_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="unreadable"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageUnreadable
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              state: unreadable
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 持久化存储

  - name: 没有备份包会响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_reading_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="empty"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageMissing
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              state: empty
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 持久化存储

  - name: 现网那一拍（state=ok）两条都不响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_reading_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="ok"}'
        values: '1x40'
      - series: 'cogneva_backup_package_reading_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="unreadable"}'
        values: '0x40'
      - series: 'cogneva_backup_package_reading_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="empty"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageUnreadable
        exp_alerts: []
      - eval_time: 30m
        alertname: CognevaBackupPackageMissing
        exp_alerts: []

  - name: 备份包超过 26 小时会响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '100000x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageStale
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 持久化存储

  - name: 现网那一拍（8.6 小时前那一份）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_backup_package_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '30904x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaBackupPackageStale
        exp_alerts: []

  - name: 余量已经为负会响（离触发线已经过去）
    interval: 1m
    input_series:
      - series: 'disk_trend_days_to_trigger_margin{instance="cogneva",job="cogneva-host-readings",mountpoint="/",node="cogneva"}'
        values: '-5x40'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaHostDiskRunwayShort
        exp_alerts:
          - exp_labels:
              mountpoint: /
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 资源泄漏与长稳

  - name: 现网那一拍（余量 207.7 天）不会响
    interval: 1m
    input_series:
      - series: 'disk_trend_days_to_trigger_margin{instance="cogneva",job="cogneva-host-readings",mountpoint="/",node="cogneva"}'
        values: '207.7x160'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaHostDiskRunwayShort
        exp_alerts: []

  - name: 触发线读不出来会响
    interval: 1m
    input_series:
      - series: 'disk_trend_trigger_line_readable{instance="cogneva",job="cogneva-host-readings",mountpoint="/",node="cogneva"}'
        values: '0x160'
    alert_rule_test:
      - eval_time: 150m
        alertname: CognevaHostDiskTriggerLineUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 资源泄漏与长稳

  - name: 触发线读得出来不会响
    interval: 1m
    input_series:
      - series: 'disk_trend_trigger_line_readable{instance="cogneva",job="cogneva-host-readings",mountpoint="/",node="cogneva"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 150m
        alertname: CognevaHostDiskTriggerLineUnreadable
        exp_alerts: []
