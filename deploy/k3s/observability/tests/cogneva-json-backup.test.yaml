# 备份那二十七条读数的单测夹具。它们守的是「持久化还能不能恢复」：最近一次成功多久了、
# 从来没成功过、CronJob 停了或被挂起、演练跑没跑/多久没跑/跑失败、保留策略漏留、
# 离站副本写没写/是不是最新/缺没缺包/密钥老不老、跑得超过自己的期限、跑被放弃、
# 成功没记账、包缩水。
#
# 这一族的规则几乎每条都带**新鲜度腿**（`(time() - …_observed_timestamp_seconds) < 1800`）：
# 读数停在半小时前时值再大也不算，那是写者不在，不是当前坏。第二格专门把所有观测时间戳
# 停在起点、值全部越过界——十八条读数规则必须全静。删掉任何一条新鲜度腿，这一格会先红。
#
# 另有五条是「反事实」形状——**该有的那一半没发生**才响：
#   - `backup_never_succeeded`：有失败、窗口里没有成功。
#   - `backup_nothing_ever_recorded`：CronJob 建了很久、四种读数都在写且都是 0。
#   - `backup_restore_drill_never_ran` / `backup_offsite_copy_never_written` /
#     `backup_offsite_repository_is_never_observed`：CronJob 建了很久、那条读数**从来没出现过**。
#   - `backup_success_not_recorded`：CronJob 说自己成功过、读数里 26 小时没有一次成功。
# 每条都配了「两半都在」的静格（第一格），或在与它同形的升格格里断言静。
#
# 26 小时的界都在 `interval: 1h` 的格子里问，求值点取 30h——promtool 的 `time()` 从
# 测试起点（零）算起，所以 CronJob 的创建/调度时间取 0 就是「三十小时前」。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-backup.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

