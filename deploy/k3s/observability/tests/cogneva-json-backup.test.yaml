        values: '20x60'
      - series: 'cogneva_backup_run_readings{readout="keep_target"}'
        values: '14x60'
      - series: 'cogneva_backup_run_readings{readout="oldest_kept_age_seconds"}'
        values: '1500000x60'
      - series: 'cogneva_backup_run_readings{readout="drill_latest_age_seconds"}'
        values: '100000x60'
      - series: 'cogneva_backup_run_readings{readout="drill_latest_ok"}'
        values: '0x60'
      - series: 'cogneva_backup_run_readings{readout="drill_window_unproven_packages"}'
        values: '3x60'
      - series: 'cogneva_backup_run_readings{readout="offsite_newest_age_seconds"}'
        values: '100000x60'
      - series: 'cogneva_backup_run_readings{readout="offsite_matches_volume"}'
        values: '0x60'
      - series: 'cogneva_backup_run_readings{readout="offsite_missing_packages"}'
        values: '1x60'
      - series: 'cogneva_backup_run_readings{readout="offsite_remote_newest_age_seconds"}'
        values: '100000x60'
      - series: 'cogneva_backup_run_readings{readout="offsite_repository_key_age_seconds"}'
        values: '8000000x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="latest_success_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="oldest_running_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="oldest_running_deadline_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_abandoned"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="volume_packages"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="kept"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="keep_target"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="oldest_kept_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="drill_latest_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="drill_latest_ok"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="drill_window_unproven_packages"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_newest_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_matches_volume"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_missing_packages"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_remote_newest_age_seconds"}'
        values: '3500x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_repository_key_age_seconds"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: backup_no_recent_success
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 60m
        alertname: backup_restore_drill_is_stale
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 60m
        alertname: backup_restore_drill_failed
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_restore_drill_window_has_unproven_packages
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_volume_package_count_disagrees_with_the_last_run
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_offsite_copy_is_stale
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 60m
        alertname: backup_offsite_copy_is_not_the_latest_package
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_offsite_copy_missing_from_window
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_offsite_remote_copy_is_stale
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 60m
        alertname: backup_offsite_repository_key_is_old
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_run_over_its_own_deadline
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_run_abandoned
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_retention_left_more_than_its_target
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: backup_oldest_package_past_its_retention
        exp_alerts:
          - exp_labels:
              severity: warning
      # 仓库观测这条读数根本没出现：`has_no_snapshot` 的第一腿就不成立，静。
      - eval_time: 60m
        alertname: backup_offsite_repository_has_no_snapshot
        exp_alerts: []

  # 有三次失败、一次成功都没有：`never_succeeded` 亮。同一格里
  # `nothing_ever_recorded` 静——它在跑、在失败，不是「什么都没记」。CronJob 创建时间
  # 与四种读数全在场、且都新鲜：只有这样它的静才归「失败数不为零」解释。缺任何一条时，
  # 乘积为空也会静——实测：第一版这一格没给创建时间，删掉失败那一腿照样绿。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_failed"}'
        values: '3x30'
      - series: 'cogneva_backup_run_readings{readout="runs_ok"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_running"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_abandoned"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_failed"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_ok"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_running"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_abandoned"}'
        values: '107000x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_never_succeeded
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30h
        alertname: backup_nothing_ever_recorded
        exp_alerts: []

  # CronJob 被挂起、而且上一次调度是三十小时前：四条 CronJob 规则全亮。同一格里
  # `stopped_scheduling` 与 `suspended` 分开证：挂起的那条只看 0/1，停调度的那条看时间差。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_spec_suspend{cronjob="cogneva-backup"}'
        values: '1x30'
      - series: 'kube_cronjob_status_last_schedule_time{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_spec_suspend{cronjob="cogneva-backup-drill"}'
        values: '1x30'
      - series: 'kube_cronjob_status_last_schedule_time{cronjob="cogneva-backup-drill"}'
        values: '0x30'
      - series: 'kube_cronjob_created{cronjob="cogneva-backup-drill"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_cronjob_suspended
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30h
        alertname: backup_cronjob_stopped_scheduling
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 30h
        alertname: backup_restore_drill_cronjob_suspended
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30h
        alertname: backup_restore_drill_cronjob_stopped_scheduling
        exp_alerts:
          - exp_labels:
              severity: critical

  # CronJob 建了三十小时，四种读数都在写、而且全是 0：什么都没记过。`nothing_ever_recorded`
  # 亮。同一格里 `never_succeeded` 与 `run_abandoned` 静：失败数是 0（不是「有失败」），
  # 放弃的增量也是 0（不是「有放弃」）。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_ok"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_failed"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_running"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings{readout="runs_abandoned"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_ok"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_failed"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_running"}'
        values: '107000x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_abandoned"}'
        values: '107000x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_nothing_ever_recorded
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 30h
        alertname: backup_never_succeeded
        exp_alerts: []
      - eval_time: 30h
        alertname: backup_run_abandoned
        exp_alerts: []

  # 两个 CronJob 都建了三十小时，而演练与离站副本的三条「从来不出现」的读数**一条都没有**：
  # 三条「从来没跑过 / 从来没写过 / 仓库从来没看过」亮。同一格里 `has_no_snapshot` 静——
  # 它要求观测时间戳这一半存在，缺席是上一条的活，两条不重复喊。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_created{cronjob="cogneva-backup-drill"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_restore_drill_never_ran
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 30h
        alertname: backup_offsite_copy_never_written
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 30h
        alertname: backup_offsite_repository_is_never_observed
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30h
        alertname: backup_offsite_repository_has_no_snapshot
        exp_alerts: []
      - eval_time: 30h
        alertname: backup_restore_drill_is_stale
        exp_alerts: []

  # CronJob 说自己十九小时前成功过，可读数里的成功计数二十六小时没有涨过：成功没记账。
  # 这一格守的是「CronJob 与账本对不上」——两半都在、只是在互相矛盾。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{cronjob="cogneva-backup"}'
        values: '100000x30'
      - series: 'cogneva_backup_run_readings{readout="runs_ok"}'
        values: '0x30'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="runs_ok"}'
        values: '107000x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_success_not_recorded
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30h
        alertname: backup_never_succeeded_by_the_cronjob
        exp_alerts: []

  # 最新那个包只有一周前形状的三成：缩水。`newest_package_bytes` 在前一小时是 1000、
  # 后一小时是 300，子查询 `[7d:1h]` 的一小时步长在 60m 处仍然看得到 1000。
  - interval: 1m
    input_series:
      - series: 'cogneva_backup_run_readings{readout="newest_package_bytes"}'
        values: '1000x60 300x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="newest_package_bytes"}'
        values: '7100x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: backup_newest_package_shrank_below_its_own_recent_shape
        exp_alerts:
          - exp_labels:
              severity: warning

  # 同一个包大小一直没变：比例 1.0，静。这一格守的是「缩水」与「稳定」的差——把除数
  # 写反（当前值除以当前值、或去掉子查询）时，它会是唯一一颗挡在前面的钉子。
  - interval: 1m
    input_series:
      - series: 'cogneva_backup_run_readings{readout="newest_package_bytes"}'
        values: '1000x120'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="newest_package_bytes"}'
        values: '7100x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: backup_newest_package_shrank_below_its_own_recent_shape
        exp_alerts: []

  # 仓库十四分钟前刚看过，但远端根本没有快照这条读数：没有快照。这一格守的是第二腿——
  # 观测在写不等于仓库里有东西。
  - interval: 1m
    input_series:
      - series: 'cogneva_backup_run_readings{readout="offsite_observation_age_seconds"}'
        values: '300x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="offsite_observation_age_seconds"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: backup_offsite_repository_has_no_snapshot
        exp_alerts:
          - exp_labels:
              severity: warning

  # 调度停在三十小时前，而且一次都没成功过（`last_successful_time` 这条读数根本不存在）：
  # `never_succeeded_by_the_cronjob` 亮。下一格把那条读数补上，它立刻静——它是靠
  # `absent(last_successful)` 这一半判的，不是靠「调度旧」。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_never_succeeded_by_the_cronjob
        exp_alerts:
          - exp_labels:
              severity: critical

  # 同样的三十小时前调度，但成功过（`last_successful_time` 存在）：`never_succeeded_by_the_cronjob`
  # 静，而 `cronjob_stopped_scheduling` 照样亮。这一格守的是两条规则的差：停调度是「不再排」，
  # 没成功是「排了但没成」。
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{cronjob="cogneva-backup"}'
        values: '0x30'
      - series: 'kube_cronjob_status_last_successful_time{cronjob="cogneva-backup"}'
        values: '3000x30'
      - series: 'kube_cronjob_created{cronjob="cogneva-backup"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30h
        alertname: backup_never_succeeded_by_the_cronjob
        exp_alerts: []
      - eval_time: 30h
        alertname: backup_cronjob_stopped_scheduling
        exp_alerts:
          - exp_labels:
              severity: critical
