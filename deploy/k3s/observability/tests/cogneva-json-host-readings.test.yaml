# 宿主那十条读数的单测夹具：磁盘趋势、构建盘余量、三种压力、内存余量、CPU 占用份额、
# slice 匿名内存地板、台账里的节点与 slice 可见性。
#
# 这一族守的是「这台机器还有多少余量」，坏掉的症状全是安静或恒亮：界写反（`<` 与 `>`）、
# 把单位写错（字节当 GiB）、或者把「读数刚出现」当成「持续了半小时」。
#
# 每条静格的理由：
#   - 七条阈值：数值离界远一点必须是静的。界写反的规则在这里会亮。
#   - `host_slice_anon_floor_unmeasured` / `host_ledger_slices_invisible`：两条腿——
#     值越界**且**「半小时前就已经存在」。刚出现的越界不归它们问，那是另一条规则的事。
#     静格用「只有最近十分钟才出现」构造。
#   - `host_ledger_node_unreported`：台账里点了名的节点不报；只报台账从没见过的。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-host-readings.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: host_disk_trend_approaching_full
# rule: host_build_volume_free_low
# rule: host_pressure_cpu_high
# rule: host_pressure_io_high
# rule: host_memory_available_low
# rule: host_cpu_busy_share_high
# rule: host_pressure_memory_high
# rule: host_slice_anon_floor_unmeasured
# rule: host_ledger_node_unreported
# rule: host_ledger_slices_invisible

evaluation_interval: 1m

tests:
  # 例如一台宽裕的机器：磁盘趋势还有十二天、构建盘 64 GiB、三种压力都低、内存 40 GiB、
  # CPU 用了 0.4 核、user.slice 匿名内存 4 GiB（地板 8 GiB）、台账认得这台节点且三个
  # slice 都读得到。十条全静。
  - interval: 1m
    input_series:
      - series: 'disk_trend_days_to_full_recent_margin'
        values: '12x60'
      - series: 'cogneva_host_disk_free_bytes'
        values: '68719476736x60'
      - series: 'cogneva_host_pressure_avg60{resource="cpu"}'
        values: '12x60'
      - series: 'cogneva_host_pressure_avg60{resource="io"}'
        values: '20x60'
      - series: 'cogneva_host_pressure_avg60{resource="memory"}'
        values: '3x60'
      - series: 'cogneva_host_memory_available_bytes'
        values: '42949672960x60'
      - series: 'cogneva_host_cpu_busy_cores'
        values: '8x60'
      - series: 'cogneva_host_cpu_cores'
        values: '20x60'
      - series: 'cogneva_host_slice_anon_bytes{node="n1",slice="user.slice"}'
        values: '4294967296x60'
      - series: 'kube_node_info{node="n1"}'
        values: '1x60'
      - series: 'cogneva_host_ledger_node_info{node="n1"}'
        values: '1x60'
      - series: 'cogneva_host_ledger_slices_readable{node="n1"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: host_disk_trend_approaching_full
        exp_alerts: []
      - eval_time: 60m
        alertname: host_build_volume_free_low
        exp_alerts: []
      - eval_time: 60m
        alertname: host_pressure_cpu_high
        exp_alerts: []
      - eval_time: 60m
        alertname: host_pressure_io_high
        exp_alerts: []
      - eval_time: 60m
        alertname: host_memory_available_low
        exp_alerts: []
      - eval_time: 60m
        alertname: host_cpu_busy_share_high
        exp_alerts: []
      - eval_time: 60m
        alertname: host_pressure_memory_high
        exp_alerts: []
      - eval_time: 60m
        alertname: host_slice_anon_floor_unmeasured
        exp_alerts: []
      - eval_time: 60m
        alertname: host_ledger_node_unreported
        exp_alerts: []
      - eval_time: 60m
        alertname: host_ledger_slices_invisible
        exp_alerts: []

  # 例如一台快满的机器：磁盘趋势负三天（已经过了推算的满日）、构建盘 10 GiB、三种压力都高、
  # 例如内存 8 GiB、CPU 用了 19/20 = 0.95 核、user.slice 匿名内存 10 GiB 且持续了半小时、
  # 台账里有 n1 却没有 n2（集群里有这台节点）、n1 的 slice 只读到两个。十条全亮。
  - interval: 1m
    input_series:
      - series: 'disk_trend_days_to_full_recent_margin'
        values: '-3x60'
      - series: 'cogneva_host_disk_free_bytes'
        values: '10737418240x60'
      - series: 'cogneva_host_pressure_avg60{resource="cpu"}'
        values: '45x60'
      - series: 'cogneva_host_pressure_avg60{resource="io"}'
        values: '95x60'
      - series: 'cogneva_host_pressure_avg60{resource="memory"}'
        values: '25x60'
      - series: 'cogneva_host_memory_available_bytes'
        values: '8589934592x60'
      - series: 'cogneva_host_cpu_busy_cores'
        values: '19x60'
      - series: 'cogneva_host_cpu_cores'
        values: '20x60'
      - series: 'cogneva_host_slice_anon_bytes{node="n1",slice="user.slice"}'
        values: '10737418240x60'
      - series: 'kube_node_info{node="n1"}'
        values: '1x60'
      - series: 'kube_node_info{node="n2"}'
        values: '1x60'
      - series: 'cogneva_host_ledger_node_info{node="n1"}'
        values: '1x60'
      - series: 'cogneva_host_ledger_slices_readable{node="n1"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: host_disk_trend_approaching_full
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: host_build_volume_free_low
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: host_pressure_cpu_high
        exp_alerts:
          - exp_labels:
              severity: warning
              resource: cpu
      - eval_time: 60m
        alertname: host_pressure_io_high
        exp_alerts:
          - exp_labels:
              severity: warning
              resource: io
      - eval_time: 60m
        alertname: host_memory_available_low
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: host_cpu_busy_share_high
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: host_pressure_memory_high
        exp_alerts:
          - exp_labels:
              severity: warning
              resource: memory
      - eval_time: 60m
        alertname: host_slice_anon_floor_unmeasured
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
      - eval_time: 60m
        alertname: host_ledger_node_unreported
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n2
      - eval_time: 60m
        alertname: host_ledger_slices_invisible
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1

  # user.slice 的匿名内存越过了地板，但这条读数才出现了十分钟：半小时那一腿不成立 ⇒ 静。
  # 这一格守的是「越界」与「越界了半小时」的差——删掉第二腿，一个刚起来的读数会被读成
  # 「地板被穿透了半小时」。（输入是一条 10 GiB 的常量序列——例如最近十五分钟一直是 10 GiB，所以第一腿成立。）
  - interval: 1m
    input_series:
      - series: 'cogneva_host_slice_anon_bytes{node="n1",slice="user.slice"}'
        values: '10737418240x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: host_slice_anon_floor_unmeasured
        exp_alerts: []

  # 同一个形状用在 slice 可见性上：只读到两个 slice，但这条读数才出现了十分钟 ⇒ 静。
  - interval: 1m
    input_series:
      - series: 'cogneva_host_ledger_slices_readable{node="n1"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: host_ledger_slices_invisible
        exp_alerts: []
