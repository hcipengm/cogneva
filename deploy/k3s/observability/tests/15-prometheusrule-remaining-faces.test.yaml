        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaAlertFiringUnowned
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 可观测与告警

  - name: 现网那一拍（无主 0）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_ownership_unowned{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaAlertFiringUnowned
