  - name: 现网那一拍（没人接 0）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_attention_unattended{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
