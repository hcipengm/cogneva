  - name: 现网那一拍（不认的面名 0）不会响
    interval: 1m
    input_series:
      - series: 'face_symmetry_unknown{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x30'
    alert_rule_test:
