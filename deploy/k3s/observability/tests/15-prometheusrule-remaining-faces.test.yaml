  - name: 现网那一拍（孤儿 0）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_sighting_unsighted{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x30'
    alert_rule_test:
