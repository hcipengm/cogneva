  - name: 一条规则在刷表会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_traffic_noisy{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x35'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaAlertAccountNoisy
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 可观测与告警

  - name: 现网那一拍（没有刷表的规则）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_traffic_noisy{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 25m
