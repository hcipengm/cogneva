        values: '2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aConformanceDrifted
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 通信

  - name: 现网那一拍（漂移 0）不会响
    interval: 1m
    input_series:
      - series: 'a2a_conformance_drift_cells{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aConformanceDrifted
        exp_alerts: []

  - name: 对端连第一步都走不到会响
    interval: 1m
    input_series:
      - series: 'a2a_reach_defect{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aDiscoveryClosed
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 通信

  - name: 现网那一拍（名片可达）不会响
    interval: 1m
    input_series:
      - series: 'a2a_reach_defect{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aDiscoveryClosed
        exp_alerts: []

  - name: 上游套件说名片不合规会响
    interval: 1m
    input_series:
      - series: 'a2a_tck_conformant{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aTckDrifted
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 通信

  - name: 现网那一拍（套件全过）不会响
    interval: 1m
    input_series:
      - series: 'a2a_tck_conformant{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaA2aTckDrifted
        exp_alerts: []

  - name: 快车道中位数超过一分钟会响
    interval: 1m
    input_series:
      - series: 'commit_fast_lane_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '120x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaCommitFastLaneSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 变更管理

  - name: 现网那一拍（30 秒）不会响
    interval: 1m
    input_series:
      - series: 'commit_fast_lane_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '30x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaCommitFastLaneSlow
        exp_alerts: []

  - name: 产品占比掉到一半以下会响
    interval: 1m
    input_series:
      - series: 'product_commit_share{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0.3x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaProductCommitShareLow
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 变更管理

  - name: 现网那一拍（0.722）不会响
    interval: 1m
    input_series:
      - series: 'product_commit_share{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
