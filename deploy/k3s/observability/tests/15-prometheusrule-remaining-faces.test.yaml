        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 端到端演练

  - name: 现网那一拍（读不到 0）不会响
    interval: 1m
    input_series:
      - series: 'e2e_ten_rings_unread{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaE2eRingUnread
        exp_alerts: []

  - name: 进了表没人接会响
    interval: 1m
    input_series:
      - series: 'cogneva_alert_attention_unattended{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaAlertUnattended
        exp_alerts:
          - exp_labels:
