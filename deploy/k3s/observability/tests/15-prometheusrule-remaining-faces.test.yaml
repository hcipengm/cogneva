# 剩下二十二条托管告警规则的证明，用 promtool 的真引擎跑真表达式。
#
# 输入取自现网真实读数（2026-10-29 20:3x 读 Prometheus）：文件尺寸普查两格 0、
# 六列表里 conn 与 slot 都是 green、原则载体落地缺口 0、十环三格 0、告警回写四格 0、
# A2A 三格 0／0／1、快车道 30 秒、产品占比 0.722、记忆预算余量 625、
# `must_green_flake_repeat_verdict=1`、面名三格 0。会响的格只把该动的那个数推过界。
#
# 其中 `CognevaMustGreenFlakeRepeat` 的「会响」格用的是**此刻的真值**：现网判词就是 1，
# 告警正在响（host-tests.test.sh 在窗口里假红四次）。拿真事当样本，比编一个 1 更诚实。
#
# 这一批里多数规则的身体是 `X > 0`，看起来平凡；配静格不是为了形式——`> 0` 写成 `< 0`、
# 或把 `max()` 换成裸子串，都会让它在健康数据上长亮，而长亮的告警等于没有告警。
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: 尺寸普查有文件没判过会响
    interval: 1m
    input_series:
      - series: 'cogneva_file_size_census_unjudged{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x140'
    alert_rule_test:
      - eval_time: 135m
        alertname: CognevaFileSizeCensusUnjudged
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 变更管理

  - name: 现网那一拍（没判过 0）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_file_size_census_unjudged{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x140'
    alert_rule_test:
      - eval_time: 135m
        alertname: CognevaFileSizeCensusUnjudged
        exp_alerts: []

  - name: 六列表的 conn 列红了会响
    interval: 1m
    input_series:
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="conn",state="red"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaResourceSixColumnConnExhausted
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              column: conn
              state: red
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 资源管理

  - name: 现网那一拍（conn green）不会响
    interval: 1m
    input_series:
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="conn",state="green"}'
        values: '1x30'
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="conn",state="red"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaResourceSixColumnConnExhausted
        exp_alerts: []

  - name: 六列表的 slot 列红了会响（某次准入放过了界）
    interval: 1m
    input_series:
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="slot",state="red"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaResourceSixColumnSlotOverAdmitted
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              column: slot
              state: red
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 资源管理

  - name: 现网那一拍（slot green）不会响
    interval: 1m
    input_series:
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="slot",state="green"}'
        values: '1x30'
      - series: 'resource_six_column_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",column="slot",state="red"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaResourceSixColumnSlotOverAdmitted
        exp_alerts: []

  - name: 载体说了已落地而账上没有那一行会响
    interval: 1m
    input_series:
      - series: 'principle_carriers_slug_no_landing{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaPrincipleSlugNoLanding
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 原则管理

  - name: 现网那一拍（缺口 0）不会响
    interval: 1m
    input_series:
      - series: 'principle_carriers_slug_no_landing{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaPrincipleSlugNoLanding
        exp_alerts: []

  - name: 十环里有环不合格会响
    interval: 1m
    input_series:
      - series: 'e2e_ten_rings_failed_settled{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaE2eRingFailed
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 端到端演练

  - name: 现网那一拍（不合格 0）不会响
    interval: 1m
    input_series:
      - series: 'e2e_ten_rings_failed_settled{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaE2eRingFailed
        exp_alerts: []

  - name: 十环里有环读不到输入会响
    interval: 1m
