# 重测收件台卡没卡：最老的一条请求等了多久，以及这一读能不能取到。
#
# 形状与四格：
#   - 队列空（年龄 0）：静。这是常态——写者每拍折整个队列，折完就是 0。
#   - 越过半钟头（年龄 4000、伴生钟还在动）：响。一拍折不完是慢，六拍折不完是没折。
#   - 界内（年龄 1200）：静。5 分钟一拍，请求排队等下一拍是正常的。
#   - 写者停了（年龄 4000，但 `_observed_timestamp_seconds` 不再动）：静。共享表会把
#     最后一笔值永远送出去，靠冻结样本点亮的规则没有修法能熄灭它；该响的是写者本身
#     （`cogneva_loop_tick_age_seconds` 那条）。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-change-ledger-remeasure.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: change_ledger_remeasure_stuck

evaluation_interval: 1m

tests:
  # 队列空了：年龄写回 0。静。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds'
        values: '0x60'
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds_observed_timestamp_seconds'
        values: '1200x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: change_ledger_remeasure_stuck
        exp_alerts: []

  # 最老的一条等了四千秒，写者还在打点：写者活着、请求却没人折。响。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds'
        values: '4000x60'
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds_observed_timestamp_seconds'
        values: '1200x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: change_ledger_remeasure_stuck
        exp_alerts:
          - exp_labels:
              severity: warning

  # 等了二十分钟，还在几拍之内：静。排到下一拍是这一格的常态。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds'
        values: '1200x60'
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds_observed_timestamp_seconds'
        values: '1200x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: change_ledger_remeasure_stuck
        exp_alerts: []

  # 写者停了：年龄还停在四千秒，但伴生钟不再动。静——这一格不该由一条冻结的样本点亮。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds'
        values: '4000x60'
      - series: 'cogneva_change_ledger_remeasure_oldest_seconds_observed_timestamp_seconds'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: change_ledger_remeasure_stuck
        exp_alerts: []
