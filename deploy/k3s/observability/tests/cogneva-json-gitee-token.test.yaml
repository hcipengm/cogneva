# 「贡献令牌该换没换」这一条规则的单测夹具：健康、换不动、以及这一格根本没有。
#
# 这条规则守的是一个**循环还活着、但它的活干不成**的状态：每次交换都失败的那条循环
# 照样按拍打卡，所以它的心跳年龄一直是年轻的、死亡计数一直是 0，一路安静到 24 小时后
# 令牌过期、出口开始 401。写错它的症状是安静——而这正是它要抓的那种安静——所以这里
# 逐格把几种状态钉住：
#
#   - 新鲜：离到期还有一整天，阈值四小时，差是正的，静；
#   - 该换了没换：剩余已经掉到阈值以下并且两小时没回来，响；
#   - 只有一半：两侧那条界缺席时，减法没有样本，静——那不是「换成功了」；
#   - 写者停了：剩余还停在阈值以下，但库里那一行是两小时前的，静。共享表会把一条序列
#     的最后一笔值永远发下去，不要求写者还在写的话，一个死在点火那侧的写者会让这条
#     规则永久点亮、谁也没法熄灭它。写者停了是 background_loop_stalled 的判词。
#
# 界不写常数：两边都是循环自己报的数（剩余多少、阈值多久），所以夹具里改阈值就该改判。
#
# 伴生钟（`_observed_timestamp_seconds`）在每个用例里都要给：它是判「写者还在写」的
# 那一项，缺了它规则整条不响，用例会以「本该响」红掉，而不是以「伴生钟没被读」红掉。
# 新鲜的那份用 `0+60x…`（每分钟涨 60，等于 `time()`），停了的那份用常数。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-gitee-token.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: gitee_token_not_rotated

evaluation_interval: 1m

tests:
  # 刚换过：剩余 86000 秒，阈值 14400，差是 71600，三小时都静。
  # 序列带 pod/container/instance——那是抓取细节，规则把它们聚合掉，不然一次滚动
  # 就会把一次真实的失败拆成两条告警。
  - interval: 1m
    input_series:
      - series: 'cogneva_gitee_token_seconds_to_expiry{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '86000x180'
      - series: 'cogneva_gitee_token_refresh_threshold_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '14400x180'
      - series: 'cogneva_gitee_token_seconds_to_expiry_observed_timestamp_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 180m
        alertname: gitee_token_not_rotated
        exp_alerts: []

  # 换不动：剩余掉到 9000（低于四小时的阈值），一直没回来。半小时那一格还在等
  # （`for_seconds` 是两小时），两个半小时那一格必须已经响了。
  - interval: 1m
    input_series:
      - series: 'cogneva_gitee_token_seconds_to_expiry{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '9000x180'
      - series: 'cogneva_gitee_token_refresh_threshold_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '14400x180'
      - series: 'cogneva_gitee_token_seconds_to_expiry_observed_timestamp_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: gitee_token_not_rotated
        exp_alerts: []
      - eval_time: 150m
        alertname: gitee_token_not_rotated
        exp_alerts:
          - exp_labels:
              severity: warning

  # 阈值那一侧缺席（配置没读到、或者这个进程还没起循环）：减法没有样本，静。
  # 「不知道界在哪」不能读成「已经越界」。
  - interval: 1m
    input_series:
      - series: 'cogneva_gitee_token_seconds_to_expiry{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '300x180'
      - series: 'cogneva_gitee_token_seconds_to_expiry_observed_timestamp_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: gitee_token_not_rotated
        exp_alerts: []

  # 两侧都在，但界是循环自己报的：把阈值抬到比剩余还高就该响——判据跟着配置走，
  # 不跟着规则里写死的数走。
  - interval: 1m
    input_series:
      - series: 'cogneva_gitee_token_seconds_to_expiry{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '9000x180'
      - series: 'cogneva_gitee_token_refresh_threshold_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '12000x180'
      - series: 'cogneva_gitee_token_seconds_to_expiry_observed_timestamp_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: gitee_token_not_rotated
        exp_alerts:
          - exp_labels:
              severity: warning

  # 写者停了：剩余与阈值还是上面那副「该换了没换」的样子，但伴生钟停在 0，两个半小时
  # 那一格它已经 9000 秒没有新行了——比规则允许的两小时旧。静。
  # 这一格与上一格只差伴生钟一条：去掉写者判据，它就会红。
  - interval: 1m
    input_series:
      - series: 'cogneva_gitee_token_seconds_to_expiry{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '9000x180'
      - series: 'cogneva_gitee_token_refresh_threshold_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '14400x180'
      - series: 'cogneva_gitee_token_seconds_to_expiry_observed_timestamp_seconds{pod="sg-1",container="gateway",instance="10.42.0.9:9090"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: gitee_token_not_rotated
        exp_alerts: []
