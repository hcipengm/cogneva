# 刷新批、验证预算、持有序列、基准载荷、审计请求、知识检索与凭据面那十条读数的单测夹具。
#
# 这一族里有三对「A 失败 unless B 成功」的形状（分析刷新、loki 刷新、知识检索），
# 它们的静格各自单独一格：让成功那一支同时出现，删掉 `unless` 那半那一格会响。
# 注意 `outcome!="failed"` 是字符串不等——`reload_failed` 那种名字**会**算作「非失败」，
# 所以真正的「全失败」要看结局名本身，不要望文生义。
#
# 另有三条只有新鲜度腿（凭据面）或根本没有腿（持有序列、基准载荷、审计请求），
# 夹具只给响格与静格，不假装有可消融的腿。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-flush-verification.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: verification_killed_by_budget
# rule: deployment_killed_by_budget
# rule: series_held_without_producer
# rule: held_series_check_unreadable
# rule: benchmark_payload_refused_by_canary
# rule: audited_request_refused
# rule: analytics_flush_batches_all_failed
# rule: loki_flush_batches_all_failed
# rule: knowledge_retrieval_backend_errored
# rule: credential_surface_has_open_permissions

evaluation_interval: 1m

tests:
  # 一切正常：没有超时、没有被持有却没人产出的序列、持有检查读得出来、基准载荷没被拒、
  # 审计请求全是 released、两处刷新都有成功、检索有命中、凭据面读数为 0 且新鲜。十条全静。
  - interval: 1m
    input_series:
      - series: 'cogneva_verification_timeouts_total{kind="test"}'
        values: '0x60'
      - series: 'cogneva_verification_timeouts_total{kind="build"}'
        values: '0x60'
      - series: 'cogneva_metric_held_without_producer'
        values: '0x60'
      - series: 'cogneva_metric_held_unreadable'
        values: '0x60'
      - series: 'memory_operations_total{operation="benchmark_canary_refused"}'
        values: '0x60'
      - series: 'audited_llm_requests_total{outcome="released"}'
        values: '0x40 20x20'
      - series: 'cogneva_analytics_flush_total{outcome="failed",job="analytics"}'
        values: '0x60'
      - series: 'cogneva_analytics_flush_total{outcome="flushed",job="analytics"}'
        values: '0x50 4x10'
      - series: 'cogneva_loki_flush_total{outcome="failed",job="loki"}'
        values: '0x60'
      - series: 'cogneva_loki_flush_total{outcome="flushed",job="loki"}'
        values: '0x50 4x10'
      - series: 'cogneva_knowledge_retrieval_total{outcome="error",layer="vector"}'
        values: '0x60'
      - series: 'cogneva_knowledge_retrieval_total{outcome="hit",layer="vector"}'
        values: '0x50 3x10'
      - series: 'cogneva_backup_run_readings{readout="credential_surface_live"}'
        values: '0x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="credential_surface_live"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: verification_killed_by_budget
        exp_alerts: []
      - eval_time: 60m
        alertname: deployment_killed_by_budget
        exp_alerts: []
      - eval_time: 60m
        alertname: series_held_without_producer
        exp_alerts: []
      - eval_time: 60m
        alertname: held_series_check_unreadable
        exp_alerts: []
      - eval_time: 60m
        alertname: benchmark_payload_refused_by_canary
        exp_alerts: []
      - eval_time: 60m
        alertname: audited_request_refused
        exp_alerts: []
      - eval_time: 60m
        alertname: analytics_flush_batches_all_failed
        exp_alerts: []
      - eval_time: 60m
        alertname: loki_flush_batches_all_failed
        exp_alerts: []
      - eval_time: 60m
        alertname: knowledge_retrieval_backend_errored
        exp_alerts: []
      - eval_time: 60m
        alertname: credential_surface_has_open_permissions
        exp_alerts: []

  # 都在说坏消息：测试与构建各被预算杀掉一次、两条持有序列读数都在报、基准载荷被拒一次、
  # 审计请求有一次没放行、两处刷新全失败、检索报错、凭据面有一个开放权限。十条全亮。
  - interval: 1m
    input_series:
      - series: 'cogneva_verification_timeouts_total{kind="test"}'
        values: '0x50 1x10'
      - series: 'cogneva_verification_timeouts_total{kind="build"}'
        values: '0x45 1x15'
      - series: 'cogneva_metric_held_without_producer'
        values: '1x60'
      - series: 'cogneva_metric_held_unreadable'
        values: '1x60'
      - series: 'memory_operations_total{operation="benchmark_canary_refused"}'
        values: '0x50 1x10'
      - series: 'audited_llm_requests_total{outcome="refused"}'
        values: '0x50 2x10'
      - series: 'cogneva_analytics_flush_total{outcome="failed",job="analytics"}'
        values: '0x55 3x5'
      # loki 那条的窗口是 5 分钟（分析是 30 分钟）：跳变要落在 (55, 60] 里面，
      # 正好压在窗口起点上（t=55）increase 读出来是 0，这一格就不会响。
      - series: 'cogneva_loki_flush_total{outcome="failed",job="loki"}'
        values: '0x56 2x4'
      - series: 'cogneva_knowledge_retrieval_total{outcome="error",layer="vector"}'
        values: '0x50 4x10'
      - series: 'cogneva_backup_run_readings{readout="credential_surface_live"}'
        values: '1x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="credential_surface_live"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: verification_killed_by_budget
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: test
      - eval_time: 60m
        alertname: deployment_killed_by_budget
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: build
      - eval_time: 60m
        alertname: series_held_without_producer
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: held_series_check_unreadable
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: benchmark_payload_refused_by_canary
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: audited_request_refused
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: refused
      - eval_time: 60m
        alertname: analytics_flush_batches_all_failed
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: failed
      - eval_time: 60m
        alertname: loki_flush_batches_all_failed
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: failed
      - eval_time: 60m
        alertname: knowledge_retrieval_backend_errored
        exp_alerts:
          - exp_labels:
              severity: warning
              layer: vector
      - eval_time: 60m
        alertname: credential_surface_has_open_permissions
        exp_alerts:
          - exp_labels:
              severity: critical

  # 两处刷新都有失败，但同一窗口里也都有成功的批次：不是「全失败」。
  # 删掉任一条 `unless` 那半，这一格会响对应那条。
  - interval: 1m
    input_series:
      - series: 'cogneva_analytics_flush_total{outcome="failed",job="analytics"}'
        values: '0x55 3x5'
      - series: 'cogneva_analytics_flush_total{outcome="flushed",job="analytics"}'
        values: '0x56 1x4'
      - series: 'cogneva_loki_flush_total{outcome="failed",job="loki"}'
        values: '0x56 2x4'
      - series: 'cogneva_loki_flush_total{outcome="flushed",job="loki"}'
        values: '0x57 1x3'
    alert_rule_test:
      - eval_time: 60m
        alertname: analytics_flush_batches_all_failed
        exp_alerts: []
      - eval_time: 60m
        alertname: loki_flush_batches_all_failed
        exp_alerts: []

  # 检索这一层有报错，但也有命中：不是「后端坏了」。删掉 `unless` 那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_knowledge_retrieval_total{outcome="error",layer="vector"}'
        values: '0x50 4x10'
      - series: 'cogneva_knowledge_retrieval_total{outcome="empty",layer="vector"}'
        values: '0x40 2x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: knowledge_retrieval_backend_errored
        exp_alerts: []

  # 凭据面说有一个开放权限，但这份读数一小时前就停了：现在还有没有不知道。
  # 删掉新鲜度那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_backup_run_readings{readout="credential_surface_live"}'
        values: '1x60'
      - series: 'cogneva_backup_run_readings_observed_timestamp_seconds{readout="credential_surface_live"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: credential_surface_has_open_permissions
        exp_alerts: []
