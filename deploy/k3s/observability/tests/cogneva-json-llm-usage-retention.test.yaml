# token 账（`gateway_llm_usage`）保留期那三条规则的单测夹具。
#
# 三条各证一次「会响」，也各证一次「只在它该响的时候响」：
#
#   * `llm_usage_retention_behind` 读的是「最老的一行比这个进程自己声明的保留期
#     还老一倍以上」。第二格用 61 天的账对 30 天的保留期让它响；第三格把两条读数
#     的时间戳钉在 0，证明新鲜度腿真的在起作用。第四格的账是 40 天，在 30 天保留
#     期的两倍以内，所以同一条规则在那一格必须静——它判的是帐龄这一个界，而那条界
#     在 40 天上还没被越过。
#   * `llm_usage_fold_behind` 是这张表独有的那条：折叠面是这个账的派生，没被任何
#     窗口汇总过的行删不得——删掉就是把那份花费的唯一副本抹掉。它读的是**一对**
#     读数：有行删不动（`uncovered_rows > 0`）**且**那些行已经比保留期还老
#     （`uncovered_oldest_age > keep`）。第四格两半都成立，于是响；第五格只有前半
#     成立（折叠面的回填正在追，删不动的行才 2 天，比 30 天的保留期新得多），于是
#     静——这一格就是「计数单独不足以判」的证据，删掉年龄那半它会误报。
#   * `llm_usage_retention_pass_failed` 与另几张表的同名规则同形：写的是「这一趟
#     没跑完」。第六格把那次 1 放在 20 分钟处，40 分钟时在 30 分钟窗里、60 分钟时
#     已经出去——窗口真的在滚，不是写死的一次性判据。
#
# 告警标签只留 `deployment` 和 `severity`：三条都用 `without (pod, container,
# instance)` 把进程维度的标签收掉，部署维度是「这是哪一本账」的身份。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-llm-usage-retention.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: llm_usage_retention_behind
# rule: llm_usage_fold_behind
# rule: llm_usage_retention_pass_failed

evaluation_interval: 1m

tests:
  # 一切正常：最老一行 20 天、保留期 30 天、没有删不动的行、每一趟都跑完。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '1728000x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_retention_behind
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_usage_fold_behind
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_usage_retention_pass_failed
        exp_alerts: []

  # 坏消息：最老一行 61 天，而保留期 30 天 —— 退役已经两个月没生效。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '5270400x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_retention_behind
        exp_alerts:
          - exp_labels:
              deployment: cogneva
              severity: warning
      - eval_time: 60m
        alertname: llm_usage_retention_pass_failed
        exp_alerts: []

  # 同样是 61 天，但两条读数都冻结（时间戳钉在 0）：新鲜度腿把保留期那条关掉。
  # 删掉那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '5270400x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_retention_behind
        exp_alerts: []

  # 折叠面追不上账：有五万行删不动，且其中最老的一行已经 40 天，比 30 天的保留期
  # 还老 —— 这张表已经不被任何东西封顶了。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3456000x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '50000x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3456000x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_fold_behind
        exp_alerts:
          - exp_labels:
              deployment: cogneva
              severity: warning
      - eval_time: 60m
        alertname: llm_usage_retention_behind
        exp_alerts: []

  # 回填正在追：有行删不动，但最老的那行才 2 天，离 30 天的保留期还远。这是健康的
  # 追赶过程，不是「表不再被封顶」。删掉年龄那半，这一格会误报。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '172800x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '12000x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '172800x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_fold_behind
        exp_alerts: []

  # 半小时间窗里有一趟删除没跑完：pass_failed 响，另外两条按各自的读数判（这里
  # 健康，静）。那一次放在 20 分钟处，到 60 分钟时已经出了 30 分钟窗。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_usage_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '1728000x60'
      - series: 'cogneva_llm_usage_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_keep_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '2592000x60'
      - series: 'cogneva_llm_usage_keep_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_rows{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_rows_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_llm_usage_uncovered_oldest_age_seconds_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
      - series: 'cogneva_llm_usage_sweep_failed{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '_x20 1x1 0x39'
      - series: 'cogneva_llm_usage_sweep_failed_observed_timestamp_seconds{pod="p1",container="app",instance="i1",deployment="cogneva"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: llm_usage_retention_pass_failed
        exp_alerts:
          - exp_labels:
              deployment: cogneva
              severity: warning
      - eval_time: 60m
        alertname: llm_usage_retention_pass_failed
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_usage_fold_behind
        exp_alerts: []
