# LLM 池那十二条读数的单测夹具（`llm_context_per_call_above_its_own_week` 要七天的
# 分位样本，单独一份）：它们说的是「上游池还看不看得见、账还平不平、判词还在不在判」。
#
# 这一族一半的规则是**合取**——两条腿都成立才响，而缺一条腿在纯表达式检查下看不出来：
#   - 三条 `*_verdict_unmeasured`：只有**池说它健康**时，「判词没量过」才是个洞；上游
#     本来就不健康时不归它们问。
#   - `llm_upstream_rejecting_while_pool_reads_available`：池说可用时被拒才是矛盾。
#   - `llm_calls_all_failing`：有失败、而窗口里**没有任何一次用量读数**才算全灭；读数
#     还在写（哪怕 outcome=absent）就不归它。
#   - `llm_pool_open_but_idle`：四条腿缺一不可（额度还够、限速在做、准入读数新鲜、
#     用量计数器一小时没动过）。
# 另外三条（盲账、拒绝、池掉线）各带一条**新鲜度腿**：观测时间戳旧了就不是当前状态。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-llm-pool.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: llm_usage_verdict_unmeasured
# rule: llm_tool_calls_verdict_unmeasured
# rule: llm_temperature_verdict_unmeasured
# rule: llm_upstream_rejecting_while_pool_reads_available
# rule: llm_pool_capacity_degraded
# rule: llm_pool_open_but_idle
# rule: llm_spend_reading_is_blind
# rule: llm_upstream_refusal_that_waiting_cannot_repair
# rule: llm_pool_down_on_a_quota_cycle
# rule: llm_pool_face_without_a_serving_member
# rule: llm_upstream_declared_face_missing
# rule: llm_calls_all_failing
# rule: llm_pool_signal_undelivered
# rule: llm_usage_upstream_silent
# rule: llm_usage_ledger_incomplete
# rule: llm_call_without_declared_actor
# rule: llm_cached_tokens_exceed_input

evaluation_interval: 1m

tests:
  # 健康的池：一家上游、三个判词都量过、没有被拒、额度够、账测得新鲜、没有资格类拒绝、
  # 没有失败、信号连着、用量读数在写、账平、调用都带 actor、缓存不超过输入。
  # 十三条全静。
  - interval: 1m
    input_series:
      - series: 'llm_usage_verdict_measured{upstream="u1"}'
        values: '1x60'
      - series: 'llm_usage_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_tool_calls_verdict_measured{upstream="u1"}'
        values: '1x60'
      - series: 'llm_tool_calls_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_temperature_verdict_measured{upstream="u1"}'
        values: '1x60'
      - series: 'llm_temperature_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_upstream_healthy{upstream="u1"}'
        values: '1x60'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_upstream_client_errors_total{upstream="u1"}'
        values: '0x60'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_allowance_tokens'
        values: '100x60'
      - series: 'llm_pool_allowance_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_spent_tokens'
        values: '10x60'
      - series: 'llm_pool_spent_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_reserve_tokens'
        values: '10x60'
      - series: 'llm_pool_reserve_tokens_observed_timestamp_seconds'
        values: '3500x60'
      # 限速关着：`open_but_idle` 的第二条腿不成立，所以这一格里它是静的。
      - series: 'llm_pool_paced_upstreams'
        values: '0x60'
      - series: 'llm_pool_paced_upstreams_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_budget_spent_tokens'
        values: '100x60'
      - series: 'llm_budget_measured_at_unix'
        values: '3500x60'
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="entitlement"}'
        values: '0x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="entitlement"}'
        values: '3500x60'
      - series: 'llm_upstream_failures_total{upstream="u1",source="caller"}'
        values: '0x60'
      - series: 'llm_pool_signal_connected'
        values: '1x60'
      - series: 'llm_usage_readings_total{outcome="absent",upstream="u1"}'
        values: '0x60'
      - series: 'llm_calls_total{result="ok",upstream="u1"}'
        values: '5x60'
      - series: 'llm_usage_readings_total{upstream="u1"}'
        values: '5x60'
      - series: 'llm_calls_total{actor="unknown"}'
        values: '0x60'
      - series: 'llm_tokens_total{kind="cached",upstream="u1"}'
        values: '0x60'
      - series: 'llm_tokens_total{kind="input",upstream="u1"}'
        values: '100x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_verdict_unmeasured
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_tool_calls_verdict_unmeasured
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_temperature_verdict_unmeasured
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_upstream_rejecting_while_pool_reads_available
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_pool_capacity_degraded
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_pool_open_but_idle
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_spend_reading_is_blind
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_upstream_refusal_that_waiting_cannot_repair
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_calls_all_failing
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_pool_signal_undelivered
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_usage_upstream_silent
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_usage_ledger_incomplete
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_call_without_declared_actor
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_cached_tokens_exceed_input
        exp_alerts: []

  # 上游健康、三个判词却全是 0：三条一起亮。同一格里再放一家**不健康**的上游（u2，
  # 判词也没量过）——它不归这三条问，所以结果里只该有 u1 三份。
  - interval: 1m
    input_series:
      - series: 'llm_usage_verdict_measured{upstream="u1"}'
        values: '0x60'
      - series: 'llm_usage_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_tool_calls_verdict_measured{upstream="u1"}'
        values: '0x60'
      - series: 'llm_tool_calls_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_temperature_verdict_measured{upstream="u1"}'
        values: '0x60'
      - series: 'llm_temperature_verdict_measured_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_upstream_healthy{upstream="u1"}'
        values: '1x60'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_usage_verdict_measured{upstream="u2"}'
        values: '0x60'
      - series: 'llm_usage_verdict_measured_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x60'
      - series: 'llm_tool_calls_verdict_measured{upstream="u2"}'
        values: '0x60'
      - series: 'llm_tool_calls_verdict_measured_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x60'
      - series: 'llm_temperature_verdict_measured{upstream="u2"}'
        values: '0x60'
      - series: 'llm_temperature_verdict_measured_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x60'
      - series: 'llm_upstream_healthy{upstream="u2"}'
        values: '0x60'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_verdict_unmeasured
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1
      - eval_time: 60m
        alertname: llm_tool_calls_verdict_unmeasured
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1
      - eval_time: 60m
        alertname: llm_temperature_verdict_unmeasured
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1

  # 池说可用（`llm_pool_available=1`）而上游在拒：矛盾，亮。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_client_errors_total{upstream="u1"}'
        values: '0x5 2x55'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_rejecting_while_pool_reads_available
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1

  # 同样的拒绝，但池已经说不可用了：不归这条问。这一格守着 `and on ()` 那半条腿——
  # 删掉它，池掉线期间的每一次拒绝都会被读成「池说可用却在拒」。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_client_errors_total{upstream="u1"}'
        values: '0x5 2x55'
      - series: 'llm_pool_available'
        values: '0x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_rejecting_while_pool_reads_available
        exp_alerts: []

  # 两家上游、一家不健康：池是降级，不是全灭。亮。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_healthy{upstream="u1"}'
        values: '1x60'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u1"}'
        values: '3500x60'
      - series: 'llm_upstream_healthy{upstream="u2"}'
        values: '0x60'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_capacity_degraded
        exp_alerts:
          - exp_labels:
              severity: warning

  # 池那一行是**冻住的**：伴生钟八小时没动，而拒绝还在动。少了新鲜度腿这一格会亮，
  # 判词说「池说可用」——可那个 1 是八小时前写下的，写它的进程已经不在了。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_client_errors_total{upstream="u1"}'
        values: '0x5 2x475'
      - series: 'llm_pool_available'
        values: '1x480'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_upstream_rejecting_while_pool_reads_available
        exp_alerts: []

  # 一家健康、另一家的判词是八小时前写的：那不是「一家不健康」，是「没有这一家此刻的
  # 测量」。只数被量过的成员，所以这一格静——旧的算法会把 u2 同时数进分母与减数，
  # 于是池永远「在变薄」，变薄的那一次测量已经过去八小时了。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_healthy{upstream="u1"}'
        values: '1x480'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u1"}'
        values: '27500x480'
      - series: 'llm_upstream_healthy{upstream="u2"}'
        values: '0x480'
      - series: 'llm_upstream_healthy_observed_timestamp_seconds{upstream="u2"}'
        values: '3500x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_pool_capacity_degraded
        exp_alerts: []

  # 池开着却一小时没人用：额度够（100-10-10=80）、限速做着（1）、准入读数新鲜、
  # 用量计数器一小时没动。四条腿都成立 ⇒ 亮。
  - interval: 1m
    input_series:
      - series: 'llm_pool_allowance_tokens'
        values: '100x60'
      - series: 'llm_pool_allowance_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_spent_tokens'
        values: '10x60'
      - series: 'llm_pool_spent_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_reserve_tokens'
        values: '10x60'
      - series: 'llm_pool_reserve_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_paced_upstreams'
        values: '1x60'
      - series: 'llm_pool_paced_upstreams_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'cogneva_ready_admission_readings{kind="ready"}'
        values: '1x60'
      - series: 'cogneva_ready_admission_readings_observed_timestamp_seconds{kind="ready"}'
        values: '3500x60'
      - series: 'llm_usage_readings_total{outcome="read"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_open_but_idle
        exp_alerts:
          - exp_labels:
              severity: critical

  # 额度已经不够（10-10-10 = -10）：不开着却闲，是没额度。静。
  - interval: 1m
    input_series:
      - series: 'llm_pool_allowance_tokens'
        values: '10x60'
      - series: 'llm_pool_allowance_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_spent_tokens'
        values: '10x60'
      - series: 'llm_pool_spent_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_reserve_tokens'
        values: '10x60'
      - series: 'llm_pool_reserve_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_paced_upstreams'
        values: '1x60'
      - series: 'llm_pool_paced_upstreams_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'cogneva_ready_admission_readings{kind="ready"}'
        values: '1x60'
      - series: 'cogneva_ready_admission_readings_observed_timestamp_seconds{kind="ready"}'
        values: '3500x60'
      - series: 'llm_usage_readings_total{outcome="read"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_open_but_idle
        exp_alerts: []

  # 账停在 3500 秒前测的那一次：读数是盲的（界三十分钟）。亮。
  - interval: 1m
    input_series:
      - series: 'llm_budget_spent_tokens'
        values: '100x60'
      - series: 'llm_budget_measured_at_unix'
        values: '100x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_spend_reading_is_blind
        exp_alerts:
          - exp_labels:
              severity: warning

  # 资格类拒绝（等不会好）：亮。同一格里放一条**别种**拒绝的参照——选择器只认
  # kind=entitlement，另一种拒绝不归它问。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="entitlement"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="entitlement"}'
        values: '3500x60'
      - series: 'llm_upstream_refusal_kind{upstream="u2",kind="quota"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u2",kind="quota"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_refusal_that_waiting_cannot_repair
        exp_alerts:
          - exp_labels:
              severity: critical
              upstream: u1

  # 资格拒绝的观测时间戳停在很久以前：不再是当前状态，静。这一格守着新鲜度腿。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="entitlement"}'
        values: '1x480'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="entitlement"}'
        values: '0x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_upstream_refusal_that_waiting_cannot_repair
        exp_alerts: []

  # 六小时里失败计数器动过、而**没有任何一次用量读数**：全灭。亮。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_failures_total{upstream="u1",source="caller"}'
        values: '0x5 3x55'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_calls_all_failing
        exp_alerts:
          - exp_labels:
              severity: critical
              upstream: u1

  # 同样有失败，但窗口里用量读数在写（哪怕是 absent）：不是全灭。这一格守着 `unless` 腿。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_failures_total{upstream="u1",source="caller"}'
        values: '0x5 3x55'
      - series: 'llm_usage_readings_total{upstream="u1",outcome="absent"}'
        values: '0x5 2x55'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_calls_all_failing
        exp_alerts: []

  # 信号线一直没连上：池的判断没人送达。亮。
  - interval: 1m
    input_series:
      - series: 'llm_pool_signal_connected'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_signal_undelivered
        exp_alerts:
          - exp_labels:
              severity: warning

  # 上游的用量读数是 `absent`：有调用但没有用量。亮。
  - interval: 1m
    input_series:
      - series: 'llm_usage_readings_total{upstream="u1",outcome="absent"}'
        values: '0x5 2x55'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_upstream_silent
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1

  # 十五分钟前那条腿算出来的成功调用，比一小时一刻钟里的用量读数多：账漏了。亮。
  - interval: 1m
    input_series:
      - series: 'llm_calls_total{result="ok",upstream="u1"}'
        values: '0x5 3x55'
      - series: 'llm_usage_readings_total{upstream="u1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_usage_ledger_incomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1

  # 调用没有带已声明的 actor：花的钱没有归属。亮。
  - interval: 1m
    input_series:
      - series: 'llm_calls_total{actor="unknown"}'
        values: '0x5 4x55'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_call_without_declared_actor
        exp_alerts:
          - exp_labels:
              severity: warning

  # 缓存计费超过输入：上游把缓存算重了。亮。
  - interval: 1m
    input_series:
      - series: 'llm_tokens_total{kind="cached",upstream="u1"}'
        values: '0x5 10x55'
      - series: 'llm_tokens_total{kind="input",upstream="u1"}'
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_cached_tokens_exceed_input
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: u1

  # 池掉线，而一家上游自己说是**额度周期**用完了（kind=quota_cycle，观测新鲜）：
  # `llm_pool_down_on_a_quota_cycle` 亮，`llm_pool_open_but_idle` **静**。
  #
  # 这一格是 2026-10-24 现场的形状：四条 idle 腿全部成立（额度还够、限速在做、准入
  # 读数新鲜、用量计数器一小时没动），而同池两条上游用 429 明说「本周额度已用完」。
  # 同一个小时里，`llm_pool_open_but_idle` 真的响了，它的摘要说「非负意味着门不是为
  # 预算拒的」——而门恰恰是为预算拒的。两条规则必须在同一格里一响一静：
  #   静的这条说「不是预算」，响的那条说「是预算、等哪个时刻」。
  - interval: 1m
    input_series:
      - series: 'llm_pool_allowance_tokens'
        values: '100x60'
      - series: 'llm_pool_allowance_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_spent_tokens'
        values: '10x60'
      - series: 'llm_pool_spent_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_reserve_tokens'
        values: '10x60'
      - series: 'llm_pool_reserve_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_paced_upstreams'
        values: '1x60'
      - series: 'llm_pool_paced_upstreams_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'cogneva_ready_admission_readings{kind="ready"}'
        values: '1x60'
      - series: 'cogneva_ready_admission_readings_observed_timestamp_seconds{kind="ready"}'
        values: '3500x60'
      - series: 'llm_usage_readings_total{outcome="read"}'
        values: '7x60'
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="quota_cycle"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="quota_cycle"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '0x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_down_on_a_quota_cycle
        exp_alerts:
          - exp_labels:
              severity: critical
              upstream: u1
      - eval_time: 60m
        alertname: llm_pool_open_but_idle
        exp_alerts: []

  # 写者**恰好晚一个周期**（30 分钟），而池真的不可用、一家上游在额度周期里：亮。
  # 这一格守的是新鲜界的**下限**——界若取成心跳本身（1800s），健康写者在两次发布之间
  # 正好是这个年龄，会被读成「写者停了」，一条真故障在这里被静音。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="quota_cycle"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="quota_cycle"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '0x60'
      # 60m 那一拍上 age = 3600 - 1800 = 1800：正好一个发布周期。
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '1800x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_down_on_a_quota_cycle
        exp_alerts:
          - exp_labels:
              severity: critical
              upstream: u1

  # 同一个形状，但池级读数的写者已经停满两个周期（60 分钟）：静。
  # 过期的读数不再算证据；「写者停了」是 `gateway_durable_writes_failing` 的题目，
  # 两条规则各答各的，不在这条里互相冒充。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="quota_cycle"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="quota_cycle"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '0x60'
      # 60m 那一拍上 age = 3600 - 0 = 3600，不小于界。
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_down_on_a_quota_cycle
        exp_alerts: []

  # 同一家上游同样在额度周期里，但**池是活的**（其余成员还在供）：新的那条静——
  # 有活干的时候不该有人被告知池掉了；而 idle 那条照旧亮，因为「开着却一小时没人
  # 用」在池能接活时仍然是个真问题。这一格守的是新规则的第二条腿（池不可用），
  # 少了它，一条上游的额度周期会把「池可用但通道坏了」这个诊断整体吞掉。
  - interval: 1m
    input_series:
      - series: 'llm_pool_allowance_tokens'
        values: '100x60'
      - series: 'llm_pool_allowance_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_spent_tokens'
        values: '10x60'
      - series: 'llm_pool_spent_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_reserve_tokens'
        values: '10x60'
      - series: 'llm_pool_reserve_tokens_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'llm_pool_paced_upstreams'
        values: '1x60'
      - series: 'llm_pool_paced_upstreams_observed_timestamp_seconds'
        values: '3500x60'
      - series: 'cogneva_ready_admission_readings{kind="ready"}'
        values: '1x60'
      - series: 'cogneva_ready_admission_readings_observed_timestamp_seconds{kind="ready"}'
        values: '3500x60'
      - series: 'llm_usage_readings_total{outcome="read"}'
        values: '7x60'
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="quota_cycle"}'
        values: '1x60'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="quota_cycle"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_down_on_a_quota_cycle
        exp_alerts: []
      - eval_time: 60m
        alertname: llm_pool_open_but_idle
        exp_alerts:
          - exp_labels:
              severity: critical

  # 上游说过额度周期，但那一格是八小时前写的：写者早停了，最后那一行被存储永远服务。
  # 不是当前状态，静——这一格守着新鲜度腿。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_refusal_kind{upstream="u1",kind="quota_cycle"}'
        values: '1x480'
      - series: 'llm_upstream_refusal_kind_observed_timestamp_seconds{upstream="u1",kind="quota_cycle"}'
        values: '0x480'
      - series: 'llm_pool_available'
        values: '0x480'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '27500x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_pool_down_on_a_quota_cycle
        exp_alerts: []

  # 一面配着一家、那一家在拒绝窗里，而池级读数说可用（另一面还有健康成员）：亮。
  # 这是 2026-10-24 的形状——池级 `available` 读 1，这一面的每一次请求都在熔断处
  # 回 503，续跑循环按池级读数判「窗口开了」，一轮轮起跑、一轮轮零产出。
  - interval: 1m
    input_series:
      - series: 'llm_pool_face_upstreams{face="openai"}'
        values: '1x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="openai"}'
        values: '0x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      # 另一面还活着：池级那一格正因为这一面才读 1。
      - series: 'llm_pool_face_upstreams{face="anthropic"}'
        values: '1x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="anthropic"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="anthropic"}'
        values: '1x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="anthropic"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_face_without_a_serving_member
        exp_alerts:
          - exp_labels:
              severity: critical
              face: openai

  # 同一个仓库里还有一个**没配过**的面：两个数都是 0。不归这条问——它守的是
  # 分母那半条腿，删掉 `> 0`，每一个没用到的协议面都会常年亮着。
  - interval: 1m
    input_series:
      - series: 'llm_pool_face_upstreams{face="openai"}'
        values: '1x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="openai"}'
        values: '1x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_face_upstreams{face="openai-responses"}'
        values: '0x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai-responses"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="openai-responses"}'
        values: '0x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai-responses"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_face_without_a_serving_member
        exp_alerts: []

  # 同样一面全灭，但池自己已经说不可用了：那是池掉线，归别的规则问。这一格守着
  # 「池可用」那条腿，少了它，一次池级故障会被两条规则各答一遍。
  - interval: 1m
    input_series:
      - series: 'llm_pool_face_upstreams{face="openai"}'
        values: '1x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="openai"}'
        values: '0x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_available'
        values: '0x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_face_without_a_serving_member
        exp_alerts: []

  # 面那一格是八小时前写的：写者早停了，存储永远服务最后一行。不是当前状态，静
  # ——这一格守着两条新鲜度腿。
  - interval: 1m
    input_series:
      - series: 'llm_pool_face_upstreams{face="openai"}'
        values: '1x480'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai"}'
        values: '0x480'
      - series: 'llm_pool_face_serving{face="openai"}'
        values: '0x480'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai"}'
        values: '0x480'
      - series: 'llm_pool_available'
        values: '1x480'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '27500x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_pool_face_without_a_serving_member
        exp_alerts: []

  # 分母那一格是新鲜的、能接那一格停在很久以前：两条腿各有自己的新鲜度界，因为它们是
  # 两次独立写。少了能接那一格自己的界，一个停止刷新的 `serving` 会被读成「这一面从此
  # 一家都接不了」，而它只是没人写。
  - interval: 1m
    input_series:
      - series: 'llm_pool_face_upstreams{face="openai"}'
        values: '1x60'
      - series: 'llm_pool_face_upstreams_observed_timestamp_seconds{face="openai"}'
        values: '3500x60'
      - series: 'llm_pool_face_serving{face="openai"}'
        values: '0x60'
      - series: 'llm_pool_face_serving_observed_timestamp_seconds{face="openai"}'
        values: '0x60'
      - series: 'llm_pool_available'
        values: '1x60'
      - series: 'llm_pool_available_observed_timestamp_seconds'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_pool_face_without_a_serving_member
        exp_alerts: []

  # 声明的那一面在自己家门口不存在：每一次路由到这一面的请求都会 404，而健康面与池
  # 判词都还是绿的（这条读的是测量，不是健康判词），所以只有这条规则能说出来。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_face_answers{upstream="k3",face="anthropic",declared="1"}'
        values: '0x60'
      - series: 'llm_upstream_face_answers_observed_timestamp_seconds{upstream="k3",face="anthropic",declared="1"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_declared_face_missing
        exp_alerts:
          - exp_labels:
              severity: critical
              upstream: k3
              face: anthropic

  # 同一家在自己的面上答得上来：静。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_face_answers{upstream="k3",face="anthropic",declared="1"}'
        values: '1x60'
      - series: 'llm_upstream_face_answers_observed_timestamp_seconds{upstream="k3",face="anthropic",declared="1"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_declared_face_missing
        exp_alerts: []

  # 没声明的那一面是 0：这是正常的（单面厂商的其余两面都是 0），删掉 `declared="1"`
  # 这一条腿，每一家都会常年亮着两条假警。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_face_answers{upstream="k3",face="openai",declared="0"}'
        values: '0x60'
      - series: 'llm_upstream_face_answers_observed_timestamp_seconds{upstream="k3",face="openai",declared="0"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_upstream_declared_face_missing
        exp_alerts: []

  # 那一格是八小时前写的：存储永远服务最后一行，停了写者的 0 不是当前状态。少了新鲜
  # 度这条腿，一个已经下线的网关会把它最后一句「这一面不存在」永远说下去。
  - interval: 1m
    input_series:
      - series: 'llm_upstream_face_answers{upstream="k3",face="anthropic",declared="1"}'
        values: '0x480'
      - series: 'llm_upstream_face_answers_observed_timestamp_seconds{upstream="k3",face="anthropic",declared="1"}'
        values: '0x480'
    alert_rule_test:
      - eval_time: 480m
        alertname: llm_upstream_declared_face_missing
        exp_alerts: []
