# 任务面四件（检查点没落库、检查点没被取代、断点续跑不可用、路由认领卡住）与
# 制品库四件（走盘失败、维护轮次没走完、删标签被拒、回收欠账没还）的单测夹具。
#
# task 一族的易错点：
#   - 前三条各自只认一个 `outcome` 值，`max by (outcome)` / `sum by (outcome)` 把它带回
#     结果上；健康格里同时让 `outcome="other"` 在涨，四条仍静——选择器是判据的一部分。
#   - `router_claim_stall` 是三段合取：等超界、有人正在等、还有空位。第二条与第三条各自
#     单独一格证（在位为 0 时不许响），删掉任一条那一格就会响。
#
# registry 一族的易错点：
#   - `maintenance_round_incomplete` 的两半是「一小时里跑过」与「读数超过一小时没更新」；
#     第五、六格分别单独证这两半。
#   - `tag_deletion_refused` 与 `reclaim_debt_unpaid` 的内层 `> 0` 与外层阈值是同一个界，
#     **无法单独证**（删掉内层结果值仍是 0），这两格只记行为、不当证明。
#   - `reclaim_debt_unpaid` 的 `and` 两侧标签要对齐：`gc_owed` 与它的观测时间戳必须带同一组
#     `pod/container/instance`，否则匹配不上、恒静。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-task-registry.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: task_checkpoint_not_persisted
# rule: task_checkpoint_not_superseded
# rule: task_resume_point_unusable
# rule: task_router_claim_stall
# rule: registry_store_walk_failing
# rule: registry_maintenance_round_incomplete
# rule: registry_tag_deletion_refused
# rule: registry_reclaim_debt_unpaid

evaluation_interval: 1m

tests:
  # 任务面健康：检查点全落库、全被取代、续跑没失败；路由有五个空位、有人等但没超界；
  # 制品库走盘没失败、维护十分钟前刚跑完、删标签没被拒、没有回收欠账。
  # 八条全静。同一格里「别的结局」在涨——它们不在任何一条的选择器里。
  - interval: 1m
    input_series:
      - series: 'cogneva_task_checkpoint_total{outcome="unpersisted"}'
        values: '0x60'
      - series: 'cogneva_task_checkpoint_total{outcome="unsuperseded"}'
        values: '0x60'
      - series: 'cogneva_task_checkpoint_total{outcome="other"}'
        values: '0x50 5x10'
      - series: 'collab_task_resume_total{outcome="failed"}'
        values: '0x60'
      - series: 'cogneva_task_router_claim_wait_seconds{stream="tasks"}'
        values: '10x60'
      - series: 'cogneva_task_router_claim_hold_bound_seconds{stream="tasks"}'
        values: '30x60'
      - series: 'cogneva_task_router_claim_in_flight{stream="tasks"}'
        values: '1x60'
      - series: 'cogneva_task_router_claim_slots{stream="tasks"}'
        values: '5x60'
      - series: 'cogneva_registry_walk_failures_total{namespace="cogneva",job="registry"}'
        values: '0x60'
      - series: 'cogneva_registry_maintenance_runs_total{job="registry"}'
        values: '0x60'
      - series: 'cogneva_registry_maintenance_reading_unix{job="registry"}'
        values: '3500x60'
      - series: 'cogneva_registry_prune_failures_total{job="registry"}'
        values: '0x60'
      - series: 'cogneva_registry_gc_owed{pod="p1",container="app",instance="i1"}'
        values: '0x60'
      - series: 'cogneva_registry_gc_owed_observed_timestamp_seconds{pod="p1",container="app",instance="i1"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: task_checkpoint_not_persisted
        exp_alerts: []
      - eval_time: 60m
        alertname: task_checkpoint_not_superseded
        exp_alerts: []
      - eval_time: 60m
        alertname: task_resume_point_unusable
        exp_alerts: []
      - eval_time: 60m
        alertname: task_router_claim_stall
        exp_alerts: []
      - eval_time: 60m
        alertname: registry_store_walk_failing
        exp_alerts: []
      - eval_time: 60m
        alertname: registry_maintenance_round_incomplete
        exp_alerts: []
      - eval_time: 60m
        alertname: registry_tag_deletion_refused
        exp_alerts: []
      - eval_time: 60m
        alertname: registry_reclaim_debt_unpaid
        exp_alerts: []

  # 任务面在说坏消息：两小时里有一条检查点没落库、两条没被取代、一次续跑失败；
  # 路由上有人等了 60 秒（界 30 秒）、有 3 个在飞、还有 5 个空位；
  # 制品库走盘失败两次、删标签被拒一次、回收欠了一份没还。八条全亮。
  - interval: 1m
    input_series:
      - series: 'cogneva_task_checkpoint_total{outcome="unpersisted"}'
        values: '0x50 1x10'
      - series: 'cogneva_task_checkpoint_total{outcome="unsuperseded"}'
        values: '0x48 2x12'
      - series: 'collab_task_resume_total{outcome="failed"}'
        values: '0x40 1x20'
      - series: 'cogneva_task_router_claim_wait_seconds{stream="tasks"}'
        values: '60x60'
      - series: 'cogneva_task_router_claim_hold_bound_seconds{stream="tasks"}'
        values: '30x60'
      - series: 'cogneva_task_router_claim_in_flight{stream="tasks"}'
        values: '3x60'
      - series: 'cogneva_task_router_claim_slots{stream="tasks"}'
        values: '5x60'
      - series: 'cogneva_registry_walk_failures_total{namespace="cogneva",job="registry"}'
        values: '0x50 2x10'
      - series: 'cogneva_registry_prune_failures_total{job="registry"}'
        values: '0x45 1x15'
      - series: 'cogneva_registry_gc_owed{pod="p1",container="app",instance="i1"}'
        values: '1x60'
      - series: 'cogneva_registry_gc_owed_observed_timestamp_seconds{pod="p1",container="app",instance="i1"}'
        values: '3500x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: task_checkpoint_not_persisted
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: unpersisted
      - eval_time: 60m
        alertname: task_checkpoint_not_superseded
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: unsuperseded
      - eval_time: 60m
        alertname: task_resume_point_unusable
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: failed
      - eval_time: 60m
        alertname: task_router_claim_stall
        exp_alerts:
          - exp_labels:
              severity: warning
              stream: tasks
      - eval_time: 60m
        alertname: registry_store_walk_failing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cogneva
      - eval_time: 60m
        alertname: registry_tag_deletion_refused
        exp_alerts:
          - exp_labels:
              severity: warning
              job: registry
      - eval_time: 60m
        alertname: registry_reclaim_debt_unpaid
        exp_alerts:
          - exp_labels:
              severity: warning

  # 路由上等了 60 秒、超了界，但一个在飞的都没有：没人被卡住，只是没人来领。
  # 删掉「有人在等」那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_task_router_claim_wait_seconds{stream="tasks"}'
        values: '60x60'
      - series: 'cogneva_task_router_claim_hold_bound_seconds{stream="tasks"}'
        values: '30x60'
      - series: 'cogneva_task_router_claim_in_flight{stream="tasks"}'
        values: '0x60'
      - series: 'cogneva_task_router_claim_slots{stream="tasks"}'
        values: '5x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: task_router_claim_stall
        exp_alerts: []

  # 等超了界、也有人等，但一个空位都没有：这是满了，不是卡了。
  # 删掉「还有空位」那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_task_router_claim_wait_seconds{stream="tasks"}'
        values: '60x60'
      - series: 'cogneva_task_router_claim_hold_bound_seconds{stream="tasks"}'
        values: '30x60'
      - series: 'cogneva_task_router_claim_in_flight{stream="tasks"}'
        values: '5x60'
      - series: 'cogneva_task_router_claim_slots{stream="tasks"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: task_router_claim_stall
        exp_alerts: []

  # 维护轮次一小时里确实跑过（半小时前那次涨了一），但这条读数两小时没更新了：
  # 跑的是哪一轮、跑完没有都不知道。亮。
  - interval: 1m
    input_series:
      - series: 'cogneva_registry_maintenance_runs_total{job="registry"}'
        values: '0x90 1x30'
      - series: 'cogneva_registry_maintenance_reading_unix{job="registry"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: registry_maintenance_round_incomplete
        exp_alerts:
          - exp_labels:
              severity: warning

  # 同样的跑动，但读数两分钟前刚更新过：那一轮是有结论的。静。
  # 删掉「读数超过一小时没更新」那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_registry_maintenance_runs_total{job="registry"}'
        values: '0x90 1x30'
      - series: 'cogneva_registry_maintenance_reading_unix{job="registry"}'
        values: '7000x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: registry_maintenance_round_incomplete
        exp_alerts: []

  # 读数旧，但一小时里一轮都没跑：这不是「这一轮没走完」，是根本没开始跑。
  # 删掉「一小时里跑过」那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_registry_maintenance_runs_total{job="registry"}'
        values: '0x120'
      - series: 'cogneva_registry_maintenance_reading_unix{job="registry"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: registry_maintenance_round_incomplete
        exp_alerts: []

  # 有回收欠账，但这份读数两小时没更新：欠没还、还是早还了，不知道。
  # 删掉新鲜度那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_registry_gc_owed{pod="p1",container="app",instance="i1"}'
        values: '1x60'
      - series: 'cogneva_registry_gc_owed_observed_timestamp_seconds{pod="p1",container="app",instance="i1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: registry_reclaim_debt_unpaid
        exp_alerts: []
