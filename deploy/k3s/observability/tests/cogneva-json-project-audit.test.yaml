# 项目面审计出口那两条规则的夹具：一条改动写下去了却没有留下痕，谁来说。
#
# 两条规则读的是审计出口的三个计数：`cogneva_project_audit_writes_total`（被要求留下的
# 行数）、`cogneva_project_audit_write_failures_total`（其中没落成的）与
# `cogneva_project_audit_unwired_total`（这个进程根本没有写者）。三条都是进程内的
# 计数器，随 Pod 重启归零。
#
# 规则在部署配置的进程内 watcher 那一库，不在 PrometheusRule 清单里，所以这里点名规则名，
# 由跑者从 `deploy/helm/cogneva/files/cogneva.json` 按名字取正文（连同它自己的 `condition`）：
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-project-audit.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: project_audit_rows_not_landing
# rule: project_audit_has_no_writer

evaluation_interval: 1m

tests:
  # 写得进、装得上：两条都必须安静。这一格守的是「不会白红」——审计出口在每一次项目写
  # 操作上都会被调用，一条对着一片零也响的规则，等于把每一次正常改动都报成事故。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_audit_writes_total{pod="cogneva-0"}'
        values: '0+1x70'
      - series: 'cogneva_project_audit_write_failures_total{pod="cogneva-0"}'
        values: '0x70'
      - series: 'cogneva_project_audit_unwired_total{pod="cogneva-0"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: project_audit_rows_not_landing
        exp_alerts: []
      - eval_time: 30m
        alertname: project_audit_has_no_writer
        exp_alerts: []

  # 一次写失败：分母三十、分子一，比例不为零，按比例判的那条响。它响的不是「三分之一」
  # 这个量级，而是「有一行永远补不回来」这件事——审计行写在改动已经发生之后，没有重试。
  # 同一份数据上 `unwired` 仍然是零，按存在判的另一条不许跟着亮：那是另一件事。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_audit_writes_total{pod="cogneva-0"}'
        values: '0+1x70'
      - series: 'cogneva_project_audit_write_failures_total{pod="cogneva-0"}'
        values: '0x29 1x41'
      - series: 'cogneva_project_audit_unwired_total{pod="cogneva-0"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: project_audit_rows_not_landing
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 30m
        alertname: project_audit_has_no_writer
        exp_alerts: []

  # 这个进程根本没有写者：第一条写操作就把它记进 unwired，按存在判的那条响；
  # `failures` 一格是零（没有写者就没有失败），按比例判的那条不许跟着亮。两格的修法不同：
  # 这一格查装配（谁该发布审计存储），那一格查库。
  - interval: 1m
    input_series:
      - series: 'cogneva_project_audit_writes_total{pod="cogneva-0"}'
        values: '0+1x70'
      - series: 'cogneva_project_audit_write_failures_total{pod="cogneva-0"}'
        values: '0x70'
      - series: 'cogneva_project_audit_unwired_total{pod="cogneva-0"}'
        values: '0x5 1x65'
    alert_rule_test:
      - eval_time: 30m
        alertname: project_audit_rows_not_landing
        exp_alerts: []
      - eval_time: 30m
        alertname: project_audit_has_no_writer
        exp_alerts:
          - exp_labels:
              severity: warning
