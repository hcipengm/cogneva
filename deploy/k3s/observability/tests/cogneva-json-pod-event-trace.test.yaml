# 容器重启/失败/卡在终止、事件总线掉帧/落后/没人消费、trace 分档迁移停滞那九条读数的夹具。
#
# pod 一族的易错点：
#   - `restarting_fast` 的窗口 15 分钟与新鲜度门槛 5 分钟不共线，但 15 分钟窗口里剩下的
#     采样仍够算 rate/increase 的高度只有一种情况（读数停在 10~15 分钟前）——这时 increase 已经
#     因为只有一个点而变成 0，新鲜度腿**无法单独证**，只作兜底，夹具不假装有判据。
#   - `failed_without_a_restart` 的 `unless` 只按 Job 归属排除：第二格给出同名的 Job owner，
#     删掉 `unless` 那半这一格会响。
#   - `stuck_terminating` 的删除时间戳是**绝对时间**，判据是「现在减去它超过半小时」；
#     健康格里把它放在五分钟前，第三格放在一小时前。
#
# event 一族的易错点：
#   - 两条按 `cause`/`consumer` 分开报，标签就是判据的一部分（第一条只认 cause，第二条只认 consumer）。
#   - `consumer_stopped_taking` 是 `发了 unless 收了`：第四格让两边都在动，删掉 `unless` 会响。
#
# trace 一族的易错点：
#   - `demotion_stalled` 有两半：三小时里一直有超期（min_over_time）与「六小时的点比三小时多」
#     （读数够老）。第五格用 `_` 空采样把「读数刚出现」造出来，让第二条腿单独可证。
#   - `migration_stale` 的界是 6 × 自报的扫描间隔：第六格把间隔调到 200 秒，同样的 1600 秒
#     迟滞就不越界了——证明界确实从读数来。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-pod-event-trace.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: pod_restarting_fast
# rule: pod_failed_without_a_restart
# rule: pod_stuck_terminating
# rule: event_bus_losing_run_histories
# rule: event_bus_consumer_falling_behind
# rule: event_bus_consumer_stopped_taking
# rule: trace_tier_demotion_stalled
# rule: trace_tier_migration_stale
# rule: trace_tier_migration_failing

evaluation_interval: 1m

tests:
  # 一切正常：没有重启、Pod 在跑、没有删除时间戳、总线没掉没落后、发了也都收了；
  # trace 没有超期、一小时前刚扫过、没有失败。九条全静。
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="cogneva",pod="p1",container="app"}'
        values: '0x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p1",phase="Running"}'
        values: '1x60'
      - series: 'cogneva_event_bus_dropped_total{cause="overflow"}'
        values: '0x60'
      - series: 'cogneva_event_bus_lagged_total{consumer="history"}'
        values: '0x60'
      - series: 'cogneva_event_bus_emitted_total{stream="runs"}'
        values: '0x40 10x20'
      - series: 'cogneva_event_bus_consumed_total{consumer="history"}'
        values: '0x40 10x20'
      - series: 'cogneva_trace_tier_overdue'
        values: '0x60'
      - series: 'cogneva_trace_tier_last_pass_seconds{job="trace"}'
        values: '3500x60'
      - series: 'cogneva_trace_tier_scan_interval_seconds{job="trace"}'
        values: '60x60'
      - series: 'cogneva_trace_tier_pass_failures_total{job="trace"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: pod_restarting_fast
        exp_alerts: []
      - eval_time: 60m
        alertname: pod_failed_without_a_restart
        exp_alerts: []
      - eval_time: 60m
        alertname: pod_stuck_terminating
        exp_alerts: []
      - eval_time: 60m
        alertname: event_bus_losing_run_histories
        exp_alerts: []
      - eval_time: 60m
        alertname: event_bus_consumer_falling_behind
        exp_alerts: []
      - eval_time: 60m
        alertname: event_bus_consumer_stopped_taking
        exp_alerts: []
      - eval_time: 60m
        alertname: trace_tier_demotion_stalled
        exp_alerts: []
      - eval_time: 60m
        alertname: trace_tier_migration_stale
        exp_alerts: []
      - eval_time: 60m
        alertname: trace_tier_migration_failing
        exp_alerts: []

  # 在说坏消息：十分钟里重启了六次、一个带 Failed 相位但没有 Job 归属的 Pod、
  # 一个五十分钟前就该被删掉却还在的 Pod；总线因 overflow 掉了两次、history 消费者落后一次、
  # 还在发却没人收。六条全亮。
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="cogneva",pod="p1",container="app"}'
        values: '0x54 6x6'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p2",phase="Failed"}'
        values: '1x60'
      - series: 'kube_pod_deletion_timestamp{namespace="cogneva",pod="p3"}'
        values: '600x60'
      - series: 'cogneva_event_bus_dropped_total{cause="overflow"}'
        values: '0x50 2x10'
      - series: 'cogneva_event_bus_lagged_total{consumer="history"}'
        values: '0x45 1x15'
      - series: 'cogneva_event_bus_emitted_total{stream="runs"}'
        values: '0x50 10x10'
      - series: 'cogneva_event_bus_consumed_total{consumer="history"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: pod_restarting_fast
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cogneva
              pod: p1
              container: app
      - eval_time: 60m
        alertname: pod_failed_without_a_restart
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cogneva
              pod: p2
      - eval_time: 60m
        alertname: pod_stuck_terminating
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: cogneva
              pod: p3
      - eval_time: 60m
        alertname: event_bus_losing_run_histories
        exp_alerts:
          - exp_labels:
              severity: warning
              cause: overflow
      - eval_time: 60m
        alertname: event_bus_consumer_falling_behind
        exp_alerts:
          - exp_labels:
              severity: warning
              consumer: history
      - eval_time: 60m
        alertname: event_bus_consumer_stopped_taking
        exp_alerts:
          - exp_labels:
              severity: warning
              stream: runs

  # 同样是 Failed 相位，但它归一个 Job 管：Job 自己会重试，不归这条规则问。
  # 删掉 `unless` 那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p2",phase="Failed"}'
        values: '1x60'
      - series: 'kube_pod_owner{namespace="cogneva",pod="p2",owner_kind="Job",owner_name="j1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: pod_failed_without_a_restart
        exp_alerts: []

  # 发了、也收了：不是「没人消费」。删掉 `unless` 那半，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_event_bus_emitted_total{stream="runs"}'
        values: '0x20 10x40'
      - series: 'cogneva_event_bus_consumed_total{consumer="history"}'
        values: '0x20 8x40'
    alert_rule_test:
      - eval_time: 60m
        alertname: event_bus_consumer_stopped_taking
        exp_alerts: []

  # trace 在说坏消息：三小时里一直有超期、六小时前就有这条读数、一小时前那次扫描之后
  # 又积了 1600 秒（自报间隔 60 秒，门槛 360 秒）、一小时里失败两次。三条全亮。
  - interval: 1m
    input_series:
      - series: 'cogneva_trace_tier_overdue'
        values: '1x360'
      - series: 'cogneva_trace_tier_last_pass_seconds{job="trace"}'
        values: '20000x360'
      - series: 'cogneva_trace_tier_scan_interval_seconds{job="trace"}'
        values: '60x360'
      - series: 'cogneva_trace_tier_pass_failures_total{job="trace"}'
        values: '0x300 2x60'
    alert_rule_test:
      - eval_time: 360m
        alertname: trace_tier_demotion_stalled
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 360m
        alertname: trace_tier_migration_stale
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 360m
        alertname: trace_tier_migration_failing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: trace

  # 同样的超期，但这条读数三小时前才开始报：先攒够六小时窗口。
  # 删掉「六小时里的点比三小时里的多」那条腿，这一格会响。
  - interval: 1m
    input_series:
      - series: 'cogneva_trace_tier_overdue'
        values: '_x180 1x180'
    alert_rule_test:
      - eval_time: 360m
        alertname: trace_tier_demotion_stalled
        exp_alerts: []

  # 同样是 1600 秒迟滞，但这一处自报的扫描间隔是 280 秒：门槛是 1680 秒，还没越界。
  # 界若被写成常数（比如照一分钟间隔钉成 360 秒），这一格会响——这就是「界随读数变」的判据。
  - interval: 1m
    input_series:
      - series: 'cogneva_trace_tier_last_pass_seconds{job="trace"}'
        values: '20000x360'
      - series: 'cogneva_trace_tier_scan_interval_seconds{job="trace"}'
        values: '280x360'
    alert_rule_test:
      - eval_time: 360m
        alertname: trace_tier_migration_stale
        exp_alerts: []
