# `cluster_read_failed` 的单测夹具：集群读失败必须在十五分钟内变成一条告警。
#
# 这条规则判的是**探针**写的那条读数，不是面板自己的请求路径：拓扑面、工作负载面、
# 配额面都是按请求读的，没人打开页面就没有读、也就没有失败——2026-10-27 实测，
# 一条 ClusterRole 少授了两条集合读，那几面在屏上整块空白了几个小时，没有任何读数
# 说出这件事。探针每分钟按 `limit=1` 重放同一批读，把「这条读还通不通」变成一条与
# 观众无关的读数。
#
# 五格各证一件事：
#   1. 全都答了（failed 停在 0）：静。ok 那一格必须给出来——只写 failed 的话，
#      「探针根本没跑」与「跑了一直失败」在「increase = 0」上同形，这一格同时是
#      对照：同样的窗口、同样的写法，只有失败那一条会响。
#   2. pods 一连失败四十分钟：响，且标签里点得出 `resource="pods"`——告警要能直接
#      指向 ClusterRole 里缺的那条规则，只报「有一条读坏了」等于没说。
#   3. 四十分钟前失败过一阵、之后一直好：静。窗口真的在滚，不是把一次失败记成永久。
#   4. 探针停跑（序列整个缺席）：静——这条规则不管「探针还在不在」，那是
#      `background_loop_stalled` 按 `cogneva_loop_tick_age_seconds` 的判据。两件事
#      写进一条规则，会在网关重启时把两条告警一起点亮。
#   5. 两个进程，只有一个被拒：响一条，且标签里点得出 `deployment`。授权有两半——
#      ClusterRole 里的规则与绑定里的主体——而这两个进程是同一个二进制、两个服务
#      账号，可以一边通一边不通。把 `deployment` 抹掉，响的那条既说不出是谁，也会
#      把两边的失败并成一行；2026-10-28 的现场就是这样，读者只拿到「nodes 读不通」。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-cluster-read.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: cluster_read_failed

evaluation_interval: 1m

tests:
  # 1) 每一条读都答了。
  - interval: 1m
    input_series:
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x60'
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_cluster_read_total{resource="persistentvolumeclaims",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x60'
      - series: 'cogneva_cluster_read_total{resource="persistentvolumeclaims",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: cluster_read_failed
        exp_alerts: []

  # 2) pods 从第 20 分钟起每分钟都失败：四十分钟后在窗口里，响，且点名 resource。
  - interval: 1m
    input_series:
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x60'
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x20 1+1x40'
      - series: 'cogneva_cluster_read_total{resource="events",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x60'
      - series: 'cogneva_cluster_read_total{resource="events",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: cluster_read_failed
        exp_alerts:
          - exp_labels:
              severity: warning
              deployment: cogneva
              resource: pods

  # 3) 窗口滚动：失败集中在 0–20 分钟，之后一直好，60 分钟时已经出窗。
  - interval: 1m
    input_series:
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x20 1x40'
      - series: 'cogneva_cluster_read_total{resource="pods",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x20 20x40'
    alert_rule_test:
      - eval_time: 60m
        alertname: cluster_read_failed
        exp_alerts: []

  # 4) 探针停跑：序列整个缺席，这条规则静（停跑归停滞规则判）。
  - interval: 1m
    input_series:
      - series: 'cogneva_loop_tick_age_seconds{loop="cluster_read_probe",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: cluster_read_failed
        exp_alerts: []

  # 5) 网关一直好、进化进程的 nodes 一直被拒：只响进化那一条，标签点名它的
  #    deployment。两个进程的失败若被并成一条，读者就分不出是哪一半授权坏了。
  - interval: 1m
    input_series:
      - series: 'cogneva_cluster_read_total{resource="nodes",outcome="ok",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0+1x60'
      - series: 'cogneva_cluster_read_total{resource="nodes",outcome="failed",pod="gw-1",container="app",instance="i1",deployment="cogneva"}'
        values: '0x60'
      - series: 'cogneva_cluster_read_total{resource="nodes",outcome="ok",pod="evo-1",container="app",instance="i2",deployment="cogneva-evolution"}'
        values: '0x60'
      - series: 'cogneva_cluster_read_total{resource="nodes",outcome="failed",pod="evo-1",container="app",instance="i2",deployment="cogneva-evolution"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: cluster_read_failed
        exp_alerts:
          - exp_labels:
              severity: warning
              deployment: cogneva-evolution
              resource: nodes
