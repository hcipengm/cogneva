# promtool 规则单测：告警镜像那四条判词**真的会 firing**。
#
# 为什么要有这一层：那四条规则全是一个形状——`max(<一个 gauge>) > 0` 加一个 `for:`
# ——而形状对不代表会响。把界写成 `>= 0`、把 `for:` 写成 `15y`、把 `max` 漏掉写成
# `sum(...) > 0`（多实例下永远不是 0）在 `check-alert-rule-subjects.sh` 与
# `check-alert-rule-join-shape.sh` 眼里都合法，而它们永远不会亮。这里让 Prometheus
# 自己的规则引擎跑一遍：先造序列，断言「界之前不许响、界之后必须响」，每一条都带一格
# 反向证据。
#
# 跑法：bash deploy/scripts/test-acceptance-census-alert-rules.sh \
#         deploy/k3s/observability/manifests/15-prometheusrule-host-readings.yaml \
#         deploy/k3s/observability/tests/15-prometheusrule-alert-mirror.test.yaml
#       （本地没有 promtool 时那个跑者会从 apt 取一份到临时目录，取不到就退 3——
#        看不了不是一致）
#
# `rule_files` 这一行由跑者重写：promtool 只认裸的 `groups:`，不认 PrometheusRule 这个
# CRD。它从**清单本身**抽出 `spec.groups` 再改指过去——规则只有一份，测试读的就是它。
rule_files:
  - ../manifests/15-prometheusrule-host-readings.yaml

evaluation_interval: 1m

tests:
  # 一、清单没上集群：`unapplied=1` 一直为真，`for: 2h` 之前不许响。
  # 反向证据在前半格（1h55m 仍是空），正向在 2h 之后。给两小时是因为观测面的 apply
  # 与一次滚动同量级——刚 apply 完就红，等于把正常节奏报成故障。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_unapplied'
        values: '1x200'
    alert_rule_test:
      - eval_time: 115m
        alertname: CognevaAlertMirrorUnapplied
        exp_alerts: []
      - eval_time: 125m
        alertname: CognevaAlertMirrorUnapplied
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"

  # 二、负对照：`unapplied` 一直是 0（其余序列再热闹也不关它的事）⇒ 全程不许响。
  # 没有这一格，把界写成 `>= 0` 也能过上面那一格。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_unapplied'
        values: '0x200'
      - series: 'cogneva_alert_mirror_missing'
        values: '3x200'
    alert_rule_test:
      - eval_time: 195m
        alertname: CognevaAlertMirrorUnapplied
        exp_alerts: []

  # 三、配置没生效：`for: 30m`，25 分钟时还不许响，35 分钟时必须在响。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_unconfigured'
        values: '1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaAlertMirrorUnconfigured
        exp_alerts: []
      - eval_time: 35m
        alertname: CognevaAlertMirrorUnconfigured
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"

  # 四、抄漏了：缺口在第 10 拍才出现，`for: 15m` ⇒ 25m 才该亮；20m 时是 pending，不许响。
  # 「先 0 后 2」而不是「从头就是 2」：从头为真测不到 `for:` 真的在等。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_missing'
        values: '0x10 2x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaAlertMirrorMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: CognevaAlertMirrorMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"
      # 同一份输入下另外三条不许跟着响：一个缺口不说明配置没生效，也不说明清单没上集群。
      - eval_time: 30m
        alertname: CognevaAlertMirrorUnapplied
        exp_alerts: []
      - eval_time: 30m
        alertname: CognevaAlertMirrorUnconfigured
        exp_alerts: []

  # 五、停住了：行还在、时钟停在第 60 拍，`for: 15m` ⇒ 70m 是 pending，80m 才响。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_stale_rows'
        values: '0x60 3x60'
    alert_rule_test:
      - eval_time: 70m
        alertname: CognevaAlertMirrorRowsStale
        exp_alerts: []
      - eval_time: 80m
        alertname: CognevaAlertMirrorRowsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"

  # 六、账本不是全集：上游规则在响、选择器看不见它。`for: 1h` ⇒ 55m 还不许响，65m 必须响。
  # 这一格与「抄漏了」的差别只在读数上（`unmirrored` 对 `missing`），在规则形状上一样，
  # 所以同样要钉住边界的**两侧**。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_unmirrored_firing'
        values: '1x130'
      - series: 'cogneva_alert_mirror_unmirrored_measured'
        values: '1x130'
    alert_rule_test:
      - eval_time: 55m
        alertname: CognevaAlertMirrorUnmirrored
        exp_alerts: []
      - eval_time: 65m
        alertname: CognevaAlertMirrorUnmirrored
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"
      # 全集读得到的时候，读不到那一格不许跟着响。
      - eval_time: 65m
        alertname: CognevaAlertMirrorUnmirroredUnreadable
        exp_alerts: []

  # 七、全集读不到：`unmirrored_measured=0` 而 `unmirrored_firing=0`——后一个 0 是「没读到」，
  # 不是「没有」。把两条规则写成同一个形状（都判 firing > 0）就会在这里读成绿。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_unmirrored_measured'
        values: '0x60'
      - series: 'cogneva_alert_mirror_unmirrored_firing'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: CognevaAlertMirrorUnmirroredUnreadable
        exp_alerts: []
      - eval_time: 20m
        alertname: CognevaAlertMirrorUnmirroredUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"
      # 反过来：读不到那一格亮了，并不等于「有未镜像的告警」。
      - eval_time: 20m
        alertname: CognevaAlertMirrorUnmirrored
        exp_alerts: []

  # 八、两个视图分歧：写者与读数对「谁在响」各说各的。`for: 15m`，10 分钟时不响、20 分钟响；
  # 同一份输入下 `missing` 一直是 0——2026-10-26 的形状就是「缺口读 0 而告警在响」，这一格
  # 证的正是「缺口为 0 不能顶替分歧」。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_views'
        values: '0x10 1x60'
      - series: 'cogneva_alert_mirror_missing'
        values: '0x200'
      - series: 'cogneva_alert_mirror_views_measured'
        values: '1x200'
      - series: 'cogneva_alert_mirror_configured'
        values: '1x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: CognevaAlertMirrorViewsDisagree
        exp_alerts: []
      - eval_time: 30m
        alertname: CognevaAlertMirrorViewsDisagree
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"
      # 分歧在响，不代表缺了行；两条判词说的是两件事。
      - eval_time: 30m
        alertname: CognevaAlertMirrorMissing
        exp_alerts: []
      # 量到了的时候，「读不到」那一格不许跟着响。
      - eval_time: 30m
        alertname: CognevaAlertMirrorViewsUnreadable
        exp_alerts: []

  # 九、写者那一面读不到：`views_measured=0` 时 `views` 也是 0，那个 0 是没比过。
  # 正对照 ＋ 负对照：镜像没配（`configured=0`）时这一条不响，那一档归 Unconfigured。
  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_views_measured'
        values: '0x200'
      - series: 'cogneva_alert_mirror_views'
        values: '0x200'
      - series: 'cogneva_alert_mirror_configured'
        values: '1x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: CognevaAlertMirrorViewsUnreadable
        exp_alerts: []
      - eval_time: 20m
        alertname: CognevaAlertMirrorViewsUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "可观测与告警"
      # 读不到不等于有分歧：`views` 的 0 不许在这里被读成绿，也不许被读成红。
      - eval_time: 20m
        alertname: CognevaAlertMirrorViewsDisagree
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'cogneva_alert_mirror_views_measured'
        values: '0x200'
      - series: 'cogneva_alert_mirror_configured'
        values: '0x200'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaAlertMirrorViewsUnreadable
        exp_alerts: []
