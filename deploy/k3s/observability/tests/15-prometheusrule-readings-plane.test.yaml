# 读数面那十条规则的证明，用 promtool 的真引擎跑真表达式。
#
# 输入取自现网真实读数（2026-10-29 20:2x 读 Prometheus）：47 个生产者的
# `host_reading_producer_up` 是 1、`host_spin` 那一条是 0；`alert_bound_band` 的
# `producer_unreadable` 是 1（其余 0）；`reading_producer_absent`=0、
# `host_reading_series_undeclared`=0、`host_reading_series_vanished`=0、
# `cogneva_verdict_series_unread`=0 与 `ceiling`=0、`reading_witness_unresolved`=0、
# `tasks_publishers_agree`=1、`cogneva_refusal_redispatch_state{state="idle_no_runs"}`=1。
# 上面两条为 1／为 0 的那两格是现网此刻的真事，直接拿来当「会响」的样本——不是编出来的。
#
# 每一条都配一格「不响」：这一族里九条判的是 `== 0`／`> 0`／`A > B`，写坏的典型是在
# 健康数据上恒响（比较号写反、`and` 漏掉半边、把 ceiling 写成常数），恒响的代价是整条
# 告警被静音，包括它本该报的那一次。
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: 生产者这一拍没跑成会响（现网 host_spin 此刻就是这样）
    interval: 1m
    input_series:
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="host_spin"}'
        values: '0x30'
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="acceptance_census"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingProducerDown
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              producer: host_spin
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 生产者都跑成了不会响
    interval: 1m
    input_series:
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="host_spin"}'
        values: '1x30'
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="acceptance_census"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingProducerDown
        exp_alerts: []

  - name: 生产者活着但上游读不到会响（现网 alert_bound_band 此刻就是这样）
    interval: 1m
    input_series:
      - series: 'host_reading_producer_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="alert_bound_band"}'
        values: '1x40'
      - series: 'host_reading_producer_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="backup_package"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostReadingProducerUnreadable
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              producer: alert_bound_band
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 上游读得到时不会响
    interval: 1m
    input_series:
      - series: 'host_reading_producer_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="alert_bound_band"}'
        values: '0x40'
      - series: 'host_reading_producer_unreadable{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="backup_package"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaHostReadingProducerUnreadable
        exp_alerts: []

  - name: 有判词却一条序列都没人发会响
    interval: 1m
    input_series:
      - series: 'reading_producer_absent{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '2x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaReadingProducerAbsent
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 现网那一拍（缺席 0）不会响
    interval: 1m
    input_series:
      - series: 'reading_producer_absent{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaReadingProducerAbsent
        exp_alerts: []

  - name: 抓取目标掉了会响
    interval: 1m
    input_series:
      - series: 'up{instance="cogneva",job="cogneva-host-readings"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaHostReadingsEndpointDown
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 抓取目标在的时候不会响
    interval: 1m
    input_series:
      - series: 'up{instance="cogneva",job="cogneva-host-readings"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CognevaHostReadingsEndpointDown
        exp_alerts: []

  - name: 有人加了没登记的序列会响
    interval: 1m
    input_series:
      - series: 'host_reading_series_undeclared{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaHostReadingSeriesUndeclared
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 现网那一拍（没登记 0）不会响
    interval: 1m
    input_series:
      - series: 'host_reading_series_undeclared{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaHostReadingSeriesUndeclared
        exp_alerts: []

  - name: 登记过的那一条这一拍没印会响
    interval: 1m
    input_series:
      - series: 'host_reading_series_vanished{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaHostReadingSeriesVanished
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 现网那一拍（消失 0）不会响
    interval: 1m
    input_series:
      - series: 'host_reading_series_vanished{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaHostReadingSeriesVanished
        exp_alerts: []

  - name: 没有读者的判词涨过承认的欠账会响
    interval: 1m
    input_series:
      - series: 'cogneva_verdict_series_unread{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
      - series: 'cogneva_verdict_series_ceiling{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaVerdictSeriesUnread
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 现网那一拍（0 与上限 0）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_verdict_series_unread{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
      - series: 'cogneva_verdict_series_ceiling{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaVerdictSeriesUnread
        exp_alerts: []

  # 树内写法普查判红了，而且红了半小时以上：这一格守的是「判词有读者」。没有这一条时，
  # 三扇门红了也没有任何规则按它动手，与「这一拍没量」在读数面上同形。
  - name: 写法普查判红半小时会响
    interval: 1m
    input_series:
      - series: 'principle_style_verdict{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
      - series: 'principle_style_gate_failures{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
      - series: 'principle_style_gates_judged{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '3x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaPrincipleStyleGateRed
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 原则管理

  # 现网那一拍：判词 0，三扇门都跑了。这一格守的是「不常红」——判词写法改成 `>= 0`
  # 或 `absent(...)` 这类永远成立的形状时，它就会红。
  - name: 写法普查全绿不会响
    interval: 1m
    input_series:
      - series: 'principle_style_verdict{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
      - series: 'principle_style_gate_failures{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
      - series: 'principle_style_gates_judged{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '3x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaPrincipleStyleGateRed
        exp_alerts: []

  # 判词刚红：只持续了两分钟。这一格守着那半小时的保持——去掉 `for`，同一个夹具在 3m
  # 上就会亮，而那正是「半个提交的中间态把一条判词顶成告警」的来源。
  - name: 写法普查刚红两分钟不会响
    interval: 1m
    input_series:
      - series: 'principle_style_verdict{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x1 1x79'
      - series: 'principle_style_gate_failures{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x1 1x79'
      - series: 'principle_style_gates_judged{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '3x80'
    alert_rule_test:
      - eval_time: 3m
        alertname: CognevaPrincipleStyleGateRed
        exp_alerts: []

  # 退场理由名单两侧不同步，持续半小时以上。
  - name: 退场理由名单不同步半小时会响
    interval: 1m
    input_series:
      - series: 'retire_reasons_contract_drift{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x80'
      - series: 'retire_reasons_contract_values{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '5x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaRetireReasonsContractDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 变更管理

  # 现网那一拍：两侧一致。
  - name: 退场理由名单一致不会响
    interval: 1m
    input_series:
      - series: 'retire_reasons_contract_drift{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x80'
      - series: 'retire_reasons_contract_values{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '5x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: CognevaRetireReasonsContractDrift
        exp_alerts: []

  - name: 有判词没有决定可做会响
    interval: 1m
    input_series:
      - series: 'reading_witness_unresolved{instance="cogneva",job="cogneva-host-readings",node="cogneva",readout="reading_witness_unresolved"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaReadingWitnessUnresolved
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              readout: reading_witness_unresolved
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  - name: 现网那一拍（0）不会响
    interval: 1m
    input_series:
      - series: 'reading_witness_unresolved{instance="cogneva",job="cogneva-host-readings",node="cogneva",readout="reading_witness_unresolved"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaReadingWitnessUnresolved
        exp_alerts: []

  - name: 两份发布者名单不一致会响
    interval: 1m
    input_series:
      - series: 'tasks_publishers_agree{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaTasksPublishersDisagree
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 任务管理

  - name: 现网那一拍（一致）不会响
    interval: 1m
    input_series:
      - series: 'tasks_publishers_agree{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: CognevaTasksPublishersDisagree
        exp_alerts: []

  - name: 拒绝却没把动作交回去会响
    interval: 1m
    input_series:
      - series: 'cogneva_refusal_redispatch_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="turn_off"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaRefusalRedispatchBroken
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              state: turn_off
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 任务管理

  - name: 现网那一拍（idle_no_runs 不在点名的那三个状态里）不会响
    interval: 1m
    input_series:
      - series: 'cogneva_refusal_redispatch_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="idle_no_runs"}'
        values: '1x40'
      - series: 'cogneva_refusal_redispatch_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="turn_off"}'
        values: '0x40'
      - series: 'cogneva_refusal_redispatch_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="below_bar"}'
        values: '0x40'
      - series: 'cogneva_refusal_redispatch_state{instance="cogneva",job="cogneva-host-readings",node="cogneva",state="refused_no_redispatch"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CognevaRefusalRedispatchBroken
        exp_alerts: []

  # 一拍比它声明的周期慢。样本就是 2026-10-30 12:46 那次实测：一拍 134 秒、周期 60 秒、
  # 每个生产者都跑成了（`producer_up` 全 1）——四条旧规则一条都不亮，所以这一格必须自己亮。
  - name: 一拍 134 秒而周期写的是 60 秒会响（慢，不是死）
    interval: 1m
    input_series:
      - series: 'host_reading_beat_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '134x30'
      - series: 'host_reading_beat_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '60x30'
      - series: 'host_reading_served_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '30x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingsBeatOverBudget
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性
      # 同一份输入下「表还新」⇒ 停更那条不许跟着响。两条规则喂同一份数据时，写坏的
      # 典型是一起亮，那样人只看得到第一条、永远学不到第二条在判什么。
      - eval_time: 25m
        alertname: CognevaHostReadingsServedStale
        exp_alerts: []

  - name: 一拍 45 秒（并发之后实测）不会响
    interval: 1m
    input_series:
      - series: 'host_reading_beat_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '45x30'
      - series: 'host_reading_beat_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingsBeatOverBudget
        exp_alerts: []

  - name: 拍长冻住而表在变旧会响（刷新线程卡死）
    interval: 1m
    input_series:
      # 卡死之后没有任何一拍完成，`beat_seconds` 停在最后一个健康值上：这一条喂的就是
      # 「拍长看着正常」，所以只有年龄那条能亮。
      - series: 'host_reading_beat_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '45x40'
      - series: 'host_reading_beat_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '60x40'
      - series: 'host_reading_served_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '30x10 121x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingsServedStale
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性
      - eval_time: 25m
        alertname: CognevaHostReadingsBeatOverBudget
        exp_alerts: []

  - name: 健康的一拍（45 秒、表 30 秒）两条都不响
    interval: 1m
    input_series:
      - series: 'host_reading_beat_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '45x30'
      - series: 'host_reading_beat_period_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '60x30'
      - series: 'host_reading_served_age_seconds{instance="cogneva",job="cogneva-host-readings",node="cogneva"}'
        values: '30x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingsServedStale
        exp_alerts: []

  # `up == 0` 一直压着两种成因。这一格喂「被自己人挤死」：`up` 是 0（序列停更），
  # 但它没崩——聚合器按下过这一拍的上限。两条规则必须一格亮一格不亮，否则分开它就没意义。
  - name: 撞上限的那一条只算被挤死，不算崩了
    interval: 1m
    input_series:
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="face_four_rings"}'
        values: '0x30'
      - series: 'host_reading_producer_capped{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="face_four_rings"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingProducerDown
        exp_alerts: []
      - eval_time: 25m
        alertname: CognevaHostReadingProducerCapped
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              producer: face_four_rings
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性

  # 反向：真崩了（`capped` 是 0）时只有「崩了」那条亮。少了这一格，把 `unless`
  # 写反（写成 `and`，或把 `== 1` 写成 `== 0`）也会让上一格全绿。
  - name: 真崩了的时候只有「崩了」那条亮
    interval: 1m
    input_series:
      - series: 'host_reading_producer_up{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="host_spin"}'
        values: '0x30'
      - series: 'host_reading_producer_capped{instance="cogneva",job="cogneva-host-readings",node="cogneva",producer="host_spin"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CognevaHostReadingProducerCapped
        exp_alerts: []
      - eval_time: 25m
        alertname: CognevaHostReadingProducerDown
        exp_alerts:
          - exp_labels:
              instance: cogneva
              job: cogneva-host-readings
              node: cogneva
              producer: host_spin
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: 读数正确性
