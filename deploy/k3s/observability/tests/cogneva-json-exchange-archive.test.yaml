# 「上下文上限把人拒了」这条规则的证明：在真引擎上跑发货表达式。
#
# 2026-11-21：同文件里另一条 `llm_exchange_body_unarchived` 的用例随规则一起退役——
# 那条读数在 Rust 里已经没有发射点，规则永远不响。
#
# 两条都是「每秒计数在涨就响」的形状，所以每一条都配一格**不涨**的静格：恒响的规则
# 与恒静的在读数上一样糟，而恒响会让整条告警被静音——包括它本该报的那一次。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-exchange-archive.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: agent_context_limit_refused

evaluation_interval: 1m

tests:
  # 一、这一分钟里没有任何「正文没归档」的计数在涨：两条都静。
  - interval: 1m
    input_series:
      - series: 'cogneva_agent_context_limit_refusals_total{outcome="limit_named"}'
        values: '3x45'
    alert_rule_test:
      - eval_time: 30m
        alertname: agent_context_limit_refused
        exp_alerts: []

  # 三、上游按上下文上限拒了一次（且这次把上限读出来了）：涨了就该响，
  # 并在标签上分开 `limit_named` 与 `limit_unnamed`——后者说明那句话没被读懂。
  - interval: 1m
    input_series:
      - series: 'cogneva_agent_context_limit_refusals_total{outcome="limit_named"}'
        values: '0x61 1x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: agent_context_limit_refused
        exp_alerts: []
      - eval_time: 65m
        alertname: agent_context_limit_refused
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: limit_named
