# 一次调用的正文没能存进内存 Raw 层：按原因计数的夹具。
#
# 这条规则报的是「这一趟又丢了一份正文」，不是速率：三个原因各修各的（没配地址、
# 地址不通、被拒），所以 `sum by (cause)` 把每个原因各留成一条告警，标签 `cause`
# 就是读者要拿去做的那一步修复。夹具证三件事：
#
#   * 两个原因都没涨：静。
#   * 一个原因涨了一次：响，且标签点名是哪一个原因——两个原因同时涨时有两条，
#     这里只让一个动，证明这条规则不会把别的原因也算到它头上。
#   * 那次增长落在半小时窗之外：又静。规则读的是半小时的增量，不是「计数器的值
#     大于零」——后者会让一次早已修好的丢正文永远亮着。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-llm-exchange-body-unarchived.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: llm_exchange_body_unarchived

evaluation_interval: 1m

tests:
  # 一切正常：两个原因都没涨过。静。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_exchange_body_unarchived_total{cause="unreachable",job="gateway"}'
        values: '0x120'
      - series: 'cogneva_llm_exchange_body_unarchived_total{cause="refused",job="gateway"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_exchange_body_unarchived
        exp_alerts: []

  # 地址不通这个原因在半小时间涨了一次：响，标签说出是哪个原因。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_exchange_body_unarchived_total{cause="unreachable",job="gateway"}'
        values: '0x45 1x15'
      - series: 'cogneva_llm_exchange_body_unarchived_total{cause="refused",job="gateway"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: llm_exchange_body_unarchived
        exp_alerts:
          - exp_labels:
              severity: warning
              cause: unreachable

  # 同一次增长，十分钟后再看：已经出了半小时窗，又静。删掉 `[30m]` 那半，
  # 这一格会一直响。
  - interval: 1m
    input_series:
      - series: 'cogneva_llm_exchange_body_unarchived_total{cause="unreachable",job="gateway"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 45m
        alertname: llm_exchange_body_unarchived
        exp_alerts: []
