# promtool 规则单测：变更账本停摆那一条**真的会 firing**，而且只在「有活被卡住」时响。
#
# 这一条与前面几条不同，它判的是两个读数取合取：待派发条数 > 0，以及派发 pass 当前那一
# 格是 `paused_llm_pool_unavailable`。合取是最容易被改松的形状——把 `and on()` 换成
# `or`、把待派发那一半去掉、把 `== 1` 写成 `>= 0`（六格里那一半一直是 0，于是恒真），
# 三种改法在结构门眼里全都合法，而它们分别意思是「账本空着也报」「池子好好的也报」
# 「永远报」。这份夹具的每一格都带反向证据，正是为了挡住这三种。
#
# 跑法：bash deploy/scripts/test-acceptance-census-alert-rules.sh \
#         deploy/k3s/observability/manifests/23-prometheusrule-change-dispatch.yaml \
#         deploy/k3s/observability/tests/23-prometheusrule-change-dispatch.test.yaml
rule_files:
  - ../manifests/23-prometheusrule-change-dispatch.yaml

evaluation_interval: 1m

tests:
  # 一、真停摆：2110 条在等、派发那一格连续判 paused。`for: 6h` 之前空、之后 firing。
  # 前半格是反向证据——刚判一次 paused 就响，等于把一次退避报成停摆。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '2110x400'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x400'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x400'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x400'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="proceed",pool_reading="available"}'
        values: '0x400'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="proceed",pool_reading="available"}'
        values: '0+60x400'
    alert_rule_test:
      - eval_time: 359m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []
      - eval_time: 361m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "变更管理"

  # 二、池子好好的：那一格一直是 0、`proceed` 一直是 1，账本再多也不许响。
  # 没有这一格，判据写成「只看待派发条数」也能过第一格。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '2110x720'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x720'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0x721'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x721'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="proceed",pool_reading="available"}'
        values: '1x721'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="proceed",pool_reading="available"}'
        values: '0+60x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []

  # 三、账本空着：待派发为 0，池子确实不可用，12 小时也不许响。这一格钉的是**合取**——
  # 把两个读数换成 `or`、或者干脆删掉待派发那一半，这一格立刻亮，而那种亮是在替一件
  # 不欠任何人的事报警，只会训练读者忽略这一条。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0x721'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x721'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x721'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []

  # 四、停摆两小时之后池子回来了：第 100 分钟（还在停摆里）不许响，第 12 小时也不许响。
  # 前半格钉的是 `for:` 本身（去掉它第 1 分钟就亮），后半格钉的是「恢复之后要自己安静
  # 下来」——一条响了就不再回落的规则，读者第二次看见它就不会再看。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '2110x721'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x721'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x121 0x600'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x121 0'
    alert_rule_test:
      - eval_time: 100m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []
      - eval_time: 12h
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []

  # 五、两个副本读数不同：一个判 paused、一个判 proceed。判据必须取最坏的那一个——
  # 写成 `min` 的话，只要还有一个副本读得过来就永远安静，而那个副本可能根本没在派发。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0x400'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x400'
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.45:8080",readout="change_ledger_pending"}'
        values: '2110x400'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.45:8080",readout="change_ledger_pending"}'
        values: '0+60x400'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0x400'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x400'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.45:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x400'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.45:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x400'
    alert_rule_test:
      - eval_time: 361m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "变更管理"

  # 六、写者停在待派发那一侧：读数还冻着「2110 条在等」，它自己的伴生钟不再动；判词那一族
  # 的钟还在走（那一侧的写者假设活着）。这一条必须静——共享表会把最后一笔值永久送出去，靠一个
  # 冻结的样本点亮的规则没有任何修法能熄灭它，读者第二次看见它就不会再看。该响的是写者本身
  # （`background_loop_stalled` / `cogneva_loop_tick_age_seconds`）。
  # 前半格（第 100 分钟）钉的是「还没到 for 的界」，后半格（第 12 小时）钉的才是年龄界。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '2110x721'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0x721'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x721'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0+60x721'
    alert_rule_test:
      - eval_time: 100m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []
      - eval_time: 12h
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []

  # 七、写者停在判词那一侧：判词那一格还冻着 1，待派发那一族的钟还在走。同样必须静。
  # 这一格与上一格分开，是因为两半各有一个年龄界，缺哪一条都只有对应的那一格能看见：
  # 合成一格会让「只删掉了一半的界」照样绿。
  - interval: 1m
    input_series:
      - series: 'cogneva_change_dispatch_readouts{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '2110x721'
      - series: 'cogneva_change_dispatch_readouts_observed_timestamp_seconds{instance="10.42.0.44:8080",readout="change_ledger_pending"}'
        values: '0+60x721'
      - series: 'cogneva_change_dispatch_verdict{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '1x721'
      - series: 'cogneva_change_dispatch_verdict_observed_timestamp_seconds{instance="10.42.0.44:8080",decision="paused_llm_pool_unavailable",pool_reading="unavailable"}'
        values: '0x721'
    alert_rule_test:
      - eval_time: 100m
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []
      - eval_time: 12h
        alertname: CognevaChangeLedgerStoppedMoving
        exp_alerts: []

  # ═══ CognevaLlmPoolNoDeclaredReturn ═══
  #
  # 这一条回答的是「等得到还是等不到」。它与上面那条判的不是同一件事：上面那条说「账本
  # 六小时没动」，这一条说「动不了的原因是等不到」。同一次停摆里，只有这一条能分开
  # 「六天后上游自己会好」与「谁来换一次凭证才行」——两种情形的修法相反，一个是不动，
  # 一个是必须动，而对同一句「池子不可用」说同一句话的判词，只能靠读者自己去查。

  # 一、等不到：唯一的上游不可用，`quota_cycle`，重置时刻是 0（上游没说）。`for: 1h`
  # 之前空、之后 firing。前半格钉 `for`，后半格钉判据。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '0x200'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x200'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 59m
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts: []
      - eval_time: 61m
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "变更管理"

  # 二、等得到：上游说了 24 小时后恢复。这条必须**一直静**，12 小时也不许响。
  # 这一格是现网 2026-10-29 的样子（一个上游声明 2026-11-04 15:59 UTC 恢复，账本 2126 条
  # 停在下面等）。判据写成「有上游不可用就响」的话这一格立刻亮，而那种亮会连着亮六天。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://ark.cn-beijing.volces.com/api/plan/v3|ark-code-latest"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://ark.cn-beijing.volces.com/api/plan/v3|ark-code-latest"}'
        values: '86400x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts: []

  # 三、池子好好的：上游那一格再怎么缺重置时刻，池子可用就不该响。这一格钉的是左式的后
  # 一半——删掉 `and on() (min(llm_pool_available) == 0)`，这一格立刻亮。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '1x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts: []

  # 四、重置时刻已经过去：上游声明过第 60 秒恢复，而十二小时后它还在拒。这不是「等得到」
  # ——那个时刻已经在后面了，窗口早该结束。判据只看「有没有未来时刻」，所以这一格必须响；
  # 只看「这个字段有没有被填过」的写法在这一格里会静下去，而它恰是最该响的一种。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '60x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts:
          - exp_labels:
              severity: warning
              cogneva_io_managed: "true"
              cogneva_io_face: "变更管理"

  # 五、两个上游、一个说得出一个说不出：必须静。等得到的那个还在，等待仍然有指望。
  # 这一格钉的是量词——判据要写成「没有任何一个声明了未来时刻」，而不是「有一个没声明」。
  # 写成后者的话这一格会亮，而现网正是这个形状（kimi 的重置时刻是 0、ark 的在下周）。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://ark.cn-beijing.volces.com/api/plan/v3|ark-code-latest"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.140:9090",job="cogneva-security-gateway",upstream="https://ark.cn-beijing.volces.com/api/plan/v3|ark-code-latest"}'
        values: '1793807999x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts: []

  # 六、三个副本各报一次同一个上游：不能因为「三份里有一份说了未来时刻」就静，也不能
  # 因为「三份里有两份没说」就响。上游只有两个，判据必须按 `upstream` 聚合后再数——
  # 不聚合的话 `and on(upstream)` 会在副本之间做配对，答案取决于副本数而不是上游数。
  - interval: 1m
    input_series:
      - series: 'llm_pool_available{instance="10.42.0.140:9090",job="cogneva-security-gateway"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.142:8080",job="cogneva",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_healthy{instance="10.42.0.143:8080",job="cogneva-evolution",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.142:8080",job="cogneva",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '0x721'
      - series: 'llm_upstream_quota_reset_unix{instance="10.42.0.143:8080",job="cogneva-evolution",upstream="https://api.kimi.com/coding/v1|k3"}'
        values: '86400x721'
    alert_rule_test:
      - eval_time: 12h
        alertname: CognevaLlmPoolNoDeclaredReturn
        exp_alerts: []
