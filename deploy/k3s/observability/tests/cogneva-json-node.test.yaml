# 节点那十条读数的单测夹具：根盘用了多少、磁盘/内存压力、inode 用了多少、调度请求占比、
# 超卖比、可分配容量变过、内存有没有留出保留量、脏页要多久才写得完。
#
# 这一族的三处易错点：
#   - 两条盘用量规则只是界不同（75 / 85）：一格 50% 全静、一格 90% 两条都亮。
#   - `capacity_overcommitted` 与 `capacity_changed` 各带一条**时间腿**：
#     前者只算启了十五分钟以上的 Pod（刚起来的调度不算超卖），后者只算五分钟内报过的
#     可分配容量（读数停了就不是「刚变过」）。第三格把这两条腿各自单独证一遍——删掉任一条，
#     那一格会响。
#   - 脏页那条是**一个比值**，分母是设备此刻的写速，于是它有两个各自能坏的半边：写速
#     正常时比值要跟着脏页走（一格安静、一格该响），而设备完全不写时比值会**只靠除**
#     变大——那是分母下限那一格在守的东西，把它去掉这一格就响。三格各证一半。
#   - `scheduling_requests` 只数还占着位的 Pod：结束的 Pod 仍带着 nodeName 与申请量，
#     算进去这一族容器每次发布留下的 Job Pod 都在加分，读数随发布次数单调上涨。
#     另有一格专证这一腿（死的 Pod 加起来越过界、活的远没到，结果必须静）。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-node.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: node_disk_usage_high
# rule: node_disk_usage_critical
# rule: node_disk_pressure
# rule: node_inodes_high
# rule: node_memory_pressure
# rule: node_dirty_bytes_outrun_device_writeback
# rule: node_scheduling_requests_high
# rule: node_capacity_overcommitted
# rule: node_capacity_changed
# rule: node_without_memory_reserve

evaluation_interval: 1m

tests:
  # 一台宽裕的节点：根盘半满、没有磁盘/内存压力、inode 半满、CPU 请求占四成、
  # 一个跑了很久的 Pod 只申请了十分之一、可分配容量六小时没变、内存留了一成保留。
  # 九条全静。
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{node="n1",mountpoint="/",fstype="ext4"}'
        values: '500x60'
      - series: 'node_filesystem_size_bytes{node="n1",mountpoint="/",fstype="ext4"}'
        values: '1000x60'
      - series: 'node_filesystem_files_free{node="n1",mountpoint="/",fstype="ext4"}'
        values: '500x60'
      - series: 'node_filesystem_files{node="n1",mountpoint="/",fstype="ext4"}'
        values: '1000x60'
      - series: 'kube_node_status_condition{node="n1",condition="DiskPressure",status="true"}'
        values: '0x60'
      - series: 'kube_node_status_condition{node="n1",condition="MemoryPressure",status="true"}'
        values: '0x60'
      - series: 'kube_pod_container_resource_requests{namespace="cogneva",pod="p1",container="app",node="n1",resource="cpu"}'
        values: '4x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="cpu"}'
        values: '10x60'
      - series: 'kube_pod_container_resource_limits{namespace="cogneva",pod="p1",node="n1",resource="cpu"}'
        values: '1x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p1",phase="Running"}'
        values: '1x60'
      - series: 'kube_pod_start_time{namespace="cogneva",pod="p1"}'
        values: '0x60'
      - series: 'kube_node_status_capacity{node="n1",resource="memory"}'
        values: '1000x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="memory"}'
        values: '900x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_disk_usage_high
        exp_alerts: []
      - eval_time: 60m
        alertname: node_disk_usage_critical
        exp_alerts: []
      - eval_time: 60m
        alertname: node_disk_pressure
        exp_alerts: []
      - eval_time: 60m
        alertname: node_inodes_high
        exp_alerts: []
      - eval_time: 60m
        alertname: node_memory_pressure
        exp_alerts: []
      - eval_time: 60m
        alertname: node_scheduling_requests_high
        exp_alerts: []
      - eval_time: 60m
        alertname: node_capacity_overcommitted
        exp_alerts: []
      - eval_time: 60m
        alertname: node_capacity_changed
        exp_alerts: []
      - eval_time: 60m
        alertname: node_without_memory_reserve
        exp_alerts: []

  # 一台快撑爆的节点：根盘九成、两种压力都在报、inode 九成、CPU 请求占九成、
  # 一个老 Pod 申请了四倍的可分配 CPU、可分配 CPU 这一小时从 4 变成 8、内存没有保留量。
  # 九条全亮（盘用量那两条同一格同时亮）。
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{node="n1",mountpoint="/",fstype="ext4"}'
        values: '100x60'
      - series: 'node_filesystem_size_bytes{node="n1",mountpoint="/",fstype="ext4"}'
        values: '1000x60'
      - series: 'node_filesystem_files_free{node="n1",mountpoint="/",fstype="ext4"}'
        values: '100x60'
      - series: 'node_filesystem_files{node="n1",mountpoint="/",fstype="ext4"}'
        values: '1000x60'
      - series: 'kube_node_status_condition{node="n1",condition="DiskPressure",status="true"}'
        values: '1x60'
      - series: 'kube_node_status_condition{node="n1",condition="MemoryPressure",status="true"}'
        values: '1x60'
      - series: 'kube_pod_container_resource_requests{namespace="cogneva",pod="p1",container="app",node="n1",resource="cpu"}'
        values: '9x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="cpu"}'
        values: '4x40 8x20'
      - series: 'kube_pod_container_resource_limits{namespace="cogneva",pod="p1",node="n1",resource="cpu"}'
        values: '40x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p1",phase="Running"}'
        values: '1x60'
      - series: 'kube_pod_start_time{namespace="cogneva",pod="p1"}'
        values: '0x60'
      - series: 'kube_node_status_capacity{node="n1",resource="memory"}'
        values: '1000x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="memory"}'
        values: '1000x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_disk_usage_high
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              mountpoint: /
              fstype: ext4
      - eval_time: 60m
        alertname: node_disk_usage_critical
        exp_alerts:
          - exp_labels:
              severity: critical
              node: n1
              mountpoint: /
              fstype: ext4
      - eval_time: 60m
        alertname: node_disk_pressure
        exp_alerts:
          - exp_labels:
              severity: critical
              node: n1
              condition: DiskPressure
              status: "true"
      - eval_time: 60m
        alertname: node_inodes_high
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              mountpoint: /
              fstype: ext4
      - eval_time: 60m
        alertname: node_memory_pressure
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              condition: MemoryPressure
              status: "true"
      - eval_time: 60m
        alertname: node_scheduling_requests_high
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              resource: cpu
      - eval_time: 60m
        alertname: node_capacity_overcommitted
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              resource: cpu
      - eval_time: 60m
        alertname: node_capacity_changed
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1
              resource: cpu
      - eval_time: 60m
        alertname: node_without_memory_reserve
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1

  # 一台节点上躺着一堆已经结束的 Job Pod：一个活着的 Pod 只申请了十分之一，两个
  # Succeeded/Failed 的 Pod 各申请四成。把它们算进去比值是 0.9，越过界；只算还占着
  # 位的，是 0.1。静——这一格证明的是「只数还占着位的 Pod」那条腿：删掉
  # `kube_pod_status_phase{phase=~"Pending|Running"}` 这个联接，它会响。
  #
  # 为什么这条腿承重：`kube_pod_container_resource_requests` 对 API 里还在的**每个**
  # Pod 都出样本，结束的 Pod 也带着原来的 nodeName 与申请量，于是这一族容器每次发布
  # 留下的 Job Pod 都在给这个比值加分——实测 2026-10-27 有 36 个结束的
  # cogneva-mainline-* Pod 占着 11.2 核里的 6.9 核（同一刻比值 0.470，只数还占着位的
  # 是 0.181），而截至那天的七天里这些死 Pod 单独给 cpu 加了 0.115 到 0.321。
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_requests{namespace="cogneva",pod="live",container="app",node="n1",resource="cpu"}'
        values: '1x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="live",phase="Running"}'
        values: '1x60'
      - series: 'kube_pod_container_resource_requests{namespace="cogneva",pod="job-done",container="app",node="n1",resource="cpu"}'
        values: '4x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="job-done",phase="Succeeded"}'
        values: '1x60'
      - series: 'kube_pod_container_resource_requests{namespace="cogneva",pod="job-failed",container="app",node="n1",resource="cpu"}'
        values: '4x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="job-failed",phase="Failed"}'
        values: '1x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="cpu"}'
        values: '10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_scheduling_requests_high
        exp_alerts: []

  # 一个十五分钟前才起来的 Pod 申请了四倍的可分配 CPU：它还在启动期，调度器自己会把它
  # 挪走，不归「超卖」问。删掉 `time() - start > 900` 那条腿，这一格会响。
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_limits{namespace="cogneva",pod="p1",node="n1",resource="cpu"}'
        values: '40x60'
      - series: 'kube_pod_status_phase{namespace="cogneva",pod="p1",phase="Running"}'
        values: '1x60'
      - series: 'kube_pod_start_time{namespace="cogneva",pod="p1"}'
        values: '3000x60'
      - series: 'kube_node_status_allocatable{node="n1",resource="cpu"}'
        values: '10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_capacity_overcommitted
        exp_alerts: []

  # 可分配容量在四十分钟前变过一次（4 → 8），但那条读数四十分钟前就停了：不是「刚变过」。
  # 删掉「五分钟内报过」那条腿，这一格会响。
  - interval: 1m
    input_series:
      - series: 'kube_node_status_allocatable{node="n1",resource="cpu"}'
        values: '4x20 8x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_capacity_changed
        exp_alerts: []

  # 一台写得很顺的节点：设备稳态写远大于脏页堆着的那一小撮，比值是个零头。静。
  # 它同时是分母那一侧的正向证据——把 `rate` 换成别的（比如拿脏页比内存总量），
  # 这一格的数会跟着变。
  - interval: 1m
    input_series:
      - series: 'node_memory_Dirty_bytes{node="n1",instance="i1"}'
        values: '5242880x60'
      - series: 'node_disk_written_bytes_total{node="n1",instance="i1",device="nvme0n1"}'
        values: '0+629145600x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_dirty_bytes_outrun_device_writeback
        exp_alerts: []

  # 一台写不动的节点：脏页堆着不动，设备每分钟只写进去一点点，于是这些脏页要几百秒
  # 才写得完。响。把界抬上去、或者把分母换成「设备名义带宽」，这一格会静。
  - interval: 1m
    input_series:
      - series: 'node_memory_Dirty_bytes{node="n1",instance="i1"}'
        values: '1073741824x60'
      - series: 'node_disk_written_bytes_total{node="n1",instance="i1",device="nvme0n1"}'
        values: '0+62914560x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_dirty_bytes_outrun_device_writeback
        exp_alerts:
          - exp_labels:
              severity: warning
              node: n1

  # 一台根本没在写的节点：分母是 0。没有下限那一项时，任何一点脏页除以 0 都会把这条
  # 规则点亮，而「设备此刻没写」既可能是空闲、也可能是写回卡住——它自己分不开，所以
  # 判的是**堆着多少**：这里脏页很少，静。把 `clamp_min(..., 1048576)` 去掉，这一格响。
  - interval: 1m
    input_series:
      - series: 'node_memory_Dirty_bytes{node="n1",instance="i1"}'
        values: '5242880x60'
      - series: 'node_disk_written_bytes_total{node="n1",instance="i1",device="nvme0n1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: node_dirty_bytes_outrun_device_writeback
        exp_alerts: []
