# 启动某一格比它自己三天里最快的那一次慢了多少：证明这条规则会响，且只在它讲的那件事上响。
#
# 形状与五格（时间轴按五分钟采样，最长一格是 6 天 = 1728 个样本，正好盖住
# `count_over_time` 那条「比三天更老的样本存在」的腿）：
#   - 三天都是 9 秒，最后二十分钟出现 20 秒的一代：响。差 11 秒，超过 5 秒的界，
#     且 9 秒那一代还在三天窗口里，基线读得到。
#   - 六天一直是 9 秒：静。没有变慢这一件事，规则不该用「有数字」当信号。
#   - 二十年不遇的常态，只有 12 秒：静。差 3 秒，界下面。这一格钉住判的是差，
#     不是「这个阶段此刻多慢」——否则任何一次稍慢的启动都会响。
#   - 只有 50 小时的历史：静。三天窗口里的最小值就是此刻这个值，规则自己算不出
#     基线；这是算术而不是故障，规则摘要里写着。
#   - 一格都没到过（嵌入关掉的部署）：静。缺席不是零，也没有序列可读。
#
# 另有一条与「同一个 pod 自己的历史」有关：指标的聚合写在子查询里面
# （`max by (phase)` 先把多个 pod 折成一条历史，再做 min_over_time），否则拿
# 一个 pod 和它自己比，差恒为 0，规则永远不会响。第五格用一个 pod 的常数来钉这一点。
#
#   RULES_MANIFEST=deploy/helm/cogneva/files/cogneva.json \
#   RULES_CASE=deploy/k3s/observability/tests/cogneva-json-boot-phase-slowed.test.yaml \
#   bash deploy/scripts/test-acceptance-census-alert-rules.sh
rule_files:
  - ../../../../deploy/helm/cogneva/files/cogneva.json

# rule: boot_phase_slowed

evaluation_interval: 1m

tests:
  # 三天 9 秒，之后一百分钟的一代要 20 秒：比三天里最快的那次晚 11 秒。响。
  - interval: 5m
    input_series:
      - series: 'cogneva_boot_phase_elapsed_seconds{phase="embedding-dense"}'
        values: '9x900 20x20'
    alert_rule_test:
      - eval_time: 4560m
        alertname: boot_phase_slowed
        exp_alerts:
          - exp_labels:
              phase: embedding-dense
              severity: warning

  # 六天一直是 9 秒：没有变慢，静。
  - interval: 5m
    input_series:
      - series: 'cogneva_boot_phase_elapsed_seconds{phase="embedding-dense"}'
        values: '9x904'
    alert_rule_test:
      - eval_time: 4516m
        alertname: boot_phase_slowed
        exp_alerts: []

  # 12 秒对上 9 秒的基线：差 3 秒，在界下面。静。
  - interval: 5m
    input_series:
      - series: 'cogneva_boot_phase_elapsed_seconds{phase="embedding-dense"}'
        values: '9x900 12x4'
    alert_rule_test:
      - eval_time: 4516m
        alertname: boot_phase_slowed
        exp_alerts: []

  # 只有 50 小时的历史：三天窗口里全是 20，最小值和此刻是同一个数。静。
  - interval: 5m
    input_series:
      - series: 'cogneva_boot_phase_elapsed_seconds{phase="embedding-dense"}'
        values: '20x600'
    alert_rule_test:
      - eval_time: 3000m
        alertname: boot_phase_slowed
        exp_alerts: []

  # 这一格从来没到过：没有序列，静。
  - interval: 5m
    input_series:
      - series: 'cogneva_boot_phase_elapsed_seconds{phase="serving"}'
        values: '12x904'
    alert_rule_test:
      - eval_time: 4516m
        alertname: boot_phase_slowed
        exp_alerts: []
