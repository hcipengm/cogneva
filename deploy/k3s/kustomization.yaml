apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage-class.yaml
  - configmap.yaml
  # Secret 不在此 apply：内部密钥由 init-secrets.sh 随机生成，带外凭证由向导写入，
  # 避免仓库弱密码下发与 apply 空占位覆盖真值。参考结构见 examples/secret.yaml。
  - cogneva-json-configmap.yaml
  - prompts-configmap.yaml
  - deployment.yaml
  - llm-admin-rbac.yaml
  - gitops-puller-rbac.yaml
  - service.yaml
  - github-webhook-service.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - sandbox-executor-deployment.yaml
  - evolution-configmap.yaml
  - evolution-deployment.yaml
  - evolution-pvc.yaml
  - evolution-rbac.yaml
  - buildah-daemonset.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - qdrant-pvc.yaml
  - qdrant-deployment.yaml
  - qdrant-service.yaml
  - nats-deployment.yaml
  - nats-service.yaml
  - cluster-registry.yaml
  - network-policy.yaml
  - ingress.yaml
