# 沙箱执行器的集群内 Service：主应用经 system.sandbox_executor_url 路由
# run_command/read_file/write_file 到执行器 Pod。
# 与 Deployment 分文件：主线部署器的目标清单按单文档解析改写 image，
# Service 走支撑包通道下发（与 gateway-deployment/gateway-service 同构）。
apiVersion: v1
kind: Service
metadata:
  name: cogneva-sandbox-executor
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: sandbox-executor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: sandbox-executor
  # 端口名是观测面的契约：ServiceMonitor 按端口名（http / metrics）挑端点，
  # 叫 executor 的服务在 Prometheus 里等于不存在——执行器的 /metrics 一直在
  # 产出却从没被采集过。targetPort 仍指向容器的 executor 端口名。
  ports:
    - name: http
      port: 9090
      targetPort: executor
      protocol: TCP
