apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-evolution-config
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
# These env vars override fields in /etc/cogneva/cogneva.json via the
# config_loader env-var layer. They enable the self-evolution sandbox mode
# and point all directories into the mounted PVC.
data:
  COGNEVA_SELF_EVOLUTION_ENABLED: "true"
  # This pod is the dedicated change executor: it runs the evolution cycle,
  # baseline porter, and mainline deployer. The main app pod sets this false so
  # it stays a control plane (admin API + cluster-side GitOps puller) and the
  # two never race over the same instance's worktrees.
  COGNEVA_SELF_EVOLUTION_EXECUTOR_ENABLED: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_APPLY: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_DEPLOY: "true"
  COGNEVA_SELF_EVOLUTION_SANDBOX_MODE: "true"
  COGNEVA_SELF_EVOLUTION_SWITCH_MODE: "self_exec"
  COGNEVA_SELF_EVOLUTION_CHANGE_DIR: "/opt/cogneva/sandbox/changes"
  COGNEVA_SELF_EVOLUTION_BINARY_DIR: "/opt/cogneva/sandbox/bin"
  COGNEVA_SELF_EVOLUTION_BACKUP_DIR: "/opt/cogneva/sandbox/backups"
  COGNEVA_SELF_EVOLUTION_POLL_INTERVAL_SECS: "300"
  COGNEVA_SELF_EVOLUTION_TEST_TIMEOUT_SECS: "600"
  COGNEVA_SELF_EVOLUTION_BUILD_TIMEOUT_SECS: "1800"
  # 工作树动态分配：部署器独占一棵稳定路径的检出，进化任务各取临时检出，
  # 互不影响；共享 CARGO_TARGET_DIR 在工作树之外，重建工作树不丢增量缓存。
  COGNEVA_SELF_EVOLUTION_WORKSPACES_ROOT: "/opt/cogneva/sandbox/workspaces"
  COGNEVA_SELF_EVOLUTION_WORKSPACES_TARGET_DIR: "/opt/cogneva/sandbox/src/target"
  COGNEVA_SELF_EVOLUTION_WORKSPACES_EPHEMERAL_TTL_SECS: "21600"
  COGNEVA_SELF_EVOLUTION_WORKSPACES_ORPHAN_BRANCH_TTL_SECS: "2592000"
  # 晋级门（推送端）：沙盒验证全过的变更（change） 经分级策略判定后，L0/L1 自动
  # 晋级走 GitOps 发布（annotated tag + evolution-release 分支推到中央
  # 仓库），L2 留审批台。中央仓库即本 Pod 挂载的宿主 bare 仓库 /host-git
  # （宿主 <-> bare <-> 各集群拉取端 的既有同步通道，沙盒零凭证成立：
  # 推送只写 bare 仓库，不持任何集群凭证）。
  COGNEVA_SELF_EVOLUTION_PROMOTION_ENABLED: "true"
  COGNEVA_GITOPS_ENABLED: "true"
  COGNEVA_GITOPS_REPO_URL: "/host-git"
  # 沙盒只推不拉：拉取端（poll/金丝雀/回滚）跑在主部署 Pod，那里有
  # kubectl 与 RBAC；本 Pod 起拉取端只会每轮报错。
  COGNEVA_GITOPS_PULLER_ENABLED: "false"
  # 发现循环只有一个属主：主应用。issue/评论事件经网关只路由到主应用，轮询是
  # 它的周期兜底；本 Pod 里的发现循环对外副作用相同（追问、提交修复意图），而
  # 记账的 intent guard 是进程私有的（各挂各的数据卷）——两个进程各扫一遍，同一
  # 句追问会发两遍，谁也看不见对方已处理。只关发现，落地监视照跑。
  COGNEVA_GITHUB_DISCOVERY_ENABLED: "false"
  # Disable memory/vector backends in the evolution worker to avoid downloading
  # embedding models inside the sandbox on every boot.
  COGNEVA_MEMORY_ENABLED: "false"
  COGNEVA_VECTOR_BACKEND_REQUIRED: "false"
  # The evolution worker does not need strict persistence; allow memory fallbacks
  # for PostgreSQL/Redis-dependent plugins so the self-evolution loop can start.
  COGNEVA_STRICT_PERSISTENCE: "false"
  # 主线跟踪自动部署器：检测 bare 仓库公版 main 前进后，沙盒构建 → buildah 推
  # 集群内 registry（Pod 内走 Service DNS:5000）→ 派独立 Job 经节点 NodePort
  # localhost:30500 门禁滚动四部署，失败自动回滚。依赖 evolution Role 扩权、
  # NetworkPolicy 放行 apiserver、kubectl-bin 挂载（均见同目录清单）。
  COGNEVA_MAINLINE_DEPLOYER_ENABLED: "true"
  COGNEVA_MAINLINE_DEPLOYER_POLL_INTERVAL_SECS: "600"
  COGNEVA_MAINLINE_DEPLOYER_REGISTRY: "cogneva-registry.cogneva.svc.cluster.local:5000"
  COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY: "localhost:30500"
  COGNEVA_MAINLINE_DEPLOYER_NAMESPACE: "cogneva"
  COGNEVA_MAINLINE_DEPLOYER_SOAK_SECS: "120"
  COGNEVA_MAINLINE_DEPLOYER_FAILURE_COOLDOWN_SECS: "3600"
  COGNEVA_MAINLINE_DEPLOYER_CARGO_BUILD_JOBS: "2"
  # 启动阶段（Pod 的 init 容器未结束）的上界，与就绪预算分开计。
  COGNEVA_MAINLINE_DEPLOYER_STARTUP_TIMEOUT_SECS: "900"
  # 就绪阶段（init 全部结束后的滚动收敛）上界，与代码默认值同为 300s：
  # 只把上界变成可调，不借调参掩盖病因。
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_TIMEOUT_SECS: "300"
  # 滚动判定 Job 容器的资源面：它是决定"回滚不回滚"的进程，不能是
  # BestEffort（节点内存压力下最先被驱逐的那一档）。requests 按实测常驻量
  # （轮询等待态 0m/5Mi），limits 承接 kubectl 子进程尖峰。
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_CPU_REQUEST: "10m"
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_MEMORY_REQUEST: "32Mi"
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_CPU_LIMIT: "500m"
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_MEMORY_LIMIT: "256Mi"
  # 滚动 Job Pod 挂载宿主 k3s 多调用二进制作为 kubectl（镜像不内置 kubectl）。
  COGNEVA_MAINLINE_DEPLOYER_KUBECTL_HOST_PATH: "/usr/local/bin/k3s"
