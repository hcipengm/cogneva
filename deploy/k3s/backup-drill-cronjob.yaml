# 恢复演练 CronJob：把最新一个备份包装进一个跑完迁移的**空库**，逐表对数、
# 把账行与源库逐格比，然后把库删掉，答案落进 `backup_drills`。
#
# 与 chart 的 `backup.drillSchedule` / `drillDeadlineSeconds` 同值；改这里就是
# 改那一份，两边由 field-level parity 门禁对齐。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup-drill
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup-drill
spec:
  # 备份在 03:17 出包，演练在半小时后装它——装的是当晚那个包，不是昨天的。
  schedule: "47 3 * * *"
  timeZone: "Etc/UTC"
  # 两次演练同时在跑只会在同一个库名上互相删库。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 演练失败不重试成串：答案已经落进 backup_drills 了，下一晚自然再来。
      backoffLimit: 0
      # 一次演练开两份包：最新那份，加窗口里最久没被证明的那份（`--also-unproven`
      # 第二趟只挑一份）。这个界必须大于**两份的单趟预算之和**，见 chart values 里
      # `drillDeadlineSeconds` 的注释：2026-10-27 实测单包已长到 2271 s，3600 s 的界
      # 让第二趟被杀，账上一行都不留。单趟预算 3600 × 2 ＋ 600 余量 = 7800。
      activeDeadlineSeconds: 7800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup-drill
        spec:
          restartPolicy: Never
          # 演练与备份同一个专用非 root uid；与 chart 逐字段对齐（parity 门）。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          # 凭证面的根目录由 kubelet 按宿主 umask 建（DirectoryOrCreate → 0755），
          # 演练会把它量成一条违例。只修一次不够，目录重建后又回到默认模式，
          # 所以每次开工前收紧。主容器为了不写卷是只读挂载，chmod 只能放在 init。
          # 收紧之前先把属主交给主容器的 uid：0700 的目录对非属主连遍历都不给。
          initContainers:
            - name: tighten-credential-surface
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              command:
                - sh
                - -c
                - >-
                  chown -R 1001:1001 /backups /offsite /offsite-state &&
                  chmod 0700 /backups /offsite /offsite-state
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: offsite
                  mountPath: /offsite
                - name: offsite-state
                  mountPath: /offsite-state
          containers:
            - name: drill
              image: localhost:30500/cogneva:local
              imagePullPolicy: Always
              # 最新那份 ＋ 窗口里最久没被成功打开过的一份；只开最新证明不了
              # 保留窗口的其余成员。
              args: ["backup-drill", "--also-unproven"]
              env:
                # 单趟预算：一份包从解包到对数完。到点由这一跑自己收尾并落一行
                # `failed`，而不是等 Job 的界把进程杀掉——被杀掉的那一趟账上
                # 一行都不留，「被杀」于是读作「没跑过」。与 jobTemplate 的
                # activeDeadlineSeconds 是一对，关系由
                # deploy/scripts/tests/backup-drill-budget-covers-both-passes.test.sh 盯。
                - name: COGNEVA_BACKUP_DRILL_PASS_BUDGET_SECS
                  value: "3600"
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                # 连的是**源库**：演练要在同一个服务器上建演练库，并把装回来的
                # 账行与源库那几行逐格比。遍历的是另一个数据库名，源 schema 只被读。
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
                # 只读：演练遍历卷外那一份，看它是不是刚装回去的这个包。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                # 宿主定时器的观察文件：仓库里最新一份的时刻、最新一把钥匙的
                # 创建时刻。文件不在 = 这一面没量过，账本留空列。
                - name: COGNEVA_BACKUP_OFFSITE_STATE_DIR
                  value: "/offsite-state"
              resources:
                # 与备份同档：恢复是流式 COPY，常驻内存小，重活在 PG 那一侧。
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              volumeMounts:
                # 只读：演练打开包，绝不写卷。保留的一份都不动。
                - name: backup
                  mountPath: /backups
                  readOnly: true
                - name: offsite
                  mountPath: /offsite
                  readOnly: true
                - name: offsite-state
                  mountPath: /offsite-state
                  readOnly: true
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            - name: offsite
              hostPath:
                path: "/var/lib/cogneva-offsite"
                type: DirectoryOrCreate
            - name: offsite-state
              hostPath:
                path: "/var/lib/cogneva-backup-offsite"
                type: DirectoryOrCreate
