# 沙盒网络隔离：evolution Pod 默认拒绝出站，放行安全网关、命名空间内数据面与集群 DNS。
# 原则：凭证绝对不入沙盒 —— 沙盒所有外网/LLM 流量必须经 security-gateway 脱敏代理。
# 注意：K3s 默认 Flannel 从 v1.21 起支持 NetworkPolicy；其他 CNI 需自行确认支持。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-evolution-deny-egress
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: evolution
  policyTypes:
    - Egress
  egress:
    # 只允许访问安全网关（外网代理 8080 / LLM 代理 8081）
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # 命名空间内数据面放行：evolution worker 启动需 postgres 迁移（strict_persistence）、
    # NATS 消息、Redis 流、Qdrant 向量。"凭证不入沙盒"指 LLM/外网凭证必须经网关，
    # 数据面凭证本就以 Secret 注入 worker Pod，属于基础设施面。
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6333
        # Meilisearch（7700）：wiki 检索后端，进化 Pod 启动即健康检查该地址。
        - protocol: TCP
          port: 7700
        # 沙箱执行器（9090）：主应用与进化共用的零凭证工具执行面
        # （run_command/read_file/write_file），该 Pod 不持有任何 Secret。
        - protocol: TCP
          port: 9090
        # 主应用的**内部面**（8085）：工具的返回点把「装不进上下文窗口」的输出
        # 归档到这里的内存 Raw 层，取引用也从这里读回。这一步走本命名空间内的
        # 主应用 Service，不经安全网关（该面只代持外网凭证，与本调用无关），调用
        # 零凭证——而主 API 的 8080 上那几条 memory 路由按角色判，零凭证恒吃 401，
        # 所以它落在这个另开的端口上。少了这一条，归档请求被策略静默丢弃。
        #
        # 8080 不在这里：这条放行当初就是为归档调用加的，调用搬到 8085 之后它就没有
        # 具名的消费者了；留着一条说不出谁在用的放行，等于把"最小授权"改成"历史遗留"。
        - protocol: TCP
          port: 8085
        # 集群内镜像仓库（5000）：publisher push 金丝雀 / 主线 overlay 镜像
        - protocol: TCP
          port: 5000
        # 同一张卷的走查读数（9100）：容量回收判的是盘上占用，而量这个数的是
        # registry Pod 里的边车。挡住它不等于"不回收"这一种退法——回收的判据是
        # "没读到就不动"，读不到会让它变成永远不动的空转，而空转与"不需要回收"
        # 从外面看一样。
        - protocol: TCP
          port: 9100
    # 监控栈（9090）：infra_watch 按 PromQL 探测节点磁盘 / Pod OOM 等基础设施
    # 信号，查询跨命名空间落到 monitoring 命名空间的 Prometheus。
    # podSelector:{} 只匹配本命名空间，必须显式 namespaceSelector。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # kube-apiserver：主线部署器构建侧在 Pod 内调 kubectl（查四部署镜像、
    # apply 滚动 Job）。in-cluster 经 kubernetes Service ClusterIP:443
    # （K3s Service CIDR 10.43.0.0/16；标准 kubeadm 多为 10.96.0.0/12）。
    # 两条 ipBlock 缺一不可：部分 CNI 在 DNAT 前按 Service CIDR 匹配；
    # K3s 内置策略控制器在 DNAT 后匹配，此时目的地址是宿主网络上的
    # apiserver 节点 IP:6443（hostNetwork，不是 Pod，podSelector 匹配不
    # 到），用 0.0.0.0/0 兜底、端口钉死 443/6443 保持最小授权。
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # 只允许访问集群 DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 主线滚动 Job Pod（新镜像 smoke test + 门禁滚动四部署）：网络面最小化，
# 只准访问 kube-apiserver（kubectl set image / 查 rollout 与 pod 健康）与
# DNS；构建与 push 都在进化 Pod 完成，Job 不需要数据面/网关/registry。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-mainline-rollout-egress
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: mainline-rollout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mainline-rollout
  policyTypes:
    - Egress
  egress:
    # 同 evolution 策略：DNAT 后 apiserver 端点是宿主网络节点 IP:6443，
    # 0.0.0.0/0 配合端口钉死覆盖（详见上方 evolution 规则注释）。
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 安全网关自身：允许出站（代沙盒访问外网与 LLM API），入站不限来源命名空间内 Pod。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-security-gateway
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: security-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Audited LLM channel: the `podSelector: {}` rule above means "anyone in this
    # namespace may call", while this port exists entirely because its reachable set
    # is small -- document bodies leave through it, and it carries upstream
    # credentials without a domain allowlist. So the source pod is pinned to one:
    # the sandbox executor (the owner of the host-document capability).
    # The rule is written on the gateway rather than as an executor egress allowlist
    # on purpose: the judgement lands on the side that holds the credentials, so a
    # caller-side coding mistake cannot widen it.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox-executor
      ports:
        - protocol: TCP
          port: 8083
    # webhook 入口（8082）：NodePort 面向集群外平台回调，源 IP 经 SNAT 为节点
    # 地址，无法用 podSelector 限定；平台签名验签在网关完成（未配置 secret 时
    # 一律 503，fail-closed），故可对集群外开放。
    - ports:
        - protocol: TCP
          port: 8082
    # 观测通道：只向监控命名空间放行，且只放这一个端口。该通道不挂任何代理
    # 路由，监控侧即使被放行也拿不到凭证代持能力（8080/8081 会注入真上游凭证，
    # 因此那两条仍只对同命名空间开放）。
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - "monitoring"
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - {}
---
# The sandbox executor's egress face: turn "document bodies go through the audited
# channel only" from a line of code into a **network fact**.
#
# The executor holds no credentials, so it cannot reach the upstream LLM -- but today
# it can reach the security gateway's **passthrough port** (8081), and that port does
# not look at one byte of the request body. If "this request uses the audited channel"
# were written in caller code only, nothing would stop a mistake; once the reachable
# set is narrowed the passthrough port is not on this pod at all, so **the judgement
# does not exist and therefore cannot be written wrong**.
#
# The port list is not copied from a neighbouring policy: it is this instance's real
# egress face (measured connections 2026-09-27 + code review).
#   - DNS 53: resolving github.com / gitee.com is how the seed repositories are fetched.
#   - 0.0.0.0/0:443: seed repository https fetches (SANDBOX_REPO_SEED_URLS, once every
#     repoFetchIntervalSecs) plus the git/cargo fetches a task performs; the image's
#     cargo source is rsproxy and npm is npmmirror, both on 443. This port covers no
#     in-namespace service -- a ClusterIP service port is never 443.
#   - the audited LLM channel: the only in-namespace port allowed through.
#   - 8080/8081/8082 and the data plane are not listed: the executor's env carries local
#     paths only (workspace, bare repo, cargo home, document scopes), no data-plane URL,
#     and the code has no qdrant / apiserver client. So this is not "removing a
#     capability in use" but reclaiming a path nobody uses -- one that, if used, would
#     send bodies out.
#   - Egress only: the inbound face (the main app submitting tasks, monitoring scraping
#     9090) is outside this reasoning; narrowing it too would drag unrelated paths in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-sandbox-executor-egress
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: sandbox-executor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox-executor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: 8083
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443
---
# 主应用 Pod 的入站面。这条策略存在的唯一理由是给内部端口（8085）一道判据：
# 那几条 memory 路由必须让零凭证的 Pod 够到，所以它们不能按角色判；换个地方判，
# 判据就只能是"谁能连这个端口"这条网络事实，而这需要一条 ingress 策略来写。
#
# 8080/9091 原样放行（规则里不写 from，等于任何来源）：主应用今天没有 ingress
# 策略，一给 Pod 挂上 Ingress 类型就等于默认拒绝所有入站——漏掉这两条，运营面
# 的 WebUI、监控抓取、以及元启动时宿主的 port-forward 会一起消失。用"新开一条
# 窄面"换"整片面消失"不是收紧，是另一种事故。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-internal-ingress
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    # 既有的两个端口：可达性与今天一致（未写 from＝任何来源）。
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9091
    # 内部端口：只对跑 agent 循环、真的会归档的那几个工作负载开放。主应用自己
    # 那一份从 127.0.0.1 走回环，不经过这里。
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: evolution
      ports:
        - protocol: TCP
          port: 8085
