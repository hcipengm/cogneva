# 沙盒网络隔离：evolution Pod 默认拒绝出站，放行安全网关、命名空间内数据面与集群 DNS。
# 原则：凭证绝对不入沙盒 —— 沙盒所有外网/LLM 流量必须经 security-gateway 脱敏代理。
# 注意：K3s 默认 Flannel 从 v1.21 起支持 NetworkPolicy；其他 CNI 需自行确认支持。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-evolution-deny-egress
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: evolution
  policyTypes:
    - Egress
  egress:
    # 只允许访问安全网关（外网代理 8080 / LLM 代理 8081）
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # 命名空间内数据面放行：evolution worker 启动需 postgres 迁移（strict_persistence）、
    # NATS 消息、Redis 流、Qdrant 向量。"凭证不入沙盒"指 LLM/外网凭证必须经网关，
    # 数据面凭证本就以 Secret 注入 worker Pod，属于基础设施面。
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6333
        # 沙箱执行器（9090）：主应用与进化共用的零凭证工具执行面
        # （run_command/read_file/write_file），该 Pod 不持有任何 Secret。
        - protocol: TCP
          port: 9090
    # 只允许访问集群 DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 安全网关自身：允许出站（代沙盒访问外网与 LLM API），入站不限来源命名空间内 Pod。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-security-gateway
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: security-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    - {}
