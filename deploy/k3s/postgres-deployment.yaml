apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cogneva
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "16"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "16"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "cog_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: POSTGRES_DB
              value: "cogneva"
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: postgres_exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres-metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/cogneva?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "cog_user"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "false"
            - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
              value: "false"
            - name: PG_EXPORTER_INCLUDE_DATABASES
              value: "cogneva"
          readinessProbe:
            httpGet:
              path: /metrics
              port: postgres-metrics
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: postgres-metrics
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
