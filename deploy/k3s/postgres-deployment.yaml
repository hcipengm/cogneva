apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cogneva
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "16"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "16"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "cog_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: POSTGRES_DB
              value: "cogneva"
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cog_user
                - -d
                - cogneva
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg-metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/cogneva?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "cog_user"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "false"
            - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
              value: "false"
            - name: PG_EXPORTER_INCLUDE_DATABASES
              value: "cogneva"
          # 不给 args：最老事务年龄那条读数与 Grafana 同一块面板读的
          # `pg_stat_activity_max_tx_duration` 属于这个镜像的**默认集**，一个旗标都
          # 不用加。`--help` 列的是 opt-in collector，默认集不在那张名单里——所以
          # 「名单上找不到这一族」不等于「没人发它」，要判断得去抓 /metrics。
          # 而这里一旦写上 args，写错一个名字就不再是「少一条读数」：边车启动即
          # "unknown long flag" 退出，Pod 因此永不 Ready，库与边车同 Pod —— 数据库
          # 还活着，Service 却没了端点，所有客户端读到的都是「数据库不见了」。
          # 要加旗标，先跑 `deploy/scripts/measure-postgres-exporter-surface.sh` 按镜像的
          # `--help` 核名——它同时把量到的名单与镜像写回
          # `deploy/images/postgres-exporter.series.yaml`，`reading_series_have_a_producer`
          # 那条门判的就是那份名单。
          readinessProbe:
            httpGet:
              path: /metrics
              port: pg-metrics
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: pg-metrics
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
