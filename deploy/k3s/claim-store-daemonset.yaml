# 卷账的全集面：每节点一个进程，走查本节点存储根下的每个 claim 目录，把每个目录
# 占的字节发布成卷族序列（`cogneva_data_volume_used_bytes`，与各 Pod 自量自己挂载
# 的那条同名字、同标签）。存在的理由只有一个：**本进程没挂上的卷，本进程量不到**。
# 数据库 / 缓存 / 向量库 / 消息队列 / 对象存储 / 监控栈自己的盘，写它们的是第三方
# 镜像，我们没有任何进程在那个 Pod 里；local-path 这类目录型卷上 kubelet 报的
# per-volume 用量又是节点文件系统本身（实测 12 个 claim 报同一个 ~600GB），所以
# 这一族卷此前是账上的空白：不参与「用量 ÷ 声明量」的比较，也没有任何规则读得到。
#
# 与 host-ledger 分成两个 DaemonSet 而不是同一个 Pod 里的两个容器：两者需要的权限
# 不同。宿主 cgroup 的 memory.stat 是 0444，非特权用户就能读；存储根是 0700 root，
# 非 root 连列目录都做不到，所以这个容器必须跑成 uid 0。合成一个 Pod 会让读 cgroup
# 的那一半也跟着拿到根，而分开之后各自只挂自己那一个路径、各自只付自己那份代价。
# 也避免「存储根不存在 → Pod 起不来 → cgroup 读数一起没了」这种连带。
#
# uid 0 在这里是**唯一的目的**：跨越 0700 的挂载点。它拿不到写权（挂载只读、
# 根文件系统只读、不开 privilege escalation、不挂 SA token、不碰 hostPID、不碰设备），
# 能做的只有读这台机器上 root 本来就能读的文件。
#
# 但「uid 0」本身不等于「读得到」：capabilities 全丢之后没有 CAP_DAC_OVERRIDE，
# 属主不是 root 的 0700 目录同样 EACCES——镜像层里就有这种目录（实测
# snapshots/*/fs/home/build 属 uid 1000、0700），overlayfs 那 47 GB 因此整块读不出来，
# 读数只剩 content 的 13 GB。所以只加回一条 CAP_DAC_READ_SEARCH：它放开读与目录搜索，
# 不放开写；不用 DAC_OVERRIDE，那个连写也放开。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cogneva-claim-store
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/managed-by: k3s
    app.kubernetes.io/component: claim-store
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: claim-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: claim-store
        app.kubernetes.io/version: "0.5.10"
    spec:
      # 不挂 ServiceAccount token：这个进程只读宿主文件，从不与 apiserver 说话，
      # 一份它用不到的集群凭证只会把「跑成 root」的后果放大。
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claim-store
          image: localhost:30500/cogneva:local
          imagePullPolicy: Always
          # 子命令是这里的全部内容：不带它，镜像入口跑的是完整应用，而这个 Pod 里
          # 没有 Redis 也没有配置面，进程在装配阶段就退。
          command: ["/opt/cogneva/cogneva"]
          args: ["claim-store"]
          env:
            - name: COGNEVA_CLAIM_STORE_PORT
              value: "9100"
            - name: COGNEVA_CLAIM_STORE_ROOT
              value: "/host/storage"
            # 走查节奏。序列的年龄由产出方按自己的节奏发布，规则拿它判「环还在不在
            # 转」——节奏改了而规则窗口没改，那条判据就会在健康节点上常亮，所以两
            # 个数一起读（见 values 里这个键上方的注解）。
            - name: COGNEVA_CLAIM_SCAN_INTERVAL_SECS
              value: "300"
            # 镜像库是同一份账的另一格：镜像解出来的层不在任何卷里，kubelet 看不见，
            # 而它花的正是这台节点的盘。走查它和走查存储根是同一件事——读一台机器上
            # root 本来就读得到的目录——所以留在同一个进程里，不另起特权容器。
            #
            # 层库不止一个：镜像构建写进去的 rootful buildah/podman 存储是同一种字节，
            # 只是不属于 kubelet，所以按 `name=mountPath` 逐个列出来，读数用 `store`
            # 标签分开（本机另计 54.9 + 11.4 GB，此前两边都没有任何产出者）。顶层条目
            # 标题在几个库之间重名（`overlay`、`storage`），没有这个标签两条不同目录的
            # 读数会合成一条序列，谁后走查谁的数字就是答案。
            - name: COGNEVA_IMAGE_STORE_ROOTS
              value: "containerd=/host/containerd,podman=/host/podman,buildah=/host/buildah"
            - name: COGNEVA_IMAGE_SCAN_INTERVAL_SECS
              value: "900"
            # 节点名从 fieldRef 取 spec.nodeName，由产出方自己盖成样本上的 `node`
            # 标签：抓取方给 DaemonSet 目标打的是 instance=<PodIP>，重建即变、且与
            # 任何别处携带的节点名对不上，判词就只能写成按节点分组而无从分组。
            - name: COGNEVA_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          # 监听先起来，首趟走查（存储根 + 三个镜像库）跑在它后面：走查耗时等于
          # 那些树的规模，本机实测 3m35s、2026-10-26 那次 4m12s，而「监听还没起」
          # 与「进程根本没起来」对探针是同一件事，平台对后者的答复是重启，重启
          # 又把同一趟走查从头走一遍。所以 /health/live 一起监听就答，等待挪到
          # /health/ready 上——它在首趟走查跑完（跑完不等于读到）之前不答就绪，
          # 抓取端点也到那时才出现，首拍仍然不会是空的。这两条探针的预算留着
          # 只是兜底：绑定本身是瞬时的。
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          # CPU 上限按突发定，不按均值：200m 下平均只用 0.077 核却有 0.83 的 cfs
          # 周期被限流，首拍被拖成 3m35s；给到 1 核后首拍 34.5s（同一棵树、同一进程）。
          #
          # 内存上限按**整个 cgroup**给，不按进程的 rss 给。192Mi 时期实测 usage
          # 191.2Mi 贴着顶（rss 只有 41~63Mi，另外 112~137Mi 是走查那 134 万文件
          # 带出来的页缓存），随后在 GFP_NOFS 分配上被内核 OOM 杀掉三次；它一走
          # 20 条卷用量序列一起消失，claim_usage_unmeasured 因此亮了半天的灯。
          # 抬到 512Mi 实测缓存又涨到 449Mi、usage 511Mi 继续贴顶。三档摆在一起
          # 才看清那条律：cgroup 占用是 min(这棵树的足迹, 上限)——192Mi 停 191~192、
          # 512Mi 停 506~512、1Gi 停 1023~1024 且缓存仍在往上要，足迹至少 1GiB。
          # 上限卡在足迹上等于没有余量，所以给到 2Gi：预期占用稳在 1.0~1.4GiB 一带，
          # 若仍涨到贴着 2Gi，说明足迹不固定，要改的是走查（分段走查、把每段带出来
          # 的缓存还回去），不是这个数。
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # 只放开读与目录搜索：镜像层里有别的 uid 建的 0700 目录，没有这一条
              # 整个 overlayfs 分区读不出来（见模板头部的实测）。
              add:
                - DAC_READ_SEARCH
          volumeMounts:
            - name: storage-root
              mountPath: "/host/storage"
              # 只读：读数不需要写权，挂成只读让「量一下」这件事不可能改到节点上的卷。
              readOnly: true
            - name: image-store-root
              mountPath: "/host/containerd"
              readOnly: true
            - name: image-store-podman
              mountPath: "/host/podman"
              readOnly: true
            - name: image-store-buildah
              mountPath: "/host/buildah"
              readOnly: true
      volumes:
        - name: storage-root
          hostPath:
            path: "/var/lib/rancher/k3s/storage"
            # Directory 而不是 DirectoryOrCreate：目录不存在说明这台节点的存储布局
            # 不是我们认识的，造一个空目录只会把「配置错了」变成「干净的空账本」。
            type: Directory
        - name: image-store-root
          hostPath:
            path: "/var/lib/rancher/k3s/agent/containerd"
            type: Directory
        # 下面这几个用 DirectoryOrCreate 而不是 Directory：它们只在跑过 rootful 镜像
        # 构建的节点上才有，没有它的节点是「这台节点没有这个库」而不是布局不对——造一个
        # 空目录把前者变成 0 字节，不会凭空造出用量，也不会让整个 Pod 起不来。
        - name: image-store-podman
          hostPath:
            path: "/var/lib/containers"
            type: DirectoryOrCreate
        - name: image-store-buildah
          hostPath:
            path: "/var/lib/cogneva-buildah"
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists