# GitOps 拉取端最小权限：
# 主应用 Pod 内的 puller 需要 apply L0 配置 configmap、重建 prompts configmap、
# 对 cogneva 部署做金丝雀（set image / rollout pause|resume|undo|status）
# 并读取 pod 健康信号。全部限定 namespace 内、resourceNames 白名单。
# 推送端读金丝雀基底的那四个 deployment 也走这里：两个 Pod 都会构造推送端，
# 按名可读是最小面（见下面那条只读规则）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-gitops-puller
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  # L0：kubectl apply cogneva-json（热更新）+ 重建 cogneva-prompts。
  # apply 首次需要 create，后续 get+patch。
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json", "cogneva-prompts"]
    verbs: ["get", "patch", "create"]
  # L1 金丝雀：set image / rollout pause|resume|undo 都是 patch；
  # rollout status 需要 get+watch。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout undo 要从历史 ReplicaSet 还原 PodTemplate。
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # 金丝雀基底的按名读：推送端要取这四个工作负载当前在跑的不可变 main tag，
  # 而它也可能跑在本身份所在的 Pod 里（两个 Pod 都会构造推送端），所以这四个
  # 名字要对本身份可读。只读——写权限仍然只有上面那一个目标（cogneva）。
  # 为什么不一次 list：resourceNames 与 list 组合要求请求带对应的 field
  # selector，集合级 list 在本身份下必被拒（现场读数 `cannot list resource
  # "deployments" in API group "apps"`），而这条路径读不到时只会静默退回浮动
  # tag —— 拿不到授权与"集群里确实还是浮动 tag"就再也分不出来了。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-security-gateway", "cogneva-sandbox-executor", "cogneva-evolution"]
    verbs: ["get"]
  # 金丝雀看护：readiness 与 restart count。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-gitops-puller
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-gitops-puller
  apiGroup: rbac.authorization.k8s.io
---
# 拓扑面的节点与 Pod 读权限：集群作用域。节点不属于任何命名空间；Pod 跟着一起
# 扩到集群作用域，是因为进程采集器是一个 hostPID 的 DaemonSet，它读的就是整台
# 宿主上每一个容器的 cgroup——只画本命名空间的 Pod，差出来的容器有进程读数却没有
# 位置，读者分不清「没有」和「没读」。
# 只要 get 与 list：拓扑按轮询读，不 watch，也没有任何写。事件与卷声明同样在这一层：
# 那两条集合读不带 `namespaces/<ns>`，命名空间里的 Role 授不了它们，写了也只有 403。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cogneva-topology-reader
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # 节点实际用量同样来自 metrics-server；没装时这条规则不会被用到。
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Pod 与它们的实际用量，与上面同一条理由。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # 没有 metrics-server 时的用量来源：kubelet 的 summary 接口经 apiserver 代理读，
  # apiserver 把 `/stats/*` 映射到 `nodes/stats` 子资源。只读；不给 `nodes/proxy`，
  # 那一项连 exec 一起授权。
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  # 资源面：命名空间配额与默认限额，只读。
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  # 部署面：全部工作负载的副本、镜像与滚动条件（集合级 list，不是按名读）。
  # 三种形态就是三种状态读法：只授 deployments 时 postgres、redis、三个 DaemonSet、
  # 两个 CronJob 在页面上根本不存在，而屏上照样是一张看起来完整的表。
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  # batch 是另一个分组：Job 与 CronJob 不在 apps 里。
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # 事件与卷声明：集合级的两条路径（`/api/v1/events`、`/api/v1/persistentvolumeclaims`），
  # 一次读全集群，按对象分派由读回来的 owner 关系自己做。
  - apiGroups: [""]
    resources: ["events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cogneva-topology-reader
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
# 谁跑这份镜像的默认入口，谁就端着这一面。进化进程与网关是同一个二进制、同一套路由，
# 它同样答 `/api/v1/cluster/topology`，读不到就在屏上画空白。
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: cogneva
roleRef:
  kind: ClusterRole
  name: cogneva-topology-reader
  apiGroup: rbac.authorization.k8s.io
