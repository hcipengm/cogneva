# GitOps 拉取端最小权限：
# 主应用 Pod 内的 puller 需要 apply L0 配置 configmap、重建 prompts configmap、
# 对 cogneva 部署做金丝雀（set image / rollout pause|resume|undo|status）
# 并读取 pod 健康信号。全部限定 namespace 内、resourceNames 白名单。
# 推送端读金丝雀基底的那四个 deployment 也走这里：两个 Pod 都会构造推送端，
# 按名可读是最小面（见下面那条只读规则）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-gitops-puller
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  # L0：kubectl apply cogneva-json（热更新）+ 重建 cogneva-prompts。
  # apply 首次需要 create，后续 get+patch。
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json", "cogneva-prompts"]
    verbs: ["get", "patch", "create"]
  # L1 金丝雀：set image / rollout pause|resume|undo 都是 patch；
  # rollout status 需要 get+watch。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout undo 要从历史 ReplicaSet 还原 PodTemplate。
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # 金丝雀基底的按名读：推送端要取这四个工作负载当前在跑的不可变 main tag，
  # 而它也可能跑在本身份所在的 Pod 里（两个 Pod 都会构造推送端），所以这四个
  # 名字要对本身份可读。只读——写权限仍然只有上面那一个目标（cogneva）。
  # 为什么不一次 list：resourceNames 与 list 组合要求请求带对应的 field
  # selector，集合级 list 在本身份下必被拒（现场读数 `cannot list resource
  # "deployments" in API group "apps"`），而这条路径读不到时只会静默退回浮动
  # tag —— 拿不到授权与"集群里确实还是浮动 tag"就再也分不出来了。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-security-gateway", "cogneva-sandbox-executor", "cogneva-evolution"]
    verbs: ["get"]
  # 金丝雀看护：readiness 与 restart count。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-gitops-puller
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-gitops-puller
  apiGroup: rbac.authorization.k8s.io
---
# 拓扑面的节点读权限：集群作用域，因为节点不属于任何命名空间。
# 这一面要读的是节点的就绪条件、角色标签与可分配量（status.allocatable）；
# Pod 一层仍由上面那条命名空间 Role 授权，不跟着扩到集群作用域。
# 只要 get 与 list：拓扑按轮询读，不 watch，也没有任何写。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cogneva-topology-reader
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # 节点实际用量同样来自 metrics-server；没装时这条规则不会被用到。
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
# 拓扑面在命名空间里额外要的三样：事件、卷声明、Pod 的实际用量。
# pods 本身已由上面 gitops 看护那条 Role 授权，这里不重复。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-topology-reader
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-topology-reader
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: Role
  name: cogneva-topology-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cogneva-topology-reader
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: cogneva
roleRef:
  kind: ClusterRole
  name: cogneva-topology-reader
  apiGroup: rbac.authorization.k8s.io
