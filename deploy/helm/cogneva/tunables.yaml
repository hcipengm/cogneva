  - key: backends.redis.infoExporter.intervalSeconds
    source: fixed
    why: >-
      The scrape cadence agreement, not a measured size: a scraped reading only
      has to be newer than the scrape interval to be a reading at all, and the
      monitoring stack scrapes at 30 s. A faster poll returns the same INFO reply;
      a slower one makes two consecutive scrapes carry the same sample. The value
      is published as cogneva_redis_info_interval_seconds, so the staleness rule
      derives its bound from it instead of holding a second copy that can drift.
  - key: backends.redis.infoExporter.walScanIntervalSeconds
    source: fixed
    why: >-
      A cost agreement with the store it reads: the census is one full keyspace
      walk with an LLEN per matching key, so it runs on its own slower clock
      rather than with every INFO. Five minutes is far slower than the cap it
      watches -- the longest log moves one append at a time -- so "is the cap
      holding" is answered well before a log can grow from the cap to twice it.
      The poller is a shell loop inside the redis image and dies with the Pod, so
      no process survives to measure its own pass and feed it back; the value is
      published as cogneva_redis_wal_scan_interval_seconds so a staleness rule
      reads the configured cadence instead of a second copy of it.
