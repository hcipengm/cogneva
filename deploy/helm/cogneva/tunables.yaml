  - key: mainlineDeployer.registryMaintenance.retention
    source: derived
    why: >-
      How many revisions the registry keeps, recomputed at every maintenance
      round: the PVC's declared bytes divided by what one revision actually
      costs. The cost is measured from the tag manifests -- each revision's
      layers that no other tag references, plus its config and manifest bytes --
      so the shared base is not charged to every revision and the computed count
      follows both a changed volume and a changed image size without a restart.
      Labels such as `local`, `seed` and `promote-*` count as references: a
      layer they pin is not freed by deleting a revision. The declared 20 is the
      seed when the volume is not declared or no revision has a measurable
      unique layer; `source` on the published target says which side the round
      used, and the evaluations counter shows a round was evaluated even when
      the target did not move.
    published:
      owner: crates/cog-reflection/src/mainline_deployer.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/mainline_deployer.rs
      test: the_registry_retention_follows_the_volume_and_the_measured_rev_footprint

  - key: mainlineDeployer.registryMaintenance.threshold
    source: derived
    why: >-
      The used-bytes-to-declared-bytes ratio that triggers reclamation,
      recomputed on every poll from the volume's own readings: the growth
      between two consecutive walker readings, projected over one measured
      cooldown window, sets the headroom the threshold must leave (1 - growth
      in the window / declared). The floor is one revision's measured unique
      footprint, so a quiet volume still keeps one push of room. A faster
      growing or smaller volume lowers the threshold and reclaims earlier
      without a restart. The declared 0.5 is the seed used when the volume or
      the declared size has not been read yet; the published target carries
      which side the round used, and the evaluations counter shows every poll
      evaluated the loop even when the target did not move.
    published:
      owner: crates/cog-reflection/src/mainline_deployer.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/mainline_deployer.rs
      test: the_reclaim_threshold_follows_the_measured_growth_and_window

