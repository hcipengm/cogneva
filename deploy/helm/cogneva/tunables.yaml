  # --- resource governance ----------------------------------------------------
  # The ceiling numbers are not chart values: they are projected from the rendered
  # declarations by `deploy/scripts/project-resource-governance.py` into
  # `values.resource-governance.<profile>.yaml`, which carries a GENERATED header
  # and is re-derived (and compared byte for byte) on every render. So no row here covers
  # them -- a row would be a second source for a number whose whole point is that
  # nobody writes it. What remains below are the inputs to that projection -- the
  # only terms no rendered manifest can declare -- and the policy defaults it copies
  # through. The runtime workloads are inputs of the same kind: their shape is a
  # declaration the pod's own code makes, and the projection sums it like any other
  # workload rather than trusting a hand-written budget.
  - key: resourceGovernance.clusterNodes
    source: override
    why: >-
      How many nodes the DaemonSets spread over, which is how many Pods the quota
      must admit per DaemonSet. No manifest can say it: the same tree is applied
      to a one-node K3s and to a production cluster. The profile names it, and the
      projection reads it from there -- so a cluster with more nodes is a profile
      edit plus a re-render, not a number typed into the ceiling.

  # 运行期自建 Pod 那部分额度没有行，因为它没有一个写在 values 里的数：评测台
  # 创建 Pod 前按自己那份清单算出它占多少、把额度抬到装得下，跑完放回去——尺寸
  # 的唯一来源是建它的代码，跟着它变，没有第二处可漂。`runtimeWorkloads` 留给
  # 不由产品创建、也不会自己抬额度的那类 Pod：其中的形状在这里有行（见下）。
  #
  # 这一族没有测量面可跟：那台 Pod 由宿主脚本 `scripts/host/eval-registered-rerun.sh`
  # 直接 apply，它不认识命名空间额度，也不会把自己的占用报给任何人。所以四个数
  # 只能登记成 override——写的是"谁定的"，不是"谁会让它动"。两处不许单独漂：
  # `scripts/host/eval-registered-rerun.test.sh` 逐字比对这里的形状与脚本那份清单。
  - key: resourceGovernance.runtimeWorkloads.0.cpuLimit
    source: override
    why: >-
      The CPU ceiling of the registered-eval rerun pod, which a host script
      creates and the product never sees. No reading can move it: the pod is
      outside the process that would publish one. The host script's manifest
      names the same number and a test compares the two.

  - key: resourceGovernance.runtimeWorkloads.0.cpuRequest
    source: override
    why: >-
      The CPU request of the same pod. It is what the projection adds to the
      quota's reserved total, so it is pinned next to the limit rather than
      derived: a request nobody declared would be scheduled from a default.

  - key: resourceGovernance.runtimeWorkloads.0.memoryLimit
    source: override
    why: >-
      The memory ceiling of the rerun pod; when the ceiling it is counted into
      is too small, the rollout holds and no revision lands, which is why this
      one is declared rather than left to borrow the surge reserve.

  - key: resourceGovernance.runtimeWorkloads.0.memoryRequest
    source: override
    why: >-
      The memory request of the same pod, counted into the reserved total the
      way the limit is counted into the ceiling.
  - key: resourceGovernance.limitRange.defaultCpu
    source: derived
    why: >-
      The CPU limit a container that declares none gets. It is one more call of
      the same law the per-container targets already use, on the same beat: the
      namespace's measured container requests are collapsed into one typical
      container (median request, p95 limit with the same headroom), clamped into
      the LimitRange's own admitted [min,max], and written back onto the
      `cogneva-limits` object as a merge patch carrying the full `spec.limits`
      array (the PVC entry and the max/min ride along; a partial patch would
      drop them). Admission reads the object, not this reading -- not writing
      back would leave the measured shape on the reading face only. Until any
      container has been measured the object's own declared default is published
      as the seed. The value in force and its `source` are published per
      limitRange, and every evaluation is counted, so "the value did not move"
      and "the loop did not run" are different readings.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: DEFAULT_CPU_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_namespace_default_follows_the_measured_requests

  - key: resourceGovernance.limitRange.defaultMemory
    source: derived
    why: >-
      The memory limit for the same containers: the same call of the same law
      (p95 over the window with the configured headroom, quantized up), clamped
      into the LimitRange's admitted range and written back with the full
      `spec.limits` array. Published per limitRange with its `source` and the
      evaluation counter beside the other three defaults.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: DEFAULT_MEMORY_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_namespace_default_follows_the_measured_requests

  - key: resourceGovernance.limitRange.defaultRequestCpu
    source: derived
    why: >-
      The CPU request a container that declares none gets: the median of the
      namespace's measured container requests, clamped into the LimitRange's
      admitted [min,max] with the limit kept at or above it (a request above its
      limit is rejected at admission). Written back with the full
      `spec.limits` array, published per limitRange with its `source`, and
      counted on the same evaluation counter.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: DEFAULT_REQUEST_CPU_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_namespace_default_follows_the_measured_requests

  - key: resourceGovernance.limitRange.defaultRequestMemory
    source: derived
    why: >-
      The memory request for the same containers: the same median, quantized up
      to the loop's memory grid, clamped into the LimitRange's admitted range
      with the limit at or above it, written back with the full `spec.limits`
      array and published per limitRange with its `source`.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: DEFAULT_REQUEST_MEMORY_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_namespace_default_follows_the_measured_requests

  - key: resourceGovernance.limitRange.minCpu
    source: fixed
    why: >-
      The admission floor for one container's CPU. It is the resource loop's own
      quantization grid (`CPU_QUANTUM_MILLICORES`, 10m): the loop never writes a
      request below one quantum, so a floor at that quantum refuses exactly what
      the loop cannot express. A different floor would be an admission rule the
      measurements are not on the same grid as, and the two would disagree in a
      direction nobody could name.

  - key: resourceGovernance.limitRange.minMemory
    source: fixed
    why: >-
      The admission floor for one container's memory: the same quantum
      (`MEMORY_QUANTUM_BYTES`, 16Mi) the resource loop rounds to, for the same
      reason as the CPU floor.

  - key: resourceGovernance.limitRange.pvcMinStorage
    source: fixed
    why: >-
      The smallest PVC the namespace admits. It is the volume loop's own grid:
      `volume_capacity.rs` rounds a grown claim up to whole GiB, so a floor of
      1Gi refuses exactly the claims that loop cannot express. Nothing measures
      it, and nothing should: it is the scale at which the only writer of
      storage requests works.

  # --- sandbox executor -------------------------------------------------------
  # `sandboxExecutor.buildCacheMaxBytes` 没有行：values 里不再有这个数。上限是
  # 每轮现算的——这块卷的声明量减同住者的实测占用——所以没有可登记的常量；
  # 覆盖写法（`--set sandboxExecutor.buildCacheMaxBytes=<字节>`）落在同一个
  # `cogneva_build_target_bytes_cap{source}` 上，读得出来源是 override。

  - key: sandboxExecutor.replicas
    source: fixed
    why: >-
      One executor: each task's worktree lives on this pod's volume, so a
      second copy would see a different volume and "who owns this worktree"
      would stop meaning anything. Not a reading.

  - key: sandboxExecutor.buildCacheScanIntervalSecs
    source: derived
    why: >-
      How often this executor's cache is re-walked and its cap re-enforced. The
      loop times each walk and keeps the period at twenty times the last walk's
      cost, so the walk stays one twentieth of the process as the cache grows,
      floored at the shared minimum. That floor also paces the loop's waking,
      and the loop beats on every waking, so a longer interval is not read as a
      stalled loop. The published interval is the one in force rather than this
      seed. `the_cache_walk_interval_follows_the_slowest_pass` holds the share.
    published:
      # The walk is run by the sandbox executor; the reading it states its
      # cadence on belongs to the shared readings type.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-core/src/build_cache_readings.rs
      metric: BUILD_TARGET_SCAN_INTERVAL_METRIC
      label: dir
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_cache_walk_interval_follows_the_slowest_pass

  - key: sandboxExecutor.maxTaskWorkspaces
    source: derived
    why: >-
      How many task worktrees the volume can hold at the size these trees
      actually measure. Every reclamation pass reads `df` available bytes on
      the workspaces root, divides by the size of one tree measured in that
      same pass, and keeps one tree's worth of room free for the git writes of
      the next cut. Trees growing with the repository and co-tenants filling
      the volume both move that reading, and the pass after either answers a
      different cap.
      The configured number is the seed: before any tree exists there is no
      per-tree figure to divide by, and it stops applying as soon as one does.
      What it was before this: a policy ceiling that stayed in force alongside
      the measurement, and on 2026-11-07, at 8 while 14 distinct tasks were
      active inside half an hour, it was the tighter of the two -- the executor
      built 17 trees and reclaimed 18 in that window, one task's tree was
      reclaimed and rebuilt four times in five minutes, and each rebuild costs
      9 seconds here (measured) and restores only committed content, so an
      agent's uncommitted files went with the tree. A number about this volume
      cannot outlive this volume that way; the reading can only be as wrong as
      the next pass.
      On a directory-backed volume (local-path) `df` on the workspaces root
      describes the node's filesystem. That is the volume's backing store, so
      it is still the room these trees have -- what it does not give is a
      per-claim attribution, and nothing here needs one.
    published:
      # The number in force and the one input set that chose it. A rule reading
      # only the seed could not tell a pass that measured from a pass that
      # never had a tree to measure.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: WORKSPACE_CAP_METRIC
      label: source
    proof:
      # Grows the measured footprint on the same router and reads a different
      # cap from the very next pass; the evaluation counter shows the beat ran.
      file: crates/cog-extension/src/workdir.rs
      test: the_worktree_cap_is_recomputed_from_the_volume_on_the_next_pass

  - key: sandboxExecutor.warmTrees
    source: derived
    why: >-
      How many trees are kept cut and waiting so an arriving task does not pay
      for a checkout. The size is Little's law over two measurements: how many
      lanes get a tree per second (arrival timestamps kept in a window), times
      how long one checkout costs (the median of the last successful
      `git worktree add` durations). Their product is how many arrivals are
      waiting while one tree is cut, which is exactly the pool that removes
      that wait. The target is clamped to half the measured task capacity: the
      pool exists to make arrivals cheap, and spending the capacity on trees no
      task has asked for would make the tasks themselves wait.
      The configured number is the seed, and only applies until both
      measurements exist. What it was measured at: a conversation's first tool
      call took 6.69 s end to end, 6.5 s of it `git worktree add` (3403 ms on
      its own for this 49 MB repository), against 0.128 s for the same command
      five minutes later in a tree that already existed. About 1.1 tasks a
      minute against a 3.4 s refill is what made 2 the seed.
      2026-11-07, one former bound was the other way round: a refill stood down
      whenever the ceiling was full, and with the ceiling at 32 and the volume
      holding 32 the pool was drained by two hand-outs and never refilled
      again. What a slot costs now is the directory of one task tree the next
      arrival would have reclaimed anyway.
    published:
      # The target in force and the input set that chose it, plus the number of
      # recomputations: a target that happens not to move still has to show the
      # pass that read its inputs is running.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: WARM_TREES_METRIC
      label: source
    proof:
      # Feeds the two measurements to the running router and reads the target
      # back on the next pass, with the evaluation counter moving with it.
      file: crates/cog-extension/src/workdir.rs
      test: the_warm_pool_target_is_recomputed_on_the_next_reclamation_pass

  - key: sandboxExecutor.repoFetchIntervalSecs
    source: derived
    why: >-
      How often the bare repository's main is fetched. The executor measures
      how long `main` stayed still before its last move -- the only reading
      anyone here has of the upstream push rate -- and polls at half that
      stillness, floored at 30s. The configured number is the seed: it applies
      until the first move is observed, and only then.
      `the_fetch_period_follows_how_long_main_was_still` drives the pure
      function with a busy repository, a quiet one, and no reading at all. The
      loop still wakes on a fixed floor and reports a beat on every waking, so
      a longer fetch interval is not reported as a stalled loop.
    published:
      # The executor publishes the wait it is actually keeping, labelled by
      # whether a measurement decided it: a configured number and a measured
      # one must not read the same on the panel.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: FETCH_INTERVAL_METRIC
      label: source
    proof:
      # Drives the observed stillness and the configured period and reads the
      # wait back: those two inputs are the whole of what it may depend on.
      file: crates/cog-extension/src/workdir.rs
      test: the_fetch_period_follows_how_long_main_was_still

  - key: sandboxExecutor.resources.requests.cpu
    source: derived
    why: >-
      The scheduling claim is not pinned: the workload-resources loop reads this
      container's `cpu.usageNanoCores` from the kubelet summary every few minutes,
      keeps a seven-day window, and patches the request to the window's p95,
      rounded up to 10m, whenever the move is at least one quantum. The reading
      published under this key carries `source=derived` once the window has enough
      samples, and `source=seed` with the declared value before that, so a reader
      can always tell which side of the measurement it is looking at.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: REQUEST_CPU_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_request_follows_the_measured_draw

  - key: sandboxExecutor.resources.requests.memory
    source: derived
    why: >-
      The scheduling claim is not pinned: the workload-resources loop reads this
      container's `memory.workingSetBytes` from the kubelet summary every few
      minutes, keeps a seven-day window, and patches the request to the window's
      p95, rounded up to 16Mi, whenever the move is at least one quantum. The
      reading published under this key carries `source=derived` once the window
      has enough samples, and `source=seed` with the declared value before that,
      so a reader can always tell which side of the measurement it is looking at.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: REQUEST_MEMORY_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_request_follows_the_measured_draw

  - key: sandboxExecutor.resources.limits.cpu
    source: derived
    why: >-
      The CPU bound follows the measured draw: the loop patches the limit to the
      window's peak on `cpu.usageNanoCores` times the 120% headroom the
      volume-capacity loop also uses, rounded up to 10m and never below the
      request; a run that keeps being throttled at the bound raises it further.
      The reading published under this key carries `source=derived` once the
      window has enough samples, and `source=seed` with the declared value before
      that, so a reader can always tell which side of the measurement it is
      looking at.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: LIMIT_CPU_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_request_follows_the_measured_draw

  - key: sandboxExecutor.resources.limits.memory
    source: derived
    why: >-
      The memory bound follows the measured draw: the loop patches the limit to
      the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      rounded up to 16Mi and never below the request. The reading published under
      this key carries `source=derived` once the window has enough samples, and
      `source=seed` with the declared value before that, so a reader can always
      tell which side of the measurement it is looking at.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: LIMIT_MEMORY_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_request_follows_the_measured_draw

  - key: sandboxExecutor.storage
    source: derived
    why: >-
      The executor's own volume. How full it is, is measured: the loop walks the claim from the executor process and raises the declaration to the walk's peak x 120% (whole GiB). The number of task worktrees is the input it follows, not a figure the declaration names.
    published:
      owner: crates/cog-reflection/src/volume_capacity.rs
      file: crates/cog-reflection/src/volume_capacity.rs
      metric: BYTES_METRIC
      label: state
    proof:
      file: crates/cog-reflection/src/volume_capacity.rs
      test: a_claim_target_follows_the_measured_used_bytes

  - key: sandboxExecutor.workspaceGcIntervalSecs
    source: derived
    why: >-
      How long goes by between reclamation passes. The value the loop acts on is
      a multiple of the last pass's own duration, so the walk's cost stays a
      fixed share of the process as the volume fills and the pass gets slower;
      the floor is the pace the loop wakes at. This number is the seed used
      until a pass has been timed.
    published:
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: GC_INTERVAL_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_gc_interval_follows_the_slowest_pass_not_a_written_period

  - key: sandboxExecutor.workspaceTtlSecs
    source: derived
    why: >-
      How long an idle task worktree may live. The reclamation pass derives it
      from the two readings that do not depend on the TTL itself: how many
      trees the volume holds (the measured cap) and how far apart new trees
      arrive (from the sidecars' creation times). The hold is as long as it
      takes arrivals to refill half the volume, floored at an hour. The reuse
      history cannot set it -- a tree idle longer than the TTL is already gone,
      so every observed gap is shorter than the number it would feed and such
      a rule doubles forever while looking like a closed loop. The configured
      value applies until two trees exist to measure an arrival interval.
      `the_idle_ttl_follows_arrivals_and_capacity_not_reuse_gaps` drives the
      pure function with faster arrivals, a larger volume, one tree, and no
      span.
    published:
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: TTL_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_idle_ttl_follows_arrivals_and_capacity_not_reuse_gaps

  # --- security gateway -------------------------------------------------------
  - key: securityGateway.auditedLlmMaxBodyBytes
    source: fixed
    why: >-
      How much document text may leave in one request through the audited
      channel. Eight MiB is the HTTP body convention, and it is deliberately not
      tied to the document write bound: that one limits bytes written to disk,
      this one limits text entering a model.

  - key: securityGateway.auditedLlmPort
    source: fixed
    why: >-
      The audited channel's own port, separate from 8080/8081 because its whole
      value is a small reachable set. An address.

  - key: securityGateway.metricsPort
    source: fixed
    why: >-
      The observability channel's port, deliberately separate from the proxy
      ports because those inject upstream credentials. An address.

  - key: securityGateway.replicas
    source: derived
    why: >-
      The same failure-domain law as the main gateway: one Ready node gets one
      replica, two or more get two, and the security gateway carries
      `cogneva.io/replica-policy: topology` so the workload-resources loop
      patches it from the live node count. The seed applies only until the
      first read. The rendered PostgreSQL sharing count budgets for the
      worst-case two replicas, so each credential-holding process divides the
      server's ceiling by the number of processes that can exist at once.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: REPLICAS_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_workload_replicas_follow_the_ready_node_count

  - key: securityGateway.gitMirror.stallSecs
    source: derived
    why: >-
      How long the SSH fallback may produce no output before the transfer is
      declared dead. The window starts at the seed, floored by a structural
      minimum, and each successful transfer feeds its longest measured silence
      back through a tail window: a link that talks in bursts widens the next
      window, so a slow-but-alive clone is not killed. Published on the gateway's
      metrics with its evaluation count.
    published:
      owner: crates/cog-gateway/src/git_mirror.rs
      file: crates/cog-core/src/pacing.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-gateway/src/git_mirror.rs
      test: a_measured_silence_widens_the_window_the_next_transfer_is_judged_by

  - key: securityGateway.gitMirror.timeoutSecs
    source: derived
    why: >-
      The total bound on one clone/fetch/push, for the case that keeps emitting
      progress and never finishes. The expectation follows the measured total
      duration of successful transfers (tail times factor) from the seed, so it
      moves with the repository and the link instead of with a human reading of
      one clone.
    published:
      owner: crates/cog-gateway/src/git_mirror.rs
      file: crates/cog-core/src/pacing.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-gateway/src/git_mirror.rs
      test: a_measured_silence_widens_the_window_the_next_transfer_is_judged_by

