  - key: taskRouter.claimConcurrency
    source: derived
    why: >-
      How many tasks one executing process runs at once -- the number of
      concurrent spenders of the token window, and the only global bound on
      parallelism: the board's column limits are per goal, so a `running=1`
      there holds each goal to one and says nothing about eight goals running
      eight tasks. The bound is now the pool's own arithmetic: once per claim
      interval `crates/cog-orchestrator/src/task_executor_router.rs` reads the
      pool's window status and divides what the window has left by what one
      whole job has actually cost -- `(allowance - spent) / reserve`, where the
      reserve is the supervisor's measure over finished jobs. The difference
      falls immediately (only idle permits can be taken back, in-flight work
      finishes), a rise climbs one step and only after the current bound was
      actually full, and a window that can pay for nothing closes the lane to
      zero. The ordinary read loops share the permits, so the new bound is
      written back to every one of their `claim_slots` readings and the
      evaluation counter rises on every beat that recomputed it, whether or
      not the number moved. The shipped 0 asks for that derivation; a positive
      value is still the override. The seed (4) applies only until the first
      window is read, and an unreadable or partial measurement leaves the bound
      where it is rather than treating silence as an empty window. Why the old
      pinned values are not kept: measured 2026-11-01, both processes held four
      and spent 1,105,275 of the k3 five-hour window's 1,670,569 tokens in the
      first ten minutes, none of the eight changes finishing; measured again
      2026-11-05, zero refusals all day and a peak of 73 million input tokens an
      hour against 4-15 million in the hours pinned at one -- the recorded
      readings say the limit was never the token window, and no pinned number
      can follow the window as it rolls. The companion bound is
      `agent_pool.worker_count` in `cogneva.json`: nothing here is claimed until
      that pool has a turn, so the two numbers still have to move together.
    published:
      owner: crates/cog-orchestrator/src/task_executor_router.rs
      file: crates/cog-orchestrator/src/observable.rs
      metric: TASK_ROUTER_CLAIM_SLOTS_METRIC
      label: source
    proof:
      file: crates/cog-orchestrator/src/task_executor_router.rs
      test: the_claim_bound_is_republished_when_the_window_moves

  - key: taskRouter.localClaimConcurrency
    source: derived
    why: >-
      How many change tasks the process-local lane runs at once -- the lane every
      change-generation task travels, so this number is the platform's change
      throughput. The chart ships 0, which asks for the bound to be derived:
      every window `crates/cog-orchestrator/src/lane_memory.rs` reads the
      container's `memory.max` and this process's `memory.current`, prices one
      task as the highest increment per task in flight over the last hour's
      samples (measured task life 12.8 minutes, so about five tasks), and divides
      the headroom by that price; the bound falls at once and climbs one step
      only after the current bound was actually run full. A positive number is
      the override seat and pins it. The
      two inputs are the reason it cannot be a constant: the 2026-11-07 reading
      that pinned it at 1 (peak 15.96 GiB of a 16 GiB ceiling, mean 8.27 GiB) is
      a fact about the container as it was sized that day, and a number typed
      into the chart cannot see the container grow. What the loop cannot do is
      raise the ceiling itself: the namespace quota measured the same day holds
      78Gi of limits.memory with 59.6Gi in use plus a roll's replacement overlap,
      so the derived bound stays at one until somebody raises the container and
      the loop reads the new `memory.max`.
    published:
      owner: crates/cog-orchestrator/src/lane_memory.rs
      file: crates/cog-orchestrator/src/observable.rs
      metric: TASK_ROUTER_CLAIM_SLOTS_METRIC
      label: source
    proof:
      file: crates/cog-orchestrator/src/lane_memory.rs
      test: the_bound_follows_the_container_limit

  - key: changeLedger.rowsPerHandover
    source: derived
    why: >-
      How many owed changes one hand-over carries, recomputed on every ledger
      pass from the batches the pass itself handed over. The price of a task is
      mostly its fixed part -- a plan, a run's context, a sandbox round over the
      whole tree -- and that part does not grow with what the task carries, so
      handing the queue over one row per task paid it once per row: measured
      2026-11-06, 1,957 pending rows of which 1,694 were the same shape ("give
      principle X the gate it is owed"), against about 102 LLM calls and about
      one yuan per task attempt. What bounds the batch is the generator, not this
      loop: a batch becomes one change, and a batch past what one generation can
      write comes back truncated and loses everything in it. So the bound is the
      largest batch a hand-over carried to completion, plus one -- a bigger size
      is tried, and landing it is what makes it the new proof. A batch a
      generation refused for the work's own reason caps the bound one below its
      size, so a refused shape is not repeated while the evidence is younger
      than 30 days; a refusal below what has already landed caps nothing,
      because the proven size still works. A refusal paid to the environment is
      the pool's answer and moves nothing. While no batch bigger than the seed
      has completed, the seed (5) stands. The pass writes the bound and its
      `source` to `cogneva_change_ledger_rows_per_handover` and counts every
      recomputation on `cogneva_change_ledger_rows_per_handover_evaluations_total`,
      because a bound that only moves with its inputs cannot show that the loop
      behind it is still running. The deployment's 0 means derive; a positive
      number pins the batch and is reported as `override`.
    published:
      owner: crates/cog-orchestrator/src/change_ledger.rs
      file: crates/cog-orchestrator/src/observable.rs
      metric: ROWS_PER_HANDOVER_METRIC
      label: source
    proof:
      file: crates/cog-orchestrator/src/change_ledger.rs
      test: the_batch_bound_follows_the_graphs_batch_outcomes

  # --- probe budgets ----------------------------------------------------------
  - key: healthProbes.liveness.periodSeconds
    source: fixed
    why: >-
      The kubelet probe contract. It is written out rather than omitted because
      the kubelet default is one second -- an idle-node value that kills a backend
      on a busy node (redis was killed this way). The period is the probe's own
      convention, not a capacity measurement.

  - key: healthProbes.liveness.timeoutSeconds
    source: fixed
    why: >-
      Same contract, same reason for being explicit: the default timeout is the
      idle-node number.

  - key: healthProbes.liveness.failureThreshold
    source: fixed
    why: >-
      The runtime budget, chosen so a busy node still gets answered. It is a
      practice written as a constant; no measurement moves it.

  - key: healthProbes.readiness.periodSeconds
    source: fixed
    why: >-
      The readiness half of the probe contract; explicit for the same reason as
      liveness.

  - key: healthProbes.readiness.timeoutSeconds
    source: fixed
    why: >-
      The readiness half of the probe contract.

  - key: healthProbes.readiness.failureThreshold
    source: fixed
    why: >-
      How many missed answers take a Pod out of the endpoints. A practice.

  - key: healthProbes.startup.periodSeconds
    source: fixed
    why: >-
      The startup half of the probe contract. The startup budget as a whole is
      sized for the slowest legitimate start (loading a large AOF, first initdb,
      building an index); it is a stated policy, and no loop measures start
      durations back into it.

  - key: healthProbes.startup.timeoutSeconds
    source: fixed
    why: >-
      The startup half of the probe contract.

  - key: healthProbes.startup.failureThreshold
    source: fixed
    why: >-
      60 attempts at 5 seconds is the five-minute startup budget. The number is
      the slowest legitimate start written down, not a derived bound.

  - key: healthProbes.appStartup.periodSeconds
    source: fixed
    why: >-
      The probe contract's own period, kept equal to every other startup budget:
      the app's budget differs in how many attempts it allows, not in how often
      it is asked.

  - key: healthProbes.appStartup.timeoutSeconds
    source: fixed
    why: >-
      The startup half of the probe contract, for the main app's own budget.

  - key: healthProbes.appStartup.failureThreshold
    source: derived
    why: >-
      Attempts at a 5 s probe, sized by how long this deployment's starts
      actually take: the workload-resources loop reads every Ready pod's time
      from `status.startTime` to the transition that made it Ready, keeps the
      longest in a seven-day window, adds 20% headroom and divides by the probe
      period. It patches `startupProbe.failureThreshold` on the Deployments
      carrying `cogneva.io/startup-policy: measured`.
      The declared value is a floor, not a seed that yields: a start too slow
      for the budget never reaches Ready and so never becomes a sample, and
      shrinking below the last declared number is how this loop would turn its
      own failure into silence. Only a slower measured start raises it. The
      first start on 2026-11-06 measured 323 s (model load, a schema batch
      queued behind other readers' locks, a collection create retrying through
      its own timeout), so 120 attempts is the starting floor; the deployer's
      900 s still bounds the whole rollout.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: STARTUP_THRESHOLD_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_startup_budget_follows_the_longest_measured_start

  - key: healthProbes.claimStoreStartup.periodSeconds
    source: fixed
    why: >-
      The same probe contract, kept at the same period as every other startup
      budget: the claim store's budget differs in how many attempts it allows,
      not in how often it is asked.

  - key: healthProbes.claimStoreStartup.timeoutSeconds
    source: fixed
    why: >-
      The startup half of the probe contract, for the claim store's own budget.

  - key: healthProbes.claimStoreStartup.failureThreshold
    source: derived
    why: >-
      The same startup-budget law as the main app, applied to the claim store's
      own start: longest Ready transition minus `status.startTime` over the
      seven-day window, 20% headroom, divided by the 5 s probe period. The
      DaemonSet carries `cogneva.io/startup-policy: measured`, so the
      workload-resources loop patches its `startupProbe.failureThreshold`. The
      declared value is a floor: a start that outgrows the budget never becomes
      a Ready sample, and only a slower successful start raises the budget. The
      3m35s start measured on this host (containerd, podman and buildah roots
      at a 200m quota) is what the floor covers; the roots only grow with the
      images pulled.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: STARTUP_THRESHOLD_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: the_startup_budget_follows_the_longest_measured_start

  # The backup and drill Jobs answer a different question than the probes above:
  # not "will the process respond" but "is it still making progress". Their
  # stop bound is not in this file at all -- the process writes the window it
  # was measured to need into the progress file on every step, and the probe
  # compares the file's age against that window. These four leaves are only the
  # asking rhythm, so no loop can read a window back into them.
  - key: healthProbes.progressFile.periodSeconds
    source: fixed
    why: >-
      The probe contract's own period. Asking more often cannot stop a Job any
      earlier than the first tick after the age passes the window the file
      names, so a finer period buys nothing but probe noise.

  - key: healthProbes.progressFile.timeoutSeconds
    source: fixed
    why: >-
      The probe contract's timeout, written out for the same reason as every
      other probe here: the kubelet default is the idle-node number.

  - key: healthProbes.progressFile.failureThreshold
    source: fixed
    why: >-
      Three misses at 30 seconds, so one flaky read of the progress file does not
      become a restart. A practice, not a measurement.

  - key: healthProbes.progressFile.initialDelaySeconds
    source: fixed
    why: >-
      The first thing the Job does is create the progress file, so the grace
      only covers scheduling and volume mounting.

  # --- host document organising ----------------------------------------------
  - key: hostDocuments.approvalTtlSecs
    source: derived
    why: >-
      How long a staged plan stays approvable, which is also the validity of an
      approval. Every approval records how long it sat between staging and
      approval; the window is 1.25x the slowest approval of the last 30 days,
      never below the declared seed. Only the observed tail can widen it: an
      approval that never happened is not a measurement, and shrinking on a
      quiet month would cut off the reader the window exists for. The published
      gauge `sandbox_host_docs_approval_ttl_seconds` carries `source=derived`
      once a measured approval sets it and `source=seed` while the declared
      value is in force; the evaluations counter is the beat evidence.
    published:
      owner: crates/cog-extension/src/hostdocs.rs
      file: crates/cog-extension/src/hostdocs.rs
      metric: APPROVAL_TTL_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/hostdocs.rs
      test: the_approval_window_follows_the_measured_latency

  - key: hostDocuments.assistBodyBytes
    source: derived
    why: >-
      How many wire bytes of one body a classification question carries. The
      plan is recomputed on every organize run that reaches the model station.
      Its window is the largest request this audited channel answered, floored
      by the deployment's own practice (this seed times the candidate seed plus
      the prompt's fixed text) and capped by the channel's audited body bound
      (`securityGateway.auditedLlmMaxBodyBytes`, handed over as
      `HOST_DOCS_ASSIST_AUDIT_BUDGET_BYTES`). The per-body prefix is at least
      this seed and at most what a typical file in the folder needs, so a
      question carries whole files when it can and never less of a body than the
      deployment called evidence. The request is counted in the bytes the
      channel's bound counts -- the serialized body, escapes included -- and a
      question larger than the window is only probed when the audit bound or a
      smaller failure says it fits; a probe that fails caps the next one at one
      byte under it. The two numbers in force are published as
      `sandbox_host_docs_assist_body_bytes` and
      `sandbox_host_docs_assist_question_files` under a `source` label, and each
      recompute is counted on `sandbox_host_docs_assist_plan_evaluations_total`:
      the value not moving and the loop not running have to be different
      readings. The seed is the floor while nothing has been measured, not a
      ceiling.
    published:
      owner: crates/cog-extension/src/hostdocs.rs
      file: crates/cog-extension/src/hostdocs.rs
      metric: ASSIST_BODY_BYTES_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/hostdocs.rs
      test: the_question_plan_follows_the_answered_question_and_the_beat_counts

  - key: hostDocuments.assistMaxCandidates
    source: derived
    why: >-
      How many files one classification question covers. Same loop and same
      window as the body prefix above: the count in force is the window's
      capacity at that prefix, raised by what the channel has answered. A folder
      larger than the plan still covers is asked about in full only when a probe
      is allowed (the audited channel's bound, or a failure above the size being
      tried); otherwise the run is refused as `over_candidates` rather than
      asked about in part, because a partial answer would make the plan depend
