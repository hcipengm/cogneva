  - key: gateway.replicas
    source: derived
    why: >-
      Replicas are the number of failure domains that can be lost: one Ready
      node gets one replica, two or more get two. Two is the smallest set that
      survives any single node going away, and a third copy on a third node
      buys no new failure domain -- only another copy of the credential
      material. The workload-resources loop reads `/api/v1/nodes` every round,
      counts Ready nodes, and patches `/spec/replicas` on the Deployments
      carrying `cogneva.io/replica-policy: topology`; the seed applies only
      before the first round has read the cluster.
      The connection budget follows: the rendered
      `COGNEVA_PG_SHARING_PROCESSES` counts the worst-case replica count of
      every workload that shares the database, so a scale-out does not leave
      each process dividing the server's ceiling by a stale process count.
