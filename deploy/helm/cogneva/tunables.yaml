    source: derived
    why: >-
      The wait between two reclamations, so a volume whose resident floor stays
      above the threshold is not restarted every poll. The cooldown follows how
      long the last reclamation actually held the tag service away, doubled; a
      zero-length hold is not a sample and leaves the target where it was. No
      rebuild measured yet means the seed.
    published:
