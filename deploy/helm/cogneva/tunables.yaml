  # --- workspace quota (WebUI file surface) ---
  - key: workspaceFetch.connectTimeoutSecs
    source: fixed
    why: >-
      A property of git's transport protocol, not a size: how long the client
      waits for the mirror to answer the connection at all. The fetch runs in a
      one-shot init container that dies when it finishes, so no process survives
      to measure connect latency and feed it back -- and the value is read at Pod
      start, before any transfer has happened. Bound to git's own
      http.connectTimeout, where the behaviour is defined.

  - key: workspaceFetch.lowSpeedLimitBytesPerSec
    source: fixed
    why: >-
      The transport protocol's own definition of a dead transfer: git aborts when
      throughput stays below this rate for lowSpeedSecs. The evolution and sandbox
      init containers pass the same pair so one link cannot be held to a different
      notion of "still moving". The bound is "is it moving", not "how long": a
      slow but advancing fetch was measured at fourteen minutes and must not be
      killed.

  - key: workspaceFetch.lowSpeedSecs
    source: fixed
    why: >-
      The other half of the same protocol threshold: how long throughput may stay
      under lowSpeedLimitBytesPerSec before git gives up. A liveness window, not a
      duration budget for the transfer itself; shared by both init containers so
      the same transfer is judged the same way on either path.

