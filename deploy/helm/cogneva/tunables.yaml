# The tunable registry: one row per numeric leaf `values.yaml` carries.
#
# The Rust half of the same account lives on the constants themselves, as a
# `// cap: bound` or `// cap: fixed` line in the comment block above each one,
# judged by `crates/cogneva/tests/rust_capacity_constants_registry_test.rs`: a
# numeric `const` in production code with no such line is red the same way a
# chart leaf with no row here is. The two are split by what they enumerate, not
# by who owns them — a dial that reaches the cluster through `values.yaml` is
# accounted here, and one that never leaves the process is accounted on the
# constant. The account is not a second file in either half: a row for a number
# that no longer exists is the drift this shape was chosen to make impossible.
#
# The Rust half has two words, not three, and that is deliberate: a `const` is
# frozen at compile time, so no reading can move it and `derived` is not an
# answer it can give. What a constant can be is `bound` (pinned against the
# world; the reason says what pins it) or `fixed` (not a dial; the reason names
# the agreement). A `derived` marker on a constant is refused with that reason,
# not accepted as a third spelling of "somebody measured it once".
#
# A number a deployment ships is one of three things, and the page shows all
# three as the same number:
#
#   derived   a measurement sets it, so it moves when the input it reads moves.
#             The row says which input, which reading the number lands on, and
#             which test shows the value following its input.
#   override  the deployment names it. It stays where it was pinned, and the row
#             says why no loop closes over it yet -- that sentence is the debt.
#   fixed     it is not a dial: a protocol port, an interface bound, a practice.
#             No measurement should move it, and the row says which agreement.
#
# What the gate checks, and why it is shaped this way:
#
#   - every numeric leaf of the chart has exactly one row, and every row names a
#     numeric leaf. This is the whole point: a key nobody has looked at must be a
#     missing row, not an absence nobody notices. The set is read from the chart
#     on every run, so a value that is added to `values.yaml` without a row goes
#     red, and a row whose key left the chart goes red too.
#   - every row says something. For `override`/`fixed` that is the reason it is
#     not derived; for `derived` it is what the value reads.
#   - a `derived` row has to name a reading and a test that moves its input. A
#     comment claiming a number tracks the world is not evidence that it does;
#     the test is the only part of the claim a machine can refuse.
#   - a row that lands on a reading has to use a word the reading can carry
#     (`derived`/`override`), and the file it names has to publish that metric
#     and that label.
#
# The three words are not a maturity ladder. `fixed` is a complete answer for a
# protocol constant; `override` is the honest answer for a cap whose loop has not
# been built. What is not allowed is a value that is one of these and a row that
# says none.
version: 1
rows:

  # --- notification / alerting ------------------------------------------------
  - key: alertmanager.email.smtpPort
    source: fixed
    why: >-
      587 is the SMTP submission port with STARTTLS. The number belongs to the
      protocol; a relay listening elsewhere is an operator's --set, not a
      measurement for a loop to track.

  # --- application data -------------------------------------------------------
  - key: appData.storage
    source: derived
    why: >-
      The declaration the install starts from. The volume-capacity loop walks
      the claim, compares the peak of `cogneva_data_volume_used_bytes` over its
      recent rounds against this request with the same headroom the chart's
      declarations are sized by, and patches the claim up to it when the peak
      no longer fits -- bounded by the LimitRange's per-claim maximum and by
      quota room, and reporting a clamp instead of churning when either is in
      the way. A declaration that falls behind the writing therefore catches up
      on its own; this number is what it starts from, not what it stays at.
    published:
      owner: crates/cog-reflection/src/volume_capacity.rs
      file: crates/cog-reflection/src/volume_capacity.rs
      metric: BYTES_METRIC
      label: state
    proof:
      file: crates/cog-reflection/src/volume_capacity.rs
      test: a_declaration_below_the_peak_is_raised_to_the_headroom_rounded_up

  # --- optional backends ------------------------------------------------------
  - key: backends.meilisearch.replicas
    source: fixed
    why: >-
      One instance: the index is a projection of the shared database, so a
      second copy would ingest the same rows again. Nothing measures query
      load on this store, so no loop moves this number.

  - key: backends.postgres.replicas
    source: fixed
    why: >-
      One instance: the database is single-writer in this chart, so a second
      copy would be a second dataset rather than a replica. Failover is not
      configured here, and no reading moves this number.

  - key: backends.redis.replicas
    source: fixed
    why: >-
      One instance, and its name redis-0 is written into several DSNs. A
      second copy needs sentinels or cluster mode, which this chart does not
      configure; no reading moves this number.

  - key: backends.qdrant.replicas
    source: fixed
    why: >-
      One instance: sharding and replication are a cluster mode this chart
      does not configure, and nothing measures vector-store load.

  - key: backends.nats.replicas
    source: fixed
    why: >-
      One instance: the bus carries process-to-process messages rather than a
      durable queue, so a second node needs cluster routing and stream
      replication. Not a reading.

  - key: backends.seaweedfs.replicas
    source: fixed
    why: >-
      One instance: master, volume, filer and S3 run in one pod, and scaling
      them is a cluster deployment of those roles rather than a replica
      count. Not a reading.

  - key: backends.meilisearch.storage
    source: derived
    why: >-
      The search index volume. The capacity loop reads this claim's used bytes from the claim-store walker (no process of ours runs inside the backend Pod), keeps the peak over its window, and raises the declaration to peak x 120% rounded up to whole GiB when the peak no longer fits. A PVC cannot shrink, so the reading only ever moves the declaration up; `cogneva_volume_capacity_bytes{claim,state}` publishes the peak the round measured and the declaration it left on the object.
    published:
      owner: crates/cog-reflection/src/volume_capacity.rs
      file: crates/cog-reflection/src/volume_capacity.rs
      metric: BYTES_METRIC
      label: state
    proof:
      file: crates/cog-reflection/src/volume_capacity.rs
      test: a_claim_target_follows_the_measured_used_bytes

  - key: backends.meilisearch.resources.requests.cpu
    source: derived
    why: >-
      The scheduling claim is not pinned: the workload-resources loop reads this
      container's `cpu.usageNanoCores` from the kubelet summary every few minutes,
      keeps a seven-day window, and patches the request to the window's p95,
      rounded up to 10m, whenever the move is at least one quantum. The reading
      published under this key carries `source=derived` once the window has enough
      samples, and `source=seed` with the declared value before that, so a reader
      can always tell which side of the measurement it is looking at.
    published:
      owner: crates/cog-reflection/src/workload_resources.rs
      file: crates/cog-reflection/src/workload_resources.rs
      metric: REQUEST_CPU_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workload_resources.rs
      test: a_request_follows_the_measured_draw

