  # --- platform webhook -------------------------------------------------------
  - key: webhook.nodePort
    source: fixed
    why: >-
      The cluster entry point for the GitHub and Gitee webhooks, forwarded to the
      gateway's 8082. An address that outside senders are configured against; a
      measurement must not move it.

  # --- shutdown ---------------------------------------------------------------
  - key: shutdown.terminationGraceSeconds
    source: fixed
    why: >-
      The one number in the shutdown face: how long kubelet waits after SIGTERM
      before it kills the process. Both workloads that run agent turns take it,
      and the process's drain budget is computed from it rather than pinned
      beside it (`grace - shutdown.drainTeardownMarginMs`), so raising it is one
      edit and cannot leave half the pair behind. Why not derived: what the
      reading can say is smaller than what a derivation would need. A drain that
      was abandoned records the cap it hit -- it is censored at the budget, and
      only says `at least this long` -- so a high quantile taken over the
      histogram is a quantile of the drains that were fast enough to finish, and
      it converges on `as fast as the fast ones are` no matter how many turns
      the cap is cutting short. Fitting this number to that quantile would size
      it by the half of the distribution that never needed it. What the reading
      can do is falsify the policy, and that is the rule it is read by: any
      `timeout` row on `cogneva_shutdown_drain_milliseconds`, or a non-zero
      `cogneva_shutdown_drain_abandoned_total`, over a sustained window, is
      evidence that real turns outlast this number and the repair is to raise
      it. Until that evidence exists the number is a policy with no measurement
      to move it -- its two costs (a rollout that waits, a call that is
      interrupted) are the same event on either side of the line, so there is no
      optimum in it to search for. Disposition `fixed`: the field belongs to
      kubelet, and what holds it is the structural relation to the computed drain
      budget and the teardown margin, not a measurement of its own.

  - key: shutdown.drainTeardownMarginMs
    source: fixed
    why: >-
      The part of the grace that is not the drain: flushing logs, letting the
      tokio runtime unwind, and the window between the process exiting and
      kubelet seeing it. It is not a dial -- the cost of stopping does not move
      with how long the drain took -- and it is subtracted from the grace to give
      the process its budget, so a larger margin would not buy a longer drain, it
      would shorten one. Written as a number instead of a code constant because
      it is arithmetic the chart does (`cogneva.drainBudgetMs`): both the pod
      field and the process environment are rendered from these two leaves, and a
      margin living in Rust would leave the chart claiming a budget it had not
      computed.

  # --- listening ports --------------------------------------------------------
  # Every port a workload listens on is an address, not a dial: nothing measures
  # it, and the only thing a measurement could say about it is "the process bound
  # what it was told". They are values all the same, because the number is written
  # in four to seven places per port -- container port, Service, the process's own
  # config file, the env layer that overrides it, the network policy on both
  # sides, the ingress, and the deployment notes -- and a port that moves in one
  # of them reads as a dead backend, not as a half-finished edit.
  - key: gateway.httpPort
    source: fixed
    why: >-
      The app's main HTTP port. An address: the Service, the ingress backend,
      the network policy, the port-forward note and the process's own
      cogneva.json all carry it.

  - key: gateway.wsPort
    source: fixed
    why: >-
      The WebSocket face. An address, kept apart from httpPort so the ingress can
      give long connections their own timeout.

  - key: gateway.internalPort
    source: fixed
    why: >-
      The zero-credential in-cluster face (memory archive writes and Raw reads).
      An address: what makes it a separate face is the network policy that
      decides who may reach it, not the number.

  - key: gateway.webhookPort
    source: fixed
    why: >-
      The webhook forward entry the security gateway hands verified platform
      events to. An address.

  - key: gateway.metricsPort
    source: fixed
    why: >-
      The port the process is told to expose metrics on, through the env layer
      and cogneva.json. An address; the scrape itself goes to httpPort/metrics,
      which is why the two must be read from one file.

  - key: sandboxExecutor.metricsPort
    source: fixed
    why: >-
      The executor's one outward face: it holds no credentials, so its readings
      are all it publishes. An address.

  - key: securityGateway.egressProxyPort
    source: fixed
    why: >-
      The gateway's egress proxy (container port name egress-proxy): git
      transport and platform API passthrough. An address, and a listened-on one:
      the process takes it from COGNEVA_SG_EGRESS_PORT, so the chart passes that
      env from this same key -- without it a moved value would move the Service
      and leave the process on the old port.

  - key: securityGateway.llmProxyPort
    source: fixed
    why: >-
      The gateway's LLM proxy (container port name llm-proxy), which also
      carries the /github, /gitee, /git and /search-fallback routes. An address,
      written into nine base URLs across the app and evolution pods, and the
      port the process itself binds (COGNEVA_SG_LLM_PORT, passed from here).

  - key: securityGateway.webhookPort
    source: fixed
    why: >-
      The gateway's platform webhook entry (container port name webhook), where
      GitHub and Gitee signatures are verified before anything is forwarded. An
      address, and the port the process binds (COGNEVA_SG_WEBHOOK_PORT, passed
      from here).

  - key: backends.postgres.port
    source: fixed
    why: >-
      The database's port, carried by the container port, the Service and five
      DSNs in four workloads plus the app's own config file. An address.

  - key: backends.postgres.exporterPort
    source: fixed
    why: >-
      The metrics sidecar's port beside the database. An address the scraper
      names.

  - key: backends.redis.port
    source: fixed
    why: >-
      The store's port, carried by the container port, the Service, four DSNs
      and the WAL census script that polls INFO from beside it. An address.

  - key: backends.redis.aofReportExporter.port
    source: fixed
    why: >-
      The node-exporter sidecar's port that serves the AOF repair verdict
      textfile. An address.

  - key: backends.qdrant.port
    source: fixed
    why: >-
      Qdrant's REST port, the one the backup snapshots and the network policy
      use; gRPC has no snapshot API. An address.

  - key: backends.qdrant.grpcPort
    source: fixed
    why: >-
      Qdrant's gRPC port, which the app's QDRANT_URL points at for batch writes.
      An address.

  - key: backends.nats.port
    source: fixed
    why: >-
      The bus's client port, used for inter-process delivery. An address.

  - key: backends.nats.monitorPort
    source: fixed
    why: >-
      The bus's monitoring endpoint (--http_port), carried in both the args and
      the container port. An address.

  - key: backends.meilisearch.port
    source: fixed
    why: >-
      Meilisearch's HTTP port, which the evolution pod health-checks at startup
      and the app reads the wiki index from. An address.

  - key: backends.seaweedfs.masterPort
    source: fixed
    why: >-
      The master's port in the four-process single pod (it allocates volumes).
      An address, written in both the args and the container port.

  - key: backends.seaweedfs.volumePort
    source: fixed
    why: >-
      The volume server's port, where objects actually live. An address.

  - key: backends.seaweedfs.filerPort
    source: fixed
    why: >-
      The filer's port: the directory-shaped view over the volumes. An address.

  - key: backends.seaweedfs.s3Port
    source: fixed
    why: >-
      The S3 gateway's port, the one the app signs requests against and the
      readiness probe waits on. An address.

  - key: webSearch.port
    source: fixed
    why: >-
      The self-hosted SearXNG port: the derived base URL, the container port,
      the Service and the egress rule all read it. An address.

  - key: webFetch.port
    source: fixed
    why: >-
      The render backend's port, read the same way as webSearch.port. An
      address.

  - key: ingress.proxyTimeoutSecs
    source: fixed
    why: >-
      nginx's proxy-read/send-timeout is a protocol parameter at the edge: how
      long an idle proxied connection may stay open. The WebSocket face and the
      live event stream are idle between frames by design, and nginx's 60 s
      default severs them in a way the browser reports only as a reconnect. The
      gateway cannot tell the ingress how long its connections live -- the ingress
      is the one holding them -- so the value is the edge's own contract, set
      above any legitimate idle gap.

  - key: observability.eventLog.maxRows
    source: derived
    why: >-
      Rows the observability event log may hold. The sweep measures the table's
      held rows and bytes on every pass and divides the table's share of the
      declared database volume by the measured bytes per row; both directions
      move the answer without a restart -- a wider row buys fewer rows, a larger
      declared volume buys more. The declared million is the seed while the table
      is empty or the volume is not declared. The published target carries
      `source=derived` when the measurement was used and `source=seed` when it
      was not, and the evaluations counter rises on a pass whose target did not
      move.
    published:
      owner: crates/cog-storage/src/observability_event_cap.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-storage/src/observability_event_cap.rs
      test: a_beat_whose_target_does_not_move_still_counts

  - key: observability.eventLog.readWindowSeconds
    source: derived
    why: >-
      The window inside which no row may be deleted, whatever the capacity says.
      Not a second retention knob: it is the floor, and it follows the widest
      span a historical query actually asked for -- the gateway records each
      answered span, and the sweep recomputes the floor on its next pass. It can
      only widen: a narrower question does not shrink a promise already made, and
      a quiet week must not turn yesterday's answer into a gap. The declared day
      matches the query's default window, so a reader asking for that default
      never sees a hole the sweep made; `source` on the published target says
      whether a measured span widened it.
    published:
      owner: crates/cog-storage/src/observability_event_cap.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-storage/src/observability_event_cap.rs
      test: the_read_window_follows_the_longest_question_asked

  - key: checkpointStore.maxRows
    source: derived
    why: >-
      Rows the checkpoint store may hold. The sweep measures the table's held
      rows and bytes on every pass and divides the table's share of the declared
      database volume by the measured bytes per row; a wider snapshot buys fewer
      rows, a larger declared volume buys more, and both follow the next pass
      without a restart. The declared forty thousand is the seed while the table
      is empty or the volume is not declared. The published target carries
      `source`, and the evaluations counter is what separates "nothing to do"
      from "the sweep stopped".
    published:
      owner: crates/cog-storage/src/checkpoint_cap.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-storage/src/checkpoint_cap.rs
      test: a_beat_whose_target_does_not_move_still_counts

  - key: llmExchangeRetention.keepDays
    source: derived
    why: >-
      Days the prompt-and-response archive keeps a body. The sweep measures the
      archive's bytes and its oldest row's age on every pass and divides the
      table's share of the declared database volume by the measured daily write;
      the declared 30 days is the seed while the archive is empty or the volume
      is not declared. The loop still publishes the days in force as
      gateway_llm_exchange_keep_seconds, so `llm_exchange_retention_behind`
      judges the archive against the value this pass used rather than a constant
      in the rules file. The target carries `source` on the shared retention
      face, and the evaluations counter shows a pass counted even when the
      target did not move. A deployment that measures but does not retire still
      expresses that through its seed, not through a pinned day count.
    published:
      owner: crates/cog-observability/src/exchange_retention.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-observability/src/exchange_retention.rs
      test: the_retention_follows_the_measured_daily_write

  - key: taskEventRetention.keepDays
    source: derived
    why: >-
      Days a task's event stream is kept after it last appended. The sweep
      measures the table's bytes and its oldest row's age on every pass and
      divides the table's share of the declared database volume by the measured
      daily write; the declared 30 days is the seed while the archive is empty
      or the volume is not declared. The unit stays the whole stream: a stream a
      checkpoint names is not deletable at all, and a deleted prefix would answer
      a replay with a gap shaped like the start of the run. The loop publishes
      the days in force as cogneva_task_events_keep_seconds, so
      `task_event_archive_behind` compares the archive against what this pass
      used. The published target carries `source`, and the evaluations counter
      separates a steady target from a stopped loop.
    published:
      owner: crates/cog-storage/src/task_event_retention.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-storage/src/task_event_retention.rs
      test: the_retention_follows_the_measured_daily_write

  - key: llmUsageRetention.keepDays
    source: derived
    why: >-
      Days the token ledger keeps its per-call rows. The sweep measures the
      ledger's bytes and its oldest row's age on every pass and divides the
      table's share of the declared database volume by the measured daily write;
      the declared 30 days is the seed while the ledger is empty or the volume is
      not declared. Age is not the only cutoff: a row that no hourly fold window
      summed is the only copy of that spend, so the sweep deletes only what is
      both past the derived age and inside the fold's own range, and publishes
      the rows it cannot touch as cogneva_llm_usage_uncovered_rows. The days in
      force are published as gateway_llm_usage_keep_seconds, and the read side
      asks for the same value. The target carries `source`, and the evaluations
      counter is the beat evidence.
    published:
      owner: crates/cog-observability/src/usage_retention.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-observability/src/usage_retention.rs
      test: the_retention_follows_the_measured_daily_write

