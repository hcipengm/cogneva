  - key: evolution.workspaces.ephemeralTtlSecs
    source: derived
    why: >-
      How long an ephemeral worktree may live. At every maintenance beat (the
      deployer's cycle, each poll interval) the manager measures how many trees
      arrived over the last week, the bytes of the average tree, and the free
      bytes of the volume they sit on, and takes half the time those arrivals
      need to fill the volume (`ttl_for_half_turnover`). The result is floored at
      the longest completed evolution round so a live tree is never collected
      mid-round; reclaimed trees do not feed that floor, or the loop would chase
      its own output. The declared 7 days is the seed when something cannot be
      measured -- no arrivals yet, no tree, a volume that will not answer -- and
      a zero seed turns derivation off. The published target carries
      `source=derived` when a measurement was used and `source=seed` when it was
      not; the evaluations counter shows the beat keeps running.
    published:
      owner: crates/cog-reflection/src/workspace.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workspace.rs
      test: the_ephemeral_ttl_follows_the_measured_volume_and_arrivals

  - key: evolution.workspaces.orphanBranchTtlSecs
    source: derived
    why: >-
      How long an `evol/<old-id>` branch may go untouched before reclamation.
      At every maintenance beat the manager counts how many branch names
      appeared over the last week (the first census is zero arrivals, not "all
      of them are new"), measures the bytes unique to those branches with
      `git rev-list --disk-usage --objects` excluding main, and divides the bare
      repository's free bytes by the time that arrival rate needs to fill it.
      A live instance's branch is force-pushed on every transplant, so it keeps
      arriving and stays outside the window. The declared 30 days is the seed
      when the repository cannot be measured; a zero seed disables collection.
      The published target carries `source` and an evaluations counter, so a
      quiet repository and a stopped loop do not look alike.
    published:
      owner: crates/cog-reflection/src/workspace.rs
      file: crates/cog-core/src/retention.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/workspace.rs
      test: the_orphan_branch_ttl_follows_the_measured_repo_and_rotations

  - key: evolution.workspaces.targetMaxBytes
    source: derived
    why: >-
      The sentinel `auto` rather than a number: the cap is the pre-reclaim
      working set's peak over the last week with 20% headroom, held under the
      free space of the volume the directory sits on, and recomputed from every
      walk. A number here is the same measurement taken once by hand, and it
      stops being true the first time the cache outgrows it -- the growth the
      cap exists to catch, and the one a pinned value cannot notice. `0` still
      means measure without bounding, and a positive number still overrides.
