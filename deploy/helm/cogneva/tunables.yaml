  - key: backup.keepCount
    source: derived
    why: >-
      How many packages the volume keeps. Every backup run recomputes it from
      the volume's capacity (statvfs) divided by the measured sizes of the
      packages already on it, newest first; the newest package is kept even when
      it alone exceeds the volume. The declared 7 is only the seed for a run that
      cannot measure -- no package yet, or a volume that will not answer. The
      number the run actually used is written to its ledger row as
      `keep_target`, beside `kept`, and the backup-runs loop publishes that pair
      as `BACKUP_RUN_READINGS{readout="keep_target"}` and `{readout="kept"}`, so
      the value in force and the pass that used it are both readable.
    published:
      owner: crates/cogneva/src/backup.rs
      file: crates/cog-orchestrator/src/backup_runs.rs
      metric: BACKUP_RUN_READINGS
      label: readout
