  # --- evolution worker -------------------------------------------------------
  - key: changeVerification.cargoBuildJobs
    source: derived
    why: >-
      The width the verification build fans out at, recomputed from the build
      gate's own measurement of this host: the host's cores divided by what one
      build demands of them, the same division the gate uses to decide how many
      builds fit. The verification process reads that width when it is spawned,
      so a build started after a window that changed the host follows without a
      restart, and the mainline build reads the same number. The declared 3 is
      the seed used while no gate is in force or no window has measured the
      host; the published gauge carries the width and the counter beside it says
      how many windows recomputed it, even when the number did not move.
    published:
      owner: crates/cog-reflection/src/build_gate/mod.rs
      file: crates/cog-reflection/src/build_gate/mod.rs
      metric: BUILD_GATE_CARGO_JOBS
      label: role
    proof:
      file: crates/cog-reflection/src/build_gate/mod.rs
      test: cargo_jobs_follow_the_measured_cores_and_build_demand

  - key: evolution.replicas
    source: fixed
    why: >-
      One evolution worker: a second copy would contend for the same build
      slot rather than add throughput, because the slot is the shared
      resource. Not a reading.

  - key: evolution.pollIntervalSecs
    source: derived
    why: >-
      How often the self-evolution loop looks for new work. The beat is the larger
      of the configured seed and the round that just ran: a round stacks probes
      and waits for their outcomes, so the interval the loop actually keeps is its
      own cost. The seed is the floor -- polling the same machinery faster than
      the configured cadence only spends tokens. The pacer publishes its target
      and evaluation count on the same scrape as the loop's other readings.
    published:
      owner: crates/cog-reflection/src/plugin.rs
      file: crates/cog-core/src/pacing.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/plugin.rs
      test: the_discovery_wait_follows_what_a_round_cost

  - key: evolution.buildGate.maxConcurrent
    source: derived
    why: >-
      The zero sentinel means "derive it": the gate takes the tightest of the
      host's CPU, memory, IO-stall and build-cgroup-memory dimensions and labels
      the published ceiling with the dimension that decided it. A positive value
      is the override branch, and that branch is published as
      dimension="override" so a pinned number and a measured one never read the
      same.
    published:
      # The file that builds the value and the file that publishes the reading are
      # the same one here: the gate derives the ceiling and reports it.
      owner: crates/cog-reflection/src/build_gate/mod.rs
      file: crates/cog-reflection/src/build_gate/mod.rs
      metric: BUILD_GATE_CEILING
      label: dimension
    proof:
      file: crates/cog-reflection/src/build_gate/mod.rs
      test: the_ceiling_is_the_tightest_dimension

  - key: evolution.buildGate.waitSecs
    source: derived
    why: >-
      How long one build waits for a slot. The effective wait is the tail of the
      waits that actually outlasted a poll, doubled and floored at two polls: a
      gate that queues produces waits, not a number someone picked. A refused wait
      is deliberately not fed back -- the caller's retry is what the gate is
      protecting.
    published:
      owner: crates/cog-reflection/src/build_gate/mod.rs
      file: crates/cog-core/src/pacing.rs
      metric: TARGET_METRIC
      label: source
    proof:
      file: crates/cog-reflection/src/build_gate/mod.rs
      test: the_wait_budget_follows_the_waits_that_actually_happened

