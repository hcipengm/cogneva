# The tunable registry: one row per numeric leaf `values.yaml` carries.
#
# A number a deployment ships is one of three things, and the page shows all
# three as the same number:
#
#   derived   a measurement sets it, so it moves when the input it reads moves.
#             The row says which input, which reading the number lands on, and
#             which test shows the value following its input.
#   override  the deployment names it. It stays where it was pinned, and the row
#             says why no loop closes over it yet -- that sentence is the debt.
#   fixed     it is not a dial: a protocol port, an interface bound, a practice.
#             No measurement should move it, and the row says which agreement.
#
# What the gate checks, and why it is shaped this way:
#
#   - every numeric leaf of the chart has exactly one row, and every row names a
#     numeric leaf. This is the whole point: a key nobody has looked at must be a
#     missing row, not an absence nobody notices. The set is read from the chart
#     on every run, so a value that is added to `values.yaml` without a row goes
#     red, and a row whose key left the chart goes red too.
#   - every row says something. For `override`/`fixed` that is the reason it is
#     not derived; for `derived` it is what the value reads.
#   - a `derived` row has to name a reading and a test that moves its input. A
#     comment claiming a number tracks the world is not evidence that it does;
#     the test is the only part of the claim a machine can refuse.
#   - a row that lands on a reading has to use a word the reading can carry
#     (`derived`/`override`), and the file it names has to publish that metric
#     and that label.
#
# The three words are not a maturity ladder. `fixed` is a complete answer for a
# protocol constant; `override` is the honest answer for a cap whose loop has not
# been built. What is not allowed is a value that is one of these and a row that
# says none.
version: 1
rows:

  # --- notification / alerting ------------------------------------------------
  - key: alertmanager.email.smtpPort
    source: fixed
    why: >-
      587 is the SMTP submission port with STARTTLS. The number belongs to the
      protocol; a relay listening elsewhere is an operator's --set, not a
      measurement for a loop to track.

  # --- application data -------------------------------------------------------
  - key: appData.storage
    source: derived
    why: >-
      The declaration the install starts from. The volume-capacity loop walks
      the claim, compares the peak of `cogneva_data_volume_used_bytes` over its
      recent rounds against this request with the same headroom the chart's
      declarations are sized by, and patches the claim up to it when the peak
      no longer fits -- bounded by the LimitRange's per-claim maximum and by
      quota room, and reporting a clamp instead of churning when either is in
      the way. A declaration that falls behind the writing therefore catches up
      on its own; this number is what it starts from, not what it stays at.
    published:
      owner: crates/cog-reflection/src/volume_capacity.rs
      file: crates/cog-reflection/src/volume_capacity.rs
      metric: BYTES_METRIC
      label: state
    proof:
      file: crates/cog-reflection/src/volume_capacity.rs
      test: a_declaration_below_the_peak_is_raised_to_the_headroom_rounded_up

  # --- optional backends ------------------------------------------------------
  - key: backends.meilisearch.storage
    source: override
    why: >-
      The search index volume. A derived value would read the index's used bytes
      against the volume's free space; the volume usage is alerted on, not fed
      back into the declaration.

  - key: backends.meilisearch.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.meilisearch.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.meilisearch.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.meilisearch.resources.limits.memory
    source: override
    why: >-
      Sized for the search index this store holds with room for index rebuilds; no loop re-measures the index against the bound.
  - key: backends.nats.storage
    source: override
    why: >-
      JetStream stream storage. It is bounded by the stream's retention, so a
      derived value would read that retention against the message rate; nothing
      computes it.

  - key: backends.nats.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.nats.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.nats.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.nats.resources.limits.memory
    source: override
    why: >-
      Sized for the JetStream backlog with room for file-store buffers; the backlog is measured elsewhere but never read back into this bound.
  - key: backends.postgres.storage
    source: override
    why: >-
      The database volume, sized for the tables the platform owns plus WAL. A
      derived value would follow the measured growth of pg_database_size; no loop
      reads it back.

  - key: backends.postgres.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.postgres.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.postgres.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.postgres.resources.limits.memory
    source: override
    why: >-
      Sized for the database already carried (962 MB on 2026-10-18) plus WAL and connections; no loop re-measures it.

  # The metrics sidecar's own bounds. A sidecar in the same Pod is charged to the
  # namespace ceiling like any other container, so these are part of the sum the
  # projection reads -- they are not free because they are small.
  - key: backends.postgres.exporterResources.requests.cpu
    source: override
    why: >-
      A scheduling claim sized for a handful of read-only queries per scrape; no
      measurement feeds back into it.

  - key: backends.postgres.exporterResources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the sidecar; the working set
      it needs over a scrape is carried by the limit.

  - key: backends.postgres.exporterResources.limits.cpu
    source: override
    why: >-
      A burst bound for a scrape over many tables; the steady rate sits far below
      it and no measurement of the burst feeds back into it.

  - key: backends.postgres.exporterResources.limits.memory
    source: override
    why: >-
      Has to cover the exporter's heap after the table count and scrape history
      have grown it: pinned at the steady average it is OOM-killed after a run of
      scrapes, and a restarting sidecar reads exactly like a database with no
      connections. No loop measures that growth today, so the bound is named here
      rather than derived.

  - key: backends.qdrant.storage
    source: override
    why: >-
      The vector store volume. Its size tracks the number of indexed chunks, which
      the application already knows; the declaration does not read that number.

  - key: backends.qdrant.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.qdrant.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.qdrant.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.qdrant.resources.limits.memory
    source: override
    why: >-
      Sized for the vector index with room for segment merges; no loop re-measures it.
  - key: backends.redis.storage
    source: override
    why: >-
      The persistence volume. An AOF rewrite can briefly need almost twice the
      dataset on disk, which is why the declaration is not the dataset size. A
      derived value would read the rewritten file size; nothing does.

  - key: backends.redis.resources.requests.cpu
    source: override
    why: >-
      The store's steady draw is well under a core; the request exists so the
      scheduler places it, not to express measured load. Nothing reads a measured
      figure back into it.

  - key: backends.redis.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set
      is carried by the limit. A request at working-set size would be a permanent
      claim for a figure that only exists after the RDB is loaded.

  - key: backends.redis.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup loading and AOF rewrites; the steady rate sits far
      below it and no measurement of the burst is fed back into the limit.

  - key: backends.redis.resources.limits.memory
    source: override
    why: >-
      The dataset loads 485.56 MB from RDB before the store accepts a connection,
      and 512Mi left about 27MB for AOF increments and write buffers, so the
      container was killed roughly twenty seconds after every start. The live
      patch raised it to 2Gi and the service has held with zero restarts since;
      the chart follows that value. A derived limit would read the loaded dataset
      size, and nothing does today.

  - key: backends.redis.aofRepair.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.redis.aofRepair.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.redis.aofRepair.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.redis.aofRepair.resources.limits.memory
    source: override
    why: >-
      A one-shot rewrite of the whole AOF before redis starts: the bound is a practice, not a measurement.

  - key: backends.redis.aofReportExporter.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: the store's steady rate sits far below it and nothing reads a figure back into it.

  - key: backends.redis.aofReportExporter.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the store; the working set is carried by the limit, not by this claim.

  - key: backends.redis.aofReportExporter.resources.limits.cpu
    source: override
    why: >-
      A burst bound for startup and compaction; the steady rate sits far below it and no measurement of the burst feeds back into it.

  - key: backends.redis.aofReportExporter.resources.limits.memory
    source: override
    why: >-
      A textfile collector beside redis; the footprint is the process plus the file it serves, and no reading moves it.
  - key: backends.redis.infoExporter.intervalSeconds
    source: override
    why: >-
      A scraped reading only has to be newer than the scrape interval to be a
      reading at all: 30 s matches the PodMonitor's interval, so the poller is
      never the reason two scrapes carry the same sample. The value is published
      as cogneva_redis_info_interval_seconds, so the staleness rule derives its
      bound from it instead of holding a second copy that can drift.
  - key: backends.redis.infoExporter.walScanIntervalSeconds
    source: override
    why: >-
      The WAL census is a full keyspace walk with an LLEN per matching key,
      which is the one reading here that costs the server work rather than a
      reply it already has. Five minutes is far slower than the cap it watches:
      the longest log moves by one append at a time, so the question "is the
      cap holding" is answered at any cadence well under the time a log takes
      to grow from the cap to twice it. The value is published as
      cogneva_redis_wal_scan_interval_seconds, so a staleness rule reads the
      cadence it was configured with instead of holding a second copy.
  - key: backends.redis.infoExporter.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim, not a measured draw: one redis-cli call every 30 s sits far below it and nothing reads a figure back into it.
  - key: backends.redis.infoExporter.resources.requests.memory
    source: override
    why: >-
      Small enough that a tight node still schedules the poller; the footprint is the shell plus one redis-cli process, and the limit carries it.
  - key: backends.redis.infoExporter.resources.limits.cpu
    source: override
    why: >-
      A burst bound for the poll loop. The burst is real and now measured: at
      100m the poller spent 57% of its CFS periods throttled while drawing under
      a millicore on average, because a fork-and-parse burst spends the whole
      100 ms quota in its first few milliseconds -- which is why the draw is not
      the reading that decides this number. Raised to 500m against that ratio on
      2026-10-23. Still an override: nothing re-derives it, so a pod that begins
      throttling again is caught by CPUThrottlingHigh and by the ledger row for
      an alert the mirror never sees, not by this value moving on its own.
  - key: backends.redis.infoExporter.resources.limits.memory
    source: override
    why: >-
      The poller's whole working set is the INFO reply it parses; no reading moves this bound.
  - key: backends.seaweedfs.resources.requests.cpu
    source: override
    why: >-
      The object store's steady draw is a fraction of a core; the request only
      has to let a tight node schedule it.

  - key: backends.seaweedfs.resources.requests.memory
    source: override
    why: >-
      Volume-server buffers are small beside the data itself, which lives on the
      volume; the limit carries the working set, not this claim.

  - key: backends.seaweedfs.resources.limits.cpu
    source: override
    why: >-
      A burst bound for compaction and S3 request handling; nothing measures the
      burst back into the limit.

  - key: backends.seaweedfs.resources.limits.memory
    source: override
    why: >-
      The raw and cold layers only grow (15 GiB in use when sized), but this bound
      covers buffers, not the data; no loop re-measures it.

  - key: backends.seaweedfs.storage
    source: override
    why: >-
      Write-once object storage for the permanent-memory raw and cold layers;
      15 GiB was already in use when this was set, so 20Gi. The volume only grows,
      and a cap that followed its growth has no loop.

  # --- backup ----------------------------------------------------------------
  - key: backup.keepCount
    source: override
    why: >-
      Seven daily packages. A derived count would follow the measured size of one
      package against the volume; the volume usage is alerted on, not read back.

  - key: backup.runDeadlineSeconds
    source: override
    why: >-
      One hour against runs the ledger measures in tens of seconds. The flow
      already records started_at/finished_at per run, so a derived deadline could
      be a multiple of the observed run time; nothing computes it.

  - key: backup.drillDeadlineSeconds
    source: override
    why: >-
      One hour against a run that opens two packages, not one: the newest, then
      the one the window has gone longest without proving. One restore measured
      155 s on 2026-10-18 and 497 s on 2026-10-19, so the pair comes to about 17
      minutes and the hour keeps roughly three times the observed cost. The flow
      records each drill's own elapsed time, so a derived deadline could be a
      multiple of the observed one; nothing computes it. The deadline exists to
      bound a restore that hangs, not to track a normal one -- with Forbid, a
      stuck drill would otherwise block every drill after it.

  - key: backup.storage
    source: override
    why: >-
      The backup volume. Keep count times package size is the flow, and the
      package size is measured per run; the declaration does not read it.

  # --- node image builds ------------------------------------------------------
  - key: backup.resources.requests.cpu
    source: override
    why: >-
      A streaming COPY-to-file job whose resident set is small by construction;
      the request only has to let a tight node schedule it.

  - key: backup.resources.requests.memory
    source: override
    why: >-
      See requests.cpu above: the working set is small and no measurement feeds
      back into this claim.

  - key: backup.resources.limits.cpu
    source: override
    why: >-
      A ceiling for a straggling compression pass; the run time is measured per
      run, but nothing reads it back into this limit.

  - key: backup.resources.limits.memory
    source: override
    why: >-
      The tar.zst stream buffers only; the bound is a practice, not a reading.

  - key: backup.drillResources.requests.cpu
    source: override
    why: >-
      The drill restores the package into a scratch database; the request only
      has to let a tight node schedule it.

  - key: backup.drillResources.requests.memory
    source: override
    why: >-
      The restore streams through COPY on the postgres side, so the client's
      resident set is small and no measurement feeds back into this claim.

  - key: backup.drillResources.limits.cpu
    source: override
    why: >-
      A ceiling for a restore that has to finish inside the deadline; the
      deadline is what bounds it and neither value is derived.

  - key: backup.drillResources.limits.memory
    source: override
    why: >-
      See the backup job's bound: a practice, not a reading.

  - key: buildah.resources.requests.cpu
    source: override
    why: >-
      The daemon idles near 1Mi and is only busy during a build, so the request is
      the resident draw. A derived pair would read this container's measured peak;
      the resource face of a buildah DaemonSet is not published today.

  - key: buildah.resources.requests.memory
    source: override
    why: >-
      Sized for the idle daemon so a small node is not blocked by a permanent
      half-gigabyte claim. The build burst is carried by the limit.

  - key: buildah.resources.limits.cpu
    source: override
    why: >-
      A burst bound, not a steady rate: the daemon is idle except while a build
      runs, and no reading of that burst is fed back into the limit.

  - key: buildah.resources.limits.memory
    source: override
    why: >-
      Room for one image build; the node's actual headroom carries the rest. The
      measured peak of a build is the input a derived limit would read, and the
      build gate measures something adjacent (concurrent builds), not this.

  # --- in-cluster registry ----------------------------------------------------
  - key: clusterRegistry.nodePort
    source: fixed
    why: >-
      The node port kubelets pull from (localhost:30500, http because containerd
      treats localhost as plain). It is written into image.repository, so it is an
      address, not a dial.

  - key: clusterRegistry.resources.requests.cpu
    source: override
    why: >-
      The registry is a third-party process that publishes no metrics of its own;
      the request is a small floor. A derived pair would read the container's
      measured working set, which nothing collects for this pod.

  - key: clusterRegistry.resources.requests.memory
    source: override
    why: >-
      A floor for an idle registry. The volume it serves is measured by the walker
      sidecar, not this process's memory.

  - key: clusterRegistry.resources.limits.cpu
    source: override
    why: >-
      Burst room for a push, and now a reading behind it: kubelet reports every
      container's cfs periods, and on 2026-10-23 this one spent 0.304 of them
      throttled while averaging 23m of cpu, which is what moved the bound from
      200m to 500m. It stays `override` because a reading is not a loop: nothing
      walks this number from the throttled ratio on its own, so the honest record
      is that somebody read it and changed it.

  - key: clusterRegistry.resources.limits.memory
    source: override
    why: >-
      Burst room for a push. The push rate and payload size are not measured back
      into this bound.

  - key: clusterRegistry.storage
    source: override
    why: >-
      Canary overlays accumulate per revision; 7.4Gi was measured on disk when
      this was set, so 10Gi. The disk usage is measured by the walker sidecar and
      drives the retention loop, but the loop prunes revisions; it does not resize
      the claim.

  - key: clusterRegistry.walkerPort
    source: fixed
    why: >-
      The walker sidecar's scrape port, referenced by the Service endpoint that
      monitoring discovers. An address, not a dial.

  - key: clusterRegistry.walkerResources.requests.cpu
    source: override
    why: >-
      The walk is readdir+stat and does not eat CPU. A derived pair would read the
      walk's own duration against the scan interval; nothing publishes that for
      this sidecar.

  - key: clusterRegistry.walkerResources.requests.memory
    source: override
    why: >-
      Sized by the directory tree it walks; the store is far smaller than the
      declaration. The tree size is a measurement the walk already takes, and it
      is not read back into the request.

  - key: clusterRegistry.walkerResources.limits.cpu
    source: override
    why: >-
      A ceiling for a metadata walk. No reading of the sidecar's CPU is collected.

  - key: clusterRegistry.walkerResources.limits.memory
    source: override
    why: >-
      Room for one full walk of the store. The walk's peak is not published.

  # --- evolution worker -------------------------------------------------------
  - key: evolution.buildGate.maxConcurrent
    source: derived
    why: >-
      The zero sentinel means "derive it": the gate takes the tightest of the
      host's CPU, memory, IO-stall and build-cgroup-memory dimensions and labels
      the published ceiling with the dimension that decided it. A positive value
      is the override branch, and that branch is published as
      dimension="override" so a pinned number and a measured one never read the
      same.
    published:
      # The file that builds the value and the file that publishes the reading are
      # the same one here: the gate derives the ceiling and reports it.
      owner: crates/cog-reflection/src/build_gate/mod.rs
      file: crates/cog-reflection/src/build_gate/mod.rs
      metric: BUILD_GATE_CEILING
      label: dimension
    proof:
      file: crates/cog-reflection/src/build_gate/mod.rs
      test: the_ceiling_is_the_tightest_dimension

  - key: evolution.buildGate.waitSecs
    source: override
    why: >-
      How long one build waits for a slot. A derived wait would follow the
      measured time a slot is held, which the gate could record on release; it
      does not record hold times yet.

  - key: evolution.dataStorage
    source: override
    why: >-
      The evolution process's own /var/lib/cogneva-data, a different writer from
      the main application at the same path, so a separate claim. 49Gi measured,
      almost all raw-logs, so 64Gi. raw-logs are only layered down, never deleted,
      and nothing feeds the measured use back.

  - key: evolution.gitRemote.storage
    source: override
    why: >-
      The bare git mirror. Its size is a function of the repository's history,
      which the mirror itself could measure; the declaration does not read it.

  - key: evolution.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim for a workload whose real draw is a build burst. The
      container's cgroup is read by the build gate's cgroup_memory dimension, but
      that dimension reads the memory limit, not this request.

  - key: evolution.resources.requests.memory
    source: override
    why: >-
      A scheduling claim, separate from the limit the build gate reads. The
      measured working set would be the derived input; it is not published for
      this container.

  - key: evolution.resources.limits.cpu
    source: override
    why: >-
      Sized so the container can run its build with the rest of the workload.
      CFS throttling is visible in the cluster's own readings, and nothing closes
      that reading back into the limit.

  - key: evolution.resources.limits.memory
    source: override
    why: >-
      Read by the build gate's cgroup_memory dimension: the gate asks how many
      concurrent builds this cgroup can hold, so the number has a consumer, but
      the number itself is still named here. Raising it requires raising the
      LimitRange's per-container maximum in the same change, or the Pod is
      refused at admission.

  - key: evolution.sandboxStorage
    source: override
    why: >-
      The sandbox working area for evolution tasks. A derived value would read the
      live working-set size against the volume's free space; the cache walk
      publishes sizes per layer, and nothing turns them into this claim.

  - key: evolution.sourceStorage
    source: override
    why: >-
      Holds the shared CARGO_TARGET_DIR, measured at 149GiB on 2026-10-21 and
      growing with every build. This is the one claim whose shortfall stops
      builds outright (an evicted cache means a full rebuild), and the cache walk
      already measures its size; the claim does not follow it.

  - key: evolution.workspaces.cacheScanIntervalSecs
    source: override
    why: >-
      How often the shared cache's size is re-read. A derived interval would
      follow the cost of one walk and the write rate between walks; neither is
      measured back into it. The process has a floor, and a smaller value means
      the floor.

  - key: evolution.workspaces.ephemeralTtlSecs
    source: override
    why: >-
      How long an ephemeral worktree may live. It has to outlast one evolution
      round, and a PID cannot tell whether a task is still alive. A derived TTL
      would follow the measured round duration; nothing reads it back.

  - key: evolution.workspaces.orphanBranchTtlSecs
    source: override
    why: >-
      How long an `evol/<old-id>` branch may go untouched before reclamation.
      A live instance's branch is force-pushed every transplant, so a long idle
      period means the instance is gone; the TTL is that judgement written as a
      number rather than a measurement.

  - key: evolution.workspaces.targetMaxBytes
    source: derived
    why: >-
      The sentinel `auto` rather than a number: the cap is the pre-reclaim
      working set's peak over the last week with 20% headroom, held under the
      free space of the volume the directory sits on, and recomputed from every
      walk. A number here is the same measurement taken once by hand, and it
      stops being true the first time the cache outgrows it -- the growth the
      cap exists to catch, and the one a pinned value cannot notice. `0` still
      means measure without bounding, and a positive number still overrides.
    published:
      # The chart field reaches this number through the evolution plugin; the
      # reading itself is built by the shared cache-readings module, which is
      # where the `source` label is attached.
      owner: crates/cog-reflection/src/plugin.rs
      file: crates/cog-core/src/build_cache_readings.rs
      metric: BUILD_TARGET_CAP_METRIC
      label: source
    proof:
      # Moves the walk's total and the volume's free bytes, and reads the cap
      # back: the two inputs are the whole of what the number may depend on.
      file: crates/cog-core/src/build_cache_readings.rs
      test: a_derived_cap_follows_its_two_inputs

  # --- main application -------------------------------------------------------
  - key: gateway.replicas
    source: override
    why: >-
      One replica on a single-node cluster: two add memory and credential
      copies without availability. Two nodes make this a two; nothing measures
      per-replica load to derive it.

  - key: gateway.resources.requests.cpu
    source: override
    why: >-
      A scheduling claim for a workload whose draw is inference bursts. The
      container's working set is published by the cluster, and nothing turns it
      into the request.

  - key: gateway.resources.requests.memory
    source: override
    why: >-
      Declares what the scheduler reserves; the real consumption is read from
      container_memory_working_set_bytes at runtime, and tightening this later
      trims the margin rather than the capability. The reading is available; the
      loop that would set the number is not.

  - key: gateway.resources.limits.cpu
    source: override
    why: >-
      Room for intra-thread inference during model load. CPU throttling is
      visible in the cluster's readings; nothing feeds it back into this bound.

  - key: gateway.resources.limits.memory
    source: override
    why: >-
      Sized from measured RSS: about 1.67GiB per loaded session (the two embedding
      sessions share one weight file) plus reranker and activation headroom, for
      three sessions. The measurement exists; it was turned into a number by a
      human, and no loop re-measures it.

  # --- probe budgets ----------------------------------------------------------
  - key: healthProbes.liveness.periodSeconds
    source: fixed
    why: >-
      The kubelet probe contract. It is written out rather than omitted because
      the kubelet default is one second -- an idle-node value that kills a backend
      on a busy node (redis was killed this way). The period is the probe's own
      convention, not a capacity measurement.

  - key: healthProbes.liveness.timeoutSeconds
    source: fixed
    why: >-
      Same contract, same reason for being explicit: the default timeout is the
      idle-node number.

  - key: healthProbes.liveness.failureThreshold
    source: fixed
    why: >-
      The runtime budget, chosen so a busy node still gets answered. It is a
      practice written as a constant; no measurement moves it.

  - key: healthProbes.readiness.periodSeconds
    source: fixed
    why: >-
      The readiness half of the probe contract; explicit for the same reason as
      liveness.

  - key: healthProbes.readiness.timeoutSeconds
    source: fixed
    why: >-
      The readiness half of the probe contract.

  - key: healthProbes.readiness.failureThreshold
    source: fixed
    why: >-
      How many missed answers take a Pod out of the endpoints. A practice.

  - key: healthProbes.startup.periodSeconds
    source: fixed
    why: >-
      The startup half of the probe contract. The startup budget as a whole is
      sized for the slowest legitimate start (loading a large AOF, first initdb,
      building an index); it is a stated policy, and no loop measures start
      durations back into it.

  - key: healthProbes.startup.timeoutSeconds
    source: fixed
    why: >-
      The startup half of the probe contract.

  - key: healthProbes.startup.failureThreshold
    source: fixed
    why: >-
      60 attempts at 5 seconds is the five-minute startup budget. The number is
      the slowest legitimate start written down, not a derived bound.

  - key: healthProbes.claimStoreStartup.periodSeconds
    source: fixed
    why: >-
      The same probe contract, kept at the same period as every other startup
      budget: the claim store's budget differs in how many attempts it allows,
      not in how often it is asked.

  - key: healthProbes.claimStoreStartup.timeoutSeconds
    source: fixed
    why: >-
      The startup half of the probe contract, for the claim store's own budget.

  - key: healthProbes.claimStoreStartup.failureThreshold
    source: override
    why: >-
      120 attempts at 5 seconds is the ten-minute budget, twice the 3m35s start
      measured on this host with containerd, podman and buildah roots at a 200m
      quota. The measurement exists and was turned into a number by hand; no loop
      re-measures start durations back into it, and the roots only grow with the
      images pulled.

  # --- host document organising ----------------------------------------------
  - key: hostDocuments.approvalTtlSecs
    source: override
    why: >-
      How long a staged plan stays approvable, which is also the validity of an
      approval. A derived TTL would follow how long approvals actually sit before
      being acted on; nothing measures that.

  - key: hostDocuments.assistBodyBytes
    source: override
    why: >-
      How much of one body a classification question carries. It is a "do less"
      bound: past it the question is not asked at all, because a partial answer
      would make the plan depend on which files fit. A derived bound would read
      the classifier's own input window; that window is not published.

  - key: hostDocuments.assistMaxCandidates
    source: override
    why: >-
      How many files one classification question may cover, for the same reason
      as the body bound. Nothing measures the classification cost back into it.

  - key: hostDocuments.maxPlanBytes
    source: fixed
    why: >-
      A plan is staged for approval and has to be legible in one sitting, so it
      shares the single-read order of magnitude rather than tracking storage. It
      is an interface bound, not a capacity dial.

  - key: hostDocuments.maxReadBytes
    source: fixed
    why: >-
      The largest single read. Deliberately not tied to the audited channel's
      body bound: that one limits how much text leaves through a model, this one
      limits bytes read into memory at once. The two being close is a
      coincidence, and tying them would drag one side when the other moves.

  - key: hostDocuments.maxWriteBytes
    source: fixed
    why: >-
      The largest single rewrite, which also bounds the rollback journal's copy.
      An interface bound: the operation is atomic in one call, not a stream.

  # --- host ledger ------------------------------------------------------------
  - key: hostLedger.port
    source: fixed
    why: >-
      The scrape port of the per-node ledger. An address.

  - key: hostLedger.resources.requests.cpu
    source: override
    why: >-
      Each scrape reads three small files; the resident and burst draw are noise.
      A derived pair would read the process's own measured cost; nothing collects
      it for this DaemonSet.

  - key: hostLedger.resources.requests.memory
    source: override
    why: >-
      Sized to the resident cost of a read-only reader. No measurement of it is
      published.

  - key: hostLedger.resources.limits.cpu
    source: override
    why: >-
      Room for one scrape. Not derived from anything.

  - key: hostLedger.resources.limits.memory
    source: override
    why: >-
      Room for one scrape's buffers. Not derived from anything.

  # --- claim store (per-node account of claims and the image store) -----------
  - key: claimStore.port
    source: fixed
    why: >-
      The scrape port of the per-node account. An address; the headless Service
      and the container port are both read from it.

  - key: claimStore.resources.requests.cpu
    source: override
    why: >-
      Two metadata walks per cadence and nothing in between. A derived pair would
      read the walker's own measured cost; nothing collects it for this DaemonSet.

  - key: claimStore.resources.requests.memory
    source: override
    why: >-
      The walker holds one entry per claim directory and one per store part, so
      its memory follows the number of entries rather than their bytes -- and the
      byte counts it publishes say how many entries there are. The request itself
      is not read back from anything.

  - key: claimStore.resources.limits.cpu
    source: override
    why: >-
      Room for one walk. Not derived from anything.

  - key: claimStore.resources.limits.memory
    source: override
    why: >-
      Room for one walk's directory entries. Not derived from anything.

  - key: claimStore.scanIntervalSecs
    source: override
    why: >-
      The claim walk's cadence. Measured cost is about two seconds for the 200 GB
      this host holds, which would support a faster cadence, but the reading it
      feeds (a volume's fill level) moves on the scale of builds. claim_scan_stale
      is three times this number, so the two are read together.

  - key: claimStore.imageScanIntervalSecs
    source: override
    why: >-
      The image store walk's cadence, slower than the claim walk because the tree
      is larger and changes on image pulls rather than on writes. image_store_scan_stale
      is three times this number; the pair is changed together.

  # --- mainline deployer ------------------------------------------------------
  - key: mainlineDeployer.cargoBuildJobs
    source: override
    why: >-
      How many cargo jobs a sandbox build runs. A derived value would read the
      host's cores, which the build gate already measures for a different
      question (how many builds at once, not how parallel one build is); nothing
      feeds the core count into this number.

  - key: mainlineDeployer.failureCooldownSecs
    source: override
    why: >-
      How long after a failed rollout the deployer waits before trying the same
      revision again. A derived cooldown would follow the observed recovery time;
      the deployer records outcomes but does not turn them into this number.

  - key: mainlineDeployer.observabilityStack.applyTimeoutSecs
    source: override
    why: >-
      The convergence pass's own deadline. A derived value would read how long a
      pass actually takes; the pass does not publish its duration.

  - key: mainlineDeployer.observabilityStack.intervalSecs
    source: override
    why: >-
      How often the manifests are re-applied. A derived interval would follow how
      quickly the cluster is observed to drift; drift is detected per pass, not
      measured as a rate.

  - key: mainlineDeployer.observabilityStack.maxNamedResources
    source: override
    why: >-
      How many resources one alert message may name before folding the rest into
      a count. A derived bound would follow the measured message length a reader
      tolerates; that is a judgement, not a reading.

  - key: mainlineDeployer.pollIntervalSecs
    source: override
    why: >-
      How often the bare repository is polled for a new main. A derived interval
      would follow the observed push rate of the repository, which the repo's own
      timestamps could tell; nothing reads it.

  - key: mainlineDeployer.registryMaintenance.cooldownSecs
    source: override
    why: >-
      The wait between two reclamations, so a volume whose resident floor stays
      above the threshold is not restarted every poll. A derived cooldown would
      follow the observed cost of a registry restart; that duration is not
      measured.

  - key: mainlineDeployer.registryMaintenance.retention
    source: override
    why: >-
      Twenty revisions: the producer was measured at about one revision per 42
      minutes, so this spans roughly 14 hours -- enough for "roll back one
      version" and "look at the last round". The measurement exists and was made
      once; the number does not re-derive from the current rate.

  - key: mainlineDeployer.registryMaintenance.threshold
    source: override
    why: >-
      The used-bytes-to-declared-bytes ratio that triggers reclamation. The
      measurement it reads exists (the walker sidecar's on-disk bytes), so this is
      the one number here closest to a loop: it is a hand-set threshold on a
      measured input, and a derived version would weigh the reclaim cost against
      the disk's free space.

  - key: mainlineDeployer.rolloutJob.cpuRequest
    source: override
    why: >-
      Both an admission claim and the container's CFS weight; 200m sits below the
      busiest-minute average and well above the per-run average measured across
      six rollouts. Those readings exist in the cluster and are not closed back
      into the request.

  - key: mainlineDeployer.rolloutJob.cpuLimit
    source: override
    why: >-
      Two cores, after the container's own cgroup showed half its active CFS
      periods throttled at one core. The throttle counts are the measurement a
      derived limit would use; they are re-measured per rollout, not fed back.

  - key: mainlineDeployer.rolloutJob.memoryRequest
    source: override
    why: >-
      Covers the resident heap between kubectl bursts. The working-set reading
      exists; nothing turns it into the request.

  - key: mainlineDeployer.rolloutJob.memoryLimit
    source: override
    why: >-
      512Mi against a measured working-set peak of 243MiB, because this is the
      process that decides whether to roll back and its failure is an OOM kill.
      The peak is measured per rollout; it is not read back into the limit.

  - key: mainlineDeployer.rolloutTimeoutSecs
    source: override
    why: >-
      How long a single deployment gets to converge after init finishes. A
      derived value would follow the observed convergence time; rollout durations
      are recorded as outcomes, not turned into the budget.

  - key: mainlineDeployer.soakSecs
    source: override
    why: >-
      How long a rolled-out version runs before it is called good. A derived soak
      would follow how long a defect takes to show up in the outcomes; that is
      not measured.

  - key: mainlineDeployer.startupTimeoutSecs
    source: override
    why: >-
      The init-container phase's own budget: the seed is a network clone whose
      duration follows the link to the upstream. A derived value would read the
      measured clone time; the seed's duration is not published.

  # --- resource governance ----------------------------------------------------
  # The ceiling numbers are not chart values: they are projected from the rendered
  # declarations by `deploy/scripts/project-resource-governance.py` into
  # `values.resource-governance.<profile>.yaml`, which carries a GENERATED header
  # and is re-derived (and compared byte for byte) on every render. So no row here covers
  # them -- a row would be a second source for a number whose whole point is that
  # nobody writes it. What remains below are the inputs to that projection -- the
  # only terms no rendered manifest can declare -- and the policy defaults it copies
  # through. The runtime workloads are inputs of the same kind: their shape is a
  # declaration the pod's own code makes, and the projection sums it like any other
  # workload rather than trusting a hand-written budget.
  - key: resourceGovernance.clusterNodes
    source: override
    why: >-
      How many nodes the DaemonSets spread over, which is how many Pods the quota
      must admit per DaemonSet. No manifest can say it: the same tree is applied
      to a one-node K3s and to a production cluster. The profile names it, and the
      projection reads it from there -- so a cluster with more nodes is a profile
      edit plus a re-render, not a number typed into the ceiling.

  # 运行期自建 Pod 那部分额度没有行，因为它没有一个写在 values 里的数：评测台
  # 创建 Pod 前按自己那份清单算出它占多少、把额度抬到装得下，跑完放回去——尺寸
  # 的唯一来源是建它的代码，跟着它变，没有第二处可漂。`runtimeWorkloads` 留给
  # 不由产品创建、也不会自己抬额度的那类 Pod；今天它是空的，所以这里没有行。
  - key: resourceGovernance.limitRange.defaultCpu
    source: override
    why: >-
      The default for a container that declares no CPU. It is a hand-set practice:
      low enough that a forgotten declaration is visible in the totals, high
      enough that it does not throttle an idle sidecar. The projection copies it
      through unchanged.

  - key: resourceGovernance.limitRange.defaultMemory
    source: override
    why: >-
      The memory default for the same containers; same reasoning as the CPU
      default, and likewise copied through by the projection.

  - key: resourceGovernance.limitRange.defaultRequestCpu
    source: override
    why: >-
      The request a container gets when it declares none. A practice rather than a
      measurement: the scheduler needs some number, and a small one keeps a
      forgotten declaration out of the reserved total.

  - key: resourceGovernance.limitRange.defaultRequestMemory
    source: override
    why: >-
      The memory request for the same containers; same reasoning as the CPU
      request default.

  - key: resourceGovernance.limitRange.minCpu
    source: override
    why: >-
      The admission floor for one container's CPU: below it a workload is almost
      certainly a typo, and the scheduler cannot do anything useful with it.

  - key: resourceGovernance.limitRange.minMemory
    source: override
    why: >-
      The admission floor for one container's memory; same reasoning as the CPU
      floor.

  - key: resourceGovernance.limitRange.pvcMinStorage
    source: override
    why: >-
      The smallest PVC the namespace admits. A practice that keeps an empty claim
      from looking intentional; nothing measures it.

  # --- sandbox executor -------------------------------------------------------
  # `sandboxExecutor.buildCacheMaxBytes` 没有行：values 里不再有这个数。上限是
  # 每轮现算的——这块卷的声明量减同住者的实测占用——所以没有可登记的常量；
  # 覆盖写法（`--set sandboxExecutor.buildCacheMaxBytes=<字节>`）落在同一个
  # `cogneva_build_target_bytes_cap{source}` 上，读得出来源是 override。

  - key: sandboxExecutor.buildCacheScanIntervalSecs
    source: derived
    why: >-
      How often this executor's cache is re-walked and its cap re-enforced. The
      loop times each walk and keeps the period at twenty times the last walk's
      cost, so the walk stays one twentieth of the process as the cache grows,
      floored at the shared minimum. That floor also paces the loop's waking,
      and the loop beats on every waking, so a longer interval is not read as a
      stalled loop. The published interval is the one in force rather than this
      seed. `the_cache_walk_interval_follows_the_slowest_pass` holds the share.
    published:
      # The walk is run by the sandbox executor; the reading it states its
      # cadence on belongs to the shared readings type.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-core/src/build_cache_readings.rs
      metric: BUILD_TARGET_SCAN_INTERVAL_METRIC
      label: dir
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_cache_walk_interval_follows_the_slowest_pass

  - key: sandboxExecutor.maxTaskWorkspaces
    source: override
    why: >-
      A policy ceiling -- how many task worktrees this executor serves at once
      -- not a statement about the machine. The effective cap is the lower of
      this and what the volume is measured to hold: on every GC pass the
      executor reads `df` available bytes on the workspaces root, divides by
      the size of one tree measured in that same pass, and keeps 15% of the
      room free for git writes. Trees growing with the repository and
      co-tenants filling the volume both lower that reading, so the disk stops
      this ceiling from outliving the volume.
      `the_worktree_cap_follows_the_volume_and_the_measured_tree_size` shows
      the reading following both inputs; the executor logs `declared` beside
      `measured` whenever the volume is the tighter of the two.

  - key: sandboxExecutor.repoFetchIntervalSecs
    source: derived
    why: >-
      How often the bare repository's main is fetched. The executor measures
      how long `main` stayed still before its last move -- the only reading
      anyone here has of the upstream push rate -- and polls at half that
      stillness, floored at 30s. The configured number is the seed: it applies
      until the first move is observed, and only then.
      `the_fetch_period_follows_how_long_main_was_still` drives the pure
      function with a busy repository, a quiet one, and no reading at all. The
      loop still wakes on a fixed floor and reports a beat on every waking, so
      a longer fetch interval is not reported as a stalled loop.
    published:
      # The executor publishes the wait it is actually keeping, labelled by
      # whether a measurement decided it: a configured number and a measured
      # one must not read the same on the panel.
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: FETCH_INTERVAL_METRIC
      label: source
    proof:
      # Drives the observed stillness and the configured period and reads the
      # wait back: those two inputs are the whole of what it may depend on.
      file: crates/cog-extension/src/workdir.rs
      test: the_fetch_period_follows_how_long_main_was_still

  - key: sandboxExecutor.resources.requests.cpu
    source: override
    why: >-
      The container's parallelism is already one (cpu.max 100000/100000), so the
      request is not a concurrency knob; it is a claim for a bursty workload. The
      cgroup readings are available, and nothing turns them into the request.

  - key: sandboxExecutor.resources.requests.memory
    source: override
    why: >-
      Sized to the resident draw; this is a bursty workload, and a higher request
      would only pin it to the node. The working-set reading exists and is not
      fed back.

  - key: sandboxExecutor.resources.limits.cpu
    source: override
    why: >-
      Deliberately untouched when the memory limit moved: CFS throttling in the
      window was 918 of 5012 periods and was not the cause of the OOM kills. The
      throttle count is the measurement a derived limit would read; it is not
      read back.

  - key: sandboxExecutor.resources.limits.memory
    source: override
    why: >-
      3 GiB, after one build was measured at 1.685 GiB of unreclaimable anon and
      2 GiB left almost no growth room; the falsifier is the outcome reading
      sandbox_oom_kills_total staying at zero, which a human judges against a
      window. That is a decision procedure, not a loop that sets the value.

  - key: sandboxExecutor.storage
    source: override
    why: >-
      The executor's own volume. Its contents are enumerated beside the cache cap
      (cargo home, bare repo, worktrees), so a derived value could add them up
      against the volume's free space; nothing does.

  - key: sandboxExecutor.workspaceGcIntervalSecs
    source: derived
    why: >-
      How long goes by between reclamation passes. The value the loop acts on is
      a multiple of the last pass's own duration, so the walk's cost stays a
      fixed share of the process as the volume fills and the pass gets slower;
      the floor is the pace the loop wakes at. This number is the seed used
      until a pass has been timed.
    published:
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: GC_INTERVAL_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_gc_interval_follows_the_slowest_pass_not_a_written_period

  - key: sandboxExecutor.workspaceTtlSecs
    source: derived
    why: >-
      How long an idle task worktree may live. The reclamation pass derives it
      from the two readings that do not depend on the TTL itself: how many
      trees the volume holds (the measured cap) and how far apart new trees
      arrive (from the sidecars' creation times). The hold is as long as it
      takes arrivals to refill half the volume, floored at an hour. The reuse
      history cannot set it -- a tree idle longer than the TTL is already gone,
      so every observed gap is shorter than the number it would feed and such
      a rule doubles forever while looking like a closed loop. The configured
      value applies until two trees exist to measure an arrival interval.
      `the_idle_ttl_follows_arrivals_and_capacity_not_reuse_gaps` drives the
      pure function with faster arrivals, a larger volume, one tree, and no
      span.
    published:
      owner: crates/cog-extension/src/workdir.rs
      file: crates/cog-extension/src/workdir.rs
      metric: TTL_METRIC
      label: source
    proof:
      file: crates/cog-extension/src/workdir.rs
      test: the_idle_ttl_follows_arrivals_and_capacity_not_reuse_gaps

  # --- security gateway -------------------------------------------------------
  - key: securityGateway.auditedLlmMaxBodyBytes
    source: fixed
    why: >-
      How much document text may leave in one request through the audited
      channel. Eight MiB is the HTTP body convention, and it is deliberately not
      tied to the document write bound: that one limits bytes written to disk,
      this one limits text entering a model.

  - key: securityGateway.auditedLlmPort
    source: fixed
    why: >-
      The audited channel's own port, separate from 8080/8081 because its whole
      value is a small reachable set. An address.

  - key: securityGateway.metricsPort
    source: fixed
    why: >-
      The observability channel's port, deliberately separate from the proxy
      ports because those inject upstream credentials. An address.

  - key: securityGateway.replicas
    source: override
    why: >-
      One replica on a single-node cluster; a second adds memory and credential
      copies without availability. Load per replica is not measured to derive it.

  - key: securityGateway.gitMirror.stallSecs
    source: override
    why: >-
      How long the SSH fallback may produce no output before the transfer is
      declared dead. The floor is 30 in code. A derived value would read the
      observed inter-output gap; a full mirror clone was measured at about 97
      seconds and that is what the defaults are ordered around, not what sets
      them.

  - key: securityGateway.gitMirror.timeoutSecs
    source: override
    why: >-
      The total bound on one clone/fetch/push, for the case that keeps emitting
      progress and never finishes. Derived from the measured 97-second clone by a
      human; nothing re-measures and adjusts.

  - key: securityGateway.gitMirror.storage
    source: override
    why: >-
      The mirror volume, rebuildable from the upstream, so the volume is sized
      generously against the repository's measured size. Nothing reads that size
      back into the declaration.

  - key: securityGateway.resources.requests.cpu
    source: override
    why: >-
      The gateway sits in front of every call chain; without a request the
      scheduler treats it as BestEffort and evicts it first. Sized from its
      measured resident cost; the reading is not fed back.

  - key: securityGateway.resources.requests.memory
    source: override
    why: >-
      The resident cost of the proxy process. A derived value would read the
      measured working set; nothing does.

  - key: securityGateway.resources.limits.cpu
    source: override
    why: >-
      Burst room for proxy traffic. Not derived from a reading.

  - key: securityGateway.resources.limits.memory
    source: override
    why: >-
      Burst room over the resident cost. Not derived from a reading.

  # --- workspace quota (WebUI file surface) ---
  - key: workspace.maxBytes
    source: override
    why: >-
      A per-user cap on the workspace under the shared data volume. Nothing
      reads a user's usage back into it: the volume-level headroom is judged by
      the container and volume readings, which cannot see one user's share, so
      the number stays pinned until a reading of per-user usage exists. Zero
      means unlimited and is a deliberate deployment choice, not a missing
      value.

  # --- web search (SearXNG) ---------------------------------------------------
  - key: webSearch.replicas
    source: fixed
    why: >-
      One in-cluster instance answers every agent's web_search call. A second
      replica would add capacity that nothing measures: the call path caps how
      many results it reads, and no reading of queue depth or query latency is
      fed back into this number. A deployment that runs it hot raises this by
      hand.

  - key: webSearch.resources.requests.cpu
    source: override
    why: >-
      A request, not a measurement: without one the scheduler treats the Pod as
      BestEffort and evicts it first, and an evicted search backend turns every
      web_search call into a failure. Sized from an idle serving cost observed
      when the instance was added; nothing reads that cost back.

  - key: webSearch.resources.requests.memory
    source: override
    why: >-
      The resident cost of an idle SearXNG process with its engines loaded. A
      derived value would read the measured working set; nothing does.

  - key: webSearch.resources.limits.cpu
    source: override
    why: >-
      Burst room for concurrent queries. Each query is a fan-out to upstream
      engines, so the burst is longer than a single request; no reading of query
      latency or concurrency is fed back into this number.

  - key: webSearch.resources.limits.memory
    source: override
    why: >-
      Burst room over the resident cost for one query's parsed pages. Not derived
      from a reading. This number and the namespace quota are one knob in two
      places: the governance check refuses a ceiling the quota cannot admit, so
      raising it alone stops the next rollout rather than this Pod.

  # --- 网页抓取（渲染后端，Crawl4AI）------------------------------------------
  - key: webFetch.replicas
    source: fixed
    why: >-
      One instance renders every page web_fetch asks for. A second replica would
      add capacity nothing measures: the tool renders one page per call and no
      reading of render queue depth or page latency is fed back into this number.
      A deployment that runs it hot raises this by hand.

  - key: webFetch.shmSize
    source: override
    why: >-
      The size of the tmpfs mounted at /dev/shm. It is a dial, not a protocol
      constant: Chromium dies on the 64MiB default and reports it as a timeout,
      so it has to be given room. Sized from the page sizes this backend is
      expected to render; nothing reads a renderer's actual shared-memory use
      back into this number. Raising it alone widens the Pod, so it moves with
      webFetch.resources.limits.memory.

  - key: webFetch.resources.requests.cpu
    source: override
    why: >-
      A request, not a measurement: without one the scheduler treats the Pod as
      BestEffort and evicts it first, and an evicted renderer turns every
      web_fetch into an error rather than a page. Sized from an idle serving cost
      when the backend was added; nothing reads that cost back.

  - key: webFetch.resources.requests.memory
    source: override
    why: >-
      The resident cost of an idle browser-control server before any page is
      rendered. A derived value would read the measured working set; nothing
      does.

  - key: webFetch.resources.limits.cpu
    source: override
    why: >-
      Burst room for a page render, which is several requests and a layout pass.
      No reading of render latency or concurrency is fed back into this number.

  - key: webFetch.resources.limits.memory
    source: override
    why: >-
      Browser plus the tmpfs above: the limit has to stay at least one GiB above
      webFetch.shmSize, because the shared-memory pages count against this Pod.
      This number and the namespace quota are one knob in two places: the
      governance check refuses a ceiling the quota cannot admit, so raising it
      alone stops the next rollout rather than this Pod.

  # --- platform webhook -------------------------------------------------------
  - key: webhook.nodePort
    source: fixed
    why: >-
      The cluster entry point for the GitHub and Gitee webhooks, forwarded to the
      gateway's 8082. An address that outside senders are configured against; a
      measurement must not move it.
