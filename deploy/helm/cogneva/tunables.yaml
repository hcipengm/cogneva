      file: crates/cogneva/src/backup.rs
      test: the_keep_count_follows_the_volume_and_the_measured_package_size

  - key: backup.runDeadlineSeconds
    source: fixed
    why: >-
      A bookkeeping horizon, not a bound on anything: the container's liveness is
      judged by its progress probe, and this number is written into the row it
      opens so a row left open by a killed run can later be concluded abandoned.
      Each row carries the number it was opened under, so a conclusion about
      yesterday is judged by yesterday's agreement rather than by today's setting.
      It is also an operand of the static 26-hour alert bound (schedule +
      startingDeadlineSeconds + this allowance), computed from the chart at render
      time; a value that moved at runtime would silently decouple those rules from
      the runs they watch.

  - key: backup.startingDeadlineSeconds
    source: fixed
    why: >-
      The Job controller's missed-schedule window: how late a scheduled run may
      still be started before the controller records a miss. It is the cluster's
      own scheduling contract, and an operand of the same static 26-hour alert
      bound as the schedule and the run deadline. The controller does not record
      why a run was missed, so there is no observed lateness to close a loop over.

  - key: backup.successfulJobsHistoryLimit
    source: fixed
    why: >-
      How many finished Job objects stay for inspection. This is a diagnostic
      agreement, not a size: no process in the platform reads a past backup Job
      -- a run's durable account is its `backup_runs` row, and a package's
      evidence is the file on the volume plus the package index -- so a loop over
      "who looks at a past Job" would measure zero on every deployment and could
      never move the number. Two successes are kept because comparing the two
      most recent runs is the diagnosis the objects exist for, and a success is
      the baseline a failure is compared against.

  - key: backup.failedJobsHistoryLimit
    source: fixed
    why: >-
      The same inspection surface for failures, one higher than the successes:
      two consecutive failed nights must both remain, with the last successful
      run beside them, so a repeat failure can be told apart from a new one. No
      process reads these objects; the `backup_runs` ledger and the package
      index are what the platform reads, and Job-object retention is a human
      inspection convention rather than a measured need.

  - key: backup.backoffLimit
    source: fixed
    why: >-
      The Job controller's retry contract for a daily run: one retry of the same
      scheduled run, never a retry string that would push into the next day's
      schedule. concurrencyPolicy: Forbid already makes a second run wait for the
      first, and a retry is the same run repeating with the same inputs; the
      ledger records outcomes, not attempts, so there is no retry rate to derive
      it from.

  - key: backup.drillBackoffLimit
    source: fixed
    why: >-
      Zero: a failed drill has already written its answer to backup_drills, and
      retrying the same package against the same inputs cannot change the verdict.
      The controller contract is "attempt once"; there is nothing measured to move
      it.

