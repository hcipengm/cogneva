{{- if .Values.backends.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: message-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: message-queue
    spec:
      # Runs before redis-server so a torn AOF tail — the artefact an unclean host
      # stop leaves behind, which redis reads as a malformed record rather than as
      # end-of-file — is dropped instead of making the instance refuse to start.
      # The probe before the subcommand exists because the deployment pins the
      # floating :local tag: an image seeded from a release predating this command
      # would otherwise hold the pod in Init forever. Standing aside with a
      # warning is the honest outcome there; redis still refuses to load and its
      # own error is then the one that says why.
      #
      # The verdict is published as well as printed: container logs are shipped
      # nowhere, so "this startup gave up 208 bytes" had no reader at all. The
      # second guard is not a capability probe but the reading itself — a
      # path-named file that is still empty after the repair means the operand was
      # not honoured, and that absence has to be stated rather than left to look
      # like a clean pass.
      initContainers:
        - name: aof-repair
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              report=/report/aof-repair.prom
              if ! /opt/cogneva/cogneva --help 2>&1 | grep -q 'repair-aof'; then
                printf '%s 0\n' cogneva_aof_repair_verdict_published > "$report"
                echo "aof-repair: level=warn this image predates the repair-aof command; nothing was inspected"
                exit 0
              fi
              /opt/cogneva/cogneva repair-aof /data/appendonlydir --metrics-file "$report"
              rc=$?
              if [ ! -s "$report" ]; then
                printf '%s 0\n' cogneva_aof_repair_verdict_published > "$report"
                echo "aof-repair: level=warn no verdict was published (rc=$rc); the AOF findings are unobservable"
              fi
              exit $rc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: aof-report
              mountPath: /report
      containers:
        - name: redis
          image: {{ .Values.backends.redis.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          # 启动预算单独给：加载 40Mi 级 AOF 的耗时由数据量决定，与"运行中还
          # 能不能应答"是两件事；混用会让数据一多就把健康的实例判死。
          startupProbe:
            tcpSocket:
              port: redis
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            tcpSocket:
              port: redis
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
        # Serves the verdict the init container wrote. redis-server exposes no
        # metrics endpoint, so a textfile collector beside it is the only way a
        # one-shot container's reading can reach a scraper; the file lives on an
        # emptyDir shared with that one-shot container, so the reading dies with
        # the pod it describes — which is right, it is a statement about this
        # startup, not about the instance over time.
        - name: aof-report-exporter
          image: {{ .Values.backends.redis.aofReportExporter.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --collector.disable-defaults
            - --collector.textfile
            - --collector.textfile.directory=/report
          ports:
            - name: aof-metrics
              containerPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: aof-report
              mountPath: /report
              readOnly: true
      volumes:
        - name: aof-report
          emptyDir:
            # The whole payload is one gauge per finding class, a few hundred
            # bytes. The bound is here so a broken writer cannot grow it.
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.backends.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
