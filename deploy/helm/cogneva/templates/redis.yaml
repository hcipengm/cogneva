{{- if .Values.backends.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: message-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: message-queue
    spec:
      containers:
        - name: redis
          image: {{ .Values.backends.redis.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - sh
            - -c
            - redis-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          # 启动预算单独给：加载 40Mi 级 AOF 的耗时由数据量决定，与"运行中还
          # 能不能应答"是两件事；混用会让数据一多就把健康的实例判死。
          startupProbe:
            tcpSocket:
              port: redis
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            tcpSocket:
              port: redis
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.backends.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
