{{- if .Values.backends.nats.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
  annotations:
    # 卸载不销毁数据卷：重装要接着用同一份状态（事件流积压、身份、记忆、
    # 数仓、裸仓库），删掉就等于丢实例。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backends.nats.storage }}
  {{- with .Values.storage.retain }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
spec:
  replicas: {{ .Values.backends.nats.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: event-bus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: event-bus
    spec:
      containers:
        - name: nats
          image: {{ .Values.backends.nats.image }}
          imagePullPolicy: IfNotPresent
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "--server_name=cogneva-nats"
            - {{ printf "--http_port=%d" (int .Values.backends.nats.monitorPort) | quote }}
          ports:
            - name: client
              containerPort: {{ .Values.backends.nats.port }}
              protocol: TCP
            - name: monitor
              containerPort: {{ .Values.backends.nats.monitorPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
{{ toYaml .Values.backends.nats.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nats-service
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: event-bus
  ports:
    - name: client
      port: {{ .Values.backends.nats.port }}
      targetPort: client
      protocol: TCP
    - name: monitor
      port: {{ .Values.backends.nats.monitorPort }}
      targetPort: monitor
      protocol: TCP
{{- end }}
