# 主应用统一配置文件（cogneva.json）：经 /etc/cogneva 目录挂载，env 层覆盖其上。
# 内容取自 chart files/，.Files.Get 原样输出；文件内的双花括号占位符属于
# 应用自身的 prompt 模板，不经过 Helm 渲染。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-json
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  cogneva.json: |-
{{ .Files.Get "files/cogneva.json" | indent 4 }}
---
# 外部 prompt 模板（hot_reload 捕捉 ConfigMap 交换，L0 配置晋级热更新通道）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-prompts
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  default.yaml: |-
{{ .Files.Get "files/prompts-default.yaml" | indent 4 }}
  system_prompts.yaml: |-
{{ .Files.Get "files/prompts-system.yaml" | indent 4 }}
---
{{- if .Values.evolution.enabled }}
# 进化 worker 环境覆盖：开启自进化沙盒模式、目录指向 PVC、关闭沙盒内不需要的
# memory/vector 与严格持久化（避免每次启动下载 embedding 模型、允许内存回退）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-evolution-config
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
data:
  COGNEVA_SELF_EVOLUTION_ENABLED: "true"
  # 本 Pod 是专用变更执行器：跑进化循环 / 基线移植 / 主线部署器。主应用 Pod 置
  # false 只留控制面（admin + GitOps 拉取端），两端不抢同一实例的工作树。
  COGNEVA_SELF_EVOLUTION_EXECUTOR_ENABLED: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_APPLY: "true"
  COGNEVA_SELF_EVOLUTION_AUTO_DEPLOY: "true"
  COGNEVA_SELF_EVOLUTION_SANDBOX_MODE: "true"
  COGNEVA_SELF_EVOLUTION_SWITCH_MODE: "self_exec"
  COGNEVA_SELF_EVOLUTION_CHANGE_DIR: "/opt/cogneva/sandbox/changes"
  COGNEVA_SELF_EVOLUTION_BINARY_DIR: "/opt/cogneva/sandbox/bin"
  COGNEVA_SELF_EVOLUTION_BACKUP_DIR: "/opt/cogneva/sandbox/backups"
  COGNEVA_SELF_EVOLUTION_POLL_INTERVAL_SECS: "300"
  COGNEVA_SELF_EVOLUTION_TEST_TIMEOUT_SECS: "3600"
  COGNEVA_SELF_EVOLUTION_BUILD_TIMEOUT_SECS: "3600"
  # 工作树动态分配：部署器独占一棵稳定路径的检出，进化任务各取临时检出，
  # 互不影响；共享 CARGO_TARGET_DIR 在工作树之外，重建工作树不丢增量缓存。
  COGNEVA_SELF_EVOLUTION_WORKSPACES_ROOT: {{ .Values.evolution.workspaces.root | quote }}
  COGNEVA_SELF_EVOLUTION_WORKSPACES_TARGET_DIR: {{ .Values.evolution.workspaces.targetDir | quote }}
  COGNEVA_SELF_EVOLUTION_WORKSPACES_EPHEMERAL_TTL_SECS: {{ .Values.evolution.workspaces.ephemeralTtlSecs | int | quote }}
  # int 转换不可省：values 里的数字经 chart 解析成 float64，2592000 直接
  # quote 会渲染成 "2.592e+06"，落进 env 就是个解析不了的秒数。
  COGNEVA_SELF_EVOLUTION_WORKSPACES_ORPHAN_BRANCH_TTL_SECS: {{ .Values.evolution.workspaces.orphanBranchTtlSecs | int | quote }}
  # 宿主级构建闸门。判据是"同一宿主上同时有几条编译/打镜像在跑"，而它是宿主的
  # 属性不是进程的属性：部署器、变更验证、基线搬运、镜像构建分属不同进程，各自
  # "有活就起一个"正是和数涨上去的方式。取不到槽位时一次性构建排队（waitSecs
  # 到点即拒，且被拒不算这次变更失败），轮询型步骤直接跳过等下一轮。
  COGNEVA_BUILD_GATE_ENABLED: {{ .Values.evolution.buildGate.enabled | quote }}
  COGNEVA_BUILD_GATE_MAX_CONCURRENT: {{ .Values.evolution.buildGate.maxConcurrent | int | quote }}
  COGNEVA_BUILD_GATE_WAIT_SECS: {{ .Values.evolution.buildGate.waitSecs | int | quote }}
  COGNEVA_BUILD_GATE_LOCK_DIR: {{ .Values.evolution.buildGate.lockDir | quote }}
  # 晋级门（推送端）：沙盒验证全过的变更（change）经分级策略判定后，L0/L1 自动晋级
  # 走 GitOps 发布（annotated tag + evolution-release 分支推中央 bare 仓库），
  # L2 留审批台。推送只写挂载的 bare 仓库 /host-git，不持任何集群凭证。
  COGNEVA_SELF_EVOLUTION_PROMOTION_ENABLED: "true"
  COGNEVA_GITOPS_ENABLED: "true"
  COGNEVA_GITOPS_REPO_URL: "/host-git"
  # 沙盒只推不拉：拉取端（poll/金丝雀/回滚）跑在主部署 Pod，那里有 kubectl
  # 与 RBAC；本 Pod 起拉取端只会每轮报错。
  COGNEVA_GITOPS_PULLER_ENABLED: "false"
  # 发现循环只有一个属主：主应用。issue/评论事件经网关只路由到主应用，轮询是
  # 它的周期兜底；本 Pod 里的发现循环对外副作用相同（追问、提交修复意图），而
  # 记账的 intent guard 是进程私有的（各挂各的数据卷）——两个进程各扫一遍，同一
  # 句追问会发两遍，谁也看不见对方已处理。只关发现，落地监视照跑。
  COGNEVA_GITHUB_DISCOVERY_ENABLED: "false"
  # 分层迁移同样只有一个属主：主应用。raw_log_index 按 (stream, log_date) 唯一，
  # 冷层对象键也不带进程身份，而两个 Pod 写的 stream 名完全一样
  # （transport_raw/system_raw/...）——两边同时扫，后写的会盖掉先写的索引行与
  # 对象，先归档的那份找不回且不报错。属主给主应用，本 Pod 只保留热层落盘。
  COGNEVA_TIER_MIGRATOR_ENABLED: "false"
  # 指标样本日志的清理同理只给主应用：两个 Pod 共用同一个库，都开着清理就是两
  # 个进程各自按自己的容量删同一张表。删除本身幂等，但只有一个属主时，「这张表
  # 有多大」与「谁把它删到这个大小」才是同一件事。置 0 = 本 Pod 永不清理。
  COGNEVA_METRICS_SAMPLE_MAX_ROWS: "0"
  # 本 Pod 完全不启用 memory 后端：自进化循环必须在 PostgreSQL/Redis 通不通
  # 的情况下都能起来，而它也不对外提供 memory 读。embedding/reranker 权重另有
  # memory.load_embedding_model / load_reranker_model 两道开关管着，所以「不下载
  # 模型」不是这个开关在做的事。这里要记住的后果是：ReflectionEngine 在本 Pod
  # 走 in-memory 模式，凡是要跨重启活下来的状态就不能放在共享 memory 数据集里，
  # 得由其属主自己落到 app.data_dir 下。
  COGNEVA_MEMORY_ENABLED: "false"
  COGNEVA_VECTOR_BACKEND_REQUIRED: "false"
  COGNEVA_STRICT_PERSISTENCE: "false"
  {{- if .Values.mainlineDeployer.enabled }}
  # 主线跟踪自动部署器：检测 bare 仓库公版 main 前进后，沙盒构建 → buildah 推
  # 集群内 registry（Pod 内走 Service DNS:5000）→ 派独立 Job 经节点 NodePort
  # localhost:30500 滚动四部署。回滚目标由 Job 启动时快照，不在此配置。
  COGNEVA_MAINLINE_DEPLOYER_ENABLED: "true"
  COGNEVA_MAINLINE_DEPLOYER_POLL_INTERVAL_SECS: {{ .Values.mainlineDeployer.pollIntervalSecs | int | quote }}
  COGNEVA_MAINLINE_DEPLOYER_REGISTRY: "cogneva-registry.{{ include "cogneva.namespace" . }}.svc.cluster.local:5000"
  COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY: "localhost:30500"
  COGNEVA_MAINLINE_DEPLOYER_NAMESPACE: {{ include "cogneva.namespace" . | quote }}
  COGNEVA_MAINLINE_DEPLOYER_SOAK_SECS: {{ .Values.mainlineDeployer.soakSecs | int | quote }}
  COGNEVA_MAINLINE_DEPLOYER_FAILURE_COOLDOWN_SECS: {{ .Values.mainlineDeployer.failureCooldownSecs | int | quote }}
  COGNEVA_MAINLINE_DEPLOYER_CARGO_BUILD_JOBS: {{ .Values.mainlineDeployer.cargoBuildJobs | int | quote }}
  # 从裸仓库的哪个目录读清单。默认与代码默认值同源（deploy/k3s），暴露它是为了
  # 让"清单目录"成为可配置的部署面，而不是散在代码里的常量。
  COGNEVA_MAINLINE_DEPLOYER_MANIFEST_DIR: {{ .Values.mainlineDeployer.manifestDir | quote }}
  # 启动阶段（Pod 的 init 容器未结束）的上界，与就绪预算分开计。
  COGNEVA_MAINLINE_DEPLOYER_STARTUP_TIMEOUT_SECS: {{ .Values.mainlineDeployer.startupTimeoutSecs | int | quote }}
  # 就绪阶段（init 全部结束后的滚动收敛）上界。默认与代码默认值同源，
  # 保证"上界可调"不等于"默认被调"——病因不该靠放宽预算掩盖。
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_TIMEOUT_SECS: {{ .Values.mainlineDeployer.rolloutTimeoutSecs | int | quote }}
  # 滚动判定 Job 容器的资源面：它是决定"回滚不回滚"的进程，不能是
  # BestEffort（节点内存压力下最先被驱逐的那一档）。
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_CPU_REQUEST: {{ .Values.mainlineDeployer.rolloutJob.cpuRequest | quote }}
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_MEMORY_REQUEST: {{ .Values.mainlineDeployer.rolloutJob.memoryRequest | quote }}
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_CPU_LIMIT: {{ .Values.mainlineDeployer.rolloutJob.cpuLimit | quote }}
  COGNEVA_MAINLINE_DEPLOYER_ROLLOUT_JOB_MEMORY_LIMIT: {{ .Values.mainlineDeployer.rolloutJob.memoryLimit | quote }}
  {{- if .Values.gitops.kubectlBin.enabled }}
  # 滚动 Job Pod 挂载宿主 k3s 二进制作为 kubectl（镜像不内置 kubectl）。
  COGNEVA_MAINLINE_DEPLOYER_KUBECTL_HOST_PATH: {{ .Values.gitops.kubectlBin.hostPath | quote }}
  {{- end }}
  {{- end }}
{{- end }}
