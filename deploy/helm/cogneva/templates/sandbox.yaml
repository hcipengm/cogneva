{{- if .Values.sandboxExecutor.enabled }}
# 沙箱执行器专属卷：执行器自有的裸仓库、每任务工作树与共享编译缓存都在这里，
# 与进化侧卷物理分离，两边不共享工作树。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-sandbox-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-executor
  annotations:
    # 卸载不销毁：工作树与裸仓库跨重装继续可用。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sandboxExecutor.storage }}
  {{- with .Values.sandboxExecutor.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
# 沙箱执行器：主应用与进化 Pod 共用的零凭证工具执行面（run_command/read_file/
# write_file）统一路由到本 Pod，命令与文件 IO 不发生在持有凭证的业务 Pod 内。
# 不挂载任何 Secret、不自动挂载 ServiceAccount token——Pod 边界即隔离边界。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-sandbox-executor
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-executor
spec:
  replicas: 1
  # No surge: every profile runs a single replica on a single node, so a surging
  # pod has nowhere to be scheduled and the rollout times out. Terminating the
  # old pod first frees its request, at the cost of a brief restart window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: sandbox-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: sandbox-executor
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        # 零凭证 seed：空卷首挂时从公开仓库克隆执行器自有裸仓，之后只做
        # 非阻塞的 upstream fetch。不挂 Secret、不带任何凭据。
        - name: seed-sandbox
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              root=/opt/cogneva/sandbox
              mkdir -p "$root/workspaces" "$root/src/target" "$root/repo.git" "$root/cargo-home"
              # CARGO_HOME 换到卷上之后，镜像里那份 sparse 镜像配置不会自动跟过来，
              # 缺了它 cargo 直连 crates.io；一次性把镜像内配置带到卷上。
              if [ ! -f "$root/cargo-home/config.toml" ] && [ -f /usr/local/cargo/config.toml ]; then
                cp /usr/local/cargo/config.toml "$root/cargo-home/config.toml"
              fi
              # 镜像按序尝试，第一个可达的胜出：可达性按主机不对称（实测本集群
              # github 间歇黑洞、gitee 秒级应答），只配一个地址时该主机不可达期间
              # 空卷种子会失败、工作树会静默停在旧 main。
              mirrors="{{ join "," .Values.sandboxExecutor.gitSeedUrls }}"
              if [ ! -f "$root/repo.git/HEAD" ]; then
                # 种子失败不阻塞启动：主进程见裸仓缺失即回落无工作树模式，
                # 下次重启 init 再试，离线集群不会因此永久卡在 Init 阶段。
                # http.connectTimeout/lowSpeed 给网络操作兜底，否则离线时
                # git 会长时间挂在连接上拖慢 Init 与整 Pod 就绪。
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  echo "sandbox volume empty; seeding bare repo from $m ..."
                  if git -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 clone --bare "$m" /tmp/seed.git; then
                    cp -a /tmp/seed.git/. "$root/repo.git/"
                    rm -rf /tmp/seed.git
                    break
                  fi
                  rm -rf /tmp/seed.git
                done
                [ -f "$root/repo.git/HEAD" ] || echo "WARN: sandbox bare repo seed failed on every mirror (offline?); executor starts without per-task worktrees"
              fi
              if [ -f "$root/repo.git/HEAD" ]; then
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  git --git-dir="$root/repo.git" remote remove upstream 2>/dev/null || true
                  git --git-dir="$root/repo.git" remote add upstream "$m"
                  # +main:main advances the local main that task worktrees are cut
                  # from; a plain fetch would only update remote-tracking refs.
                  if git --git-dir="$root/repo.git" -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch upstream --tags --force '+main:main'; then
                    break
                  fi
                  echo "WARN: sandbox seed fetch from $m failed (offline?); trying the next mirror"
                done
                git --git-dir="$root/repo.git" worktree prune || true
              fi
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
      containers:
        - name: sandbox-executor
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/cogneva/cogneva"]
          args: ["sandbox-executor"]
          ports:
            - name: executor
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            - name: SANDBOX_EXECUTOR_PORT
              value: "9090"
            # 每任务工作树路由：真实 task id 锚定命令 cwd 与相对文件路径。
            - name: SANDBOX_WORKSPACES_ROOT
              value: /opt/cogneva/sandbox/workspaces
            - name: SANDBOX_BARE_REPO
              value: /opt/cogneva/sandbox/repo.git
            - name: CARGO_TARGET_DIR
              value: /opt/cogneva/sandbox/src/target
            # 镜像里的 /usr/local/cargo 归 root，本 Pod 以非 root 跑，cargo 连
            # registry 缓存目录都建不出来——每条 cargo 命令第一步就失败，工具
            # 调用只剩反复试错。指向自有卷上的目录：可写，且已拉取的 registry
            # 跨重启保留，第二个任务起不必重新下载全量依赖。config.toml 由
            # init 容器从镜像带入。
            - name: CARGO_HOME
              value: /opt/cogneva/sandbox/cargo-home
            # 有序镜像列表（逗号分隔）：第一个首选，其余按序回退。
            - name: SANDBOX_REPO_SEED_URLS
              value: {{ join "," .Values.sandboxExecutor.gitSeedUrls | quote }}
            - name: SANDBOX_WORKSPACE_TTL_SECS
              value: {{ .Values.sandboxExecutor.workspaceTtlSecs | quote }}
            - name: SANDBOX_WORKSPACE_GC_INTERVAL_SECS
              value: {{ .Values.sandboxExecutor.workspaceGcIntervalSecs | quote }}
            - name: SANDBOX_REPO_FETCH_INTERVAL_SECS
              value: {{ .Values.sandboxExecutor.repoFetchIntervalSecs | quote }}
            - name: SANDBOX_MAX_TASK_WORKSPACES
              value: {{ .Values.sandboxExecutor.maxTaskWorkspaces | quote }}
            {{- if .Values.hostDocuments.scopes }}
            {{- $mount := required "hostDocuments.mountPath is required when hostDocuments.scopes is set" .Values.hostDocuments.mountPath }}
            {{- $pairs := list }}
            {{- range $name, $path := .Values.hostDocuments.scopes }}
            {{- if not $path }}{{ fail (printf "hostDocuments.scopes.%s has no host path" $name) }}{{ end }}
            {{- $pairs = append $pairs (printf "%s=%s/%s" $name $mount $name) }}
            {{- end }}
            # 文档范围按身份绑定：名字来自这份清单，路径由模板算出，模型只产出
            # 相对路径。挂载点与 scope 名一一对应，所以"能碰到谁的文件"在部署
            # 面上就定死了。
            - name: HOST_DOCS_SCOPES
              value: {{ join "," $pairs | quote }}
            - name: HOST_DOCS_JOURNAL_DIR
              value: {{ .Values.hostDocuments.journalDir | quote }}
            - name: HOST_DOCS_MAX_WRITE_BYTES
              value: {{ .Values.hostDocuments.maxWriteBytes | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: executor
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: executor
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: executor
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            {{- toYaml .Values.sandboxExecutor.resources | nindent 12 }}
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            {{- if .Values.hostDocuments.scopes }}
            {{- $mount := .Values.hostDocuments.mountPath }}
            {{- range $name, $path := .Values.hostDocuments.scopes }}
            - name: host-docs-{{ $name }}
              mountPath: {{ $mount }}/{{ $name }}
            {{- end }}
            {{- end }}
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-sandbox-pvc
        {{- if .Values.hostDocuments.scopes }}
        {{- range $name, $path := .Values.hostDocuments.scopes }}
        # type: Directory（非 DirectoryOrCreate）：宿主上路径不对就让 Pod 起不来，
        # 而不是替运维在宿主上建一个空目录——那会把"配置写错了"变成"整理出了
        # 一个空文件夹"。
        - name: host-docs-{{ $name }}
          hostPath:
            path: {{ $path | quote }}
            type: Directory
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-sandbox-executor
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-executor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: sandbox-executor
  # 端口名是观测面的契约：ServiceMonitor 按端口名（http / metrics）挑端点，
  # 叫 executor 的服务在 Prometheus 里等于不存在——执行器的 /metrics 一直在
  # 产出却从没被采集过。targetPort 仍指向容器的 executor 端口名。
  ports:
    - name: http
      port: 9090
      targetPort: executor
      protocol: TCP
{{- end }}
{{- if .Values.buildah.enabled }}
---
# 容器构建沙盒：每个节点提供 buildah 镜像构建能力（K3s/最小化 K8s 不带镜像构建）。
# 构建产物经 buildah push docker-archive + ctr images import 进入节点 containerd
# 作本地暖缓存/离线回退；工作负载运行时镜像的权威来源是集群内 registry
# （清单 pin localhost:30500/cogneva:local），不依赖节点本地引用名。
# 挂载节点容器存储与 containerd socket，仅应在受控节点运行；未来迁移 MicroVM
# 构建后可移除 privileged。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cogneva-buildah
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-builder
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: image-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: image-builder
    spec:
      hostPID: true
      containers:
        - name: buildah
          image: {{ .Values.buildah.image }}
          imagePullPolicy: {{ .Values.buildah.pullPolicy }}
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.buildah.resources | nindent 12 }}
          volumeMounts:
            - name: containers-storage
              mountPath: /var/lib/containers
            - name: containerd-socket
              mountPath: {{ .Values.buildah.containerdSocket }}
            - name: build-workspace
              mountPath: /workspace
      volumes:
        - name: containers-storage
          hostPath:
            path: {{ .Values.buildah.storageHostPath }}
            type: DirectoryOrCreate
        - name: containerd-socket
          hostPath:
            path: {{ .Values.buildah.containerdSocket }}
            type: Directory
        - name: build-workspace
          emptyDir: {}
      tolerations:
        - operator: Exists
{{- end }}
