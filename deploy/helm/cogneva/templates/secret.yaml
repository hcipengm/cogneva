{{- if .Values.secrets.create }}
{{- /*
内部实例密钥（数据库/缓存/内部签名）解析顺序：
  1. values 显式提供则用 values；
  2. 否则复用集群中已存在的 Secret 值（upgrade 时保持不变）；
  3. 全新安装则 randAlphaNum 随机生成——仓库与 values 都不携带可用弱密码。
带外凭证（LLM 上游、平台 token、webhook 验签）不自动生成，留空由向导写入。
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cogneva-secrets" }}
{{- $pg := .Values.secrets.pgPassword }}
{{- if not $pg }}
  {{- if $existing }}{{ $pg = index $existing.data "pg-password" | b64dec }}
  {{- else }}{{ $pg = randAlphaNum 32 }}{{ end }}
{{- end }}
{{- $redis := .Values.secrets.redisPassword }}
{{- if not $redis }}
  {{- if $existing }}{{ $redis = index $existing.data "redis-password" | b64dec }}
  {{- else }}{{ $redis = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $webhookInternal := .Values.secrets.webhookInternal }}
{{- if not $webhookInternal }}
  {{- if $existing }}{{ $webhookInternal = index $existing.data "webhook-internal" | b64dec }}
  {{- else }}{{ $webhookInternal = randAlphaNum 40 }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  pg-password: {{ $pg | quote }}
  redis-password: {{ $redis | quote }}
  webhook-internal: {{ $webhookInternal | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
  # LLM 上游池（网关唯一 LLM 凭证来源）、代码平台 token、webhook 验签：
  # 只注入安全网关，主应用与沙盒零持有。真实值带外写入（kubectl edit
  # secret cogneva-secrets 或 WebUI 向导），不入库；默认空时对应功能 fail-closed。
  llm-upstreams: {{ .Values.secrets.llmUpstreams | quote }}
  github-token: {{ .Values.secrets.githubToken | quote }}
  gitee-token: {{ .Values.secrets.giteeToken | quote }}
  github-webhook-secret: {{ .Values.secrets.githubWebhookSecret | quote }}
  gitee-webhook-token: {{ .Values.secrets.giteeWebhookToken | quote }}
{{- end }}
