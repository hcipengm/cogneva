{{- if .Values.secrets.create }}
{{- /*
内部实例密钥（数据库/缓存/内部签名）解析顺序：
  1. values 显式提供则用 values；
  2. 否则复用集群中已存在的 Secret 值（upgrade 时保持不变）；
  3. 全新安装则 randAlphaNum 随机生成——仓库与 values 都不携带可用弱密码。

**这一份只装业务 Pod 要读的键**；带外（oob）凭证——LLM 上游、平台 token、webhook
验签、OAuth 应用密钥、GitHub App 私钥、git 身份私钥——在 cogneva-secrets-oob 里，
只被安全网关读。判据与理由见那个模板开头的注释：分家的依据是读者面，不是凭证种类。
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cogneva-secrets" }}
{{- $pg := .Values.secrets.pgPassword }}
{{- if not $pg }}
  {{- if $existing }}{{ $pg = index $existing.data "pg-password" | b64dec }}
  {{- /* lit: 32 fixed — randAlphaNum 32 for the internal database, cache and fingerprint secrets: entropy, not a capacity */}}
  {{- else }}{{ $pg = randAlphaNum 32 }}{{ end }}
{{- end }}
{{- $app := .Values.secrets.appPassword }}
{{- if not $app }}
  {{- if $existing }}{{ $app = index $existing.data "app-password" | b64dec }}
  {{- /* lit: 40 fixed — randAlphaNum 40 for the runtime database role: entropy for a credential, not a capacity */}}
  {{- else }}{{ $app = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $redis := .Values.secrets.redisPassword }}
{{- if not $redis }}
  {{- if $existing }}{{ $redis = index $existing.data "redis-password" | b64dec }}
  {{- /* lit: 40 fixed — randAlphaNum 40 for the internal signing and store secrets: entropy for a credential, not a capacity */}}
  {{- else }}{{ $redis = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $webhookInternal := .Values.secrets.webhookInternal }}
{{- if not $webhookInternal }}
  {{- if $existing }}{{ $webhookInternal = index $existing.data "webhook-internal" | b64dec }}
  {{- else }}{{ $webhookInternal = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- if not $jwt }}
  {{- if $existing }}{{ $jwt = index $existing.data "jwt-secret" | b64dec }}
  {{- /* lit: 48 fixed — randAlphaNum 48 for the JWT secrets: entropy for a credential, not a capacity */}}
  {{- else }}{{ $jwt = randAlphaNum 48 }}{{ end }}
{{- end }}
{{- $evolutionJwt := .Values.secrets.evolutionJwtSecret }}
{{- if not $evolutionJwt }}
  {{- if $existing }}{{ $evolutionJwt = index $existing.data "evolution-jwt-secret" | b64dec }}
  {{- else }}{{ $evolutionJwt = randAlphaNum 48 }}{{ end }}
{{- end }}
{{- $fingerprint := .Values.secrets.instanceFingerprint }}
{{- if not $fingerprint }}
  {{- if $existing }}{{ $fingerprint = index $existing.data "instance-fingerprint" | b64dec }}
  {{- else }}{{ $fingerprint = randAlphaNum 32 | sha256sum }}{{ end }}
{{- end }}
{{- $adminPassword := .Values.secrets.adminPassword }}
{{- if not $adminPassword }}
  {{- if $existing }}{{ $adminPassword = index $existing.data "admin-password" | b64dec }}
  {{- /* lit: 24 fixed — randAlphaNum 24 for the bootstrap admin password: entropy for a credential, not a capacity */}}
  {{- else }}{{ $adminPassword = randAlphaNum 24 }}{{ end }}
{{- end }}
{{- $meili := .Values.secrets.meiliMasterKey }}
{{- if not $meili }}
  {{- if $existing }}{{ $meili = index $existing.data "meili-master-key" | b64dec }}
  {{- else }}{{ $meili = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $s3Access := .Values.secrets.s3AccessKey }}
{{- if not $s3Access }}
  {{- if $existing }}{{ $s3Access = index $existing.data "s3-access-key" | b64dec }}
  {{- /* lit: 20 fixed — randAlphaNum 20 for the S3 access key id: an identifier the store's field sizes, not a bound anybody tunes */}}
  {{- else }}{{ $s3Access = randAlphaNum 20 }}{{ end }}
{{- end }}
{{- $s3Secret := .Values.secrets.s3SecretKey }}
{{- if not $s3Secret }}
  {{- if $existing }}{{ $s3Secret = index $existing.data "s3-secret-key" | b64dec }}
  {{- else }}{{ $s3Secret = randAlphaNum 40 }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    # 卸载不销毁密钥：实例身份指纹与数据库/缓存口令都在这里，删掉就等于换了一个
    # 实例（分支名、工作树名全部另起），数据卷里的内容再也连不上。
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # readers: StatefulSet/postgres, Job/cogneva-db-role-bootstrap, CronJob/cogneva-backup-drill — 数据库自己、一次性的角色引导，与备份演练；演练的恢复要 `session_replication_role` 并在同一台服务器上建演练库，两条都只有超级用户做得到，所以它是业务面搬走之后仍留在超级用户上的那一处。业务进程不再读它
  pg-password: {{ $pg | quote }}
  # 业务进程连库用的角色口令。它与 pg-password 是两个角色：pg-password 属于实例的
  # 超级用户（建库、复制、备份演练要它），这一份属于 cog_app——只有 cogneva 库的
  # 连接与建表权。分开的理由是爆炸半径：SQL 注入拿到 cog_app 只拿到这个库，
  # 拿到超级用户则拿到整台实例（COPY … FROM PROGRAM、任意库、pg_read_file）。
  # readers: Deployment/cogneva, Deployment/cogneva-evolution, Deployment/cogneva-security-gateway, CronJob/cogneva-backup, Job/cogneva-db-role-bootstrap — 业务进程连库；引导 Job 把它写进角色
  app-password: {{ $app | quote }}
  # readers: Deployment/cogneva, Deployment/cogneva-evolution, Deployment/cogneva-security-gateway, StatefulSet/redis — 业务进程连缓存；网关的池状态跨进程信号走 Redis；redis 自用
  redis-password: {{ $redis | quote }}
  # readers: Deployment/cogneva-security-gateway, Deployment/cogneva — 网关验完平台签名后附上内部 HMAC，主应用验它
  webhook-internal: {{ $webhookInternal | quote }}
  # 主应用 JWT 签名密钥（HS256）：随机生成，缺失时进程退化为每次启动
  # 生成一次性随机密钥（重启即全员登出，可接受但应避免）。
  # readers: Deployment/cogneva — 主应用会话签名，只给主应用
  jwt-secret: {{ $jwt | quote }}
  # 进化 Pod 自己的签名密钥：与主应用那份刻意不同，见 values 中同名的说明。
  # readers: Deployment/cogneva-evolution — 进化 Pod 自己的签名域，与主应用那份刻意不同源
  evolution-jwt-secret: {{ $evolutionJwt | quote }}
  # 实例身份指纹：身份的规范来源，安装时生成一次、升级时复用，重装/换机
  # 带上同一个 Secret 即同一个实例。
  # readers: Deployment/cogneva, Deployment/cogneva-evolution, CronJob/cogneva-backup — 实例身份的规范来源；备份只取这一个键，不挂整片
  instance-fingerprint: {{ $fingerprint | quote }}
  # 引导管理员（用户名 admin）的登录口令：装机时随机生成、升级时复用。
  # 它与下面这些内部密钥同类——本实例生成、本实例注入、不进仓库与 values。
  # readers: Deployment/cogneva — 引导管理员登录的定长比对口令，装机唯一入口
  admin-password: {{ $adminPassword | quote }}
  # Meilisearch 主密钥：内部生成的实例密钥，同时注入 Meilisearch 与主应用
  # （wiki 的 api_key 经 ${MEILI_MASTER_KEY} 插值），仓库零可用密钥。
  # readers: Deployment/cogneva, Deployment/cogneva-evolution, Deployment/meilisearch — wiki 检索；meilisearch 自己启动要用
  meili-master-key: {{ $meili | quote }}
  # 对象存储（SeaweedFS S3 网关）凭证：网关按 identities 校验 SigV4，主应用按
  # 同一对密钥签名。两个键之外还给出网关要的身份文件——它是唯一能同时携带
  # accessKey 与 secretKey 的形态，运行期从 Secret 挂成文件读入。
  # readers: Deployment/cogneva, Deployment/cogneva-evolution — 对象存储 SigV4 签名
  s3-access-key: {{ $s3Access | quote }}
  # readers: Deployment/cogneva, Deployment/cogneva-evolution — 对象存储 SigV4 签名
  s3-secret-key: {{ $s3Secret | quote }}
  # readers: Deployment/seaweedfs — 身份文件：唯一能同时携带 accessKey 与 secretKey 的形态，运行期挂成文件读
  seaweedfs-s3.json: |
    {
      "identities": [
        {
          "name": "cogneva",
          "credentials": [
            { "accessKey": {{ $s3Access | quote }}, "secretKey": {{ $s3Secret | quote }} }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
