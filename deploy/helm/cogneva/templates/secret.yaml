{{- if .Values.secrets.create }}
{{- /*
内部实例密钥（数据库/缓存/内部签名）解析顺序：
  1. values 显式提供则用 values；
  2. 否则复用集群中已存在的 Secret 值（upgrade 时保持不变）；
  3. 全新安装则 randAlphaNum 随机生成——仓库与 values 都不携带可用弱密码。

**这一份只装业务 Pod 要读的键**；带外（oob）凭证——LLM 上游、平台 token、webhook
验签、OAuth 应用密钥、GitHub App 私钥、git 身份私钥——在 cogneva-secrets-oob 里，
只被安全网关读。判据与理由见那个模板开头的注释：分家的依据是读者面，不是凭证种类。
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cogneva-secrets" }}
{{- $pg := .Values.secrets.pgPassword }}
{{- if not $pg }}
  {{- if $existing }}{{ $pg = index $existing.data "pg-password" | b64dec }}
  {{- else }}{{ $pg = randAlphaNum 32 }}{{ end }}
{{- end }}
{{- $redis := .Values.secrets.redisPassword }}
{{- if not $redis }}
  {{- if $existing }}{{ $redis = index $existing.data "redis-password" | b64dec }}
  {{- else }}{{ $redis = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $webhookInternal := .Values.secrets.webhookInternal }}
{{- if not $webhookInternal }}
  {{- if $existing }}{{ $webhookInternal = index $existing.data "webhook-internal" | b64dec }}
  {{- else }}{{ $webhookInternal = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- if not $jwt }}
  {{- if $existing }}{{ $jwt = index $existing.data "jwt-secret" | b64dec }}
  {{- else }}{{ $jwt = randAlphaNum 48 }}{{ end }}
{{- end }}
{{- $evolutionJwt := .Values.secrets.evolutionJwtSecret }}
{{- if not $evolutionJwt }}
  {{- if $existing }}{{ $evolutionJwt = index $existing.data "evolution-jwt-secret" | b64dec }}
  {{- else }}{{ $evolutionJwt = randAlphaNum 48 }}{{ end }}
{{- end }}
{{- $fingerprint := .Values.secrets.instanceFingerprint }}
{{- if not $fingerprint }}
  {{- if $existing }}{{ $fingerprint = index $existing.data "instance-fingerprint" | b64dec }}
  {{- else }}{{ $fingerprint = randAlphaNum 32 | sha256sum }}{{ end }}
{{- end }}
{{- $meili := .Values.secrets.meiliMasterKey }}
{{- if not $meili }}
  {{- if $existing }}{{ $meili = index $existing.data "meili-master-key" | b64dec }}
  {{- else }}{{ $meili = randAlphaNum 40 }}{{ end }}
{{- end }}
{{- $s3Access := .Values.secrets.s3AccessKey }}
{{- if not $s3Access }}
  {{- if $existing }}{{ $s3Access = index $existing.data "s3-access-key" | b64dec }}
  {{- else }}{{ $s3Access = randAlphaNum 20 }}{{ end }}
{{- end }}
{{- $s3Secret := .Values.secrets.s3SecretKey }}
{{- if not $s3Secret }}
  {{- if $existing }}{{ $s3Secret = index $existing.data "s3-secret-key" | b64dec }}
  {{- else }}{{ $s3Secret = randAlphaNum 40 }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    # 卸载不销毁密钥：实例身份指纹与数据库/缓存口令都在这里，删掉就等于换了一个
    # 实例（分支名、工作树名全部另起），数据卷里的内容再也连不上。
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  pg-password: {{ $pg | quote }}
  redis-password: {{ $redis | quote }}
  webhook-internal: {{ $webhookInternal | quote }}
  # 主应用 JWT 签名密钥（HS256）：随机生成，缺失时进程退化为每次启动
  # 生成一次性随机密钥（重启即全员登出，可接受但应避免）。
  jwt-secret: {{ $jwt | quote }}
  # 进化 Pod 自己的签名密钥：与主应用那份刻意不同，见 values 中同名的说明。
  evolution-jwt-secret: {{ $evolutionJwt | quote }}
  # 实例身份指纹：身份的规范来源，安装时生成一次、升级时复用，重装/换机
  # 带上同一个 Secret 即同一个实例。
  instance-fingerprint: {{ $fingerprint | quote }}
  # Meilisearch 主密钥：内部生成的实例密钥，同时注入 Meilisearch 与主应用
  # （wiki 的 api_key 经 ${MEILI_MASTER_KEY} 插值），仓库零可用密钥。
  meili-master-key: {{ $meili | quote }}
  # 对象存储（SeaweedFS S3 网关）凭证：网关按 identities 校验 SigV4，主应用按
  # 同一对密钥签名。两个键之外还给出网关要的身份文件——它是唯一能同时携带
  # accessKey 与 secretKey 的形态，运行期从 Secret 挂成文件读入。
  s3-access-key: {{ $s3Access | quote }}
  s3-secret-key: {{ $s3Secret | quote }}
  seaweedfs-s3.json: |
    {
      "identities": [
        {
          "name": "cogneva",
          "credentials": [
            { "accessKey": {{ $s3Access | quote }}, "secretKey": {{ $s3Secret | quote }} }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
