{{- if .Values.resourceGovernance.enabled }}
{{- /* 额度不是在这里标定的：全部由 deploy/scripts/project-resource-governance.py
       从渲染集投影出来，落在 values.resource-governance.<profile>.yaml。
       `required` 不是防御性编程：这份文件缺了，渲染出来就是一条空额度的
       ResourceQuota（`requests.cpu: ""`），提交时才被 apiserver 以"数量非法"
       拒掉——那句话不会告诉任何人去跑投影脚本。所以缺了就在渲染期报错，并把
       该跑的脚本写进错误里。渲染器自己那遍"先渲染再投影"的原始渲染用
       `--set resourceGovernance.enabled=false` 关掉这一段，不走这条路径。 */}}
{{- $q := required "resourceGovernance.quota is missing: the ceiling is projected from the rendered set, never written in values. Run deploy/scripts/render-deploy.sh and pass -f deploy/helm/cogneva/values.resource-governance.<profile>.yaml" .Values.resourceGovernance.quota }}
{{- $l := .Values.resourceGovernance.limitRange }}
{{- $r := .Values.resourceGovernance.runtimeSum | default dict }}
{{- $maxCpu := required "resourceGovernance.limitRange.maxCpu is projected: run deploy/scripts/render-deploy.sh" $l.maxCpu }}
{{- $maxMemory := required "resourceGovernance.limitRange.maxMemory is projected: run deploy/scripts/render-deploy.sh" $l.maxMemory }}
{{- $pvcMax := required "resourceGovernance.limitRange.pvcMaxStorage is projected: run deploy/scripts/render-deploy.sh" $l.pvcMaxStorage }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cogneva-quota
  namespace: {{ include "cogneva.namespace" . }}
  # 额度按「声明工作负载 + 部署器判据 Job + 运行期自建 Pod + 替换重叠」定。
  # 第三项在这里留的是 0：产品自己建的 Pod（评测台）在创建前按自己的清单把额度
  # 抬到装得下，跑完放回去，所以渲染期不必替它预写一份。`runtimeWorkloads` 里有
  # 条目时（不由产品创建、也不会自己抬额度的那种），投影把它的形状加进求和，
  # 这一行随之非零。缺注解不是零，是报错：留空读作"没声明"，不读作"不需要"。
  annotations:
    cogneva.io/runtime-pods-limits-cpu: {{ $r.limitsCpu | quote }}
    cogneva.io/runtime-pods-limits-memory: {{ $r.limitsMemory | quote }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: resource-governance
spec:
  hard:
    requests.cpu: {{ $q.requestsCpu | quote }}
    requests.memory: {{ $q.requestsMemory | quote }}
    limits.cpu: {{ $q.limitsCpu | quote }}
    limits.memory: {{ $q.limitsMemory | quote }}
    pods: {{ $q.pods | quote }}
    requests.storage: {{ $q.requestsStorage | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cogneva-limits
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: resource-governance
spec:
  limits:
    - type: Container
      default:
        cpu: {{ $l.defaultCpu | quote }}
        memory: {{ $l.defaultMemory | quote }}
      defaultRequest:
        cpu: {{ $l.defaultRequestCpu | quote }}
        memory: {{ $l.defaultRequestMemory | quote }}
      max:
        cpu: {{ $l.maxCpu | quote }}
        memory: {{ $l.maxMemory | quote }}
      min:
        cpu: {{ $l.minCpu | quote }}
        memory: {{ $l.minMemory | quote }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ $l.pvcMaxStorage | quote }}
      min:
        storage: {{ $l.pvcMinStorage | quote }}
{{- end }}
