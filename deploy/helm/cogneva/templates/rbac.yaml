# 主应用 Pod 使用的 ServiceAccount：LLM 设置页写 Secret/滚网关、GitOps 拉取端
# apply 配置与金丝雀，都靠下面两个 Role 授权。安全网关有自己的 SA（见文件尾），
# 沙盒执行器不使用 SA。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# LLM 设置界面（WebUI 系统设置）最小权限：**只碰工作负载，不碰 Secret 对象**。
#
# 写入不经过这个主体。主应用把要写的字段转发给安全网关的内部端点
# （`secret_write::forward`），由网关用自己的 SA 落盘（见文件尾那条 Role）。
#
# 读取也不经过它了。迁移窗里的三个读点——LLM 状态、贡献配置、gitee 续期循环——
# 已全部搬进网关进程：主应用按 `/internal/*` 拿派生读数（家数、布尔位、策略名），
# 拿不到任何一把 key。带 out-of-band 凭证的那两片，这个身份不再有 get。
#
# 这条规则整条删掉是有条件的：删完之后主应用那一侧任何一处 Secret 读都会 403，
# 而它不该有读点——凭证持有面门禁按渲染产物反查「谁在读」，再与每个键头上那行
# `# readers:` 声明对两侧，多一个能读的主体就报。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-llm-admin
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json"]
    verbs: ["get", "patch"]
  # 集群组件健康端点读三组件副本状态；晋级门端点改配置后滚动主应用/进化/网关。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-evolution", "cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-llm-admin
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-llm-admin
  apiGroup: rbac.authorization.k8s.io
---
# GitOps 拉取端最小权限：apply L0 配置 configmap、重建 prompts configmap、
# 对 cogneva 部署做金丝雀（set image / rollout pause|resume|undo|status）
# 并读取 pod 健康信号。全部限定 namespace 内、resourceNames 白名单。
# 推送端读金丝雀基底的那四个 deployment 也走这里：两个 Pod 都会构造推送端，
# 按名可读是最小面（见下面那条只读规则）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-gitops-puller
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  # L0：kubectl apply cogneva-json（热更新）+ 重建 cogneva-prompts。
  # apply 首次需要 create，后续 get+patch。
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json", "cogneva-prompts"]
    verbs: ["get", "patch", "create"]
  # L1 金丝雀：set image / rollout pause|resume|undo 都是 patch；
  # rollout status 需要 get+watch。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout undo 要从历史 ReplicaSet 还原 PodTemplate。
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # 金丝雀基底的按名读：推送端要取这四个工作负载当前在跑的不可变 main tag，
  # 而它也可能跑在本身份所在的 Pod 里（两个 Pod 都会构造推送端），所以这四个
  # 名字要对本身份可读。只读——写权限仍然只有上面那一个目标（cogneva）。
  # 为什么不一次 list：resourceNames 与 list 组合要求请求带对应的 field
  # selector，集合级 list 在本身份下必被拒（现场读数 `cannot list resource
  # "deployments" in API group "apps"`），而这条路径读不到时只会静默退回浮动
  # tag —— 拿不到授权与"集群里确实还是浮动 tag"就再也分不出来了。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-security-gateway", "cogneva-sandbox-executor", "cogneva-evolution"]
    verbs: ["get"]
  # 金丝雀看护：readiness 与 restart count。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-gitops-puller
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-gitops-puller
  apiGroup: rbac.authorization.k8s.io
---
# 安全网关自己的 ServiceAccount。它是唯一代持带外凭证的进程，所以「读得写得到
# 那两个 Secret 对象」这件事必须落在它自己这个主体上。
#
# 为什么不继续用 `cogneva`：RBAC 的对象级约束不认「谁是网关」，只认被绑的主体。
# 给旧主体多写一个对象名（`resourceNames` 加 `cogneva-secrets-oob`）等于把权限
# 发给主应用——这不是收窄，是把扩权写成了收窄的样子。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
---
# 网关的最小权限：两个 Secret 对象的 get/patch，加上对**自己**那个 Deployment 的
# get/patch。
#
# 两个对象都要，不是只要带外那片：写进集群的每一条路径都按键位表分派目标对象，
# 而一份身份事实横跨两片（生效私钥在带外片，状态位与公钥在内部片），读的那一侧
# （合并视图）两片都读、任一片读不到就整体报错。只给一片等于让同一批写入一半成功
# 一半 403，而且是静默的一半——写失败的那半在功能上表现为「这个键一直没有值」。
#
# Deployment 那一条是自举要用的：私钥换了以后要滚一次网关，让容器重新读挂载卷。
# 只指自己的名字——网关没有任何理由碰别的工作负载的 Pod 模板。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cogneva-secrets", "cogneva-secrets-oob"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
subjects:
  - kind: ServiceAccount
    name: cogneva-security-gateway
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-security-gateway
  apiGroup: rbac.authorization.k8s.io
---
# 拓扑面的节点读权限。
#
# 这是这份清单里唯一的 ClusterRole：节点不属于任何命名空间，而「东西跑在哪台机器
# 上、那台机器还剩多少」这一面必须读到节点的就绪条件、角色标签与可分配量
# （`/api/v1/nodes` 的 status.allocatable）。
#
# Pod 也在这一层读。范围不是凭空放宽的：进程采集器是一个 hostPID 的 DaemonSet，
# 它读的是整台宿主上每一个容器的 cgroup——一台机器上有多少容器、各跑着多少进程，
# 这个平台本来就已经全部看得到。只让 Pod 那一层留在本命名空间，屏上就只剩本命名
# 空间的格子，差出来的那些（系统组件、监控、宿主上的构建容器）有进程读数却没有位置，
# 而读者分不清「没有」和「没读」。读不到就画不出，画不出就不算全量。
#
# 只要 get 与 list：这一面按轮询读，不 watch；更没有任何写。加到 write 的那一天，
# 就是「一个只读的图」变成了「能改集群的入口」，而这张清单上看不出来区别。
#
# 事件与卷声明也在这一层读，而且必须在**这一层**：一条命名空间的 Role 授不了
# `/api/v1/events` 与 `/api/v1/persistentvolumeclaims`——那两条不带 `namespaces/<ns>`
# 的集合读，apiserver 根本不去命名空间里找授权。曾经有的是「ClusterRole 授 Pod、
# 下面那条 Role 授事件与卷声明」的分法，拓扑面把这两条读改成集群范围之后，Role
# 还在、规则还在、看起来「事件与卷声明已经授过」，实际每一次都是 403，而读失败在
# 屏上只是少了这一层信息。授权写在错误的范围里，比没有写更难发现。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cogneva-topology-reader
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # 节点的实际用量同样来自 metrics-server。它没装时这条规则不会被用到，
  # 也不会因此报错——读不到用量是「没有数据源」，不是权限问题。
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Pod 与它们的实际用量：与上面同一条理由——这一面画的是整个集群的容器，
  # 不是本命名空间的容器。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # 没有 metrics-server 时的用量来源：kubelet 自带的 summary 接口，经 apiserver
  # 代理读（`/api/v1/nodes/<节点>/proxy/stats/summary`）。apiserver 按路径把代理
  # 请求映射到子资源，`/stats/*` 落到 `nodes/stats`，只读。
  #
  # 这里刻意不要 `nodes/proxy`：那一项连同 exec、run 一起授权，而这一面只需要读
  # 用量。多一个只读子资源，就少一条能进任何 Pod 的路径。
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  # 资源面：命名空间的配额头寸与默认限额。配额对象是命名空间级的，但读它的身份
  # 已经在集群作用域里，加在这里不额外扩大范围——只是一条只读的命名空间集合。
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  # 部署面：每个工作负载的副本、镜像与滚动条件。这里要的是集合级 list（不是按名
  # 读那四个），因为「谁在跑第几版」这个问题问的是全部工作负载，不是一份名单。
  #
  # 三种形态就是三种状态读法，只授 deployments 的那一版真跑起来是这样：
  # `读不到 StatefulSet：apiserver 返回 403`，屏上照样是 11 行——postgres、redis、
  # 三个 DaemonSet、两个 CronJob 全都不在，而空白读起来像「本来就没有」。
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  # batch 是另一个分组：Job 与 CronJob 不在 apps 里，只加 apps 那条读不到它们。
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # 事件（这个 Pod 为什么没起来）与卷声明（持久卷绑到了哪块盘）。读的是集合级的
  # 两条路径，不是按 Pod 名去新闻命名空间里那两条——一次读全集群的集合，比每个
  # Pod 一次请求便宜几十倍，而按对象分派由读回来的 owner 关系自己做。
  - apiGroups: [""]
    resources: ["events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  # 入口层：Service 与它的 Endpoints。资源面另一半个问题——「外面敲进来，落到哪个
  # Pod 上」。Service 不占 CPU 也不占内存，所以这一条不在配额头寸里；但一个一条
  # Endpoint 都没有的 Service 与「这个服务没人访问」在屏上同形，而它正是 5xx 与
  # 超时排查的第一跳。
  #
  # Endpoints 读的是它的集合，不是按 Service 名逐个问：一次读全集群的集合比每个
  # Service 一次请求便宜几十倍，按名字对齐由读回来的 label 自己做。
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cogneva-topology-reader
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
# 谁跑这份镜像的默认入口，谁就端着这一面。进化进程与网关是同一个二进制、同一套路由，
# 只是镜像与 ConfigMap 之外没有区别——所以它同样答 `/api/v1/cluster/topology`，同样读
# 不到就得在屏上画空白。2026-10-28 实测：探针上线后第一轮就报出它有四条集合读是 403
# （nodes、pods、events、persistentvolumeclaims），而在此之前那两个进程的差别只在
# 这一个绑定里，谁都没看见。
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: ClusterRole
  name: cogneva-topology-reader
  apiGroup: rbac.authorization.k8s.io
---
# 导出备份包：页面按一次导出，就起一个跑 `cogneva backup` 的 Job，再读回它还在不在跑。
#
# 模板不在这里：Job 是从每日备份那个 CronJob 克隆出来的，所以这里只需要**按名字**
# 读那一个 CronJob。名字写死是 RBAC 的硬约束（resourceNames 不接受通配），
# `COGNEVA_BACKUP_CRONJOB` 这个覆盖只在不改 rbac 的前提下没意义——改名要连这行一起改，
# 否则导出的表现是「读不到备份 CronJob」，而备份本身一切正常。
#
# jobs 只给 get/list/create：删由 Job 自己的 ttlSecondsAfterFinished 做，导出端没有
# 任何理由去删一个正在跑或已经跑完的 Job。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-backup-export
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["cogneva-backup"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-backup-export
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-backup-export
  apiGroup: rbac.authorization.k8s.io
