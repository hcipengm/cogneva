# 主应用 Pod 使用的 ServiceAccount：LLM 设置页写 Secret/滚网关、GitOps 拉取端
# apply 配置与金丝雀，都靠下面两个 Role 授权。安全网关有自己的 SA（见文件尾），
# 沙盒执行器不使用 SA。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# LLM 设置界面（WebUI 系统设置）最小权限：**只读**两个 Secret 对象。
#
# 写入不经过这个主体。主应用把要写的字段转发给安全网关的内部端点
# （`secret_write::forward`），由网关用自己的 SA 落盘（见文件尾那条 Role）。
# 因此这里只有 get——patch 在代码里已经没有调用点，留着等于把「代持带外凭证」
# 复制一份到零凭证的进程里，而清单上看不出它没人在用。
#
# 仍需要 get，是因为三个读点今天还跑在主应用进程里：LLM 状态
# （`llm_admin::llm_status_handler`）、贡献配置（`contribution_admin::read_contrib_config`）、
# gitee 续期循环（`contribution_admin::spawn_gitee_token_refresher`，起在 `plugin.rs`）。
#
# 关闭条件（门要能判）：这三个读点搬进网关进程后——plugin 不再给主应用挂网关路由、
# 不再起续期循环——本条 secrets 规则整条删掉。登记表
# （deploy/credential-holders.tsv）把这一点写成 closes-when 指针；凭证持有面门禁在
# 指针指向的符号消失时报红：那时授权已经没人用，留着就是一条无主的凭证权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-llm-admin
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cogneva-secrets", "cogneva-secrets-oob"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json"]
    verbs: ["get", "patch"]
  # 集群组件健康端点读三组件副本状态；晋级门端点改配置后滚动主应用/进化/网关。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-evolution", "cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-llm-admin
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-llm-admin
  apiGroup: rbac.authorization.k8s.io
---
# GitOps 拉取端最小权限：apply L0 配置 configmap、重建 prompts configmap、
# 对 cogneva 部署做金丝雀（set image / rollout pause|resume|undo|status）
# 并读取 pod 健康信号。全部限定 namespace 内、resourceNames 白名单。
# 推送端读金丝雀基底的那四个 deployment 也走这里：两个 Pod 都会构造推送端，
# 按名可读是最小面（见下面那条只读规则）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-gitops-puller
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  # L0：kubectl apply cogneva-json（热更新）+ 重建 cogneva-prompts。
  # apply 首次需要 create，后续 get+patch。
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-json", "cogneva-prompts"]
    verbs: ["get", "patch", "create"]
  # L1 金丝雀：set image / rollout pause|resume|undo 都是 patch；
  # rollout status 需要 get+watch。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "list", "watch", "patch"]
  # rollout undo 要从历史 ReplicaSet 还原 PodTemplate。
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # 金丝雀基底的按名读：推送端要取这四个工作负载当前在跑的不可变 main tag，
  # 而它也可能跑在本身份所在的 Pod 里（两个 Pod 都会构造推送端），所以这四个
  # 名字要对本身份可读。只读——写权限仍然只有上面那一个目标（cogneva）。
  # 为什么不一次 list：resourceNames 与 list 组合要求请求带对应的 field
  # selector，集合级 list 在本身份下必被拒（现场读数 `cannot list resource
  # "deployments" in API group "apps"`），而这条路径读不到时只会静默退回浮动
  # tag —— 拿不到授权与"集群里确实还是浮动 tag"就再也分不出来了。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva", "cogneva-security-gateway", "cogneva-sandbox-executor", "cogneva-evolution"]
    verbs: ["get"]
  # 金丝雀看护：readiness 与 restart count。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-gitops-puller
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: cogneva
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-gitops-puller
  apiGroup: rbac.authorization.k8s.io
---
# 安全网关自己的 ServiceAccount。它是唯一代持带外凭证的进程，所以「读得写得到
# 那两个 Secret 对象」这件事必须落在它自己这个主体上。
#
# 为什么不继续用 `cogneva`：RBAC 的对象级约束不认「谁是网关」，只认被绑的主体。
# 给旧主体多写一个对象名（`resourceNames` 加 `cogneva-secrets-oob`）等于把权限
# 发给主应用——这不是收窄，是把扩权写成了收窄的样子。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
---
# 网关的最小权限：两个 Secret 对象的 get/patch，加上对**自己**那个 Deployment 的
# get/patch。
#
# 两个对象都要，不是只要带外那片：写进集群的每一条路径都按键位表分派目标对象，
# 而一份身份事实横跨两片（生效私钥在带外片，状态位与公钥在内部片），读的那一侧
# （合并视图）两片都读、任一片读不到就整体报错。只给一片等于让同一批写入一半成功
# 一半 403，而且是静默的一半——写失败的那半在功能上表现为「这个键一直没有值」。
#
# Deployment 那一条是自举要用的：私钥换了以后要滚一次网关，让容器重新读挂载卷。
# 只指自己的名字——网关没有任何理由碰别的工作负载的 Pod 模板。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cogneva-secrets", "cogneva-secrets-oob"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva-security-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
subjects:
  - kind: ServiceAccount
    name: cogneva-security-gateway
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-security-gateway
  apiGroup: rbac.authorization.k8s.io
