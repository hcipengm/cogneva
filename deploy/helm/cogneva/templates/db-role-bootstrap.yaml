{{- if .Values.backends.postgres.enabled }}
{{- /*
业务 Pod 连库用的角色与实例超级用户分家。

起因是爆炸半径：`cog_user` 是 `rolsuper=t`，而四个业务部署的
`COGNEVA_DATABASE_URL` 全部用它连库——任何一处 SQL 注入拿到的不是这个库的读写，
是整台实例（`COPY … FROM PROGRAM`、任意库、`pg_read_file`）。分成两个角色之后，
业务侧那条连接里没有的东西，注入也拿不到。

这一步把两个受限角色做实：cog_app（业务 Pod 连库）与 cog_backup（备份演练连源库，
要建一个一次性演练库、读全部表比对行数、写自己那一行结论）。

`cog_user` 的超权位**收不掉**，这一点要写在明处：它是 initdb 建出来的那个角色
（`POSTGRES_USER`），PostgreSQL 16 起不许任何人把它降成 NOSUPERUSER——2026-11-01
实测，换另一个超级用户去降也一样报 `The bootstrap user must have the SUPERUSER
attribute`；它同时是 `postgres --single` 唯一能进的那个人，抬不回来的代价更大。
所以目标不是「零超权角色」，而是**没有任何工作负载用它连库**：它的口令不再注入任何
Pod，只剩单用户恢复那一条路。这一条由运行时判据盯着（业务角色之外还有谁在连库），
不是靠人记得。

脚本正文在 files/db-role-bootstrap.sh（写在这里会让里面的每个数字都进 chart 的
数字普查，而那些数字是重试次数与睡眠秒数，不是部署参数）。
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-db-role-bootstrap
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
data:
  db-role-bootstrap.sh: |
    {{- .Files.Get "files/db-role-bootstrap.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cogneva-db-role-bootstrap
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
  annotations:
    # 新装跑在安装之后（那一刻 postgres 才起来），升级跑在**滚动之前**：升级时
    # 库里的对象还挂在超级用户名下，而业务 Pod 一换角色就够不到它们——先滚后挪
    # 只会得到一串 permission denied 与一次没必要的 CrashLoopBackOff。
    # 每次跑都是幂等的：它读的是「现在还在 cog_user 名下的对象」，挪走的部分读不到。
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva-db-role-bootstrap
        app.kubernetes.io/component: database-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        {{- /* lit: 1001 fixed — the runtime UID/GID the images are built with; every workload pins the same pair */}}
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: bootstrap
          image: {{ .Values.backends.postgres.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/bootstrap/db-role-bootstrap.sh"]
          env:
            {{- include "cogneva.timeEnv" . | nindent 12 }}
            - name: PGHOST
              value: postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local
            - name: PGPORT
              value: {{ .Values.backends.postgres.port | quote }}
            - name: PGDATABASE
              value: "cogneva"
            # 超级用户只在这里出现一次：建角色与改属主需要它，业务侧不需要。
            - name: PGUSER
              value: "cog_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: app-password
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: backup-password
            - name: TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: test-password
          # 不声明资源：这是个装完就跑完的钩子 Job，跑不过几秒，没有可测量的
          # 稳态；命名空间 LimitRange 的默认值是"容器不声明 resource 时按什么
          # 算"，这一格正是它管的形状。这里再写一份只会是一个没人读的硬编码。
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: cogneva-db-role-bootstrap
{{- end }}
