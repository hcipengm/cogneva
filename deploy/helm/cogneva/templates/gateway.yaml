apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # 网关验签后的 webhook 转发入口（cogneva.json github_integration.webhook.port）
            - name: webhook
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # LLM 与代码平台凭证只注入安全网关，主应用零持有、经网关代理访问。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            # Redis 认证：cogneva.json 的 dag_executor.redis_url 经 ${REDIS_PASSWORD} 插值
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
            # GitHub/Gitee API 与 git 传输走安全网关透传（凭证网关注入，本 Pod 零 token）。
            # 缺这三个 env 时 Provider 直连公网平台——集群仅网关在 egress 白名单内，直连必败。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # webhook 验签在安全网关完成，本进程只验网关转发的内部 HMAC；
            # 未配置时事件入口不启动（fail-closed）。
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # 贡献通道 OAuth 应用身份（client_id/secret 随 chart 公开分发，是应用
            # 标识而非用户凭证；用户 token 仍只进安全网关）。贡献通道管理端点与
            # token 续期跑在本进程，env 必须挂在这里。
            {{- with .Values.contribution.githubOauthClientId }}
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.contribution.giteeOauthClientId }}
            - name: COGNEVA_GITEE_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.contribution.giteeOauthClientSecret }}
            - name: COGNEVA_GITEE_OAUTH_CLIENT_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.contribution.giteeOauthRedirectUri }}
            - name: COGNEVA_GITEE_OAUTH_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            # GitOps 拉取端：poll 中央 bare 仓库（挂入 /host-git）的 evolution-release
            # 分支，L0 配置热更 / L1 金丝雀在本集群闭环。kubectl 不可用时关闭，避免空转报错。
            - name: COGNEVA_GITOPS_ENABLED
              value: {{ if .Values.gitops.kubectlBin.enabled }}"true"{{ else }}"false"{{ end }}
            - name: COGNEVA_GITOPS_REPO_URL
              value: "/host-git"
            - name: COGNEVA_CLUSTER_NAME
              value: {{ .Values.gitops.clusterName | quote }}
            - name: COGNEVA_GITOPS_METRICS_URL
              value: "http://localhost:8080/metrics"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            # GitOps 中央 bare 仓库（与进化部署同一 git-remote 卷）。主 Pod 只读
            # 克隆/fetch，沙盒推送端读写。
            - name: git-remote
              mountPath: /host-git
              readOnly: true
            {{- if .Values.gitops.kubectlBin.enabled }}
            # 拉取端的 kubectl：K3s 是多调用二进制，argv[0]=kubectl 时就是 kubectl，
            # 版本与集群天然一致，零下载。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: prompts
          configMap:
            name: cogneva-prompts
            # 空白机首启时 GitOps 拉取端尚未建过该 configmap，置可选避免卡 FailedMount
            optional: true
        - name: git-remote
          {{- if eq .Values.evolution.gitRemote.mode "pvc" }}
          # 多节点/生产：hostPath 只存在于单个节点，必须走集群卷
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
          {{- else }}
          hostPath:
            path: {{ .Values.evolution.gitRemote.hostPath }}
            type: Directory
          {{- end }}
        {{- if .Values.gitops.kubectlBin.enabled }}
        - name: kubectl-bin
          hostPath:
            path: {{ .Values.gitops.kubectlBin.hostPath }}
            type: File
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: webhook
      port: 9091
      targetPort: 9091
      protocol: TCP
