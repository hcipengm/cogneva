apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  # No surge: every profile runs a single replica on a single node, so a surging
  # pod has nowhere to be scheduled and the rollout times out. Terminating the
  # old pod first frees its request, at the cost of a brief restart window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # 网关验签后的 webhook 转发入口（cogneva.json github_integration.webhook.port）
            - name: webhook
              containerPort: 9091
              protocol: TCP
            # 零凭证的集群内面（cogneva.json gateway.internal_port）：只挂 memory 的
            # 归档写与 Raw 读。跑 squad 的 Pod 手里没有凭证，主 API 上那几条按角色判
            # 它永远进不来，所以这几条另挂一个端口，判据交给网络策略。
            - name: internal
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # LLM 与代码平台凭证只注入安全网关，主应用零持有、经网关代理访问。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            # Redis 认证：cogneva.json 的 dag_executor.redis_url 经 ${REDIS_PASSWORD} 插值
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
            # 本部署的名字：样本日志的容量与容量判定是**每个部署自己的声明**，
            # 而它们落在共用表里。不署名时读到的是「最后写的那家」——置 0（不清理）
            # 的部署照样报出旁边那家声明的数。取部署名而不是 Pod 名：gauge 每个
            # series 的最新一行永不回收，随滚动变化的名字等于每次滚动多一行永久地板。
            # 也不能取 Pod 标签 `app.kubernetes.io/name`：那是**应用**名，本集群上
            # 它这一个是七个工作负载共用的（安全网关、cluster-registry、沙箱执行器、
            # buildah、backup、mainline Job），拿它当部署名时那道「别家不许顶这一家
            # 的声明」的闸对它们全失效。这里的字面量必须等于本文件的 metadata.name
            # （判据 deploy/scripts/check-deployment-name-wiring.sh）。
            - name: COGNEVA_DEPLOYMENT_NAME
              value: cogneva
            # 告警邮件出口的 SMTP 口令：凭证不进清单也不进 values，只认这个
            # Secret 键，缺省即不做鉴权。键由集群侧写入（与可观测栈安装脚本写
            # clickhouse-password 同形）。
            - name: COGNEVA_ALERTMANAGER_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: smtp-password
                  optional: true
            # GitHub/Gitee API 与 git 传输走安全网关透传（凭证网关注入，本 Pod 零 token）。
            # 缺这三个 env 时 Provider 直连公网平台——集群仅网关在 egress 白名单内，直连必败。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            # 通知机器人签名借用面：机器人报文要签名时向安全网关借一对
            # (timestamp, sign)，平台密钥不出网关。未配置＝这个部署不签名。
            - name: COGNEVA_NOTIFICATION_SIGN_BASE
              value: "http://cogneva-security-gateway:8081"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # 内存 Raw 层的面：工具的返回点把装不进上下文窗口的输出归档到这里，
            # 取引用也从这里读回（零凭证、落默认命名空间）。本进程自己那一份走
            # **回环**进内部端口，不是主 API 的 8080——8080 上那几条 memory 路由按
            # 角色判，零凭证的调用方恒吃 401。不经安全网关：那一面只代持外网凭证，
            # 与本调用无关。缺这个值＝归档未配置，截断的尾巴无处可存，读数里带
            # unconfigured 的原因。
            - name: COGNEVA_MEMORY_API_BASE
              value: "http://127.0.0.1:8085"
            # git 身份自举的基线仓库（owner/name）。自举循环跑在**本进程**：
            # cogneva-secrets 的属主就是这里（WebUI 向导与贡献通道写同一份），
            # 而自举要的正是属主手里的三样东西——Secret 读写、到 GitHub 的
            # egress、以及滚安全网关的权限。少了这个值自举只剩"生成公钥挂到
            # WebUI"那一半，自动登记这一支永远不触发（值本身是共享的，见
            # values.yaml 的 gitIdentity）。业务调用仍零持有，经网关代理。
            - name: COGNEVA_GATEWAY_GIT_IDENTITY_REPO
              value: {{ .Values.gitIdentity.repo | quote }}
            # webhook 验签在安全网关完成，本进程只验网关转发的内部 HMAC；
            # 未配置时事件入口不启动（fail-closed）。
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # JWT 签名密钥：安装时随机生成（init-secrets.sh / chart lookup）。
            # 缺失时进程生成一次性随机密钥，重启即全员登出，不会被已知弱密钥伪造。
            - name: COGNEVA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: jwt-secret
                  optional: true
            # 实例身份指纹：身份的规范来源，安装期生成。缺省时进程回退到状态
            # 文件 / 机器指纹推导（单机场景行为不变）。
            - name: COGNEVA_INSTANCE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: instance-fingerprint
                  optional: true
            # wiki 检索后端（Meilisearch）主密钥：cogneva.json 的
            # providers.wiki.options.api_key 经 ${MEILI_MASTER_KEY} 插值。必填——
            # /health 不鉴权，密钥错误只会在真正读写索引时才暴露，留空会把问题
            # 推迟到运行期，不如让 Pod 起不来。
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: meili-master-key
            # 对象存储凭证：cogneva.json 的 providers.storage.options 经
            # ${S3_ACCESS_KEY} / ${S3_SECRET_KEY} 插值。必填——留空则后端拿空
            # 密钥签名，所有对象读写都是 403，且要到第一次写记忆才暴露。
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-secret-key
            # 贡献通道：GitHub 设备流只用公开的 client_id（本流程无 client_secret）。
            # Gitee 授权码流程的应用凭证由安全网关代持，本进程经
            # COGNEVA_OAUTH_GATEWAY_URL 借用（授权 URL 与授权码兑换都在网关侧），
            # 本 Pod 零持有 client_secret。
            {{- with .Values.contribution.githubOauthClientId }}
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: COGNEVA_OAUTH_GATEWAY_URL
              value: "http://cogneva-security-gateway:8081"
            {{- with .Values.contribution.giteeOauthRedirectUri }}
            - name: COGNEVA_GITEE_OAUTH_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            # GitOps 拉取端：poll 中央 bare 仓库（挂入 /host-git）的 evolution-release
            # 分支，L0 配置热更 / L1 金丝雀在本集群闭环。kubectl 不可用时关闭，避免空转报错。
            - name: COGNEVA_GITOPS_ENABLED
              value: {{ if .Values.gitops.kubectlBin.enabled }}"true"{{ else }}"false"{{ end }}
            - name: COGNEVA_GITOPS_REPO_URL
              value: "/host-git"
            - name: COGNEVA_CLUSTER_NAME
              value: {{ .Values.gitops.clusterName | quote }}
            - name: COGNEVA_GITOPS_METRICS_URL
              value: "http://localhost:8080/metrics"
            # 数据卷占用只由写它的进程量得出来：目录型卷的"容量"是整个节点文件系统，
            # 声明量与实际占用之间没有任何东西对账。进程知道自己写哪个目录、不知道
            # 目录背后是哪张 PVC，所以由部署侧指名（与上面挂载的 claimName 同一个）。
            - name: COGNEVA_DATA_VOLUME_CLAIM
              value: "cogneva-data-pvc"
            # 主应用是控制面，不是变更执行器：基础 cogneva.json 对全部 Pod 打开
            # self_evolution.enabled，若不在这里关掉执行器，本 Pod 会每轮跑进化
            # 循环 / 基线移植，与专用进化 worker 抢同一实例指纹、裸仓库与工作树
            # 根目录（"missing but already registered worktree" 永久失败）。置
            # false 后本 Pod 仍发布 admin 服务、仍跑上面这条集群侧 GitOps 拉取端。
            - name: COGNEVA_SELF_EVOLUTION_EXECUTOR_ENABLED
              value: "false"
            {{- if .Values.modelWeights.enabled }}
            # 本地模型权重：目录本身就是下面挂进来的那个只读卷，值取自同一个
            # values 键，所以不会出现"挂了卷却还在别处找"或"要找却没有卷"。
            # 开关与卷同时成立：只挂不打开等于白挂，只打开不挂会让加载器读不到
            # 权重而静默退回网络。嵌入开启后 dense 与 sparse 两个 session 都建
            # 起来，也就是混合检索的两半。
            # 这个 Pod **不能设 HF_HOME**：fastembed 的 hub 客户端优先它，设了就把
            # 权重目录带偏到别处，而失败读起来像"权重目录坏"，真因在环境里。
            - name: FASTEMBED_CACHE_DIR
              value: {{ .Values.modelWeights.hostPath | quote }}
            - name: COGNEVA_MEMORY_LOAD_EMBEDDING_MODEL
              value: "true"
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            # 应用数据落持久卷：identity.json 决定实例名，丢了就会随机器指纹重算，
            # 按实例命名的资源逐次遗留；数仓 / 策略 / 记忆 / 原始日志同在此目录。
            - name: app-data
              mountPath: /var/lib/cogneva-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            # GitOps 中央 bare 仓库（与进化部署同一 git-remote 卷）。主 Pod 只读
            # 克隆/fetch，沙盒推送端读写。
            - name: git-remote
              mountPath: /host-git
              readOnly: true
            {{- if .Values.gitops.kubectlBin.enabled }}
            # 拉取端的 kubectl：K3s 是多调用二进制，argv[0]=kubectl 时就是 kubectl，
            # 版本与集群天然一致，零下载。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
            {{- end }}
            {{- if .Values.modelWeights.enabled }}
            # 权重只读：写出缓存目录的活由 deploy/scripts/fetch-model-weights.sh 在
            # 宿主上做，Pod 里没有任何东西需要写它。
            - name: model-weights
              mountPath: {{ .Values.modelWeights.hostPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: app-data
          persistentVolumeClaim:
            claimName: cogneva-data-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
        - name: prompts
          configMap:
            name: cogneva-prompts
            # 空白机首启时 GitOps 拉取端尚未建过该 configmap，置可选避免卡 FailedMount
            optional: true
        - name: git-remote
          {{- if eq .Values.evolution.gitRemote.mode "pvc" }}
          # 多节点/生产：hostPath 只存在于单个节点，必须走集群卷
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
          {{- else }}
          hostPath:
            path: {{ .Values.evolution.gitRemote.hostPath }}
            type: Directory
          {{- end }}
        {{- if .Values.gitops.kubectlBin.enabled }}
        - name: kubectl-bin
          hostPath:
            path: {{ .Values.gitops.kubectlBin.hostPath }}
            type: File
        {{- end }}
        {{- if .Values.modelWeights.enabled }}
        # type: Directory（不是 DirectoryOrCreate）：权重没落下时这里要**挂不上**，
        # 而不是给它一个空目录。空目录的后果是加载器静默退回网络、在连不上 hub 的
        # 集群里把 init 挂死——一个 Pod 起不来的 FailedMount 比那个好读得多。
        - name: model-weights
          hostPath:
            path: {{ .Values.modelWeights.hostPath }}
            type: Directory
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-data-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-data
  annotations:
    # 卸载不销毁数据卷：主应用的数据目录（身份、记忆、数仓、原始日志）在这里，
    # 删掉就等于丢实例。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.appData.storage }}
  {{- with .Values.appData.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: webhook
      port: 9091
      targetPort: 9091
      protocol: TCP
    # 零凭证的集群内面：只开给本命名空间里的工作负载（谁可连接见 network-policy
    # 里挂在主应用 Pod 上的 ingress 规则）。
    - name: internal
      port: 8085
      targetPort: internal
      protocol: TCP
