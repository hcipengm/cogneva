{{- if .Values.clusterRegistry.enabled }}
# 集群内镜像仓库：GitOps L1 金丝雀镜像的秒级分发通道。
# publisher（进化 Pod）把 overlay 镜像（cogneva 基镜像 + 新二进制一个层）
# 经集群 DNS push 到本 Service:5000（http，insecure）；节点 kubelet/containerd
# 经 NodePort 以 localhost:<nodePort> pull——containerd 对 localhost 默认走
# http 免 TLS，且每个节点的 NodePort 都由 kube-proxy 转发到本 Pod，
# 单/多节点通吃，无需任何节点 registry 信任配置。
# 存储跟随默认 StorageClass；基镜像层按 digest 去重，每次晋级只增一个二进制层。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.clusterRegistry.claimName }}
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-registry
  annotations:
    # 卸载不销毁数据卷：重装要接着用同一份状态（已分发的镜像层、身份、记忆、
    # 数仓、裸仓库），删掉就等于丢实例。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.clusterRegistry.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-registry
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: cluster-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: cluster-registry
    spec:
      containers:
        - name: registry
          image: {{ .Values.clusterRegistry.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: {{ .Values.clusterRegistry.rootDir }}
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v2/
              port: registry
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            {{- toYaml .Values.clusterRegistry.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.clusterRegistry.rootDir }}
        # 只读走查这张卷的边车。它存在的理由只有一条：这张卷的写者是一个第三方
        # registry 进程，它不发布任何指标，也没有我们自己的进程在这个 Pod 里量
        # 挂载——而占满这张卷的是盘上全部字节，registry 的 API 报的是"活 tag 引用
        # 的层"，孤儿层它看不见（实测同一时刻 3.74GiB vs 7.4GiB）。盘上那份是声明
        # 量要比的量，只能由挂载着这张卷的进程走查出来。
        - name: volume-walker
          image: {{ include "cogneva.image" . }}
          # 这里不用 .Values.image.pullPolicy（浮动签取 Always）：本 Pod 的另一个
          # 容器就是那个 registry，Always 等于让这个 Pod 起来之前先向自己拉镜像
          # ——Recreate 时旧 Pod 已删，拉取必然失败，Pod 永远起不来，整条镜像分发
          # 通道跟着断。节点缓存由分发面保证（元启动播种 + 每节点 importer），而
          # 这份清单只会由正在运行新 rev 的进化 Pod 应用，那一刻节点已持有该镜像。
          imagePullPolicy: IfNotPresent
          env:
            # 声明照卷族既有格式写（`claim=路径`），量出来的数就挂在同名卷上，
            # 与其它工作负载自量挂载产出的是同一条序列。
            - name: COGNEVA_DATA_VOLUME_MOUNTS
              value: "{{ .Values.clusterRegistry.claimName }}={{ .Values.clusterRegistry.rootDir }}"
            - name: COGNEVA_VOLUME_WALKER_PORT
              value: "{{ .Values.clusterRegistry.walkerPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.clusterRegistry.walkerPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            {{- toYaml .Values.clusterRegistry.walkerResources | nindent 12 }}
          volumeMounts:
            # 只读：走查不需要写权，挂成只读让"量一下"这件事不可能改到 store。
            - name: data
              mountPath: {{ .Values.clusterRegistry.rootDir }}
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.clusterRegistry.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-registry
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-registry
spec:
  type: NodePort
  # 端点不看就绪：这个 Service 分发的是节点要拉取的镜像，而 Pod 的就绪还取决于
  # 走查边车那个容器。边车要跑的是"带 volume-walker 子命令的二进制"，而清单可能
  # 先于节点缓存到达（部署器先推进裸仓、再滚四部署，GitOps 拉取端在这中间就会
  # apply 本文件），此刻它只能拿到旧二进制、起来就退，Pod 因此 NotReady——没有
  # 端点，节点拉不到新层，而新层正是让边车能起来的那份，分发通道被自己的边缘
  # 卡死。放开这一个字段，边车起不来只是"读数暂时没有"：registry 照常服务，
  # 节点缓存被 importer 推进后，边车下一次重试就拿到新二进制。就绪与否仍照常
  # 记在 Deployment 上，容器在 CrashLoop，问题没有被藏起来。
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: cluster-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: {{ .Values.clusterRegistry.nodePort }}
      protocol: TCP
    # 监控抓取面。端点名 `http` 就是发现规则：ServiceMonitor 按端口名选端点，
    # 换个名字等于这条抓取配置不存在，而"没有告警"和"没人在抓"在这里长得一样。
    - name: http
      port: {{ .Values.clusterRegistry.walkerPort }}
      targetPort: http
      protocol: TCP
{{- end }}
