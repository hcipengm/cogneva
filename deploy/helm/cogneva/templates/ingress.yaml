{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
  {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: "{{ include "cogneva.namespace" . }}-websocket-headers@kubernetescrd"
  {{- else }}
    # nginx 原生支持 WebSocket Upgrade，加长读写超时避免长连接被掐断
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cogneva
                port:
                  number: 8080
{{- if eq .Values.ingress.className "traefik" }}
---
# traefik 专用：WebSocket/帧头与安全响应头。nginx ingress 原生支持
# WebSocket，无此 CRD，不输出（目标集群无 traefik CRD 时 apply 会报错）。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: websocket-headers
  namespace: {{ include "cogneva.namespace" . }}
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
{{- end }}
{{- end }}
