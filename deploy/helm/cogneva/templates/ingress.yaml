{{- if .Values.ingress.enabled }}
{{- /* WebSocket 中间件的名字只在这里写一遍，但它有两种写法：对象叫 `websocket-headers`，
       注解里引用它必须写成 `<namespace>-<name>@kubernetescrd`——traefik 的 CRD provider
       按「命名空间-名字」登记每个中间件，只写名字的引用解析不到。2026-10-29 实测：
       注解写成 `websocket-headers@kubernetescrd` 时 traefik 丢弃整条路由、整站 404
       （不是只少一层响应头），写成 `cogneva-websocket-headers@kubernetescrd` 才路由。
       两种写法由一个变量派生，分两处写就会漂。 */}}
{{- $middleware := "websocket-headers" }}
{{- $middlewareRef := printf "%s-%s" (include "cogneva.namespace" .) $middleware }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cogneva
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
  {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: "{{ $middlewareRef }}@kubernetescrd"
  {{- else }}
    # nginx 原生支持 WebSocket Upgrade，加长读写超时避免长连接被掐断
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyTimeoutSecs | int | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.proxyTimeoutSecs | int | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cogneva
                port:
                  number: {{ .Values.gateway.httpPort }}
{{- if eq .Values.ingress.className "traefik" }}
---
# traefik 专用：WebSocket/帧头与安全响应头。nginx ingress 原生支持
# WebSocket，无此 CRD，不输出（目标集群无 traefik CRD 时 apply 会报错）。
# 不碰 X-Forwarded-Proto：这条路由的 entrypoint 是 web（明文），traefik 自己按
# 实际连接写的才是真值；写死 https 会让应用把明文请求当成 TLS 终止过的，凡是按
# 它拼绝对地址的面（A2A 名片的 `url`）都会给对端一个拨不到的地址。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $middleware }}
  namespace: {{ include "cogneva.namespace" . }}
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
{{- end }}
{{- end }}
