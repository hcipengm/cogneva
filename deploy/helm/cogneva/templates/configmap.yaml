apiVersion: v1
kind: ConfigMap
metadata:
  name: cogneva-config
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  COGNEVA_APP_NAME: "cogneva"
  COGNEVA_APP_VERSION: {{ .Chart.AppVersion | quote }}
  COGNEVA_LOG_LEVEL: "info"
  COGNEVA_DATA_DIR: "/var/lib/cogneva-data"
  COGNEVA_CONFIG_DIR: "/etc/cogneva"
  COGNEVA_APP_DIR: "/opt/cogneva"
  # WebUI 静态资源目录（镜像内 web 构建产物位置），不设会回退到构建机源码路径
  COGNEVA_WEB_DIR: "/opt/cogneva/web"

  COGNEVA_DB_PROVIDER: "mysql"
  COGNEVA_PG_PROVIDER: "postgres"
  COGNEVA_VECTOR_PROVIDER: "qdrant"
  QDRANT_URL: "http://qdrant.{{ include "cogneva.namespace" . }}.svc.cluster.local:6334"
  COGNEVA_MEDIA_PROVIDER: "local-sfu"
  COGNEVA_STORAGE_PROVIDER: "local-fs"

  COGNEVA_WORKSPACE_ID: "default"
  COGNEVA_CONSUMER_GROUP: "cogneva"

  COGNEVA_HTTP_PORT: "8080"
  COGNEVA_WS_PORT: "8081"
  COGNEVA_METRICS_PORT: "9090"

  # 告警通知出口地址。出口机制四类 dispatcher 都在代码里，缺的只是地址；空值
  # 不建出口（与 cogneva.json 的 null 等价）。地址只由集群侧 values / --set 给，
  # 所以这里渲染成空串而不是省略——省略会让"这份清单里没有这个键"与"运维没配"
  # 变成同一件事。主应用与进化 Pod 都经 envFrom 取这一份。
  COGNEVA_NOTIFICATION_WEBHOOK_URL: {{ .Values.notification.webhookUrl | quote }}

  # 平台机器人地址。四个出口在代码里都能挂上，但在此之前只有通用 webhook 有一条
  # 配置路径——另外三个「永远挂不上」的那种坏法没有任何读数：插件只会报「没有出口」，
  # 而这是运维没配地址的合法状态。地址一律渲染成空串而不是省略，理由同上。
  COGNEVA_NOTIFICATION_DINGTALK_URL: {{ .Values.notification.dingtalkUrl | quote }}
  COGNEVA_NOTIFICATION_FEISHU_URL: {{ .Values.notification.feishuUrl | quote }}
  COGNEVA_NOTIFICATION_WECHAT_WORK_URL: {{ .Values.notification.wechatWorkUrl | quote }}

  # 告警出口地址（Alertmanager 接收端 / 邮件 / Slack）。三类 dispatcher 都在
  # cog-observability 里，缺的一直只是地址——地址就是开关，空串 = 不建出口。
  # 中继口令不在这份清单里：它是凭证，由 Pod 侧那条 secretKeyRef 注入（见
  # gateway.yaml / evolution.yaml），清单只送非凭证的那些键。
  COGNEVA_ALERTMANAGER_WEBHOOK_URL: {{ .Values.alertmanager.webhookUrl | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_RECIPIENTS: {{ .Values.alertmanager.email.recipients | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_HOST: {{ .Values.alertmanager.email.smtpHost | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_PORT: {{ .Values.alertmanager.email.smtpPort | int | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_SMTP_USERNAME: {{ .Values.alertmanager.email.smtpUsername | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_FROM: {{ .Values.alertmanager.email.fromAddress | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_USE_TLS: {{ .Values.alertmanager.email.useTls | quote }}
  COGNEVA_ALERTMANAGER_EMAIL_SUBJECT_TEMPLATE: {{ .Values.alertmanager.email.subjectTemplate | quote }}
  COGNEVA_ALERTMANAGER_SLACK_WEBHOOK_URL: {{ .Values.alertmanager.slack.webhookUrl | quote }}
  COGNEVA_ALERTMANAGER_SLACK_CHANNEL: {{ .Values.alertmanager.slack.channel | quote }}

  # raw_logger 段不在这里覆盖：与下面的 memory 段同理，同一件事在文件里写一份、
  # 在 env 里再写一份，读文件的人推不出 runtime 用的是哪份——文件里曾写着
  # enabled=false 与一个打不开的目录，实跑却是 true 与 raw-logs。要改改文件。

  # memory 段不在这里覆盖：cog-memory 自读 cogneva.json 的 memory 段，
  # 这里再写一份就会与文件打架（曾经写死 enabled=false 把文件里的 true 顶掉，
  # 记忆不发布，反射插件的严格门随即拒绝启动）。要改记忆配置改文件。
