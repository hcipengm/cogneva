{{- if .Values.securityGateway.enabled }}
# 独立安全网关：代持全部敏感凭证（LLM API Key 等），沙盒 Pod 零凭证。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  replicas: {{ .Values.securityGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      containers:
        - name: security-gateway
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # 网关代持全部敏感凭证：LLM 上游唯一来源 COGNEVA_LLM_UPSTREAMS
            # （JSON 数组，llm-config 管理）；GitHub/Gitee token 用于 API 与
            # git 透传出口注入；webhook 凭证验平台签名。业务 Pod 零持有。
            # 均 optional：未配置时对应功能 fail-closed，真值带外写入 Secret。
            - name: COGNEVA_LLM_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-upstreams
                  optional: true
            - name: COGNEVA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            - name: COGNEVA_GITEE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-token
                  optional: true
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            - name: COGNEVA_GITEE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-webhook-token
                  optional: true
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            {{- with .Values.contribution.githubOauthClientId }}
            # 贡献通道 GitHub OAuth 设备流 client_id（公开标识，非密钥）；
            # 留空时向导设备流不可用、自动回退手动 PAT。
            - name: COGNEVA_GITHUB_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
  ports:
    - name: egress-proxy
      port: 8080
      targetPort: egress-proxy
      protocol: TCP
    - name: llm-proxy
      port: 8081
      targetPort: llm-proxy
      protocol: TCP
{{- end }}
