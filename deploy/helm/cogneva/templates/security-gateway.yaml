{{- if .Values.securityGateway.enabled }}
# 独立安全网关：代持全部敏感凭证（LLM API Key 等），沙盒 Pod 零凭证。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  replicas: {{ .Values.securityGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      containers:
        - name: security-gateway
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: anthropic-api-key
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
  ports:
    - name: egress-proxy
      port: 8080
      targetPort: egress-proxy
      protocol: TCP
    - name: llm-proxy
      port: 8081
      targetPort: llm-proxy
      protocol: TCP
{{- end }}
