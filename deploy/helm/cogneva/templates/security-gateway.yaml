{{- if .Values.securityGateway.enabled }}
# 独立安全网关：代持全部敏感凭证（LLM API Key 等），沙盒 Pod 零凭证。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  replicas: {{ .Values.securityGateway.replicas }}
  # No surge: every profile runs a single replica on a single node, so a surging
  # pod has nowhere to be scheduled and the rollout times out. Terminating the
  # old pod first frees its request, at the cost of a brief restart window.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: security-gateway
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      containers:
        - name: security-gateway
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/cogneva/cogneva"]
          args: ["security-gateway"]
          ports:
            - name: egress-proxy
              containerPort: 8080
              protocol: TCP
            - name: llm-proxy
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.securityGateway.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # 网关代持全部敏感凭证：LLM 上游唯一来源 COGNEVA_LLM_UPSTREAMS
            # （JSON 数组，llm-config 管理）；GitHub/Gitee token 用于 API 与
            # git 透传出口注入；webhook 凭证验平台签名。业务 Pod 零持有。
            # 均 optional：未配置时对应功能 fail-closed，真值带外写入 Secret。
            - name: COGNEVA_LLM_UPSTREAMS
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-upstreams
                  optional: true
            - name: COGNEVA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            # GitHub App 凭证（可选，运营者配置）：齐备时 /github/* 出口以 App
            # bot 身份（installation token，自动轮换）发出；换取失败或未配置
            # 回退上面的静态 token。私钥仅注入网关，业务 Pod 零持有。
            - name: COGNEVA_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-id
                  optional: true
            - name: COGNEVA_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-installation-id
                  optional: true
            - name: COGNEVA_GITHUB_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-app-private-key
                  optional: true
            - name: COGNEVA_GITEE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-token
                  optional: true
            # git 传输的 SSH 兜底镜像（见 cog-gateway 的 git_mirror 模块）。
            # 私钥只注入本进程，是"业务 Pod 零凭证"在兜底通道上的延续：Pod 依然
            # 只会说 smart HTTP，SSH 只发生在网关到 GitHub 之间。
            # 路径写死在这里而不是 values：它同时是卷的挂载点，两处分开配就会漂移。
            - name: COGNEVA_GATEWAY_GIT_MIRROR_ROOT
              value: /var/lib/cogneva-git-mirror
            - name: COGNEVA_GATEWAY_GIT_MIRROR_ENABLED
              value: {{ .Values.securityGateway.gitMirror.enabled | quote }}
            - name: COGNEVA_GATEWAY_GIT_SSH_KEY
              value: /etc/cogneva/git-ssh/id_ed25519
            # 基线仓库（owner/name）：git 身份自举把公钥登记成它的部署密钥并自证，
            # 选路的实测也拿它当探测目标。空 = 不自动登记，只把公钥挂出来等人。
            - name: COGNEVA_GATEWAY_GIT_IDENTITY_REPO
              value: {{ .Values.securityGateway.gitMirror.identityRepo | quote }}
            # 部署期网络画像：restricted / open。空 = 由网关自己探（首个 git
            # 请求按开放网络的策略表走，实测结论落地后按证据走）。它只是首帧
            # 默认值，压不过实测结论。
            - name: COGNEVA_GATEWAY_NET_PROFILE
              value: {{ .Values.securityGateway.netProfile | quote }}
            # 贡献通道 Gitee OAuth 应用凭证：授权码兑换与 token 续期的唯一起点，
            # 只注入本进程，业务 Pod 零持有；缺失即授权码通道 fail-closed
            # （手动令牌/PAT 通道不受影响）。client_id 是 OAuth App 的公开标识，
            # 随 chart values 原样恢复，重装/换机不受影响；client_secret 相反——
            # 它是外面发的、只能由 Gitee 后台轮换的凭证，写进 values 就等于写进
            # 仓库（含历史），因此只从 cogneva-secrets 注入。
            {{- with .Values.contribution.giteeOauthClientId }}
            - name: COGNEVA_GITEE_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: COGNEVA_GITEE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-oauth-client-secret
                  optional: true
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
            - name: COGNEVA_GITEE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: gitee-webhook-token
                  optional: true
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
            # ── 上游池可观测与自愈落盘 ──
            # 告警状态机落 PG（重启可查历史），池状态跨进程信号走 Redis。
            # 复用集群内既有实例，凭证来自 cogneva-secrets（安装时随机生成）。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
            - name: COGNEVA_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-0.redis.{{ include "cogneva.namespace" . }}.svc.cluster.local:6379"
            # 日志→Loki、时序明细→ClickHouse、告警→Alertmanager；端点随观测栈，
            # 未启用时对应导出静默降级（池自愈主链不受影响）。
            - name: COGNEVA_LOKI_ENABLED
              value: {{ .Values.securityGateway.observability.loki.enabled | quote }}
            - name: COGNEVA_LOKI_ENDPOINT
              value: {{ .Values.securityGateway.observability.loki.endpoint | quote }}
            - name: COGNEVA_CLICKHOUSE_ENABLED
              value: {{ .Values.securityGateway.observability.clickhouse.enabled | quote }}
            - name: COGNEVA_CLICKHOUSE_BASE_URL
              value: {{ .Values.securityGateway.observability.clickhouse.baseUrl | quote }}
            - name: COGNEVA_CLICKHOUSE_DATABASE
              value: {{ .Values.securityGateway.observability.clickhouse.database | quote }}
            - name: COGNEVA_CLICKHOUSE_TABLE
              value: {{ .Values.securityGateway.observability.clickhouse.table | quote }}
            - name: COGNEVA_CLICKHOUSE_USERNAME
              value: {{ .Values.securityGateway.observability.clickhouse.username | quote }}
            # 密码由可观测栈安装时镜像写入（monitoring/clickhouse-credentials →
            # cogneva-secrets/clickhouse-password）；未部署时 optional 缺省即降级。
            - name: COGNEVA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: clickhouse-password
                  optional: true
            # 观测通道监听端口；与容器端口同源 values，避免两处漂移。
            - name: COGNEVA_SG_METRICS_PORT
              value: {{ .Values.securityGateway.metricsPort | quote }}
          # 探测挂在 8080：那是本进程唯一的常驻 HTTP 面（8081/8082 只在被调用时
          # 有动静），/health/live 与 /health/ready 由网关自己答，不对上游发请求。
          # 没有 liveness 时一个卡死的网关会一直被 Service 指向并持续吞掉全部
          # LLM 与 git 出口调用；没有 readiness 时新 Pod 未就绪就先接流量。
          livenessProbe:
            httpGet:
              path: /health/live
              port: egress-proxy
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: egress-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.securityGateway.resources | nindent 12 }}
          {{- if .Values.securityGateway.gitMirror.enabled }}
          volumeMounts:
            - name: git-mirror
              mountPath: /var/lib/cogneva-git-mirror
            # 私钥挂成固定文件名：git 读的是路径，不是 Secret 的键名。
            - name: git-ssh-key
              mountPath: /etc/cogneva/git-ssh
              readOnly: true
          {{- end }}
      {{- if .Values.securityGateway.gitMirror.enabled }}
      volumes:
        - name: git-mirror
          persistentVolumeClaim:
            claimName: cogneva-git-mirror-pvc
        # 整个卷 optional：没有私钥时 Pod 照常起来，网关自己检测到文件不存在
        # 就保持兜底关闭。若这里不 optional，一次"先部署后补凭证"会让网关
        # 卡在 ContainerCreating——而网关是全部出站调用的唯一出口。
        - name: git-ssh-key
          secret:
            secretName: cogneva-secrets
            optional: true
            # 0400：OpenSSH 只在**属主是自己**时才检查权限位。容器以 1001 运行、
            # 而 Secret 卷文件属主是 root（fsGroup 只加组读），所以这条检查会被
            # 跳过；但把权限收窄到最小仍然是对的——这个文件是账号级的写权限。
            #
            # Written as decimal 256, not as 0400. The rollout path parses every
            # manifest with a YAML 1.2 reader before re-emitting it, and 1.2
            # rejects the leading-zero octal form: "0400" comes back as the
            # string '0400', which the API server then refuses with
            # "unrecognized type: int32" — so the whole rollout dies on the
            # first target. Decimal is the only spelling both readers agree on
            # (here 256 == 0o400). Do not "tidy" this back to 0400.
            defaultMode: 256
            items:
              - key: git-ssh-private-key
                path: id_ed25519
      {{- end }}
      # 网关是唯一持有真凭证的进程：以非 root 运行、卷组固定，避免凭证文件
      # 落进 root 专属可读的目录。
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: security-gateway
  ports:
    - name: egress-proxy
      port: 8080
      targetPort: egress-proxy
      protocol: TCP
    - name: llm-proxy
      port: 8081
      targetPort: llm-proxy
      protocol: TCP
    - name: metrics
      port: {{ .Values.securityGateway.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.securityGateway.gitMirror.enabled }}
---
# SSH 兜底镜像的存储。刻意**不带** `helm.sh/resource-policy: keep`：这是本 chart
# 里唯一一个内容可以整个从外部真相源（GitHub）重建的卷，标了 keep 只会在反复
# 重装时堆出无主的陈旧镜像。它也不与 cogneva-git-remote-pvc 合并——裸仓是全部
# 进化分支与晋级产物的规范来源，镜像只是网关的一层传输缓存，二者可丢性不同。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-git-mirror-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.securityGateway.gitMirror.storage }}
{{- end }}
{{- end }}
