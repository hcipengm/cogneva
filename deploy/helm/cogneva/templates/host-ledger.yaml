{{- if .Values.hostLedger.enabled }}
---
# 宿主账本的拆解面：每节点一个只读进程，把宿主 cgroup v2 的三个 slice（user /
# system / kubepods）各按 anon / file 报出来。宿主的 slice 分解没有现成的数据源
# ——node_exporter 的 cgroups collector 是按 cgroup v1 写的，cadvisor 只走自己被
# root 住的那棵子树——而构建闸门的上限是从宿主全局读数导出的，没有分解就分不出
# 「这台机器自己忙」与「本平台填满了它」。
# 挂宿主 cgroup 根，只读。这不是特权面：memory.stat 是 0444，进程不需要 capability、
# 不需要 hostPID、不碰设备；只读挂载让"量一下"不可能改到宿主。type 用 Directory
# 而不是 DirectoryOrCreate——挂载点不存在说明这台宿主的布局不是我们认识的，造一个
# 空目录只会把"配置错了"变成"干净的空账本"。
# 这个 Pod 照样占命名空间的 ResourceQuota：DaemonSet 的 Pod 也是控制器经 apiserver 在
# 该命名空间里建的，配额里的 pods 计数包含它，配额满时新节点上的账本 Pod 会 Pending
# ——tolerations 挡不住这件事，而后果是那个节点静默地没有账本。三条路里选的是「接受
# 并让它被报出来」：不给它 priorityClassName（为了报一条读数去抢占工作负载，代价比
# 它大），配额按节点数推导属于配额面自己的事（见 values 里 hostLedger 上方的注解），
# 所以让 host_ledger_node_unreported 把「有节点、没账本」报出来——配额占满正是它会
# 报的原因之一，也是唯一不依赖值班的人想起来去看的那种兜底。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cogneva-host-ledger
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-ledger
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: host-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: host-ledger
        # Pod 模板上要有版本：`kubectl get pods -L app.kubernetes.io/version` 那一列
        # 只读这里。对象级的同名标签只到 DaemonSet 这一层，缺了它每个 Pod 那一格都是
        # 空的，而空格读作「这个 Pod 不归发布管」，与「它跑的是上一版」在屏上没有区别。
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        {{- /* lit: 65534 fixed — nobody: the host reader needs no privilege of its own */}}
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: host-ledger
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # 子命令是这里的全部内容：不带它，镜像入口跑的是完整应用，而这个 Pod 里
          # 没有 Redis 也没有配置面，进程在装配阶段就退——清单和二进制是两份可以
          # 分开到达的东西，所以"跑的是宿主账本模式"只能由命令行说出来。
          command: ["/opt/cogneva/cogneva"]
          args: ["host-ledger"]
          env:
            - name: COGNEVA_HOST_LEDGER_PORT
              value: {{ .Values.hostLedger.port | quote }}
            - name: COGNEVA_HOST_CGROUP_ROOT
              value: {{ .Values.hostLedger.mountPath | quote }}
            # 节点名从 fieldRef 取 spec.nodeName，由产出方自己盖成样本上的 `node`
            # 标签，不由抓取方推断：Prometheus 给每个 DaemonSet 目标打的是
            # instance=<PodIP>，重建即变、且与 node-exporter 的 instance=<nodeIP>
            # 对不上——所以「这台节点的宿主侧内存 ÷ 这台节点的 MemTotal」这个除法没有
            # 可用的标签；判词也就只能写成按节点分组，而不是到处求和。
            - name: COGNEVA_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: {{ .Values.hostLedger.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
            {{- toYaml .Values.hostLedger.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: host-cgroup
              mountPath: {{ .Values.hostLedger.mountPath | quote }}
              # 只读：读数不需要写权，挂成只读让"量一下"这件事不可能改到宿主。
              readOnly: true
      volumes:
        - name: host-cgroup
          hostPath:
            path: {{ .Values.hostLedger.hostPath | quote }}
            type: Directory
      tolerations:
        - operator: Exists
---
# 抓取面：无头 Service（clusterIP: None），每个节点的 Pod 各自成为一个抓取目标。
# 端点名 `http` 就是发现规则：ServiceMonitor 按端口名挑端点，换个名字等于这条抓取
# 配置不存在，而"没有告警"和"没人在抓"在这里长得一样。
apiVersion: v1
kind: Service
metadata:
  name: cogneva-host-ledger
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-ledger
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: host-ledger
  ports:
    - name: http
      port: {{ .Values.hostLedger.port }}
      targetPort: http
      protocol: TCP
{{- end }}
