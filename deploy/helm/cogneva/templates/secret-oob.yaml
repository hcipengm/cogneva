{{- if .Values.secrets.create }}
{{- /*
带外（oob = out-of-band）凭证：只被安全网关读的键。

它单独成一个对象的理由不是分类好看，是权限面：内部实例密钥那一份是**整对象**
get（主应用的 Role 就写在这一对象上），而业务 Pod 拿到的每一个键都等于把那一份的
读取面又铺开一层。把只该由网关读的键留在那里，主应用与进化 Pod 就都读得到——它们
各自只声明了自己需要的 env，但对象级的 get 不看声明。分出来之后，这一份的读取者
按设计只有网关（env secretKeyRef 与卷 items 都是按键读）与备份 Job（整体导出，见
backup）；**写者今天仍是主应用**，所以它的 Role 暂时也挂在两个对象上——那是把键搬运
过来所必需的，逐键看授权集合与切分前完全一样，没有任何一个键被铺给新的读者。

**切分判据是读者面，不是「像不像凭证」**：只被安全网关读的键进这一份；被任何业务
Pod 读的键留在 cogneva-secrets。判据只认这一条时，边界是机械的——两边的读者集合与
切分前逐键相同，既没把业务 Pod 要读的键推给它读不到的地方，也没把网关独占的键散给
主应用。（`smtp-password` 因此留在内部份：主应用与进化 Pod 都在读它。`clickhouse-
password` 因此进这一份：今天只有网关读它，放进内部份才是扩张。）

解析顺序与内部份同形：values 显式提供 → 本对象已存在该键（upgrade 不变）→ 旧对象
cogneva-secrets 里的同名键（切分当次的迁移桥，见 init-secrets.sh 的同一段）→ 空。
迁移桥必须留在读取路径里而不是只留在安装脚本里：`helm upgrade` 时本对象刚被创建，
值是空的，而旧对象里那份真值还等着被搬过来；少了这一跳，向导发过的 token 会在升级
当场变成空字符串，功能静默 fail-closed，哪一层都不报错。

**这张模板要覆盖 init-secrets.sh 的整张带外键表，不是只覆盖向导写的那几个。** 后面
那批（GitHub App 三件套 / git 身份私钥与候选私钥 / Gitee refresh token / ClickHouse
口令）的写者不是向导，是运行期自己（自举写身份私钥、续期写 refresh token）或另一个
安装器（ClickHouse 口令按服务端真值写）；它们今天大多只躺在旧对象里，升级时同样等着
被搬过来——漏在模板外的键，值不会被搬、也不会报错，网关那边就是一个空字符串。
*/}}
{{- $oob := lookup "v1" "Secret" .Release.Namespace "cogneva-secrets-oob" }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "cogneva-secrets" }}
{{- $llmUpstreams := .Values.secrets.llmUpstreams }}
{{- if not $llmUpstreams }}
  {{- if and $oob $oob.data (index $oob.data "llm-upstreams") }}{{ $llmUpstreams = index $oob.data "llm-upstreams" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "llm-upstreams") }}{{ $llmUpstreams = index $legacy.data "llm-upstreams" | b64dec }}{{ end }}
{{- end }}
{{- $llmPoolMinHealthy := .Values.secrets.llmPoolMinHealthy }}
{{- if not $llmPoolMinHealthy }}
  {{- if and $oob $oob.data (index $oob.data "llm-pool-min-healthy") }}{{ $llmPoolMinHealthy = index $oob.data "llm-pool-min-healthy" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "llm-pool-min-healthy") }}{{ $llmPoolMinHealthy = index $legacy.data "llm-pool-min-healthy" | b64dec }}{{ end }}
{{- end }}
{{- $githubToken := .Values.secrets.githubToken }}
{{- if not $githubToken }}
  {{- if and $oob $oob.data (index $oob.data "github-token") }}{{ $githubToken = index $oob.data "github-token" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "github-token") }}{{ $githubToken = index $legacy.data "github-token" | b64dec }}{{ end }}
{{- end }}
{{- $giteeToken := .Values.secrets.giteeToken }}
{{- if not $giteeToken }}
  {{- if and $oob $oob.data (index $oob.data "gitee-token") }}{{ $giteeToken = index $oob.data "gitee-token" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "gitee-token") }}{{ $giteeToken = index $legacy.data "gitee-token" | b64dec }}{{ end }}
{{- end }}
{{- $githubWebhook := .Values.secrets.githubWebhookSecret }}
{{- if not $githubWebhook }}
  {{- if and $oob $oob.data (index $oob.data "github-webhook-secret") }}{{ $githubWebhook = index $oob.data "github-webhook-secret" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "github-webhook-secret") }}{{ $githubWebhook = index $legacy.data "github-webhook-secret" | b64dec }}{{ end }}
{{- end }}
{{- $giteeWebhook := .Values.secrets.giteeWebhookToken }}
{{- if not $giteeWebhook }}
  {{- if and $oob $oob.data (index $oob.data "gitee-webhook-token") }}{{ $giteeWebhook = index $oob.data "gitee-webhook-token" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "gitee-webhook-token") }}{{ $giteeWebhook = index $legacy.data "gitee-webhook-token" | b64dec }}{{ end }}
{{- end }}
{{- $giteeOauthSecret := .Values.secrets.giteeOauthClientSecret }}
{{- if not $giteeOauthSecret }}
  {{- if and $oob $oob.data (index $oob.data "gitee-oauth-client-secret") }}{{ $giteeOauthSecret = index $oob.data "gitee-oauth-client-secret" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "gitee-oauth-client-secret") }}{{ $giteeOauthSecret = index $legacy.data "gitee-oauth-client-secret" | b64dec }}{{ end }}
{{- end }}
{{- $githubOauthSecret := .Values.secrets.githubOauthClientSecret }}
{{- if not $githubOauthSecret }}
  {{- if and $oob $oob.data (index $oob.data "github-oauth-client-secret") }}{{ $githubOauthSecret = index $oob.data "github-oauth-client-secret" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "github-oauth-client-secret") }}{{ $githubOauthSecret = index $legacy.data "github-oauth-client-secret" | b64dec }}{{ end }}
{{- end }}
{{- $dingtalkSecret := .Values.secrets.notificationDingtalkSecret }}
{{- if not $dingtalkSecret }}
  {{- if and $oob $oob.data (index $oob.data "notification-dingtalk-secret") }}{{ $dingtalkSecret = index $oob.data "notification-dingtalk-secret" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "notification-dingtalk-secret") }}{{ $dingtalkSecret = index $legacy.data "notification-dingtalk-secret" | b64dec }}{{ end }}
{{- end }}
{{- $feishuSecret := .Values.secrets.notificationFeishuSecret }}
{{- if not $feishuSecret }}
  {{- if and $oob $oob.data (index $oob.data "notification-feishu-secret") }}{{ $feishuSecret = index $oob.data "notification-feishu-secret" | b64dec }}
  {{- else if and $legacy $legacy.data (index $legacy.data "notification-feishu-secret") }}{{ $feishuSecret = index $legacy.data "notification-feishu-secret" | b64dec }}{{ end }}
{{- end }}
{{- /*
其余带外键：写者不是向导，是运行期自己（自举写 git 身份私钥与候选私钥、续期写
Gitee refresh token）或另一个安装器（ClickHouse 口令按服务端真值写），因此没有
values 入口——真值只可能来自集群里那份对象。解析只在两处找（本对象 → 旧对象），
**找不到就整个键不写**：写一个空默认会把「解析没找到」与「本来就是空」压成同一个
结果，而这里前者会抹掉一份还在被读的真值（身份私钥、口令都在这一类里）；不写则
最坏只是维持现状——下一个写者（自举、向导、另一个安装器）照旧 patch 得进来。
init-secrets.sh 对同一批键是同一个形状：老安装里有就搬，没有就什么都不做。
*/}}
{{- $searchFallbackUpstreams := "" }}
{{- if and $oob $oob.data (index $oob.data "search-fallback-upstreams") }}{{ $searchFallbackUpstreams = index $oob.data "search-fallback-upstreams" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "search-fallback-upstreams") }}{{ $searchFallbackUpstreams = index $legacy.data "search-fallback-upstreams" | b64dec }}{{ end }}
{{- $githubAppId := "" }}
{{- if and $oob $oob.data (index $oob.data "github-app-id") }}{{ $githubAppId = index $oob.data "github-app-id" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "github-app-id") }}{{ $githubAppId = index $legacy.data "github-app-id" | b64dec }}{{ end }}
{{- $githubAppInstallationId := "" }}
{{- if and $oob $oob.data (index $oob.data "github-app-installation-id") }}{{ $githubAppInstallationId = index $oob.data "github-app-installation-id" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "github-app-installation-id") }}{{ $githubAppInstallationId = index $legacy.data "github-app-installation-id" | b64dec }}{{ end }}
{{- $githubAppPrivateKey := "" }}
{{- if and $oob $oob.data (index $oob.data "github-app-private-key") }}{{ $githubAppPrivateKey = index $oob.data "github-app-private-key" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "github-app-private-key") }}{{ $githubAppPrivateKey = index $legacy.data "github-app-private-key" | b64dec }}{{ end }}
{{- $gitSshPrivateKey := "" }}
{{- if and $oob $oob.data (index $oob.data "git-ssh-private-key") }}{{ $gitSshPrivateKey = index $oob.data "git-ssh-private-key" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "git-ssh-private-key") }}{{ $gitSshPrivateKey = index $legacy.data "git-ssh-private-key" | b64dec }}{{ end }}
{{- $gitSshPrivateKeyPending := "" }}
{{- if and $oob $oob.data (index $oob.data "git-ssh-private-key-pending") }}{{ $gitSshPrivateKeyPending = index $oob.data "git-ssh-private-key-pending" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "git-ssh-private-key-pending") }}{{ $gitSshPrivateKeyPending = index $legacy.data "git-ssh-private-key-pending" | b64dec }}{{ end }}
{{- $giteeRefreshToken := "" }}
{{- if and $oob $oob.data (index $oob.data "gitee-refresh-token") }}{{ $giteeRefreshToken = index $oob.data "gitee-refresh-token" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "gitee-refresh-token") }}{{ $giteeRefreshToken = index $legacy.data "gitee-refresh-token" | b64dec }}{{ end }}
{{- $clickhousePassword := "" }}
{{- if and $oob $oob.data (index $oob.data "clickhouse-password") }}{{ $clickhousePassword = index $oob.data "clickhouse-password" | b64dec }}
{{- else if and $legacy $legacy.data (index $legacy.data "clickhouse-password") }}{{ $clickhousePassword = index $legacy.data "clickhouse-password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets-oob
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-oob
  annotations:
    # 与内部份同命：卸载不销毁。平台 token、GitHub App 私钥、git 身份私钥都在这
    # 一份里，删掉等于把实例对外的身份全部作废，且都得回平台后台重新签发。
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # LLM 上游池（网关唯一 LLM 凭证来源）、代码平台 token、webhook 验签：
  # 真值带外写入（WebUI 向导，或 kubectl 兜底），入库即泄。默认空时对应功能
  # fail-closed。向导的写点今天落在主应用进程里，值经它一次；目标是写点搬进
  # 网关、由网关直接持有，那时这一份的写者与读者才是同一个。
  # readers: Deployment/cogneva-security-gateway — LLM 通道唯一配置来源
  llm-upstreams: {{ $llmUpstreams | quote }}
  # 池的冗余下限：与上游池同一次 llm-config 写入的第二个键。空串是它的合法取值
  # （未声明），所以这里与上游池同形——升级时按上面的保留规则先读回既有值，读不到
  # 才落空；否则一次 helm upgrade 会把运维声明过的下限抹掉，判定静默退回默认规则。
  # readers: Deployment/cogneva-security-gateway — 与上游池同一次写入的第二个键；只被网关读
  llm-pool-min-healthy: {{ $llmPoolMinHealthy | quote }}
  # readers: Deployment/cogneva-security-gateway — /github/* 出口注入
  github-token: {{ $githubToken | quote }}
  # readers: Deployment/cogneva-security-gateway — /gitee/* 出口注入
  gitee-token: {{ $giteeToken | quote }}
  # readers: Deployment/cogneva-security-gateway — 8082 验签
  github-webhook-secret: {{ $githubWebhook | quote }}
  # readers: Deployment/cogneva-security-gateway — 8082 验签
  gitee-webhook-token: {{ $giteeWebhook | quote }}
  # Gitee/GitHub OAuth App 密钥：向导写入，升级时按上面的保留规则续存。
  # readers: Deployment/cogneva-security-gateway — 授权码兑换只在网关进程内完成
  gitee-oauth-client-secret: {{ $giteeOauthSecret | quote }}
  # readers: Deployment/cogneva-security-gateway — 授权码兑换只在网关进程内完成
  github-oauth-client-secret: {{ $githubOauthSecret | quote }}
  # 通知机器人签名密钥（钉钉/飞书）：平台后台发给这个机器人的那把，只能在
  # 平台后台看到，因此带外写入；升级时按上面的保留规则续存。
  # readers: Deployment/cogneva-security-gateway — 出口签名（/v1/notification/sign）
  notification-dingtalk-secret: {{ $dingtalkSecret | quote }}
  # readers: Deployment/cogneva-security-gateway — 出口签名（/v1/notification/sign）
  notification-feishu-secret: {{ $feishuSecret | quote }}
  # 其余带外键：只在集群那份对象里解析到值时才写这个键，解析不到就整个键不写
  # （理由见上面同一批键的注释：空默认会抹掉还在被读的真值）。
{{- if $githubAppId }}
  # readers: Deployment/cogneva-security-gateway — App bot 身份，缺则回退静态 token
  github-app-id: {{ $githubAppId | quote }}
{{- end }}
{{- if $githubAppInstallationId }}
  # readers: Deployment/cogneva-security-gateway — App bot 身份，缺则回退静态 token
  github-app-installation-id: {{ $githubAppInstallationId | quote }}
{{- end }}
{{- if $githubAppPrivateKey }}
  # readers: Deployment/cogneva-security-gateway — App bot 身份，缺则回退静态 token
  github-app-private-key: {{ $githubAppPrivateKey | quote }}
{{- end }}
{{- if $gitSshPrivateKey }}
  # readers: Deployment/cogneva-security-gateway — SSH 兜底镜像，卷 items 映射成固定文件名
  git-ssh-private-key: {{ $gitSshPrivateKey | quote }}
{{- end }}
{{- if $gitSshPrivateKeyPending }}
  # readers: Deployment/cogneva-security-gateway (api: crates/cog-gateway/src/git_identity.rs) — 自举把新公钥对应的私钥先落到这个待生效键，登记成功后再转正
  git-ssh-private-key-pending: {{ $gitSshPrivateKeyPending | quote }}
{{- end }}
{{- if $giteeRefreshToken }}
  # readers: Deployment/cogneva-security-gateway (api: crates/cog-gateway/src/contribution_admin.rs) — 续期循环跟着 Secret 的读权搬进了网关进程
  gitee-refresh-token: {{ $giteeRefreshToken | quote }}
{{- end }}
{{- if $clickhousePassword }}
  # readers: Deployment/cogneva-security-gateway — 只此一处读；放带外份是为了不让持内部份的每个业务 Pod 都能整体 get
  clickhouse-password: {{ $clickhousePassword | quote }}
{{- end }}
{{- if $searchFallbackUpstreams }}
  # readers: Deployment/cogneva-security-gateway — 检索/抓取后备池整份注入，未配置即空池
  search-fallback-upstreams: {{ $searchFallbackUpstreams | quote }}
{{- end }}
{{- end }}
