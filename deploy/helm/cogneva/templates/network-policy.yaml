{{- if .Values.networkPolicy.enabled }}
# 沙盒网络隔离：evolution Pod 默认拒绝出站，放行安全网关、命名空间内数据面与集群 DNS。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-evolution-deny-egress
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: evolution
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # 命名空间内数据面放行：evolution worker 启动需 postgres 迁移（strict_persistence）、
    # NATS 消息、Redis 流、Qdrant 向量。"凭证不入沙盒"指 LLM/外网凭证必须经网关，
    # 数据面凭证本就以 Secret 注入 worker Pod，属于基础设施面。
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6333
        # Meilisearch（7700）：wiki 检索后端，进化 Pod 启动即健康检查该地址。
        - protocol: TCP
          port: 7700
        # 沙箱执行器（9090）：主应用与进化共用的零凭证工具执行面
        # （run_command/read_file/write_file），该 Pod 不持有任何 Secret。
        - protocol: TCP
          port: 9090
        # 主应用 HTTP 面（8080）：工具的返回点把「装不进上下文窗口」的输出
        # 归档到这里的内存 Raw 层，标记里带回取引用。这一步走本命名空间内的
        # 主应用 Service，不经安全网关（该面只代持外网凭证，与本调用无关），
        # 调用零凭证。少了这一条，归档请求被策略静默丢弃——读起来像归档失败，
        # 而失败面只有工具输出被砍掉的那一次才知道。
        - protocol: TCP
          port: 8080
        # 集群内镜像仓库（5000）：publisher push 金丝雀 overlay / 主线 overlay 镜像
        - protocol: TCP
          port: 5000
        # 同一张卷的走查读数（{{ .Values.clusterRegistry.walkerPort }}）：容量回收判的是
        # 盘上占用，而量这个数的是 registry Pod 里的边车。挡住它不等于"不回收"这一
        # 种退法——回收的判据是"没读到就不动"，读不到会让它变成永远不动的空转，
        # 而空转与"不需要回收"从外面看一样。
        - protocol: TCP
          port: {{ .Values.clusterRegistry.walkerPort }}
    {{- range $host, $allow := .Values.notification.egress }}
    # 告警通知出口 {{ $host }}：本 Pod 的 egress 是白名单，出口地址在集群外时须显式放行，
    # 否则通知被拦掉而 dispatch 只留下一行 warn——读起来像"没有告警"。一个宿主一条规则：
    # 同一条规则的 ports 对它的所有 to 生效，而各出口的端口可以不同。
    - to:
        - ipBlock:
            cidr: {{ $allow.cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $allow.port | int }}
    {{- end }}
    # 监控栈（9090）：infra_watch 按 PromQL 探测节点磁盘 / Pod OOM 等基础设施
    # 信号，查询跨命名空间落到监控命名空间的 Prometheus。podSelector:{} 只
    # 匹配本命名空间，必须显式 namespaceSelector，否则规则求值全部超时失败。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: 9090
    # kube-apiserver：主线部署器构建侧在 Pod 内调 kubectl（查四部署镜像、
    # apply 滚动 Job）。in-cluster 经 kubernetes Service ClusterIP:443
    # （K3s Service CIDR 默认 10.43.0.0/16，标准 kubeadm 常用 10.96.0.0/12，
    # 由 networkPolicy.apiServerCidr values 覆盖）。
    # 两条 ipBlock 缺一不可：部分 CNI 在 DNAT 前按 Service CIDR 匹配；另一
    # 部分（含 K3s 内置策略控制器）在 DNAT 后匹配，此时目的地址是宿主网络
    # 上的 apiserver 节点 IP:6443（hostNetwork，不是 Pod，podSelector 永远
    # 匹配不到），用 0.0.0.0/0 兜底、端口钉死 443/6443 保持最小授权。
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.apiServerCidr | quote }}
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 主线滚动 Job Pod（新镜像 smoke test + 门禁滚动四部署）：网络面最小化，
# 只准访问 kube-apiserver（kubectl set image / 查 rollout 与 pod 健康）与
# DNS，不需要数据面、网关、registry（构建与 push 都在进化 Pod 完成）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-mainline-rollout-egress
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainline-rollout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mainline-rollout
  policyTypes:
    - Egress
  egress:
    # 同 evolution 策略：DNAT 后 apiserver 端点是宿主网络节点 IP:6443，
    # 0.0.0.0/0 配合端口钉死覆盖（详见上方 evolution 规则注释）。
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.apiServerCidr | quote }}
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: security-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Audited LLM channel: the `podSelector: {}` rule above means "anyone in this
    # namespace may call", while this port exists entirely because its reachable set
    # is small -- document bodies leave through it, and it carries upstream
    # credentials without a domain allowlist. So the source pod is pinned to one:
    # the sandbox executor (the owner of the host-document capability).
    # The rule is written on the gateway rather than as an executor egress allowlist
    # on purpose: the judgement lands on the side that holds the credentials, so a
    # caller-side coding mistake cannot widen it.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox-executor
      ports:
        - protocol: TCP
          port: {{ .Values.securityGateway.auditedLlmPort }}
    # webhook 入口（8082）：NodePort 面向集群外平台回调，源 IP 经 SNAT 为节点
    # 地址，无法用 podSelector 限定；平台签名验签在网关完成（未配置 secret 时
    # 一律 503，fail-closed），故可对集群外开放。
    - ports:
        - protocol: TCP
          port: 8082
    # 观测通道：只向监控命名空间放行，且只放这一个端口。该通道不挂任何代理
    # 路由，监控侧即使被放行也拿不到凭证代持能力（8080/8081 会注入真上游凭证，
    # 因此那两条仍只对同命名空间开放）。
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- range .Values.securityGateway.metricsAllowedNamespaces }}
                  - {{ . | quote }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.securityGateway.metricsPort }}
  egress:
    - {}
---
# The sandbox executor's egress face: turn "document bodies go through the audited
# channel only" from a line of code into a **network fact**.
#
# The executor holds no credentials, so it cannot reach the upstream LLM -- but today
# it can reach the security gateway's **passthrough port** (8081), and that port does
# not look at one byte of the request body. If "this request uses the audited channel"
# were written in caller code only, nothing would stop a mistake; once the reachable
# set is narrowed the passthrough port is not on this pod at all, so **the judgement
# does not exist and therefore cannot be written wrong**.
#
# The port list is not copied from a neighbouring policy: it is this instance's real
# egress face (measured connections 2026-09-27 + code review).
#   - DNS 53: resolving github.com / gitee.com is how the seed repositories are fetched.
#   - 0.0.0.0/0:443: seed repository https fetches (SANDBOX_REPO_SEED_URLS, once every
#     repoFetchIntervalSecs) plus the git/cargo fetches a task performs; the image's
#     cargo source is rsproxy and npm is npmmirror, both on 443. This port covers no
#     in-namespace service -- a ClusterIP service port is never 443.
#   - the audited LLM channel: the only in-namespace port allowed through.
#   - 8080/8081/8082 and the data plane are not listed: the executor's env carries local
#     paths only (workspace, bare repo, cargo home, document scopes), no data-plane URL,
#     and the code has no qdrant / apiserver client. So this is not "removing a
#     capability in use" but reclaiming a path nobody uses -- one that, if used, would
#     send bodies out.
#   - Egress only: the inbound face (the main app submitting tasks, monitoring scraping
#     9090) is outside this reasoning; narrowing it too would drag unrelated paths in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-sandbox-executor-egress
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-executor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox-executor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.securityGateway.auditedLlmPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443
{{- end }}
