{{- if .Values.networkPolicy.enabled }}
# 沙盒网络隔离：evolution Pod 默认拒绝出站，仅放行安全网关与集群 DNS。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-evolution-deny-egress
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: evolution
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: security-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogneva-security-gateway
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: security-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    - {}
{{- end }}
