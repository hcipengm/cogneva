{{- if .Values.evolution.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-evolution-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
  annotations:
    # 卸载不销毁数据卷：重装要接着用同一份状态（工作树、原始日志、数仓、记忆、
    # 裸仓库），删掉就等于丢实例。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evolution.sandboxStorage }}
  {{- with .Values.storage.evolution }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-evolution-source-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution-source
  annotations:
    # 卸载不销毁数据卷：共享 CARGO_TARGET_DIR 在这里，删掉就得从零冷编译。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evolution.sourceStorage }}
  {{- with .Values.storage.evolution }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-evolution-data-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution-data
  annotations:
    # 卸载不销毁数据卷：实例身份的落盘状态文件在这里，删掉实例就会改名。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evolution.dataStorage }}
  {{- with .Values.appData.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
rules:
  # 主线跟踪部署器随镜像下发清单包：滚动 Job 以 apply 交付发布集里的支撑
  # 资源与 deployment 清单（拓扑变更因此随版本到达集群）。apply 可能创建
  # 新资源，无法用 resourceNames 白名单，授权是集合级——但 Role 本身限定
  # 在本命名空间。权限面（Role/RoleBinding）与 Secret 不经部署面：组包侧
  # 硬性过滤，这里也不授权，防止自治系统为自己提权。
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # 旧清单包 ConfigMap 清理（按 label 选择删除，名字含 rev 不可枚举）。
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # Pod 健康检查（name+component 双标签选择器，集合 list）。
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # 治理面漂移读数：把「仓库声明的上限」与「集群真正在执行的」比一比，而集群侧
  # 就是 `get resourcequota -o json`。只读——上限自身不由部署面交付（见资源配额
  # 清单，由安装面 apply），所以这里不授权写。
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
  # 变更部署的回滚：`kubectl rollout undo` 在打补丁之前要先经 ReplicaSet 找到
  # 上一版 pod 模板，所以上面那条覆盖 deployments 的授权不够。缺它时的现场读数：
  # 「failed to retrieve replica sets from deployment cogneva: replicasets.apps is
  # forbidden」。只读，与主应用 Pod 的 gitops-puller 为同一条命令授的权一致。
  #
  # 部署器自己的失败诊断读的是同一个资源（按标签选失败的那些 ReplicaSet），而那一读
  # 不只是报告：`admission_rejection` 拿它的行判定这次滚动有没有被 API server 准入
  # 拒绝。没授权时采样答「空」，于是每次滚动都读成「没有被拒」——一个机器判据在拿
  # 权限错误当答案。
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # 失败诊断：滚动窗口里的 Warning 事件。只读；缺它诊断会静默丢掉"Pod 为什么一直
  # 没就绪"的唯一描述。
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # 主线滚动 Job：构建侧 apply(create) 派发、状态查询、Job 已完成但部署被
  # apply 打回时 delete 旧 Job 重新派发；Job 内滚动复用同一 SA。
  # cronjobs 同规则：滚动端 kubectl apply 渲染清单含备份 CronJob，apply 的
  # 存在性检查要 get 该资源。
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
subjects:
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-evolution
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva-evolution
      app.kubernetes.io/component: evolution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva-evolution
        app.kubernetes.io/component: evolution
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      serviceAccountName: cogneva-evolution
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        - name: seed-source
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              git config --global --add safe.directory /host-git
              git config --global --add safe.directory /opt/cogneva/sandbox/workspaces
              # 镜像按序尝试，第一个可达的胜出：可达性按主机不对称（实测本集群
              # github 间歇黑洞、gitee 秒级应答），只配一个地址时该主机不可达期间
              # 既 seed 不出空卷、也刷不到新 release tag。
              # http.connectTimeout/lowSpeed 给网络操作兜底，否则离线时 git 会
              # 长时间挂在连接上拖慢 Init 与整 Pod 就绪。
              # 但连接超时与低速阈值管不住"带宽很低但在动"的传输：实测一次
              # fetch 跑了 14 分钟没完，把整段启动预算吃光、Pod 被判启动超时
              # （一次网络慢被记成版本缺陷）。所以每个走公网的 git 调用再加一层
              # 挂钟上界：单次尝试最多 240 秒（实测正常读数秒级到几十秒，取数倍
              # 余量）。超了就当这个镜像不可用、走下面已有的失败分支，语义不变。
              # 代价：真的很大的传输可能一次传不完而被放弃，下一轮从零再来（被杀
              # 掉的 fetch 不落 refs），极端网络下裸仓会停在旧 main——启动可用性
              # 优先于基线新鲜度，与"全部镜像失败不阻塞启动"同向。
              mirrors="{{ join "," .Values.evolution.gitRemote.seedUrls }}"
              # gitRemote.mode=pvc 时首挂是空卷，从公开仓库 seed；
              # hostPath 模式宿主已预 seed，本步自动跳过。
              # 全部镜像失败不阻塞启动：离线集群用本地已有状态，下次重启 init 再试。
              if [ ! -f /host-git/HEAD ]; then
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  echo "git-remote is empty; seeding bare repo from $m ..."
                  rc=0
                  /usr/bin/timeout 240 git -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 clone --bare "$m" /tmp/seed.git || rc=$?
                  if [ "$rc" = 0 ]; then
                    cp -a /tmp/seed.git/. /host-git/
                    rm -rf /tmp/seed.git
                    break
                  fi
                  if [ "$rc" = 124 ]; then
                    echo "WARN: git-remote seed from $m gave up after the 240s bound (transfer slower than the bound, or the mirror never answered)"
                  else
                    echo "WARN: git-remote seed from $m failed (rc=$rc)"
                  fi
                  rm -rf /tmp/seed.git
                done
                [ -f /host-git/HEAD ] || echo "WARN: git-remote seed failed on every mirror (no mirror answered within the bound); starting without a seeded baseline"
              fi
              if [ -f /host-git/HEAD ]; then
                # bare 保持一个指向上游的 upstream remote，启动时拉最新 main 与
                # release tag；首选不可达就换下一个，全部失败只告警——离线时用
                # seed 已带的 tag（当前部署版本的 tag 在 seed 时就存在）。
                for m in $(echo "$mirrors" | tr ',' ' '); do
                  git --git-dir=/host-git remote remove upstream 2>/dev/null || true
                  git --git-dir=/host-git remote add upstream "$m"
                  rc=0
                  /usr/bin/timeout 240 git --git-dir=/host-git -c http.connectTimeout=15 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch upstream --tags --force || rc=$?
                  if [ "$rc" = 0 ]; then
                    break
                  fi
                  if [ "$rc" = 124 ]; then
                    echo "WARN: fetch upstream tags from $m gave up after the 240s bound (transfer slower than the bound, or the mirror never answered); trying the next mirror"
                  else
                    echo "WARN: fetch upstream tags from $m failed (rc=$rc); trying the next mirror"
                  fi
                done
              fi
              # 工作树由分配器按需从裸仓库切出（零克隆、共享对象库），这里只清掉
              # 崩溃留下的孤儿登记，并备好工作树根目录（app 容器的 workingDir）。
              git --git-dir=/host-git worktree prune
              mkdir -p /opt/cogneva/sandbox/workspaces
          volumeMounts:
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: git-remote
              mountPath: /host-git
      containers:
        - name: cogneva
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /opt/cogneva/sandbox/workspaces
          # 特权容器 = 文件系统沙盒边界（3.2 image-based 滚动更新后移除）
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: cogneva-config
            - configMapRef:
                name: cogneva-evolution-config
          env:
            - name: COGNEVA_CONFIG_PATH
              value: "/etc/cogneva/cogneva.json"
            # 本 Pod 的名字：按变更派出的执行 Job 要跑**同一份代码**，而"同一份"
            # 只能从本 Pod 的 `status.containerStatuses[].imageID`（带摘要）读出来；
            # 读自己那份状态得先叫得出自己的名字。读不到名字时不派 Job，不回退成
            # 用浮动 tag 派——子进程可能因此跑在另一份代码上。
            - name: COGNEVA_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 本部署的名字，与主应用同源同形。样本日志的容量声明落在共用表
            # 里、series 键就是标签集：不署名时「本部署不清理」在读数面上与「隔壁
            # 那家的 200000」同形。取部署名而不是 Pod 名——地板是按 series 计的，
            # 随滚动变化的名字会每次滚动多一行永不回收的地板。也不能取 Pod 标签
            # `app.kubernetes.io/name`（那是应用名，七个工作负载共用主应用那一个值，
            # 拿它当部署名时「别家不许顶这一家的声明」那道闸对它们全失效）；这里的
            # 字面量必须等于本文件的 metadata.name
            # （判据 deploy/scripts/check-deployment-name-wiring.sh）。
            - name: COGNEVA_DEPLOYMENT_NAME
              value: cogneva-evolution
            # 告警邮件出口的 SMTP 口令：凭证不进清单也不进 values，只认这个
            # Secret 键，缺省即不做鉴权。主应用 Pod 也跑同一条告警桥，两处同源。
            - name: COGNEVA_ALERTMANAGER_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: smtp-password
                  optional: true
            # 进化链 fail-closed：Shell 工具必须携带真实 DAG task 身份。
            - name: COGNEVA_REQUIRE_TOOL_IDENTITY
              value: {{ ternary "true" "false" .Values.evolution.requireToolIdentity | quote }}
            # 孤儿巡检单一持有者：进化 Pod 默认关闭，避免与主应用双跑
            # 压短告警停留窗口。
            - name: COGNEVA_DECOMPOSITION_ORPHAN_WATCH_ENABLED
              value: {{ ternary "true" "false" .Values.evolution.orphanReconcilerEnabled | quote }}
            # 本 Pod 挂在 /var/lib/cogneva-data 上的声明与主应用不是同一张，占用要
            # 分开量：两个进程写同一个路径，但各自的卷互不相干。
            - name: COGNEVA_DATA_VOLUME_CLAIM
              value: "cogneva-evolution-data-pvc"
            # 本 Pod 在数据目录之外还挂了两张卷，占用都远大于上面那张：沙箱工作树
            # 与构建缓存。不列出来它们就没有观测面——唯一能发现"声明 10Gi、实际
            # 101G"的规则看不见它们，只会在节点盘整体告急时才被间接发现。
            # 子挂载由进程读自己的挂载表排除，不在这里重复声明，免得挂载一变就
            # 静默量错。
            - name: COGNEVA_DATA_VOLUME_MOUNTS
              value: |
                cogneva-evolution-pvc=/opt/cogneva/sandbox
                cogneva-evolution-source-pvc=/opt/cogneva/sandbox/src
            {{- if .Values.clusterRegistry.enabled }}
            # 集群内 registry 的卷不归本 Pod 写，走查也不在它的挂载表里：本 Pod 的
            # 部署器是它唯一的写者（buildah push），从这里能问到的只有 registry
            # API 报的"活 tag 引用的层"，那是另一个量（cogneva_registry_referenced_
            # bytes：孤儿层它看不见），留给保留策略读。那张卷的盘上占用由 registry
            # Pod 里只读走查该卷的边车产出，声明量比的必须是那一份，所以这里不再
            # 往卷族序列上挂——一个序列名只能有一个含义。
            - name: COGNEVA_REGISTRY_CLAIM
              value: {{ .Values.clusterRegistry.claimName | quote }}
            {{- end }}
            # 本 Pod 自己的 JWT 签名密钥，与主应用那份**不同源**：本 Pod 持有
            # 主线部署器（推 registry、滚四部署），并入用户会话的鉴权域等于让
            # 一枚 WebUI token 够到部署器。取不到时进程退化为一次性随机密钥，
            # 而本 Pod 每推进一个 rev 就被重建一次——那等于鉴权域每轮换签。
            - name: COGNEVA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: evolution-jwt-secret
                  optional: true
            # 沙盒零凭证：LLM/平台流量经安全网关透传，真实 key 只在网关 Pod。
            # 缺这三个 env 时 Provider 直连公网平台——集群仅网关在 egress 白名单，直连必败。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            # 通知机器人签名借用面：机器人报文要签名时向安全网关借一对
            # (timestamp, sign)，平台密钥不出网关。本 Pod 跑的是同一个二进制、
            # 装的是同一套插件，所以这条与主应用那份必须同源——少一条，这个
            # 进程发出的通知就退回未签名，而平台会以「签名校验失败」拒收。
            - name: COGNEVA_NOTIFICATION_SIGN_BASE
              value: "http://cogneva-security-gateway:8081"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # 内存 Raw 层的面（归档工具的巨量输出 + 取引用读回），零凭证。指向主应用
            # 的**内部端口** 8085，不是主 API 的 8080：8080 上那几条按角色判，本 Pod
            # 零凭证恒吃 401。本 Pod 的 egress 是白名单，少了 network-policy 里那一条
            # 端口放行，归档请求会被静默丢弃。与主应用那份同源。
            - name: COGNEVA_MEMORY_API_BASE
              value: "http://cogneva:8085"
            # 实例身份指纹：身份的规范来源，安装期生成、升级复用。身份决定
            # `evol/<id>` 分支名与按实例命名的常驻工作树，必须跨重启与重装稳定。
            - name: COGNEVA_INSTANCE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: instance-fingerprint
                  optional: true
            # wiki 检索后端（Meilisearch）主密钥：cogneva.json 的
            # providers.wiki.options.api_key 经 ${MEILI_MASTER_KEY} 插值。
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: meili-master-key
            # 对象存储凭证：cogneva.json 的 providers.storage.options 经
            # ${S3_ACCESS_KEY} / ${S3_SECRET_KEY} 插值。两个 Pod 共用同一对
            # 密钥，也就共用同一个对象命名空间——这正是记忆共享的前提。
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: s3-secret-key
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    git config --global --add safe.directory /host-git
                    git config --global --add safe.directory /opt/cogneva/sandbox/workspaces
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            # 应用数据落持久卷：identity.json 决定实例名，丢了就会随机器指纹重算，
            # 按实例命名的资源逐次遗留；数仓 / 策略 / 记忆 / 原始日志同在此目录。
            - name: app-data
              mountPath: /var/lib/cogneva-data
            - name: git-remote
              mountPath: /host-git
              readOnly: false
            - name: cogneva-json
              # 必须挂目录：挂成 /etc/cogneva/cogneva.json 且无 subPath 会把
              # ConfigMap 挂成同名目录，进程读文件失败静默回退默认配置
              mountPath: /etc/cogneva
              readOnly: true
            # prompt 模板与主应用同源。缺这个挂载时本进程的 prompt 注册表是空的：
            # 目录读不到只 warn、热重载 watcher 直接 ERROR，之后每次渲染都静默
            # 回退到代码里的兜底字符串——热更新与版本化在这个 Pod 上整体失效，
            # 而它恰恰是跑 EvolutionEngine 的那一半。
            - name: prompts
              mountPath: /etc/cogneva/prompts
              readOnly: true
            {{- if .Values.gitops.kubectlBin.enabled }}
            # 主线部署器构建侧在本 Pod 内调 kubectl（查四部署镜像、apply 滚动
            # Job）。K3s 多调用二进制 argv[0]=kubectl 即 kubectl，版本与集群一致。
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.evolution.resources | nindent 12 }}
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-pvc
        - name: source
          persistentVolumeClaim:
            claimName: cogneva-evolution-source-pvc
        - name: app-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-data-pvc
        - name: git-remote
          {{- if eq .Values.evolution.gitRemote.mode "pvc" }}
          # 多节点/生产：hostPath 只存在于单个节点，必须走集群卷
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
          {{- else }}
          hostPath:
            path: {{ .Values.evolution.gitRemote.hostPath }}
            type: Directory
          {{- end }}
        - name: cogneva-json
          configMap:
            name: cogneva-json
        - name: prompts
          configMap:
            name: cogneva-prompts
        {{- if .Values.gitops.kubectlBin.enabled }}
        - name: kubectl-bin
          hostPath:
            path: {{ .Values.gitops.kubectlBin.hostPath }}
            type: File
        {{- end }}
---
# 进化 Pod 的指标端点。ServiceMonitor 按 Service 标签发现端点，进化负载此前
# 没有 Service，于是它产生的指标（Ralph 循环终止等）在观测面上完全缺席——
# 监控里只有主应用那一半，恰好漏掉承担大部分 decompose 的那一半。
# 沿用 cogneva 名字标签，与主应用共用同一条 ServiceMonitor，不新增抓取配置。
apiVersion: v1
kind: Service
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cogneva-evolution
    app.kubernetes.io/component: evolution
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- if eq .Values.evolution.gitRemote.mode "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-git-remote-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: evolution
  annotations:
    # 卸载不销毁数据卷：裸仓库是全部进化分支与晋级产物的规范来源。
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storage.retain }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.evolution.gitRemote.storage }}
{{- end }}
{{- end }}
