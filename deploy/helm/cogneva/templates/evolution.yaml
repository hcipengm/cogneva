{{- if .Values.evolution.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-evolution-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evolution.sandboxStorage }}
  {{- with .Values.storage.evolution }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-evolution-source-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution-source
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.evolution.sourceStorage }}
  {{- with .Values.storage.evolution }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
rules:
  # image-based 滚动更新：evolution worker patch 主 Deployment 镜像
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cogneva"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cogneva-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
subjects:
  - kind: ServiceAccount
    name: cogneva-evolution
    namespace: {{ include "cogneva.namespace" . }}
roleRef:
  kind: Role
  name: cogneva-evolution
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva-evolution
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    {{- include "cogneva.labels" . | nindent 4 }}
    app.kubernetes.io/component: evolution
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva-evolution
      app.kubernetes.io/component: evolution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva-evolution
        app.kubernetes.io/component: evolution
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      serviceAccountName: cogneva-evolution
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        - name: seed-source
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # 当前运行镜像版本（= chart appVersion，与 Cargo.toml 同源）；基线对齐锚到
          # 上游对应的 release tag v<版本>，保证进化改的是正在运行版本的代码。
          env:
            - name: COGNEVA_VERSION
              value: {{ .Chart.AppVersion | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              git config --global --add safe.directory /host-git
              git config --global --add safe.directory /opt/cogneva/sandbox/src
              # gitRemote.mode=pvc 时首挂是空卷，从公开仓库 seed；
              # hostPath 模式宿主已预 seed，本步自动跳过
              if [ ! -f /host-git/HEAD ]; then
                echo "git-remote is empty; seeding bare repo from {{ .Values.evolution.gitRemote.seedUrl }} ..."
                git clone --bare {{ .Values.evolution.gitRemote.seedUrl }} /tmp/seed.git
                cp -a /tmp/seed.git/. /host-git/
                rm -rf /tmp/seed.git
              fi
              # bare 保持一个指向上游的 upstream remote，启动时拉最新 main 与 release tag。
              # 失败不阻塞：离线时用 seed 已带的 tag（当前部署版本的 tag 在 seed 时就存在）。
              git --git-dir=/host-git remote remove upstream 2>/dev/null || true
              git --git-dir=/host-git remote add upstream {{ .Values.evolution.gitRemote.seedUrl }}
              if ! git --git-dir=/host-git fetch upstream --tags --force; then
                echo "WARN: fetch upstream tags failed (offline?); using tags present at seed"
              fi
              if [ ! -d /opt/cogneva/sandbox/src/.git ] || [ ! -f /opt/cogneva/sandbox/src/Cargo.toml ]; then
                echo "Source PVC is empty or incomplete; cloning from local bare repo..."
                find /opt/cogneva/sandbox/src -mindepth 1 -delete 2>/dev/null || true
                git clone /host-git /opt/cogneva/sandbox/src
              else
                echo "Source PVC already populated; ensuring local remote points to bare repo..."
              fi
              cd /opt/cogneva/sandbox/src
              git config user.email "evolution@cogneva.local"
              git config user.name "Cogneva Evolution"
              git remote remove local 2>/dev/null || true
              git remote add local /host-git
              git fetch local --tags
              # 基线对齐：工作源码首次 seed 后基线冻结，镜像升级不会自动跟随。启动时幂等对齐
              # 到当前运行版本的 release tag。工作区脏、或有未晋级 commit 时不重置（避免冲掉
              # 在制 patch），仅告警，下次启动再判；已晋级成果在 bare 的 evolution-release/tag。
              TARGET_TAG="v${COGNEVA_VERSION}"
              if ! git rev-parse -q --verify "refs/tags/${TARGET_TAG}^{commit}" >/dev/null; then
                echo "WARN: baseline tag ${TARGET_TAG} not found; skip alignment (dev/local build?)"
              elif [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")" ]; then
                echo "Source baseline already at ${TARGET_TAG}; nothing to do"
              else
                # 晋级基线：已晋级过用 evolution-release，否则用 seed 基线 local/main
                if git rev-parse -q --verify refs/remotes/local/evolution-release >/dev/null; then
                  BASE_REF=local/evolution-release
                else
                  BASE_REF=local/main
                fi
                if [ -n "$(git status --porcelain)" ] || [ -n "$(git log "${BASE_REF}..HEAD" --oneline)" ]; then
                  echo "WARN: deployed version is ${TARGET_TAG} but source has unpromoted in-flight work;"
                  echo "WARN: keeping current baseline to avoid losing patches. Promote then restart,"
                  echo "WARN: or force-refresh by deleting the source PVC / 'git reset --hard ${TARGET_TAG}'."
                else
                  echo "Clean tree, no unpromoted work; aligning source baseline to ${TARGET_TAG}"
                  git reset --hard "refs/tags/${TARGET_TAG}^{commit}"
                fi
              fi
          volumeMounts:
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: git-remote
              mountPath: /host-git
      containers:
        - name: cogneva
          image: {{ include "cogneva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /opt/cogneva/sandbox/src
          # 特权容器 = 文件系统沙盒边界（3.2 image-based 滚动更新后移除）
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: cogneva-config
            - configMapRef:
                name: cogneva-evolution-config
          env:
            - name: COGNEVA_CONFIG_PATH
              value: "/etc/cogneva/cogneva.json"
            # 沙盒零凭证：LLM/平台流量经安全网关透传，真实 key 只在网关 Pod。
            # 缺这三个 env 时 Provider 直连公网平台——集群仅网关在 egress 白名单，直连必败。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    git config --global --add safe.directory /host-git
                    git config --global --add safe.directory /opt/cogneva/sandbox/src
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: sandbox-data
              mountPath: /opt/cogneva/sandbox
            - name: source
              mountPath: /opt/cogneva/sandbox/src
            - name: git-remote
              mountPath: /host-git
              readOnly: false
            - name: cogneva-json
              # 必须挂目录：挂成 /etc/cogneva/cogneva.json 且无 subPath 会把
              # ConfigMap 挂成同名目录，进程读文件失败静默回退默认配置
              mountPath: /etc/cogneva
              readOnly: true
          resources:
            {{- toYaml .Values.evolution.resources | nindent 12 }}
      volumes:
        - name: sandbox-data
          persistentVolumeClaim:
            claimName: cogneva-evolution-pvc
        - name: source
          persistentVolumeClaim:
            claimName: cogneva-evolution-source-pvc
        - name: git-remote
          {{- if eq .Values.evolution.gitRemote.mode "pvc" }}
          # 多节点/生产：hostPath 只存在于单个节点，必须走集群卷
          persistentVolumeClaim:
            claimName: cogneva-git-remote-pvc
          {{- else }}
          hostPath:
            path: {{ .Values.evolution.gitRemote.hostPath }}
            type: Directory
          {{- end }}
        - name: cogneva-json
          configMap:
            name: cogneva-json
{{- if eq .Values.evolution.gitRemote.mode "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-git-remote-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: evolution
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storage.retain }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.evolution.gitRemote.storage }}
{{- end }}
{{- end }}
