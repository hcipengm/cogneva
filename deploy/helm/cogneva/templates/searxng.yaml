{{- if .Values.webSearch.enabled }}
# settings.yml 的内容在 searxng-settings.yaml：那份 ConfigMap 是这张 Pod 模板
# 的指纹要哈希的东西，单独成文件才能被 include（同一份文件 include 自己会递归）。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  replicas: {{ .Values.webSearch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/component: search
  template:
    metadata:
      annotations:
        # settings.yml 是卷里挂进去的：kubelet 会就地更新文件，进程却只在启动时
        # 读一次。改 values 里的引擎/超时后 ConfigMap 变了、Pod 模板没变，这次
        # 升级就不换 Pod——搜索面仍按旧设置跑，而渲染、parity、Pod 状态三面全绿。
        # 指纹只哈希那份配置模板（searxng-settings.yaml），与主应用那几条读主配置的
        # 工作负载不同值是正确的：它们哈希的不是同一组文档。
        checksum/config: {{ include (print $.Template.BasePath "/searxng-settings.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/component: search
    spec:
      # 只读根 + 无 token：本 Pod 不持有任何凭证，也不写任何需要活过重启的东西。
      automountServiceAccountToken: false
      securityContext:
        # 镜像的 entrypoint 默认以 root 起步（它只在 root 时才跑
        # update-ca-certificates），而这里不需要那一步：写明 977 才是镜像里
        # `searxng` 那个用户的 uid，`runAsNonRoot` 才有可核对的落点——只写
        # runAsNonRoot 时 kubelet 看到的仍是镜像里的 root，容器起不来。
        {{- /* lit: 977 fixed — the UID the searxng image runs as */}}
        runAsUser: 977
        runAsGroup: 977
        # emptyDir 随 `fsGroup` 归到同一组，缓存目录才写得进去。
        fsGroup: 977
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: {{ .Values.webSearch.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.webSearch.port }}
              protocol: TCP
          env:
            # 配置从这里读，不打进镜像；容器内路径由镜像的 entrypoint 认。
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            # 引擎返回的临时缓存：随 Pod 走，不需要活过重启。
            - name: cache
              mountPath: /var/cache/searxng
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
{{ toYaml .Values.healthProbes.startup | indent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
{{ toYaml .Values.healthProbes.liveness | indent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
{{ toYaml .Values.healthProbes.readiness | indent 12 }}
          resources:
{{ toYaml .Values.webSearch.resources | indent 12 }}
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: {{ .Values.webSearch.port }}
      targetPort: http
      protocol: TCP
{{- end }}
