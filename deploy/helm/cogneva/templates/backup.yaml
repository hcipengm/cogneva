{{- if .Values.backup.enabled }}
# 数据面备份：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象 raw 层 +
# 实例身份 Secret）每日打成 tar.zst 落专用备份卷。重启档由 PVC keep 策略
# 覆盖，本备份覆盖重装/换机档（restore-from-package.sh 消费）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-backup-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
  annotations:
    # 与数据卷同级待遇：卸载不销毁，重装后备份还在原地可恢复。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 备份失败不重试成串：下一个周期自然再来，连续失败由 history 留证。
      backoffLimit: 1
      # 卡死的运行必须有人来杀。concurrencyPolicy 是 Forbid，一次挂住的运行会
      # 让它之后每一次都不再开始——备份停掉，连「谁来给挂住那笔收尾」也一起停。
      # 这个界杀的是容器，同一个值经 env 进运行自己写的账本行，判超期用的是那一
      # 行上的数（见 backup.rs 的 run_deadline_seconds）。
      activeDeadlineSeconds: {{ .Values.backup.runDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["backup"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
                # 快照 API 只在 Qdrant REST 端口（6333），gRPC（6334）没有。
                - name: COGNEVA_QDRANT_HTTP_URL
                  value: "http://qdrant.{{ include "cogneva.namespace" . }}.svc.cluster.local:6333"
                - name: COGNEVA_BACKUP_KEEP
                  value: {{ .Values.backup.keepCount | quote }}
                # 与 jobTemplate 的 activeDeadlineSeconds 是同一个值的两个载体：
                # 一个让 kubelet 到点杀容器，一个让运行把「这次我被给了多久」写
                # 进账本那一行。分开写两个数会漂，超期判断就跟着漂。
                - name: COGNEVA_BACKUP_RUN_DEADLINE_SECONDS
                  value: {{ .Values.backup.runDeadlineSeconds | quote }}
                - name: COGNEVA_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                {{- with .Values.backup.offsiteHostPath }}
                # 卷外那一份的落点。写者只负责复制，判「有没有、是不是今晚的」
                # 由演练那一跑自己遍历目录——写者说自己复制了不算读数。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                {{- end }}
              resources:
{{ toYaml .Values.backup.resources | indent 16 }}
              volumeMounts:
                # 对象 raw 层来源（只读：备份绝不写数据卷）。
                - name: data
                  mountPath: /var/lib/cogneva-data
                  readOnly: true
                # 身份导出：Secret 以只读卷进 Pod，打成 apply-able manifest，
                # 不为备份单独扩 RBAC。
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                # 带外那一份同挂：平台 token、git 身份私钥都只在这里，不导就等于
                # 换机后要回平台后台重新签发一遍。两片分开导出、分开恢复——它们
                # 是两个对象，权限面也是按对象划的。
                - name: secrets-oob
                  mountPath: /secrets-oob
                  readOnly: true
                - name: backup
                  mountPath: /backups
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cogneva-data-pvc
            - name: secrets
              secret:
                secretName: cogneva-secrets
            - name: secrets-oob
              secret:
                secretName: cogneva-secrets-oob
                # 全新安装、向导还没跑过时这个对象可能没有键，但对象本身由
                # init-secrets.sh 建了出来；optional 让"还没配"不等于"备份跑不起来"。
                optional: true
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            {{- with .Values.backup.offsiteHostPath }}
            # 宿主机上的一条路径，与备份卷不在同一个卷对象里：删 PVC、卷被回收
            # 都不动它。（同一个故障域，见 values.yaml 里的说明。）
            - name: offsite
              hostPath:
                path: {{ . | quote }}
                type: DirectoryOrCreate
            {{- end }}
---
# 恢复演练：把最新一个包装进一个**空库**，读它装成了什么，然后删库。
#
# 为什么是一个独立的 CronJob 而不是备份那一跑的一部分：演练要连源库、要建库、
# 要灌一整个库，任何一步出错都不该让当晚的备份算失败。两件事共用同一个包，但
# 一件的失败不能变成另一件的结果。
#
# 为什么是空库而不是空白命名空间：`CREATE DATABASE` 给的是一个没有表、没有行的
# 目标，这正是「恢复到一个干净的地方」要的东西；而空白命名空间要再拉一套
# Postgres/Qdrant/Secret，演练还没开始就先考验了一遍安装。演练跑在自己的 Pod、
# 自己的库名里，源 schema 一个字节都不碰——账表是同一批人要看的那张表，拿它当
# 演练场就是把要证明的东西押上去。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup-drill
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup-drill
spec:
  schedule: {{ .Values.backup.drillSchedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  # 同备份：两次演练同时在跑只会在同一个库名上互相删库。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 演练失败不重试成串：答案已经落进 backup_drills 了，下一晚自然再来。
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.backup.drillDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup-drill
        spec:
          restartPolicy: Never
          containers:
            - name: drill
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["backup-drill"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                # 演练连的是**源库**：它要在同一个服务器上建演练库，并把装回来的
                # 账行与源库那几行逐格比。这不违反「不在源库上做演练」——遍历的
                # 是另一个数据库名，源 schema 只被读。
                - name: COGNEVA_DATABASE_URL
                  value: "postgres://cog_user:$(PG_PASSWORD)@postgres.{{ include "cogneva.namespace" . }}.svc.cluster.local:5432/cogneva"
                {{- with .Values.backup.offsiteHostPath }}
                # 只读：演练遍历卷外那一份，看它是不是刚装回去的这个包。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                {{- end }}
              resources:
{{ toYaml .Values.backup.drillResources | indent 16 }}
              volumeMounts:
                # 只读：演练打开包，绝不写卷。保留的一份都不动。
                - name: backup
                  mountPath: /backups
                  readOnly: true
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                  readOnly: true
                {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            {{- with .Values.backup.offsiteHostPath }}
            - name: offsite
              hostPath:
                path: {{ . | quote }}
                type: DirectoryOrCreate
            {{- end }}
{{- end }}
