{{- if .Values.backup.enabled }}
# 数据面备份：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象 raw 层 +
# 实例身份 Secret）每日打成 tar.zst 落专用备份卷。重启档由 PVC keep 策略
# 覆盖，本备份覆盖重装/换机档（restore-from-package.sh 消费）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-backup-pvc
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
  annotations:
    # 与数据卷同级待遇：卸载不销毁，重装后备份还在原地可恢复。
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # 备份失败不重试成串：下一个周期自然再来，连续失败由 history 留证。
      backoffLimit: {{ .Values.backup.backoffLimit }}
      # 卡死的运行必须有人来杀。concurrencyPolicy 是 Forbid，一次挂住的运行会
      # 让它之后每一次都不再开始——备份停掉，连「谁来给挂住那笔收尾」也一起停。
      # 这个界杀的是容器，同一个值经 env 进运行自己写的账本行，判超期用的是那一
      # 行上的数（见 backup.rs 的 run_deadline_seconds）。
      activeDeadlineSeconds: {{ .Values.backup.runDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # 备份以专用非 root uid 运行：它以 root 跑的时候「包只有属主可读」不成立，
          # 谁能起一个挂得上卷的 Pod 谁就能读走全部包里的明文 Secret 清单。
          # 不用 fsGroup：local-path 的 PVC 与 /offsite 那条 hostPath 都不过 fsGroup。
          securityContext:
            runAsNonRoot: true
            {{- /* lit: 1001 fixed — the runtime UID/GID the images are built with; every workload pins the same pair */}}
            runAsUser: 1001
            runAsGroup: 1001
          {{- if .Values.evolution.enabled }}
          # 进化卷是 RWO：同一块卷能被读的前提是备份 Pod 与进化 Pod 落在同一
          # 个节点。让调度器按「进化 Pod 所在节点」钉住这一跑；卷自己有节点
          # 亲和时两者一致，没有时这条就是唯一的约束。钉不上就等，等到 Job
          # 超时失败——失败可见，不会静默漏掉一个数据根。
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: cogneva-evolution
                      app.kubernetes.io/component: evolution
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          # 凭证面的根目录由 kubelet 在卷第一次挂上时创建，模式跟宿主的 umask 走
          # （DirectoryOrCreate 常见是 0755）。演练会把「不是 0700 的目录」量成一条
          # 违例并让整条规则亮红，所以这里每次开工前把它收紧。只修一次不够：目录
          # 被删掉重建后又会回到默认模式，修在每一次运行里才跟得上。
          initContainers:
            - name: tighten-credential-surface
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # 这个 init 是 Pod 里唯一以 root 跑的一步：把两处目录交给主容器的
              # uid 再收紧模式。chown 是递归的——卷上已有的包是早先 root 写下的，
              # 只改目录属主的话非 root 的备份与演练读不到它们。
              securityContext:
                runAsNonRoot: false
                {{- /* lit: 0 fixed — root in two places: the backup Job writes hostPath archives, and the drill's init container chowns the credential surface before its non-root main container starts; neither has another user that can */}}
                runAsUser: 0
              command:
                - sh
                - -c
                {{- /* lit: 0700 fixed — file mode for the archives: owner-only, by intent */}}
                - >-
                  chown -R 1001:1001 /backups{{ if .Values.backup.offsiteHostPath }} /offsite{{ end }} &&
                  chmod 0700 /backups{{ if .Values.backup.offsiteHostPath }} /offsite{{ end }}
              volumeMounts:
                - name: backup
                  mountPath: /backups
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                {{- end }}
          containers:
            - name: backup
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["backup"]
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                - name: COGNEVA_DATABASE_URL
                  value: {{ printf "postgres://cog_user:$(PG_PASSWORD)@postgres.%s.svc.cluster.local:%d/cogneva" (include "cogneva.namespace" .) (int .Values.backends.postgres.port) | quote }}
                # 快照 API 只在 Qdrant REST 端口（6333），gRPC（6334）没有。
                - name: COGNEVA_QDRANT_HTTP_URL
                  value: {{ printf "http://qdrant.%s.svc.cluster.local:%d" (include "cogneva.namespace" .) (int .Values.backends.qdrant.port) | quote }}
                - name: COGNEVA_BACKUP_KEEP
                  value: {{ .Values.backup.keepCount | quote }}
                # 与 jobTemplate 的 activeDeadlineSeconds 是同一个值的两个载体：
                # 一个让 kubelet 到点杀容器，一个让运行把「这次我被给了多久」写
                # 进账本那一行。分开写两个数会漂，超期判断就跟着漂。
                - name: COGNEVA_BACKUP_RUN_DEADLINE_SECONDS
                  value: {{ .Values.backup.runDeadlineSeconds | quote }}
                {{- with .Values.backup.packageKeySecret.name }}
                # 包级加密的口令。Secret 由操作者带外写入：chart 生成的口令与密文
                # 同机，那就不叫「不落在同一台机器上」。空 = 不注入，走明文分支。
                - name: COGNEVA_BACKUP_PACKAGE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ . | quote }}
                      key: {{ $.Values.backup.packageKeySecret.key | quote }}
                {{- end }}
                # 实例身份：包里记的「这份字节出自哪个实例」就靠它。只取这一个键，
                # 不挂整片——这一片里其余键都是凭证，而这个 Pod 不需要它们。少了
                # 它，manifest 那一格会写成 unknown，换机后两份包分不出谁是谁。
                - name: COGNEVA_INSTANCE_FINGERPRINT
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: instance-fingerprint
                      optional: true
                - name: COGNEVA_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # 出包进程跑的是哪份镜像。容器读不到自己的镜像引用（downward API
                # 没有这个字段），只能由渲染时注入；不注入的话 manifest 里这一格
                # 是空的，换机排障时就没有「这份字节是谁产出的」可对照。
                - name: COGNEVA_IMAGE_REF
                  value: {{ include "cogneva.image" . | quote }}
                {{- if .Values.evolution.enabled }}
                # 第二个数据根：进化 Pod 的 data_dir。名字是清单里的身份，
                # 恢复端按「根名 + 库名」定位，不按路径合并两套同名策略库。
                - name: COGNEVA_BACKUP_EXTRA_DATA_ROOTS
                  value: "evolution=/var/lib/cogneva-evolution-data"
                # 进化 bare 仓不在数据根里，是独立的一卷：已推的 rev 能从公开
                # 远端重取，未推的不能，所以整仓打成 git bundle 进包。卷上还
                # 没 seed 时这一格空着，manifest 的 lossy_surfaces 会点名。
                - name: COGNEVA_BACKUP_GIT_REMOTE_DIR
                  value: "/git-remote"
                {{- end }}
                {{- with .Values.backup.offsiteHostPath }}
                # 卷外那一份的落点。写者只负责复制，判「有没有、是不是今晚的」
                # 由演练那一跑自己遍历目录——写者说自己复制了不算读数。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                {{- end }}
              resources:
{{ toYaml .Values.backup.resources | indent 16 }}
              volumeMounts:
                # 对象 raw 层来源（只读：备份绝不写数据卷）。
                - name: data
                  mountPath: /var/lib/cogneva-data
                  readOnly: true
                {{- if .Values.evolution.enabled }}
                # 进化 Pod 的 data_dir：备份只读共挂。只取 policies/ 与
                # meta_learning/decision_stats.json，工作树、数仓、日志不在这里
                # 读——它们体积以百 GiB 计且不属于换机后必须逐字节相同的面。
                - name: evolution-data
                  mountPath: /var/lib/cogneva-evolution-data
                  readOnly: true
                # 只读：备份只从 bare 仓读对象，绝不写它。
                - name: git-remote
                  mountPath: /git-remote
                  readOnly: true
                {{- end }}
                # 身份导出：Secret 以只读卷进 Pod，打成 apply-able manifest，
                # 不为备份单独扩 RBAC。
                #
                # **只在包是密文时才挂**：包里那份清单只是 base64，卷上与卷外各躺
                # 一份就是两处新的凭证载体，能读文件的人拿走全部 token。没有包级
                # 口令时导出端本来就不导这两片（它会点名成有损面），那么这里的挂载
                # 就只剩一个作用：让备份 Pod 读得到它根本不会用到的凭证。凭证只在
                # 安全网关里，是从「挂不挂」这一层就开始算的。
                {{- if .Values.backup.packageKeySecret.name }}
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                # 带外那一份同挂：平台 token、git 身份私钥都只在这里，不导就等于
                # 换机后要回平台后台重新签发一遍。两片分开导出、分开恢复——它们
                # 是两个对象，权限面也是按对象划的。
                - name: secrets-oob
                  mountPath: /secrets-oob
                  readOnly: true
                {{- end }}
                - name: backup
                  mountPath: /backups
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cogneva-data-pvc
            {{- if .Values.evolution.enabled }}
            - name: evolution-data
              persistentVolumeClaim:
                claimName: cogneva-evolution-data-pvc
            # 与进化 Pod 的 volume 声明同形：pvc 模式走 claim，hostPath 模式走
            # 宿主目录（备份 Pod 已被下面的亲和钉在进化 Pod 所在节点上）。
            - name: git-remote
              {{- if eq .Values.evolution.gitRemote.mode "pvc" }}
              persistentVolumeClaim:
                claimName: cogneva-git-remote-pvc
              {{- else }}
              hostPath:
                path: {{ .Values.evolution.gitRemote.hostPath | quote }}
                type: Directory
              {{- end }}
            {{- end }}
            {{- if .Values.backup.packageKeySecret.name }}
            - name: secrets
              secret:
                secretName: cogneva-secrets
            - name: secrets-oob
              secret:
                secretName: cogneva-secrets-oob
                # 全新安装、向导还没跑过时这个对象可能没有键，但对象本身由
                # init-secrets.sh 建了出来；optional 让"还没配"不等于"备份跑不起来"。
                optional: true
            {{- end }}
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            {{- with .Values.backup.offsiteHostPath }}
            # 宿主机上的一条路径，与备份卷不在同一个卷对象里：删 PVC、卷被回收
            # 都不动它。（同一个故障域，见 values.yaml 里的说明。）
            - name: offsite
              hostPath:
                path: {{ . | quote }}
                type: DirectoryOrCreate
            {{- end }}
---
# 恢复演练：把最新一个包装进一个**空库**，读它装成了什么，然后删库。
#
# 为什么是一个独立的 CronJob 而不是备份那一跑的一部分：演练要连源库、要建库、
# 要灌一整个库，任何一步出错都不该让当晚的备份算失败。两件事共用同一个包，但
# 一件的失败不能变成另一件的结果。
#
# 为什么是空库而不是空白命名空间：`CREATE DATABASE` 给的是一个没有表、没有行的
# 目标，这正是「恢复到一个干净的地方」要的东西；而空白命名空间要再拉一套
# Postgres/Qdrant/Secret，演练还没开始就先考验了一遍安装。演练跑在自己的 Pod、
# 自己的库名里，源 schema 一个字节都不碰——账表是同一批人要看的那张表，拿它当
# 演练场就是把要证明的东西押上去。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cogneva-backup-drill
  namespace: {{ include "cogneva.namespace" . }}
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: backup-drill
spec:
  schedule: {{ .Values.backup.drillSchedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  # 同备份：两次演练同时在跑只会在同一个库名上互相删库。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # 演练失败不重试成串：答案已经落进 backup_drills 了，下一晚自然再来。
      backoffLimit: {{ .Values.backup.drillBackoffLimit }}
      activeDeadlineSeconds: {{ .Values.backup.drillDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cogneva
            app.kubernetes.io/component: backup-drill
        spec:
          restartPolicy: Never
          # 同备份：演练必须与备份跑在同一个专用非 root uid 上。它读的正是备份
          # 写下的包，两个 uid 不一致时「谁能读包」就取决于属主漂到哪一边。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          # 同备份：演练是唯一同时看得到三处凭证目录的进程，它把「不是 0700 的
          # 目录」量成违例。主容器为了不写卷是只读挂载，收紧权限放在 init 里、
          # 用可写挂载做——只读挂载上 chmod 会直接失败。收紧之前先把属主交给
          # 主容器的 uid：0700 的目录对非属主连遍历都不给。
          initContainers:
            - name: tighten-credential-surface
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              command:
                - sh
                - -c
                - >-
                  chown -R 1001:1001 /backups{{ if .Values.backup.offsiteHostPath }} /offsite{{ end }}{{ if .Values.backup.offsiteStateHostPath }} /offsite-state{{ end }} &&
                  chmod 0700 /backups{{ if .Values.backup.offsiteHostPath }} /offsite{{ end }}{{ if .Values.backup.offsiteStateHostPath }} /offsite-state{{ end }}
              volumeMounts:
                - name: backup
                  mountPath: /backups
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                {{- end }}
                {{- with .Values.backup.offsiteStateHostPath }}
                - name: offsite-state
                  mountPath: /offsite-state
                {{- end }}
          containers:
            - name: drill
              image: {{ include "cogneva.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # 最新那份 ＋ 窗口里最久没被成功打开过的一份：只开最新证明不了保留
              # 窗口的其余成员，而旧包与读端不同步的问题只在旧包上出现。
              args: ["backup-drill", "--also-unproven"]
              env:
                # 单趟预算：一份包从解包到对数完。到点由这一跑自己收尾并落一行
                # `failed`，而不是等 Job 的界把进程杀掉——被杀掉的那一趟账上
                # 一行都不留，「被杀」于是读作「没跑过」。与
                # `jobTemplate.spec.activeDeadlineSeconds` 是一对。
                - name: COGNEVA_BACKUP_DRILL_PASS_BUDGET_SECS
                  value: {{ .Values.backup.drillPassBudgetSeconds | quote }}
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cogneva-secrets
                      key: pg-password
                # 演练连的是**源库**：它要在同一个服务器上建演练库，并把装回来的
                # 账行与源库那几行逐格比。这不违反「不在源库上做演练」——遍历的
                # 是另一个数据库名，源 schema 只被读。
                - name: COGNEVA_DATABASE_URL
                  value: {{ printf "postgres://cog_user:$(PG_PASSWORD)@postgres.%s.svc.cluster.local:%d/cogneva" (include "cogneva.namespace" .) (int .Values.backends.postgres.port) | quote }}
                {{- with .Values.backup.packageKeySecret.name }}
                # 读包要同一份口令：加密包在演练里解不开会让当晚 outcome=failed，
                # 所以写包、演练、恢复三处的注入必须同一步上线。
                - name: COGNEVA_BACKUP_PACKAGE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ . | quote }}
                      key: {{ $.Values.backup.packageKeySecret.key | quote }}
                {{- end }}
                {{- with .Values.backup.offsiteHostPath }}
                # 只读：演练遍历卷外那一份，看它是不是刚装回去的这个包。
                - name: COGNEVA_BACKUP_OFFSITE_DIR
                  value: "/offsite"
                {{- end }}
                {{- with .Values.backup.offsiteStateHostPath }}
                # 宿主定时器的观察文件：仓库里最新一份的时刻、最新一把钥匙的
                # 创建时刻。由那一跑自己读仓库写下，演练只读；文件不在 = 这一
                # 面没量过，账本留空列，规则读作「从来没人观察过」。
                - name: COGNEVA_BACKUP_OFFSITE_STATE_DIR
                  value: "/offsite-state"
                {{- end }}
              resources:
{{ toYaml .Values.backup.drillResources | indent 16 }}
              volumeMounts:
                # 只读：演练打开包，绝不写卷。保留的一份都不动。
                - name: backup
                  mountPath: /backups
                  readOnly: true
                {{- with .Values.backup.offsiteHostPath }}
                - name: offsite
                  mountPath: /offsite
                  readOnly: true
                {{- end }}
                {{- with .Values.backup.offsiteStateHostPath }}
                # 只读：观察文件是宿主定时器写的，演练只读不写。
                - name: offsite-state
                  mountPath: /offsite-state
                  readOnly: true
                {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: cogneva-backup-pvc
            {{- with .Values.backup.offsiteHostPath }}
            - name: offsite
              hostPath:
                path: {{ . | quote }}
                type: DirectoryOrCreate
            {{- end }}
            {{- with .Values.backup.offsiteStateHostPath }}
            - name: offsite-state
              hostPath:
                path: {{ . | quote }}
                type: DirectoryOrCreate
            {{- end }}
{{- end }}
