# 部署 profile：K3s 多节点（元启动声明 COGNEVA_CLUSTER_NODES 或探测到多节点）。
#
# 渲染：bash deploy/scripts/render-deploy.sh
# 产物：deploy/rendered/k3s-multi/
#
# 与 k3s-single 的唯一拓扑差异：git-remote 用集群卷（PVC）而非宿主
# hostPath——hostPath 只存在于元启动所在节点，evolution/主应用调度到
# 其他节点即 FailedMount 或空仓库。空卷首挂由 initContainer 从公开
# 仓库 seed bare 仓库（CN 网络下元启动把 seed 地址替换为 Gitee）。
# 多节点镜像供给（image-server + 分发器 DaemonSet）由元启动按多节点
# 流程单独投递，不在应用拓扑内。

image:
  tag: local

secrets:
  create: false

ingress:
  # 与 k3s-single 同因：K3s 自带 traefik 并把它标成默认 IngressClass，取 traefik
  # 才走 chart 的 traefik 分支（注解 + WebSocket/安全头 Middleware）。
  className: traefik

resourceGovernance:
  # 额度本身不用在这里给：它由渲染集投影出来（容器声明、副本数、滚动重叠），
  # 唯一跟节点数有关的是 DaemonSet 逐节点铺开后有几个 Pod，而节点数也不是这里
  # 的一个数——投影器在渲染宿主上从 live cluster 读，多节点宿主渲染出来就是多
  # 节点额度。没有集群的机器渲染这份 profile 时要显式给拓扑（`COGNEVA_NODES=N`
  # 或 `--nodes N`），投影不会替它猜一个 1。
  enabled: true

evolution:
  gitRemote:
    mode: pvc

gitops:
  kubectlBin:
    enabled: true
    hostPath: /usr/local/bin/k3s

mainlineDeployer:
  # 发布清单目录跟着 profile 走：这个部署的权威面是它自己的预渲染目录，而不是
  # 单节点 K3s 的静态基线 deploy/k3s——后者装的是单节点的宿主路径与 k3s 形态，
  # 指过来会把那些形态一并下发。k3s-single 不写这一条，它的权威面就是
  # deploy/k3s（两者逐字段对齐，parity 门禁守）。
  manifestDir: "deploy/rendered/k3s-multi"

buildah:
  containerdSocket: /run/k3s/containerd
