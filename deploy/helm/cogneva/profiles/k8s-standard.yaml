# 部署 profile：标准 K8s 生产集群（非 K3s：kubeadm/EKS/自管 containerd）。
#
# 渲染：bash deploy/scripts/render-deploy.sh
# 产物：deploy/rendered/k8s-standard/
#
# 与 K3s profile 的环境差异全部固化在本文件：
# - 不创建 cogneva-local-retain StorageClass（其 provisioner
#   rancher.io/local-path 仅 K3s 自带）；所有 PVC 不写 storageClassName，
#   跟随集群默认 SC。元启动在部署前硬校验默认 SC 存在，缺失即报错并提示
#   先装 Longhorn 等并设为默认。
# - buildah 挂标准 containerd socket /run/containerd（K3s 是
#   /run/k3s/containerd）。
# - git-remote 走集群卷（生产即多节点语义；PVC 空卷自动从公开仓库 seed）。
# - GitOps 拉取端的 kubectl 二进制默认不挂宿主文件：标准节点没有 k3s
#   多调用二进制，宿主 /usr/bin/kubectl 不一定存在。元启动探测到可用
#   kubectl 时可在渲染/安装时覆盖 gitops.kubectlBin.enabled 与 hostPath。

image:
  tag: local

secrets:
  create: false

resourceGovernance:
  # 生产集群默认不开。这不代表"配额只能给 K3s 用"——额度由渲染集投影出来
  # （见 deploy/scripts/project-resource-governance.py），同一套清单在任何规模的
  # 集群上都算得出自己的额度。不开的理由是另一条：生产集群上还会有人往这个命名
  # 空间里放不在渲染集里的东西，而一份人没复核过的天花板在被撞到时，症状是
  # `FailedCreate: exceeded quota`，比"暂时没有天花板"更难查。要开就先把节点数
  # 声明对（DaemonSet 逐节点进算式），再把下面两行改成
  #   enabled: true / clusterNodes: <N>
  # 然后重跑 deploy/scripts/render-deploy.sh —— 额度是按这两个数投影出来的，
  # 只用 --set 打开等于让集群收到一份没算过这份拓扑的产物。
  # K3s 两个 profile 默认开启。
  enabled: false
  clusterNodes: 1

storage:
  localRetainClass:
    create: false
  # 空字符串 = 模板不输出 storageClassName，PVC 跟随集群默认 SC。
  evolution: ""
  retain: ""

evolution:
  gitRemote:
    mode: pvc

# 卷账的全集面（claim-store DaemonSet）在这个 profile 下关闭：它走查的是 K3s
# local-path provisioner 的存储根（/var/lib/rancher/k3s/storage），标准集群里没有这个
# 目录；而且生产集群的卷通常是真正的 CSI 卷（Longhorn 等），kubelet 报的 per-volume
# 用量在那里是这张卷自己的，不需要宿主侧再走一遍。
claimStore:
  enabled: false

gitops:
  kubectlBin:
    enabled: false

mainlineDeployer:
  # 发布清单目录跟着 profile 走：这个部署的权威面是它自己的预渲染目录。指到
  # deploy/k3s 会把单节点 K3s 的宿主路径与套接字形态下发到标准 K8s 集群上
  # （那些字段是 k3s profile 的环境差异，正是本文件开头列的那几条）。
  manifestDir: "deploy/rendered/k8s-standard"

buildah:
  containerdSocket: /run/containerd
