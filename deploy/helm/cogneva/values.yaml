global:
  namespace: cogneva
  # K3s 默认 local-path；生产可换 longhorn 等
  storageClass: local-path

image:
  repository: localhost/cogneva
  tag: "0.1.39"
  pullPolicy: IfNotPresent

gateway:
  # 单副本：单节点集群双副本无可用性收益，只放大内存与凭证副本；多节点后调回 2
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# 独立安全网关：代持全部敏感凭证，沙盒 Pod 零凭证
securityGateway:
  enabled: true
  replicas: 1

# 自进化 worker（特权容器 = 文件系统沙盒边界；接 image-based 滚动更新后可关特权）
evolution:
  enabled: true
  # git-remote 供给方式：pvc = 集群卷（多节点/生产，空卷自动从 seedUrl 拉 bare 仓库）；
  # hostPath = 单节点开发态直挂宿主 bare 仓库（宿主 <-> Pod 双向同步通道）
  gitRemote:
    mode: pvc
    hostPath: /root/omc_workspace/cogneva.git
    seedUrl: https://github.com/hcipengm/cogneva.git
    storage: 5Gi
  configHostPath: /root/omc_workspace/cogneva/cogneva.json
  sandboxStorage: 20Gi
  sourceStorage: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# 可选后端；禁用即假定使用外部服务（在 config 中指向外部地址）
backends:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
  redis:
    enabled: true
    image: redis:7-alpine
    storage: 5Gi
  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.13.4
    storage: 10Gi
  nats:
    enabled: true
    image: nats:2.10-alpine
    storage: 10Gi

# 明文默认值仅用于开发；生产请用 --set-file 或外部 Secret（然后 secrets.create=false）
secrets:
  create: true
  dbPassword: "changeme"
  pgPassword: "changeme"
  redisPassword: ""
  llmApiKey: ""

ingress:
  enabled: true
  className: traefik
  host: cogneva.local

networkPolicy:
  enabled: true
