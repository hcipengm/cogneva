    # why: being true the first time the cache outgrows it -- the growth the cap exists to catch, and the one a
    # why: pinned value cannot notice. `0` still means measure without bounding, and a positive number still
    # why: overrides.
    # published: owner=crates/cog-reflection/src/plugin.rs file=crates/cog-core/src/build_cache_readings.rs metric=BUILD_TARGET_CAP_METRIC label=source cadence=periodic
