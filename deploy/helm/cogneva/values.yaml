# 宿主机文档整理：把文档所在的目录**窄挂载**进沙箱执行器，让平台代文档属主
# 整理这些文档。边界是挂载范围而不是白名单代码——只把属主自己的目录挂进来，
# 宿主其余部分根本不在这台容器的文件系统里，于是没有"判断写错"的余地。
# 默认 `scopes: {}` = 能力关闭：执行器不挂任何宿主目录，文档路由答 409。
#
# key 是 scope 名（= 文档属主的身份），value 是该属主在**宿主**上的目录。
# 容器内挂载点固定为 `<mountPath>/<name>`；`hostPath.type: Directory`（不是
# DirectoryOrCreate）——路径写错就 Pod 起不来，而不是在宿主上凭空建一个空目录。
# 执行器以 uid 1001 运行，宿主目录要对该 uid 可写，否则第一次写入会以明确错误失败。
hostDocuments:
  scopes: {}
  mountPath: /opt/cogneva/host-docs
  # 回滚日志落在执行器自己的持久卷上：日志随进程一起消失的部署，等于没有回滚。
  journalDir: /opt/cogneva/sandbox/host-docs-journal
  # 单份文档的重写上限（字节）。回滚要留一份原文副本，这个上限同时界住了
  # 一次操作与一份日志的大小。
  # tunable:
  # why: The largest single rewrite, which also bounds the rollback journal's copy. An interface bound: the
  # why: operation is atomic in one call, not a stream.
  maxWriteBytes: 8388608
  # The largest single read (bytes). **Deliberately not tied to the audited channel's
  # bound**: that one is a gateway-process quantity limiting how much text leaves, this
  # one limits the bytes the executor reads into memory at once. The two values being
  # close is a coincidence; tying them together would silently drag one side when the
  # other is adjusted.
  # tunable:
  # why: The largest single read. Deliberately not tied to the audited channel's body bound: that one limits
  # why: how much text leaves through a model, this one limits bytes read into memory at once. The two being
  # why: close is a coincidence, and tying them would drag one side when the other moves.
  maxReadBytes: 8388608
  # Whether document bodies may leave the cluster (the switch on the audited channel),
  # off by default. While it is off, organising uses metadata plus the local
  # embedding/reranker only (the in-memory side already has configuration for both);
  # with it on, bodies may enter a model through the audited channel. The judgement sits
  # in the gateway process -- the only place that can refuse the request; the executor
  # reads the same variable only to avoid sending a request bound to be refused.
  bodyEgress: false
  # How long a staged plan stays approvable (seconds). **It is also the validity of an
  # approval**: past the window, an approved plan no longer executes -- approving
  # something nobody has looked at for a long time is no different from acting
  # unattended in the middle of the night.
  # A floor of 60s (the executor clamps anything smaller): a value far below the floor is
  # almost certainly a unit mistake.
  # tunable:
  # why: How long a staged plan stays approvable, which is also the validity of an approval. Every approval
  # why: records how long it sat between staging and approval; the window is 1.25x the slowest approval of
  # why: the last 30 days, never below the declared seed. Only the observed tail can widen it: an approval
  # why: that never happened is not a measurement, and shrinking on a quiet month would cut off the reader
  # why: the window exists for. The published gauge `sandbox_host_docs_approval_ttl_seconds` carries
  # why: `source=derived` once a measured approval sets it and `source=seed` while the declared value is in
  # why: force; the evaluations counter is the beat evidence.
  # published: owner=crates/cog-extension/src/hostdocs.rs file=crates/cog-extension/src/hostdocs.rs metric=APPROVAL_TTL_METRIC label=source cadence=event
  # proof: file=crates/cog-extension/src/hostdocs.rs test=the_approval_window_follows_the_measured_latency beat=a_measured_approval_widens_the_next_window_and_the_beat_counts evidence=APPROVAL_TTL_EVALUATIONS_METRIC
  approvalTtlSecs: 86400
  # The largest plan that may be staged for approval (bytes). Same order as a single read:
  # a plan carrying more text than a single write may carry would make "approved" mean
  # something other than what it says.
  # tunable:
  # why: A plan is staged for approval and has to be legible in one sitting, so it shares the single-read
  # why: order of magnitude rather than tracking storage. It is an interface bound, not a capacity dial.
  maxPlanBytes: 8388608
  # The name-based classification table, `bucket:ext,ext;bucket:ext`. **Empty means the
  # table built into the process**, which is the default on purpose: a second copy of that
  # table here would be a second thing to keep in step, and its drift shows up as a folder
  # that is silently never sorted.
  classifyRules: ""
  # The two seeds one classification question starts from: how many wire bytes of one body
  # it may carry, and how many files it may cover. They are the floor the plan may raise but
  # never lower -- the plan follows the largest question this channel answered, and probes a
  # larger one only within the audited channel's bound (securityGateway.auditedLlmMaxBodyBytes).
  # The numbers in force are published as `sandbox_host_docs_assist_body_bytes` and
  # `sandbox_host_docs_assist_question_files` with a `source` label; a folder that does not
  # fit is not asked about at all, because a partial answer would make the plan depend on
  # which files happened to fit.
  # tunable:
  # why: How many wire bytes of one body a classification question carries. The plan is recomputed on every
  # why: organize run that reaches the model station. Its window is the largest request this audited channel
  # why: answered, floored by the deployment's own practice (this seed times the candidate seed plus the
  # why: prompt's fixed text) and capped by the channel's audited body bound
  # why: (`securityGateway.auditedLlmMaxBodyBytes`, handed over as `HOST_DOCS_ASSIST_AUDIT_BUDGET_BYTES`).
  # why: The per-body prefix is at least this seed and at most what a typical file in the folder needs, so a
  # why: question carries whole files when it can and never less of a body than the deployment called
  # why: evidence. The request is counted in the bytes the channel's bound counts -- the serialized body,
  # why: escapes included -- and a question larger than the window is only probed when the audit bound or a
  # why: smaller failure says it fits; a probe that fails caps the next one at one byte under it. The two
  # why: numbers in force are published as `sandbox_host_docs_assist_body_bytes` and
  # why: `sandbox_host_docs_assist_question_files` under a `source` label, and each recompute is counted on
  # why: `sandbox_host_docs_assist_plan_evaluations_total`: the value not moving and the loop not running
  # why: have to be different readings. The seed is the floor while nothing has been measured, not a ceiling.
  # published: owner=crates/cog-extension/src/hostdocs.rs file=crates/cog-extension/src/hostdocs.rs metric=ASSIST_BODY_BYTES_METRIC label=source cadence=event
  # proof: file=crates/cog-extension/src/hostdocs.rs test=the_question_plan_follows_the_answered_question_and_the_beat_counts beat=the_question_plan_follows_the_answered_question_and_the_beat_counts evidence=ASSIST_PLAN_EVALUATIONS_METRIC
  assistBodyBytes: 2048
  # tunable:
  # why: How many files one classification question covers. Same loop and same window as the body prefix
  # why: above: the count in force is the window's capacity at that prefix, raised by what the channel has
  # why: answered. A folder larger than the plan still covers is asked about in full only when a probe is
  # why: allowed (the audited channel's bound, or a failure above the size being tried); otherwise the run is
  # why: refused as `over_candidates` rather than asked about in part, because a partial answer would make
  # why: the plan depend on which files happened to fit. The count in force is published as
  # why: `sandbox_host_docs_assist_question_files` under `source`, with the same evaluation counter behind
  # why: it. The seed is the floor, not a ceiling.
  # published: owner=crates/cog-extension/src/hostdocs.rs file=crates/cog-extension/src/hostdocs.rs metric=ASSIST_QUESTION_FILES_METRIC label=source cadence=event
  # proof: file=crates/cog-extension/src/hostdocs.rs test=the_question_plan_follows_the_answered_question_and_the_beat_counts beat=the_question_plan_follows_the_answered_question_and_the_beat_counts evidence=ASSIST_PLAN_EVALUATIONS_METRIC
  assistMaxCandidates: 50

# 节点镜像构建（buildah DaemonSet）：每节点提供 buildah 能力，产物导入节点
# containerd 作暖缓存；工作负载运行时镜像权威走集群内 registry（见 image.repository）。
# containerdSocket 是容器运行时 socket 在宿主的路径，随发行版不同：
#   标准 containerd（kubeadm/EKS 等）= /run/containerd
#   K3s  = /run/k3s/containerd
#   k0s  = /run/k0s/containerd （按实际核对）
# 生产多节点改用外部镜像仓库时可关闭（镜像走 registry 拉取而非节点内构建）。
buildah:
  enabled: true
  image: quay.io/buildah/stable:latest
  # 与业务镜像分策略：这是外部第三方镜像，不是集群内 registry 的浮动签。
  # 不跟 image.pullPolicy 的 Always——外网不可达时 Always 会让容器起不来，
  # 直接废掉构建能力；这份 :latest 只在节点首次需要时拉一次。
  pullPolicy: IfNotPresent
  containerdSocket: /run/containerd
  storageHostPath: /var/lib/cogneva-buildah
  resources:
    # 常态是纯守护进程（实测常驻 ~1Mi），构建尖峰由 limit + 节点实际余量
    # 承接；request 按常驻实耗定，不为偶发构建常年锁住半 G 调度额度
    # （小节点上这会挤得短作业排不进来）。
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 250m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 64Mi
