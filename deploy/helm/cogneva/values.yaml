global:
  namespace: cogneva

# 存储类适配（空字符串 = 不设置 storageClassName，跟随集群默认 SC）：
# postgres/redis/qdrant 一律跟随默认 SC（K3s 默认 local-path，生产设 Longhorn 为默认）；
# evolution 卷显式 local-path；nats 与多节点 git-remote 用 Retain SC 防误删。
storage:
  # K3s 专有 Retain StorageClass（provisioner rancher.io/local-path，标准 K8s 无此
  # provisioner）：k3s profile 开启；标准 K8s 置 create:false 并把 retain 置空。
  localRetainClass:
    create: true
    name: cogneva-local-retain
    provisioner: rancher.io/local-path
  evolution: "local-path"
  retain: "cogneva-local-retain"

# 资源治理（元启动第三步：限制 Agent/沙盒把节点资源耗尽）。ResourceQuota 约束
# 命名空间总量，LimitRange 给未声明 resources 的容器兜底并夹紧单容器上下限——
# 缺了前者，一次失控的沙盒任务就能占满节点；缺了后者，没写 resources 的容器
# （安全网关就没写）按**无限**算，配额也就形同虚设。
#
# **本段不写额度数值。** 额度不是环境参数，是这套清单自己的函数：容器声明了多大、
# 副本有几个、滚动时同时存在几个 Pod、PVC 声明了多少——额度必须装得下这些，多
# 一个字节都是浪费，少一个字节则下一次滚动在准入被拒。所以它由
# `deploy/scripts/project-resource-governance.py` 从渲染集投影出来，每个 profile
# 落一份 `values.resource-governance.<profile>.yaml`（带 GENERATED 头，不要手改），
# 渲染新鲜度门禁核「文件 == 重新投影」。手写过的那份数在历史上漂过不止一次，形态
# 都一样：工作负载长大了、额度没跟，而现场读起来是"这一版永远滚不上去"。
#
# 只有两项不是渲染集算出来的，因为没有任何清单能告诉渲染器它们是多少：
#   - runtimeWorkloads：渲染集之外、**不由产品创建**的 Pod 的形状。产品自己创建
#     的那部分不在这儿声明——建它的代码按自己的清单把额度抬到装得下，见下面；
#   - clusterNodes：DaemonSet 逐节点铺开后有几分 Pod。它随拓扑变，所以由 profile
#     给（单节点 profile 就是 1），投影按 profile 里的这个数算。多节点时把它改成
#     实际节点数并重跑 render-deploy.sh——**两个数必须同一次改**：只改 profile 不
#     重跑投影，额度仍是单节点的，多出来的节点上的 DaemonSet Pod 会在准入被拒。
resourceGovernance:
  enabled: true
  clusterNodes: 1
  # 渲染集之外、由产品自己在运行期建的 Pod（评测台按题起一台），它们不进渲染集，
  # 却和渲染集里的 Pod 抢同一份额度。**这里一个数也不写**：那台 Pod 有多大，只有
  # 建它的那份代码知道（容器的 limits 就在它写出的清单里），所以由它自己在创建前
  # 按清单算出占多少、把额度抬到装得下（跑完再放回去），而不是在这里预写一份
  # "留多少核"的预算——预算写大了浪费、写小了那台 Pod 进不去，而它跟着代码走就
  # 不会错位。这个键留给**不由产品创建、也不会自己抬额度**的那类 Pod：那样一台
  # Pod 只能在这儿声明整台的形状，由投影加进同一条求和。空列表不是省略，是"没有
  # 这一类"；投影读不到这个键要报错，而不是当作 0。
  #
  # 现在列表里只有一台：宿主侧注册评测的补跑（宿主的
  # `scripts/host/eval-registered-rerun.sh` 直接 `kubectl apply` 一台 Pod）。它由
  # 宿主脚本建、不是产品建的，也不认识额度——所以它要么在下面声明，要么就**从别的
  # 用途的预留里借地方**。2026-10-26 本机实测借走的是滚动那份额度：这台 3Gi 的 Pod
  # 在跑时，`cogneva` 那一笔滚动的 surge 需要一个完整的新 Pod（12Gi，同一次实测），
  # 准入算出来 `58Gi + 12Gi > 69Gi`（这台机器），部署器按设计扣住不动，连续两轮
  # mainline 一个 rev 都没上去（16:54:17Z 与 17:09:40Z 两次，`limits.memory` 同一条
  # 短差）。**滚动的重叠额度不是余量**：它已经被算进天花板，任何第三方 Pod 吃掉的都是
  # 它。所以这台 Pod 的形状在这里声明一次，天花板按它加发一份，surge 那份就不再被借。
  #
  # 三个数必须与那份脚本里写出的清单逐字相同（limits 与 requests 都算），改一边就得
  # 改另一边；`scripts/host/eval-registered-rerun.test.sh` 比对这两处，单独改哪边都红。
  runtimeWorkloads:
    - name: eval-registered-rerun
      cpuLimit: "2"
      memoryLimit: 3Gi
      cpuRequest: 500m
      memoryRequest: 1Gi
  limitRange:
    # 下面四项是**策略**而不是投影：它们管的是"没有声明 resources 的容器按什么
    # 算"。上限（max）与单卷上限由投影给，因为它们必须 ≥ 渲染集里最大的那份声明，
    # 低了那份声明在准入就被拒——那不是"更安全"，是那句话根本进不来。
    defaultCpu: 500m
    defaultMemory: 512Mi
    defaultRequestCpu: 50m
    defaultRequestMemory: 64Mi
    minCpu: 10m
    minMemory: 16Mi
    pvcMinStorage: 1Gi

# 应用数据目录根（/var/lib/cogneva-data）：实例身份 identity.json、学习数仓
# warehouse、进化策略 policies、记忆 memory、原始日志 raw-logs、对象存储后端都
# 落在这里。必须跨 Pod 重启存活——身份文件一旦丢失，实例名就会随每次重启的机器
# 指纹重算，按实例命名的资源（沙盒工作树、evol/ 分支）随之逐次遗留，数仓与策略
# 也一并清零。主应用与进化 Pod 各挂一个卷：两者以不同 UID 运行，共享同一 RWO 卷
# 时 kubelet 的 fsGroup 会互相改属主。
appData:
  # 声明量是策略的函数：稳态占用 ≈ 热窗口内的写入量 + 压缩后的 warm 层 +
  # 记忆/数仓等杂项。热窗口内的写入量随 agent 活动量变化，是这里唯一必须由
  # 部署方复核的输入（本机一整天全速跑：主应用 ≈ 18G 热 trace + 0.2G warm +
  # 0.7G memory ≈ 19G，取 24Gi 留头寸）。写小了不会有任何系统报错——目录型
  # 卷不强制 requests.storage，声明与实际之间没有对账机制；应用自己把实测
  # 占用发成 cogneva_data_volume_used_bytes，由规则 data_volume_over_declared_size
  # 比对，这是唯一能发现声明写小的观测面。
  storage: 24Gi
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

# 本地模型权重（BGE-M3 嵌入）：加载器只从磁盘读，集群到不了 model hub。
#
# 这个开关**一处管两件事**：把宿主上的权重目录只读挂进主应用 Pod，并同时把
# `memory.load_embedding_model` 与 `memory.load_reranker_model` 打开。两者必须
# 同时成立——只挂不打开等于白挂，只打开不挂会让加载器读不到权重而**静默退回
# 网络**，在一个连不上 hub 的集群里那次拉取既不成功也不失败，插件的 init 会挂到
# liveness 杀 Pod 为止。所以它们不由几个开关分别控制，desync 在结构上不可能发生。
#
# 卷里要**两份**权重（`--model bge-m3` 与 `--model reranker` 各抓一次）：重排与
# 嵌入是不同模型，少一份的后果同上，而两个开关是一起翻的，所以缺哪一份都不会
# 只用能用的那份跑——都在同一个目录里，目录不全就是起不来。
#
# 为什么只有宿主目录、没有集群卷：多节点上一个 hostPath 只存在于一台节点，
# 换节点就挂不上，本该走 PVC——但权重进卷今天**没有产出方**（2.2GiB 的 ONNX
# 权重得先有人放进去）。挂一个空卷比不挂更坏：它同样静默退回网络，症状还是
# init 挂死，而"卷挂了"看起来又像已经配置好了。所以多节点 profile 保持关闭，
# 等有一条权重进卷的路径再开。
modelWeights:
  enabled: false
  # 由 deploy/scripts/fetch-model-weights.sh 落在这里，`--model bge-m3` 与
  # `--model reranker` 各跑一次（hf-hub 自己的缓存布局，进程起来后一个字节也不
  # 下载）。脚本按 hub 声明的哈希逐份校验，所以坏字节进不来；但它只抓点名的那一
  # 个模型，**两跑都做**才是这个目录的完整定义。
  hostPath: /srv/cogneva/models/fastembed

# 数据面备份：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象 raw 层 +
# 实例身份 Secret）打成 tar.zst 落 cogneva-backup-pvc。重启档由 PVC keep
# 策略覆盖，本备份覆盖重装/换机档（restore-from-package.sh 消费）。
backup:
  enabled: true
  # 每日 03:17：错峰，避开整点/半点的集群任务共振。时刻按下面的 timeZone
  # 解释，不跟随宿主 local。
  schedule: "17 3 * * *"
  # 触发时刻所属的 IANA 时区。**必须显式给值**：CronJob 的 spec.timeZone 为空时
  # 由 kube-controller-manager 所在节点的 local 解释，于是宿主时区一变（2026-09-26
  # 本机由 Etc/UTC 改成 Asia/Shanghai），这个平时没人盯的每日作业就静默漂 8 小时，
  # 而按 schedule 字面值做的任何核对都看不出这条漂移。备份的时点是我们自己定义的
  # 运维约定，就该由这里定，不该被"这台机器现在几点"改写。
  timeZone: "Etc/UTC"
  # 保留最新 N 份，更老的落盘即删。
  keepCount: 7
  # 一次运行最多能跑多久，秒。一个值两处承载：Job 的 activeDeadlineSeconds
  # （到点 kubelet 杀容器）和运行 env 里的同一个数（写进账本那一行，超期判断
  # 用它）。实测的运行时长记在账本 `backup_runs` 的 `started_at`→`finished_at` 上，
  # 最新一次是几十秒；一小时的界比它高一个数量级，落在里面的是正常
  # 运行、落在外面的那次是卡死了——而卡死的那次不杀掉，Forbid 会让后面每
  # 一次都不再开始。
  runDeadlineSeconds: 3600
  # 一个周期错过了多久还算数（秒）：控制器在错过起点后这段时间内仍会补跑一次，
  # 更早就直接放弃。两个 CronJob 读同一个数——它们错过的原因是同一类（节点忙、
  # Pod 排不上、前一次还没结束），一边宽一边窄只会让两种作业的漏跑时机不同。
  startingDeadlineSeconds: 1800
  # 留几份成功 / 失败的 Job 供翻现场：失败的多留一份，连挂两晚才看得出是不是
  # 同一个原因，只留一份时第二晚的诊断对象已经被回收。
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  # 跑完的 Job 与它的 Pod 多久后清掉（秒）：一天，够把当天的现场翻完，
  # 又不至于让对象和日志一直攒在 etcd 里。
  ttlSecondsAfterFinished: 86400
  # 失败重试几次：备份一次（下一晚自然再来，连着重试只会在同一个原因上撞几次），
  # 演练零次（答案已经落进 backup_drills 了，重试没有新信息）。
  backoffLimit: 1
  drillBackoffLimit: 0
  # 备份与演练都是流式作业（COPY→文件、tar.zst 流式压缩），常驻内存极小；
  # 请求按实耗定低，免得在资源紧张的小节点上调度不出来。两个 Job 各一份界，
  # 写在 values 里才进得了登记表（登记表只枚举本文件的数值叶子）。
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  drillResources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage: 10Gi
  # 恢复演练：把最新一个包装进一个跑完迁移的空库，逐表对数、把账行与源库逐格比，
  # 然后删库，答案落进 `backup_drills`。排在备份之后半小时：装的是当晚刚出的那一
  # 个包，而不是昨天的。时刻与上面同一个 timeZone 解释。
  drillSchedule: "47 3 * * *"
  # 一次演练最多能跑多久。一次运行开的是**两份**包，不是一份：最新那份，加上窗口
  # 里最久没被证明的那份（`--also-unproven`，第二趟只挑一份，成不成都不再接着开）。
  #
  # **这个界必须大于两份的单趟预算，两者是一对**：`drillPassBudgetSeconds` 是进程
  # 自己拿着的单趟界（到点它自己收尾并落一行 `failed`），这里是 Job 的界（到点把
  # Pod 杀掉，账上一行都不留）。2026-10-27 的现场就是这一对失配：单包实测已从
  # 497 s（实测 10-19）长到 2271 s（实测 10-27，本机 3.6 GB 的库），第一趟吃掉 38 min，第二趟在
  # 3600 s 的界上被杀，`backup_drills` 里没有那一行——于是「窗口里最久没被证明的
  # 那份」永远证明不了，读数读作「这一趟没跑过」。
  #
  # 关系由 `deploy/scripts/tests/backup-drill-budget-covers-both-passes.test.sh`
  # 盯着：界 ≥ 2 × 单趟预算 ＋ 余量。只改一个数会红，所以别只改一个。
  drillDeadlineSeconds: 7800
  # 单趟预算（秒）：一份包从解包到对数完。与 `drillDeadlineSeconds` 是一对，
  # 见上一条注释。数由 `COGNEVA_BACKUP_DRILL_PASS_BUDGET_SECS` 交给进程。
  drillPassBudgetSeconds: 3600
  # 备份卷之外的第二个落点：每跑完一次，新包再往这里复制一份，演练自己遍历它、
  # 把「卷外最新那份是不是刚装回去的这个包」记进 `backup_drills`。
  #
  # **它换掉的是什么，别读多**：备份卷是一块 local-path PV，删 PVC、卷被回收、
  # 换名字重装都会让它上面的包一起消失；卷外这条路径救的是这些。它**不救宿主
  # 丢失**——同一台机器上的另一条路径与备份卷在同一个故障域里，跨路径不等于跨
  # 机器。真正的异地（另一台机器 / 对象存储）要凭证，不在这份 values 能闭合的
  # 范围里，缺的那格在内部文档里记着。
  #
  # 多节点形态下 hostPath 只存在于跑这一趟的那个节点，演练可能落在别的节点上
  # 而看见空目录；那种部署应把这里指到一份共享挂载（NFS 等），而不是本机路径。
  # 空字符串 = 不配：两个 Job 都不挂载，于是「卷外一份都没有」由
  # `backup_offsite_copy_never_written` 报红，而不是悄悄当作已覆盖。
  offsiteHostPath: /var/lib/cogneva-offsite
  # 异地那一跑的**观察文件**落在宿主哪里。宿主 systemd 定时器把
  # `restic snapshots` / `restic key list` 读到的时刻写成一个文件（它的
  # StateDirectory，即 `/var/lib/cogneva-backup-offsite`），演练只读挂载它、
  # 把「仓库里最新一份是什么时候的、钥匙上一次换是什么时候」记进账本。
  # 与 `offsiteHostPath` 一样是宿主路径；空字符串 = 不挂，两个年龄读数读作
  # 「没量过」。定时器没装的时候它确实是没量过，不是零。
  offsiteStateHostPath: /var/lib/cogneva-backup-offsite
  # 包级加密的口令（A7b）：写包、演练、恢复都用这一个变量名。**这个 Secret 必须
  # 由操作者在装之前带外写进命名空间**，chart 不生成它——口令与密文同一台机器、
  # 同一个 Secret 仓库，就不叫「不落在同一台机器上」。
  #
  # 空 name = 不注入：下一个包仍走明文分支（日志留一条 warn），演练与恢复照旧能读
  # 旧的明文包。加密一旦启用，**写包与能读包的三处必须同一步上线**：加密包在演练
  # Pod 里解不开会让当晚 outcome=failed，看起来像「这份包装不回去」。
  packageKeySecret:
    name: ""
    key: package-key
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

image:
  # 工作负载统一从集群内 registry 的 NodePort 拉取（每个节点的 kubelet 经
  # localhost:<nodePort> 访问，containerd 对 localhost 默认 http 免 TLS）。
  # 不直接 pin 节点本地镜像名：ctr tag/import 得到的引用名不保证被 kubelet
  # 的镜像存在性判定采信，且静态清单/GitOps apply 后没有统一的浮动签权威。
  # :local 浮动签只由 bootstrap 播种、swap-image/mainline 收敛后前移。
  repository: localhost:30500/cogneva
  # 默认 tag = 应用版本（与 Cargo.toml workspace version 同源，发布脚本强制校验）。
  # 自举部署的 profile values 覆盖为 local（浮动签，随导入的 release 镜像走）。
  tag: "0.5.10"
  # 必须 Always：静态清单把四部署指回浮动签 :local，内容可被 bootstrap/swap-image
  # 重新播种。IfNotPresent 下节点缓存里那份旧内容会被无限期复用——tag 字符串没变、
  # registry 上 :local 也是新的，唯独节点跑的是旧二进制，任何基于清单/registry 的
  # 校验都看不出这条降级。Always 让浮动签的"拉取时解析"语义成立。
  pullPolicy: Always

gateway:
  # 单副本：单节点集群双副本无可用性收益，只放大内存与凭证副本；多节点后调回 2
  replicas: 1
  # 主应用的五个端口。这五个数此前各写三到六遍：容器端口、Service、configmap 里的
  # env、files/cogneva.json（进程真正按它监听的那一份）、网络策略、ingress、
  # NOTES.txt 里的 port-forward。改一个端口要手工改七处，漏一处只在真流量上现形
  # ——Service 与容器端口不一致时 Endpoints 照建、连接全被拒，读起来像"进程挂了"。
  # 现在只有这一份，模板与 JSON 都从它取。
  httpPort: 8080
  # WebSocket 面：WebUI 的长连接。与 httpPort 分开是为了让 ingress 能只把长连接
  # 那条路单独放行/加超时。
  wsPort: 8081
  # 零凭证的集群内面：只挂 memory 的工具输出归档与 Raw 读。它与 httpPort 分开不是
  # 为了换路径，是为了换判据——主 API 的 memory 路由按角色判，跑 squad 的 Pod 零
  # 凭证恒吃 401，所以判据改成"按网络事实"，挂在网络策略上。0＝不开这个监听。
  internalPort: 8085
  # 平台 webhook 的转发入口：安全网关验签之后才递进来，因此它自己不再判签名。
  webhookPort: 9091
  # 进程被告知的指标端口（cogneva.json 的 gateway.metrics_port，经 configmap 的
  # COGNEVA_METRICS_PORT 注入同一份配置）。抓取侧走 httpPort 的 /metrics，所以
  # 这两个数必须同源：改一处而漏另一处，只会让两边各说一半。
  metricsPort: 9090
  # 内存这一档按**量出来的**占用给，不按权重文件大小推。进程自己报出生占用
  # （`cogneva_boot_rss_bytes`，按启动阶段各一拍，值是那一刻整进程的 VmRSS）：
  # 实测 2026-10-26，三份权重各建一个 session 后进程以 4.52GiB 开始服务（三个
  # 阶段实测的累计值依次是 1.69GiB、3.08GiB、4.46GiB，后一个含前一个。这些页
  # 实测是私有匿名页（`smaps_rollup` 的 Anonymous/Private_Dirty 与 VmRSS 同量级），
  # 容器里不可回收，所以 limit 必须真装得下，不能靠回收兜底。单容器上限默认由
  # LimitRange 压住，再往上会被准入拒掉。
  #
  # 2026-10-26 8Gi → 12Gi：8Gi 那档量的是**出生**，而出生那一拍不是最高的那一拍。
  # 实测同一个进程起来后跑几轮真实取数就稳在 6.46GiB，连续十分钟不涨（不是泄漏，
  # 是 ONNX 的推理工作区在第一次推理时才落页），再叠上并发高峰就贴住上限——
  # 实测 24 小时内每一代都停在 7.8–7.98GiB 然后被 OOMKilled（最近一次退出码 137，
  # `check-container-headroom.sh` 的判据 1 与判据 2 同时命中）。
  # 峰值读数在这里不能用来定档：容器被自己的上限杀掉时，`container_memory_rss` 的
  # 24 小时峰值就是这个上限减一个采样间隔，它报的是**天花板**，不是需求量。所以档位
  # 取可观测的那两段：实测出生 4.52GiB、暖机后 6.46GiB 的稳态，加上峰值至少要的那
  # 截（实测下界 7.98GiB）。12Gi 对稳态度留 1.85 倍、对观察到的峰值留 1.5 倍。
  # 若下一代仍贴住这一档，说明增长没有界，那时候要查的是权重共享（dense 与
  # sparse 两个 session 各装一份同一份权重文件）或泄漏，而不是再抬一次天花板。
  #
  # requests 6Gi：request 声明的是调度器为这个 Pod 预留多少，而实测暖机后的稳态
  # 实测就在 6.46GiB 上下——低于它等于把本 Pod 排到节点压力的第一个驱逐位。这次抬完命名
  # 空间 requests 合计约等于稳态之和，仍在节点可分配量与配额之内（见投影产物）。
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
    limits:
      cpu: 4000m
      memory: 12Gi

# git 身份基线（owner/name）。两个进程消费同一个值，所以定义在共享层而不是
# 挂在任一侧名下——拆成两份必然漂移，而漂移的后果是无声的：自举登记的仓库与
# 选路探测的仓库一旦不同，SSH 自证就永远握手不过，身份停在 pending。
#   - 主应用进程：git 身份自举的后台循环跑在这里——它同时握着自举需要的三样
#     东西（两片 Secret 的读写权、到达 GitHub 的 egress、以及网关部署的
#     滚动权），所以生成的公钥由它登记成这个仓库的部署密钥，并滚网关让私钥
#     被兜底通道读进去。空 = 不自动登记，只把公钥挂到 WebUI 等人给 token。
#   - 安全网关：传输选路的实测拿它当探测目标，SSH 兜底也用它拼远端前缀。
gitIdentity:
  repo: hcipengm/cogneva

# 独立安全网关：代持全部敏感凭证，沙盒 Pod 零凭证
securityGateway:
  enabled: true
  replicas: 1
  # 网关的三个监听面，与容器里的端口名一一对应（名字不改，Service 的 targetPort
  # 按名字引用它们）。这三个数此前写满整棵 chart：容器端口、Service、网络策略的
  # 两侧放行、webhook Service，以及主应用与进化 Pod 里九个指向
  # `http://cogneva-security-gateway:8081/...` 的地址——改端口时漏掉任何一处，
  # 症状都是「凭证代持面不可达」，而它读起来像上游平台挂了。
  #
  # 出站代理（名称 egress-proxy）：git 传输与平台 API 透传走它。
  egressProxyPort: 8080
  # LLM 代理（名称 llm-proxy）：全部上游模型调用与 /github、/gitee、/git、
  # /search-fallback 这些透传路由都在这个端口上——业务侧那九个 URL 写的就是它。
  llmProxyPort: 8081
  # 平台 webhook 入口（名称 webhook）：GitHub/Gitee 回调进来先在这里验签。
  webhookPort: 8082
  # 网关在全部调用链最前面（LLM 与 git 透传的唯一凭证出口）：没有 request 时
  # 调度器按 BestEffort 处理，节点一有压力先驱逐它，而被驱逐的 Pod 正是调用方
  # 的直接下游；request 按常驻实耗给，limit 留突发余量。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 观测通道端口：只挂 /health/* 与 /metrics，不含任何代理路由。与 8080/8081
  # 分列的原因是那两条通道会注入真实上游凭证，跨命名空间放行等于把凭证代持
  # 能力交给监控侧；观测通道没有代理面，可以只对它放行监控命名空间。
  metricsPort: 9090
  metricsAllowedNamespaces:
    - monitoring
  # Audited LLM channel port: the same routes as 8081, plus per-request content audit,
  # upstream credential injection, and a reachable set that admits the sandbox executor
  # only. It exists for the design line "document bodies go through the audited channel
  # only": 8081 does not look at one byte of the request body, 8080 holds no upstream
  # credentials, and only this port has both. A port of its own rather than folded into
  # 8080/8081: those two are reachable by any pod in the namespace, while this channel's
  # whole value is its small reachable set.
  auditedLlmPort: 8083
  # The largest request body the audited channel can audit in one call (bytes). Above it
  # nothing is audited, and what cannot be audited is refused -- so this states how much
  # document text may leave in one request, not a throughput figure. Deliberately not
  # shared with the document write bound: that one limits bytes written to disk
  # (storage), this one limits text entering a model (context).
  auditedLlmMaxBodyBytes: 8388608
  # git 传输的 SSH 兜底（HTTPS 快路径 + SSH 兜底，实现在 cog-gateway 的
  # git_mirror 模块）。GitHub 的 HTTPS 通道实测是高方差 + 偶发黑洞：好时 0.5s、
  # 坏时直冲超时，而黑洞期一来主线 deployer 拉不到基线、landing 推不上去，整条
  # 自进化链路停摆。开这个开关后网关自持一份裸镜像，连续失败即熔断降级到 SSH。
  #
  # 私钥来自 cogneva-secrets-oob/git-ssh-private-key（真实部署用 SSH 公钥上传到
  # GitHub 账号，私钥只注入网关）；**缺私钥时兜底自动保持关闭**，网关退回纯
  # HTTPS 透传、行为与从前一致——所以可以先开开关、后补凭证。
  gitMirror:
    enabled: true
    # 镜像卷：<root>/github/<owner>/<repo>.git。它是本 chart 里唯一**不需要**
    # resource-policy: keep 的卷——内容全部可从一个外部真相源（GitHub）重建，
    # 标了 keep 只会在反复重装时堆出无主的陈旧镜像。5Gi 对 cogneva 仓库
    # （含历史与 LFS 外的全部对象）绰绰有余。
    storage: 5Gi
    # 兜底传输的两条执行预算（秒），判据在代码里（cog-gateway 的 git_mirror）：
    #   stallSecs   —— SSH 侧多久没有任何输出就判这条传输已死（杀进程组、让请求
    #                  响亮失败），地板 30。判"静默"而不是"总时长"，是为了把
    #                  "链路慢"（该等）与"链路死"（该换通道）分开。
    #   timeoutSecs —— 单次 clone/fetch/push 的总上限，地板 60。防的是"一直在吐
    #                  进度却永远不结束"——那种形态静默判据永远不触发。
    # 默认值来自实测：本链路一次完整镜像克隆约 97 秒。
    stallSecs: 180
    timeoutSecs: 1800
  # 部署期网络画像盖章（restricted / open）。空 = 不盖章，由网关自己探。
  # 它只是**首帧默认值**：网关启动就发起一次真实握手实测，结论落地即压过盖章
  # （证据优先于部署时的猜测）。用途是让首批 git 请求不必先撞一次已知会挂的
  # 通道——那类网络里探测本身就要几十秒才有结论。
  netProfile: ""

# 观测栈的地址，两个进程共用：网关的上游池导出（cog-gateway，经 COGNEVA_LOKI_* /
# COGNEVA_CLICKHOUSE_* env 读）与主应用、进化进程的 tracing 导出（cog-observability，
# 读 files/cogneva.json 的 observability 段——那几行由 app-config.yaml 在渲染时
# 用这里的值改写，所以地址仍然只有这一份）。
#
# 四种体裁各落各的后端：日志→Loki、时序明细→ClickHouse、告警状态机→PostgreSQL
# （复用 cogneva 自身 PG，无需配置）、指标→Prometheus（ServiceMonitor 已抓取）。
# 默认开启：观测栈的安装脚本默认就带上这两个后端（BACKENDS=1）；端点不通时网关只
# 降级告警，池自愈主链（Redis 跨进程信号 + PG 告警）不依赖它们。只要指标栈时设
# BACKENDS=0 并把这两项置 false。
#
# 这一块此前挂在 securityGateway 下：同一台 Loki 于是在 values 里写一份、在
# files/cogneva.json 里又写一份。搬观测栈时改一处、另一处留在旧地址，症状是主应用
# 那侧「日志不再落地」——没有任何报错，只是日志面上少了一个进程。
observability:
  loki:
    enabled: true
    endpoint: "http://loki.monitoring.svc.cluster.local:3100"
  clickhouse:
    enabled: true
    baseUrl: "http://clickhouse.monitoring.svc.cluster.local:8123"
    database: "cogneva"
    table: "llm_events"
    username: "cogneva"
  # 基础设施告警的读面（Prometheus 的 API）：主应用按 poll 间隔拉一次规则与序列，
  # 判断「进程手里的规则集与 ConfigMap 声明的是不是同一份」。这条地址同样只有这
  # 一份，JSON 里那行由渲染改写。
  infraWatch:
    prometheusUrl: "http://cog-observability-prometheus.monitoring:9090"
  # 观测事件日志（cog_observability_events）的容量与读窗口。这条表只追加，2026-10-27
  # 实测 2.92M 行 / 1.6 GB，每天约 30 万行，而每一行都进夜间备份、也都在恢复演练要
  # 装回去的那份库里——演练单趟因此从 553 s 涨到 2271 s。两个数是一对：maxRows 是清理
  # 的目标，readWindowSeconds 是清理不许越过的那条线（历史事件读的就是最近这段时间，
  # 删进来等于让一个能答的查询静默缺一段）。窗口自己就超过容量时，清理停手并把
  # cogneva_observability_events_over_capacity 置 1。maxRows 置 0 = 本部署不清理。
  eventLog:
    # 行数上限。约三天常规量、一天半最坏量。
    maxRows: 1000000
    # 不许删的时间窗（秒），与历史事件查询的默认窗口同值。
    readWindowSeconds: 86400

# 公网 git 取数的一道上界，两个 worker 共用。
#
# 进化侧与沙盒侧的 init 脚本都有一处「从镜像 seed/更新裸仓」的 clone 与 fetch，
# 走的是同一条集群出网链路、同一个墙钟预算。上界写在这里由两边一起读：分成两份
# 就会在调大一侧时把另一侧留在旧界上，而同一个传输配两个界，短的先杀、长的白等。
# 语义见各模板里的注释——超时当作该镜像不可用、走已有的失败分支，失败不阻塞启动。
workspaceFetch:
  # 单次 clone/fetch 的挂钟上界（秒）。正常读数秒级到几十秒，取数倍余量。
  timeoutSecs: 240
  # git 的 TCP 连接超时（秒）：镜像根本不答时别等满整个墙钟。
  connectTimeoutSecs: 15
  # 低于这个速率（字节/秒）持续 lowSpeedSecs 秒即判定传输已死。
  lowSpeedLimitBytesPerSec: 1000
  lowSpeedSecs: 20

# 自进化 worker（特权容器 = 文件系统沙盒边界；接 image-based 滚动更新后可关特权）
evolution:
  enabled: true
  # 自进化循环自己的三个运行参数。它们此前写死在进化 Pod 的 ConfigMap 里：
  # 轮询间隔决定「主线动到被发现」的延迟，两个超时决定一次构建/一次验证最多跑多久。
  # 三者都是随部署规格变的数（节点多快、镜像多大），所以走 values。
  # 一个进化 worker：它按 Hold 那把构建槽的锁干活，第二个副本争的是同一把锁，
  # 收益是多一份排队而不是多一份吞吐。
  replicas: 1
  pollIntervalSecs: 300
  testTimeoutSecs: 3600
  buildTimeoutSecs: 3600
  # fail-closed 身份门禁：进化 Pod 的 Shell 类工具只接受带 DAG task 身份的
  # 调用（prompt_for_task），无身份的命令直接拒绝，不许以伪造身份进 executor。
  requireToolIdentity: true
  # 分解孤儿巡检只允许一个持有者：多副本同时 fire/resolve 会把告警停留窗口压到
  # 一个 signal-watcher 轮询以内，firing 行可能永远轮不上被读取。主应用为持有者。
  orphanReconcilerEnabled: false
  # git-remote 供给方式：pvc = 集群卷（多节点/生产，空卷自动从 seedUrl 拉 bare 仓库）；
  # hostPath = 单节点开发态直挂宿主 bare 仓库（宿主 <-> Pod 双向同步通道）
  gitRemote:
    mode: pvc
    hostPath: /var/lib/cogneva-data/git-remote
    # 有序镜像列表：第一个是首选上游，其余按序回退。可达性按主机不对称——
    # 实测 github 从集群内间歇黑洞而 gitee 秒级应答——只配一个地址时，该
    # 主机不可达期间的 release tag 刷新会静默失效，裸仓永远停在 seed 时的
    # tag；空卷首次 seed 更会直接失败。两个都列上，任一可达即可用。
    seedUrls:
      - https://github.com/hcipengm/cogneva.git
      - https://gitee.com/hcipengm/cogneva.git
    storage: 5Gi
  sandboxStorage: 20Gi
  # 源码卷：给共享 CARGO_TARGET_DIR 用的（工作树在它之外，可整棵重建而不丢
  # 增量编译缓存）。这是全场最大的一笔，也是唯一一笔"声明写小了会直接卡住构建"
  # 的（缓存被挤掉就每次全量重编）。2026-10-21 按缓存自己的分层读数重定：卷里
  # 只有 `target/`，占用 149GiB，按层是 debug/deps 84.3GB、debug/incremental
  # 60.9GB、release/deps 10.8GB、debug/examples 2.2GB、debug/build 1.0GB，其余
  # 各为百兆级。旧的 72Gi 来自 2026-09 的 57Gi 实测，此后随每次构建涨到现在，
  # 而声明量在 local-path 下不被强制，涨过去之后唯一的信号是
  # `data_volume_over_declared_size` 一直开着——所以这个数按实测峰取，不按
  # 当年写下的值。191GiB 的峰值上限（峰×1.2）也落在它里面：上限与声明量是
  # 一对，缓存可以长到峰值的余量，但不能长到这张卷装不下。
  sourceStorage: 192Gi
  # 进化 Pod 的 /var/lib/cogneva-data 是另一张卷、另一个写入者，声明必须分开：
  # 同一路径两个进程，各自的卷互不相干，共用一份声明必然对其中一个说谎。
  # 实测 49Gi（几乎全是 raw-logs 的存量轨迹），取 64Gi 留头寸。推导同
  # appData.storage：raw-logs 只降层不删除，存量会随冷层长期停留。
  dataStorage: 64Gi
  # 工作树动态分配：部署器与每个进化任务各自从裸仓库检出 git worktree，
  # 任一方把检出停在哪里都不再影响另一方。共享 CARGO_TARGET_DIR 故意留在
  # 工作树之外（source PVC 的克隆根内），工作树可整棵重建而不丢增量编译缓存。
  workspaces:
    root: /opt/cogneva/sandbox/workspaces
    targetDir: /opt/cogneva/sandbox/src/target
    # 临时工作树存活上限；要容得下一整轮演进，进程号不足以判断任务是否还活着。
    ephemeralTtlSecs: 21600
    # 身份轮换后遗留的 `evol/<旧id>` 分支回收判据：已并入 main 的立即回收，
    # 未并入的等超过这个时长（默认 30 天）才回收。存活实例的分支每次移植都会
    # 被强推刷新，长期不动即说明所属实例已不在。
    orphanBranchTtlSecs: 2592000
    # 共享构建缓存的复测周期（秒）。缓存的占用按层读成 cogneva_build_target_bytes，
    # 是给容量上限用的读数；走一遍只取元数据，但树有几十万条、宿主同时在编译，
    # 比分钟更勤没有价值。有下限兜底，取小于它的值等于取下限。
    cacheScanIntervalSecs: 300
    # 共享构建缓存的容量上限。三态：`auto` = 由 pre-reclaim 工作集峰值导出
    # （推荐，出厂值）；正整数 = 钉死这个数；0 = 只量不封顶。
    #
    # `auto` 的取法：每次走查先量"回收前"的缓存总量，取 7 天窗内的峰值，乘 1.2
    # 留头寸（覆盖两次复测 cacheScanIntervalSecs 之间的写入），再夹在目录所在卷的
    # 空闲字节之下——卷的空闲是唯一没有进程设置的界，超它就是承诺把节点盘撑满。
    # 上限必须盖过工作集，不是拿它当预算去挤：实测 7 天峰值（按层求和）约 66 GiB，
    # 那是跑一次完整构建自然会占到的量；上限压在峰下时每轮都会回收掉大半个缓存
    # （实测单次超限 48 GiB），下一轮又整块重编，等于把增量缓存废掉。写死 80 GiB
    # 的问题不是数不对，而是它只在写下的那天对：工作集涨过它时没有任何东西会
    # 发现，于是那个数就从"峰值的余量"静默变成"每轮回收的阈值"。导出值每次走查
    # 重算一次，读数 cogneva_build_target_bytes_cap 的 source 标签写 derived。
    # 超过时先放弃只花时间的层（`tmp` / `incremental` / `build`），编译结果排在其后；
    # 删除**只在持有构建槽位时**做，所以不会有构建正在读的文件被删掉。给得太小（小于每层
    # 留一份的下限）会被显式报成"到不了上限"。
    targetMaxBytes: auto
  # 宿主级构建闸门：同一宿主同时进行的编译 / 打镜像条数上限。构建与集群同宿主，
  # 多路叠加足以让整机进入换页，此后连"该把这件事报出来"的事件循环也一起退化。
  # maxConcurrent 默认不写死：0 = 按宿主实测导出（宿主的 cpu / 内存 / 磁盘，加上构建
  # 所在容器的内存上限，取最紧那一项），正数才是钉死它的覆盖位；此时读数
  # `cogneva_build_gate_ceiling` 的 dimension 标签会写 override，而不是
  # cpu / memory / io / cgroup_memory。
  # lockDir 与 hostPath 是**同一个字符串**，这是刻意的：闸门只在一块目录里成立，
  # 而「同一块目录」的判据是它报出来的 `dir` 标签（值是目录的 dev:ino，不是路径）——
  # 路径在两侧不同名，读数就会看起来像两个目录，人也就无从分辨其实现场是一个还是两个。
  # 所以不要把它放到别的卷的挂载点**里面**（比如 /var/lib/cogneva-data 下的某个子目录），
  # 那要靠"更具体的挂载赢"才成立，同路径的主张随即变脆；与 /var/lib/cogneva-buildah
  # 同形，另起一个宿主目录。
  # 目前有两个入场方：进化 Pod，与集群内评测台 `cogneva eval-table --admission`。
  # 用 hostPath 而不是共享卷，理由是**界按台算**：这里给出的上限是从本机读数导出的
  # （宿主 cpu / 内存 / 磁盘，加构建容器的 cgroup 内存上限），所以它只对"同一个节点上
  # 的构建方"成立，目录也就该按节点各一份；换成跨节点共享的卷，等于把 N 台的在飞条数
  # 收在一条按单台导出的界下面。别再往这个目录里加**非 root** 的入场方：
  # 那会同时带回两个问题（fsGroup 互改属主、不受信方占住槽位），见 build_gate 的注解。
  buildGate:
    enabled: true
    maxConcurrent: 0
    waitSecs: 1800
    hostPath: /var/lib/cogneva-build-gate
    lockDir: /var/lib/cogneva-build-gate
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      # 4 核是一轮 release 构建**打满**的配额，不是够用的配额：2026-10-18 实测
      # （容器自己的 cgroup，不是 ps 的生命期均值）这一格 60 秒窗口消耗 3.26 核、
      # CFS 周期被限流 265/600（44%），而 `build_gate` 里 `BUILD_DEMAND_CORES`
      # 那条「一次构建中位 4.1 核 / 峰值 4.7 核」本身就是**在这条 4 核配额下量的**
      # ——它量到的是被削平后的需求，真实需求在它之上而不是之下。同日一轮主线构建
      # 因此连续跑了 60 分钟、在 3600s 构建上限处被杀，产物一件没落地。
      # 宿主 24 核、同一时刻约 9–10 核在用，抬到 8 核仍在余量内；命名空间配额
      # `limitsCpu` 也容得下（抬完稳态声明和 + 判据 Job 仍在 23 核以内）。
      # Falsification：抬完看主线构建的墙钟是否落到构建上限之下，以及这一格的
      # `nr_throttled` 增量是否明显下降。两个都没动，说明瓶颈不在配额，就抬回来。
      cpu: 8000m
      # 宿主级构建闸门的 cgroup_memory 维读的就是这个数：它容得下几个并发构建
      # = (memory.max − memory.current) / BUILD_PEAK_RSS_BYTES（实测工作区一次
      # 构建的峰值 4481MiB）。8Gi 时这一维恒为 1：实测 memory.current 已 6.48GiB
      # （大部分是可回收页缓存，闸门按"上限用了多少"而不是"不可回收多少"计，
      # 理由见 build_gate.rs 里 BuildBudget 的文档），余下 1.5GiB 只够一个构建，
      # 于是"宿主还有几十 GB 空闲"也照样串行。
      #
      # 16Gi 是让这一维到 2 的**下限不是舒服值**：按今天的 current 算
      # (16GiB − 6.48GiB) / 4481MiB ≈ 2.2，而第二个构建跑起来后 current 还会涨，
      # 真值要 rollout 后读 `cogneva_build_gate_ceiling{dimension="cgroup_memory"}`
      # 再定。抬这个数必须同批抬 LimitRange 的单容器上限（见 resourceGovernance），
      # 否则 Pod 在准入就被拒。
      memory: 16Gi

# 沙箱执行器：主应用与进化共用的零凭证工具执行面（run_command/read_file/write_file）。
# 不挂 Secret、不挂 ServiceAccount token；关掉后主应用/进化的工具调用将无执行面。
sandboxExecutor:
  enabled: true
  # 执行器的指标面：主应用与进化 Pod 都按它取执行器的读数。该 Pod 零凭证，
  # 指标面是它唯一对外的面。
  metricsPort: 9090
  # 一个执行器：每任务工作树都在这一个 Pod 的卷上，第二个副本看的是另一份卷，
  # 于是「谁持有这个任务的工作树」失去意义。
  replicas: 1
  # 执行器专属持久卷：自有裸仓库 + 每任务工作树 + 共享 CARGO_TARGET_DIR，
  # 与进化侧卷物理分离，互不共享工作树。
  storage: 5Gi
  # 空 = 跟随集群默认 SC（与 pg/redis 同策略，不绑厂商）。
  storageClass: ""
  # 空卷首挂时零凭证公开 https seed 裸仓库；后台按间隔 fetch（失败不阻塞）。
  # 有序镜像列表：第一个是首选上游，其余按序回退。单一地址会在该主机不可达
  # 期间把工作树静默留在旧 main（实测本集群 github 探测 44% 失败、gitee 0.86s）。
  gitSeedUrls:
    - https://github.com/hcipengm/cogneva.git
    - https://gitee.com/hcipengm/cogneva.git
  # 每任务工作树生命周期（秒）：空闲超 TTL 回收，数量超上限按 LRU 驱逐。
  # **TTL 由两个读数推，不由「空闲多久后被复用」推**：后者有个自指陷阱——空闲超过
  # TTL 的树已经被回收了，能观察到的间隔永远短于它要喂的那个数，按它调只会一轮轮
  # 翻倍。现在用的是不依赖 TTL 的两头：卷能装多少棵树（见 maxTaskWorkspaces 那段）＋
  # 新树到达的间隔（元数据里的 created_at 算出来），取「新树把半个卷填满要多久」。
  # 树来得快、卷更小，TTL 就短；量不出来（不足两棵树）时才用这个数。
  workspaceTtlSecs: 21600
  # **只在第一次量出一次回收 pass 的耗时之前生效。** 之后间隔跟着实测走：取上一次
  # pass 耗时的 20 倍（下限 30 秒），也就是让回收最多占掉二十分之一的时间——卷填得越满、
  # 一次 pass 越慢，间隔跟着拉长，而不是把固定周期一直付下去。pass 只计回收本身的工作，
  # 不含它被安排的等待，所以间隔不会反过来影响这个测量。循环按 30 秒的地板唤醒并上报
  # 心跳，没到期就空转，所以「回收间隔」变长不会被误读成循环停摆。
  workspaceGcIntervalSecs: 600
  # **只在第一次观察到 main 变动之前生效。** 之后抓取周期跟着实测走：裸仓里 `main`
  # 多久没动过，就按那个间隔的一半轮询（下限 30 秒，低于它就是在问同一个 commit）。
  # 上游一小时才推一次时，仍然每 5 分钟抓一遍是白花；反过来推得勤时又要跟上。循环
  # 本身按地板节奏唤醒并上报心跳，所以「抓取间隔」变了不会被误读成循环停摆。
  repoFetchIntervalSecs: 300
  # 上限是**两个数里较小的那个**：这个策略上限（同时服务多少棵树），与这块卷实测能
  # 容纳多少个（每轮 GC 读 `df` 的可用字节，除以同一次 GC 里量出的单树大小，留 15%
  # 余量给写入中的 git 命令）。树随仓库变大、卷被同住者占满时，实测那头会自己降下来
  # ——写成固定值就等于把某一天的树大小封进配置，之后它不再跟着变。还没有任何树时
  # 测不出单树大小，只剩这个策略值。
  maxTaskWorkspaces: 8
  # 本 Pod 自己那块构建缓存（`CARGO_TARGET_DIR`）的上限与复测周期。**它与进化侧
  # 的 `evolution.workspaces.targetMaxBytes` 是两个对象，不是同一个旋钮的两种写法**：
  # 那份认的是路径，而同一串路径在进化 Pod 里落在 `evolution-source-pvc` 上、在这里
  # 落在 `cogneva-sandbox-pvc` 上，界跟着路径走的时候卷不会跟着走。
  #
  # **上限这里没有数**：进程每轮按「这块卷的声明量减去同住者实测占用」重算一次
  # （声明量由模板从下面的 `storage` 传下去，同住者由已有的卷足迹读数给）。写成
  # 一个数就等于把某一天的实测封进配置——`CARGO_HOME` 会随依赖长、任务工作树会随
  # 并发长，而那份手算结果不会跟着长，于是卷被顶到声明量以上时没人发现。
  # 需要钉死时仍可覆盖：`--set sandboxExecutor.buildCacheMaxBytes=<字节>`，`0` 表示
  # 只量不封顶。两种覆盖都会在 `cogneva_build_target_bytes_cap{source}` 上读得出来。
  #
  # 回收只在**本执行器没有命令在跑**时执行——槽位由命令的整个子进程寿命持有，
  # 所以删除不会撞上正在编译的文件；代价是任务密集时它会一直报 `busy`。
  # 复测周期（秒）：缓存的占用按层读成 `cogneva_build_target_bytes`。**这是种子**：
  # 进程量出一次走一遍要多久之后，周期改成那个耗时的 20 倍（下限是共享的 60 秒），
  # 也就是让走这一遍最多占掉二十分之一的时间——缓存越大、走一遍越慢，周期自己拉长。
  # 发布出来的间隔是**实际生效的那个数**，不是这里的种子。循环按 60 秒地板唤醒并上报
  # 心跳，没到期就空转，所以周期变长不会被误读成循环停摆。
  buildCacheScanIntervalSecs: 300
  # 本 Pod 的内存上限是**一次编译就够把它用完**的那种小，所以它不是一个并发旋钮。
  # 最初 1Gi 时一个 `cargo` 与它唯一的 `rustc` 就到上限的 99.6%（anon 669 MiB +
  # file 400 MiB），每十几分钟 OOM 一次、被杀的是 `rustc`/`cargo`——一轮变更验证整轮
  # 白跑；**病因不是"并发任务太多"**：这台容器上 rust 的并行度本来就是 1
  # （`cpu.max` 100000/100000），一个 build 只开一个 rustc，而它一个就装不下。
  # 2 GiB 之后 OOM 计数（`sandbox_oom_kills_total`）连续 24h 为 0，那一类已经关掉。
  # **但 2 GiB 也在边缘**：12h 内 5 个 Pod 的工作集峰值 1.815–1.949 GiB（上限的
  # 0.91–0.97），而其中**不可回收的那部分（anon）就已经到 1.367–1.685 GiB**（上限的
  # 68–84%）——最重的那个 Pod 工作集里 anon 占 87%，可回收的 file 只占 0.24 GiB，
  # 所以那个比例量的是真压力，不是页缓存把读数撑起来的。按 anon 算，这个上限只留了
  # 零点几个 GiB 的增长余量，而它每次失败赔的是一整轮变更验证（还要一次 LLM 轮次的钱）。
  # 取 3 GiB：anon 峰值降到上限的 56%，把增长余量补回来。原先"2 GiB 装得下两个
  # 0.75 GiB 的 build"那个依据已被上表证伪——那个数是更早、更小的工作负载上量的，
  # 现在**单个 build 的 anon 就已经 1.685 GiB**。CPU 不动：同一窗口 CFS 周期限流
  # 918/5012（18%），不是这套 OOM 的病因。请求仍是 512Mi（与常驻量同量级；这是突发型
  # 工作负载，调高请求只会把它自己锁在节点上）；Falsification（**自这一档落地的
  # `b24e2223`（2026-10-05T22:33:53+08:00）起算的窗口**，不是从写下这句话那一刻）：
  # 判它的读数是**结局** `sandbox_oom_kills_total`——该窗口内 89 个沙箱 Pod 的 7 天
  # 峰值全为 0，所以这一档够用；OOM 计数重新非 0 才需要重估。
  # **比值不能当这条判据**，原句写的"不应再点亮 `container_memory_near_limit`"是量错了
  # 对象：2026-10-16 实测 7 天窗，该容器工作集峰值到过 **2.94 GiB＝上限的 0.98**、过阈
  # 约 17 pod-分钟，而同期 **anon 峰值只有 1.76 GiB、页缓存峰值 2.66 GiB**——工作集把
  # 可回收的页缓存算在内，缓存涨上来它就到 0.98，内核在压力下先回收它。所以"贴着上限"
  # 与"会不会被 OOM 杀"是两回事，拿比值当判据只会每轮编译都点一次灯、什么也没判出来。
  # **同日把那三分子的账还到了规则本身**：`container_memory_near_limit` 的分子从工作集
  # 换成不可回收的那部分（`container_memory_rss`），阈值 0.75 沿用未动。换完这个容器是
  # **0.46–0.59 of 3 GiB**，于是上面那句"每轮编译都点一次灯"不再发生——它本来就是被页缓存
  # 点亮的。同一笔的三族读数：app **0.78**、本容器 **0.59**、进化 **0.24–0.39**，而三族的
  # `usage` 峰值都在 **0.9998–1.0000 of limit**——"顶到上限"这件事本身零信息量，三族之间
  # 唯一分得开的就是不可回收那一列。阈值 0.75 是在**旧分子**上量的频带（被杀掉的观测后端
  # 0.74–0.93），换分子后**没有**在它上面重新导出过，所以它是沿用值而不是这一版量出来的界。
  # 判这一档够不够，仍然只读结局 `sandbox_oom_kills_total`。
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 3Gi

# 宿主机文档整理：把文档所在的目录**窄挂载**进沙箱执行器，让平台代文档属主
# 整理这些文档。边界是挂载范围而不是白名单代码——只把属主自己的目录挂进来，
# 宿主其余部分根本不在这台容器的文件系统里，于是没有"判断写错"的余地。
# 默认 `scopes: {}` = 能力关闭：执行器不挂任何宿主目录，文档路由答 409。
#
# key 是 scope 名（= 文档属主的身份），value 是该属主在**宿主**上的目录。
# 容器内挂载点固定为 `<mountPath>/<name>`；`hostPath.type: Directory`（不是
# DirectoryOrCreate）——路径写错就 Pod 起不来，而不是在宿主上凭空建一个空目录。
# 执行器以 uid 1001 运行，宿主目录要对该 uid 可写，否则第一次写入会以明确错误失败。
hostDocuments:
  scopes: {}
  mountPath: /opt/cogneva/host-docs
  # 回滚日志落在执行器自己的持久卷上：日志随进程一起消失的部署，等于没有回滚。
  journalDir: /opt/cogneva/sandbox/host-docs-journal
  # 单份文档的重写上限（字节）。回滚要留一份原文副本，这个上限同时界住了
  # 一次操作与一份日志的大小。
  maxWriteBytes: 8388608
  # The largest single read (bytes). **Deliberately not tied to the audited channel's
  # bound**: that one is a gateway-process quantity limiting how much text leaves, this
  # one limits the bytes the executor reads into memory at once. The two values being
  # close is a coincidence; tying them together would silently drag one side when the
  # other is adjusted.
  maxReadBytes: 8388608
  # Whether document bodies may leave the cluster (the switch on the audited channel),
  # off by default. While it is off, organising uses metadata plus the local
  # embedding/reranker only (the in-memory side already has configuration for both);
  # with it on, bodies may enter a model through the audited channel. The judgement sits
  # in the gateway process -- the only place that can refuse the request; the executor
  # reads the same variable only to avoid sending a request bound to be refused.
  bodyEgress: false
  # How long a staged plan stays approvable (seconds). **It is also the validity of an
  # approval**: past the window, an approved plan no longer executes -- approving
  # something nobody has looked at for a long time is no different from acting
  # unattended in the middle of the night.
  # A floor of 60s (the executor clamps anything smaller): a value far below the floor is
  # almost certainly a unit mistake.
  approvalTtlSecs: 86400
  # The largest plan that may be staged for approval (bytes). Same order as a single read:
  # a plan carrying more text than a single write may carry would make "approved" mean
  # something other than what it says.
  maxPlanBytes: 8388608
  # The name-based classification table, `bucket:ext,ext;bucket:ext`. **Empty means the
  # table built into the process**, which is the default on purpose: a second copy of that
  # table here would be a second thing to keep in step, and its drift shows up as a folder
  # that is silently never sorted.
  classifyRules: ""
  # How many bytes of one body a classification question carries, and how many files one
  # question may cover. Both are "do less" bounds: past either of them the question is not
  # asked at all rather than asked about part of the folder -- a partial answer would make
  # the plan depend on which files happened to fit.
  assistBodyBytes: 2048
  assistMaxCandidates: 50

# 节点镜像构建（buildah DaemonSet）：每节点提供 buildah 能力，产物导入节点
# containerd 作暖缓存；工作负载运行时镜像权威走集群内 registry（见 image.repository）。
# containerdSocket 是容器运行时 socket 在宿主的路径，随发行版不同：
#   标准 containerd（kubeadm/EKS 等）= /run/containerd
#   K3s  = /run/k3s/containerd
#   k0s  = /run/k0s/containerd （按实际核对）
# 生产多节点改用外部镜像仓库时可关闭（镜像走 registry 拉取而非节点内构建）。
buildah:
  enabled: true
  image: quay.io/buildah/stable:latest
  # 与业务镜像分策略：这是外部第三方镜像，不是集群内 registry 的浮动签。
  # 不跟 image.pullPolicy 的 Always——外网不可达时 Always 会让容器起不来，
  # 直接废掉构建能力；这份 :latest 只在节点首次需要时拉一次。
  pullPolicy: IfNotPresent
  containerdSocket: /run/containerd
  storageHostPath: /var/lib/cogneva-buildah
  resources:
    # 常态是纯守护进程（实测常驻 ~1Mi），构建尖峰由 limit + 节点实际余量
    # 承接；request 按常驻实耗定，不为偶发构建常年锁住半 G 调度额度
    # （小节点上这会挤得短作业排不进来）。
    requests:
      cpu: 250m
      memory: 64Mi
    limits:
      cpu: 2000m
      memory: 4Gi

# 宿主账本的拆解面（host-ledger DaemonSet）：每节点一个只读进程，把宿主 cgroup v2
# 的三个 slice 各按 anon / file 报出来。它存在的理由是「宿主上多少内存是本平台的」
# 这个问题今天没有数据源：node_exporter 的 cgroups collector 是按 cgroup v1 写的
# （在 v2 宿主上只出子系统级别的 cgroup/enabled 两格，没有按 slice 的字节），
# cadvisor 只走自己被 root 住的那棵子树，两者都不给宿主的 slice 分解。而构建闸门的
# 上限是从宿主全局读数导出的，没有分解就分不出「这台机器自己忙」与「本平台填满了它」。
# hostPath 挂宿主的 cgroup 根（只读）。这不是特权面：memory.stat 本身是 0444，
# 进程不需要任何 capability、不需要 hostPID、不碰设备——挂成只读也让"量一下"这件事
# 不可能改到宿主。挂载点只在容器内取名，进程按 COGNEVA_HOST_CGROUP_ROOT 找它。
# 进程采集器（process-census DaemonSet）：每节点一个，读宿主 cgroup 树，把每个容器
# 实例里的进程表报给网关的 `/api/v1/cluster/process-report`。
#
# 它是「所有容器都要有进程表」这一条的实现：只靠容器自报时，第三方镜像（postgres、
# nats、registry、评测环境）一格都填不上，而空格读作「里面没有进程」。
#
# 唯一的额外能力是 hostPID——没有它 `/proc` 里只有自己。挂载只读、不需要特权、
# 不需要 root、不挂 SA token，所以它跟 host-ledger 分成两个 Pod：能力边界落在 Pod 上。
processCensus:
  enabled: true
  hostPath: /sys/fs/cgroup
  mountPath: /hostcgroup
  resources:
    # 每拍（60s）走一遍 cgroup 树、读几百个 /proc 小文件；常驻与尖峰都在噪声级。
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

hostLedger:
  enabled: true
  # 宿主 cgroup v2 根。cgroup v1 宿主也照挂（目录存在），只是下面找不到 slice，
  # 于是什么都不报——不造假根：这里用 Directory 而不是 DirectoryOrCreate。
  # 这一段是整个宿主账本里唯一一处**按节点**的东西，而且它只在这台节点上成立：
  # hostPath 的声明面在集群里（DaemonSet 是一个集群对象），存储面不在——字节落在节点
  # 根文件系统上，不归任何 StorageClass/PVC 管，`helm uninstall` 也带不走它。跟它成
  # 镜像关系的是沙盒那张 PVC（/opt/cogneva/sandbox）：那张的声明面和存储面都在集群
  # 生命周期里。两者都别按"反正宿主上也看得见"去理解。
  hostPath: /sys/fs/cgroup
  mountPath: /host/cgroup
  port: 9100
  resources:
    # 每次抓取读三个小文件，常驻与尖峰都在噪声级；request 按实耗定，上限留一个
    # 足以容纳一次抓取的余量即可。
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # 这个 DaemonSet 的 Pod 也占命名空间 ResourceQuota 的 pods 配额：它的 Pod 是
  # 控制器经 apiserver 在该命名空间里建的，配额满时新节点上的账本 Pod 会 Pending，
  # 那个节点于是静默地没有账本（tolerations 挡不住这件事）。当前选择：接受，并让
  # host_ledger_node_unreported 报「有节点、没账本」。不给它 priorityClassName——
  # 为了报一条读数去抢占工作负载，代价比它大。Pod 额度本身是另一件事：它由渲染集
  # 投影出来（见 resourceGovernance 段），这个 DaemonSet 的副本随 clusterNodes 进
  # 算式，所以多一个节点不是"配额要人重推"，是投影自己变大。

# 卷账的全集面（claim-store DaemonSet）：每节点一个进程，走查本节点存储根下的每个
# claim 目录，把每个目录占的字节发布成 `cogneva_data_volume_used_bytes`
# {persistentvolumeclaim, namespace, node}——与各 Pod 自量自己挂载的那条同名同标签，
# 因为规则按 (namespace, persistentvolumeclaim) 聚合后再除以声明量，换个名字就是另一
# 个量、没人读。
#
# 为什么必须有它：能走查封自己挂载的卷的，是写那个卷的进程；数据库 / 缓存 / 向量库 /
# 消息队列 / 对象存储 / 监控栈自己的盘写它们的都是第三方镜像，本平台没有任何进程在那些
# Pod 里。而目录型卷（local-path）上 kubelet 报的 per-volume 用量是节点文件系统本身
# ——实测 12 个 claim 报同一个 ~600GB，一个都不是它自己的。于是这一族卷此前既不参与
# 「用量 ÷ 声明量」，也没有规则读得到：一张 5Gi 的卷用到 82% 也没有任何一句话。
#
# 它与 hostLedger 分成两个 DaemonSet：需要的权限不同（cgroup 的 memory.stat 是 0444，
# 存储根是 0700 root），合一个 Pod 会让读 cgroup 的那一半也拿到根，还会让「存储根不存在」
# 连带打掉 cgroup 读数。这个容器跑 uid 0 只为跨过那个 0700 的挂载点：挂载只读、
# capabilities 全丢、根文件系统只读、不挂 SA token、不动 hostPID 与设备。
#
# 只在 k3s profile 打开：k8s-standard 用集群默认 SC（生产通常是 Longhorn 之类的 CSI），
# 那里 kubelet 的 per-volume 用量是真实的，而 `/var/lib/rancher/k3s/storage` 这个目录
# 根本不存在——开着的唯一后果是一个起不来的 DaemonSet。
claimStore:
  enabled: true
  # 节点存储根：provisioner 在这里为每个 claim 建一个 `pvc-<uid>_<ns>_<claim>` 目录。
  # 名字里的两段身份就是这个读数的全部归属来源（不查 API），所以目录名认不出来的
  # 条目不会被猜着记到某张卷上，只计入 skipped。
  hostPath: /var/lib/rancher/k3s/storage
  mountPath: /host/storage
  port: 9100
  # 走查节奏。一次走查的成本是节点上那些卷的总量（本机 200GB 实测约 2s），所以它不
  # 跟着抓取跑，抓取读的是上一拍的结果；`cogneva_claim_scan_age_seconds` 把「上一拍」
  # 有多旧变成一条读数。规则 claim_scan_stale 的界是**三个这个节奏**，改这里要一起
  # 改那条规则——界若等于节奏，健康节点在两拍之间也会亮。
  scanIntervalSecs: 300
  # 镜像库（containerd 的根）：解出来的镜像层、容器层和 containerd 自己的日志都在
  # 这里。它们不挂在任何卷上，kubelet 报不出来（不是卷），运行时自己的镜像清单报的是
  # 压缩后的大小、且分担的层不重复计——只有走查目录得到的是这台盘上真实的字节数。
  # 本机实测 60.5 GB（content 13 GB + overlayfs snapshots 47 GB），约占根的 6%。
  # 走查比存储根慢一拍：这棵树大得多，而且它按镜像拉取/部署变化，不按工作负载写文件变化。
  imageStoreHostPath: /var/lib/rancher/k3s/agent/containerd
  imageStoreMountPath: /host/containerd
  # 同一台盘上另外两个层库：镜像构建写进去的 rootful buildah/podman 存储。它们和
  # containerd 的层是同一种字节——解开的层、不挂在任何卷上、花的是这台节点的盘——
  # 只是各自的顶层条目标题相同（`overlay`、`storage`），所以读数带 `store` 标签分开。
  # 本机实测 podman 54.9 GB + buildah 11.4 GB，此前两边都没有任何产出者。
  # 条目的 hostPath 用 DirectoryOrCreate：没跑过 rootful 构建的节点本来就没有这个
  # 目录，造一个空目录只是把「这台节点没有」变成 0 字节，不会凭空造出用量。
  extraImageStores:
    - name: podman
      hostPath: /var/lib/containers
      mountPath: /host/podman
    - name: buildah
      hostPath: /var/lib/cogneva-buildah
      mountPath: /host/buildah
  # 规则 image_store_scan_stale 的界是**三个这个节奏**，改这里要一起改那条规则。
  imageScanIntervalSecs: 900
  resources:
    # 常态是每 300s 一次 readdir+stat 的走查，其余时间空转；内存按目录项规模取，
    # 与 5G 卷的量级无关（走查不读文件内容）。
    #
    # 192Mi 是按**进程自己**的量给的：只走完 content 那 13 GB 时 working set
    # 已经 87Mi，整棵 60.5 GB（809k 文件）边走边加的峰值 29 MB，相加留余量。
    # 那个数管的是 rss，而内核 OOM 动手看的是**整个 cgroup 的占用**——含走查
    # 自己带出来的页缓存与 slab。2026-10-22 实测：这个容器 usage 191.2Mi 贴着
    # 192Mi 的上限（99.7%），其中 rss 只有 41~63Mi，文件缓存 112~137Mi；它走的是
    # 存储根 525k 文件加三个镜像库 809k 文件，这些元数据页全记在它这个 cgroup 上。
    # 结果是 10-21 18:07/18:12 与 10-22 04:10 三次 OOM：内核日志里
    # `constraint=CONSTRAINT_MEMCG`、anon-rss 只有 75~128Mi，由 tokio-rt-worker
    # 在 GFP_NOFS 分配时触发——这种分配不能回收同一文件系统的缓存，于是缓存明明
    # 可回收也照样 OOM。按 rss 算的规则与按 rss 算的配额同时看不见它（当时的
    # container_memory_near_limit 读数是 0.21）。
    #
    # 代价落在读数面：这个进程一走，20 条 cogneva_data_volume_used_bytes 一起消失，
    # 直到新 Pod 走完首拍才回来（实测断了 10~45 分钟），于是 claim_usage_unmeasured
    # 与 claim_store_node_unreported 在一天里亮着六成时间。
    #
    # 上限要给到**走查自己那棵树装得下**，不是给进程的 rss 留余量。三档实测
    # 摆在一起才看清那条律：cgroup 的占用是 min(这棵树的足迹, 上限)。
    #   192Mi：usage 191~192Mi（贴着顶），1Gi 时期尾部也见过 1023.7Mi（贴着顶）
    #   512Mi：usage 506~512Mi（贴着顶）
    # 三档都贴着各自的上限，说明前两档里**树的足迹高于上限**，内核一直在按需
    # 回收把它摁在上限上；摁在上限就等于任何一次 GFP_NOFS 分配都可能撞上回收
    # 不动的那一刻。1Gi 那一档给出下界而不是终点：07:54 之后 usage 常驻
    # 1023~1024Mi、缓存 915~948Mi，仍在往上要——说明这棵树的足迹**至少** 1GiB
    # （134 万文件的 dentry/inode），1Gi 刚好卡在足迹上，等于没有余量。
    #
    # 因此上限要**明显高于足迹**，让占用停在一个低于上限的水平上（内核不再需要
    # 持续回收）。2Gi 是按「足迹至少 1GiB」加一倍给的：预期 usage 稳定在
    # 1.0~1.4GiB 一带（五到七成），若仍然一路涨到贴着 2Gi，才说明这棵树没有
    # 固定足迹，那时要动的是走查本身（分段走查、把每段带出来的缓存还回去），
    # 不是这个数。
    #
    # 判据按**峰值**读，不按均值读：每周期的峰值不逼近上限（七成为界），且没有
    # 新的 OOMKilled 与重启。均值会骗人——45 分钟窗口的前 20 分钟读出来是
    # 「稳在 432Mi、占 42%」，像平台期，其实只是两次走查之间。
    #
    # CPU 上限按突发定，不按均值定。实测 200m 下这个容器平均只用 0.077 核，却有
    # 0.83 的 cfs 周期被限流：走查是 readdir+stat 的突发，一个 100ms 周期里的突发
    # 远超 200m 给的 20ms，于是每周期做一小段就等剩下的时间。挡住的是**墙钟**，
    # 而墙钟正是启动预算与扫描节奏唯一在量的东西——首拍（存储根 + 三个镜像库）
    # 在 200m 下 3m35s，给到 1 核（一整个周期的配额）后 34.5s，同一个进程、同一棵树。
    # 均值仍不到 0.3 核，空转时一分不花。
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 2Gi

# 集群内镜像仓库：GitOps L1 金丝雀镜像秒级分发通道。
# publisher（进化 Pod）把 overlay 镜像（cogneva 基镜像 + 新二进制）push 到
# Service:5000（集群 DNS，http）；节点 kubelet 经 NodePort 以 localhost:<nodePort>
# pull（containerd 对 localhost 默认 http 免 TLS），单/多节点通吃。
# 外部仓库形态改配 COGNEVA_GITOPS_REGISTRY（跨集群生产），可置 enabled:false。
clusterRegistry:
  enabled: true
  # 一个仓库：它缓存的是这一簇的镜像层，第二个副本写同一张卷只会让两层布局互相踩。
  replicas: 1
  image: registry:2
  # 仓库在集群内的服务端口：Service、containerPort、部署器拼的 Service DNS、以及
  # network-policy 里放行的那条都读这一个值。四处各写 5000 时，改一处就有一条路径
  # 静默指向不存在的端口——push 报连接拒绝、或者更糟，策略放行了一个没人听的端口。
  port: 5000
  # 节点上以 localhost:<nodePort> pull（containerd 对 localhost 默认 http 免 TLS），
  # 部署器拼的 COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY 也读它。
  nodePort: 30500
  # 这张卷的名字声明一次，PVC 与"谁去量它"两处都从这里取：盘上占用由本 Pod 里
  # 那个只读走查边车量（第三方 registry 进程不发布指标，而它是这张卷唯一的写者），
  # 量出来的数按这个名字挂到声明量上。两处各写一份名字时改名会静默失配——量到的
  # 数挂到一张不存在的卷上，声明量的规则对它永远看不见。
  #
  # registry 自己的 API 报的是"活 tag 引用的层"，那是另一个量：孤儿层看不见，同一
  # 时刻实测 3.74GiB vs 盘上 7.4GiB。它留在自己的序列名（cogneva_registry_referenced
  # _bytes）下，由问 API 的进程发布，供保留策略读；声明量比的必须是盘上那份。
  claimName: cogneva-registry-pvc
  # registry 写这张卷的根目录。一处声明：registry 的存储根、边车要量的路径、
  # 两个容器的挂载点都取它，任一处改单边都会让走查量到空目录（读数变成 0）。
  rootDir: /var/lib/registry
  # 走查边车对外服务的端口。Service 端点名 http 指向它，监控按那个名字发现。
  walkerPort: 9100
  # 金丝雀 overlay 逐 rev 累积，实测已 7.4Gi，取 10Gi。
  storage: 10Gi
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      # 200m → 500m：2026-10-23 实测这一格 **0.304 的 CFS 周期被限流**，平均用量 23m
      # ——它平时空转，一次镜像层的 push/pull 才是突发，而配额按 100ms 周期发，
      # 100ms 里那 20ms 的花法决定成败。被削掉的是分发速度：金丝雀镜像经这里秒级
      # 分发，限流一多就变成「按配额的速度分发」，而它下游站着部署器的滚动。
      # 同族处置：redis-info-exporter、claim-store、node-exporter 都是这条——
      # 按一个周期内的突发定，不按均值定。抬完配额仍有 7 核余量（配额 31，声明 23.6）。
      cpu: 500m
      memory: 256Mi
  # 走查是 readdir+stat，不吃 CPU；内存按目录树规模取，10Gi 的 store 远在这以内。
  walkerResources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# 后端探针的失败预算。探针测的是"这个后端还能不能干活"，而 kubelet 判死一个 Pod
# 靠的是"在预算内有没有应答"，预算按空闲节点取就必然在节点忙时误杀：共址构建把
# load 拉到 20+、可用内存掉到几百 Mi 时，kubelet 连自己的 Pod IP 都 dial 不进去
# （实测 redis 因此被 liveness 杀掉，后端再断一次）。所以两类预算分开取：
# 启动预算按"最慢的合法启动"（加载大 AOF、首次 initdb、建索引），运行预算按
# "节点最忙时仍应答应答"；把两者混成一个预算，必然在其中一边取值错。
# 探针省略 timeoutSeconds 时 kubelet 默认 1 秒、failureThreshold 默认 3 次，
# 所以这里必须显式写全——"省略"本身就是按空闲节点取值。
healthProbes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  # claim-store 那一档现在只是兜底：监听先起来，首趟走查（存储根 + 三个镜像库）
  # 跑在它后面，等待由 /health/ready 承担——走查跑完之前抓取端点不存在，
  # 首拍同样不会是空的，但「监听还没起」不再等于「进程没起来」。这一档留着是因为
  # 绑定本身应当是瞬时的；真撞破它说明有别的东西挡住了 bind，那确实该重启。
  # 走查本身的耗时没变：本机实测 3m35s（containerd 60.5 GB + podman 55 GB +
  # buildah 11 GB，200m 配额下），2026-10-26 那次 4m12s。
  claimStoreStartup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 120
  liveness:
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# 可选后端；禁用即假定使用外部服务（在 config 中指向外部地址）
backends:
  postgres:
    enabled: true
    # 一个实例。库是单写的，多副本要么是主从（要另一套切换机制，不在这里）要么是
    # 两份互不相干的数据；声明成值是为了让「要不要两个」成为部署问题而不是改模板。
    replicas: 1
    # 库的服务端口。写在这里而不是各清单各写一遍：DSN 分散在四个工作负载的 env、
    # Service、容器端口与网络策略里，五处各写一个数时，改端口的那个部署会得到
    # "连接被拒"与"策略丢包"两种都读起来像宕机的症状。
    port: 5432
    image: postgres:16-alpine
    # 读数边车与数据库同 Pod：抓数据库的读数要库口令，独立进程就得再存一份。
    # 这个 tag 是读数的生产者，不是实现细节：最老事务年龄那条读数读的
    # `pg_stat_activity_max_tx_duration` 属于这个镜像的默认集（`--help` 列的是
    # opt-in collector，默认集不在那张名单里，所以它看起来像是「没有旗标能打开」）。
    # 换 tag 要重抓一次序列表 `deploy/images/postgres-exporter.series.yaml`。
    exporterImage: prometheuscommunity/postgres-exporter:v0.15.0
    # 边车自己监听的那个端口：抓取端的 ServiceMonitor/抓取注解按它取数。
    exporterPort: 9187
    storage: 10Gi
    # Resource bounds live here, not in the template, so the tunables registry can
    # see them (it enumerates the numeric leaves of this file only).
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    # 边车只跑十来条只读查询，用量按抓取间隔计量；上限要覆盖的是 exporter 的
    # Go 堆随抓取次数与库表数增长后的规模，而不是稳态均值——上限压得太贴近
    # 均值，它会在连续抓取后被 OOM 重启，而重启的边车读数看起来和「数据库
    # 没有连接」一样。
    exporterResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 256Mi
  redis:
    enabled: true
    # 一个实例，且它的名字 redis-0 写进了几处 DSN：多副本要连的是一组哨兵或
    # 一个 Cluster，不是把这个数改大。
    replicas: 1
    # 服务端口。它同时出现在容器端口、Service、网络策略与三个 DSN（主应用、进化、
    # 安全网关）里；分成四份写就是四次机会让其中一处先动。
    port: 6379
    image: redis:7-alpine
    storage: 5Gi
    # 内存上限走 values，不再写死在模板里：数据集本身就有 485MB（启动日志里的
    # 「RDB memory usage when created: 485.56 Mb」），512Mi 只剩约 27MB 给 AOF
    # 增量与写缓冲，2026-10-19 的那一轮重建后每轮启动约 20 秒即 OOMKilled。
    # 抬到 2Gi 买的是头寸、不丢数据、可回滚；它不是策略决定——`maxmemory`／淘汰
    # 或清键会丢数据，属于「这个存储是缓存还是可靠队列」的属主决定，另案。
    # 2Gi 而不是 1Gi：现网在崩溃循环里已经被就地 patch 到 2Gi 并恢复（pod 2/2、
    # 0 次重启），chart 若按 1Gi 落地会在下一次 apply 时把它降回去——热修与正本
    # 对不上时，让正本跟随已经在跑、且已验证稳定的那个值。
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 2Gi
    # The one-shot AOF repair runs before redis starts; its footprint is a fixed
    # bound on a rewrite of the whole AOF, not a measurement.
    aofRepair:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # Serves the AOF repair verdict beside redis as a scrapeable textfile gauge.
    # redis-server has no metrics endpoint of its own, so an exporter next to it
    # is the only way a one-shot container's reading can reach a scraper.
    aofReportExporter:
      image: quay.io/prometheus/node-exporter:v1.12.1-distroless
      # 边车暴露 textfile 目录的那个端口：抓取端按它取回 AOF 修复的判词。
      port: 9100
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    # Polls INFO from beside the store and writes it into the textfile directory
    # the exporter above serves. The interval is published with the reading, so
    # the staleness bound is derived from the period the writer actually runs at
    # rather than from a constant written next to the alert rule.
    infoExporter:
      intervalSeconds: 30
      walScanIntervalSeconds: 300
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        # The poller draws under a millicore on average and still spent 57% of
        # its CFS periods throttled at 100m: the work is a short burst (one
        # redis-cli fork, one parse) that burns the whole 100 ms quota in its
        # first few milliseconds, so the average says nothing about whether the
        # quota fits. 500m clears the burst and still lets a tight node
        # schedule the pod, because the request is what the scheduler reads.
        limits:
          cpu: 500m
          memory: 64Mi
  qdrant:
    enabled: true
    # 一个实例。分片与副本要另配集群模式，这个数不是那条路。
    replicas: 1
    image: qdrant/qdrant:v1.13.4
    # REST 与 gRPC 两个面：REST 是主应用与备份用的那个，gRPC 只给批量写入，
    # 两者端口由 qdrant 自己定义、由 chart 声明，所以两个都在这里，不各写一份。
    port: 6333
    grpcPort: 6334
    storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi
  nats:
    enabled: true
    # 单节点总线：消息是进程间投递用的，不靠它做持久化队列，多副本要的是集群
    # 路由与流复制，不是把这个数加一。
    replicas: 1
    image: nats:2.10-alpine
    # 客户端端口（进程间投递走它）与监控端口（/varz 一类的运维读数）。
    port: 4222
    monitorPort: 8222
    storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  meilisearch:
    enabled: true
    # 一个实例：索引来自共享库的投影，多个副本要各自灌一遍同一份索引。
    replicas: 1
    image: getmeili/meilisearch:v1.10.3
    # HTTP 端口：主应用的 wiki 检索与进化 Pod 的启动健康检查都按它取地址。
    port: 7700
    storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  # S3 兼容对象存储，承载永久记忆的 Raw 层与冷层。默认在集群内跑 SeaweedFS
  # 单进程（master + volume + filer + S3 网关），禁用即把 providers.storage
  # 指向外部 S3 兼容端点（MinIO / 云对象存储，代码路径相同）。
  seaweedfs:
    enabled: true
    # 一个实例：master、volume、filer、s3 四个进程同 Pod，多副本要的是它们各自
    # 的集群部署，不是把这个数加一。
    replicas: 1
    image: chrislusf/seaweedfs:3.71
    # 四个进程同 Pod，四个端口各是一个面：master 管卷的分配，volume 存实际对象，
    # filer 是带目录结构的视图，s3 是主应用读写 Raw 层走的那一个。它们必须与
    # 启动参数里传给各进程的端口一致，所以参数也从这里取——写两份的话，改一处的
    # 那次里 s3 客户端连的是一个没人听的端口。
    masterPort: 9333
    volumePort: 8080
    filerPort: 8888
    s3Port: 8333
    # 承载永久记忆的 Raw 层与冷层：只增不减，实测已 15Gi，取 20Gi。
    storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# 明文默认值仅用于开发；生产请用 --set-file 或外部 Secret（然后 secrets.create=false）
secrets:
  create: true
  # 内部实例密钥留空：全新安装时自动随机生成，升级时复用已部署 Secret 中的值。
  # 仅在需要跨实例固定同一密码时才显式填写；勿在 values 里提交可用密码。
  pgPassword: ""
  redisPassword: ""
  webhookInternal: ""
  jwtSecret: ""
  # 进化 Pod 自己的 JWT 签名密钥：与主应用刻意不同。进化 Pod 持有主线部署器
  # （能推 registry、能滚四部署），把它的管理面并进用户会话的鉴权域，等于让
  # 一枚 WebUI token 够到部署器；而每次重启换签，又让它的管理面谁也进不去。
  # 一份独立且跨重启稳定的密钥同时避开这两头。
  evolutionJwtSecret: ""
  # 实例身份指纹（64 位十六进制）：安装时生成一次、之后幂等保留。身份不再由
  # 容器内的机器标识推导（容器里只有 Pod 主机名与 veth MAC，两者每轮重启都变），
  # 因此重装带同一个 Secret、换机器带同一个 Secret 都是同一个实例，也可显式钉住。
  instanceFingerprint: ""
  # 首次登录的引导管理员口令：留空则安装时随机生成，只存在 Secret 里、由部署方读出。
  # 有用户库的正式部署里没有任何本地管理员，而外部平台账号要外网、要 OAuth 应用——
  # 没有这一条，客户装完就登不进去。它是一把**装机时一次生成、可轮换**的口令，
  # 不是默认口令：仓库与 values 里永远为空。
  adminPassword: ""
  # Meilisearch 主密钥：安装时随机生成，重装复用同一 Secret 中的值。
  meiliMasterKey: ""
  # 对象存储（SeaweedFS S3 网关）凭证：同上，留空则安装时随机生成。
  s3AccessKey: ""
  s3SecretKey: ""
  # 带外凭证（网关专用）：真实值带外写入，默认空（未配置时对应功能 fail-closed）。
  llmUpstreams: ""
  # 池的冗余下限（正整数，空 = 未声明）。与上游池同一次 llm-config 写入，放在同一
  # 条注释下是因为它俩属于同一份声明：哪些家在池里、要几家同时能供才够。
  llmPoolMinHealthy: ""
  githubToken: ""
  giteeToken: ""
  githubWebhookSecret: ""
  giteeWebhookToken: ""
  # Gitee OAuth App 的 client_secret：与上面几条同类，是外面发的凭证，不是本实例
  # 生成的，所以既不能随机生成、也不该写进 values——一旦进了 values 就等于进了
  # 仓库（含历史），而它只能由 Gitee 后台轮换。留空时授权码通道 fail-closed。
  giteeOauthClientSecret: ""
  # GitHub OAuth App 的 client_secret：与上一条同类同命——外面签发、只能去
  # 平台后台轮换，写进 values 就等于进了仓库（含历史）。留空时授权码通道
  # fail-closed；设备流不需要它，不受影响。
  githubOauthClientSecret: ""
  # 通知机器人（钉钉/飞书）的签名密钥：与上面两条同类——平台后台发给那个机器人，
  # 不是本实例生成的，写进 values 就等于进了仓库。出口要签名时向安全网关借，
  # 密钥只在网关进程里；留空时那些出口的报文按未签名发（用关键词安全是合法形态）。
  notificationDingtalkSecret: ""
  notificationFeishuSecret: ""

# 贡献通道（向导第二步）：GitHub OAuth 设备流的 client_id 是 OAuth App 的
# 公开标识（非密钥），留空时设备流不可用、向导自动回退手动 PAT；Gitee 走
# OAuth 授权码流程，需要 client_id + client_secret 同时配置才开放（Gitee
# 无设备流、token 24h 过期，网关后台用 refresh_token 自动续期）。Gitee 的
# 应用凭证只注入安全网关，授权码兑换与续期都在网关进程内完成；主应用零持有，
# 经 COGNEVA_SECURITY_GATEWAY_BASE 借用公开的 client_id 拼授权 URL。
# Gitee 对 redirect_uri 严格校验（已实证：非注册回调在授权页直接报错），
# code 只回跳注册列表里的地址。默认落地页是我们的静态回调页（GitHub
# Pages 托管），页面 JS 把 code 经 window.opener.postMessage 自动递回向导；
# 注册列表里同时保留仓库页作为手动复制兜底。自注册自有 OAuth App 的部署方
# 把 giteeOauthRedirectUri 改成自己的回调即可。
# client_secret 与其它带外凭证一样只存在于 cogneva-secrets-oob（见上面 secrets 段），
# 由运维/向导写入，只进网关。
contribution:
  githubOauthClientId: "Ov23liz35yGbAC5vO0OP"
  giteeOauthClientId: "52f5294997d7a9f7046ca0bc7bf7f05da7a293a01800b5df6565be88539e2ea6"
  giteeOauthRedirectUri: "https://hcipengm.github.io/cogneva/oauth-callback.html"

# 主应用 GitOps 拉取端：poll 中央 bare 仓库的 evolution-release 分支，
# L0 配置热更 / L1 金丝雀在本集群闭环（沙盒推送端只写 bare 仓库，零集群凭证）。
gitops:
  enabled: true
  clusterName: main
  # 拉取端在 Pod 内调 kubectl（L0 apply / L1 set image、rollout）。K3s 节点挂宿主
  # k3s 二进制即可（argv[0]=kubectl 的多调用二进制，版本与集群天然一致）；标准 K8s
  # 节点挂 /usr/bin/kubectl；节点无可复用二进制时置 false（拉取端同步关闭，避免空转报错）。
  kubectlBin:
    enabled: false
    hostPath: /usr/local/bin/k3s
  # 部署准入条件里的 chart 渲染 / parity 在进化 Pod 内跑，需要 helm。与 kubectl
  # 同一条思路：挂宿主已有的二进制，版本由宿主管、镜像不背一个下载器；宿主没装
  # 时置 false，这一族就没有可执行的渲染检查（变更会被点名缺条件，不会转人工）。
  helmBin:
    enabled: false
    hostPath: /usr/local/bin/helm

# 平台 webhook 集群入口（GitHub + Gitee 共用）：NodePort 转发安全网关 8082。
webhook:
  nodePort: 30991

# 告警通知出口。出口机制（通用 webhook / 钉钉 / 飞书 / 企业微信四类 dispatcher）
# 已在代码里，缺的一直只是地址——所以这里给的就是地址本身，不给第二份开关。
# 默认空 = 不建出口，与 cogneva.json 的 gateway.notification_webhook_url: null
# 等价（WebhookDispatcher 只在 url 非空时挂上）。地址是本集群的事，不是代码或
# 清单的一部分：它只经 --set / 集群自己的 values 覆盖注入，仓库里永远为空。
# 主应用（告警判定）与进化 Pod（沙盒降级）都会发通知，两者都从 cogneva-config
# 取这一份，改一处即可。
notification:
  webhookUrl: ""
  # 平台机器人地址（钉钉 / 飞书 / 企业微信）。与上面那条同理：出口机制在代码里，
  # 缺的一直只是地址。三个键空 = 该平台不建出口；三者可以同时配、也可只配一个。
  # 一个平台只给地址，不给开关：地址就是开关。
  # 注意签名密钥（钉钉加签 secret / 飞书校验 token）**不在这里**——它们是平台签发的
  # 带外凭证，而这两个 Pod 按约定零带外凭证。不给密钥时机器人必须用「自定义关键词」
  # 这类不靠签名的安全设置才收得到，否则平台会拒收。要让签名生效，得先定密钥由哪个
  # 进程代持（按约定只能是安全网关），那是一条新的出站签名面。
  dingtalkUrl: ""
  feishuUrl: ""
  wechatWorkUrl: ""
  # 进化 Pod 的 egress 是白名单（主应用没有 egress 限制，地址在哪儿都发得出去）。
  # 地址落在集群外时，不加放行，进化 Pod 那类通知会被策略拦掉、且只有一行 warn
  # ——看起来像"没有告警"而不是"告警发不出去"。**键就是宿主的名字**：上面每个非空
  # 地址的宿主都要在这里有一项，宿主既是策略的注释也是配对键，写错名字门禁当场点名
  # （配了地址没放行、放行了没人用，两个方向都报）。
  #   cidr 是这个宿主实际解析到的地址段。让运维自己写而不是由模板去解析 DNS：策略只认
  #        地址，而平台的地址会轮换，写宽一段是运维对自己这份判断的声明；写错了也有
  #        兜底——投递读数的 result="unreachable" 会说这个出口根本没通。
  #   port 是这个宿主监听的端口（https 默认 443）。
  # 这一份放行对**下面 alertmanager 段的出口同样生效**：两套出口都在进化 Pod 里发，
  # 走同一个策略；门禁把两边的地址一起拿来配对（配了地址没放行、放行了没人用，两个
  # 方向都报），所以别把告警出口的宿主记到别处去。
  # 默认空 = 一条都不放行（此时上面四个地址也应为空）。留空只影响进化 Pod，
  # 主应用侧照发。
  egress: {}
  #  oapi.dingtalk.com:
  #    cidr: "1.2.3.0/24"
  #    port: 443

# 告警出口：supervisor 事件（LLM 上游池全灭等）、基础设施 PromQL 规则、以及
# 「配置没下发」自检的告警从这里出去。与上面 notification 段同理——三类 dispatcher
# （Alertmanager 接收端 / SMTP / Slack 入站 webhook）都在代码里，缺的一直只是地址，
# 所以这里给地址不给开关：空地址 = 不建出口，与 cogneva.json 的
# observability.alertmanager 默认值等价。两个段可以只配一个；它们的区别是发什么：
# 上面那段发给人看的通知（审批、进化降级），这一段发 Alertmanager 报文形状的告警。
# 主应用与进化 Pod 都跑这条桥，两者都从 cogneva-config 取这一份。
alertmanager:
  # 接收端 URL。本进程 POST 的报文是 Alertmanager **receiver** 收到的那种形状
  # （{"version":"1","alerts":[...]}），不是 Alertmanager 自己的提交 API
  # （/api/v1/alerts 收另一种报文，指过去会被拒）。
  webhookUrl: ""
  # 邮件出口。收件人与中继两个都要有才算一个出口——只有收件人没有中继，消息没有
  # 地方交出去，而那种状态在运行期与「没配」长得一模一样（这正是这一段要修的坏法）。
  email:
    # 逗号分隔的收件人。
    recipients: ""
    smtpHost: ""
    smtpPort: 587
    smtpUsername: ""
    fromAddress: "alerts@cogneva.local"
    useTls: true
    # 留空 = 用默认主题「Cogneva Alert — N event(s)」。
    subjectTemplate: ""
    # SMTP 口令**不在这里**：它是凭证，不进 values 也不进清单，只由集群侧写进
    # Secret 键 cogneva-secrets/smtp-password（它被主应用与进化两个 Pod 读，所以
    # 住内部份；可观测栈的口令走的是带外份的 clickhouse-password。那个键不存在时
    # 不做鉴权，Pod 照起）。写入时别用 --from-literal：口令会留进 shell 历史与
    # 进程参数。
  # Slack 出口：入站 webhook URL（incoming webhook），频道可留空由 webhook 自己的默认决定。
  slack:
    webhookUrl: ""
    channel: ""

ingress:
  enabled: true
  # 这里的默认值是**中立值**，不是任何一台集群的现状：标准 K8s 形态由运维自己装
  # ingress-nginx（见 deploy/k8s/README.md），K3s 形态则由 profile 覆盖——K3s
  # 自带 traefik 并把它标成默认 IngressClass。取 traefik 时自动附带 WebSocket
  # Middleware 与注解（需集群存在 traefik CRD）。
  className: nginx
  # 空 = 兜底路由（任意 Host 头进主应用）；设值后按 host 匹配。
  host: ""
  # 读写超时（秒）。WebSocket 与 SSE 走这条路由：nginx 的默认 60s 会把一条空闲
  # 超过一分钟的长连接掐掉，而掐断在浏览器侧只表现为"重连"，看不出是入口干的。
  proxyTimeoutSecs: 3600

# 免费网页检索：集群内自建的 SearXNG，`web_search` 的后端。
#
# 存在的理由是账单形状：agent 每回合都可能查一下，按请求计费的服务端检索会把这件事
# 变成一行行成本，而自建实例是同一台机器上的一份常驻进程。`base` 是工具进程读的环境
# 变量值——空串表示这个部署不接网页检索，工具仍在列表里、调用时报出缺的设置。
# WebUI 编辑器给每个用户的工作区配额。
workspace:
  # 每个用户工作区的总字节上限，0 表示不限。这是**每人**的界，不是整卷的界：
  # 工作区落在共享数据卷上，没有这一条时一个用户把卷写满，所有租户一起坏，
  # 而每一笔单独的写入都看不出错。
  #
  # 默认 1 GiB（实测 2026-10-25：一个纯文本工作区的典型占用在几十 MiB 量级，
  # 一 GiB 留出一个数量级的余量，同时保证单用户写不满卷）。它没有被任何读数
  # 闭环：卷级余量由 resource-quota 与 `check-container-headroom.sh` 管，单用户
  # 用量在那里看不见，所以这里是 override 而不是 derived。
  maxBytes: 1073741824
  # 编辑器单次写入与上传的字节上限由代码常量给出（不在 chart 里）：它是协议
  # 边界的一部分——超过路由层请求体封顶的请求根本到不了这一层，写进 values 的
  # 那个数只会与代码里的另一个数说法不一致。

board:
  # 看板每一列的在制品上限，格式 `column=limit[,column=limit]`，可配的列只有
  # `scheduled` 与 `running`。空串＝不配＝不限：这里不写默认数，一个凭空造出来的
  # 上限就是一条没人选过的准入闸门。
  #
  # 列满了就不是「界面上标红」，而是这一列的活不再派发——任务留在 `pending`，
  # 下一轮再看。`scheduled` 的上限直接约束发布（发布就是把任务放进这一列），
  # `running` 满了则停住喂它的队列：往上压活不能让它干得更快。`pending` 与三个
  # 终态列在解析时被拒并报告原因（会自锁 / 只增不减），不会静默生效。
  wipLimits: ""

webSearch:
  enabled: true
  # 检索后端的端口：`base` 里的地址、容器端口、Service 与 egree 放行都按它取，
  # 而 base 与策略各写一个字面量时，改一处的那次查询被策略静默丢弃。
  port: 8080
  # SearXNG 的 safe_search 档位（0 关 / 1 中等 / 2 严格）。默认关：这一层是给
  # agent 取事实用的，过滤掉的结果在 tools 返回值里不留痕，读起来像"没有这一页"。
  safeSearch: 0
  # 空 = 从 port 与 Service 名派生（http://searxng:<port>）。设值则整条地址由
  # 运维给——那时端口也跟着这条地址走，`port` 只再决定容器/Service/策略三处。
  # 默认不写字面量：同一个端口在一份文件里写两遍，就是两次机会让它们分家。
  base: ""
  # 后备检索端点：`POST {fallbackBase}/search`，只在自建的 SearXNG **一个引擎都没
  # 应答**时才问它（结果为空且 `unresponsive_engines` 非空，重试一次仍如此）。
  # 那一刻自建那层什么都没答，所以这里不放弃任何它握着的东西；出网的就是 query
  # 文本本身，没有第二样东西跟着出去。
  #
  # 空串＝这个部署选择让查询永不外发。那时全沉默的结局是「没有答案」，而不是一个
  # 用别处的检索冒充的答案——两种结局在读数上不同，选哪种是运营者的决定。
  #
  # 指向安全网关而不是公网：后备要带 key 时，key 只住在网关里（业务 Pod 零持有），
  # 且网关的出站主机是一个常量，调用方给的路径拼不进去。keyless 档不需要账号，
  # 代价是额度与公众共用——它恰好会在最需要一条后备的时候被限流。
  fallbackBase: "http://cogneva-security-gateway:8081/search-fallback"
  image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 网页抓取的渲染后端（集群内 Crawl4AI）。
# `web_fetch` 配了 `base` 就把页面交给真浏览器渲染再取正文，没配就本进程读 HTML。
# 差别落在客户端渲染（SPA）与 PDF 上：本进程读到的是一句脚本还没跑的空壳，而
# 空壳与「这一页本来就没内容」在返回值里同形。自建的理由同检索：抓取是 agent
# 每回合都可能调的动作，按次计费的服务端抓取工具会把「读一下这一页」变成账单。
webFetch:
  enabled: true
  # 渲染后端的端口：与 webSearch.port 同一处置——地址、容器端口、Service、egress
  # 放行四处同源，否则改一处等于换了一条没人放行的路。
  port: 11235
  # 空值＋enabled=false＝这个部署不接渲染后端，`web_fetch` 回落到本进程读；
  # enabled=true 且 base 为空时从 port 与 Service 名派生，理由同 webSearch.base。
  base: ""
  image: docker.io/unclecode/crawl4ai:0.7.4
  replicas: 1
  # Chromium 把共享内存当工作区用：默认的 64MiB /dev/shm 在中等页面上就会让
  # 渲染进程崩掉，而崩掉的表现是抓取超时，不是「这一页读不了」。一个页面的
  # 内存峰值 = 浏览器 + 这份 shm，limits 因此要比 shm 多出一份浏览器峰值。
  shmSize: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 3Gi

networkPolicy:
  enabled: true
  # kube-apiserver 的 Service CIDR：in-cluster kubectl 经 kubernetes Service
  # ClusterIP:443 访问 apiserver。K3s 默认 10.43.0.0/16；标准 kubeadm 常用
  # 10.96.0.0/12（k8s-standard profile 覆盖）。
  apiServerCidr: 10.43.0.0/16
  # 监控栈所在命名空间：evolution 的 infra_watch 要按 PromQL 探测基础设施
  # 信号（节点磁盘、Pod OOM 等），需放行到该命名空间的 9090（Prometheus）。
  monitoringNamespace: monitoring

# 主线跟踪自动部署器：进化 Pod 周期检测 bare 仓库公版 main 前进 → 沙盒构建 →
# buildah 推集群内 registry → 派独立 Job 门禁滚动四部署，失败自动回滚。
# 依赖 RBAC / NetworkPolicy(apiserver) / kubectl 二进制 / 集群内 registry 就位。
mainlineDeployer:
  enabled: true
  pollIntervalSecs: 600
  soakSecs: 120
  failureCooldownSecs: 3600
  # 宿主构建闸同一时刻只放行一个构建，构建期间别的构建者全被挡住，所以这个数
  # 直接决定"主线一轮占住宿主多久"，进而决定部署能跟到多快。
  # 实测（2026-10-19，进化 Pod 内采样）：jobs=2 时构建里恰好 2 个 rustc 各占满
  # 一核、合计 RSS 0.7~1.1 GiB；而该 Pod 的 CPU 上限是 8 核、内存上限 16 GiB，
  # 两个界都远没撞到。取 6 = CPU 上限 8 减去 Pod 自身（变更验证、进化循环）要留
  # 的 2 核；内存这一侧 0.55 GiB/进程 × 6 ≈ 3.3 GiB，不设限。
  # 同一时段三次构建实测 1989 / 2011 / 2173 秒，改大之后看
  # cogneva_mainline_build_seconds 是否随之下降；不降就说明瓶颈不在并行度，
  # 不要再往上加。
  cargoBuildJobs: 6
  # 部署器从裸仓库的哪个目录读清单（仓库内相对路径）。两种形态都能消费：目录里
  # 有 `kustomization.yaml` 就按它的 resources 列表读（发布资源集的权威顺序），
  # 否则按平铺的预渲染目录读（文件名前缀是渲染序号，字典序即渲染顺序）。目标清单
  # 先按声明名精确匹配、再按清单自己的 `kind` + `metadata.name` 反查，所以渲染器
  # 换一次文件名不会让消费面静默缺席。
  # 默认 `deploy/k3s`：那是单节点 K3s 的静态基线（也是本集群在跑的那份，与 chart
  # 的 k3s-single 渲染逐字段对齐）。它装的是单节点的宿主路径与 k3s 形态，指给
  # 多节点或标准 K8s 会把那些形态一并下发——那两份 profile 因此各自指向自己的
  # 预渲染目录（见 profiles/*.yaml）。
  manifestDir: "deploy/k3s"
  # 滚动启动阶段的上界（秒）：Pod 的 init 容器（仓库种子/镜像拉取）未结束时
  # 不吃就绪预算、只吃这个上界。种子是网络克隆，耗时随集群到上游的链路变化，
  # 链路慢就调大这里，不要靠放宽就绪预算。
  startupTimeoutSecs: 900
  # 滚动就绪阶段的上界（秒）：init 全部结束后，单个 deployment 收敛的预算。
  # 默认值不改（300s），只把上界变成可调。
  rolloutTimeoutSecs: 300
  # Resource face of the rollout Job's container: without it the QoS falls back
  # to BestEffort, and this is the process that decides whether to roll back --
  # evicting it turns an interrupted observation into a version failure.
  #
  # Sized from the container's own history rather than from its idle state. The
  # earlier values came from the polling wait (0m/5Mi) and missed the phases
  # that matter: across the last six rollouts it averaged 0.07-0.12 cores per
  # run (26.1 cpu-s over 218 s in the newest) with a busiest minute of 0.37
  # cores, and 63-92% of its CFS periods were throttled at a 500m cap -- its
  # kubectl children burst past half a core. Its three preflight reads run
  # before anything is changed, so a read squeezed by contention burns the
  # budget and gets recorded as `environment:...:unreachable`.
  #
  # `cpuRequest` is both an admission claim and, through it, the container's CFS
  # weight: at 10m the weight is the minimum, so under node pressure this
  # container is treated as if it were idle while it is doing the one job that
  # must not stall. It was the lowest claim in the namespace by an order of
  # magnitude (peers sit at 100m-500m). 200m is below the busiest-minute average
  # and far above the per-run average.
  #
  # `cpuLimit` was 1 core, on the theory that a burst which is not itself
  # parallel cannot be throttled by one. The first rollout under that value
  # disproved it from the container's own cgroup: `cpu.max` 100000/100000 with
  # nr_periods 509 against nr_throttled 261 -- half its active CFS periods hit
  # the quota -- and 4.85 s of CPU time clipped out of a 36.3 s run whose
  # 30-second peak was only 0.41 cores. The shape is parallel after all
  # (kubectl children beside the Go runtime's own workers), and a rate average
  # cannot see it. 2 cores is the next step up, to be re-measured from the same
  # file rather than argued from an average.
  #
  # `memoryLimit` is 512Mi against a measured working-set peak of 243MiB
  # (95% of the previous 256Mi) -- the old value left the rollback decider one
  # step from an OOM kill, and Go's GC thrashes as the heap nears the cap. The
  # request covers the resident heap between kubectl bursts.
  rolloutJob:
    cpuRequest: 200m
    memoryRequest: 64Mi
    cpuLimit: "2"
    memoryLimit: 512Mi
  # 集群内 registry 那张卷的容量回收（见 MainlineDeployer::registry_maintenance_round）。
  # 卷由 registry 自己写，本 Pod 是它唯一的推入方；回收就是把保留窗之外的老 rev 删掉，
  # 再让 registry 重启一次把孤儿 blob 从盘上放掉。
  #
  # 判据是这张卷的**占用**读数（走查边车量的盘上字节），读不到就什么都不做——没有证据
  # 时重启 registry 是有代价的动作。占用与声明量的比达到阈值、且距上次回收超过冷却窗
  # 才动手；冷却窗给的是"回收后仍高于阈值"这种情况（常驻底座本身大时，没有它就会变成
  # 每个轮询重启一次 registry）。
  registryMaintenance:
    threshold: 0.5
    cooldownSecs: 21600
    # 保留多少个最新 rev。按产出侧实测算：最近 20 个 rev 跨 13h26m（≈42 分钟一个、
    # ≈34 个/天），所以 20 个约合 14 小时——够覆盖"回滚到上一个好版本"和"人在看上一轮
    # 发生了什么"这两种回溯，又不至于让老链的层长期钉在盘上。删掉的只是保留窗外
    # **且**不在保留集里的：在飞、上一版好、四部署当前钉着的 rev 一个都不删
    # （见 prunable_tags）。
    retention: 20
  # 可观测性栈清单（deploy/k3s/observability/manifests/**）的周期收敛：按仓库
  # 当前 rev 的内容 apply，把现场修回声明态。那些清单此前只有安装脚本一条交付
  # 路径，装完一次之后仓库与现场各走各的，而「清单没生效」这件事没有判据。
  # 它不装 helm chart、不应用 Role/RoleBinding、不创建 Namespace：这三样属安装期，
  # 缺了会报出来而不是自己补（授权面自己给自己长权限是不允许的）。
  observabilityStack:
    enabled: true
    intervalSecs: 300
    # 仓库内相对路径，与安装脚本的 manifests/ 同一处。
    manifestDir: "deploy/k3s/observability/manifests"
    namespace: monitoring
    # 与安装脚本的 BACKENDS 是同一个开关：清单里的 09-clickhouse / 10-loki
    # 标着 backends 处置，两边都按它决定交付与否。
    backends: true
    applyTimeoutSecs: 120
    # 一次收敛最多在告警消息里点名几个资源，其余折成计数（消息有界）。集群可以
    # 漂移一百个对象，消息不能长到没人读。
    maxNamedResources: 6
