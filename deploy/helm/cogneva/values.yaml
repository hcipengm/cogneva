# 后端探针的失败预算。探针测的是"这个后端还能不能干活"，而 kubelet 判死一个 Pod
# 靠的是"在预算内有没有应答"，预算按空闲节点取就必然在节点忙时误杀：共址构建把
# load 拉到 20+、可用内存掉到几百 Mi 时，kubelet 连自己的 Pod IP 都 dial 不进去
# （实测 redis 因此被 liveness 杀掉，后端再断一次）。所以两类预算分开取：
# 启动预算按"最慢的合法启动"（加载大 AOF、首次 initdb、建索引），运行预算按
# "节点最忙时仍应答应答"；把两者混成一个预算，必然在其中一边取值错。
# 探针省略 timeoutSeconds 时 kubelet 默认 1 秒、failureThreshold 默认 3 次，
# 所以这里必须显式写全——"省略"本身就是按空闲节点取值。
healthProbes:
  startup:
    # tunable:
    # why: The startup half of the probe contract. The startup budget as a whole is sized for the slowest
    # why: legitimate start (loading a large AOF, first initdb, building an index); it is a stated policy, and
    # why: no loop measures start durations back into it.
    periodSeconds: 5
    # tunable:
    # why: The startup half of the probe contract.
    timeoutSeconds: 5
    # tunable:
    # why: 60 attempts at 5 seconds is the five-minute startup budget. The number is the slowest legitimate
    # why: start written down, not a derived bound.
    failureThreshold: 60
  # 主应用单独一档：它比其余工作负载多做两件事——装载本地模型权重、跑一遍建表，
  # 后者还要排在别人持有的锁后面。2026-11-06 本机实测：新镜像第一次起来用 323 秒，
  # 六十个五秒的探针在它开始监听前几秒把它判死，容器重启一次之后才起来——而那一次
  # 恰好发生在换镜像的时候。冷启动是每一次换镜像都要付的，所以这里放到一百二十个
  # 五秒，留一倍余量；真坏掉的镜像晚几分钟被判死，比换一次镜像回滚一次便宜。
  # failureThreshold 是**下限，不是种子**：回路每拍把窗口里最长的一次成功启动
  # （Pod startTime 到第一次 Ready）× 120% ÷ periodSeconds 写回，只往上不往下
  # ——比预算更慢的启动走不到 Ready，也就永远不会成为一个样本，缩小预算就是
  # 把自己下次失败变成看不见的。值报在 `cogneva_workload_startup_failure_threshold`。
  appStartup:
    # tunable:
    # why: The probe contract's own period, kept equal to every other startup budget: the app's budget differs
    # why: in how many attempts it allows, not in how often it is asked.
    periodSeconds: 5
    # tunable:
    # why: The startup half of the probe contract, for the main app's own budget.
    timeoutSeconds: 5
    # tunable:
    # why: Attempts at a 5 s probe, sized by how long this deployment's starts actually take: the
    # why: workload-resources loop reads every Ready pod's time from `status.startTime` to the transition that
    # why: made it Ready, keeps the longest in a seven-day window, adds 20% headroom and divides by the probe
    # why: period. It patches `startupProbe.failureThreshold` on the Deployments carrying
    # why: `cogneva.io/startup-policy: measured`. The declared value is a floor, not a seed that yields: a
    # why: start too slow for the budget never reaches Ready and so never becomes a sample, and shrinking below
    # why: the last declared number is how this loop would turn its own failure into silence. Only a slower
    # why: measured start raises it. The first start on 2026-11-06 measured 323 s (model load, a schema batch
    # why: queued behind other readers' locks, a collection create retrying through its own timeout), so 120
    # why: attempts is the starting floor; the deployer's 900 s still bounds the whole rollout.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=STARTUP_THRESHOLD_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_startup_budget_follows_the_longest_measured_start beat=the_startup_beat_counts_even_when_the_longest_start_does_not_move evidence=startup_evaluations
    failureThreshold: 120
  # claim-store 那一档现在只是兜底：监听先起来，首趟走查（存储根 + 三个镜像库）
  # 跑在它后面，等待由 /health/ready 承担——走查跑完之前抓取端点不存在，
  # 首拍同样不会是空的，但「监听还没起」不再等于「进程没起来」。这一档留着是因为
  # 绑定本身应当是瞬时的；真撞破它说明有别的东西挡住了 bind，那确实该重启。
  # 走查本身的耗时没变：本机实测 3m35s（containerd 60.5 GB + podman 55 GB +
  # buildah 11 GB，200m 配额下），2026-10-26 那次 4m12s。
  # 与 appStartup 同一条律、同一个窗口：这个数是下限，实测最长启动把它抬高。
  claimStoreStartup:
    # tunable:
    # why: The same probe contract, kept at the same period as every other startup budget: the claim store's
    # why: budget differs in how many attempts it allows, not in how often it is asked.
    periodSeconds: 5
    # tunable:
    # why: The startup half of the probe contract, for the claim store's own budget.
    timeoutSeconds: 5
    # tunable:
    # why: The same startup-budget law as the main app, applied to the claim store's own start: longest Ready
    # why: transition minus `status.startTime` over the seven-day window, 20% headroom, divided by the 5 s
    # why: probe period. The DaemonSet carries `cogneva.io/startup-policy: measured`, so the workload-resources
    # why: loop patches its `startupProbe.failureThreshold`. The declared value is a floor: a start that
    # why: outgrows the budget never becomes a Ready sample, and only a slower successful start raises the
    # why: budget. The 3m35s start measured on this host (containerd, podman and buildah roots at a 200m quota)
    # why: is what the floor covers; the roots only grow with the images pulled.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=STARTUP_THRESHOLD_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_startup_budget_follows_the_longest_measured_start beat=the_startup_beat_counts_even_when_the_longest_start_does_not_move evidence=startup_evaluations
    failureThreshold: 120
  liveness:
    # tunable:
    # why: The kubelet probe contract. It is written out rather than omitted because the kubelet default is one
    # why: second -- an idle-node value that kills a backend on a busy node (redis was killed this way). The
    # why: period is the probe's own convention, not a capacity measurement.
    periodSeconds: 20
    # tunable:
    # why: Same contract, same reason for being explicit: the default timeout is the idle-node number.
    timeoutSeconds: 10
    # tunable:
    # why: The runtime budget, chosen so a busy node still gets answered. It is a practice written as a
    # why: constant; no measurement moves it.
    failureThreshold: 6
  readiness:
    # tunable:
    # why: The readiness half of the probe contract; explicit for the same reason as liveness.
    periodSeconds: 10
    # tunable:
    # why: The readiness half of the probe contract.
    timeoutSeconds: 10
    # tunable:
    # why: How many missed answers take a Pod out of the endpoints. A practice.
    failureThreshold: 6
  # 备份与演练两个 Job 的探针节奏。这一档和上面三档不同：上面判的是「进程能不能
  # 应答」，这一档判的是「还在不在推进」——判停的界不在这里，界是进度文件内容里
  # 写的那个窗口（进程每推进一步重写一次），这里只管问的节奏。
  # 这四格是 fixed（探针契约与一次实践），不是 derived：kubelet 的读取节奏不可能
  # 从每一跑才写下的窗口里导出。
  #   periodSeconds 30 —— 早于窗口到期之前多问一次不会更早判停（最早也是 age>win
  #     那一拍），再密只增加探针噪音；
  #   failureThreshold 3 —— 一次读盘抖动不该变成一次重启，30s×3 才动手；
  #   initialDelaySeconds 120 —— 进程第一件事就是建这个文件，宽限只兜调度与挂卷的延迟。
  progressFile:
    # tunable:
    # why: The probe contract's own period. Asking more often cannot stop a Job any earlier than the first tick
    # why: after the age passes the window the file names, so a finer period buys nothing but probe noise.
    periodSeconds: 30
    # tunable:
    # why: The probe contract's timeout, written out for the same reason as every other probe here: the kubelet
    # why: default is the idle-node number.
    timeoutSeconds: 10
    # tunable:
    # why: Three misses at 30 seconds, so one flaky read of the progress file does not become a restart. A
    # why: practice, not a measurement.
    failureThreshold: 3
    # tunable:
    # why: The first thing the Job does is create the progress file, so the grace only covers scheduling and
    # why: volume mounting.
    initialDelaySeconds: 120

# 可选后端；禁用即假定使用外部服务（在 config 中指向外部地址）
backends:
  postgres:
    enabled: true
    # 一个实例。库是单写的，多副本要么是主从（要另一套切换机制，不在这里）要么是
    # 两份互不相干的数据；声明成值是为了让「要不要两个」成为部署问题而不是改模板。
    # tunable:
    # why: One instance: the database is single-writer in this chart, so a second copy would be a second
    # why: dataset rather than a replica. Failover is not configured here, and no reading moves this number.
    replicas: 1
    # 库的服务端口。写在这里而不是各清单各写一遍：DSN 分散在四个工作负载的 env、
    # Service、容器端口与网络策略里，五处各写一个数时，改端口的那个部署会得到
    # "连接被拒"与"策略丢包"两种都读起来像宕机的症状。
    # tunable:
    # why: The database's port, carried by the container port, the Service and five DSNs in four workloads plus
    # why: the app's own config file. An address.
    port: 5432
    image: postgres:16-alpine
    # 服务端自己的连接上限。它不是一个可以随便拍的数：存储插件启动时读这一格，把它
    # 按「同时在跑的进程数 × 每个进程的池数」分给每一池，所以它是那个分配式的分母。
    #
    # 200 的来处是 2026-11-17 的一次事故：滚动期间新旧两代 Pod 同时在池里，
    # `pg_stat_activity` 数到 100 就打满（连超级用户也进不去，新 Pod 连建表都连不上），
    # 于是取那次峰值的一倍，盖住两代同时在池里。那条读数今天仍然有生产者（下面
    # `measured-once:` 点名的序列），但没有闭环重取它：服务端的上限改不改是一个部署
    # 决定，`ALTER SYSTEM` 改 `max_connections` 还要重启数据库，所以它不是能跟着读数
    # 走的那种数。运行时也不靠它保持正确——插件启动时读服务端真实的上限，按进程与池数
    # 分摊并把是哪个界定的值发在池读数上；读不到时 `pg_pool_ceiling_unmeasured` 会亮。
    # tunable:
    # why: The server's own ceiling, not a bound this platform puts on its work: the storage plugin divides it
    # why: across the processes and pools sharing the server, so it is the denominator of that division rather
    # why: than a number anything obeys directly. 200 came from one incident -- a rolling update on 2026-11-17
    # why: where pg_stat_activity reached 100 and took no one else, so the new pod could not even create its
    # why: tables -- doubled to cover two generations sharing the server at once. The reading it rests on still
    # why: has a producer, but no loop re-takes it: raising the server's own limit means restarting the
    # why: database, which is a deployment decision rather than a value following a reading. The runtime does
    # why: not lean on it staying right -- the plugin reads the server's real ceiling at start-up, divides it
    # why: across the processes and pools, and publishes which bound decided.
    # measured-once: series=pg_stat_activity_count date=2026-11-17 found=100
    maxConnections: 200
    # 读数边车与数据库同 Pod：抓数据库的读数要库口令，独立进程就得再存一份。
    # 这个 tag 是读数的生产者，不是实现细节：最老事务年龄那条读数读的
    # `pg_stat_activity_max_tx_duration` 属于这个镜像的默认集（`--help` 列的是
    # opt-in collector，默认集不在那张名单里，所以它看起来像是「没有旗标能打开」）。
    # 换 tag 要重跑 `deploy/scripts/measure-postgres-exporter-surface.sh`：它从跑着的
    # 边车上重抓一次 `deploy/images/postgres-exporter.series.yaml`。
    exporterImage: prometheuscommunity/postgres-exporter:v0.15.0
    # 边车自己监听的那个端口：抓取端的 ServiceMonitor/抓取注解按它取数。
    # tunable:
    # why: The metrics sidecar's port beside the database. An address the scraper names.
    exporterPort: 9187
    # tunable:
    # why: The database volume: tables plus WAL. The capacity loop reads the claim's used bytes from the
    # why: claim-store walker and raises the declaration to the measured peak x 120% (whole GiB) when the peak
    # why: has outgrown it. It cannot read `pg_database_size` from inside the database and does not need to:
    # why: the figure the declaration has to cover is the bytes on disk, which is what the walker reads.
    # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
    # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
    storage: 10Gi
    # Resource bounds live here, not in the template: this file's numeric leaves
    # are exactly the ones that carry a `# tunable:` block, so a bound written into
    # a template is a bound with no judgement and no reading can see it.
    #
    # 2026-11-01: the limit was 1000m and the database spent 0.55 of its
    # periods throttled at an average of 253m -- a quota that a bursty
    # single-connection-per-client workload exhausts in 100ms samples even
    # though its average sits far below it. Every loop in the platform waits
    # on this one, so the throttle is the latency of everything. Raised to
    # 2000m and the request to match what it actually draws, which is also
    # what the scheduler was under-provisioning: the namespace quota had 10.8
    # of its 38 cores free and the node 24 idle.
    resources:
      requests:
        # tunable:
        # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
        # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
        # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
        # why: quantum. The reading published under this key carries `source=derived` once the window has enough
        # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
        # why: side of the measurement it is looking at.
        # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
        # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
        cpu: 500m
