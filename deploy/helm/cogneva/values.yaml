      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 100m
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 128Mi
  # 这个 DaemonSet 的 Pod 也占命名空间 ResourceQuota 的 pods 配额：它的 Pod 是
  # 控制器经 apiserver 在该命名空间里建的，配额满时新节点上的账本 Pod 会 Pending，
  # 那个节点于是静默地没有账本（tolerations 挡不住这件事）。当前选择：接受，并让
  # host_ledger_node_unreported 报「有节点、没账本」。不给它 priorityClassName——
  # 为了报一条读数去抢占工作负载，代价比它大。Pod 额度本身是另一件事：它由渲染集
  # 投影出来（见 resourceGovernance 段），这个 DaemonSet 的副本随渲染宿主从 live
  # cluster 读到的节点数进算式，所以多一个节点不是"配额要人重推"，是投影自己变大。

# 卷账的全集面（claim-store DaemonSet）：每节点一个进程，走查本节点存储根下的每个
# claim 目录，把每个目录占的字节发布成 `cogneva_data_volume_used_bytes`
# {persistentvolumeclaim, namespace, node}——与各 Pod 自量自己挂载的那条同名同标签，
# 因为规则按 (namespace, persistentvolumeclaim) 聚合后再除以声明量，换个名字就是另一
# 个量、没人读。
#
# 为什么必须有它：能走查封自己挂载的卷的，是写那个卷的进程；数据库 / 缓存 / 向量库 /
# 消息队列 / 对象存储 / 监控栈自己的盘写它们的都是第三方镜像，本平台没有任何进程在那些
# Pod 里。而目录型卷（local-path）上 kubelet 报的 per-volume 用量是节点文件系统本身
# ——实测 12 个 claim 报同一个 ~600GB，一个都不是它自己的。于是这一族卷此前既不参与
# 「用量 ÷ 声明量」，也没有规则读得到：一张 5Gi 的卷用到 82% 也没有任何一句话。
#
# 它与 hostLedger 分成两个 DaemonSet：需要的权限不同（cgroup 的 memory.stat 是 0444，
# 存储根是 0700 root），合一个 Pod 会让读 cgroup 的那一半也拿到根，还会让「存储根不存在」
# 连带打掉 cgroup 读数。这个容器跑 uid 0 只为跨过那个 0700 的挂载点：挂载只读、
# capabilities 全丢、根文件系统只读、不挂 SA token、不动 hostPID 与设备。
#
# 只在 k3s profile 打开：k8s-standard 用集群默认 SC（生产通常是 Longhorn 之类的 CSI），
# 那里 kubelet 的 per-volume 用量是真实的，而 `/var/lib/rancher/k3s/storage` 这个目录
# 根本不存在——开着的唯一后果是一个起不来的 DaemonSet。
claimStore:
  enabled: true
  # 节点存储根：provisioner 在这里为每个 claim 建一个 `pvc-<uid>_<ns>_<claim>` 目录。
  # 名字里的两段身份就是这个读数的全部归属来源（不查 API），所以目录名认不出来的
  # 条目不会被猜着记到某张卷上，只计入 skipped。
  hostPath: /var/lib/rancher/k3s/storage
  mountPath: /host/storage
  # tunable:
  # why: The scrape port of the per-node account. An address; the headless Service and the container port are
  # why: both read from it.
  port: 9100
  # 走查节奏。一次走查的成本是节点上那些卷的总量（本机 200GB 实测约 2s），所以它不
  # 跟着抓取跑，抓取读的是上一拍的结果；`cogneva_claim_scan_age_seconds` 把「上一拍」
  # 有多旧变成一条读数。规则 claim_scan_stale 的界是**三个这个节奏**，改这里要一起
  # 改那条规则——界若等于节奏，健康节点在两拍之间也会亮。
  # tunable:
  # why: The claim walk's cadence. Each pass measures how long the walk took; the next beat is that pass
  # why: against the seed, floored at the seed because a walk over the same disk should not run more often
  # why: than declared, and the wait hands back what the pass left of the beat. The pacer is published with
  # why: the walk's readings on the same scrape.
  # published: owner=crates/cogneva/src/claim_store.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-observability/src/claim_store.rs test=the_wait_after_a_walk_follows_what_the_walk_cost beat=the_wait_after_a_walk_follows_what_the_walk_cost evidence=evaluations
  scanIntervalSecs: 300
  # 镜像库（containerd 的根）：解出来的镜像层、容器层和 containerd 自己的日志都在
  # 这里。它们不挂在任何卷上，kubelet 报不出来（不是卷），运行时自己的镜像清单报的是
  # 压缩后的大小、且分担的层不重复计——只有走查目录得到的是这台盘上真实的字节数。
  # 本机实测 60.5 GB（content 13 GB + overlayfs snapshots 47 GB），约占根的 6%。
  # 走查比存储根慢一拍：这棵树大得多，而且它按镜像拉取/部署变化，不按工作负载写文件变化。
  imageStoreHostPath: /var/lib/rancher/k3s/agent/containerd
  imageStoreMountPath: /host/containerd
  # 同一台盘上另外两个层库：镜像构建写进去的 rootful buildah/podman 存储。它们和
  # containerd 的层是同一种字节——解开的层、不挂在任何卷上、花的是这台节点的盘——
  # 只是各自的顶层条目标题相同（`overlay`、`storage`），所以读数带 `store` 标签分开。
  # 本机实测 podman 54.9 GB + buildah 11.4 GB，此前两边都没有任何产出者。
  # 条目的 hostPath 用 DirectoryOrCreate：没跑过 rootful 构建的节点本来就没有这个
  # 目录，造一个空目录只是把「这台节点没有」变成 0 字节，不会凭空造出用量。
  extraImageStores:
    - name: podman
      hostPath: /var/lib/containers
      mountPath: /host/podman
    - name: buildah
      hostPath: /var/lib/cogneva-buildah
      mountPath: /host/buildah
  # 规则 image_store_scan_stale 的界是**三个这个节奏**，改这里要一起改那条规则。
  # tunable:
  # why: The image store walk's cadence, slower than the claim walk because the tree is larger and changes on
  # why: image pulls. Same law: the beat is the larger of the seed and the pass, so a walk that outlasts its
  # why: seed sets the next cadence instead of stacking a seed on top of it. Published beside the claim
  # why: walk's pacing on the same scrape.
  # published: owner=crates/cogneva/src/claim_store.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-observability/src/image_store.rs test=the_wait_after_a_walk_follows_what_the_walk_cost beat=the_wait_after_a_walk_follows_what_the_walk_cost evidence=evaluations
  imageScanIntervalSecs: 900
  resources:
    # 常态是每 300s 一次 readdir+stat 的走查，其余时间空转；内存按目录项规模取，
    # 与 5G 卷的量级无关（走查不读文件内容）。
    #
    # 192Mi 是按**进程自己**的量给的：只走完 content 那 13 GB 时 working set
    # 已经 87Mi，整棵 60.5 GB（809k 文件）边走边加的峰值 29 MB，相加留余量。
    # 那个数管的是 rss，而内核 OOM 动手看的是**整个 cgroup 的占用**——含走查
    # 自己带出来的页缓存与 slab。2026-10-22 实测：这个容器 usage 191.2Mi 贴着
    # 192Mi 的上限（99.7%），其中 rss 只有 41~63Mi，文件缓存 112~137Mi；它走的是
    # 存储根 525k 文件加三个镜像库 809k 文件，这些元数据页全记在它这个 cgroup 上。
    # 结果是 10-21 18:07/18:12 与 10-22 04:10 三次 OOM：内核日志里
    # `constraint=CONSTRAINT_MEMCG`、anon-rss 只有 75~128Mi，由 tokio-rt-worker
    # 在 GFP_NOFS 分配时触发——这种分配不能回收同一文件系统的缓存，于是缓存明明
    # 可回收也照样 OOM。按 rss 算的规则与按 rss 算的配额同时看不见它（当时的
    # container_memory_near_limit 读数是 0.21）。
    #
    # 代价落在读数面：这个进程一走，20 条 cogneva_data_volume_used_bytes 一起消失，
    # 直到新 Pod 走完首拍才回来（实测断了 10~45 分钟），于是 claim_usage_unmeasured
    # 与 claim_store_node_unreported 在一天里亮着六成时间。
    #
    # 上限要给到**走查自己那棵树装得下**，不是给进程的 rss 留余量。三档实测
    # 摆在一起才看清那条律：cgroup 的占用是 min(这棵树的足迹, 上限)。
    #   192Mi：usage 191~192Mi（贴着顶），1Gi 时期尾部也见过 1023.7Mi（贴着顶）
    #   512Mi：usage 506~512Mi（贴着顶）
    # 三档都贴着各自的上限，说明前两档里**树的足迹高于上限**，内核一直在按需
    # 回收把它摁在上限上；摁在上限就等于任何一次 GFP_NOFS 分配都可能撞上回收
    # 不动的那一刻。1Gi 那一档给出下界而不是终点：07:54 之后 usage 常驻
    # 1023~1024Mi、缓存 915~948Mi，仍在往上要——说明这棵树的足迹**至少** 1GiB
    # （134 万文件的 dentry/inode），1Gi 刚好卡在足迹上，等于没有余量。
    #
    # 因此上限要**明显高于足迹**，让占用停在一个低于上限的水平上（内核不再需要
    # 持续回收）。2Gi 是按「足迹至少 1GiB」加一倍给的：预期 usage 稳定在
    # 1.0~1.4GiB 一带（五到七成），若仍然一路涨到贴着 2Gi，才说明这棵树没有
    # 固定足迹，那时要动的是走查本身（分段走查、把每段带出来的缓存还回去），
    # 不是这个数。
    #
    # 判据按**峰值**读，不按均值读：每周期的峰值不逼近上限（七成为界），且没有
    # 新的 OOMKilled 与重启。均值会骗人——45 分钟窗口的前 20 分钟读出来是
    # 「稳在 432Mi、占 42%」，像平台期，其实只是两次走查之间。
    #
    # CPU 上限按突发定，不按均值定。实测 200m 下这个容器平均只用 0.077 核，却有
    # 0.83 的 cfs 周期被限流：走查是 readdir+stat 的突发，一个 100ms 周期里的突发
    # 远超 200m 给的 20ms，于是每周期做一小段就等剩下的时间。挡住的是**墙钟**，
    # 而墙钟正是启动预算与扫描节奏唯一在量的东西——首拍（存储根 + 三个镜像库）
    # 在 200m 下 3m35s，给到 1 核（一整个周期的配额）后 34.5s，同一个进程、同一棵树。
    # 均值仍不到 0.3 核，空转时一分不花。
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 10m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 32Mi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: "1"
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 2Gi

# 集群内镜像仓库：GitOps L1 金丝雀镜像秒级分发通道。
# publisher（进化 Pod）把 overlay 镜像（cogneva 基镜像 + 新二进制）push 到
# Service:5000（集群 DNS，http）；节点 kubelet 经 NodePort 以 localhost:<nodePort>
# pull（containerd 对 localhost 默认 http 免 TLS），单/多节点通吃。
# 外部仓库形态改配 COGNEVA_GITOPS_REGISTRY（跨集群生产），可置 enabled:false。
clusterRegistry:
  enabled: true
  # 一个仓库：它缓存的是这一簇的镜像层，第二个副本写同一张卷只会让两层布局互相踩。
  # tunable:
  # why: One registry: it caches this cluster's image layers on one volume, and a second writer would
  # why: interleave two layer layouts on it. Nothing measures push or pull pressure, so no loop moves this
  # why: number.
  replicas: 1
  image: registry:2
  # 仓库在集群内的服务端口：Service、containerPort、部署器拼的 Service DNS、以及
  # network-policy 里放行的那条都读这一个值。四处各写 5000 时，改一处就有一条路径
  # 静默指向不存在的端口——push 报连接拒绝、或者更糟，策略放行了一个没人听的端口。
  # tunable:
  # why: An address, not a size: the Service port, the container port, the deployer's Service DNS and the
  # why: network policy all name this one number, so it is a protocol fact those four agree on. Nothing
  # why: measures how large it should be -- a derived value would have to read the port the registry bound,
  # why: and the process reports no such reading.
  port: 5000
  # 节点上以 localhost:<nodePort> pull（containerd 对 localhost 默认 http 免 TLS），
  # 部署器拼的 COGNEVA_MAINLINE_DEPLOYER_LOCAL_REGISTRY 也读它。
  # tunable:
  # why: The node port kubelets pull from (localhost:30500, http because containerd treats localhost as
  # why: plain). It is written into image.repository, so it is an address, not a dial.
  nodePort: 30500
  # 这张卷的名字声明一次，PVC 与"谁去量它"两处都从这里取：盘上占用由本 Pod 里
  # 那个只读走查边车量（第三方 registry 进程不发布指标，而它是这张卷唯一的写者），
  # 量出来的数按这个名字挂到声明量上。两处各写一份名字时改名会静默失配——量到的
  # 数挂到一张不存在的卷上，声明量的规则对它永远看不见。
  #
  # registry 自己的 API 报的是"活 tag 引用的层"，那是另一个量：孤儿层看不见，同一
  # 时刻实测 3.74GiB vs 盘上 7.4GiB。它留在自己的序列名（cogneva_registry_referenced
  # _bytes）下，由问 API 的进程发布，供保留策略读；声明量比的必须是盘上那份。
  claimName: cogneva-registry-pvc
  # registry 写这张卷的根目录。一处声明：registry 的存储根、边车要量的路径、
  # 两个容器的挂载点都取它，任一处改单边都会让走查量到空目录（读数变成 0）。
  rootDir: /var/lib/registry
  # 走查边车对外服务的端口。Service 端点名 http 指向它，监控按那个名字发现。
  # tunable:
  # why: The walker sidecar's scrape port, referenced by the Service endpoint that monitoring discovers. An
  # why: address, not a dial.
  walkerPort: 9100
  # 金丝雀 overlay 逐 rev 累积，实测已 7.4Gi，取 10Gi。
  # tunable:
  # why: Canary overlays accumulate per revision, and 7.4Gi was measured on a working deployment. The
  # why: capacity loop reads the registry claim from the claim-store walker (the registry API reports
  # why: referenced layers, a different figure) and raises the declaration to the measured peak x 120% when
  # why: it no longer fits.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  storage: 10Gi
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 20m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
