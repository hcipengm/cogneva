global:
  namespace: cogneva
  # K3s 默认 local-path；生产可换 longhorn 等
  storageClass: local-path

image:
  repository: localhost/cogneva
  tag: "0.1.39"
  pullPolicy: IfNotPresent

gateway:
  # 单副本：单节点集群双副本无可用性收益，只放大内存与凭证副本；多节点后调回 2
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# 独立安全网关：代持全部敏感凭证，沙盒 Pod 零凭证
securityGateway:
  enabled: true
  replicas: 1

# 自进化 worker（特权容器 = 文件系统沙盒边界；接 image-based 滚动更新后可关特权）
evolution:
  enabled: true
  # git-remote 供给方式：pvc = 集群卷（多节点/生产，空卷自动从 seedUrl 拉 bare 仓库）；
  # hostPath = 单节点开发态直挂宿主 bare 仓库（宿主 <-> Pod 双向同步通道）
  gitRemote:
    mode: pvc
    hostPath: /root/omc_workspace/cogneva.git
    seedUrl: https://github.com/hcipengm/cogneva.git
    storage: 5Gi
  configHostPath: /root/omc_workspace/cogneva/cogneva.json
  sandboxStorage: 20Gi
  sourceStorage: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# 沙箱执行器：主应用与进化共用的零凭证工具执行面（run_command/read_file/write_file）。
# 不挂 Secret、不挂 ServiceAccount token；关掉后主应用/进化的工具调用将无执行面。
sandboxExecutor:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 节点镜像构建（buildah DaemonSet）：每节点构建/导入 localhost/cogneva:* 镜像。
# containerdSocket 是容器运行时 socket 在宿主的路径，随发行版不同：
#   标准 containerd（kubeadm/EKS 等）= /run/containerd
#   K3s  = /run/k3s/containerd
#   k0s  = /run/k0s/containerd （按实际核对）
# 生产多节点改用外部镜像仓库时可关闭（镜像走 registry 拉取而非节点内构建）。
buildah:
  enabled: true
  image: quay.io/buildah/stable:latest
  containerdSocket: /run/containerd
  storageHostPath: /var/lib/cogneva-buildah
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi

# 可选后端；禁用即假定使用外部服务（在 config 中指向外部地址）
backends:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
  redis:
    enabled: true
    image: redis:7-alpine
    storage: 5Gi
  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.13.4
    storage: 10Gi
  nats:
    enabled: true
    image: nats:2.10-alpine
    storage: 10Gi

# 明文默认值仅用于开发；生产请用 --set-file 或外部 Secret（然后 secrets.create=false）
secrets:
  create: true
  # 内部实例密钥留空：全新安装时自动随机生成，升级时复用已部署 Secret 中的值。
  # 仅在需要跨实例固定同一密码时才显式填写；勿在 values 里提交可用密码。
  pgPassword: ""
  redisPassword: ""
  webhookInternal: ""
  llmApiKey: ""
  # 带外凭证（网关专用）：真实值带外写入，默认空（未配置时对应功能 fail-closed）。
  llmUpstreams: ""
  githubToken: ""
  giteeToken: ""
  githubWebhookSecret: ""
  giteeWebhookToken: ""

ingress:
  enabled: true
  className: traefik
  host: cogneva.local

networkPolicy:
  enabled: true
