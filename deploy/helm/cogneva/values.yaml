global:
  namespace: cogneva
  # 集群的时间参考：每个一线工作负载都带上它，读日志、看文件名日期、判「今天」时
  # 与本机墙上的钟一致。镜像里有 /usr/share/zoneinfo，所以这是个纯 env。
  # 库（Postgres）也跟这一项走：容器带 TZ，服务端再用 `-c timezone=` 钉到同一个值，
  # 因为库的会话时区是判定而不只是显示——分区边界的日期字面量按它解释。代码里不再
  # 另写一个固定时区，改这一行，库与分区维护一起跟着改。
  timezone: Asia/Shanghai

# 存储类适配（空字符串 = 不设置 storageClassName，跟随集群默认 SC）：
# postgres/redis/qdrant 一律跟随默认 SC（K3s 默认 local-path，生产设 Longhorn 为默认）；
# evolution 卷显式 local-path；nats 与多节点 git-remote 用 Retain SC 防误删。
storage:
  # K3s 专有 Retain StorageClass（provisioner rancher.io/local-path，标准 K8s 无此
  # provisioner）：k3s profile 开启；标准 K8s 置 create:false 并把 retain 置空。
  localRetainClass:
    create: true
    name: cogneva-local-retain
    provisioner: rancher.io/local-path
  evolution: "local-path"
  retain: "cogneva-local-retain"

# 资源治理（元启动第三步：限制 Agent/沙盒把节点资源耗尽）。ResourceQuota 约束
# 命名空间总量，LimitRange 给未声明 resources 的容器兜底并夹紧单容器上下限——
# 缺了前者，一次失控的沙盒任务就能占满节点；缺了后者，没写 resources 的容器
# （安全网关就没写）按**无限**算，配额也就形同虚设。
#
# **本段不写额度数值。** 额度不是环境参数，是这套清单自己的函数：容器声明了多大、
# 副本有几个、滚动时同时存在几个 Pod、PVC 声明了多少——额度必须装得下这些，多
# 一个字节都是浪费，少一个字节则下一次滚动在准入被拒。所以它由
# `deploy/scripts/project-resource-governance.py` 从渲染集投影出来，每个 profile
# 落一份 `values.resource-governance.<profile>.yaml`（带 GENERATED 头，不要手改），
# 渲染新鲜度门禁核「文件 == 重新投影」。手写过的那份数在历史上漂过不止一次，形态
# 都一样：工作负载长大了、额度没跟，而现场读起来是"这一版永远滚不上去"。
#
# 还有两项曾经写在这里、现在都不写了：
#   - 节点数：DaemonSet 逐节点铺开后有几分 Pod 必须计入额度，而这不是任何一份清单
#     能说出来的。投影器在**渲染宿主**上从 live cluster 读节点数，并把它记进生成
#     文件的首部（`# topology-nodes: N`）；离线渲染（`render-deploy.sh --out`，CI 与
#     构建期用的就是它）没有集群，就按生成文件记录的拓扑重算，所以数不再是手写的。
#   - 运行期自建 Pod 的形状：产品创建的评测 Pod 与宿主创建的注册评测补跑 Pod，都在
#     创建前按自己那份清单把额度抬到装得下、结束后放回去。形状的唯一来源是建它
#     的那份代码，这里再写一遍就是第二处声明，而 2026-10-26 的实测显示它漂起来时
#     的表现是「滚动被第三方的 Pod 借走 surge，连续两轮 mainline 没上去」。
resourceGovernance:
  enabled: true
  limitRange:
    # 下面四项是**策略**而不是投影：它们管的是"没有声明 resources 的容器按什么
    # 算"。上限（max）与单卷上限由投影给，因为它们必须 ≥ 渲染集里最大的那份声明，
    # 低了那份声明在准入就被拒——那不是"更安全"，是那句话根本进不来。
    # tunable:
    # why: The CPU limit a container that declares none gets. It is one more call of the same law the
    # why: per-container targets already use, on the same beat: the namespace's measured container requests are
    # why: collapsed into one typical container (median request, p95 limit with the same headroom), clamped
    # why: into the LimitRange's own admitted [min,max], and written back onto the `cogneva-limits` object as a
    # why: merge patch carrying the full `spec.limits` array (the PVC entry and the max/min ride along; a
    # why: partial patch would drop them). The bound starts at the default the object already declares and only
    # why: rises: requests fall towards idle when nothing is running, and an idle request reading cannot say how
    # why: much burst this default has to cover -- so it can prove the default is too low, never too high.
    # why: Admission reads the object, not this reading -- not writing back
    # why: would leave the measured shape on the reading face only. Until any container has been measured the
    # why: object's own declared default is published as the seed. The value in force and its `source` are
    # why: published per limitRange, and every evaluation is counted, so "the value did not move" and "the loop
    # why: did not run" are different readings.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=DEFAULT_CPU_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_default_layer_keeps_the_limit_it_declares_when_the_requests_are_idle beat=the_default_beat_counts_even_when_the_value_does_not_move evidence=defaults_evaluations
    defaultCpu: 500m
    # tunable:
    # why: The memory limit for the same containers: the same call of the same law (p95 over the window with
    # why: the configured headroom, quantized up), clamped into the LimitRange's admitted range and written
    # why: back with the full `spec.limits` array. Like the CPU default it only rises: the starting point is
    # why: the default the object declares, and an idle reading never lowers it. Published per limitRange with
    # why: its `source` and the evaluation counter beside the other three defaults.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=DEFAULT_MEMORY_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_default_layer_keeps_the_limit_it_declares_when_the_requests_are_idle beat=the_default_beat_counts_even_when_the_value_does_not_move evidence=defaults_evaluations
    defaultMemory: 512Mi
    # tunable:
    # why: The CPU request a container that declares none gets: the median of the namespace's measured
    # why: container requests, clamped into the LimitRange's admitted [min,max] with the limit kept at or above
    # why: it (a request above its limit is rejected at admission). Written back with the full `spec.limits`
    # why: array, published per limitRange with its `source`, and counted on the same evaluation counter.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=DEFAULT_REQUEST_CPU_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_namespace_default_follows_the_measured_requests beat=the_default_beat_counts_even_when_the_value_does_not_move evidence=defaults_evaluations
    defaultRequestCpu: 50m
    # tunable:
    # why: The memory request for the same containers: the same median, quantized up to the loop's memory grid,
    # why: clamped into the LimitRange's admitted range with the limit at or above it, written back with the
    # why: full `spec.limits` array and published per limitRange with its `source`.
    # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=DEFAULT_REQUEST_MEMORY_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_namespace_default_follows_the_measured_requests beat=the_default_beat_counts_even_when_the_value_does_not_move evidence=defaults_evaluations
    defaultRequestMemory: 64Mi
    # tunable:
    # why: The admission floor for one container's CPU. It is the resource loop's own quantization grid
    # why: (`CPU_QUANTUM_MILLICORES`, 10m): the loop never writes a request below one quantum, so a floor at
    # why: that quantum refuses exactly what the loop cannot express. A different floor would be an admission
    # why: rule the measurements are not on the same grid as, and the two would disagree in a direction nobody
    # why: could name.
    minCpu: 10m
    # tunable:
    # why: The admission floor for one container's memory: the same quantum (`MEMORY_QUANTUM_BYTES`, 16Mi by default) the
    # why: resource loop rounds to, for the same reason as the CPU floor.
    minMemory: 16Mi
    # tunable:
    # why: The smallest PVC the namespace admits. It is the volume loop's own grid: `volume_capacity.rs` rounds
    # why: a grown claim up to whole GiB, so a floor at that grid refuses exactly the claims that loop cannot
    # why: express. Nothing measures it, and nothing should: it is the scale at which the only writer of
    # why: storage requests works.
    pvcMinStorage: 1Gi

# 应用数据目录根（/var/lib/cogneva-data）：实例身份 identity.json、学习数仓
# warehouse、进化策略 policies、记忆 memory、原始日志 raw-logs、对象存储后端都
# 落在这里。必须跨 Pod 重启存活——身份文件一旦丢失，实例名就会随每次重启的机器
# 指纹重算，按实例命名的资源（沙盒工作树、evol/ 分支）随之逐次遗留，数仓与策略
# 也一并清零。主应用与进化 Pod 各挂一个卷：两者以不同 UID 运行，共享同一 RWO 卷
# 时 kubelet 的 fsGroup 会互相改属主。
appData:
  # 声明量是策略的函数：稳态占用 ≈ 热窗口内的写入量 + 压缩后的 warm 层 +
  # 记忆/数仓等杂项。热窗口内的写入量随 agent 活动量变化，是这里唯一必须由
  # 部署方复核的输入（本机一整天全速跑：主应用 ≈ 18G 热 trace + 0.2G warm +
  # 0.7G memory ≈ 19G，取 24Gi 留头寸）。写小了不会有任何系统报错——目录型
  # 卷不强制 requests.storage，声明与实际之间没有对账机制；应用自己把实测
  # 占用发成 cogneva_data_volume_used_bytes，由规则 data_volume_over_declared_size
  # 比对，这是唯一能发现声明写小的观测面。
  # tunable:
  # why: The declaration the install starts from. The volume-capacity loop walks the claim, compares the peak
  # why: of `cogneva_data_volume_used_bytes` over its recent rounds against this request with the same
  # why: headroom the chart's declarations are sized by, and patches the claim up to it when the peak no
  # why: longer fits -- bounded by the LimitRange's per-claim maximum and by quota room, and reporting a
  # why: clamp instead of churning when either is in the way. A declaration that falls behind the writing
  # why: therefore catches up on its own; this number is what it starts from, not what it stays at.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_declaration_below_the_peak_is_raised_to_the_headroom_rounded_up beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  storage: 24Gi
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

# 本地模型权重（BGE-M3 嵌入）：加载器只从磁盘读，集群到不了 model hub。
#
# 这个开关**一处管两件事**：把宿主上的权重目录只读挂进主应用 Pod，并同时把
# `memory.load_embedding_model` 与 `memory.load_reranker_model` 打开。两者必须
# 同时成立——只挂不打开等于白挂，只打开不挂会让加载器读不到权重而**静默退回
# 网络**，在一个连不上 hub 的集群里那次拉取既不成功也不失败，插件的 init 会挂到
# liveness 杀 Pod 为止。所以它们不由几个开关分别控制，desync 在结构上不可能发生。
#
# 卷里要**两份**权重（`--model bge-m3` 与 `--model reranker` 各抓一次）：重排与
# 嵌入是不同模型，少一份的后果同上，而两个开关是一起翻的，所以缺哪一份都不会
# 只用能用的那份跑——都在同一个目录里，目录不全就是起不来。
#
# 为什么只有宿主目录、没有集群卷：多节点上一个 hostPath 只存在于一台节点，
# 换节点就挂不上，本该走 PVC——但权重进卷今天**没有产出方**（2.2GiB 的 ONNX
# 权重得先有人放进去）。挂一个空卷比不挂更坏：它同样静默退回网络，症状还是
# init 挂死，而"卷挂了"看起来又像已经配置好了。所以多节点 profile 保持关闭，
# 等有一条权重进卷的路径再开。
modelWeights:
  enabled: false
  # 由 deploy/scripts/fetch-model-weights.sh 落在这里，`--model bge-m3` 与
  # `--model reranker` 各跑一次（hf-hub 自己的缓存布局，进程起来后一个字节也不
  # 下载）。脚本按 hub 声明的哈希逐份校验，所以坏字节进不来；但它只抓点名的那一
  # 个模型，**两跑都做**才是这个目录的完整定义。
  hostPath: /srv/cogneva/models/fastembed

# 数据面备份：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象 raw 层 +
# 实例身份 Secret）打成 tar.zst 落 cogneva-backup-pvc。重启档由 PVC keep
# 策略覆盖，本备份覆盖重装/换机档（restore-from-package.sh 消费）。
backup:
  enabled: true
  # 每日 03:17：错峰，避开整点/半点的集群任务共振。时刻按下面的 timeZone
  # 解释，不跟随宿主 local。
  schedule: "17 3 * * *"
  # 触发时刻所属的 IANA 时区。**必须显式给值**：CronJob 的 spec.timeZone 为空时
  # 由 kube-controller-manager 所在节点的 local 解释，于是宿主时区一变（2026-09-26
  # 本机由 Etc/UTC 改成 Asia/Shanghai），这个平时没人盯的每日作业就静默漂 8 小时，
  # 而按 schedule 字面值做的任何核对都看不出这条漂移。备份的时点是我们自己定义的
  # 运维约定，就该由这里定，不该被"这台机器现在几点"改写。
  timeZone: "Etc/UTC"
  # 保留最新 N 份，更老的落盘即删。
  # tunable:
  # why: How many packages the volume keeps. Every backup run recomputes it from the volume's capacity
  # why: (statvfs) divided by the measured sizes of the packages already on it, newest first; the newest
  # why: package is kept even when it alone exceeds the volume. The declared 7 is only the seed for a run
  # why: that cannot measure -- no package yet, or a volume that will not answer. The number the run actually
  # why: used is written to its ledger row as `keep_target`, beside `kept`, and the backup-runs loop
  # why: publishes that pair as `BACKUP_RUN_READINGS{readout="keep_target"}` and `{readout="kept"}`, so the
  # why: value in force and the pass that used it are both readable.
  # published: owner=crates/cogneva/src/backup.rs file=crates/cog-orchestrator/src/backup_runs.rs metric=BACKUP_RUN_READINGS label=readout cadence=periodic
  # proof: file=crates/cogneva/src/backup.rs test=the_keep_count_follows_the_volume_and_the_measured_package_size beat=the_keep_beat_is_the_newest_run_finishing_even_when_the_count_stands evidence=latest_finish_age_seconds
  keepCount: 7
  # 一次运行最久能在账上「开着」，秒。它**不再杀任何东西**：容器的死活由存活探针
  # 按进度文件判（一步都不推进超过窗口才判死），这个数只写进账本那一行
  # （`backup_runs.run_deadline_seconds`），让「这一行没人收尾」有一个可判的时刻——
  # 一行开着的记录如果有人被杀，只有它自己被开出来时的那个数判得了。
  # 一小时的界比实测的几十秒高一个数量级，落在里面的是正常运行。
  # tunable:
  # why: A bookkeeping horizon, not a bound on anything: the container's liveness is judged by its progress
  # why: probe, and this number is written into the row it opens so a row left open by a killed run can later
  # why: be concluded abandoned. Each row carries the number it was opened under, so a conclusion about
  # why: yesterday is judged by yesterday's agreement rather than by today's setting. It is also an operand
  # why: of the static 26-hour alert bound (schedule + startingDeadlineSeconds + this allowance), computed
  # why: from the chart at render time; a value that moved at runtime would silently decouple those rules
  # why: from the runs they watch.
  runDeadlineSeconds: 3600
  # 一个周期错过了多久还算数（秒）：控制器在错过起点后这段时间内仍会补跑一次，
  # 更早就直接放弃。两个 CronJob 读同一个数——它们错过的原因是同一类（节点忙、
  # Pod 排不上、前一次还没结束），一边宽一边窄只会让两种作业的漏跑时机不同。
  # tunable:
  # why: The Job controller's missed-schedule window: how late a scheduled run may still be started before
  # why: the controller records a miss. It is the cluster's own scheduling contract, and an operand of the
  # why: same static 26-hour alert bound as the schedule and the run deadline. The controller does not record
  # why: why a run was missed, so there is no observed lateness to close a loop over.
  startingDeadlineSeconds: 1800
  # 留几份成功 / 失败的 Job 供翻现场：失败的多留一份，连挂两晚才看得出是不是
  # 同一个原因，只留一份时第二晚的诊断对象已经被回收。
  # tunable:
  # why: How many finished Job objects stay for inspection. This is a diagnostic agreement, not a size: no
  # why: process in the platform reads a past backup Job -- a run's durable account is its `backup_runs` row,
  # why: and a package's evidence is the file on the volume plus the package index -- so a loop over "who
  # why: looks at a past Job" would measure zero on every deployment and could never move the number. Two
  # why: successes are kept because comparing the two most recent runs is the diagnosis the objects exist
  # why: for, and a success is the baseline a failure is compared against.
  successfulJobsHistoryLimit: 2
  # tunable:
  # why: The same inspection surface for failures, one higher than the successes: two consecutive failed
  # why: nights must both remain, with the last successful run beside them, so a repeat failure can be told
  # why: apart from a new one. No process reads these objects; the `backup_runs` ledger and the package index
  # why: are what the platform reads, and Job-object retention is a human inspection convention rather than a
  # why: measured need.
  failedJobsHistoryLimit: 3
  # 失败重试几次：备份一次（下一晚自然再来，连着重试只会在同一个原因上撞几次），
  # 演练零次（答案已经落进 backup_drills 了，重试没有新信息）。
  # tunable:
  # why: The Job controller's retry contract for a daily run: one retry of the same scheduled run, never a
  # why: retry string that would push into the next day's schedule. concurrencyPolicy: Forbid already makes a
  # why: second run wait for the first, and a retry is the same run repeating with the same inputs; the
  # why: ledger records outcomes, not attempts, so there is no retry rate to derive it from.
  backoffLimit: 1
  # tunable:
  # why: Zero: a failed drill has already written its answer to backup_drills, and retrying the same package
  # why: against the same inputs cannot change the verdict. The controller contract is "attempt once"; there
  # why: is nothing measured to move it.
  drillBackoffLimit: 0
  # 备份与演练都是流式作业（COPY→文件、tar.zst 流式压缩），常驻内存极小；
  # 请求按实耗定低，免得在资源紧张的小节点上调度不出来。两个 Job 各一份界，
  # 写在 values 里才有判词（判词只挂在数值叶子上，非数值行不被枚举）。
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 100m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 64Mi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
