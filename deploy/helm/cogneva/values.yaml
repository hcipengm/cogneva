  # backup_drills。留空则随机生成。
  backupPassword: ""
  # 变更验证连测试库的角色（cog_test）口令：带 CREATEDB 与 CREATEROLE，因为
  # `backup_pg` 那几条用例要现建库、现建一个受限角色再删掉。它读不到 cogneva。
  # 留空则随机生成。
  testPassword: ""
  redisPassword: ""
  webhookInternal: ""
  jwtSecret: ""
  # 进化 Pod 自己的 JWT 签名密钥：与主应用刻意不同。进化 Pod 持有主线部署器
  # （能推 registry、能滚四部署），把它的管理面并进用户会话的鉴权域，等于让
  # 一枚 WebUI token 够到部署器；而每次重启换签，又让它的管理面谁也进不去。
  # 一份独立且跨重启稳定的密钥同时避开这两头。
  evolutionJwtSecret: ""
  # 实例身份指纹（64 位十六进制）：安装时生成一次、之后幂等保留。身份不再由
  # 容器内的机器标识推导（容器里只有 Pod 主机名与 veth MAC，两者每轮重启都变），
  # 因此重装带同一个 Secret、换机器带同一个 Secret 都是同一个实例，也可显式钉住。
  instanceFingerprint: ""
  # 首次登录的引导管理员口令：留空则安装时随机生成，只存在 Secret 里、由部署方读出。
  # 有用户库的正式部署里没有任何本地管理员，而外部平台账号要外网、要 OAuth 应用——
  # 没有这一条，客户装完就登不进去。它是一把**装机时一次生成、可轮换**的口令，
  # 不是默认口令：仓库与 values 里永远为空。
  adminPassword: ""
  # Meilisearch 主密钥：安装时随机生成，重装复用同一 Secret 中的值。
  meiliMasterKey: ""
  # 对象存储（SeaweedFS S3 网关）凭证：同上，留空则安装时随机生成。
  s3AccessKey: ""
  s3SecretKey: ""
  # 带外凭证（网关专用）：真实值带外写入，默认空（未配置时对应功能 fail-closed）。
  llmUpstreams: ""
  # 池的冗余下限（正整数，空 = 未声明）。与上游池同一次 llm-config 写入，放在同一
  # 条注释下是因为它俩属于同一份声明：哪些家在池里、要几家同时能供才够。
  llmPoolMinHealthy: ""
  githubToken: ""
  giteeToken: ""
  githubWebhookSecret: ""
  giteeWebhookToken: ""
  # Gitee OAuth App 的 client_secret：与上面几条同类，是外面发的凭证，不是本实例
  # 生成的，所以既不能随机生成、也不该写进 values——一旦进了 values 就等于进了
  # 仓库（含历史），而它只能由 Gitee 后台轮换。留空时授权码通道 fail-closed。
  giteeOauthClientSecret: ""
  # GitHub OAuth App 的 client_secret：与上一条同类同命——外面签发、只能去
  # 平台后台轮换，写进 values 就等于进了仓库（含历史）。留空时授权码通道
  # fail-closed；设备流不需要它，不受影响。
  githubOauthClientSecret: ""
  # 通知机器人（钉钉/飞书）的签名密钥：与上面两条同类——平台后台发给那个机器人，
  # 不是本实例生成的，写进 values 就等于进了仓库。出口要签名时向安全网关借，
  # 密钥只在网关进程里；留空时那些出口的报文按未签名发（用关键词安全是合法形态）。
  notificationDingtalkSecret: ""
  notificationFeishuSecret: ""

# 贡献通道（向导第二步）：GitHub OAuth 设备流的 client_id 是 OAuth App 的
# 公开标识（非密钥），留空时设备流不可用、向导自动回退手动 PAT；Gitee 走
# OAuth 授权码流程，需要 client_id + client_secret 同时配置才开放（Gitee
# 无设备流、token 24h 过期，网关后台用 refresh_token 自动续期）。Gitee 的
# 应用凭证只注入安全网关，授权码兑换与续期都在网关进程内完成；主应用零持有，
# 经 COGNEVA_SECURITY_GATEWAY_BASE 借用公开的 client_id 拼授权 URL。
# Gitee 对 redirect_uri 严格校验（已实证：非注册回调在授权页直接报错），
# code 只回跳注册列表里的地址。默认落地页是我们的静态回调页（GitHub
# Pages 托管），页面 JS 把 code 经 window.opener.postMessage 自动递回向导；
# 注册列表里同时保留仓库页作为手动复制兜底。自注册自有 OAuth App 的部署方
# 把 giteeOauthRedirectUri 改成自己的回调即可。
# client_secret 与其它带外凭证一样只存在于 cogneva-secrets-oob（见上面 secrets 段），
# 由运维/向导写入，只进网关。
contribution:
  githubOauthClientId: "Ov23liz35yGbAC5vO0OP"
  giteeOauthClientId: "52f5294997d7a9f7046ca0bc7bf7f05da7a293a01800b5df6565be88539e2ea6"
  giteeOauthRedirectUri: "https://hcipengm.github.io/cogneva/oauth-callback.html"

# 主应用 GitOps 拉取端：poll 中央 bare 仓库的 evolution-release 分支，
# L0 配置热更 / L1 金丝雀在本集群闭环（沙盒推送端只写 bare 仓库，零集群凭证）。
gitops:
  enabled: true
  clusterName: main
  # 拉取端在 Pod 内调 kubectl（L0 apply / L1 set image、rollout）。K3s 节点挂宿主
  # k3s 二进制即可（argv[0]=kubectl 的多调用二进制，版本与集群天然一致）；标准 K8s
  # 节点挂 /usr/bin/kubectl；节点无可复用二进制时置 false（拉取端同步关闭，避免空转报错）。
  kubectlBin:
    enabled: false
    hostPath: /usr/local/bin/k3s
  # 部署准入条件里的 chart 渲染 / parity 在进化 Pod 内跑，需要 helm；主线落地端也
  # 在这里按 rev 现场渲染发布集（渲染产物不进仓），没有 helm 就落不了新 rev。运行
  # 镜像自带一把钉住版本的 helm（版本读自引导器的 HELM_VERSION），默认就不挂宿主
  # 二进制——宿主那把由 bootstrap 按需装、装上后不再升级，让它遮住镜像里那把会把
  # 「现场渲出来的字节」交给一个没人钉的版本。只有在宿主必须提供 helm（镜像不是本仓
  # 构建的）时才把这一项打开并给 hostPath。
  helmBin:
    enabled: false
    hostPath: /usr/local/bin/helm

# 平台 webhook 集群入口（GitHub + Gitee 共用）：NodePort 转发安全网关 8082。
webhook:
  # tunable:
  # why: The cluster entry point for the GitHub and Gitee webhooks, forwarded to the gateway's 8082. An
  # why: address that outside senders are configured against; a measurement must not move it.
  nodePort: 30991

# 告警通知出口。出口机制（通用 webhook / 钉钉 / 飞书 / 企业微信四类 dispatcher）
# 已在代码里，缺的一直只是地址——所以这里给的就是地址本身，不给第二份开关。
# 默认空 = 不建出口，与 cogneva.json 的 gateway.notification_webhook_url: null
# 等价（WebhookDispatcher 只在 url 非空时挂上）。地址是本集群的事，不是代码或
# 清单的一部分：它只经 --set / 集群自己的 values 覆盖注入，仓库里永远为空。
# 主应用（告警判定）与进化 Pod（沙盒降级）都会发通知，两者都从 cogneva-config
# 取这一份，改一处即可。
notification:
  webhookUrl: ""
  # 平台机器人地址（钉钉 / 飞书 / 企业微信）。与上面那条同理：出口机制在代码里，
  # 缺的一直只是地址。三个键空 = 该平台不建出口；三者可以同时配、也可只配一个。
  # 一个平台只给地址，不给开关：地址就是开关。
  # 注意签名密钥（钉钉加签 secret / 飞书校验 token）**不在这里**——它们是平台签发的
  # 带外凭证，而这两个 Pod 按约定零带外凭证。不给密钥时机器人必须用「自定义关键词」
  # 这类不靠签名的安全设置才收得到，否则平台会拒收。要让签名生效，得先定密钥由哪个
  # 进程代持（按约定只能是安全网关），那是一条新的出站签名面。
  dingtalkUrl: ""
  feishuUrl: ""
  wechatWorkUrl: ""
  # 进化 Pod 的 egress 是白名单（主应用没有 egress 限制，地址在哪儿都发得出去）。
  # 地址落在集群外时，不加放行，进化 Pod 那类通知会被策略拦掉、且只有一行 warn
  # ——看起来像"没有告警"而不是"告警发不出去"。**键就是宿主的名字**：上面每个非空
  # 地址的宿主都要在这里有一项，宿主既是策略的注释也是配对键，写错名字门禁当场点名
  # （配了地址没放行、放行了没人用，两个方向都报）。
  #   cidr 是这个宿主实际解析到的地址段。让运维自己写而不是由模板去解析 DNS：策略只认
  #        地址，而平台的地址会轮换，写宽一段是运维对自己这份判断的声明；写错了也有
  #        兜底——投递读数的 result="unreachable" 会说这个出口根本没通。
  #   port 是这个宿主监听的端口（https 默认 443）。
  # 这一份放行对**下面 alertmanager 段的出口同样生效**：两套出口都在进化 Pod 里发，
  # 走同一个策略；门禁把两边的地址一起拿来配对（配了地址没放行、放行了没人用，两个
  # 方向都报），所以别把告警出口的宿主记到别处去。
  # 默认空 = 一条都不放行（此时上面四个地址也应为空）。留空只影响进化 Pod，
  # 主应用侧照发。
  egress: {}
  #  oapi.dingtalk.com:
  #    cidr: "1.2.3.0/24"
  #    port: 443

# 告警出口：supervisor 事件（LLM 上游池全灭等）、基础设施 PromQL 规则、以及
# 「配置没下发」自检的告警从这里出去。与上面 notification 段同理——三类 dispatcher
# （Alertmanager 接收端 / SMTP / Slack 入站 webhook）都在代码里，缺的一直只是地址，
# 所以这里给地址不给开关：空地址 = 不建出口，与 cogneva.json 的
# observability.alertmanager 默认值等价。两个段可以只配一个；它们的区别是发什么：
# 上面那段发给人看的通知（审批、进化降级），这一段发 Alertmanager 报文形状的告警。
# 主应用与进化 Pod 都跑这条桥，两者都从 cogneva-config 取这一份。
alertmanager:
  # 接收端 URL。本进程 POST 的报文是 Alertmanager **receiver** 收到的那种形状
  # （{"version":"1","alerts":[...]}），不是 Alertmanager 自己的提交 API
  # （/api/v1/alerts 收另一种报文，指过去会被拒）。
  webhookUrl: ""
  # 邮件出口。收件人与中继两个都要有才算一个出口——只有收件人没有中继，消息没有
  # 地方交出去，而那种状态在运行期与「没配」长得一模一样（这正是这一段要修的坏法）。
  email:
    # 逗号分隔的收件人。
    recipients: ""
    smtpHost: ""
    # tunable:
    # why: 587 is the SMTP submission port with STARTTLS. The number belongs to the protocol; a relay listening
    # why: elsewhere is an operator's --set, not a measurement for a loop to track.
    smtpPort: 587
    smtpUsername: ""
    fromAddress: "alerts@cogneva.local"
    useTls: true
    # 留空 = 用默认主题「Cogneva Alert — N event(s)」。
    subjectTemplate: ""
    # SMTP 口令**不在这里**：它是凭证，不进 values 也不进清单，只由集群侧写进
    # Secret 键 cogneva-secrets/smtp-password（它被主应用与进化两个 Pod 读，所以
    # 住内部份；可观测栈的口令走的是带外份的 clickhouse-password。那个键不存在时
    # 不做鉴权，Pod 照起）。写入时别用 --from-literal：口令会留进 shell 历史与
    # 进程参数。
  # Slack 出口：入站 webhook URL（incoming webhook），频道可留空由 webhook 自己的默认决定。
  slack:
    webhookUrl: ""
    channel: ""

ingress:
  enabled: true
  # 这里的默认值是**中立值**，不是任何一台集群的现状：标准 K8s 形态由运维自己装
  # ingress-nginx（见 deploy/k8s/README.md），K3s 形态则由 profile 覆盖——K3s
  # 自带 traefik 并把它标成默认 IngressClass。取 traefik 时自动附带 WebSocket
  # Middleware 与注解（需集群存在 traefik CRD）。
  className: nginx
  # 空 = 兜底路由（任意 Host 头进主应用）；设值后按 host 匹配。
  host: ""
  # 读写超时（秒）。WebSocket 与 SSE 走这条路由：nginx 的默认 60s 会把一条空闲
  # 超过一分钟的长连接掐掉，而掐断在浏览器侧只表现为"重连"，看不出是入口干的。
  # tunable:
  # why: nginx's proxy-read/send-timeout is a protocol parameter at the edge: how long an idle proxied
  # why: connection may stay open. The WebSocket face and the live event stream are idle between frames by
  # why: design, and nginx's 60 s default severs them in a way the browser reports only as a reconnect. The
  # why: gateway cannot tell the ingress how long its connections live -- the ingress is the one holding them
  # why: -- so the value is the edge's own contract, set above any legitimate idle gap.
  proxyTimeoutSecs: 3600

# 免费网页检索：集群内自建的 SearXNG，`web_search` 的后端。
#
# 存在的理由是账单形状：agent 每回合都可能查一下，按请求计费的服务端检索会把这件事
# 变成一行行成本，而自建实例是同一台机器上的一份常驻进程。`base` 是工具进程读的环境
# 变量值——空串表示这个部署不接网页检索，工具仍在列表里、调用时报出缺的设置。
# WebUI 编辑器给每个用户的工作区配额。
# 每个用户工作区的字节上限，**这里不给默认值**。界本身归网关的那段代码：
# 它按每个用户自己的用量（`measure_usage`）判一笔记入会不会越界，默认 1 GiB
# 与它的拒绝信息就写在同一处。chart 再抄一份数，就是把「每人的界是多少」
# 说成两遍；需要更宽裕的部署用 `--set workspace.maxBytes=<字节>` 覆盖，模板
# 只在给了值时才把它变成 `COGNEVA_WORKSPACE_MAX_BYTES`。
workspace: {}

board:
  # 看板每一列的在制品上限，格式 `column=limit[,column=limit]`，可配的列只有
  # `scheduled` 与 `running`。空串＝不配＝不限：这里不写默认数，一个凭空造出来的
  # 上限就是一条没人选过的准入闸门。
  #
  # 列满了就不是「界面上标红」，而是这一列的活不再派发——任务留在 `pending`，
  # 下一轮再看。`scheduled` 的上限直接约束发布（发布就是把任务放进这一列），
  # `running` 满了则停住喂它的队列：往上压活不能让它干得更快。`pending` 与三个
  # 终态列在解析时被拒并报告原因（会自锁 / 只增不减），不会静默生效。
  #
  # **这个上限是按项目算的，而项目就是 goal**（`Task::project_key` 取 `goal_id`）。
  # 2026-11-01 曾把 `running=1` 当成「全局一次只跑一道」，实测不成立：看板上 8 条
  # `running` 分属 8 个不同的 goal，每个 goal 各 1 条，正好都是各自项目里的第 1 条，
  # 一条也没被拦住。全局的在途条数由 `taskRouter.claimConcurrency` 管，那一格才是
  # 属主「串行一个个来解决」的落点；这里管的是「同一个 goal 不要一次铺开好几条」。
  #
  # 只配 `running` 不配 `scheduled`：`scheduled=1` 会把短任务的派发也压成每拍一件，
  # 长任务（一道变更十几分钟）会把这根管道彻底堵死。
  #
  # 2026-11-06 复核这条前提，读的是当时的队列本身（不是看板）：1,541 条 `scheduled` 的
  # 变更任务分属 1,235 个 goal，绝大多数 goal 各一条，所以这一格几乎不构成全局上限；
  # 例外是 `change-ledger:crates` 这一个 goal 扛着 104 条 `pending`——它们会被压成一次
  # 只跑一条，约 26 小时才能过完。这是这个数想要的效果（同一个 goal 不并行铺开），
  # 读到「变更多为什么排得慢」时先看 goal 的分布，别来抬这一格。
  wipLimits: "running=1"

taskRouter:
  # 一个执行进程同时跑几道任务，也就是**同时花 token 额度的条数**。
  #
  # 进程级：一个进程读的每条就绪队列共用这一份许可，多读一条队列不会翻倍。
  # 集群里有两个执行进程（`cogneva` 与 `cogneva-evolution`），所以全程最多是这个
  # 数的两倍。
  #
  # 这里配 `1`，是属主 2026-11-01 定的口径：「就算有 2623 个 goal，需求大，那也是
  # 串行一个个来解决」。当天的现场支持这个口径：额度窗口是 k3 的 5 小时窗
  # 1,670,569 token，而最贵的一道变更量到 1,002,927 输入 token；8 条在途时开窗
  # 10 分钟就花掉 1,105,275（66%），八道变更各走到一半、一道也没走完。串行的代价
  # 是慢，并行的代价是每一道都停在半路、token 一分不剩。
  #
  # **2026-11-05 改回 3：那天的前提当天就没了。** 当天实测（00:00 至 22:00）
  # `gateway_llm_usage` 里拒绝为 0 次、`refusal_kind` 全空，峰值一小时吃掉 7,300 万
  # 输入 token（00 时段 4,220 万、03 时段 7,330 万），而配 `1` 的那几个小时只有
  # 400~1,500 万。也就是说「并行会把额度耗尽」这一条今天一次也没发生，被耗尽的
  # 是产能：两个执行进程每次只跑一道，平均一道 14.4 分钟，全天 31 笔落地，目标是
  # 120 笔。额度面真要出事，读数是拒绝，不是慢——拒绝为 0 时把并发压到 1，等于
  # 用一整天的产出换一个没有出现的风险。
  #
  # 进程里还有第二道闸：agent 池的并发（`agent_pool.worker_count`，见
  # `cogneva.json`）。它按容器内存读数自算，而本平台的活跑在沙箱 Pod 里，这个
  # 进程的内存读数不随任务变，于是池子永远停在 1 —— 光抬这一格不会多跑一条。
  # 两格要一起抬，这也是这一笔同时改 `worker_count` 的原因。
  #
  # 它此前是写死在 `task_executor_router` 里的 4，只能改代码才能改；实测证据是
  # `cogneva_task_router_claim_slots` 在两个 Pod 上都报 4、`_in_flight` 各报 4，
  # 与看板上的 8 条 `running` 一一对应。改成可配置之后，这个指标仍然报每个流上
  # 的预算，所以「配了多少」与「生效了多少」在读数面是同一个数。
  #
  # **2026-11-06 抬到 6：3 是量出来的天花板，不是要的产能。** 3 生效后的第一段读数
  # （01:14 滚动完成起 40 分钟）：3 条变更在同一秒开跑，是此前 8 小时里第一次出现
  # 多条变更并行——那 8 小时的变更开工只有 17:00、19:00、22:00 各一条。但
  # 「进度 = 槽位 ÷ 单条时长」没变：这几条跑到 50 分钟仍未结束，与此前完工的
  # 40~70 分钟一致，3 槽折合 3.6 笔/小时、约 86 笔/天，仍低于 120。队列不是瓶颈：
  # 885 条 `scheduled` 变更分属 885 个不同 goal，没有一条被 `running=1` 拦住。
  #
  # 这一格的作用范围要读准：集群上限**就是**这个数，不是它的两倍。只有带 executor
  # 角色的那个进程读本地就绪流（`consumed_ready_streams` 只在 `owns_executor_role`
  # 时给出 `:local` 与 `:stop-the-line`），另一个进程只读共享流，而共享流的 lag
  # 长期为 0。上面「最多是这个数的两倍」说的是许可的算式，不是变更的产能。
  #
  # 抬到 6 而不是 5：构建槽是 3 个（`/var/lib/cogneva-build-gate/slot-{0,1,2}.lock`），
  # 但拿不到槽的变更不判负——`is_build_slot_refused` 那一路把变更留着、只重试验证，
  # 所以多出来的槽位是在等构建，不是在丢变更。留出的一格给非变更任务：generator、
  # intent-assess 也吃这同一份许可，否则它们照样能把变更挤出去。
  #
  # **2026-11-06 13:40 落回 2：上面那段只算了「会不会丢变更」，没算「每条在飞的要付多少钱」。**
  # 一笔变更尝试是 102 次 LLM 调用、约 ¥1，付钱与它落不落地无关；槽位越多，单位时间付出的
  # 尝试越多，而落地不由槽位决定。当天读数对照：11-05 全天 13 次 change-ledger 尝试、¥12.30、
  # Luna 落地 30 笔；11-06 到 13:40 已是 72 次尝试、¥71.76，落地只有 9 笔，平台全天花费
  # ¥48 → ¥123。多出来的 59 次尝试买到的是零笔落地。2 是把这条线压回 11-05 的量级（约
  # ¥24/天），代价是排队更长——账上 1,600 余条待办本来也不是这几天能过完的，排队等
  # 比排队烧钱好。要抬之前先看「每笔落地花了多少钱」，不要只看在飞条数。
  #
  # 不同步抬 `agent_pool.worker_count`：上面那段说的「池子按内存自算」只对投递到
  # agent inbox 的活成立。squad 的 planner／generator／evaluator／moderator 是
  # `AgentManager::create_agent` 直接建的，不经过 `pool_worker_handler` 里那道
  # `gate.acquire()`，所以池子不是变更产能的上限，这一笔只动这一格。
  #
  # **2026-11-13 起 0 = 按池子的窗口导出。** 上面几次抬高／落回都是在猜「几条在飞
  # 才不再烧钱」，而答案在池子自己的读数里：窗口还剩多少额度、一条活实测花多少
  # （`reserve_tokens`，按已完成任务量），相除就是这一窗还付得起几条。这个数随窗口
  # 滚动，配置里写下的任何正数都只是写下那天的窗口；所以这里交给导出，每拍重算并
  # 写回 `cogneva_task_router_claim_slots` 与求值计数。正数仍是覆盖位。
  # tunable:
  # why: How many tasks one executing process runs at once -- the number of concurrent spenders of the token
  # why: window, and the only global bound on parallelism: the board's column limits are per goal, so a
  # why: `running=1` there holds each goal to one and says nothing about eight goals running eight tasks. The
  # why: bound is now the pool's own arithmetic: once per claim interval
  # why: `crates/cog-orchestrator/src/task_executor_router.rs` reads the pool's window status and divides
  # why: what the window has left by what one whole job has actually cost -- `(allowance - spent) / reserve`,
  # why: where the reserve is the supervisor's measure over finished jobs. The difference falls immediately
  # why: (only idle permits can be taken back, in-flight work finishes), a rise climbs one step and only
  # why: after the current bound was actually full, and a window that can pay for nothing closes the lane to
  # why: zero. The ordinary read loops share the permits, so the new bound is written back to every one of
  # why: their `claim_slots` readings and the evaluation counter rises on every beat that recomputed it,
  # why: whether or not the number moved. The shipped 0 asks for that derivation; a positive value is still
  # why: the override. The seed (4) applies only until the first window is read, and an unreadable or partial
  # why: measurement leaves the bound where it is rather than treating silence as an empty window. Why the
  # why: old pinned values are not kept: measured 2026-11-01, both processes held four and spent 1,105,275 of
  # why: the k3 five-hour window's 1,670,569 tokens in the first ten minutes, none of the eight changes
  # why: finishing; measured again 2026-11-05, zero refusals all day and a peak of 73 million input tokens an
  # why: hour against 4-15 million in the hours pinned at one -- the recorded readings say the limit was
  # why: never the token window, and no pinned number can follow the window as it rolls. The companion bound
  # why: is `agent_pool.worker_count` in `cogneva.json`: nothing here is claimed until that pool has a turn,
  # why: so the two numbers still have to move together.
  # published: owner=crates/cog-orchestrator/src/task_executor_router.rs file=crates/cog-orchestrator/src/observable.rs metric=TASK_ROUTER_CLAIM_SLOTS_METRIC label=source cadence=periodic
  # proof: file=crates/cog-orchestrator/src/task_executor_router.rs test=the_claim_bound_is_republished_when_the_window_moves beat=the_claim_bound_is_republished_when_the_window_moves evidence=record_bound_evaluation
  claimConcurrency: 0

  # 本地车道（`:local`）的在途上限。这一条与上面那格分开算：只有带 executor 角色的
  # 部署读本地就绪流，变更任务全在这条流上，别的部署配多少与它无关。
  #
  # **2026-11-07 06:0x 定 2：量出来的排队点在车道，不在构建。** 六小时读数：本地车道
  # `avg_over_time(claim_in_flight[6h]) = 1.000`——每个承载它的 Pod 从生到死都是 1/1，
  # 一刻没空过；`claim_wait_seconds` 836 s（更早一次 1,793 s）；账上还有 1,954 条欠账。
  # 同期构建闸门的界是 1（dimension `io`）：19 次获取、六小时里占用 244/360 分钟
  # （68%）、调用方合计只等了 31 分钟（平均 1.65 分钟，平均一次占 12.8 分钟），
  # 满占用折合约 112 次/天，而现在只跑到约 76 次。
  #
  # **2026-11-07 06:2x 定回 1：这道门的墙不是闸门，是这个 Pod 的内存。** 上一条判据
  # 的前提是「两个构建靠闸门串行，不会同时到峰值」，实测把这条前提否掉了：进化 Pod
  # 六小时 `max_over_time(container_memory_working_set_bytes)` 峰值 15.96 GiB（实测
  # 2026-11-07），容器上限 16 GiB，平均 8.27 GiB（实测 2026-11-07）——一道任务就把
  # 上限顶满，余量为零。第二个许可接上去不是排队，是 OOM：Pod 一重启，两条在跑的都得
  # 从头再来，比不抬更贵。
  #
  # 抬不动的原因在配额一侧，实测 2026-11-07：namespace `cogneva-quota` 的
  # 本机 2026-11-07 实测：`limits.memory` 78Gi、已用 59.6Gi，再留一份滚动替换重叠
  # 之后就没有余量了。
  #
  # 抬不抬由读数定，不再由人定（判据仍可照读）：`max_over_time(container_memory_working_set_bytes{pod=~"cogneva-evolution-.*"}[24h])`
  # 实测 2026-11-07 压到 12 GiB 以下并保持一天，看的是 change-ledger completed 能否从 31 条/天上去、
  # 构建闸门平均等待是否仍 < 5 分钟、`kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}`
  # 增量为 0。峰值没下来之前抬，读到的是 OOM，不是产能。
  #
  # **0 = 按读数导出**（与 `buildGate.maxConcurrent: 0` 同一个口径；实现在
  # `crates/cog-orchestrator/src/lane_memory.rs`）：每 30 秒读一次容器 `memory.max`
  # 与本进程 `memory.current`，用空闲基线与一条任务的价格算出这一窗装得下几条，
  # 下降立即、上升每窗一格。上面那条判据因此不再需要有人手动抬——峰值下来之后，
  # 导出值自己会往上走；容器被抬到更大的上限时也一样。正数才是覆盖位：
  # 钉死它时，读数面上的 `claim_slots` 就是这里写的那个数。
  # tunable:
  # why: How many change tasks the process-local lane runs at once -- the lane every change-generation task
  # why: travels, so this number is the platform's change throughput. The chart ships 0, which asks for the
  # why: bound to be derived: every window `crates/cog-orchestrator/src/lane_memory.rs` reads the container's
  # why: `memory.max` and this process's `memory.current`, prices one task as the highest increment per task
  # why: in flight over the last hour's samples (measured task life 12.8 minutes, so about five tasks), and
  # why: divides the headroom by that price; the bound falls at once and climbs one step only after the
  # why: current bound was actually run full. A positive number is the override seat and pins it. The two
  # why: inputs are the reason it cannot be a constant: the 2026-11-07 reading that pinned it at 1 (peak
  # why: 15.96 GiB of a 16 GiB ceiling, mean 8.27 GiB, measured) is a fact about the container as it was sized that
  # why: day, and a number typed into the chart cannot see the container grow. What the loop cannot do is
  # why: raise the ceiling itself: the namespace quota measured the same day holds 78Gi of limits.memory with
  # why: 59.6Gi measured in use plus a roll's replacement overlap, so the derived bound stays at one until somebody
  # why: raises the container and the loop reads the new `memory.max`.
  # published: owner=crates/cog-orchestrator/src/lane_memory.rs file=crates/cog-orchestrator/src/observable.rs metric=TASK_ROUTER_CLAIM_SLOTS_METRIC label=source cadence=periodic
  # proof: file=crates/cog-orchestrator/src/lane_memory.rs test=the_bound_follows_the_container_limit beat=the_bound_beat_counts_even_when_the_container_does_not_move evidence=bound_evaluations
  localClaimConcurrency: 0

changeLedger:
  # 变更账一拍里，一道任务承载几条欠账。
  #
  # 并的理由是钱：一笔任务尝试实测约 102 次 LLM 调用、约 ¥1，而这笔钱的大头是
  # 固定部分——一次规划、一轮上下文、一轮沙箱验证——不随任务承载几条增长。账上
  # 1,957 条待办、其中 1,694 条同一形状（「给某条原则补上它欠的门」），一条一道
  # 任务就是把这同一份固定价格付了 1,957 次。
  #
  # 上限在生成侧：一批写成一份变更，超过一次生成写得完的量会截断、整批报废，
  # 那比不并更贵。所以界该按「一次生成装得下几条修复」量，而不是拍一个数。
  #
  # **2026-11-13 起 0 = 按图里的批次导出。** 变更账每一拍读一次任务表里它自己交
  # 出去的批次：**落地整批的最大条数 + 1** 就是下一拍的界（更大的批次是一次要
  # 验证的尝试，落地了就成为新证据）；**因工作本身被退回的最小条数 - 1** 给界封
  # 顶，退回的证据 30 天后过期（换模型/抬输出预算没有事件可订阅，旧证据不该永久
  # 钉住界）。低于已落地条数的退回不封顶——那说明问题不在批大小。还没有任何批次
  # 落地时界停在「能称为批次的最小条数」（2 条），每落地一次涨一条。界写回
  # `cogneva_change_ledger_rows_per_handover` 并带
  # `source` 标签，每一拍记一次
  # `cogneva_change_ledger_rows_per_handover_evaluations_total`：界不动时，
  # 只有这条计数能说明回路还在算。正数仍是覆盖位（钉死它，读数面就报这个数）。
  # tunable:
  # why: How many owed changes one hand-over carries, recomputed on every ledger pass from the batches the
  # why: pass itself handed over. The price of a task is mostly its fixed part -- a plan, a run's context, a
  # why: sandbox round over the whole tree -- and that part does not grow with what the task carries, so
  # why: handing the queue over one row per task paid it once per row: measured 2026-11-06, 1,957 pending
  # why: rows of which 1,694 were the same shape ("give principle X the gate it is owed"), against about 102
  # why: LLM calls and about one yuan per task attempt. What bounds the batch is the generator, not this
  # why: loop: a batch becomes one change, and a batch past what one generation can write comes back
  # why: truncated and loses everything in it. So the bound is the largest batch a hand-over carried to
  # why: completion, plus one -- a bigger size is tried, and landing it is what makes it the new proof. A
  # why: batch a generation refused for the work's own reason caps the bound one below its size, so a refused
  # why: shape is not repeated while the evidence is younger than 30 days; a refusal below what has already
  # why: landed caps nothing, because the proven size still works. A refusal paid to the environment is the
  # why: pool's answer and moves nothing. While no batch has landed the bound stands at the smallest batch the
  # why: reading can see (2), and each landing argues for one row more. The pass writes the bound and its
  # why: `source` to `cogneva_change_ledger_rows_per_handover` and
  # why: counts every recomputation on `cogneva_change_ledger_rows_per_handover_evaluations_total`, because a
  # why: bound that only moves with its inputs cannot show that the loop behind it is still running. The
  # why: deployment's 0 means derive; a positive number pins the batch and is reported as `override`.
  # published: owner=crates/cog-orchestrator/src/change_ledger.rs file=crates/cog-orchestrator/src/observable.rs metric=ROWS_PER_HANDOVER_METRIC label=source cadence=periodic
  # proof: file=crates/cog-orchestrator/src/change_ledger.rs test=the_batch_bound_follows_the_graphs_batch_outcomes beat=the_batch_bound_beat_counts_even_when_the_graph_does_not_move evidence=evaluations
  rowsPerHandover: 0

webSearch:
  enabled: true
  # 检索后端的端口：`base` 里的地址、容器端口、Service 与 egree 放行都按它取，
  # 而 base 与策略各写一个字面量时，改一处的那次查询被策略静默丢弃。
  # tunable:
  # why: The self-hosted SearXNG port: the derived base URL, the container port, the Service and the egress
  # why: rule all read it. An address.
  port: 8080
  # 空 = 从 port 与 Service 名派生（http://searxng:<port>）。设值则整条地址由
  # 运维给——那时端口也跟着这条地址走，`port` 只再决定容器/Service/策略三处。
  # 默认不写字面量：同一个端口在一份文件里写两遍，就是两次机会让它们分家。
  base: ""
  # 后备检索端点：`POST {fallbackBase}/search`，只在自建的 SearXNG **一个引擎都没
  # 应答**时才问它（结果为空且 `unresponsive_engines` 非空，重试一次仍如此）。
  # 那一刻自建那层什么都没答，所以这里不放弃任何它握着的东西；出网的就是 query
  # 文本本身，没有第二样东西跟着出去。
  #
  # 空串＝这个部署选择让查询永不外发。那时全沉默的结局是「没有答案」，而不是一个
  # 用别处的检索冒充的答案——两种结局在读数上不同，选哪种是运营者的决定。
  #
  # 指向安全网关而不是公网：后备要带 key 时，key 只住在网关里（业务 Pod 零持有），
  # 且网关的出站主机是一个常量，调用方给的路径拼不进去。keyless 档不需要账号，
  # 代价是额度与公众共用——它恰好会在最需要一条后备的时候被限流。
  fallbackBase: "http://cogneva-security-gateway:8081/search-fallback"
  image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
  # tunable:
  # why: One in-cluster instance answers every agent's web_search call. A second replica would add capacity
  # why: that nothing measures: the call path caps how many results it reads, and no reading of queue depth
  # why: or query latency is fed back into this number. A deployment that runs it hot raises this by hand.
  replicas: 1
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 100m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 256Mi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 1000m
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 1Gi

# 网页抓取的渲染后端（集群内 Crawl4AI）。
# `web_fetch` 配了 `base` 就把页面交给真浏览器渲染再取正文，没配就本进程读 HTML。
# 差别落在客户端渲染（SPA）与 PDF 上：本进程读到的是一句脚本还没跑的空壳，而
# 空壳与「这一页本来就没内容」在返回值里同形。自建的理由同检索：抓取是 agent
# 每回合都可能调的动作，按次计费的服务端抓取工具会把「读一下这一页」变成账单。
webFetch:
  enabled: true
  # 渲染后端的端口：与 webSearch.port 同一处置——地址、容器端口、Service、egress
  # 放行四处同源，否则改一处等于换了一条没人放行的路。
  # tunable:
  # why: The render backend's port, read the same way as webSearch.port. An address.
  port: 11235
  # 空值＋enabled=false＝这个部署不接渲染后端，`web_fetch` 回落到本进程读；
  # enabled=true 且 base 为空时从 port 与 Service 名派生，理由同 webSearch.base。
  base: ""
  image: docker.io/unclecode/crawl4ai:0.7.4
  # tunable:
  # why: One instance renders every page web_fetch asks for. A second replica would add capacity nothing
  # why: measures: the tool renders one page per call and no reading of render queue depth or page latency is
  # why: fed back into this number. A deployment that runs it hot raises this by hand.
  replicas: 1
  # Chromium 把共享内存当工作区用：默认的 64MiB /dev/shm 在中等页面上就会让
  # 渲染进程崩掉，而崩掉的表现是抓取超时，不是「这一页读不了」。一个页面的
  # 内存峰值 = 浏览器 + 这份 shm，limits 因此要比 shm 多出一份浏览器峰值。
  # tunable:
  # why: The size of the tmpfs mounted at /dev/shm. It is memory, so it follows the renderer's own
  # why: measurement: the size law takes the container's memory peak x 120% from the kubelet summary,
  # why: quantised to the memory quantum (16Mi by default), and that is what the volume's `sizeLimit` is patched to.
  # why: `cogneva_workload_shm_size_bytes{workload,volume,source}` publishes the reading; `source=seed` until
  # why: the seven-day window has enough samples.
  # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=SHM_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/workload_resources.rs test=the_shm_size_follows_the_measured_memory beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
  shmSize: 1Gi
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 200m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 512Mi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 2000m
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 3Gi

# 出树去看的那几件事（`outward` 循环）。
#
# 系统其余部分看的都是自己：这棵树、自己的账、自己的负载。只看自己的系统
# 只能把现有的事做细，学不到外面发生的事——依赖发了新版本、对着的接口改了、
# 当初对世界的假设不再成立。这条循环就是同一个循环的外向那一半：按配置的
# 主题去问本部署自己的检索后端，把每条结果按 URL 派生一个任务 id 交给任务图，
# 由接下这道任务的人判断它影不影响这个平台——影响就用 `propose_self_change`
# 提一条变更申请，不影响就说明为什么。它自己不判任何事，也不写任何账。
#
# 值是 `{name, query, cadence_secs?, max_items?}` 的 YAML 列表（chart 渲染成
# JSON 交给进程，所以在这里写列表而不是转义过的字符串）；空列表＝不出去看，
# 循环不启动、零出网。问的是集群内那个 SearXNG，查询文本不出集群；同一条
# 结果只会进图一次（id 由 URL 决定，重启也认得）。
#
# 示例：
#   outward:
#     queries:
#       - name: rust-runtime
#         query: "tokio axum production reliability"
#         cadence_secs: 86400
#         max_items: 2
outward:
  queries: []

networkPolicy:
  enabled: true
  # kube-apiserver 的 Service CIDR：in-cluster kubectl 经 kubernetes Service
  # ClusterIP:443 访问 apiserver。K3s 默认 10.43.0.0/16；标准 kubeadm 常用
  # 10.96.0.0/12（k8s-standard profile 覆盖）。
  apiServerCidr: 10.43.0.0/16
  # 监控栈所在命名空间：evolution 的 infra_watch 要按 PromQL 探测基础设施
  # 信号（节点磁盘、Pod OOM 等），需放行到该命名空间的 9090（Prometheus）。
  monitoringNamespace: monitoring

# 主线跟踪自动部署器：进化 Pod 周期检测 bare 仓库公版 main 前进 → 沙盒构建 →
# buildah 推集群内 registry → 派独立 Job 门禁滚动四部署，失败自动回滚。
# 依赖 RBAC / NetworkPolicy(apiserver) / kubectl 二进制 / 集群内 registry 就位。
changeVerification:
  # 变更验证那一趟的编译宽度（`CARGO_BUILD_JOBS`）。生效值由构建闸每拍从宿主量出来：
  # 宿主核数 ÷ 一个构建要多少核，与闸门判「同时放几道构建」用的是同一份测量；验证
  # 构建与主线构建派生前各读一次，下一道构建就跟着走，不需要重启。
  #
  # 下面这个数是**种子**：闸没装、或还没有一拍量到宿主时用它。历史依据是 2026-11-07
  # 进化 Pod 实测：峰值 15.6 GiB 顶着 16 GiB 容器上限，3 是让峰值落回上限之下的起点。
  # 量到宿主之后，宽度由实测取代，不再按这个数压。
  # tunable:
  # why: The width the verification build fans out at, recomputed from the build gate's own measurement of
  # why: this host: the host's cores divided by what one build demands of them, the same division the gate
  # why: uses to decide how many builds fit. The verification process reads that width when it is spawned, so
  # why: a build started after a window that changed the host follows without a restart, and the mainline
  # why: build reads the same number. The declared 3 is the seed used while no gate is in force or no window
  # why: has measured the host; the published gauge carries the width and the counter beside it says how many
  # why: windows recomputed it, even when the number did not move.
  # published: owner=crates/cog-reflection/src/build_gate/mod.rs file=crates/cog-reflection/src/build_gate/mod.rs metric=BUILD_GATE_CARGO_JOBS label=role cadence=periodic
  # proof: file=crates/cog-reflection/src/build_gate/mod.rs test=cargo_jobs_follow_the_measured_cores_and_build_demand beat=the_cargo_width_is_recomputed_every_window_and_published evidence=BUILD_GATE_CARGO_JOBS_EVALUATIONS_TOTAL
  cargoBuildJobs: 3

mainlineDeployer:
  enabled: true
  # tunable:
  # why: How often the bare repository is polled for a new main. The beat is the larger of the seed and the
  # why: cycle that just ran: a cycle can include a build and a rollout, so the wait is the remainder of the
  # why: beat the cycle consumed rather than the seed again.
  # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_mainline_wait_follows_what_a_cycle_cost beat=the_mainline_wait_follows_what_a_cycle_cost evidence=evaluations
  pollIntervalSecs: 600
  # tunable:
  # why: How long a rolled-out version runs before it is called good. Twice the measured soak phase, floored
  # why: at the protocol minimum for the host to schedule it, recomputed from each round's reading.
  # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=a_measured_wait_turns_the_next_rollouts_declared_window beat=a_measured_wait_turns_the_next_rollouts_declared_window evidence=evaluations
  soakSecs: 120
  # tunable:
  # why: How long after a failed rollout the deployer waits before trying the same revision again. The number
  # why: is the seed doubled once per consecutive environment failure and returned to the seed when one
  # why: converges; the count is measured by the loop, and the published target plus its evaluation count
  # why: show the beat is recomputed each time, not fixed at start.
  # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=a_second_environment_failure_stretches_the_cooldown beat=a_second_environment_failure_stretches_the_cooldown evidence=evaluations
  failureCooldownSecs: 3600
  # 主线构建的编译宽度。生效值与验证构建同源：构建闸每拍把「宿主核数 ÷ 单构建需求」
  # 发布成每道构建的份额，主线在派构建时读它，下一道构建就跟着走。
  #
  # 下面这个数是**种子**：闸没装、或还没有一拍量到宿主时用它。历史依据是 2026-10-19
  # 进化 Pod 内实测（jobs=2 时两个 rustc 各占一核、合计 RSS 0.7~1.1 GiB；Pod 上限
  # 8 核 / 16 GiB，取 6 = 8 核减去 Pod 自身要留的 2 核）。量到宿主之后由实测取代。
  # tunable:
  # why: How many cargo jobs the mainline build runs, from the same build-gate window the verification build
  # why: reads: the host's cores divided by what one build demands, so the mainline and the verification
  # why: builds fan out over the share the gate booked for each. The width is read when the build is spawned,
  # why: so the next build after a window that changed the host follows without a restart. The declared 6 is
  # why: the seed when no gate is in force or no window has measured the host; the published gauge carries
  # why: the width and the counter beside it shows the window recomputed it even when the number did not
  # why: move.
  # published: owner=crates/cog-reflection/src/build_gate/mod.rs file=crates/cog-reflection/src/build_gate/mod.rs metric=BUILD_GATE_CARGO_JOBS label=role cadence=periodic
  # proof: file=crates/cog-reflection/src/build_gate/mod.rs test=cargo_jobs_follow_the_measured_cores_and_build_demand beat=the_cargo_width_is_recomputed_every_window_and_published evidence=BUILD_GATE_CARGO_JOBS_EVALUATIONS_TOTAL
  cargoBuildJobs: 6
  # 部署器从裸仓库的哪个目录读清单（仓库内相对路径）。两种形态都能消费：目录里
  # 有 `kustomization.yaml` 就按它的 resources 列表读（发布资源集的权威顺序），
  # 否则按平铺的预渲染目录读（文件名前缀是渲染序号，字典序即渲染顺序）。目标清单
  # 先按声明名精确匹配、再按清单自己的 `kind` + `metadata.name` 反查，所以渲染器
  # 换一次文件名不会让消费面静默缺席。
  # 默认 `deploy/k3s`：那是单节点 K3s 的静态基线（也是本集群在跑的那份，与 chart
  # 的 k3s-single 渲染逐字段对齐）。它装的是单节点的宿主路径与 k3s 形态，指给
  # 多节点或标准 K8s 会把那些形态一并下发——那两份 profile 因此各自指向自己的
  # 预渲染目录（见 profiles/*.yaml）。
  manifestDir: "deploy/k3s"
  # 滚动启动阶段的上界（秒）：Pod 的 init 容器（仓库种子/镜像拉取）未结束时
  # 不吃就绪预算、只吃这个上界。种子是网络克隆，耗时随集群到上游的链路变化，
  # 链路慢就调大这里，不要靠放宽就绪预算。
  # tunable:
  # why: The init-container phase's own budget: the seed is a network clone whose duration follows the link
  # why: to the upstream. Twice the measured startup phase from the previous round; the seed stands until one
  # why: round has reported its durations.
  # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=a_measured_wait_turns_the_next_rollouts_declared_window beat=a_measured_wait_turns_the_next_rollouts_declared_window evidence=evaluations
  startupTimeoutSecs: 900
  # 滚动就绪阶段的上界（秒）：init 全部结束后，单个 deployment 收敛的预算。
  # 默认值不改（300s），只把上界变成可调。
  # tunable:
  # why: How long a single deployment gets to converge after init finishes. The declared window is twice the
  # why: rollout phase measured by the judging process on the previous round, from the same rollout-resource
  # why: reading that sizes the Job; the loop records the durations each round, so the budget follows the
  # why: deployment it bounds.
  # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=a_measured_wait_turns_the_next_rollouts_declared_window beat=a_measured_wait_turns_the_next_rollouts_declared_window evidence=evaluations
  rolloutTimeoutSecs: 300
  # Resource face of the rollout Job's container: without it the QoS falls back
  # to BestEffort, and this is the process that decides whether to roll back --
  # evicting it turns an interrupted observation into a version failure.
  #
  # Sized from the container's own history rather than from its idle state. The
  # earlier values came from the polling wait (0m/5Mi) and missed the phases
  # that matter: across the last six rollouts it averaged 0.07-0.12 cores per
  # run (26.1 cpu-s over 218 s in the newest) with a busiest minute of 0.37
  # cores, and 63-92% of its CFS periods were throttled at a 500m cap -- its
  # kubectl children burst past half a core. Its three preflight reads run
  # before anything is changed, so a read squeezed by contention burns the
  # budget and gets recorded as `environment:...:unreachable`.
  #
  # `cpuRequest` is both an admission claim and, through it, the container's CFS
  # weight: at 10m the weight is the minimum, so under node pressure this
  # container is treated as if it were idle while it is doing the one job that
  # must not stall. It was the lowest claim in the namespace by an order of
  # magnitude (peers sit at 100m-500m). 200m is below the busiest-minute average
  # and far above the per-run average.
  #
  # `cpuLimit` was 1 core, on the theory that a burst which is not itself
  # parallel cannot be throttled by one. The first rollout under that value
  # disproved it from the container's own cgroup: `cpu.max` 100000/100000 with
  # nr_periods 509 against nr_throttled 261 -- half its active CFS periods hit
  # the quota -- and 4.85 s of CPU time clipped out of a 36.3 s run whose
  # 30-second peak was only 0.41 cores. The shape is parallel after all
  # (kubectl children beside the Go runtime's own workers), and a rate average
  # cannot see it. 2 cores is the next step up, to be re-measured from the same
  # file rather than argued from an average.
  #
  # `memoryLimit` is 512Mi against a measured working-set peak of 243MiB
  # (95% of the previous 256Mi) -- the old value left the rollback decider one
  # step from an OOM kill, and Go's GC thrashes as the heap nears the cap. The
  # request covers the resident heap between kubectl bursts.
  rolloutJob:
    # tunable:
    # why: The rollout judgement's own scheduling claim follows what its past runs measured of themselves: each
    # why: finished Job writes its average CPU and peak memory into its termination message, the deployer keeps
    # why: that run history on disk, and sizes the next Job by the same law. The request is the p95 of those
    # why: runs, rounded up to 10m. The reading on `workload="mainline-rollout"` carries `source=derived` once
    # why: a run history exists and `source=seed` with the chart value until then; the first run therefore
    # why: keeps the seed.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_rollout_jobs_sizing_lands_on_the_container_resource_surface beat=the_rollout_jobs_sizing_lands_on_the_container_resource_surface evidence=evaluations
    cpuRequest: 200m
    # tunable:
    # why: The rollout judgement's own scheduling claim follows what its past runs measured of themselves: each
    # why: finished Job writes its average CPU and peak memory into its termination message, the deployer keeps
    # why: that run history on disk, and sizes the next Job by the same law. The request is the p95 of those
    # why: runs, rounded up to the memory quantum (16Mi by default). The reading on `workload="mainline-rollout"` carries `source=derived` once
    # why: a run history exists and `source=seed` with the chart value until then; the first run therefore
    # why: keeps the seed.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_rollout_jobs_sizing_lands_on_the_container_resource_surface beat=the_rollout_jobs_sizing_lands_on_the_container_resource_surface evidence=evaluations
    memoryRequest: 64Mi
    # tunable:
    # why: The rollout judgement's own CPU bound is the peak of its measured runs times the 120% headroom,
    # why: rounded up to 10m and never below the request; when the last few runs spent more than 10% of their
    # why: CFS periods throttled, the bound is raised by that ratio on top, so a limit that was biting stops
    # why: before the next run. The reading on `workload="mainline-rollout"` carries `source=derived` once a
    # why: run history exists and `source=seed` with the chart value until then; the first run therefore keeps
    # why: the seed.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_rollout_jobs_sizing_lands_on_the_container_resource_surface beat=the_rollout_jobs_sizing_lands_on_the_container_resource_surface evidence=evaluations
    cpuLimit: "2"
    # tunable:
    # why: The rollout judgement's own memory bound is the peak of its measured runs times the 120% headroom,
    # why: rounded up to the memory quantum (16Mi by default) and never below the request. The reading on `workload="mainline-rollout"` carries
    # why: `source=derived` once a run history exists and `source=seed` with the chart value until then; the
    # why: first run therefore keeps the seed.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_rollout_jobs_sizing_lands_on_the_container_resource_surface beat=the_rollout_jobs_sizing_lands_on_the_container_resource_surface evidence=evaluations
    memoryLimit: 512Mi
  # 集群内 registry 那张卷的容量回收（见 MainlineDeployer::registry_maintenance_round）。
  # 卷由 registry 自己写，本 Pod 是它唯一的推入方；回收就是把保留窗之外的老 rev 删掉，
  # 再让 registry 重启一次把孤儿 blob 从盘上放掉。
  #
  # 判据是这张卷的**占用**读数（走查边车量的盘上字节），读不到就什么都不做——没有证据
  # 时重启 registry 是有代价的动作。占用与声明量的比达到阈值、且距上次回收超过冷却窗
  # 才动手；冷却窗给的是"回收后仍高于阈值"这种情况（常驻底座本身大时，没有它就会变成
  # 每个轮询重启一次 registry）。
  #
  # 阈值本身按实测导出：两次回收之间隔着冷却窗，窗里新推的 rev 继续占盘，所以阈值
  # 留出的是「一个窗里的增长」所需的空间（相邻两拍体积读数之差 ÷ 间隔 × 窗长 ÷ 声明），
  # 且至少留出一个实测 rev 的边际字节。下面这个数是量不到时的种子，不是生效值——
  # 生效值每拍发布在 `cogneva_retention_target{knob="…threshold"}` 上。
  registryMaintenance:
    # tunable:
    # why: The used-bytes-to-declared-bytes ratio that triggers reclamation, recomputed on every poll from the
    # why: volume's own readings: the growth between two consecutive walker readings, projected over one
    # why: measured cooldown window, sets the headroom the threshold must leave (1 - growth in the window /
    # why: declared). The floor is one revision's measured unique footprint, so a quiet volume still keeps one
    # why: push of room. A faster growing or smaller volume lowers the threshold and reclaims earlier without a
    # why: restart. The declared 0.5 is the seed used when the volume or the declared size has not been read
    # why: yet; the published target carries which side the round used, and the evaluations counter shows every
    # why: poll evaluated the loop even when the target did not move.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_reclaim_threshold_follows_the_measured_growth_and_window beat=the_reclaim_threshold_follows_the_measured_growth_and_window evidence=evaluations
    threshold: 0.5
    # tunable:
    # why: The wait between two reclamations, so a volume whose resident floor stays above the threshold is not
    # why: restarted every poll. The cooldown follows how long the last reclamation actually held the tag
    # why: service away, doubled; a zero-length hold is not a sample and leaves the target where it was. No
    # why: rebuild measured yet means the seed.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_reclaim_cooldown_follows_how_long_a_rebuild_held_the_service beat=the_reclaim_cooldown_follows_how_long_a_rebuild_held_the_service evidence=evaluations
    cooldownSecs: 21600
    # 保留多少个最新 rev。按产出侧实测算：最近 20 个 rev 跨 13h26m（≈42 分钟一个、
    # ≈34 个/天），所以 20 个约合 14 小时——够覆盖"回滚到上一个好版本"和"人在看上一轮
    # 发生了什么"这两种回溯，又不至于让老链的层长期钉在盘上。删掉的只是保留窗外
    # **且**不在保留集里的：在飞、上一版好、四部署当前钉着的 rev 一个都不删
    # （见 prunable_tags）。
    # tunable:
    # why: How many revisions the registry keeps, recomputed at every maintenance round: the PVC's declared
    # why: bytes divided by what one revision actually costs. The cost is measured from the tag manifests --
    # why: each revision's layers that no other tag references, plus its config and manifest bytes -- so the
    # why: shared base is not charged to every revision and the computed count follows both a changed volume
    # why: and a changed image size without a restart. Labels such as `local`, `seed` and `promote-*` count as
    # why: references: a layer they pin is not freed by deleting a revision. The declared 20 is the seed when
    # why: the volume is not declared or no revision has a measurable unique layer; `source` on the published
    # why: target says which side the round used, and the evaluations counter shows a round was evaluated even
    # why: when the target did not move.
    # published: owner=crates/cog-reflection/src/mainline_deployer.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/mainline_deployer.rs test=the_registry_retention_follows_the_volume_and_the_measured_rev_footprint beat=the_registry_retention_follows_the_volume_and_the_measured_rev_footprint evidence=evaluations
    retention: 20
  # 可观测性栈清单（deploy/k3s/observability/manifests/**）的周期收敛：按仓库
  # 当前 rev 的内容 apply，把现场修回声明态。那些清单此前只有安装脚本一条交付
  # 路径，装完一次之后仓库与现场各走各的，而「清单没生效」这件事没有判据。
  # 它不装 helm chart、不应用 Role/RoleBinding、不创建 Namespace：这三样属安装期，
  # 缺了会报出来而不是自己补（授权面自己给自己长权限是不允许的）。
  observabilityStack:
    enabled: true
    # tunable:
    # why: How often the manifests are re-applied. The next wait is the beat minus what the pass actually took,
    # why: and the beat is the larger of the seed and the pass: a converge pass that outlasts the seed sets the
    # why: next cadence instead of having a seed stacked on top of it.
    # published: owner=crates/cog-reflection/src/observability_stack.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/observability_stack.rs test=the_convergence_wait_follows_what_a_round_cost beat=the_convergence_wait_follows_what_a_round_cost evidence=evaluations
    intervalSecs: 300
    # 仓库内相对路径，与安装脚本的 manifests/ 同一处。
    manifestDir: "deploy/k3s/observability/manifests"
    namespace: monitoring
    # 与安装脚本的 BACKENDS 是同一个开关：清单里的 09-clickhouse / 10-loki
    # 标着 backends 处置，两边都按它决定交付与否。
    backends: true
