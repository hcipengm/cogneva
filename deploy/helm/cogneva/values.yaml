global:
  namespace: cogneva

# 存储类适配（空字符串 = 不设置 storageClassName，跟随集群默认 SC）：
# postgres/redis/qdrant 一律跟随默认 SC（K3s 默认 local-path，生产设 Longhorn 为默认）；
# evolution 卷显式 local-path；nats 与多节点 git-remote 用 Retain SC 防误删。
storage:
  # K3s 专有 Retain StorageClass（provisioner rancher.io/local-path，标准 K8s 无此
  # provisioner）：k3s profile 开启；标准 K8s 置 create:false 并把 retain 置空。
  localRetainClass:
    create: true
    name: cogneva-local-retain
    provisioner: rancher.io/local-path
  evolution: "local-path"
  retain: "cogneva-local-retain"

# 资源治理（元启动第三步：限制 Agent/沙盒把节点资源耗尽）。ResourceQuota 约束
# 命名空间总量，LimitRange 给未声明 resources 的容器兜底并夹紧单容器上下限——
# 缺了前者，一次失控的沙盒任务就能占满节点；缺了后者，没写 resources 的容器
# （安全网关就没写）按**无限**算，配额也就形同虚设。
#
# 数值按**单节点 K3s（≥4C8G 空白机）**标定：常设镜像分发开销
# （image-server 100m/64Mi + 每节点 importer 200m/1Gi）已计入，并留出滚动期的
# 瞬时增量（主线滚动 Job 500m/256Mi；四个业务部署都是单副本且 maxSurge=0，
# 滚动靠先删旧 Pod 再建新 Pod 腾位，不额外占位）。多节点每增一个节点按
# +200m limits.cpu / +1Gi limits.memory 上调——**渲染期拿不到节点数**，所以这是
# 由元启动/运维按集群规模经 --set 覆盖的项，不是自动伸缩。
resourceGovernance:
  enabled: true
  quota:
    requestsCpu: "6"
    requestsMemory: 12Gi
    limitsCpu: "17"
    limitsMemory: 34Gi
    pods: "40"
    # 存储声明是**命名空间内全部 PVC 之和的上限**，不是某个卷的容量：目录型卷
    # 不强制 requests.storage，写多少都不影响落盘，它唯一的作用是拒绝一份声明
    # 总量越界的清单。所以它必须 ≥ 本 chart 自己声明的和，否则这套清单装不进
    # 自己的命名空间（实机事故：声明和 188Gi vs 上限 110Gi，PVC 全被拒，落地
    # 通道断了整天）；而它也不能远高于声明和，否则这个上限就失去意义。当前
    # 声明和 265Gi（单节点 profile，不含 git-remote），取 300Gi 留 35Gi 头寸。
    # 每个声明的推导在各自字段旁；渲染期门禁 check-governance-consistency.sh
    # 会按渲染产物重算这个和并打印头寸，改声明忘记同步这里会直接失败。
    requestsStorage: 300Gi
  limitRange:
    defaultCpu: 500m
    defaultMemory: 512Mi
    defaultRequestCpu: 50m
    defaultRequestMemory: 64Mi
    maxCpu: "4"
    maxMemory: 8Gi
    minCpu: 10m
    minMemory: 16Mi
    # 单个 PVC 的上限：必须 ≥ 本 chart 最大的那份卷声明（当前是进化源码卷
    # 72Gi，实测 target/ 已 57Gi 且随构建增长）。定小了不是"更安全"——同一份
    # 声明在安装面直接被拒，装不进来；渲染期门禁对每条声明逐个核这个上限。
    pvcMaxStorage: 80Gi
    pvcMinStorage: 1Gi

# 应用数据目录根（/var/lib/cogneva-data）：实例身份 identity.json、学习数仓
# warehouse、进化策略 policies、记忆 memory、原始日志 raw-logs、对象存储后端都
# 落在这里。必须跨 Pod 重启存活——身份文件一旦丢失，实例名就会随每次重启的机器
# 指纹重算，按实例命名的资源（沙盒工作树、evol/ 分支）随之逐次遗留，数仓与策略
# 也一并清零。主应用与进化 Pod 各挂一个卷：两者以不同 UID 运行，共享同一 RWO 卷
# 时 kubelet 的 fsGroup 会互相改属主。
appData:
  # 声明量是策略的函数：稳态占用 ≈ 热窗口内的写入量 + 压缩后的 warm 层 +
  # 记忆/数仓等杂项。热窗口内的写入量随 agent 活动量变化，是这里唯一必须由
  # 部署方复核的输入（本机一整天全速跑：主应用 ≈ 18G 热 trace + 0.2G warm +
  # 0.7G memory ≈ 19G，取 24Gi 留头寸）。写小了不会有任何系统报错——目录型
  # 卷不强制 requests.storage，声明与实际之间没有对账机制；应用自己把实测
  # 占用发成 cogneva_data_volume_used_bytes，由规则 data_volume_over_declared_size
  # 比对，这是唯一能发现声明写小的观测面。
  storage: 24Gi
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

# 数据面备份：权威数据（PG 逻辑导出 + Qdrant 一致性快照 + 对象 raw 层 +
# 实例身份 Secret）打成 tar.zst 落 cogneva-backup-pvc。重启档由 PVC keep
# 策略覆盖，本备份覆盖重装/换机档（restore-from-package.sh 消费）。
backup:
  enabled: true
  # 每日 03:17：错峰，避开整点/半点的集群任务共振。时刻按下面的 timeZone
  # 解释，不跟随宿主 local。
  schedule: "17 3 * * *"
  # 触发时刻所属的 IANA 时区。**必须显式给值**：CronJob 的 spec.timeZone 为空时
  # 由 kube-controller-manager 所在节点的 local 解释，于是宿主时区一变（2026-09-26
  # 本机由 Etc/UTC 改成 Asia/Shanghai），这个平时没人盯的每日作业就静默漂 8 小时，
  # 而按 schedule 字面值做的任何核对都看不出这条漂移。备份的时点是我们自己定义的
  # 运维约定，就该由这里定，不该被"这台机器现在几点"改写。
  timeZone: "Etc/UTC"
  # 保留最新 N 份，更老的落盘即删。
  keepCount: 7
  storage: 10Gi
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

image:
  # 工作负载统一从集群内 registry 的 NodePort 拉取（每个节点的 kubelet 经
  # localhost:<nodePort> 访问，containerd 对 localhost 默认 http 免 TLS）。
  # 不直接 pin 节点本地镜像名：ctr tag/import 得到的引用名不保证被 kubelet
  # 的镜像存在性判定采信，且静态清单/GitOps apply 后没有统一的浮动签权威。
  # :local 浮动签只由 bootstrap 播种、swap-image/mainline 收敛后前移。
  repository: localhost:30500/cogneva
  # 默认 tag = 应用版本（与 Cargo.toml workspace version 同源，发布脚本强制校验）。
  # 自举部署的 profile values 覆盖为 local（浮动签，随导入的 release 镜像走）。
  tag: "0.5.8"
  # 必须 Always：静态清单把四部署指回浮动签 :local，内容可被 bootstrap/swap-image
  # 重新播种。IfNotPresent 下节点缓存里那份旧内容会被无限期复用——tag 字符串没变、
  # registry 上 :local 也是新的，唯独节点跑的是旧二进制，任何基于清单/registry 的
  # 校验都看不出这条降级。Always 让浮动签的"拉取时解析"语义成立。
  pullPolicy: Always

gateway:
  # 单副本：单节点集群双副本无可用性收益，只放大内存与凭证副本；多节点后调回 2
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# git 身份基线（owner/name）。两个进程消费同一个值，所以定义在共享层而不是
# 挂在任一侧名下——拆成两份必然漂移，而漂移的后果是无声的：自举登记的仓库与
# 选路探测的仓库一旦不同，SSH 自证就永远握手不过，身份停在 pending。
#   - 主应用进程：git 身份自举的后台循环跑在这里——它同时握着自举需要的三样
#     东西（cogneva-secrets 的读写权、到达 GitHub 的 egress、以及网关部署的
#     滚动权），所以生成的公钥由它登记成这个仓库的部署密钥，并滚网关让私钥
#     被兜底通道读进去。空 = 不自动登记，只把公钥挂到 WebUI 等人给 token。
#   - 安全网关：传输选路的实测拿它当探测目标，SSH 兜底也用它拼远端前缀。
gitIdentity:
  repo: hcipengm/cogneva

# 独立安全网关：代持全部敏感凭证，沙盒 Pod 零凭证
securityGateway:
  enabled: true
  replicas: 1
  # 网关在全部调用链最前面（LLM 与 git 透传的唯一凭证出口）：没有 request 时
  # 调度器按 BestEffort 处理，节点一有压力先驱逐它，而被驱逐的 Pod 正是调用方
  # 的直接下游；request 按常驻实耗给，limit 留突发余量。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 观测通道端口：只挂 /health/* 与 /metrics，不含任何代理路由。与 8080/8081
  # 分列的原因是那两条通道会注入真实上游凭证，跨命名空间放行等于把凭证代持
  # 能力交给监控侧；观测通道没有代理面，可以只对它放行监控命名空间。
  metricsPort: 9090
  metricsAllowedNamespaces:
    - monitoring
  # git 传输的 SSH 兜底（HTTPS 快路径 + SSH 兜底，实现在 cog-gateway 的
  # git_mirror 模块）。GitHub 的 HTTPS 通道实测是高方差 + 偶发黑洞：好时 0.5s、
  # 坏时直冲超时，而黑洞期一来主线 deployer 拉不到基线、landing 推不上去，整条
  # 自进化链路停摆。开这个开关后网关自持一份裸镜像，连续失败即熔断降级到 SSH。
  #
  # 私钥来自 cogneva-secrets/git-ssh-private-key（真实部署用 SSH 公钥上传到
  # GitHub 账号，私钥只注入网关）；**缺私钥时兜底自动保持关闭**，网关退回纯
  # HTTPS 透传、行为与从前一致——所以可以先开开关、后补凭证。
  gitMirror:
    enabled: true
    # 镜像卷：<root>/github/<owner>/<repo>.git。它是本 chart 里唯一**不需要**
    # resource-policy: keep 的卷——内容全部可从一个外部真相源（GitHub）重建，
    # 标了 keep 只会在反复重装时堆出无主的陈旧镜像。5Gi 对 cogneva 仓库
    # （含历史与 LFS 外的全部对象）绰绰有余。
    storage: 5Gi
    # 兜底传输的两条执行预算（秒），判据在代码里（cog-gateway 的 git_mirror）：
    #   stallSecs   —— SSH 侧多久没有任何输出就判这条传输已死（杀进程组、让请求
    #                  响亮失败），地板 30。判"静默"而不是"总时长"，是为了把
    #                  "链路慢"（该等）与"链路死"（该换通道）分开。
    #   timeoutSecs —— 单次 clone/fetch/push 的总上限，地板 60。防的是"一直在吐
    #                  进度却永远不结束"——那种形态静默判据永远不触发。
    # 默认值来自实测：本链路一次完整镜像克隆约 97 秒。
    stallSecs: 180
    timeoutSecs: 1800
  # 部署期网络画像盖章（restricted / open）。空 = 不盖章，由网关自己探。
  # 它只是**首帧默认值**：网关启动就发起一次真实握手实测，结论落地即压过盖章
  # （证据优先于部署时的猜测）。用途是让首批 git 请求不必先撞一次已知会挂的
  # 通道——那类网络里探测本身就要几十秒才有结论。
  netProfile: ""
  # 上游池可观测导出端点。四种体裁各落各的后端：日志→Loki、时序明细
  # →ClickHouse、告警状态机→PostgreSQL（复用 cogneva 自身 PG，无需配置）、
  # 指标→Prometheus（ServiceMonitor 已抓取）。默认开启：观测栈的安装脚本
  # 默认就带上这两个后端（BACKENDS=1）；端点不通时网关只降级告警，池自愈
  # 主链（Redis 跨进程信号 + PG 告警）不依赖它们。只要指标栈时设 BACKENDS=0
  # 并把这两项置 false。
  observability:
    loki:
      enabled: true
      endpoint: "http://loki.monitoring.svc.cluster.local:3100"
    clickhouse:
      enabled: true
      baseUrl: "http://clickhouse.monitoring.svc.cluster.local:8123"
      database: "cogneva"
      table: "llm_events"
      username: "cogneva"

# 自进化 worker（特权容器 = 文件系统沙盒边界；接 image-based 滚动更新后可关特权）
evolution:
  enabled: true
  # fail-closed 身份门禁：进化 Pod 的 Shell 类工具只接受带 DAG task 身份的
  # 调用（prompt_for_task），无身份的命令直接拒绝，不许以伪造身份进 executor。
  requireToolIdentity: true
  # 分解孤儿巡检只允许一个持有者：多副本同时 fire/resolve 会把告警停留窗口压到
  # 一个 signal-watcher 轮询以内，firing 行可能永远轮不上被读取。主应用为持有者。
  orphanReconcilerEnabled: false
  # git-remote 供给方式：pvc = 集群卷（多节点/生产，空卷自动从 seedUrl 拉 bare 仓库）；
  # hostPath = 单节点开发态直挂宿主 bare 仓库（宿主 <-> Pod 双向同步通道）
  gitRemote:
    mode: pvc
    hostPath: /var/lib/cogneva-data/git-remote
    # 有序镜像列表：第一个是首选上游，其余按序回退。可达性按主机不对称——
    # 实测 github 从集群内间歇黑洞而 gitee 秒级应答——只配一个地址时，该
    # 主机不可达期间的 release tag 刷新会静默失效，裸仓永远停在 seed 时的
    # tag；空卷首次 seed 更会直接失败。两个都列上，任一可达即可用。
    seedUrls:
      - https://github.com/hcipengm/cogneva.git
      - https://gitee.com/hcipengm/cogneva.git
    storage: 5Gi
  sandboxStorage: 20Gi
  # 源码卷：给共享 CARGO_TARGET_DIR 用的（工作树在它之外，可整棵重建而不丢
  # 增量编译缓存）。本机实测 target/ 已 57Gi——这是全场最大的一笔，也是唯一
  # 一笔"声明写小了会直接卡住构建"的（缓存被挤掉就每次全量重编），取 72Gi。
  sourceStorage: 72Gi
  # 进化 Pod 的 /var/lib/cogneva-data 是另一张卷、另一个写入者，声明必须分开：
  # 同一路径两个进程，各自的卷互不相干，共用一份声明必然对其中一个说谎。
  # 实测 49Gi（几乎全是 raw-logs 的存量轨迹），取 64Gi 留头寸。推导同
  # appData.storage：raw-logs 只降层不删除，存量会随冷层长期停留。
  dataStorage: 64Gi
  # 工作树动态分配：部署器与每个进化任务各自从裸仓库检出 git worktree，
  # 任一方把检出停在哪里都不再影响另一方。共享 CARGO_TARGET_DIR 故意留在
  # 工作树之外（source PVC 的克隆根内），工作树可整棵重建而不丢增量编译缓存。
  workspaces:
    root: /opt/cogneva/sandbox/workspaces
    targetDir: /opt/cogneva/sandbox/src/target
    # 临时工作树存活上限；要容得下一整轮演进，进程号不足以判断任务是否还活着。
    ephemeralTtlSecs: 21600
    # 身份轮换后遗留的 `evol/<旧id>` 分支回收判据：已并入 main 的立即回收，
    # 未并入的等超过这个时长（默认 30 天）才回收。存活实例的分支每次移植都会
    # 被强推刷新，长期不动即说明所属实例已不在。
    orphanBranchTtlSecs: 2592000
    # 共享构建缓存的复测周期（秒）。缓存的占用按层读成 cogneva_build_target_bytes，
    # 是给容量上限用的读数；走一遍只取元数据，但树有几十万条、宿主同时在编译，
    # 比分钟更勤没有价值。有下限兜底，取小于它的值等于取下限。
    cacheScanIntervalSecs: 300
    # 共享构建缓存的容量上限（表观字节），0 = 只量不封顶（出厂值）。
    # 数应当是**部署自己**的数：它是缓存所在这块卷的预算，由卷的声明量推出来，
    # 而声明量每个部署不同——所以出厂不替部署做这个决定，升级时也不会突然开始
    # 删字节（缓存现状与建议上限见 `2026-09-25_构建缓存的层读数.md` 的接续记录）。
    # 设了上限之后：超过时先放弃只花时间的层（`tmp` / `incremental` / `build`），
    # 编译结果排在其后；删除**只在持有构建槽位时**做，所以不会有构建正在读的文件
    # 被删掉。给得太小（小于每层留一份的下限）会被显式报成"到不了上限"。
    targetMaxBytes: 0
  # 宿主级构建闸门：同一宿主同时进行的编译 / 打镜像条数上限。构建与集群同宿主，
  # 多路叠加足以让整机进入换页，此后连"该把这件事报出来"的事件循环也一起退化。
  # lockDir 必须落在所有构建方共享的 hostPath 上，否则闸门退化成各自为政
  # （读数里 `cogneva_build_gate_slots` 的 dir 标签就是用来分辨这件事的）。
  buildGate:
    enabled: true
    maxConcurrent: 1
    waitSecs: 1800
    lockDir: /opt/cogneva/sandbox/build-gate
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# 沙箱执行器：主应用与进化共用的零凭证工具执行面（run_command/read_file/write_file）。
# 不挂 Secret、不挂 ServiceAccount token；关掉后主应用/进化的工具调用将无执行面。
sandboxExecutor:
  enabled: true
  # 执行器专属持久卷：自有裸仓库 + 每任务工作树 + 共享 CARGO_TARGET_DIR，
  # 与进化侧卷物理分离，互不共享工作树。
  storage: 5Gi
  # 空 = 跟随集群默认 SC（与 pg/redis 同策略，不绑厂商）。
  storageClass: ""
  # 空卷首挂时零凭证公开 https seed 裸仓库；后台按间隔 fetch（失败不阻塞）。
  # 有序镜像列表：第一个是首选上游，其余按序回退。单一地址会在该主机不可达
  # 期间把工作树静默留在旧 main（实测本集群 github 探测 44% 失败、gitee 0.86s）。
  gitSeedUrls:
    - https://github.com/hcipengm/cogneva.git
    - https://gitee.com/hcipengm/cogneva.git
  # 每任务工作树生命周期（秒）：空闲超 TTL 回收，数量超上限按 LRU 驱逐。
  workspaceTtlSecs: 21600
  workspaceGcIntervalSecs: 600
  repoFetchIntervalSecs: 300
  maxTaskWorkspaces: 8
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 节点镜像构建（buildah DaemonSet）：每节点提供 buildah 能力，产物导入节点
# containerd 作暖缓存；工作负载运行时镜像权威走集群内 registry（见 image.repository）。
# containerdSocket 是容器运行时 socket 在宿主的路径，随发行版不同：
#   标准 containerd（kubeadm/EKS 等）= /run/containerd
#   K3s  = /run/k3s/containerd
#   k0s  = /run/k0s/containerd （按实际核对）
# 生产多节点改用外部镜像仓库时可关闭（镜像走 registry 拉取而非节点内构建）。
buildah:
  enabled: true
  image: quay.io/buildah/stable:latest
  # 与业务镜像分策略：这是外部第三方镜像，不是集群内 registry 的浮动签。
  # 不跟 image.pullPolicy 的 Always——外网不可达时 Always 会让容器起不来，
  # 直接废掉构建能力；这份 :latest 只在节点首次需要时拉一次。
  pullPolicy: IfNotPresent
  containerdSocket: /run/containerd
  storageHostPath: /var/lib/cogneva-buildah
  resources:
    # 常态是纯守护进程（实测常驻 ~1Mi），构建尖峰由 limit + 节点实际余量
    # 承接；request 按常驻实耗定，不为偶发构建常年锁住半 G 调度额度
    # （小节点上这会挤得短作业排不进来）。
    requests:
      cpu: 250m
      memory: 64Mi
    limits:
      cpu: 2000m
      memory: 4Gi

# 集群内镜像仓库：GitOps L1 金丝雀镜像秒级分发通道。
# publisher（进化 Pod）把 overlay 镜像（cogneva 基镜像 + 新二进制）push 到
# Service:5000（集群 DNS，http）；节点 kubelet 经 NodePort 以 localhost:<nodePort>
# pull（containerd 对 localhost 默认 http 免 TLS），单/多节点通吃。
# 外部仓库形态改配 COGNEVA_GITOPS_REGISTRY（跨集群生产），可置 enabled:false。
clusterRegistry:
  enabled: true
  image: registry:2
  nodePort: 30500
  # 金丝雀 overlay 逐 rev 累积，实测已 7.4Gi，取 10Gi。
  storage: 10Gi
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# 后端探针的失败预算。探针测的是"这个后端还能不能干活"，而 kubelet 判死一个 Pod
# 靠的是"在预算内有没有应答"，预算按空闲节点取就必然在节点忙时误杀：共址构建把
# load 拉到 20+、可用内存掉到几百 Mi 时，kubelet 连自己的 Pod IP 都 dial 不进去
# （实测 redis 因此被 liveness 杀掉，后端再断一次）。所以两类预算分开取：
# 启动预算按"最慢的合法启动"（加载大 AOF、首次 initdb、建索引），运行预算按
# "节点最忙时仍应答应答"；把两者混成一个预算，必然在其中一边取值错。
# 探针省略 timeoutSeconds 时 kubelet 默认 1 秒、failureThreshold 默认 3 次，
# 所以这里必须显式写全——"省略"本身就是按空闲节点取值。
healthProbes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# 可选后端；禁用即假定使用外部服务（在 config 中指向外部地址）
backends:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
  redis:
    enabled: true
    image: redis:7-alpine
    storage: 5Gi
    # Serves the AOF repair verdict beside redis as a scrapeable textfile gauge.
    # redis-server has no metrics endpoint of its own, so an exporter next to it
    # is the only way a one-shot container's reading can reach a scraper.
    aofReportExporter:
      image: quay.io/prometheus/node-exporter:v1.12.1-distroless
  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.13.4
    storage: 10Gi
  nats:
    enabled: true
    image: nats:2.10-alpine
    storage: 10Gi
  meilisearch:
    enabled: true
    image: getmeili/meilisearch:v1.10.3
    storage: 5Gi
  # S3 兼容对象存储，承载永久记忆的 Raw 层与冷层。默认在集群内跑 SeaweedFS
  # 单进程（master + volume + filer + S3 网关），禁用即把 providers.storage
  # 指向外部 S3 兼容端点（MinIO / 云对象存储，代码路径相同）。
  seaweedfs:
    enabled: true
    image: chrislusf/seaweedfs:3.71
    # 承载永久记忆的 Raw 层与冷层：只增不减，实测已 15Gi，取 20Gi。
    storage: 20Gi

# 明文默认值仅用于开发；生产请用 --set-file 或外部 Secret（然后 secrets.create=false）
secrets:
  create: true
  # 内部实例密钥留空：全新安装时自动随机生成，升级时复用已部署 Secret 中的值。
  # 仅在需要跨实例固定同一密码时才显式填写；勿在 values 里提交可用密码。
  pgPassword: ""
  redisPassword: ""
  webhookInternal: ""
  jwtSecret: ""
  # 进化 Pod 自己的 JWT 签名密钥：与主应用刻意不同。进化 Pod 持有主线部署器
  # （能推 registry、能滚四部署），把它的管理面并进用户会话的鉴权域，等于让
  # 一枚 WebUI token 够到部署器；而每次重启换签，又让它的管理面谁也进不去。
  # 一份独立且跨重启稳定的密钥同时避开这两头。
  evolutionJwtSecret: ""
  # 实例身份指纹（64 位十六进制）：安装时生成一次、之后幂等保留。身份不再由
  # 容器内的机器标识推导（容器里只有 Pod 主机名与 veth MAC，两者每轮重启都变），
  # 因此重装带同一个 Secret、换机器带同一个 Secret 都是同一个实例，也可显式钉住。
  instanceFingerprint: ""
  # Meilisearch 主密钥：安装时随机生成，重装复用同一 Secret 中的值。
  meiliMasterKey: ""
  # 对象存储（SeaweedFS S3 网关）凭证：同上，留空则安装时随机生成。
  s3AccessKey: ""
  s3SecretKey: ""
  llmApiKey: ""
  # 带外凭证（网关专用）：真实值带外写入，默认空（未配置时对应功能 fail-closed）。
  llmUpstreams: ""
  githubToken: ""
  giteeToken: ""
  githubWebhookSecret: ""
  giteeWebhookToken: ""
  # Gitee OAuth App 的 client_secret：与上面几条同类，是外面发的凭证，不是本实例
  # 生成的，所以既不能随机生成、也不该写进 values——一旦进了 values 就等于进了
  # 仓库（含历史），而它只能由 Gitee 后台轮换。留空时授权码通道 fail-closed。
  giteeOauthClientSecret: ""
  # GitHub OAuth App 的 client_secret：与上一条同类同命——外面签发、只能去
  # 平台后台轮换，写进 values 就等于进了仓库（含历史）。留空时授权码通道
  # fail-closed；设备流不需要它，不受影响。
  githubOauthClientSecret: ""

# 贡献通道（向导第二步）：GitHub OAuth 设备流的 client_id 是 OAuth App 的
# 公开标识（非密钥），留空时设备流不可用、向导自动回退手动 PAT；Gitee 走
# OAuth 授权码流程，需要 client_id + client_secret 同时配置才开放（Gitee
# 无设备流、token 24h 过期，网关后台用 refresh_token 自动续期）。Gitee 的
# 应用凭证只注入安全网关，授权码兑换与续期都在网关进程内完成；主应用零持有，
# 经 COGNEVA_OAUTH_GATEWAY_URL 借用公开的 client_id 拼授权 URL。
# Gitee 对 redirect_uri 严格校验（已实证：非注册回调在授权页直接报错），
# code 只回跳注册列表里的地址。默认落地页是我们的静态回调页（GitHub
# Pages 托管），页面 JS 把 code 经 window.opener.postMessage 自动递回向导；
# 注册列表里同时保留仓库页作为手动复制兜底。自注册自有 OAuth App 的部署方
# 把 giteeOauthRedirectUri 改成自己的回调即可。
# client_secret 与其它带外凭证一样只存在于 cogneva-secrets（见上面 secrets 段），
# 由运维/向导写入，只进网关。
contribution:
  githubOauthClientId: "Ov23liz35yGbAC5vO0OP"
  giteeOauthClientId: "52f5294997d7a9f7046ca0bc7bf7f05da7a293a01800b5df6565be88539e2ea6"
  giteeOauthRedirectUri: "https://hcipengm.github.io/cogneva/oauth-callback.html"

# 主应用 GitOps 拉取端：poll 中央 bare 仓库的 evolution-release 分支，
# L0 配置热更 / L1 金丝雀在本集群闭环（沙盒推送端只写 bare 仓库，零集群凭证）。
gitops:
  enabled: true
  clusterName: main
  # 拉取端在 Pod 内调 kubectl（L0 apply / L1 set image、rollout）。K3s 节点挂宿主
  # k3s 二进制即可（argv[0]=kubectl 的多调用二进制，版本与集群天然一致）；标准 K8s
  # 节点挂 /usr/bin/kubectl；节点无可复用二进制时置 false（拉取端同步关闭，避免空转报错）。
  kubectlBin:
    enabled: false
    hostPath: /usr/local/bin/k3s

# 平台 webhook 集群入口（GitHub + Gitee 共用）：NodePort 转发安全网关 8082。
webhook:
  nodePort: 30991

# 告警通知出口。出口机制（通用 webhook / 钉钉 / 飞书 / 企业微信四类 dispatcher）
# 已在代码里，缺的一直只是地址——所以这里给的就是地址本身，不给第二份开关。
# 默认空 = 不建出口，与 cogneva.json 的 gateway.notification_webhook_url: null
# 等价（WebhookDispatcher 只在 url 非空时挂上）。地址是本集群的事，不是代码或
# 清单的一部分：它只经 --set / 集群自己的 values 覆盖注入，仓库里永远为空。
# 主应用（告警判定）与进化 Pod（沙盒降级）都会发通知，两者都从 cogneva-config
# 取这一份，改一处即可。
notification:
  webhookUrl: ""
  # 平台机器人地址（钉钉 / 飞书 / 企业微信）。与上面那条同理：出口机制在代码里，
  # 缺的一直只是地址。三个键空 = 该平台不建出口；三者可以同时配、也可只配一个。
  # 一个平台只给地址，不给开关：地址就是开关。
  # 注意签名密钥（钉钉加签 secret / 飞书校验 token）**不在这里**——它们是平台签发的
  # 带外凭证，而这两个 Pod 按约定零带外凭证。不给密钥时机器人必须用「自定义关键词」
  # 这类不靠签名的安全设置才收得到，否则平台会拒收。要让签名生效，得先定密钥由哪个
  # 进程代持（按约定只能是安全网关），那是一条新的出站签名面。
  dingtalkUrl: ""
  feishuUrl: ""
  wechatWorkUrl: ""
  # 进化 Pod 的 egress 是白名单（主应用没有 egress 限制，地址在哪儿都发得出去）。
  # 地址落在集群外时，不加放行，进化 Pod 那类通知会被策略拦掉、且只有一行 warn
  # ——看起来像"没有告警"而不是"告警发不出去"。**键就是宿主的名字**：上面每个非空
  # 地址的宿主都要在这里有一项，宿主既是策略的注释也是配对键，写错名字门禁当场点名
  # （配了地址没放行、放行了没人用，两个方向都报）。
  #   cidr 是这个宿主实际解析到的地址段。让运维自己写而不是由模板去解析 DNS：策略只认
  #        地址，而平台的地址会轮换，写宽一段是运维对自己这份判断的声明；写错了也有
  #        兜底——投递读数的 result="unreachable" 会说这个出口根本没通。
  #   port 是这个宿主监听的端口（https 默认 443）。
  # 这一份放行对**下面 alertmanager 段的出口同样生效**：两套出口都在进化 Pod 里发，
  # 走同一个策略；门禁把两边的地址一起拿来配对（配了地址没放行、放行了没人用，两个
  # 方向都报），所以别把告警出口的宿主记到别处去。
  # 默认空 = 一条都不放行（此时上面四个地址也应为空）。留空只影响进化 Pod，
  # 主应用侧照发。
  egress: {}
  #  oapi.dingtalk.com:
  #    cidr: "1.2.3.0/24"
  #    port: 443

# 告警出口：supervisor 事件（LLM 上游池全灭等）、基础设施 PromQL 规则、以及
# 「配置没下发」自检的告警从这里出去。与上面 notification 段同理——三类 dispatcher
# （Alertmanager 接收端 / SMTP / Slack 入站 webhook）都在代码里，缺的一直只是地址，
# 所以这里给地址不给开关：空地址 = 不建出口，与 cogneva.json 的
# observability.alertmanager 默认值等价。两个段可以只配一个；它们的区别是发什么：
# 上面那段发给人看的通知（审批、进化降级），这一段发 Alertmanager 报文形状的告警。
# 主应用与进化 Pod 都跑这条桥，两者都从 cogneva-config 取这一份。
alertmanager:
  # 接收端 URL。本进程 POST 的报文是 Alertmanager **receiver** 收到的那种形状
  # （{"version":"1","alerts":[...]}），不是 Alertmanager 自己的提交 API
  # （/api/v1/alerts 收另一种报文，指过去会被拒）。
  webhookUrl: ""
  # 邮件出口。收件人与中继两个都要有才算一个出口——只有收件人没有中继，消息没有
  # 地方交出去，而那种状态在运行期与「没配」长得一模一样（这正是这一段要修的坏法）。
  email:
    # 逗号分隔的收件人。
    recipients: ""
    smtpHost: ""
    smtpPort: 587
    smtpUsername: ""
    fromAddress: "alerts@cogneva.local"
    useTls: true
    # 留空 = 用默认主题「Cogneva Alert — N event(s)」。
    subjectTemplate: ""
    # SMTP 口令**不在这里**：它是凭证，不进 values 也不进清单，只由集群侧写进
    # Secret 键 cogneva-secrets/smtp-password（与可观测栈安装脚本写 clickhouse-password
    # 同形；那个键不存在时不做鉴权，Pod 照起）。写入时别用 --from-literal：
    # 口令会留进 shell 历史与进程参数。
  # Slack 出口：入站 webhook URL（incoming webhook），频道可留空由 webhook 自己的默认决定。
  slack:
    webhookUrl: ""
    channel: ""

ingress:
  enabled: true
  # nginx 为默认（k3s 现网入口统一 ingress-nginx）；traefik 时自动附带
  # WebSocket Middleware 与注解（需集群存在 traefik CRD）。
  className: nginx
  # 空 = 兜底路由（任意 Host 头进主应用）；设值后按 host 匹配。
  host: ""

networkPolicy:
  enabled: true
  # kube-apiserver 的 Service CIDR：in-cluster kubectl 经 kubernetes Service
  # ClusterIP:443 访问 apiserver。K3s 默认 10.43.0.0/16；标准 kubeadm 常用
  # 10.96.0.0/12（k8s-standard profile 覆盖）。
  apiServerCidr: 10.43.0.0/16
  # 监控栈所在命名空间：evolution 的 infra_watch 要按 PromQL 探测基础设施
  # 信号（节点磁盘、Pod OOM 等），需放行到该命名空间的 9090（Prometheus）。
  monitoringNamespace: monitoring

# 主线跟踪自动部署器：进化 Pod 周期检测 bare 仓库公版 main 前进 → 沙盒构建 →
# buildah 推集群内 registry → 派独立 Job 门禁滚动四部署，失败自动回滚。
# 依赖 RBAC / NetworkPolicy(apiserver) / kubectl 二进制 / 集群内 registry 就位。
mainlineDeployer:
  enabled: true
  pollIntervalSecs: 600
  soakSecs: 120
  failureCooldownSecs: 3600
  cargoBuildJobs: 2
  # 部署器从裸仓库的哪个目录读清单（仓库内相对路径）。两种形态都能消费：目录里
  # 有 `kustomization.yaml` 就按它的 resources 列表读（发布资源集的权威顺序），
  # 否则按平铺的预渲染目录读（文件名前缀是渲染序号，字典序即渲染顺序）。目标清单
  # 先按声明名精确匹配、再按清单自己的 `kind` + `metadata.name` 反查，所以渲染器
  # 换一次文件名不会让消费面静默缺席。
  # 默认 `deploy/k3s`：那是单节点 K3s 的静态基线（也是本集群在跑的那份，与 chart
  # 的 k3s-single 渲染逐字段对齐）。它装的是单节点的宿主路径与 k3s 形态，指给
  # 多节点或标准 K8s 会把那些形态一并下发——那两份 profile 因此各自指向自己的
  # 预渲染目录（见 profiles/*.yaml）。
  manifestDir: "deploy/k3s"
  # 滚动启动阶段的上界（秒）：Pod 的 init 容器（仓库种子/镜像拉取）未结束时
  # 不吃就绪预算、只吃这个上界。种子是网络克隆，耗时随集群到上游的链路变化，
  # 链路慢就调大这里，不要靠放宽就绪预算。
  startupTimeoutSecs: 900
  # 滚动就绪阶段的上界（秒）：init 全部结束后，单个 deployment 收敛的预算。
  # 默认值不改（300s），只把上界变成可调。
  rolloutTimeoutSecs: 300
  # 滚动判定 Job 容器的资源面：不声明时 QoS 落回 BestEffort，而它是决定
  # "回滚不回滚"的判定进程，被驱逐会让一次观测中断被记成一次版本失败。
  # requests 按该容器实测常驻量给（轮询等待态 0m/5Mi），不常年锁调度额度。
  rolloutJob:
    cpuRequest: 10m
    memoryRequest: 32Mi
    cpuLimit: 500m
    memoryLimit: 256Mi
  # 可观测性栈清单（deploy/k3s/observability/manifests/**）的周期收敛：按仓库
  # 当前 rev 的内容 apply，把现场修回声明态。那些清单此前只有安装脚本一条交付
  # 路径，装完一次之后仓库与现场各走各的，而「清单没生效」这件事没有判据。
  # 它不装 helm chart、不应用 Role/RoleBinding、不创建 Namespace：这三样属安装期，
  # 缺了会报出来而不是自己补（授权面自己给自己长权限是不允许的）。
  observabilityStack:
    enabled: true
    intervalSecs: 300
    # 仓库内相对路径，与安装脚本的 manifests/ 同一处。
    manifestDir: "deploy/k3s/observability/manifests"
    namespace: monitoring
    # 与安装脚本的 BACKENDS 是同一个开关：清单里的 09-clickhouse / 10-loki
    # 标着 backends 处置，两边都按它决定交付与否。
    backends: true
    applyTimeoutSecs: 120
    # 一次收敛最多在告警消息里点名几个资源，其余折成计数（消息有界）。集群可以
    # 漂移一百个对象，消息不能长到没人读。
    maxNamedResources: 6
