      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 10m
      # tunable:
