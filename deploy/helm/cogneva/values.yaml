      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 1Gi
  # tunable:
  # why: The backup volume. Keep count times package size is the flow into it, and the loop does not assume
  # why: either: it reads the claim's used bytes from the walker and raises the declaration to the measured
  # why: peak x 120% (whole GiB). A shrinking keep count never shrinks the claim -- PVCs cannot shrink -- so
  # why: the reading only moves it up.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  storage: 10Gi
  # 恢复演练：把最新一个包装进一个跑完迁移的空库，逐表对数、把账行与源库逐格比，
  # 然后删库，答案落进 `backup_drills`。排在备份之后半小时：装的是当晚刚出的那一
  # 个包，而不是昨天的。时刻与上面同一个 timeZone 解释。
  drillSchedule: "47 3 * * *"
  # 一次演练开的是**两份**包，不是一份：最新那份，加上窗口里最久没被证明的那份
  # （`--also-unproven`，第二趟只挑一份，成不成都不再接着开）。
  #
  # 这里曾经有一个 `drillDeadlineSeconds`（Job 的 activeDeadlineSeconds）与它的一对
  # `drillPassBudgetSeconds`（整趟预算）。2026-10-27 的现场就是这一对：单包实测已从
  # 497 s（10-19）长到 2271 s（10-27，本机 3.6 GB 的库），第一趟吃掉 38 min，第二趟
  # 在 3600 s 的界上被杀，`backup_drills` 里没有那一行——于是「窗口里最久没被证明
  # 的那份」永远证明不了，读数读作「这一趟没跑过」。
  #
  # 两个数都不再是「这一趟花了多久」：判停改由存活探针（Job 面）与进程里的
  # 看门狗（账本面）做，两者读的都是**多久没有一处推进**——不只是「这一步开了多久」：
  # 导出、灌回、打包、解包、算摘要这五条搬数据的路每搬过一块都记一拍，对面还在执行
  # 时另有一条证据，所以一张表灌上很久不会被读成停住。
  #
  # 静默界**不在部署里**，这里曾经有一个 `drillStepSilenceSeconds: 3600`，它是一颗
  # 挑出来的数。现在的界是 `progress_bounds` 里这个作业类上一次运行量到的最长间隔：
  # 作业长大它就跟着长，作业变快它就跟着小。没有那行时（还没成功跑过一趟）不判停，
  # 只把静默读数写进账本那一行——拿一个没人量过的数去杀一件可能还在干的活，是这里
  # 最贵的错误。
  # 备份卷之外的第二个落点：每跑完一次，新包再往这里复制一份，演练自己遍历它、
  # 把「卷外最新那份是不是刚装回去的这个包」记进 `backup_drills`。
  #
  # **它换掉的是什么，别读多**：备份卷是一块 local-path PV，删 PVC、卷被回收、
  # 换名字重装都会让它上面的包一起消失；卷外这条路径救的是这些。它**不救宿主
  # 丢失**——同一台机器上的另一条路径与备份卷在同一个故障域里，跨路径不等于跨
  # 机器。真正的异地（另一台机器 / 对象存储）要凭证，不在这份 values 能闭合的
  # 范围里，缺的那格在内部文档里记着。
  #
  # 多节点形态下 hostPath 只存在于跑这一趟的那个节点，演练可能落在别的节点上
  # 而看见空目录；那种部署应把这里指到一份共享挂载（NFS 等），而不是本机路径。
  # 空字符串 = 不配：两个 Job 都不挂载，于是「卷外一份都没有」由
  # `backup_offsite_copy_never_written` 报红，而不是悄悄当作已覆盖。
  offsiteHostPath: /var/lib/cogneva-offsite
  # 异地那一跑的**观察文件**落在宿主哪里。宿主 systemd 定时器把
  # `restic snapshots` / `restic key list` 读到的时刻写成一个文件（它的
  # StateDirectory，即 `/var/lib/cogneva-backup-offsite`），演练只读挂载它、
  # 把「仓库里最新一份是什么时候的、钥匙上一次换是什么时候」记进账本。
  # 与 `offsiteHostPath` 一样是宿主路径；空字符串 = 不挂，两个年龄读数读作
  # 「没量过」。定时器没装的时候它确实是没量过，不是零。
  offsiteStateHostPath: /var/lib/cogneva-backup-offsite
  # 包级加密的口令（A7b）：写包、演练、恢复都用这一个变量名。**这个 Secret 必须
  # 由操作者在装之前带外写进命名空间**，chart 不生成它——口令与密文同一台机器、
  # 同一个 Secret 仓库，就不叫「不落在同一台机器上」。
  #
  # 空 name = 不注入：下一个包仍走明文分支（日志留一条 warn），演练与恢复照旧能读
  # 旧的明文包。加密一旦启用，**写包与能读包的三处必须同一步上线**：加密包在演练
  # Pod 里解不开会让当晚 outcome=failed，看起来像「这份包装不回去」。
  packageKeySecret:
    name: ""
    key: package-key
  # 空 = 跟随集群默认 SC（与 pg/redis/qdrant 同策略，不绑厂商）。
  storageClass: ""

image:
  # 工作负载统一从集群内 registry 的 NodePort 拉取（每个节点的 kubelet 经
  # localhost:<nodePort> 访问，containerd 对 localhost 默认 http 免 TLS）。
  # 不直接 pin 节点本地镜像名：ctr tag/import 得到的引用名不保证被 kubelet
  # 的镜像存在性判定采信，且静态清单/GitOps apply 后没有统一的浮动签权威。
  # :local 浮动签只由 bootstrap 播种、swap-image/mainline 收敛后前移。
  repository: localhost:30500/cogneva
  # 留空 = 取 chart 的 appVersion，也就是 Cargo.toml 声明的版本（`cogneva.image`
  # 里 default 到 .Chart.AppVersion）。写死一个字面量就是同一份版本号的第二处存放，
  # 发布时要有人记得把它也改掉；留空让 tag 与 appVersion 不可能分家，版本一致性门
  # 因此只需要判 appVersion 那一处，非空时才额外判它等于声明版本。
  # 自举部署的 profile values 覆盖为 local（浮动签，随导入的 release 镜像走）。
  tag: ""
  # 必须 Always：静态清单把四部署指回浮动签 :local，内容可被 bootstrap/swap-image
  # 重新播种。IfNotPresent 下节点缓存里那份旧内容会被无限期复用——tag 字符串没变、
  # registry 上 :local 也是新的，唯独节点跑的是旧二进制，任何基于清单/registry 的
  # 校验都看不出这条降级。Always 让浮动签的"拉取时解析"语义成立。
  pullPolicy: Always

# 跑 agent 运行的那些工作负载共用的关停面：主应用与进化 Pod 都要它，所以它不挂在
# 其中任何一个的名字底下。
shutdown:
  # Pod 宽限期（秒）。关停面只有这一个旋钮：kubelet 到点就 SIGKILL，它是这条链上
  # 唯一被强制执行的时间。进程的排空预算不再是一个独立的数，而是它减去下面的收尾
  # 余量，由模板从一个叶子算出（`cogneva.drainBudgetMs`）；两个工作负载（主应用、
  # 进化）的字段与进程环境都从这一格取，所以三处不可能分家。
  # 它是一个 policy 而不是实测值：宽限期的两种代价——等一趟滚动、打断一个在飞的
  # 调用——是同一个事件的两侧，所以没有可搜索的最优；读数（排空耗时直方图与
  # 被打断的尝试数）的作用是证伪它，不是算出它。判据就是本行紧下方那块 `# tunable:`。
  # tunable:
  # why: The one number in the shutdown face: how long kubelet waits after SIGTERM before it kills the
  # why: process. Both workloads that run agent turns take it, and the process's drain budget is computed
  # why: from it rather than pinned beside it (`grace - shutdown.drainTeardownMarginMs`), so raising it is
  # why: one edit and cannot leave half the pair behind. Why not derived: what the reading can say is smaller
  # why: than what a derivation would need. A drain that was abandoned records the cap it hit -- it is
  # why: censored at the budget, and only says `at least this long` -- so a high quantile taken over the
  # why: histogram is a quantile of the drains that were fast enough to finish, and it converges on `as fast
  # why: as the fast ones are` no matter how many turns the cap is cutting short. Fitting this number to that
  # why: quantile would size it by the half of the distribution that never needed it. What the reading can do
  # why: is falsify the policy, and that is the rule it is read by: any `timeout` row on
  # why: `cogneva_shutdown_drain_milliseconds`, or a non-zero `cogneva_shutdown_drain_abandoned_total`, over
  # why: a sustained window, is evidence that real turns outlast this number and the repair is to raise it.
  # why: Until that evidence exists the number is a policy with no measurement to move it -- its two costs (a
  # why: rollout that waits, a call that is interrupted) are the same event on either side of the line, so
  # why: there is no optimum in it to search for. Disposition `fixed`: the field belongs to kubelet, and what
  # why: holds it is the structural relation to the computed drain budget and the teardown margin, not a
  # why: measurement of its own.
  terminationGraceSeconds: 45
  # 宽限期里留给收尾的那一段（毫秒）：日志刷盘、tokio 运行时退出、kubelet 观测到
  # 进程消失。它不是一个可以调的旋钮——收尾的成本不随排空耗时变——所以是 fixed，
  # 理由写在本行紧下方那块 `# tunable:` 里。排空预算 = 宽限期 - 它。
  # tunable:
  # why: The part of the grace that is not the drain: flushing logs, letting the tokio runtime unwind, and
  # why: the window between the process exiting and kubelet seeing it. It is not a dial -- the cost of
  # why: stopping does not move with how long the drain took -- and it is subtracted from the grace to give
  # why: the process its budget, so a larger margin would not buy a longer drain, it would shorten one.
  # why: Written as a number instead of a code constant because it is arithmetic the chart does
  # why: (`cogneva.drainBudgetMs`): both the pod field and the process environment are rendered from these
  # why: two leaves, and a margin living in Rust would leave the chart claiming a budget it had not computed.
  drainTeardownMarginMs: 15000

gateway:
  # 种子：运行时副本数跟着集群就绪节点数走（一节点一个、多节点两个——两个是
  # 「任意一台可以不见」的最小集合，再多只是同一份凭证多存几份）。这个数只在
  # 回路第一次读到节点数之前生效，之后由 `cogneva_workload_replicas` 发布实际值。
  # tunable:
  # why: Replicas are the number of failure domains that can be lost: one Ready node gets one replica, two or
  # why: more get two. Two is the smallest set that survives any single node going away, and a third copy on
  # why: a third node buys no new failure domain -- only another copy of the credential material. The
  # why: workload-resources loop reads `/api/v1/nodes` every round, counts Ready nodes, and patches
  # why: `/spec/replicas` on the Deployments carrying `cogneva.io/replica-policy: topology`; the seed applies
  # why: only before the first round has read the cluster. The connection budget follows: the rendered
  # why: `COGNEVA_PG_SHARING_PROCESSES` counts the worst-case replica count of every workload that shares the
  # why: database, so a scale-out does not leave each process dividing the server's ceiling by a stale
  # why: process count.
  # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REPLICAS_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_workload_replicas_follow_the_ready_node_count beat=the_replica_beat_counts_even_when_the_node_count_does_not_move evidence=replica_evaluations
  replicas: 1
  # 主应用的五个端口。这五个数此前各写三到六遍：容器端口、Service、configmap 里的
  # env、files/cogneva.json（进程真正按它监听的那一份）、网络策略、ingress、
  # NOTES.txt 里的 port-forward。改一个端口要手工改七处，漏一处只在真流量上现形
  # ——Service 与容器端口不一致时 Endpoints 照建、连接全被拒，读起来像"进程挂了"。
  # 现在只有这一份，模板与 JSON 都从它取。
  # tunable:
  # why: The app's main HTTP port. An address: the Service, the ingress backend, the network policy, the
  # why: port-forward note and the process's own cogneva.json all carry it.
  httpPort: 8080
  # WebSocket 面：WebUI 的长连接。与 httpPort 分开是为了让 ingress 能只把长连接
  # 那条路单独放行/加超时。
  # tunable:
  # why: The WebSocket face. An address, kept apart from httpPort so the ingress can give long connections
  # why: their own timeout.
  wsPort: 8081
  # 零凭证的集群内面：只挂 memory 的工具输出归档与 Raw 读。它与 httpPort 分开不是
  # 为了换路径，是为了换判据——主 API 的 memory 路由按角色判，跑 squad 的 Pod 零
  # 凭证恒吃 401，所以判据改成"按网络事实"，挂在网络策略上。0＝不开这个监听。
  # tunable:
  # why: The zero-credential in-cluster face (memory archive writes and Raw reads). An address: what makes it
  # why: a separate face is the network policy that decides who may reach it, not the number.
  internalPort: 8085
  # 平台 webhook 的转发入口：安全网关验签之后才递进来，因此它自己不再判签名。
  # tunable:
  # why: The webhook forward entry the security gateway hands verified platform events to. An address.
  webhookPort: 9091
  # 进程被告知的指标端口（cogneva.json 的 gateway.metrics_port，经 configmap 的
  # COGNEVA_METRICS_PORT 注入同一份配置）。抓取侧走 httpPort 的 /metrics，所以
  # 这两个数必须同源：改一处而漏另一处，只会让两边各说一半。
  # tunable:
  # why: The port the process is told to expose metrics on, through the env layer and cogneva.json. An
  # why: address; the scrape itself goes to httpPort/metrics, which is why the two must be read from one
  # why: file.
  metricsPort: 9090
  # 内存这一档按**量出来的**占用给，不按权重文件大小推。进程自己报出生占用
  # （`cogneva_boot_rss_bytes`，按启动阶段各一拍，值是那一刻整进程的 VmRSS）：
  # 实测 2026-10-26，三份权重各建一个 session 后进程以 4.52GiB 开始服务（三个
  # 阶段实测的累计值依次是 1.69GiB、3.08GiB、4.46GiB，后一个含前一个。这些页
  # 实测是私有匿名页（`smaps_rollup` 的 Anonymous/Private_Dirty 与 VmRSS 同量级），
  # 容器里不可回收，所以 limit 必须真装得下，不能靠回收兜底。单容器上限默认由
  # LimitRange 压住，再往上会被准入拒掉。
  #
  # 2026-10-26 8Gi → 12Gi：8Gi 那档量的是**出生**，而出生那一拍不是最高的那一拍。
  # 实测同一个进程起来后跑几轮真实取数就稳在 6.46GiB，连续十分钟不涨（不是泄漏，
  # 是 ONNX 的推理工作区在第一次推理时才落页），再叠上并发高峰就贴住上限——
  # 实测 24 小时内每一代都停在 7.8–7.98GiB 然后被 OOMKilled（最近一次退出码 137，
  # `check-container-headroom.sh` 的判据 1 与判据 2 同时命中）。
  # 峰值读数在这里不能用来定档：容器被自己的上限杀掉时，`container_memory_rss` 的
  # 24 小时峰值就是这个上限减一个采样间隔，它报的是**天花板**，不是需求量。所以档位
  # 取可观测的那两段：实测出生 4.52GiB、暖机后 6.46GiB 的稳态，加上峰值至少要的那
  # 截（实测下界 7.98GiB）。12Gi 对稳态度留 1.85 倍、对观察到的峰值留 1.5 倍。
  # 若下一代仍贴住这一档，说明增长没有界，那时候要查的是权重共享（dense 与
  # sparse 两个 session 各装一份同一份权重文件）或泄漏，而不是再抬一次天花板。
  #
  # requests 6Gi：request 声明的是调度器为这个 Pod 预留多少，而实测暖机后的稳态
  # 实测就在 6.46GiB 上下——低于它等于把本 Pod 排到节点压力的第一个驱逐位。这次抬完命名
  # 空间 requests 合计约等于稳态之和，仍在节点可分配量与配额之内（见投影产物）。
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 500m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 6Gi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 4000m
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 12Gi

# git 身份基线（owner/name）。两个进程消费同一个值，所以定义在共享层而不是
# 挂在任一侧名下——拆成两份必然漂移，而漂移的后果是无声的：自举登记的仓库与
# 选路探测的仓库一旦不同，SSH 自证就永远握手不过，身份停在 pending。
#   - 主应用进程：git 身份自举的后台循环跑在这里——它同时握着自举需要的三样
#     东西（两片 Secret 的读写权、到达 GitHub 的 egress、以及网关部署的
#     滚动权），所以生成的公钥由它登记成这个仓库的部署密钥，并滚网关让私钥
#     被兜底通道读进去。空 = 不自动登记，只把公钥挂到 WebUI 等人给 token。
#   - 安全网关：传输选路的实测拿它当探测目标，SSH 兜底也用它拼远端前缀。
gitIdentity:
  repo: hcipengm/cogneva

# 独立安全网关：代持全部敏感凭证，沙盒 Pod 零凭证
securityGateway:
  enabled: true
  # 种子：与主应用同一条副本律（就绪节点数，一到二）。运行时的值由
  # `cogneva_workload_replicas` 发布。
  # tunable:
  # why: The same failure-domain law as the main gateway: one Ready node gets one replica, two or more get
  # why: two, and the security gateway carries `cogneva.io/replica-policy: topology` so the
  # why: workload-resources loop patches it from the live node count. The seed applies only until the first
  # why: read. The rendered PostgreSQL sharing count budgets for the worst-case two replicas, so each
  # why: credential-holding process divides the server's ceiling by the number of processes that can exist at
  # why: once.
  # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REPLICAS_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_workload_replicas_follow_the_ready_node_count beat=the_replica_beat_counts_even_when_the_node_count_does_not_move evidence=replica_evaluations
  replicas: 1
  # 网关的三个监听面，与容器里的端口名一一对应（名字不改，Service 的 targetPort
  # 按名字引用它们）。这三个数此前写满整棵 chart：容器端口、Service、网络策略的
  # 两侧放行、webhook Service，以及主应用与进化 Pod 里九个指向
  # `http://cogneva-security-gateway:8081/...` 的地址——改端口时漏掉任何一处，
  # 症状都是「凭证代持面不可达」，而它读起来像上游平台挂了。
  #
  # 出站代理（名称 egress-proxy）：git 传输与平台 API 透传走它。
  # tunable:
  # why: The gateway's egress proxy (container port name egress-proxy): git transport and platform API
  # why: passthrough. An address, and a listened-on one: the process takes it from COGNEVA_SG_EGRESS_PORT, so
  # why: the chart passes that env from this same key -- without it a moved value would move the Service and
  # why: leave the process on the old port.
  egressProxyPort: 8080
  # LLM 代理（名称 llm-proxy）：全部上游模型调用与 /github、/gitee、/git、
  # /search-fallback 这些透传路由都在这个端口上——业务侧那九个 URL 写的就是它。
  # tunable:
  # why: The gateway's LLM proxy (container port name llm-proxy), which also carries the /github, /gitee,
  # why: /git and /search-fallback routes. An address, written into nine base URLs across the app and
  # why: evolution pods, and the port the process itself binds (COGNEVA_SG_LLM_PORT, passed from here).
  llmProxyPort: 8081
  # 平台 webhook 入口（名称 webhook）：GitHub/Gitee 回调进来先在这里验签。
  # tunable:
  # why: The gateway's platform webhook entry (container port name webhook), where GitHub and Gitee
  # why: signatures are verified before anything is forwarded. An address, and the port the process binds
  # why: (COGNEVA_SG_WEBHOOK_PORT, passed from here).
  webhookPort: 8082
  # 网关在全部调用链最前面（LLM 与 git 透传的唯一凭证出口）：没有 request 时
  # 调度器按 BestEffort 处理，节点一有压力先驱逐它，而被驱逐的 Pod 正是调用方
  # 的直接下游；request 按常驻实耗给，limit 留突发余量。
  resources:
    requests:
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `cpu.usageNanoCores` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to 10m, whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 100m
      # tunable:
      # why: The scheduling claim is not pinned: the workload-resources loop reads this container's
      # why: `memory.workingSetBytes` from the kubelet summary every few minutes, keeps a seven-day window, and
      # why: patches the request to the window's p95, rounded up to the memory quantum (16Mi by default), whenever the move is at least one
      # why: quantum. The reading published under this key carries `source=derived` once the window has enough
      # why: samples, and `source=seed` with the declared value before that, so a reader can always tell which
      # why: side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=REQUEST_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 128Mi
    limits:
      # tunable:
      # why: The CPU bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `cpu.usageNanoCores` times the 120% headroom the
      # why: volume-capacity loop also uses, rounded up to 10m, but a window that only ever saw the container
      # why: idle cannot prove a bound is too high -- a five-minute sample misses any burst shorter than the
      # why: grid, and 2026-11-24 showed the cost: an idle seaweedfs (2m) had its bound pressed to 10m, below
      # why: what its own start needs, so it never came back. The reading published under this key carries
      # why: `source=derived` once the window has enough samples, and `source=seed` with the declared value
      # why: before that, so a reader can always tell which side of the measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_CPU_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      cpu: 500m
      # tunable:
      # why: The memory bound rises with the measured draw and never falls below this declared value: the loop
      # why: patches the limit up to the window's peak on `memory.workingSetBytes` times the same 120% headroom,
      # why: rounded up to the memory quantum (16Mi by default), but a peak observed on a five-minute grid is a
      # why: lower bound of the bursts a bound has to allow, so it can raise this number and never lower it. The
      # why: reading published under this key carries `source=derived` once the window has enough samples, and
      # why: `source=seed` with the declared value before that, so a reader can always tell which side of the
      # why: measurement it is looking at.
      # published: owner=crates/cog-reflection/src/workload_resources.rs file=crates/cog-reflection/src/workload_resources.rs metric=LIMIT_MEMORY_METRIC label=source cadence=periodic
      # proof: file=crates/cog-reflection/src/workload_resources.rs test=a_request_follows_the_measured_draw beat=the_evaluation_counter_keeps_time_when_the_target_does_not_move evidence=evaluations
      memory: 512Mi
  # 观测通道端口：只挂 /health/* 与 /metrics，不含任何代理路由。与 8080/8081
  # 分列的原因是那两条通道会注入真实上游凭证，跨命名空间放行等于把凭证代持
  # 能力交给监控侧；观测通道没有代理面，可以只对它放行监控命名空间。
  # tunable:
  # why: The observability channel's port, deliberately separate from the proxy ports because those inject
  # why: upstream credentials. An address.
  metricsPort: 9090
  metricsAllowedNamespaces:
    - monitoring
  # Audited LLM channel port: the same routes as 8081, plus per-request content audit,
  # upstream credential injection, and a reachable set that admits the sandbox executor
  # only. It exists for the design line "document bodies go through the audited channel
  # only": 8081 does not look at one byte of the request body, 8080 holds no upstream
  # credentials, and only this port has both. A port of its own rather than folded into
  # 8080/8081: those two are reachable by any pod in the namespace, while this channel's
  # whole value is its small reachable set.
  # tunable:
  # why: The audited channel's own port, separate from 8080/8081 because its whole value is a small reachable
  # why: set. An address.
  auditedLlmPort: 8083
  # The largest request body the audited channel can audit in one call (bytes). Above it
  # nothing is audited, and what cannot be audited is refused -- so this states how much
  # document text may leave in one request, not a throughput figure. Deliberately not
  # shared with the document write bound: that one limits bytes written to disk
  # (storage), this one limits text entering a model (context).
  # tunable:
  # why: How much document text may leave in one request through the audited channel. Eight MiB is the HTTP
  # why: body convention, and it is deliberately not tied to the document write bound: that one limits bytes
  # why: written to disk, this one limits text entering a model.
  auditedLlmMaxBodyBytes: 8388608
  # git 传输的 SSH 兜底（HTTPS 快路径 + SSH 兜底，实现在 cog-gateway 的
  # git_mirror 模块）。GitHub 的 HTTPS 通道实测是高方差 + 偶发黑洞：好时 0.5s、
  # 坏时直冲超时，而黑洞期一来主线 deployer 拉不到基线、landing 推不上去，整条
  # 自进化链路停摆。开这个开关后网关自持一份裸镜像，连续失败即熔断降级到 SSH。
  #
  # 私钥来自 cogneva-secrets-oob/git-ssh-private-key（真实部署用 SSH 公钥上传到
  # GitHub 账号，私钥只注入网关）；**缺私钥时兜底自动保持关闭**，网关退回纯
  # HTTPS 透传、行为与从前一致——所以可以先开开关、后补凭证。
  gitMirror:
    enabled: true
    # 镜像卷：<root>/github/<owner>/<repo>.git。它是本 chart 里唯一**不需要**
    # resource-policy: keep 的卷——内容全部可从一个外部真相源（GitHub）重建，
    # 标了 keep 只会在反复重装时堆出无主的陈旧镜像。5Gi 对 cogneva 仓库
    # （含历史与 LFS 外的全部对象）绰绰有余。
    # tunable:
    # why: The mirror volume, rebuildable from upstream, so the volume is not a durability question but a
    # why: capacity one. The loop reads its peak from the claim-store walker and raises the declaration when
    # why: peak x 120% no longer fits.
    # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
    # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
    storage: 5Gi
    # 兜底传输的两条执行预算（秒），判据在代码里（cog-gateway 的 git_mirror）：
    #   stallSecs   —— SSH 侧多久没有任何输出就判这条传输已死（杀进程组、让请求
    #                  响亮失败），地板 30。判"静默"而不是"总时长"，是为了把
    #                  "链路慢"（该等）与"链路死"（该换通道）分开。
    #   timeoutSecs —— 单次 clone/fetch/push 的总上限，地板 60。防的是"一直在吐
    #                  进度却永远不结束"——那种形态静默判据永远不触发。
    # 默认值来自实测：本链路一次完整镜像克隆约 97 秒。
    # tunable:
    # why: How long the SSH fallback may produce no output before the transfer is declared dead. The window
    # why: starts at the seed, floored by a structural minimum, and each successful transfer feeds its longest
    # why: measured silence back through a tail window: a link that talks in bursts widens the next window, so
    # why: a slow-but-alive clone is not killed. Published on the gateway's metrics with its evaluation count.
    # published: owner=crates/cog-gateway/src/git_mirror.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-gateway/src/git_mirror.rs test=a_measured_silence_widens_the_window_the_next_transfer_is_judged_by beat=a_measured_silence_widens_the_window_the_next_transfer_is_judged_by evidence=evaluations
    stallSecs: 180
    # tunable:
    # why: The total bound on one clone/fetch/push, for the case that keeps emitting progress and never
    # why: finishes. The expectation follows the measured total duration of successful transfers (tail times
    # why: factor) from the seed, so it moves with the repository and the link instead of with a human reading
    # why: of one clone.
    # published: owner=crates/cog-gateway/src/git_mirror.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-gateway/src/git_mirror.rs test=a_measured_silence_widens_the_window_the_next_transfer_is_judged_by beat=a_measured_silence_widens_the_window_the_next_transfer_is_judged_by evidence=evaluations
    timeoutSecs: 1800
  # 部署期网络画像盖章（restricted / open）。空 = 不盖章，由网关自己探。
  # 它只是**首帧默认值**：网关启动就发起一次真实握手实测，结论落地即压过盖章
  # （证据优先于部署时的猜测）。用途是让首批 git 请求不必先撞一次已知会挂的
  # 通道——那类网络里探测本身就要几十秒才有结论。
  netProfile: ""

# 观测栈的地址，两个进程共用：网关的上游池导出（cog-gateway，经 COGNEVA_LOKI_* /
# COGNEVA_CLICKHOUSE_* env 读）与主应用、进化进程的 tracing 导出（cog-observability，
# 读 files/cogneva.json 的 observability 段——那几行由 app-config.yaml 在渲染时
# 用这里的值改写，所以地址仍然只有这一份）。
#
# 四种体裁各落各的后端：日志→Loki、时序明细→ClickHouse、告警状态机→PostgreSQL
# （复用 cogneva 自身 PG，无需配置）、指标→Prometheus（ServiceMonitor 已抓取）。
# 默认开启：观测栈的安装脚本默认就带上这两个后端（BACKENDS=1）；端点不通时网关只
# 降级告警，池自愈主链（Redis 跨进程信号 + PG 告警）不依赖它们。只要指标栈时设
# BACKENDS=0 并把这两项置 false。
#
# 这一块此前挂在 securityGateway 下：同一台 Loki 于是在 values 里写一份、在
# files/cogneva.json 里又写一份。搬观测栈时改一处、另一处留在旧地址，症状是主应用
# 那侧「日志不再落地」——没有任何报错，只是日志面上少了一个进程。
observability:
  # 指标路径的唯一部署侧声明。Rust 侧的同一个值在
  # `cog-core::contract::observability::METRICS_PATH`；Helm 读不到 Rust 常量，所以
  # 两边由 `crates/cogneva/tests/metrics_path_matches_deploy_test.rs` 比对，不同即红。
  # 网关、claim-store 与自监控的抓取地址都从这一份拼：改这里，三处一起改。
  metricsPath: /metrics
  loki:
    enabled: true
    endpoint: "http://loki.monitoring.svc.cluster.local:3100"
  # 图形面：面板由网关从指标闭集与读数注册表算出来，运行期推给这一台。
  # 留空＝这个部署没有 Grafana，导出器不启动——面板是投影，没有投递面就是没有，
  # 猜一个集群内地址只会把「推不上去」和「本来就没有面板」画成同一个样子。
  # 管理员口令不在这里：它是凭证，只从 cogneva-secrets-oob 的 grafana-admin-password
  # 挂进网关。
  grafana:
    baseUrl: ""
  clickhouse:
    enabled: true
    baseUrl: "http://clickhouse.monitoring.svc.cluster.local:8123"
    database: "cogneva"
    table: "llm_events"
    username: "cogneva"
  # 基础设施告警的读面（Prometheus 的 API）：主应用按 poll 间隔拉一次规则与序列，
  # 判断「进程手里的规则集与 ConfigMap 声明的是不是同一份」。这条地址同样只有这
  # 一份，JSON 里那行由渲染改写。
  infraWatch:
    prometheusUrl: "http://cog-observability-prometheus.monitoring:9090"
  # 观测事件日志（cog_observability_events）的容量与读窗口。这条表只追加，2026-10-27
  # 实测 2.92M 行 / 1.6 GB，每天约 30 万行，而每一行都进夜间备份、也都在恢复演练要
  # 装回去的那份库里——演练单趟因此从 553 s 涨到 2271 s。两个数是一对：maxRows 是清理
  # 的目标，readWindowSeconds 是清理不许越过的那条线（历史事件读的就是最近这段时间，
  # 删进来等于让一个能答的查询静默缺一段）。窗口自己就超过容量时，清理停手并把
  # cogneva_observability_events_over_capacity 置 1。maxRows 置 0 = 本部署不清理。
  eventLog:
    # 行数上限。约三天常规量、一天半最坏量。
    # tunable:
    # why: Rows the observability event log may hold. The sweep measures the table's held rows and bytes on
    # why: every pass and divides the table's share of the declared database volume by the measured bytes per
    # why: row; both directions move the answer without a restart -- a wider row buys fewer rows, a larger
    # why: declared volume buys more. The declared million is the seed while the table is empty or the volume
    # why: is not declared. The published target carries `source=derived` when the measurement was used and
    # why: `source=seed` when it was not, and the evaluations counter rises on a pass whose target did not
    # why: move.
    # published: owner=crates/cog-storage/src/observability_event_cap.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-storage/src/observability_event_cap.rs test=a_beat_whose_target_does_not_move_still_counts beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
    maxRows: 1000000
    # 不许删的时间窗（秒），与历史事件查询的默认窗口同值。
    # tunable:
    # why: The window inside which no row may be deleted, whatever the capacity says. Not a second retention
    # why: knob: it is the floor, and it follows the widest span a historical query actually asked for -- the
    # why: gateway records each answered span, and the sweep recomputes the floor on its next pass. It can only
    # why: widen: a narrower question does not shrink a promise already made, and a quiet week must not turn
    # why: yesterday's answer into a gap. The declared day matches the query's default window, so a reader
    # why: asking for that default never sees a hole the sweep made; `source` on the published target says
    # why: whether a measured span widened it.
    # published: owner=crates/cog-storage/src/observability_event_cap.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-storage/src/observability_event_cap.rs test=the_read_window_follows_the_longest_question_asked beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
    readWindowSeconds: 86400

# 续跑点存储（cog_snapshots）的容量声明。每轮巡检写一份新快照、把任务板指过去，然后才
# 删被替下的那份——任务板因此是指针的唯一权威，其余都是残物。任务结束后最后一份没人删
# （任务板从不退役），于是这张表是「活着的续跑点 ＋ 每个跑完过的任务的最后一份」。
# 2026-10-27 实测：54452 行 / 924 MB，其中 39610 行（约 580 MB）没有任何任务板指着，
# 且每一行都进夜间备份、也都在恢复演练要装回去的库里。
#
# 这条数**不再驱动任何删除**：循环每拍量一次行数、按卷容量与实测每行字节算出「能放多少」、
# 量字节、判「超没超」，把这四个数发到面板上，一行都不删。为什么——「哪些行是残留」本来
# 就不是按年龄能回答的（由任务板决定），而删除不可回读：删掉的字节没有任何地方留痕。
# 更硬的一条：任务板指向的是续跑点，一个根本不删的循环不可能把它弄丢，这比「删除时加一条
# 地板」强。超了就是超了（cogneva_checkpoints_over_capacity=1），由人决定抬声明、退役
# 已结束任务的板、还是不再声明容量。
checkpointStore:
  # 行数上限的部署声明。2026-10-27 活着的那部分是 14842 行，四万行给它留了翻几倍
  # 的空间，同时远低于当时表里的 54452 行，所以眼下这个界卡住的是残物。生效值每拍
  # 按卷容量与实测每行字节重算，这个数在量到之前顶着。
  # tunable:
  # why: Rows the checkpoint store may hold. The sweep measures the table's held rows and bytes on every pass
  # why: and divides the table's share of the declared database volume by the measured bytes per row; a wider
  # why: snapshot buys fewer rows, a larger declared volume buys more, and both follow the next pass without
  # why: a restart. The declared forty thousand is the seed while the table is empty or the volume is not
  # why: declared. The published target carries `source`, and the evaluations counter is what separates
  # why: "nothing to do" from "the sweep stopped".
  # published: owner=crates/cog-storage/src/checkpoint_cap.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-storage/src/checkpoint_cap.rs test=a_beat_whose_target_does_not_move_still_counts beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
  maxRows: 40000

# 提示词留底（gateway_llm_exchange）的**查询窗口**声明。这张表存着发给上游的 prompt 与
# 回来的响应正文，好让「这次到底发了什么、回来什么」事后可答而不必再买一次。它的成本由
# 单次正文大小决定而不是调用次数：2026-10-27 实测 30 天窗口内 9680 行，307 MB（同一天实测）。
#
# 从前这里是一条保留期：过期就删，但**正文在归档里读得回来才删**。那条两段条件是对的，
# 错的是把它放进一个每分钟的循环：它让循环去回答「删掉这一行会不会丢掉唯一一份正文」，
# 而这个问题本身在问一件不该发生的事。现在一行都不删——循环把「多少行 / 多老 / 多少字节 /
# 本进程声明多长」发布成读数，告警拿最老年龄与声明的窗口比；「哪些行没有可读副本」交给
# 备份演练，它本来就逐表走一遍。
llmExchangeRetention:
  # 保留天数。1 以下的值退回 30：保留期归零会让表每趟被清空，读起来像「清理生效」，
  # 而这张表存在的理由——事后核对一次调用——就永远答不了。
  # tunable:
  # why: Days the prompt-and-response archive keeps a body. The sweep measures the archive's bytes and its
  # why: oldest row's age on every pass and divides the table's share of the declared database volume by the
  # why: measured daily write; the declared 30 days is the seed while the archive is empty or the volume is
  # why: not declared. The loop still publishes the days in force as gateway_llm_exchange_keep_seconds, so
  # why: `llm_exchange_retention_behind` judges the archive against the value this pass used rather than a
  # why: constant in the rules file. The target carries `source` on the shared retention face, and the
  # why: evaluations counter shows a pass counted even when the target did not move. A deployment that
  # why: measures but does not retire still expresses that through its seed, not through a pinned day count.
  # published: owner=crates/cog-observability/src/exchange_retention.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-observability/src/exchange_retention.rs test=the_retention_follows_the_measured_daily_write beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
  keepDays: 30

# token 账（gateway_llm_usage）的逐次调用明细保留期。
#
# 这张表每次上游调用一行；每小时的折叠面（cog_llm_usage_rollup）把窗口汇总一次并长期
# 保留。从前这里是一条保留期：超过就按天删明细。那套东西的正确性靠一个两段条件撑着——
# 行过了保留期，**而且**折叠已经覆盖到它——因为折叠是这个账的派生，删掉没被任何窗口汇总
# 过的行，删的不是过期拷贝，是那段花费的唯一一份。那条件本身是对的，但它说明的是：
# 这张表里哪一行可以删，取决于别的表算到哪儿了。那是判断，不是保留期。
#
# 所以现在一行都不删：循环每拍发行数、字节、最老一行多老、折叠的最老窗口，以及
# cogneva_llm_usage_uncovered_rows（折叠没覆盖到的那段还有多少行）与它的最老年龄。
# 这一对不再是「删不动的原因」，而是「这一段花费只能从明细里回答」这个事实。
# 下面这个数是**对外承诺的查询窗口**（花费用量读的那一侧用它当上界），按卷大小与每天
# 实测写入量导出；1 以下退回 30。
llmUsageRetention:
  # tunable:
  # why: Days the token ledger keeps its per-call rows. The sweep measures the ledger's bytes and its oldest
  # why: row's age on every pass and divides the table's share of the declared database volume by the
  # why: measured daily write; the declared 30 days is the seed while the ledger is empty or the volume is
  # why: not declared. Age is not the only cutoff: a row that no hourly fold window summed is the only copy
  # why: of that spend, so the sweep deletes only what is both past the derived age and inside the fold's own
  # why: range, and publishes the rows it cannot touch as cogneva_llm_usage_uncovered_rows. The days in force
  # why: are published as gateway_llm_usage_keep_seconds, and the read side asks for the same value. The
  # why: target carries `source`, and the evaluations counter is the beat evidence.
  # published: owner=crates/cog-observability/src/usage_retention.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-observability/src/usage_retention.rs test=the_retention_follows_the_measured_daily_write beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
  keepDays: 30

# 公网 git 取数的界，两个 worker 共用。
#
# 进化侧与沙盒侧的 init 脚本都有一处「从镜像 seed/更新裸仓」的 clone 与 fetch，
# 走的是同一条集群出网链路、同一套界。界写在这里由两边一起读：分成两份就会在调
# 大一侧时把另一侧留在旧界上，而同一个传输配两条界，短的先杀、长的白等。
# 语义见各模板里的注释——失败当作该镜像不可用、走已有的失败分支，不阻塞启动。
#
# 这里**没有**「一次传输最多跑多少秒」那一项：按跑了多久收尾会在传输还在推进时
# 把它砍掉，已经传过的字节全部作废。下面两条读的是同一条事实——这个传输还在不在
# 动——连接建立本身、以及握手之后每秒还过不过得了一千字节。
workspaceFetch:
  # git 的 TCP 连接超时（秒）：镜像根本不答时别挂在连接上。
  # tunable:
  # why: A property of git's transport protocol, not a size: how long the client waits for the mirror to
  # why: answer the connection at all. The fetch runs in a one-shot init container that dies when it
  # why: finishes, so no process survives to measure connect latency and feed it back -- and the value is
  # why: read at Pod start, before any transfer has happened. Bound to git's own http.connectTimeout, where
  # why: the behaviour is defined.
  connectTimeoutSecs: 15
  # 低于这个速率（字节/秒）持续 lowSpeedSecs 秒即判定传输已死。
  # tunable:
  # why: The transport protocol's own definition of a dead transfer: git aborts when throughput stays below
  # why: this rate for lowSpeedSecs. The evolution and sandbox init containers pass the same pair so one link
  # why: cannot be held to a different notion of "still moving". The bound is "is it moving", not "how long":
  # why: a slow but advancing fetch was measured at fourteen minutes and must not be killed.
  lowSpeedLimitBytesPerSec: 1000
  # tunable:
  # why: The other half of the same protocol threshold: how long throughput may stay under
  # why: lowSpeedLimitBytesPerSec before git gives up. A liveness window, not a duration budget for the
  # why: transfer itself; shared by both init containers so the same transfer is judged the same way on
  # why: either path.
  lowSpeedSecs: 20

# 自进化 worker（特权容器 = 文件系统沙盒边界；接 image-based 滚动更新后可关特权）
evolution:
  enabled: true
  # 自进化循环的轮询间隔：决定「主线动到被发现」的延迟，随部署节奏变，所以走
  # values。一次构建 / 一次验证跑多久不再由墙决定——跑得慢不是停，停才是停，
  # 判据是子进程还发不发进度（cog_core::progress），所以这里没有超时项。
  # 一个进化 worker：它按 Hold 那把构建槽的锁干活，第二个副本争的是同一把锁，
  # 收益是多一份排队而不是多一份吞吐。
  # tunable:
  # why: One evolution worker: a second copy would contend for the same build slot rather than add
  # why: throughput, because the slot is the shared resource. Not a reading.
  replicas: 1
  # tunable:
  # why: How often the self-evolution loop looks for new work. The beat is the larger of the configured seed
  # why: and the round that just ran: a round stacks probes and waits for their outcomes, so the interval the
  # why: loop actually keeps is its own cost. The seed is the floor -- polling the same machinery faster than
  # why: the configured cadence only spends tokens. The pacer publishes its target and evaluation count on
  # why: the same scrape as the loop's other readings.
  # published: owner=crates/cog-reflection/src/plugin.rs file=crates/cog-core/src/pacing.rs metric=TARGET_METRIC label=source cadence=periodic
  # proof: file=crates/cog-reflection/src/plugin.rs test=the_discovery_wait_follows_what_a_round_cost beat=the_discovery_wait_follows_what_a_round_cost evidence=evaluations
  pollIntervalSecs: 300
  # fail-closed 身份门禁：进化 Pod 的 Shell 类工具只接受带 DAG task 身份的
  # 调用（prompt_for_task），无身份的命令直接拒绝，不许以伪造身份进 executor。
  requireToolIdentity: true
  # 分解孤儿巡检只允许一个持有者：多副本同时 fire/resolve 会把告警停留窗口压到
  # 一个 signal-watcher 轮询以内，firing 行可能永远轮不上被读取。主应用为持有者。
  orphanReconcilerEnabled: false
  # git-remote 供给方式：pvc = 集群卷（多节点/生产，空卷自动从 seedUrl 拉 bare 仓库）；
  # hostPath = 单节点开发态直挂宿主 bare 仓库（宿主 <-> Pod 双向同步通道）
  gitRemote:
    mode: pvc
    hostPath: /var/lib/cogneva-data/git-remote
    # 有序镜像列表：第一个是首选上游，其余按序回退。可达性按主机不对称——
    # 实测 github 从集群内间歇黑洞而 gitee 秒级应答——只配一个地址时，该
    # 主机不可达期间的 release tag 刷新会静默失效，裸仓永远停在 seed 时的
    # tag；空卷首次 seed 更会直接失败。两个都列上，任一可达即可用。
    seedUrls:
      - https://github.com/hcipengm/cogneva.git
      - https://gitee.com/hcipengm/cogneva.git
    # tunable:
    # why: The bare git mirror. Its size is a function of the repositories it carries, which the loop does not
    # why: model: it reads the claim's peak from the claim-store walker and raises the declaration to peak x
    # why: 120% (whole GiB) when the peak has outgrown it.
    # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
    # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
    storage: 5Gi
  # tunable:
  # why: The sandbox working area for evolution tasks. The loop walks this claim from inside the process (it
  # why: is mounted) and raises the declaration when the measured peak x 120% exceeds it; task workspaces
  # why: come and go, so the window's peak, not the current reading, is the input.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  sandboxStorage: 20Gi
  # 源码卷：给共享 CARGO_TARGET_DIR 用的（工作树在它之外，可整棵重建而不丢
  # 增量编译缓存）。这是全场最大的一笔，也是唯一一笔"声明写小了会直接卡住构建"
  # 的（缓存被挤掉就每次全量重编）。2026-10-21 按缓存自己的分层读数重定：卷里
  # 只有 `target/`，占用 149GiB，按层是 debug/deps 84.3GB、debug/incremental
  # 60.9GB、release/deps 10.8GB、debug/examples 2.2GB、debug/build 1.0GB，其余
  # 各为百兆级。旧的 72Gi 来自 2026-09 的 57Gi 实测，此后随每次构建涨到现在，
  # 而声明量在 local-path 下不被强制，涨过去之后唯一的信号是
  # `data_volume_over_declared_size` 一直开着——所以这个数按实测峰取，不按
  # 当年写下的值。191GiB 的峰值上限（峰×1.2）也落在它里面：上限与声明量是
  # 一对，缓存可以长到峰值的余量，但不能长到这张卷装不下。
  # tunable:
  # why: Holds the shared CARGO_TARGET_DIR; measured at 149GiB on 2026-11-12 against a 72Gi declaration, and
  # why: the loop raised it to 179Gi (120% of that measured peak). The reading is the walk's peak times 120%, rounded up to whole GiB, and
  # why: it only moves up because the claim cannot shrink.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  sourceStorage: 192Gi
  # 进化 Pod 的 /var/lib/cogneva-data 是另一张卷、另一个写入者，声明必须分开：
  # 同一路径两个进程，各自的卷互不相干，共用一份声明必然对其中一个说谎。
  # 实测 49Gi（几乎全是 raw-logs 的存量轨迹），取 64Gi 留头寸。推导同
  # appData.storage：raw-logs 只降层不删除，存量会随冷层长期停留。
  # tunable:
  # why: The evolution process's own data directory, a different claim from the app's. The loop measures it
  # why: from its own walk (this process mounts it) and raises the declaration to peak x 120%;
  # why: `cogneva_volume_capacity_bytes{claim,state}` publishes both the peak and what the round left
  # why: declared.
  # published: owner=crates/cog-reflection/src/volume_capacity.rs file=crates/cog-reflection/src/volume_capacity.rs metric=BYTES_METRIC label=state cadence=periodic
  # proof: file=crates/cog-reflection/src/volume_capacity.rs test=a_claim_target_follows_the_measured_used_bytes beat=a_beat_whose_target_does_not_move_still_counts evidence=outcome_count
  dataStorage: 64Gi
  # 工作树动态分配：部署器与每个进化任务各自从裸仓库检出 git worktree，
  # 任一方把检出停在哪里都不再影响另一方。共享 CARGO_TARGET_DIR 故意留在
  # 工作树之外（source PVC 的克隆根内），工作树可整棵重建而不丢增量编译缓存。
  workspaces:
    root: /opt/cogneva/sandbox/workspaces
    targetDir: /opt/cogneva/sandbox/src/target
    # 临时工作树存活上限；要容得下一整轮演进，进程号不足以判断任务是否还活着。
    # tunable:
    # why: How long an ephemeral worktree may live. At every maintenance beat (the deployer's cycle, each poll
    # why: interval) the manager measures how many trees arrived over the last week, the bytes of the average
    # why: tree, and the free bytes of the volume they sit on, and takes half the time those arrivals need to
    # why: fill the volume (`ttl_for_half_turnover`). The result is floored at the longest completed evolution
    # why: round so a live tree is never collected mid-round; reclaimed trees do not feed that floor, or the
    # why: loop would chase its own output. The declared 7 days is the seed when something cannot be measured
    # why: -- no arrivals yet, no tree, a volume that will not answer -- and a zero seed turns derivation off.
    # why: The published target carries `source=derived` when a measurement was used and `source=seed` when it
    # why: was not; the evaluations counter shows the beat keeps running.
    # published: owner=crates/cog-reflection/src/workspace.rs file=crates/cog-core/src/retention.rs metric=TARGET_METRIC label=source cadence=periodic
    # proof: file=crates/cog-reflection/src/workspace.rs test=the_ephemeral_ttl_follows_the_measured_volume_and_arrivals beat=a_beat_whose_target_does_not_move_still_counts evidence=evaluations
    ephemeralTtlSecs: 21600
    # 身份轮换后遗留的 `evol/<旧id>` 分支回收判据：已并入 main 的立即回收，
