# 这个镜像实际会发出哪些序列、认哪些旗标——从镜像自己身上量的。
#
# 一张读数表点名一个序列，部署清单点名一个旗标；这两件事之间如果没有别的
# 东西连起来，清单就可能指向一个不存在的旗标（边车启动即 "unknown long flag"
# 退出，而它与数据库同 Pod：库还活着，Service 却没了端点），或者指向一个没有
# 生产者的序列（面板永远空白，读起来和「一切正常」一样）。这份文件就是那条
# 连线：读数的序列必须在下面的 series 里，清单的旗标必须在下面的 collector_flags
# 里，而 image 这一行把它钉到具体版本上——换 tag 必须重新量一次。
#
# 量法是这条命令，不要手工抄：
#
#   bash deploy/scripts/measure-postgres-exporter-surface.sh          # 量完写回
#   bash deploy/scripts/measure-postgres-exporter-surface.sh --check  # 只判不写
#
# 序列从**已经在跑的边车**上抓：口令已经在它的 env 里，脚本一个凭证都不碰；
# 旗标用同一个镜像跑一次 `--help`（不连库，也不带凭证）。`--check` 在两张名单
# 与镜像此刻发出的东西不一致时退出 1，要紧的是「名单里有、镜像不发」那一格：
# 过期的条目会让「读数指向的序列必须有生产者」那条门去担保一个不存在的序列。
#
# 下面 image: 之后的每一行都是量出来的，改它请改量的那一步。image 这一行必须与
# values.yaml 的 exporterImage 相同，`reading_series_have_a_producer` 判这一条。
#
# 抓取时**没有**传任何旗标：下面这些序列就是这个镜像在默认集合下发出的，
# 所以部署清单不需要 args。带 `*` 的条目是**声明**：那一族的成员跟着库里的内容走
# （`pg_settings_` 一条 GUC 一个名字，约 300 个），逐条列会让这份名单按宿主漂移。
# 量的时候照这份声明折叠；新冒出来的族逐条列出，看得见才有人判它该不该折。
image: prometheuscommunity/postgres-exporter:v0.15.0

collector_flags:
  - --collector.database
  - --collector.database_wraparound
  - --collector.locks
  - --collector.long_running_transactions
  - --collector.postmaster
  - --collector.process_idle
  - --collector.replication
  - --collector.replication_slot
  - --collector.stat_activity_autovacuum
  - --collector.stat_bgwriter
  - --collector.stat_database
  - --collector.stat_statements
  - --collector.stat_user_tables
  - --collector.stat_wal_receiver
  - --collector.statio_user_indexes
  - --collector.statio_user_tables
  - --collector.wal
  - --collector.xlog_location

series:
  - pg_database_size_bytes
  - pg_exporter_last_scrape_duration_seconds
  - pg_exporter_last_scrape_error
  - pg_exporter_scrapes_total
  - pg_locks_count
  - pg_replication_is_replica
  - pg_replication_lag_seconds
  - pg_scrape_collector_duration_seconds
  - pg_scrape_collector_success
  - pg_settings_*
  - pg_stat_activity_count
  - pg_stat_activity_max_tx_duration
  - pg_stat_archiver_archived_count
  - pg_stat_archiver_failed_count
  - pg_stat_archiver_last_archive_age
  - pg_stat_bgwriter_buffers_alloc_total
  - pg_stat_bgwriter_buffers_backend_fsync_total
  - pg_stat_bgwriter_buffers_backend_total
  - pg_stat_bgwriter_buffers_checkpoint_total
  - pg_stat_bgwriter_buffers_clean_total
  - pg_stat_bgwriter_checkpoint_sync_time_total
  - pg_stat_bgwriter_checkpoint_write_time_total
  - pg_stat_bgwriter_checkpoints_req_total
  - pg_stat_bgwriter_checkpoints_timed_total
  - pg_stat_bgwriter_maxwritten_clean_total
  - pg_stat_bgwriter_stats_reset_total
  - pg_stat_database_blk_read_time
  - pg_stat_database_blk_write_time
  - pg_stat_database_blks_hit
  - pg_stat_database_blks_read
  - pg_stat_database_conflicts
  - pg_stat_database_conflicts_confl_active_logicalslot
  - pg_stat_database_conflicts_confl_bufferpin
  - pg_stat_database_conflicts_confl_deadlock
  - pg_stat_database_conflicts_confl_lock
  - pg_stat_database_conflicts_confl_snapshot
  - pg_stat_database_conflicts_confl_tablespace
  - pg_stat_database_deadlocks
  - pg_stat_database_numbackends
  - pg_stat_database_stats_reset
  - pg_stat_database_temp_bytes
  - pg_stat_database_temp_files
  - pg_stat_database_tup_deleted
  - pg_stat_database_tup_fetched
  - pg_stat_database_tup_inserted
  - pg_stat_database_tup_returned
  - pg_stat_database_tup_updated
  - pg_stat_database_xact_commit
  - pg_stat_database_xact_rollback
  - pg_stat_user_tables_analyze_count
  - pg_stat_user_tables_autoanalyze_count
  - pg_stat_user_tables_autovacuum_count
  - pg_stat_user_tables_idx_scan
  - pg_stat_user_tables_idx_tup_fetch
  - pg_stat_user_tables_last_analyze
  - pg_stat_user_tables_last_autoanalyze
  - pg_stat_user_tables_last_autovacuum
  - pg_stat_user_tables_last_vacuum
  - pg_stat_user_tables_n_dead_tup
  - pg_stat_user_tables_n_live_tup
  - pg_stat_user_tables_n_mod_since_analyze
  - pg_stat_user_tables_n_tup_del
  - pg_stat_user_tables_n_tup_hot_upd
  - pg_stat_user_tables_n_tup_ins
  - pg_stat_user_tables_n_tup_upd
  - pg_stat_user_tables_seq_scan
