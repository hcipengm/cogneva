# 平台在运行时建出来的 Pod：chart 与 deploy/ 下任何清单都不建它们，创建现场也不在本仓，
# 所以判控制面可达性的那道门读不到它们的实际形状。能读的只有「它带着哪些标签」这一句。
#
# 为什么非要写出来：NetworkPolicy 的对端选择器必须选中至少一个 Pod，选不中时策略照样
# 建得成，只是那条放行谁都不匹配——被它挡住或放开的通道只剩连接超时，与「对端本来就
# 不响应」同形。运行时 Pod 的标签于是成了策略与创建者之间的一份约定；约定写得出来，
# 门才判得到，写不出来就只能把那条策略连同它的门一起放宽。
#
# 只登记标签：端口、卷、探针由创建者决定，本仓没有可比对象，门也不拿这份声明去判它们。
pods:
  # 评测台的 Pod，由宿主上的评测臂拉起（`cogneva eval-table`），不在 chart 里。
  # HLE 那一列的工具面含 `web_fetch`，它要够到渲染后端，`crawl4ai-ingress` 按这个标签放行。
  - name: eval-table
    namespace: cogneva
    labels:
      app: eval-table
