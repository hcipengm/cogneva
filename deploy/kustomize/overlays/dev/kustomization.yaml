# 开发环境：单副本 + 本地镜像 Never 拉取策略
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cogneva
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: cogneva
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: localhost/cogneva
    newTag: dev
