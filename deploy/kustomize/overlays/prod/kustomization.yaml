# 生产环境：3 副本 + 固定发布镜像 tag（发布时由 CI 替换）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cogneva
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: cogneva
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
images:
  - name: localhost/cogneva
    newTag: "0.1.39"
