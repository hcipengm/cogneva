# Cogneva 生产部署参考（K8s 多节点 + 外部镜像仓库 + 持久化存储）。
# 与 deploy/k3s/deployment.yaml 的差异：数据卷从 emptyDir 换 Longhorn PVC，
# 附带 Service（配合 ingress-nginx.yaml 暴露 api.cogneva.io）。
# 镜像：默认引用分发器供给的 localhost/cogneva:local；使用外部仓库时
# 设置为 COGNEVA_IMAGE_REGISTRY 并把 image 改为 <registry>/cogneva:<tag>。
#
# 凭证与安全模型（与 k3s / Helm 路径一致）：
#   - Secret 不由本清单 apply：先运行 bash deploy/k3s/init-secrets.sh（脚本通用，
#     仅依赖 kubectl，自动随机生成 pg/redis/webhook-internal 内部密钥并创建
#     cogneva-secrets，幂等、不覆盖已有值）；生产也可用外部 Secret 管理器注入
#     同名键。参考结构见 deploy/k3s/examples/secret.yaml。
#   - 主应用零带外凭证：LLM 与 GitHub/Gitee token 只注入安全网关，本 Deployment
#     不挂任何 OPENAI/ANTHROPIC/平台 token，经网关代理访问外部 API 与 git。
#   - 本目录是核心工作负载 + 生产基础设施的参考骨架；安全网关、进化沙盒等完整
#     拓扑请用 Helm chart（deploy/helm/cogneva）。
---
apiVersion: v1
kind: Namespace
metadata:
  name: cogneva
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-data-pvc
  namespace: cogneva
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            # 内部实例密钥（init-secrets.sh 安装时自动随机生成）。
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            # LLM 与代码平台凭证只注入安全网关，主应用零持有、经网关代理访问。
            # 需配合安全网关（本参考骨架未含，完整拓扑见 deploy/helm/cogneva）。
            - name: COGNEVA_GITHUB_API_BASE
              value: "http://cogneva-security-gateway:8081/github"
            - name: COGNEVA_GITEE_API_BASE
              value: "http://cogneva-security-gateway:8081/gitee"
            - name: COGNEVA_GIT_PROXY_BASE
              value: "http://cogneva-security-gateway:8081/git"
            # webhook 验签在网关完成，本进程只验网关转发的内部 HMAC。
            - name: COGNEVA_WEBHOOK_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: webhook-internal
                  optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cogneva-data-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-service
  namespace: cogneva
spec:
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
