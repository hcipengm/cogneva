# Cogneva 生产部署参考（K8s 多节点 + 外部镜像仓库 + 持久化存储）。
# 与 deploy/k3s/deployment.yaml 的差异：数据卷从 emptyDir 换 Longhorn PVC，
# 附带 Service（配合 ingress-nginx.yaml 暴露 api.cogneva.io）。
# 镜像：默认引用分发器供给的 localhost/cogneva:local；使用外部仓库时
# 设置为 COGNEVA_IMAGE_REGISTRY 并把 image 改为 <registry>/cogneva:<tag>。
---
apiVersion: v1
kind: Namespace
metadata:
  name: cogneva
---
# Secret 骨架：部署前用真实值替换（或交给 bootstrap 的 kubectl patch 注入）。
apiVersion: v1
kind: Secret
metadata:
  name: cogneva-secrets
  namespace: cogneva
type: Opaque
stringData:
  pg-password: "CHANGE_ME"
  db-password: "CHANGE_ME"
  openai-api-key: ""
  anthropic-api-key: ""
  github-token: ""
  github-webhook-secret: ""
  llm-api-key: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cogneva-data-pvc
  namespace: cogneva
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogneva
  namespace: cogneva
  labels:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cogneva
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cogneva
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: cogneva
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cogneva
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cogneva
          image: localhost/cogneva:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cogneva-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: anthropic-api-key
                  optional: true
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: pg-password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: db-password
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: llm-api-key
                  optional: true
            - name: COGNEVA_DATABASE_URL
              value: "postgres://cog_user:$(PG_PASSWORD)@postgres.cogneva.svc.cluster.local:5432/cogneva"
            - name: COGNEVA_GITHUB_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-token
                  optional: true
            - name: COGNEVA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: github-webhook-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sf-data
            - name: cogneva-json
              mountPath: /etc/cogneva
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cogneva-data-pvc
        - name: cogneva-json
          configMap:
            name: cogneva-json
            optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: cogneva-service
  namespace: cogneva
spec:
  selector:
    app.kubernetes.io/name: cogneva
    app.kubernetes.io/component: gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
