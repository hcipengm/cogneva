apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cogneva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            # 凭证统一使用 cogneva-secrets/redis-password（init-secrets.sh 自动随机）。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogneva-secrets
                  key: redis-password
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - "$(REDIS_PASSWORD)"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "$(REDIS_PASSWORD)"
                - --no-auth-warning
                - ping
            initialDelaySeconds: 5
            period: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cogneva
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
